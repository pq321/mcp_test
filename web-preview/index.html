"path":["马原","第三章 唯物史观","考点4：社会进步与社会形态更替"],"type":"group","title":"社会进步与社会形态更替","question":"围绕社会进步与社会形态更替，社会进步与人的发展、社会形态的内涵、社会形态更替的统一性和多样性、社会形态更替的必然性和人们的历史选择性分别是什么？","answer":"1.社会进步与人的发展：（1）社会进步是对社会前进发展的总概括，主要表现在两个方面：①社会形态从低级到高级的发展；②同一社会形态内部的发展；（2）社会进步促进人的发展：①人的发展是一个社会历史过程，既包括人类整体的发展，也包括人类个体的发展；②人的发展指人的体力、智力、个性和交往能力等的发展，其中最根本的是人的自由程度的提高；③人的发展程度构成了社会进步的重要标志；④人的发展从低级到高级依概括为三个阶段：人的依赖关系占统治地位的阶段（资本主义以前的社会）；以物的依赖关系为基础的人的独立性的阶段（资本主义社会）；自由个性的阶段（共产主义社会）；（3）在以私有制为基础的社会，人的自由和发展问题不可能得到彻底的解决；只有在共产主义社会，人才能真正得到自由而全面的发展。\n\n2.社会形态的内涵：（1）是关于社会运动的具体形式、发展阶段和不同质态的范畴；（2）是同生产力发展一定阶段相适应的经济基础和上层建筑的统一体：①经济基础是社会的“骨骼系统”；②上层建筑是社会的“血肉系统”；（3）包括：经济形态（是社会形态的基础）、政治形态、意识形态，是三者具体的、历史的统一。\n\n3.社会形态更替的统一性和多样性：（1）统一性：①五种社会形态依次更替，由低级到高级：原始社会→奴隶社会→封建社会→资本主义社会→共产主义社会；②五种社会形态的依次更替，是社会历史运动的一般过程，表现了社会形态更替的统一性；③社会形态运动由低级到高级、由简单到复杂的过程；（2）多样性：①有些国家在发展中经历了几种社会形态依次更替的典型过程；②有些国家在发展中超越了一个甚至几个社会形态而跨越式地向前发展；③有些国家在历史发展的一定阶段上社会形态性质不够典型，甚至多种社会形态特征交叉渗透；④有些国家在一定时期由较为落后的社会形态快速跃进为先进的社会形态，而有些国家的社会形态则长期陷于停滞状态；⑤即使是同一种社会形态，在不同国家也会呈现出不同特点。\n\n4.社会形态更替的必然性和人们的历史选择性：（1）社会更替的必然性：①是指社会形态依次更替的过程和规律是客观的，其发展的基本趋势是确定不移的；②社会形态更替归根结底是社会基本矛盾运动的结果，其中，生产力的发展具有最终的决定意义；③生产力与生产关系矛盾运动的规律性，从根本上规定了社会形态更替的必然性；（2）人们的历史选择性：①规律的客观性并不否定人们历史活动的能动性，并不排斥人们在遵循社会发展规律的基础上，对于某种社会形态的历史选择性；②人们的历史选择：第一，社会发展的必然性为人们历史选择提供了基础、范围和可能性空间；第二，社会形态更替的过程也是一个主观能动性与客观规律性相统一的过程；第三，人们的历史选择性归根结底是人民群众的选择性。","notes":"","source":"苏一《27命题点高清图谱》印刷第19页；按原分支整理","source_pages":[19],"source_pdf_pages":[24],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p024_n023","p024_n024","p024_n025","p024_n026","p024_n027","p024_n028","p024_n029","p024_n030","p024_n031","p024_n032","p024_n033","p024_n034","p024_n035","p024_n036","p024_n037","p024_n038","p024_n039","p024_n040","p024_n041","p024_n042","p024_n043","p024_n044","p024_n045","p024_n046","p024_n047","p024_n048","p024_n049","p024_n050","p024_n051","p024_n052","p024_n053","p024_n054","p024_n055"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p024_a001","kind":"政治素养","text":"1.物质交往是精神交往的基础和根源\n2.精神交往是物质交往的产物，渗透于物质交往之中","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p024_a002","kind":"政治素养","text":"1.社会的发展和进步集中表现在社会形态的发展\n2.人类社会就是这样由低级到高级向前发展，同时也不断实现着人的发展，并最终实现人类解放","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p024_a003","kind":"政治素养","text":"1.社会形态更替是统一性和多样性的统一，一般过程和道路与具体道路相统一，社会形态发展的纵向统一性和横向多样性统一\n2.社会形态的形成与发展都要通过社会形态的连续运动","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p024_a004","kind":"政治素养","text":"1.社会形态形成和发展具有多样性，可实现跨越式发展，但仍尊重总方向，跨越的限度是受总体历史进程制约的\n2.社会形态的更替过程中，人是主体：自觉的、能动的，有人的参与；自然界自然的，没有人的参与\n3.自然界和人类社会：都是于物质世界，都是有客观规律，不以人的意志为转移\n易错点：社会形态的发展是自发的过程（×）；社会形态的发展与自然界的发展完全一样（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":62},{"id":"suyi-marx-p020-n002-g01","revision":1,"path":["马原","第三章 唯物史观","考点5：文明及其多样性"],"type":"group","title":"文明及其多样性","question":"围绕文明及其多样性，文明及其演进、文明的多样性分别是什么？","answer":"1.文明及其演进：（1）文明是人类创造的所有物质成果、精神成果和制度成果的总和，反映了人类社会实践活动的积极成果；（2）人类文明发展进步的一般规律：①人类社会发展的过程也是人类文明发展进步的过程；②社会形态的更替，从一定意义上说也是文明形态的更替。\n\n2.文明的多样性：（1）人类文明具有多样性：①每一种文明都是在特定的自然环境、历史背景、民族传统中生长起来的；②体现着独特的生产、生活、交往方式；③代表着一方文化的沃土和绿洲；④都是人类文明的重要组成部分；（2）世界各国要尊重和保护文明多样性，推动不同文明交流对话、和平共处、和谐共生；①以文明交流超越文明隔阂；②以文明互鉴超越文明冲突；③以文明共存超越文明优越。","notes":"","source":"苏一《27命题点高清图谱》印刷第20页；按原分支整理","source_pages":[20],"source_pdf_pages":[25],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p025_n003","p025_n004","p025_n005","p025_n006","p025_n007","p025_n008","p025_n009","p025_n010","p025_n011","p025_n012","p025_n013","p025_n014","p025_n015"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p025_a001","kind":"政治素养","text":"1.是社会发展的根本内容\n2.是衡量社会进步的根本尺度\n3.是人类社会发展和进步的最终决定力量","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p025_a002","kind":"政治素养","text":"改革是一定社会在原有基本制度基础上的自我调整和完善，不是社会根本制度的变化","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":63},{"id":"suyi-marx-p020-n016-g01","revision":1,"path":["马原","第三章 唯物史观","考点6：社会基本矛盾在历史发展中的作用"],"type":"group","title":"社会基本矛盾在历史发展中的作用","question":"社会基本矛盾在历史发展中的作用体现在哪些方面？相关定位和适用条件是什么？","answer":"1.社会基本矛盾是历史发展的根本动力：生产力和生产关系、经济基础和上层建筑的矛盾是社会基本矛盾\n\n2.原因：（1）贯穿人类社会发展过程的始终，规定了社会发展过程中各种社会形态、社会制度的基本性质；（2）制约着社会其他矛盾的存在和发展，决定社会历史的一般过程，推动社会向前发展；（3）规定并反映了社会基本结构的性质和基本面貌，涉及社会生活的各个领域，囊括社会结构的主要方面。\n\n3.作用：（1）生产力是社会基本矛盾运动中最基本的动力因素，是人类社会发展和进步的最终决定力量；（2）社会基本矛盾特别是生产力和生产关系的矛盾（更为基本的矛盾），决定着社会中其他矛盾的存在和发展；（3）社会基本矛盾具有不同的表现形式和解决方式，从根本上影响和促进社会形态的变化和发展。\n\n4.社会基本矛盾和主要矛盾的关系：（1）社会基本矛盾是其他一切社会矛盾的根源，规定和制约着社会主要矛盾的存在和发展；（2）社会主要矛盾是社会基本矛盾的具体体现；（3）社会主要矛盾不是一成不变的，它在一定的条件下会发生转化（如我国的社会主要矛盾）。","notes":"","source":"苏一《27命题点高清图谱》印刷第20页；按原分支整理","source_pages":[20],"source_pdf_pages":[25],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p025_n017","p025_n018","p025_n019","p025_n020","p025_n021","p025_n022","p025_n023","p025_n024","p025_n025","p025_n026","p025_n027","p025_n028","p025_n029"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p025_a001","kind":"政治素养","text":"1.是社会发展的根本内容\n2.是衡量社会进步的根本尺度\n3.是人类社会发展和进步的最终决定力量","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p025_a002","kind":"政治素养","text":"改革是一定社会在原有基本制度基础上的自我调整和完善，不是社会根本制度的变化","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":64},{"id":"suyi-marx-p020-n030-g01","revision":1,"path":["马原","第三章 唯物史观","考点7：阶级斗争、社会革命在社会发展中的作用"],"type":"group","title":"阶级斗争、社会革命在社会发展中的作用","question":"阶级斗争、社会革命在社会发展中的作用体现在哪些方面？相关定位和适用条件是什么？","answer":"1.阶级斗争是阶级社会发展的直接动力：阶级产生：（1）社会生产有了一定发展阶段所必然产生的特定的经济集团，是一种历史范畴；（2）社会发展到一定阶段，生产有所发展而又发展不足的产物；生产资料占有关系不同，是划分阶级的基础；作用：（1）阶级斗争对社会发展的推动作用突出地表现在社会形态的更替中；（2）阶级斗争及其作用受到一定社会历史条件的制约。\n\n2.阶级社会中革命对社会发展的作用：（1）实质：革命阶级推翻反动阶级统治，用新的社会制度代替旧的社会制度；（2）革命的根本问题是国家政权问题。国家政权从反动阶级手里转移到革命阶级手里，是实现社会形态变革的重要的、基本的标志；（3）革命根源于社会基本矛盾的尖锐化，革命是阶级斗争的最高形式；（4）作用：①社会革命是实现社会形态更替的重要手段和决定性环节；②社会革命能充分发挥人民群众创造历史的积极性和伟大作用；（5）坚持阶级分析方法，就是运用马克思主义的阶级和阶级斗争观点去观察和认识阶级社会的社会历史现象。\n\n3.改革在社会发展中的作用：（1）改革是一定社会为了缓解社会基本矛盾而对生产关系和上层建筑进行的深刻改变和革新：①是社会制度的自我调整和完善；②是同一种社会形态发展过程中的量变和部分质变；③是推动社会发展的又一重要动力；（2）改革是解决社会基本矛盾、促进生产力发展、推动社会进步的有效途径和手段。","notes":"","source":"苏一《27命题点高清图谱》印刷第20页；按原分支整理","source_pages":[20],"source_pdf_pages":[25],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p025_n031","p025_n032","p025_n033","p025_n034","p025_n035","p025_n036","p025_n037","p025_n038","p025_n039","p025_n040","p025_n041","p025_n042","p025_n043","p025_n044","p025_n045","p025_n046","p025_n047","p025_n048","p025_n049"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p025_a001","kind":"政治素养","text":"1.是社会发展的根本内容\n2.是衡量社会进步的根本尺度\n3.是人类社会发展和进步的最终决定力量","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p025_a002","kind":"政治素养","text":"改革是一定社会在原有基本制度基础上的自我调整和完善，不是社会根本制度的变化","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":65},{"id":"suyi-marx-p021-n002-g01","revision":1,"path":["马原","第三章 唯物史观","考点8：科学技术在社会发展中的作用"],"type":"group","title":"科学技术在社会发展中的作用","question":"科学技术在社会发展中的作用体现在哪些方面？相关定位和适用条件是什么？","answer":"1.科学技术作为先进生产力的重要标志，是推动社会文明进步的重要力量\n\n2.科技革命是推动经济和社会发展的强大杠杆：（1）对生产方式产生了深刻影响：①改变了社会生产力的构成要素；②改变了人们的劳动形式；③改变了社会经济结构；（2）对生活方式产生了巨大影响；（3）促进了思维方式的变革。\n\n3.正确把握科学技术的社会作用：（1）科学技术的作用：①既受到一定客观条件如社会制度、利益关系的影响；②也受到一定主观条件如人们的观念和认识水平的影响；（2）科学技术在运用于社会时所遇到的问题：①对自然规律和人与自然关系认识不够，或缺乏对科技消极后果的控制手段；②与一定社会制度有关。在资本主义条件下，科学技术常被资产阶级用作剥削和压迫人民的工具，并非都能使人摆脱贫困、促进人的身心健康发展，因而，科学技术有时表现为“异己的力量”；（3）如何正确把握：①首要的就是有合理的社会制度保障科学技术的正确运用；②始终坚持科学技术为人类社会健康发展服务。","notes":"","source":"苏一《27命题点高清图谱》印刷第21页；按原分支整理","source_pages":[21],"source_pdf_pages":[26],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p026_n003","p026_n004","p026_n005","p026_n006","p026_n007","p026_n008","p026_n009","p026_n010","p026_n011","p026_n012","p026_n013","p026_n014","p026_n015","p026_n016","p026_n017","p026_n018","p026_n019","p026_n020"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p026_a001","kind":"易错点","text":"1.科技革命是摆脱社会危机的根本出路（×，根本出路是解决社会基本矛盾，而不是科技革命）\n2.科学革命是社会发展的根本动力（×，社会基本矛盾是历史发展的根本动力）\n3.科学技术是一切社会变革中的自主动力（×，自主性本身不是）\n4.科学技术是社会存在和发展的基础及决定力量（×，物质生产方式是社会存在和发展的基础和决定力量）\n5.科学技术是社会形态更替的根本标志（×，社会形态更替的根本标志是社会制度的改变）\n6.“爱智慧地使用人工智能工具”意味着技术进步要以维护人民的根本利益为最高标准（2024-17）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a002","kind":"政治素养","text":"文化蕴含着人类的思想智慧、价值追求和审美情趣，是一个国家、一个民族的灵魂。文化兴国运兴，文化强民族强；推动文化繁荣兴盛，要坚持文化自信，促进文化交流互鉴，为人类文明进步贡献力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a003","kind":"政治素养","text":"英雄史观认为社会意识决定社会存在，群众史观认为社会存在决定社会意识。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a004","kind":"易错点","text":"1.正确认识历史发展方向是社会历史存在和发展的前提（×）；2.人的本质是单个人所固有的抽象物（×）；3.人的本质属性是所有人中抽象出来的共同本质（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a005","kind":"易错点","text":"历史的创造者既包括推动社会历史向前发展的力量，也包括反作用的力量（×）。人们自己创造自己的历史≠人人/每个人、创造自己历史；人民群众是历史创造的主体。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":66},{"id":"suyi-marx-p021-n021-g01","revision":1,"path":["马原","第三章 唯物史观","考点9：文化在社会发展中的作用"],"type":"group","title":"文化在社会发展中的作用","question":"文化在社会发展中的作用体现在哪些方面？相关定位和适用条件是什么？","answer":"1.文化是推动社会发展的重要力量\n\n2.文化对社会发展有着巨大影响（积极作用）：（1）文化为社会发展提供思想指引；（2）文化为社会发展提供精神动力；（3）文化为社会发展提供凝聚力量。","notes":"","source":"苏一《27命题点高清图谱》印刷第21页；按原分支整理","source_pages":[21],"source_pdf_pages":[26],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p026_n022","p026_n023","p026_n024","p026_n025","p026_n026"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p026_a001","kind":"易错点","text":"1.科技革命是摆脱社会危机的根本出路（×，根本出路是解决社会基本矛盾，而不是科技革命）\n2.科学革命是社会发展的根本动力（×，社会基本矛盾是历史发展的根本动力）\n3.科学技术是一切社会变革中的自主动力（×，自主性本身不是）\n4.科学技术是社会存在和发展的基础及决定力量（×，物质生产方式是社会存在和发展的基础和决定力量）\n5.科学技术是社会形态更替的根本标志（×，社会形态更替的根本标志是社会制度的改变）\n6.“爱智慧地使用人工智能工具”意味着技术进步要以维护人民的根本利益为最高标准（2024-17）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a002","kind":"政治素养","text":"文化蕴含着人类的思想智慧、价值追求和审美情趣，是一个国家、一个民族的灵魂。文化兴国运兴，文化强民族强；推动文化繁荣兴盛，要坚持文化自信，促进文化交流互鉴，为人类文明进步贡献力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a003","kind":"政治素养","text":"英雄史观认为社会意识决定社会存在，群众史观认为社会存在决定社会意识。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a004","kind":"易错点","text":"1.正确认识历史发展方向是社会历史存在和发展的前提（×）；2.人的本质是单个人所固有的抽象物（×）；3.人的本质属性是所有人中抽象出来的共同本质（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a005","kind":"易错点","text":"历史的创造者既包括推动社会历史向前发展的力量，也包括反作用的力量（×）。人们自己创造自己的历史≠人人/每个人、创造自己历史；人民群众是历史创造的主体。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":67},{"id":"suyi-marx-p021-n027-g01","revision":1,"path":["马原","第三章 唯物史观","考点10：两种历史观在历史创造者问题上的对立"],"type":"group","title":"两种历史观在历史创造者问题上的对立","question":"两种历史观在历史创造者问题上的对立有哪些阶段、重要节点及其意义？","answer":"1.英雄史观（唯心史观）：社会意识决定社会存在；（1）否认物质资料生产方式是社会发展的决定力量；（2）抹杀人民群众的历史作用，宣扬少数英雄人物创造历史。\n\n2.群众史观（唯物史观）：社会存在决定社会意识；主张人民群众创造历史。","notes":"","source":"苏一《27命题点高清图谱》印刷第21页；按原分支整理","source_pages":[21],"source_pdf_pages":[26],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p026_n028","p026_n029","p026_n030","p026_n031","p026_n032","p026_n033","p026_n034"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p026_a001","kind":"易错点","text":"1.科技革命是摆脱社会危机的根本出路（×，根本出路是解决社会基本矛盾，而不是科技革命）\n2.科学革命是社会发展的根本动力（×，社会基本矛盾是历史发展的根本动力）\n3.科学技术是一切社会变革中的自主动力（×，自主性本身不是）\n4.科学技术是社会存在和发展的基础及决定力量（×，物质生产方式是社会存在和发展的基础和决定力量）\n5.科学技术是社会形态更替的根本标志（×，社会形态更替的根本标志是社会制度的改变）\n6.“爱智慧地使用人工智能工具”意味着技术进步要以维护人民的根本利益为最高标准（2024-17）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a002","kind":"政治素养","text":"文化蕴含着人类的思想智慧、价值追求和审美情趣，是一个国家、一个民族的灵魂。文化兴国运兴，文化强民族强；推动文化繁荣兴盛，要坚持文化自信，促进文化交流互鉴，为人类文明进步贡献力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a003","kind":"政治素养","text":"英雄史观认为社会意识决定社会存在，群众史观认为社会存在决定社会意识。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a004","kind":"易错点","text":"1.正确认识历史发展方向是社会历史存在和发展的前提（×）；2.人的本质是单个人所固有的抽象物（×）；3.人的本质属性是所有人中抽象出来的共同本质（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a005","kind":"易错点","text":"历史的创造者既包括推动社会历史向前发展的力量，也包括反作用的力量（×）。人们自己创造自己的历史≠人人/每个人、创造自己历史；人民群众是历史创造的主体。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":68},{"id":"suyi-marx-p021-n035-g01","revision":1,"path":["马原","第三章 唯物史观","考点11：唯物史观考察历史创造者的原则"],"type":"group","title":"唯物史观考察历史创造者的原则","question":"唯物史观考察历史创造者的原则有哪些阶段、重要节点及其意义？","answer":"1.立足于现实的人及其本质来把握历史的创造者：（1）现实的人：置于自身需要和社会实践活动、处于一定社会关系中、具有能动性的人；现实的人及其活动是社会历史存在和发展的前提；（2）人的本质——一切社会关系的总和：①人的本质属性是社会属性，而不是自然属性；②人的本质属性表现在各种社会关系中；③人的本质是变化发展的，而不是永恒不变的。\n\n2.立足于整体的社会历史过程来探究谁是历史的创造者：（1）个人历史：人人（每一个人）创造自己的历史；（2）整体的社会历史：①历史是无数个追求自己目的的人的活动的合力；②是一定的群体（集体、阶级、民族乃至全人类）的认识活动和实践活动及其产物的演进过程；③是以一定的物质生产方式为基础的社会形成和演进过程。\n\n3.从社会历史发展的必然性入手来考察谁创造历史的创造者：（1）社会历史的变化发展是社会领域中各种力量交互作用的结果；（2）只有符合经济运动的必然性乃至整个社会历史发展的必然性、推动和促进社会历史向前发展的力量的人才是历史的创造者。\n\n4.从人与历史关系的不同层次上考察谁是历史的创造者：（1）三个层次：人类与历史、群体与历史、个体与历史；（2）唯物史观的观点：坚持“人们自己创造自己的历史”的观点，同唯心史观英雄史观划清界限；（3）历史作用：①个体（非决定力量、非主导力量）；②群体（决定力量、主导力量）。","notes":"","source":"苏一《27命题点高清图谱》印刷第21页；按原分支整理","source_pages":[21],"source_pdf_pages":[26],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p026_n036","p026_n037","p026_n038","p026_n039","p026_n040","p026_n041","p026_n042","p026_n043","p026_n044","p026_n045","p026_n046","p026_n047","p026_n048","p026_n049","p026_n050","p026_n051","p026_n052","p026_n053","p026_n054"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p026_a001","kind":"易错点","text":"1.科技革命是摆脱社会危机的根本出路（×，根本出路是解决社会基本矛盾，而不是科技革命）\n2.科学革命是社会发展的根本动力（×，社会基本矛盾是历史发展的根本动力）\n3.科学技术是一切社会变革中的自主动力（×，自主性本身不是）\n4.科学技术是社会存在和发展的基础及决定力量（×，物质生产方式是社会存在和发展的基础和决定力量）\n5.科学技术是社会形态更替的根本标志（×，社会形态更替的根本标志是社会制度的改变）\n6.“爱智慧地使用人工智能工具”意味着技术进步要以维护人民的根本利益为最高标准（2024-17）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a002","kind":"政治素养","text":"文化蕴含着人类的思想智慧、价值追求和审美情趣，是一个国家、一个民族的灵魂。文化兴国运兴，文化强民族强；推动文化繁荣兴盛，要坚持文化自信，促进文化交流互鉴，为人类文明进步贡献力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a003","kind":"政治素养","text":"英雄史观认为社会意识决定社会存在，群众史观认为社会存在决定社会意识。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a004","kind":"易错点","text":"1.正确认识历史发展方向是社会历史存在和发展的前提（×）；2.人的本质是单个人所固有的抽象物（×）；3.人的本质属性是所有人中抽象出来的共同本质（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p026_a005","kind":"易错点","text":"历史的创造者既包括推动社会历史向前发展的力量，也包括反作用的力量（×）。人们自己创造自己的历史≠人人/每个人、创造自己历史；人民群众是历史创造的主体。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":69},{"id":"suyi-marx-p022-n002-g01","revision":1,"path":["马原","第三章 唯物史观","考点12：人民群众在创造历史过程中的决定作用"],"type":"group","title":"人民群众在创造历史过程中的决定作用","question":"人民群众在创造历史过程中的决定作用体现在哪些方面？相关定位和适用条件是什么？","answer":"1.人民群众的含义：人民群众是社会历史的主体，是历史的创造者；（1）从质上看：人民群众是指一切对社会历史发展起推动作用的人；（2）从量上看：人民群众是指社会人口中的绝大多数；（3）人民群众是一个历史范畴，在不同的历史时期，人民群众有着不同的内容，包含不同的阶级、阶层和集团；但其中最稳定的主体部分始终是从事物质资料生产的劳动群众。\n\n2.人民群众的决定作用：（1）在社会历史发展过程中，人民群众起着决定性的作用：人民群众创造历史的作用同社会基本矛盾运动推动社会前进的过程相一致；人民群众的总体意愿和行动代表了历史发展的方向，人民群众的社会实践最终决定历史发展的结局；人民群众创造历史具体体现在：①人民群众是社会物质财富的创造者；②人民群众是社会精神财富的创造者；③人民群众是社会变革的决定力量；（2）人民群众创造历史的活动受到一定社会历史条件的制约：①经济条件；②政治条件：对人民群众创造历史的活动有着直接的、决定性的影响；③精神文化条件：是制约人民群众创造历史活动的重要因素。\n\n3.无产阶级政党的群众路线：（1）坚持群众观点：人民群众自己解放自己，全心全意为人民服务，一切向人民群众负责，虚心向群众学习；（2）贯彻群众路线：一切为了群众，一切依靠群众，从群众中来，到群众中去。","notes":"","source":"苏一《27命题点高清图谱》印刷第22页；按原分支整理","source_pages":[22],"source_pdf_pages":[27],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p027_n003","p027_n004","p027_n005","p027_n006","p027_n007","p027_n008","p027_n009","p027_n010","p027_n011","p027_n012","p027_n013","p027_n014","p027_n015","p027_n016","p027_n017","p027_n018","p027_n019","p027_n020","p027_n021","p027_n022"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p027_a001","kind":"政治素养","text":"生产关系的变革、社会制度的变革，最终取决于生产力的发展；但社会发展的巨大变化，都由发挥和完成，而必须借助人民群众的力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p027_a002","kind":"政治素养","text":"1.有的人作用大些，可称为“历史人物”\n2.有的人作用小些，可称为“普通个人”","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p027_a003","kind":"政治素养","text":"1.历史人物：中性词（有积极、有消极）\n2.杰出人物：起积极作用，推动历史发展；革命领导者等\n3.历史人物：决定个别历史事件的结局≠决定历史发展总趋势/总方向和总进程\n4.社会发展的基本方向/基本趋势/总进程和总方向：不以人的意志为转移的（客观的），任何人都不能决定或改变","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p027_a004","kind":"政治素养","text":"在阶级社会中，贯彻历史分析方法与坚持阶级分析方法是统一的","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":70},{"id":"suyi-marx-p022-n023-g01","revision":1,"path":["马原","第三章 唯物史观","考点13：个人在社会历史中的作用"],"type":"group","title":"个人在社会历史中的作用","question":"个人在社会历史中的作用体现在哪些方面？相关定位和适用条件是什么？","answer":"1.普通个人（历史参与者）：（1）属于人民群众范畴，每个人对社会发展都有或大或小的贡献和作用；（2）他们对社会发展贡献的总和构成人民群众创造历史的活动。\n\n2.历史人物：历史人物：一定历史事件的主要倡导者、组织领导者或思想理论、科学文化的重要代表人物；对历史发展有深刻影响，甚至有时能够决定个别历史事件的结局；杰出人物：①是历史人物中特别能对历史作出重要贡献或起重要作用的人；②在历史发展进程中，新的历史任务往往是由具有进步意义的历史人物首先发现或提出来的；③先进阶级的政治代表人物，特别是无产阶级的领袖人物，所提出的思想能够成为社会变革的先导，他们为解决指明革命斗争的方向，在革命斗争中起着领导核心的作用；不管什么样的历史人物，在历史上发挥什么样的作用，都要受到社会发展客观规律的制约，而不能决定和改变历史发展的总进程和总方向。\n\n3.辩证地理解和评价个人的历史作用：作用：（1）任何历史人物的出现都体现了必然性和偶然性的统一；（2）历史人物的作用性质取决于他们的思想、行为是否符合社会发展规律，是否符合人民群众的意愿；评价方法：（1）历史分析方法：从特定的历史背景出发，根据当时的历史条件，对历史人物的历史作用加以具体的、全面的考察；（2）阶级分析方法：把历史人物置于一定的阶级关系中，同他们所属的阶级联系起来加以考察和评价；无产阶级领袖：（1）无产阶级领袖不同于以往历史上的杰出人物，他们所代表的是历史上最革命、最先进的阶级，在革命和建设中发挥了重大作用；（2）在评价无产阶级领袖时，同样应该坚持历史分析方法和阶级分析方法。\n\n4.群众、阶级、政党、领袖的关系：（1）群众是划分为阶级的；阶级通常是由政党领导的；政党是由领袖主持的；（2）群众、阶级、政党、领袖环环相扣、相互依存，构成一个有机整体，任何时候都不应该把它们割裂开来。","notes":"","source":"苏一《27命题点高清图谱》印刷第22页；按原分支整理","source_pages":[22],"source_pdf_pages":[27],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p027_n024","p027_n025","p027_n026","p027_n027","p027_n028","p027_n029","p027_n030","p027_n031","p027_n032","p027_n033","p027_n034","p027_n035","p027_n036","p027_n037","p027_n038","p027_n039","p027_n040","p027_n041","p027_n042","p027_n043","p027_n044","p027_n045","p027_n046","p027_n047"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p027_a001","kind":"政治素养","text":"生产关系的变革、社会制度的变革，最终取决于生产力的发展；但社会发展的巨大变化，都由发挥和完成，而必须借助人民群众的力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p027_a002","kind":"政治素养","text":"1.有的人作用大些，可称为“历史人物”\n2.有的人作用小些，可称为“普通个人”","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p027_a003","kind":"政治素养","text":"1.历史人物：中性词（有积极、有消极）\n2.杰出人物：起积极作用，推动历史发展；革命领导者等\n3.历史人物：决定个别历史事件的结局≠决定历史发展总趋势/总方向和总进程\n4.社会发展的基本方向/基本趋势/总进程和总方向：不以人的意志为转移的（客观的），任何人都不能决定或改变","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p027_a004","kind":"政治素养","text":"在阶级社会中，贯彻历史分析方法与坚持阶级分析方法是统一的","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":71},{"id":"suyi-marx-p023-n002-g01","revision":1,"path":["马原","第四章 商品经济理论","考点1：商品经济的形成和发展"],"type":"group","title":"商品经济的形成和发展","question":"围绕商品经济的形成和发展，商品经济与自然经济、商品经济产生的两个社会历史条件、商品经济发展的两个阶段分别是什么？","answer":"1.商品经济与自然经济：（1）自然经济：自给自足经济，指生产的目的是直接满足生产者个人或经济单位的需要而不是交换的经济形式；（2）商品经济：以交换为目的而进行生产的经济形式。\n\n2.商品经济产生的两个社会历史条件：（1）存在社会分工：社会分工是社会劳动划分和独立化为不同部门和行业；（2）生产资料和劳动产品属于不同的所有者。\n\n3.商品经济发展的两个阶段：第一阶段：简单商品经济，以生产资料私有制和个体劳动为基础；第二阶段：资本主义商品经济，以生产资料私有制和雇佣劳动为基础（商品经济的高级或发达形态）。","notes":"","source":"苏一《27命题点高清图谱》印刷第23页；按原分支整理","source_pages":[23],"source_pdf_pages":[28],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p028_n003","p028_n004","p028_n005","p028_n006","p028_n007","p028_n008","p028_n009","p028_n010","p028_n011"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p028_a001","kind":"政治素养","text":"自然经济是一个历史范畴，某个时候开始有，某个时候又会消失；商品经济一般存在于社会分工、生产资料和劳动产品属于不同所有者的条件下。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a002","kind":"易错点","text":"商品一定是劳动产品，但劳动产品不一定是商品（√，因为劳动产品不一定拿去交换）\n价值与使用价值统一于商品，使用价值是价值的物质承担者","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a003","kind":"政治素养","text":"具体劳动是使用价值的源泉之一，抽象劳动形成价值；具体劳动是自然属性，抽象劳动是社会属性。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a004","kind":"政治素养","text":"劳动生产率越高，单位商品价值量越小；单位时间创造的价值总量不因劳动生产率提高而增加。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":72},{"id":"suyi-marx-p023-n012-g01","revision":1,"path":["马原","第四章 商品经济理论","考点2：商品的二因素"],"type":"group","title":"商品的二因素","question":"围绕商品的二因素，二因素的内容、交换价值、关系、对立统一分别是什么？","answer":"1.商品：用来交换、能满足人的某种需要的劳动产品，具有使用价值和价值两个因素或两种属性，是使用价值和价值的矛盾统一体\n\n2.二因素的内容：使用价值：定义：商品能满足人的某种需要的有用性；（1）使用价值反映人与自然之间的物质关系，是商品的自然属性；（2）是一切劳动产品所共有的属性；（3）使用价值构成社会财富的物质内容；（4）商品的使用价值，不是用来满足生产者自身需要的，而是通过交换满足他人的、社会的需要；价值：定义：凝结在商品中的无差别的一般人类劳动，即人的脑力和体力的耗费；（1）价值是商品所有的社会属性，体现了生产者之间一定的社会关系；（2）只有用来交换的劳动产品并作为商品时才具有价值；（3）使用价值不同的商品之所以能够一定比例相交换，就是因为它们都具有价值；（4）商品的价值在质上是相同的，因而可以相互比较。\n\n3.交换价值：（1）交换价值首先表现为一种使用价值同另一种使用价值相交换的量的关系或比例；（2）决定商品交换比例的不是商品的使用价值，而是价值（价值决定交换比例）；（3）价值是交换价值的基础，交换价值是价值的表现形式。\n\n4.关系：（1）使用价值是价值/交换价值的物质承担者；（2）价值寓于使用价值之中，价值以使用价值为前提。\n\n5.对立统一：（1）对立：价值和使用价值相互排斥，不可兼得；卖方要获得商品的价值，就必须放弃商品的使用价值（商品本身）；买方要得到商品的使用价值，就必须让渡商品的价值（货币）；（2）统一：作为商品，必须同时具有使用价值和价值两个因素。卖方要得到商品的使用价值，就不能得到商品的价值；买方要得到商品的价值，就不能得到商品的使用价值。","notes":"","source":"苏一《27命题点高清图谱》印刷第23页；按原分支整理","source_pages":[23],"source_pdf_pages":[28],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p028_n013","p028_n014","p028_n015","p028_n016","p028_n017","p028_n018","p028_n019","p028_n020","p028_n021","p028_n022","p028_n023","p028_n024","p028_n025","p028_n026","p028_n027","p028_n028","p028_n029","p028_n030","p028_n031","p028_n032","p028_n033","p028_n034","p028_n035","p028_n036","p028_n037","p028_n038"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p028_a001","kind":"政治素养","text":"自然经济是一个历史范畴，某个时候开始有，某个时候又会消失；商品经济一般存在于社会分工、生产资料和劳动产品属于不同所有者的条件下。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a002","kind":"易错点","text":"商品一定是劳动产品，但劳动产品不一定是商品（√，因为劳动产品不一定拿去交换）\n价值与使用价值统一于商品，使用价值是价值的物质承担者","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a003","kind":"政治素养","text":"具体劳动是使用价值的源泉之一，抽象劳动形成价值；具体劳动是自然属性，抽象劳动是社会属性。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a004","kind":"政治素养","text":"劳动生产率越高，单位商品价值量越小；单位时间创造的价值总量不因劳动生产率提高而增加。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":73},{"id":"suyi-marx-p023-n039-g01","revision":1,"path":["马原","第四章 商品经济理论","考点3：生产商品的劳动二重性"],"type":"group","title":"生产商品的劳动二重性","question":"生产商品的劳动二重性的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.具体劳动：生产一定使用价值的具体形式的劳动，也称为有用劳动\n\n2.抽象劳动：凝结在商品中的无差别的一般人类劳动，即人的脑力和体力的耗费\n\n3.对立统一：对立：具体劳动反映的是人与自然的关系，创造商品的使用价值，是劳动的自然属性；抽象劳动反映的是人与社会的关系，创造商品的价值，是劳动的社会属性；统一：具体劳动和抽象劳动是同一劳动过程不可分割的两个方面，不是两次劳动或两种劳动，它们在时间上和空间上是统一的。","notes":"","source":"苏一《27命题点高清图谱》印刷第23页；按原分支整理","source_pages":[23],"source_pdf_pages":[28],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p028_n040","p028_n041","p028_n042","p028_n043","p028_n044"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p028_a001","kind":"政治素养","text":"自然经济是一个历史范畴，某个时候开始有，某个时候又会消失；商品经济一般存在于社会分工、生产资料和劳动产品属于不同所有者的条件下。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a002","kind":"易错点","text":"商品一定是劳动产品，但劳动产品不一定是商品（√，因为劳动产品不一定拿去交换）\n价值与使用价值统一于商品，使用价值是价值的物质承担者","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a003","kind":"政治素养","text":"具体劳动是使用价值的源泉之一，抽象劳动形成价值；具体劳动是自然属性，抽象劳动是社会属性。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a004","kind":"政治素养","text":"劳动生产率越高，单位商品价值量越小；单位时间创造的价值总量不因劳动生产率提高而增加。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":74},{"id":"suyi-marx-p023-n045-g01","revision":1,"path":["马原","第四章 商品经济理论","考点4：商品价值量的决定"],"type":"group","title":"商品价值量的决定","question":"商品价值量的决定体现在哪些方面？相关定位和适用条件是什么？","answer":"1.商品价值量的决定：（1）价值的质的规定回答的是什么（是抽象劳动）；（2）价值量由生产商品所消耗的劳动量决定，而劳动量按劳动时间来计算；（3）决定商品价值量的不是生产商品的个别劳动时间，而是社会必要劳动时间。\n\n2.社会必要劳动时间：（1）含义：是在现有的社会正常的生产条件下，在社会平均的劳动熟练程度和劳动熟练程度下制造某种使用价值所需要的劳动时间；（2）生产商品所需要的社会必要劳动时间随着劳动生产率的变化而变化。\n\n3.商品价值量与劳动生产率的关系：（1）劳动生产率：指的是劳动者生产使用价值的效率，它的高低可以用单位劳动时间内生产的商品数量来测量，也可以用单位商品中所耗费的劳动时间来测量；（2）商品价值量与生产商品所耗费的社会必要劳动时间成正比，与劳动生产率成反比；劳动生产率越高，单位商品价值量越小，反之越大；（3）劳动生产率提高，单位时间内生产商品数量增加，但单位时间创造的价值总量不变；因此商品价值量下降；影响劳动生产率的因素：①劳动者的平均熟练程度；②科学技术的发展水平及其在生产中的应用程度；③生产过程的社会结合；④生产资料的效能和自然条件；（4）简单劳动和复杂劳动：简单劳动指不需要经过专门训练和培养的一般劳动者能从事的劳动；复杂劳动指需要经过专门训练和培养、具有一定文化知识和技术专长的劳动者所从事的劳动；复杂劳动等于自乘的或多倍的简单劳动。","notes":"","source":"苏一《27命题点高清图谱》印刷第23页；按原分支整理","source_pages":[23],"source_pdf_pages":[28],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p028_n046","p028_n047","p028_n048","p028_n049","p028_n050","p028_n051","p028_n052","p028_n053","p028_n054","p028_n055","p028_n056","p028_n057","p028_n058"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p028_a001","kind":"政治素养","text":"自然经济是一个历史范畴，某个时候开始有，某个时候又会消失；商品经济一般存在于社会分工、生产资料和劳动产品属于不同所有者的条件下。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a002","kind":"易错点","text":"商品一定是劳动产品，但劳动产品不一定是商品（√，因为劳动产品不一定拿去交换）\n价值与使用价值统一于商品，使用价值是价值的物质承担者","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a003","kind":"政治素养","text":"具体劳动是使用价值的源泉之一，抽象劳动形成价值；具体劳动是自然属性，抽象劳动是社会属性。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p028_a004","kind":"政治素养","text":"劳动生产率越高，单位商品价值量越小；单位时间创造的价值总量不因劳动生产率提高而增加。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":75},{"id":"suyi-marx-p024-n002-g01","revision":1,"path":["马原","第四章 商品经济理论","考点5：价值形式的发展与货币的产生"],"type":"group","title":"价值形式的发展与货币的产生","question":"价值形式的发展与货币的产生体现在哪些方面？相关定位和适用条件是什么？","answer":"1.四个发展阶段：①简单的或偶然的价值形式；②总和的或扩大的价值形式；③一般价值形式；④货币形式\n\n2.货币的本质：固定充当一般等价物的商品\n\n3.货币的五种职能：（1）价值尺度：为商品定价，只需观念上的货币——价格表示；（2）流通手段：必须是现实的货币（现实中的买卖，一手交钱、一手交货）；（3）支付手段：清偿债务、支付赋税、租金、工资等（指提前或延后交易）；（4）贮藏手段：退出流通领域，必须是足值的金属货币或金条；（5）世界货币：各种货币的职能在全球范围内使用。\n\n4.货币的作用：（1）随着货币的产生，整个商品世界分化为两极：一极是具体的商品，代表不同的使用价值；另一极是货币，代表商品的价值；（2）商品内在的使用价值和价值的矛盾发展起来，转化为商品和货币的外在矛盾；（3）一切商品只要转换成货币，商品使用价值和价值的矛盾就能得到解决，从而使商品的价值得到实现；（4）货币的出现有利于解决商品交换的困难，促进了商品经济的发展；（5）但是，货币的出现并没有从根本上消除商品经济的矛盾，反而有可能使矛盾扩大和加深。","notes":"","source":"苏一《27命题点高清图谱》印刷第24页；按原分支整理","source_pages":[24],"source_pdf_pages":[29],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p029_n003","p029_n004","p029_n005","p029_n006","p029_n007","p029_n008","p029_n009","p029_n010","p029_n011","p029_n012","p029_n013","p029_n014","p029_n015","p029_n016"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p029_a001","kind":"政治素养","text":"货币是商品经济内在矛盾发展的产物，货币的本质体现一定的社会关系。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p029_a002","kind":"政治素养","text":"价值规律既具有自发调节作用，也可能带来资源浪费、两极分化等消极后果。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p029_a003","kind":"政治素养","text":"私人劳动和社会劳动的矛盾贯穿于以私有制为基础的商品经济之中，交换是解决这一矛盾的唯一途径。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":76},{"id":"suyi-marx-p024-n017-g01","revision":1,"path":["马原","第四章 商品经济理论","考点6：价值规律"],"type":"group","title":"价值规律","question":"价值规律的基本内容、作用和方法论要求是什么？","answer":"1.价值规律：是商品生产和商品交换的基本规律，贯穿于商品经济的全过程，它既支配商品生产，又支配商品流通\n\n2.主要内容：（1）商品的价值量由生产商品的社会必要劳动时间决定；（2）商品交换以价值量为基础，按照等价交换的原则进行。\n\n3.表现形式：商品价格围绕商品价值自发波动：商品价格总的来说总是时而高于价值、时而低于价值，不可能始终围绕价值这个中心上下波动；从较长时间来看，价格高于价值的部分和价格低于价值的部分会相抵消，商品的平均价格和价值量相一致。\n\n4.作用：积极：（1）自发地调节生产资料和劳动力在社会生产部门之间的分配比例；（2）自发地刺激社会生产力的发展；（3）自发地调节社会收入的分配；消极：（1）导致社会资源浪费；（2）阻碍技术进步；（3）导致收入两极分化。","notes":"","source":"苏一《27命题点高清图谱》印刷第24页；按原分支整理","source_pages":[24],"source_pdf_pages":[29],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p029_n018","p029_n019","p029_n020","p029_n021","p029_n022","p029_n023","p029_n024","p029_n025","p029_n026","p029_n027","p029_n028","p029_n029","p029_n030","p029_n031","p029_n032"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p029_a001","kind":"政治素养","text":"货币是商品经济内在矛盾发展的产物，货币的本质体现一定的社会关系。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p029_a002","kind":"政治素养","text":"价值规律既具有自发调节作用，也可能带来资源浪费、两极分化等消极后果。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p029_a003","kind":"政治素养","text":"私人劳动和社会劳动的矛盾贯穿于以私有制为基础的商品经济之中，交换是解决这一矛盾的唯一途径。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":77},{"id":"suyi-marx-p024-n033-g01","revision":1,"path":["马原","第四章 商品经济理论","考点7：以私有制为基础的商品经济的基本矛盾"],"type":"group","title":"以私有制为基础的商品经济的基本矛盾","question":"围绕以私有制为基础的商品经济的基本矛盾，内涵、私人劳动和社会劳动的矛盾分别是什么？","answer":"1.内涵：（1）私人劳动和社会劳动的矛盾是商品经济的基本矛盾；（2）在以私有制为基础的商品经济中，商品生产者的劳动既是具有社会性质的社会劳动，又是具有私人性质的私人劳动；（3）私人劳动和社会劳动：①社会劳动——社会分工下，每个商品生产者的劳动都是社会总劳动的一部分，生产目的是满足社会需要，劳动具有社会属性；②私人劳动——在私有制条件下，商品生产者的劳动是按照自己的利益和要求进行的，是具有私人性质的私人劳动。\n\n2.私人劳动和社会劳动的矛盾：（1）决定商品经济的本质及发展过程：交换体现了商品经济的本质；交换是解决私人劳动和社会劳动之间矛盾的唯一途径；（2）是商品经济其他一切矛盾的基础：①具体劳动能否还原为抽象劳动，在根本上取决于私人劳动和社会劳动能否实现统一；②商品的使用价值和价值的矛盾、生产商品的具体劳动和抽象劳动的矛盾，根源于私人劳动和社会劳动的矛盾；（3）决定商品生产者的命运。\n\n3.私有制商品经济条件下商品拜物教产生的必然性：（1）私有制商品经济条件下劳动产品只有采用商品的形式才能进行交换，人类劳动的等同性只有采取同一的价值形式才能在交换中体现出来；（2）劳动量只有采取价值这一物的形式才能进行计算和比较；（3）生产者的劳动关系必须只采取商品之间即物与物之间相交换的形式才能间接地表现出来。\n\n4.最终发展为资本主义的基本矛盾：生产社会化和生产资料资本主义私人占有之间的矛盾","notes":"","source":"苏一《27命题点高清图谱》印刷第24页；按原分支整理","source_pages":[24],"source_pdf_pages":[29],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p029_n034","p029_n035","p029_n036","p029_n037","p029_n038","p029_n039","p029_n040","p029_n041","p029_n042","p029_n043","p029_n044","p029_n045","p029_n046"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p029_a001","kind":"政治素养","text":"货币是商品经济内在矛盾发展的产物，货币的本质体现一定的社会关系。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p029_a002","kind":"政治素养","text":"价值规律既具有自发调节作用，也可能带来资源浪费、两极分化等消极后果。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p029_a003","kind":"政治素养","text":"私人劳动和社会劳动的矛盾贯穿于以私有制为基础的商品经济之中，交换是解决这一矛盾的唯一途径。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":78},{"id":"suyi-marx-p024-n047-g01","revision":1,"path":["马原","第四章 商品经济理论","考点8：深化认识马克思劳动价值论的当代价值"],"type":"group","title":"深化认识马克思劳动价值论的当代价值","question":"深化认识马克思劳动价值论的当代价值体现在哪些方面？相关定位和适用条件是什么？","answer":"1.马克思劳动价值论的理论和实践意义：（1）揭示了商品经济的一般规律，对理解社会主义市场经济具有指导意义；（2）揭示了私有制条件下商品经济的基本矛盾，为从物与物的关系背后揭示人与人的关系提供了理论依据；（3）揭示了商品经济的一般规律，对理解社会主义市场经济具有指导意义。\n\n2.在当代条件下深化对马克思劳动价值论的认识：（1）深化对创造价值的劳动的认识，对生产性劳动作出新的界定；（2）深化对科技人员、经营管理人员在社会生产和价值创造中所起作用的认识；（3）深化对价值创造与价值分配关系的认识。","notes":"","source":"苏一《27命题点高清图谱》印刷第24页；按原分支整理","source_pages":[24],"source_pdf_pages":[29],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p029_n048","p029_n049","p029_n050","p029_n051","p029_n052","p029_n053","p029_n054","p029_n055"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p029_a001","kind":"政治素养","text":"货币是商品经济内在矛盾发展的产物，货币的本质体现一定的社会关系。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p029_a002","kind":"政治素养","text":"价值规律既具有自发调节作用，也可能带来资源浪费、两极分化等消极后果。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p029_a003","kind":"政治素养","text":"私人劳动和社会劳动的矛盾贯穿于以私有制为基础的商品经济之中，交换是解决这一矛盾的唯一途径。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":79},{"id":"suyi-marx-p025-n002-g01","revision":1,"path":["马原","第四章 剩余价值理论","考点1：资本主义经济制度的产生"],"type":"group","title":"资本主义经济制度的产生","question":"围绕资本主义经济制度的产生，资本主义生产关系的产生、资本的原始积累分别是什么？","answer":"1.资本主义生产关系的产生：（1）萌芽于14世纪末15世纪初地中海沿岸的一些城市；（2）产生的两个途径：①从小商品经济分化出来；②从商人和高利贷者转化而来。\n\n2.资本的原始积累：（1）内涵：以暴力手段使生产者与生产资料相分离，资本迅速集中于少数人手中，资本主义得以迅速发展的历史过程；（2）途径：①用暴力手段剥夺农民的土地（这是资本原始积累过程的基础）；②用暴力手段掠夺货币财富。\n\n3.资本主义所有制的确立：资本主义所有制决定的资本与雇佣劳动之间剥削与被剥削的关系，反映了资本主义经济制度的本质","notes":"","source":"苏一《27命题点高清图谱》印刷第25页；按原分支整理","source_pages":[25],"source_pdf_pages":[30],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p030_n003","p030_n004","p030_n005","p030_n006","p030_n007","p030_n008","p030_n009","p030_n010","p030_n011"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p030_a001","kind":"政治素养","text":"资本原始积累用暴力手段使生产者与生产资料相分离，是资本主义经济制度形成的重要历史条件。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p030_a002","kind":"政治素养","text":"W—G—W以使用价值为目的；G—W—G'以价值增殖为目的。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p030_a003","kind":"政治素养","text":"劳动者出卖的是劳动力而不是劳动；劳动力商品的使用价值在于能创造出比自身价值更大的价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":80},{"id":"suyi-marx-p025-n012-g01","revision":1,"path":["马原","第四章 剩余价值理论","考点2：劳动力成为商品与货币转化为资本"],"type":"group","title":"劳动力成为商品与货币转化为资本","question":"围绕劳动力成为商品与货币转化为资本，资本总公式、劳动力成为商品、劳动力商品的价值和使用价值、货币转化为资本分别是什么？","answer":"1.资本主义经济制度：是以资本主义私有制和雇佣劳动为基础的一种剥削制度，这一经济制度的形成是以劳动力成为商品为前提条件的\n\n2.资本总公式：（1）简单商品流通公式：W—G—W；W代表商品，G代表流通中的货币；这个公式表明：商品流通的目的是获得使用价值；（2）资本总公式：G—W—G'；是作为资本的货币，G'代表的是价值增殖后的货币；这个公式表明：资本运动的一般目的是价值增殖。\n\n3.劳动力成为商品：（1）在资本主义制度下，资本家购买的是雇佣工人的劳动力而不是劳动。劳动力是指人的劳动能力，是人的脑力和体力的总和；劳动是劳动力的使用过程（工人实际干活时的动作），已经存在于过程中，是提前买的；（2）劳动力成为商品的两个基本条件：①劳动者在法律上是自由人，能够把自己的劳动力当作自己的商品来支配；②劳动者没有任何生产资料，没有生活资料来源，因而不得不依靠出卖劳动力为生；（3）劳动力商品标志着简单商品生产发展到资本主义商品生产的新阶段。\n\n4.劳动力商品的价值和使用价值：（1）价值：劳动力的价值是由生产、发展、维持和延续劳动力所必需的生活资料的价值决定的；包括三个部分：①维持劳动者本人生活所必需的生活资料的价值；②维持劳动者家属的生活所必需的生活资料的价值；③劳动者接受教育和训练所支出的费用；特点：劳动力价值的构成包含历史和道德的因素；（2）使用价值：图示：AC——劳动力的使用过程；AB——创造劳动力自身的价值（即资本家支付给工人的工资）；BC——剩余价值（资本家无偿占有的价值）；劳动力商品在消费过程中能够创造新的价值，而且这个新的价值比劳动力本身的价值更大。\n\n5.货币转化为资本：实现条件：一旦货币购买到劳动力并获得剩余价值，货币就转化为资本；资本的本质：（1）资本是能够带来剩余价值的价值。剩余价值是由雇佣工人的剩余劳动创造的；（2）在资本主义社会，资本总是通过各种物品表现出来，但资本不是物，而是一定的、社会的、属于一定历史社会形态的生产关系。","notes":"","source":"苏一《27命题点高清图谱》印刷第25页；按原分支整理","source_pages":[25],"source_pdf_pages":[30],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p030_n013","p030_n014","p030_n015","p030_n016","p030_n017","p030_n018","p030_n019","p030_n020","p030_n021","p030_n022","p030_n023","p030_n024","p030_n025","p030_n026","p030_n027","p030_n028","p030_n029","p030_n030","p030_n031","p030_n032","p030_n033","p030_n034","p030_n035","p030_n036","p030_n037"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p030_a001","kind":"政治素养","text":"资本原始积累用暴力手段使生产者与生产资料相分离，是资本主义经济制度形成的重要历史条件。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p030_a002","kind":"政治素养","text":"W—G—W以使用价值为目的；G—W—G'以价值增殖为目的。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p030_a003","kind":"政治素养","text":"劳动者出卖的是劳动力而不是劳动；劳动力商品的使用价值在于能创造出比自身价值更大的价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":81},{"id":"suyi-marx-p026-n002-g01","revision":1,"path":["马原","第四章 剩余价值理论","考点3：资本主义生产过程"],"type":"group","title":"资本主义生产过程","question":"资本主义生产过程有哪些阶段、重要节点及其意义？","answer":"1.资本主义生产的直接目的和决定性动机，就是无休止地获取尽可能多的剩余价值。这种不以人的意志为转移的客观必然性就是剩余价值规律\n\n2.资本主义生产过程是劳动过程和价值增殖过程的统一（具有两重性）\n\n3.劳动过程（生产物质资料的过程）：（1）劳动者通过有目的的活动，即运用劳动资料对劳动对象进行加工，改变自然界的物质形态，创造出满足人们某种需要的使用价值的过程；（2）资本主义劳动过程的两个特点：①工人在资本家的监督下劳动，他们的劳动力隶属于资本家；②劳动成果或者产品全部归资本家所有。\n\n4.价值增殖过程（生产剩余价值的过程）：（1）价值增殖过程，是剩余价值的生产过程，这是资本主义生产过程的主要方面；（2）价值增殖过程，是超过劳动力价值的补偿这个一定点而延长的价值形成过程：①如果劳动者创造的价值刚好补偿资本家所预付的劳动力价值，那就是单纯的价值形成过程；②如果价值形成过程超过了这个一定点，就变成了价值增殖过程；（3）在价值增殖过程中，雇佣工人的劳动分为两部分：①一部分是必要劳动，用于再生产劳动力的价值；②另一部分是剩余劳动，用于无偿地为资本家生产剩余价值；（4）图示：AC：劳动过程和价值增殖过程的统一；AB：必要劳动时间→进行“必要劳动”→再生产劳动力价值（劳动力自身价值=工人的工资=可变资本）；BC：剩余劳动时间→进行“剩余劳动”→创造剩余价值（用m表示），即被资本家悄悄拿走的、剥削的。\n\n5.剩余价值的实质：（1）剩余价值是雇佣工人所创造的并被资本家无偿占有的超过劳动力价值的那部分价值，它是雇佣工人剩余劳动的凝结；（2）体现了资本家与雇佣工人之间剥削和被剥削的关系。","notes":"","source":"苏一《27命题点高清图谱》印刷第26页；按原分支整理","source_pages":[26],"source_pdf_pages":[31],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p031_n003","p031_n004","p031_n005","p031_n006","p031_n007","p031_n008","p031_n009","p031_n010","p031_n011","p031_n012","p031_n013","p031_n014","p031_n015","p031_n016","p031_n017","p031_n018","p031_n019","p031_n020","p031_n021","p031_n022"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p031_a001","kind":"政治素养","text":"AC整个过程都是劳动过程和价值增殖过程，并不是说AB是劳动过程、BC是价值增殖过程；关注点是AB再生产劳动力价值，BC创造剩余价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p031_a002","kind":"政治素养","text":"生产资料的价值通过工人的具体劳动转移到新产品中，不发生价值增殖；工人通过具体劳动和抽象劳动共同创造新价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p031_a003","kind":"政治素养","text":"剩余价值不由全部资本或不变资本创造，来源于雇佣工人的剩余劳动。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":82},{"id":"suyi-marx-p026-n023-g01","revision":1,"path":["马原","第四章 剩余价值理论","考点4：资本的区分"],"type":"group","title":"资本的区分","question":"围绕资本的区分，区分、生产商品的价值（w）、区分意义、剩余价值率（m'）分别是什么？","answer":"1.依据：根据资本在剩余价值生产中所起的不同作用，可以将资本划分为不变资本与可变资本\n\n2.区分：不变资本（用c表示）——以生产资料形态存在的资本：（1）生产资料的价值通过工人的具体劳动被转移到新产品中（注意：是转移，不是再生产）；（2）不变资本在生产过程中只转移自己的价值量，不发生增殖（即不改变原有的价值量）；（3）转移的价值量不会大于它原有的价值量：①有的是一次生产过程中全部转移，如原材料和燃料（属于流动资本）；②有的是在多次生产过程中逐渐转移，如机器、厂房等（属于固定资本）；（4）不变资本在生产过程中，会转变自己的物质形态，比如，木材经过加工变成低板；可变资本（用v表示）——用来购买劳动力的那部分资本：（1）由工人的劳动（抽象劳动）再生产出来（注意：不是转移，是再生产）；（2）工人创造的新价值包括两部分：劳动力价值的价值（v）+剩余价值（m）。\n\n3.生产商品的价值（w）：含义：商品的总价值=不变资本的价值（转移）+劳动力价值（再生产）+剩余价值（再生产）；公式：W=c+v+m；c：不变资本，v：可变资本，m：剩余价值。\n\n4.区分意义：把资本区分为不变资本和可变资本，进一步揭示了剩余价值产生的源泉：①剩余价值不是由全部资本（c+v）创造的，也不是由不变资本（c）创造的；②剩余价值是由可变资本（v）雇佣的劳动者创造的；③雇佣劳动者的剩余劳动是剩余价值产生的唯一源泉。\n\n5.剩余价值率（m'）：含义：剩余价值率就是剩余价值与可变资本相比率；公式：m'=m/v或 m'=剩余劳动/必要劳动=剩余劳动时间/必要劳动时间；意义：确定资本家对工人的剥削程度，剩余价值率越大剥削越残酷。","notes":"","source":"苏一《27命题点高清图谱》印刷第26页；按原分支整理","source_pages":[26],"source_pdf_pages":[31],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p031_n024","p031_n025","p031_n026","p031_n027","p031_n028","p031_n029","p031_n030","p031_n031","p031_n032","p031_n033","p031_n034","p031_n035","p031_n036","p031_n037","p031_n038","p031_n039","p031_n040","p031_n041","p031_n042"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p031_a001","kind":"政治素养","text":"AC整个过程都是劳动过程和价值增殖过程，并不是说AB是劳动过程、BC是价值增殖过程；关注点是AB再生产劳动力价值，BC创造剩余价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p031_a002","kind":"政治素养","text":"生产资料的价值通过工人的具体劳动转移到新产品中，不发生价值增殖；工人通过具体劳动和抽象劳动共同创造新价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p031_a003","kind":"政治素养","text":"剩余价值不由全部资本或不变资本创造，来源于雇佣工人的剩余劳动。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":83},{"id":"suyi-marx-p027-n002-g01","revision":1,"path":["马原","第四章 剩余价值理论","考点5：剩余价值生产的两种基本方法"],"type":"group","title":"剩余价值生产的两种基本方法","question":"剩余价值生产的两种基本方法体现在哪些方面？相关定位和适用条件是什么？","answer":"1.绝对剩余价值：含义：指在必要劳动时间（AB）不变的条件下，由于延长工作日的长度或提高劳动强度而产生的剩余价值；特殊情况：AC不变，提高劳动强度也属于绝对剩余价值生产；图示：AB不变，延长BC（即必要劳动时间不变，延长剩余劳动时间）。\n\n2.相对剩余价值：含义：在工作日长度不变的条件下，通过缩短必要劳动时间（即相对延长剩余劳动时间）而产生的剩余价值；（1）缩短必要劳动时间是通过提高全社会的劳动生产率实现的；（2）而全社会劳动生产率的提高是资本家追逐超额剩余价值的结果；图示：AC不变，缩短AB，相对延长BC。\n\n3.超额剩余价值：含义：超额剩余价值是指企业由于提高劳动生产率而使商品的个别价值低于社会价值的差额；产生：在资本主义商品生产条件下，每个（个别）资本家总是力图不断改进技术，改善经营管理，提高劳动生产率，使其生产的商品：①个别劳动时间少于社会必要劳动时间；②个别价值低于社会价值，从而获得超额剩余价值；结果：在资本主义商品生产条件下，单个资本家改进技术、改善管理的主观动机是追求超额剩余价值，但其客观后果则是：①整个社会（全社会）各个生产部门的劳动生产率普遍提高；②导致生活资料的价值下降和补偿劳动力价值的必要劳动时间缩短，而剩余劳动时间相对延长；③整个资本家阶级普遍获得更多的相对剩余价值。\n\n4.绝对剩余价值和相对剩余价值的共同点：都是延长工人的剩余劳动时间；（1）绝对剩余价值：如图所示（C→C'）往后延长剩余劳动时间；（2）相对剩余价值：如图所示（B→B'）往前延长剩余劳动时间。\n\n5.三者的时间逻辑：（1）资本主义发展初期（技术落后）：资本家主要依靠绝对剩余价值来提高剥削程度；（2）中期（个别企业改进技术）：个别资本家通过提高劳动生产率获得超额剩余价值；（3）后期（全社会都改进技术）：全社会都提高劳动生产率（超额剩余价值消失），最后大家只能获得相对剩余价值。","notes":"","source":"苏一《27命题点高清图谱》印刷第27页；按原分支整理","source_pages":[27],"source_pdf_pages":[32],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p032_n003","p032_n004","p032_n005","p032_n006","p032_n007","p032_n008","p032_n009","p032_n010","p032_n011","p032_n012","p032_n013","p032_n014","p032_n015","p032_n016","p032_n017","p032_n018","p032_n019","p032_n020","p032_n021","p032_n022","p032_n023","p032_n024","p032_n025"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p032_a001","kind":"政治素养","text":"提高劳动强度，迫使工人更加紧张地劳动，让他们在同样长的劳动时间内比以前耗费更多的脑力和体力，这和延长工作日并没有本质的区别。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p032_a002","kind":"政治素养","text":"资本家为了追逐超额剩余价值，从而推动了全社会劳动生产率提高，由于社会劳动生产率提高，降低了生活资料的价值，从而降低了劳动力的价值，最终缩短了必要劳动时间，相对延长了剩余劳动时间，从而形成了相对剩余价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p032_a003","kind":"政治素养","text":"超额剩余价值（超额利润）是同一部门内资本家之间竞争的结果；对于追求超额剩余价值，资本家之间进行着激烈的竞争。整个企业采用先进的技术，其他企业也会纷纷效仿，最终全社会劳动生产率提高，资本家最终普遍获得相对剩余价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p032_a004","kind":"政治素养","text":"本质上，工人得到的是劳动力的价值或价格；工资表现为劳动的价格，掩盖了资本主义的剥削关系。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":84},{"id":"suyi-marx-p027-n026-g01","revision":1,"path":["马原","第四章 剩余价值理论","考点6：生产自动化条件下剩余价值的源泉"],"type":"group","title":"生产自动化条件下剩余价值的源泉","question":"生产自动化条件下剩余价值的源泉体现在哪些方面？相关定位和适用条件是什么？","answer":"1.生产自动化只是意味着剩余价值生产所使用的生产工具更加先进了\n\n2.本质：（1）机器人、自动化生产线本质上依然是不变资本的实物形式；（2）机器人在给商品的生产时，只是把原有价值转移到产品中去，而不创造新价值，更不能创造剩余价值；（3）资本主义条件下生产自动化是资本家获取高额剩余价值的手段，而雇佣工人的剩余劳动仍然是这种剩余价值的唯一源泉。","notes":"","source":"苏一《27命题点高清图谱》印刷第27页；按原分支整理","source_pages":[27],"source_pdf_pages":[32],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p032_n027","p032_n028","p032_n029","p032_n030","p032_n031"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p032_a001","kind":"政治素养","text":"提高劳动强度，迫使工人更加紧张地劳动，让他们在同样长的劳动时间内比以前耗费更多的脑力和体力，这和延长工作日并没有本质的区别。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p032_a002","kind":"政治素养","text":"资本家为了追逐超额剩余价值，从而推动了全社会劳动生产率提高，由于社会劳动生产率提高，降低了生活资料的价值，从而降低了劳动力的价值，最终缩短了必要劳动时间，相对延长了剩余劳动时间，从而形成了相对剩余价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p032_a003","kind":"政治素养","text":"超额剩余价值（超额利润）是同一部门内资本家之间竞争的结果；对于追求超额剩余价值，资本家之间进行着激烈的竞争。整个企业采用先进的技术，其他企业也会纷纷效仿，最终全社会劳动生产率提高，资本家最终普遍获得相对剩余价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p032_a004","kind":"政治素养","text":"本质上，工人得到的是劳动力的价值或价格；工资表现为劳动的价格，掩盖了资本主义的剥削关系。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":85},{"id":"suyi-marx-p027-n032-g01","revision":1,"path":["马原","第四章 剩余价值理论","考点7：资本主义工资"],"type":"group","title":"资本主义工资","question":"围绕资本主义工资，工资的本质、两种主要形式分别是什么？","answer":"1.工资的本质：工人的工资是劳动力的价值或者价格；（1）不是劳动的价值或价格；（2）工人出卖的是劳动力，劳动力是商品。\n\n2.两种主要形式：计时工资；计件工资。\n\n3.在当代资本主义国家，工人的实际工资呈现出不断提高的趋势，但是与其创造的剩余价值的增长幅度相比，实际工资提高的幅度还是较小的","notes":"","source":"苏一《27命题点高清图谱》印刷第27页；按原分支整理","source_pages":[27],"source_pdf_pages":[32],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p032_n033","p032_n034","p032_n035","p032_n036","p032_n037","p032_n038","p032_n039","p032_n040"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p032_a001","kind":"政治素养","text":"提高劳动强度，迫使工人更加紧张地劳动，让他们在同样长的劳动时间内比以前耗费更多的脑力和体力，这和延长工作日并没有本质的区别。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p032_a002","kind":"政治素养","text":"资本家为了追逐超额剩余价值，从而推动了全社会劳动生产率提高，由于社会劳动生产率提高，降低了生活资料的价值，从而降低了劳动力的价值，最终缩短了必要劳动时间，相对延长了剩余劳动时间，从而形成了相对剩余价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p032_a003","kind":"政治素养","text":"超额剩余价值（超额利润）是同一部门内资本家之间竞争的结果；对于追求超额剩余价值，资本家之间进行着激烈的竞争。整个企业采用先进的技术，其他企业也会纷纷效仿，最终全社会劳动生产率提高，资本家最终普遍获得相对剩余价值。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p032_a004","kind":"政治素养","text":"本质上，工人得到的是劳动力的价值或价格；工资表现为劳动的价格，掩盖了资本主义的剥削关系。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":86},{"id":"suyi-marx-p028-n002-g01","revision":1,"path":["马原","第四章 剩余价值理论","考点8：剩余价值转化为利润"],"type":"group","title":"剩余价值转化为利润","question":"剩余价值转化为利润体现在哪些方面？相关定位和适用条件是什么？","answer":"1.利润：（1）在现实的资本主义经济生活中，资本家并不是把剩余价值看作可变资本的产物，而是把它看作全部预付资本的产物或增加额，剩余价值便取得了利润的形态；（2）当剩余价值被看作全部预付资本的产物或增加额时，剩余价值就转化为利润；（3）表示：m→p（m：剩余价值，p：利润），数值上大小相等（即m=p）。\n\n2.区别：（1）剩余价值率：m/v：①是剩余价值与可变资本的比率；②反映的是资本家对工人的剥削程度；（2）利润率：p/(c+v)：①是剩余价值与全部预付资本的比率；②反映的是预付总资本的增殖程度，掩盖了资本家对工人的剥削。\n\n3.商品的价值：表示：w=k+p=c+v+m；含义：k为成本价格，即资本家全部垫付资本，k=c+v；p为利润，在数值上等于m。\n\n4.结论：利润和剩余价值是同一东西，区别是：剩余价值对可变资本（v）而言；利润对全部垫付资本（c+v）而言","notes":"","source":"苏一《27命题点高清图谱》印刷第28页；按原分支整理","source_pages":[28],"source_pdf_pages":[33],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p033_n003","p033_n004","p033_n005","p033_n006","p033_n007","p033_n008","p033_n009","p033_n010","p033_n011","p033_n012","p033_n013","p033_n014","p033_n015","p033_n016","p033_n017"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p033_a001","kind":"政治素养","text":"从公式中可以看出，利润率总是小于剩余价值率，所以说利润率掩盖了剥削。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p033_a002","kind":"政治素养","text":"在利润率平均化的过程中，这些不同部门的资本家瓜分到的利润只是平均利润。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p033_a003","kind":"政治素养","text":"个别部门资本家获得的平均利润可能与本部门工人创造的剩余价值不一致，但全社会利润总额等于剩余价值总额、生产价格总额等于价值总额。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":87},{"id":"suyi-marx-p028-n018-g01","revision":1,"path":["马原","第四章 剩余价值理论","考点9：平均利润的形成和剩余价值的分配"],"type":"group","title":"平均利润的形成和剩余价值的分配","question":"平均利润的形成和剩余价值的分配体现在哪些方面？相关定位和适用条件是什么？","answer":"1.利润转化为平均利润：形成原因：为了得到尽可能高的利润率和尽可能多的利润，不同生产部门的资本家之间必然展开激烈的竞争，大量资本必然从利润率低的部门转移到利润率高的部门，从而导致利润率平均化；含义：在利润率平均化的过程中，形成了社会的平均利润率，按照平均利润率计算和获得的利润，叫作平均利润；本质：①利润转化为平均利润，是剩余价值规律和竞争规律作用的必然结果；②体现着不同部门的资本家集团要求按照等量资本获得等量利润的原则来瓜分剩余价值的关系；剩余价值的分配形式：在利润率平均化的过程中，产业资本家得到产业利润，商业资本家得到商业利润，银行资本家得到银行利润，农业资本家得到农业利润；瓜分利润的决定因素：（1）不仅取决于他对本企业工人的剥削程度；（2）而且取决于整个资产阶级对整个工人阶级的剥削程度。\n\n2.生产价格：形成：利润转化为平均利润，商品价值也就转化为生产价格；表示：生产价格=生产成本+平均利润（生产成本：生产中实际耗费的不变资本和可变资本）；本质：在价值转化为生产价格的条件下，价值规律作用的形式发生了变化；（1）商品以生产价格为基础进行交换；（2）市场价格变动以生产价格为中心上下波动，而非以价值为中心；价值规律的本质，是商品交换以价值量为基础，实行等价交换，也就是说，全社会的商品生产和交换总额，这个核心关系永远不会变；价值规律本质不变的原因：（1）从个别部门来看，资本家获得的平均利润与本部门工人创造的剩余价值可能不一致：效率高的企业利润大于自身创造的剩余价值，效率低的企业利润小于自身创造的剩余价值；（2）但从全社会来看，利润总额等于剩余价值总额，商品的生产价格总额和价值总额相等。这就说明，价值总量没变，等价交换的本质也没变。\n\n总结：（1）超额利润（超额剩余价值）是同一部门内资本家之间竞争的结果；（2）平均利润：不同部门之间的竞争结果。因此平均利润形成后，超额利润不会消失。","notes":"","source":"苏一《27命题点高清图谱》印刷第28页；按原分支整理","source_pages":[28],"source_pdf_pages":[33],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p033_n019","p033_n020","p033_n021","p033_n022","p033_n023","p033_n024","p033_n025","p033_n026","p033_n027","p033_n028","p033_n029","p033_n030","p033_n031","p033_n032","p033_n033","p033_n034","p033_n035","p033_n036","p033_n037","p033_n038","p033_n039","p033_n040","p033_n041","p033_n042","p033_n043","p033_n044","p033_n045"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p033_a001","kind":"政治素养","text":"从公式中可以看出，利润率总是小于剩余价值率，所以说利润率掩盖了剥削。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p033_a002","kind":"政治素养","text":"在利润率平均化的过程中，这些不同部门的资本家瓜分到的利润只是平均利润。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p033_a003","kind":"政治素养","text":"个别部门资本家获得的平均利润可能与本部门工人创造的剩余价值不一致，但全社会利润总额等于剩余价值总额、生产价格总额等于价值总额。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":88},{"id":"suyi-marx-p028-n046-g01","revision":1,"path":["马原","第四章 剩余价值理论","考点10：剩余价值理论的意义"],"type":"group","title":"剩余价值理论的意义","question":"剩余价值理论的意义体现在哪些方面？相关定位和适用条件是什么？","answer":"1.马克思通过分析剩余价值的生产、积累、流通以及分配过程，揭示了剩余价值的运动规律及其作用，创立了剩余价值理论\n\n2.剩余价值理论深刻揭露了资本主义生产关系的剥削本质，阐明了资产阶级与无产阶级之间阶级斗争的经济根源，指出了无产阶级革命的历史必然性\n\n3.剩余价值理论是马克思主义经济学说的核心内容和基石\n\n4.由于唯物史观和剩余价值理论的发现，社会主义由空想变为科学","notes":"","source":"苏一《27命题点高清图谱》印刷第28页；按原分支整理","source_pages":[28],"source_pdf_pages":[33],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p033_n047","p033_n048","p033_n049","p033_n050"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p033_a001","kind":"政治素养","text":"从公式中可以看出，利润率总是小于剩余价值率，所以说利润率掩盖了剥削。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p033_a002","kind":"政治素养","text":"在利润率平均化的过程中，这些不同部门的资本家瓜分到的利润只是平均利润。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p033_a003","kind":"政治素养","text":"个别部门资本家获得的平均利润可能与本部门工人创造的剩余价值不一致，但全社会利润总额等于剩余价值总额、生产价格总额等于价值总额。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":89},{"id":"suyi-marx-p029-n002-g01","revision":1,"path":["马原","第四章 资本理论","考点1：资本积累"],"type":"group","title":"资本积累：含义、资本主义再生产","question":"资本积累：含义、资本主义再生产的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.含义：把剩余价值转化为资本，或者说，剩余价值的资本化，就是资本积累\n\n2.资本主义再生产：简单再生产：含义：资本家瓜分到剩余价值后，完全用于个人消费，生产保持原有规模；实质：物质资料再生产和资本主义生产关系再生产的统一；扩大再生产：含义：资本家获得剩余价值后，一部分用于个人消费，另一部分用来购买生产资料和劳动力，扩大生产规模；结论：资本积累是资本主义扩大再生产的源泉。","notes":"","source":"苏一《27命题点高清图谱》印刷第29页；按原分支整理","source_pages":[29],"source_pdf_pages":[34],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p034_n003","p034_n004","p034_n005","p034_n006","p034_n007","p034_n008","p034_n009","p034_n010"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p034_a001","kind":"政治素养","text":"抽象劳动是价值的唯一源泉；雇佣劳动者的剩余劳动是剩余价值产生的唯一源泉；具体劳动不能用价值的衡量，不能用来。资本积累不是资本主义扩大再生产的源泉。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a002","kind":"政治素养","text":"资本有机构成由技术构成决定并反映技术构成变化；资本有机构成提高导致可变资本相对减少和相对过剩人口形成。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a003","kind":"政治素养","text":"资本积聚以剩余价值资本化为基础；资本集中是现有资本合并，竞争和信用是最有力的杠杆。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":90},{"id":"suyi-marx-p029-n002-g02","revision":1,"path":["马原","第四章 资本理论","考点1：资本积累"],"type":"group","title":"资本积累：本质、源泉","question":"资本积累：本质、源泉的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"3.本质：资本积累的本质，就是资本家不断地利用无偿占有的工人创造的剩余价值来扩大自己的资本规模，进一步扩大和加强对工人的剥削和统治\n\n4.源泉：资本积累的源泉是剩余价值；资本积累的规模取决于：（1）对工人的剥削程度；（2）劳动生产率的高低；（3）所用资本和所费资本之间的差额；（4）资本家预付资本的大小。","notes":"","source":"苏一《27命题点高清图谱》印刷第29页；按原分支整理","source_pages":[29],"source_pdf_pages":[34],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p034_n011","p034_n012","p034_n013","p034_n014"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p034_a001","kind":"政治素养","text":"抽象劳动是价值的唯一源泉；雇佣劳动者的剩余劳动是剩余价值产生的唯一源泉；具体劳动不能用价值的衡量，不能用来。资本积累不是资本主义扩大再生产的源泉。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a002","kind":"政治素养","text":"资本有机构成由技术构成决定并反映技术构成变化；资本有机构成提高导致可变资本相对减少和相对过剩人口形成。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a003","kind":"政治素养","text":"资本积聚以剩余价值资本化为基础；资本集中是现有资本合并，竞争和信用是最有力的杠杆。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":91},{"id":"suyi-marx-p029-n002-g03","revision":1,"path":["马原","第四章 资本理论","考点1：资本积累"],"type":"group","title":"资本积累：后果","question":"资本积累：后果的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"5.后果：（1）资本积累就是依靠剥削工人所创造的剩余价值而实现的，没有剩余价值，就不可能有资本积累；（2）资本积累不但是社会财富占有两极分化的重要原因，而且是资本主义社会失业现象产生的根源；（3）随着资本积累而产生的失业是由资本追逐剩余价值引起资本有机构成的提高所导致的。","notes":"","source":"苏一《27命题点高清图谱》印刷第29页；按原分支整理","source_pages":[29],"source_pdf_pages":[34],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p034_n015","p034_n016","p034_n017","p034_n018"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p034_a001","kind":"政治素养","text":"抽象劳动是价值的唯一源泉；雇佣劳动者的剩余劳动是剩余价值产生的唯一源泉；具体劳动不能用价值的衡量，不能用来。资本积累不是资本主义扩大再生产的源泉。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a002","kind":"政治素养","text":"资本有机构成由技术构成决定并反映技术构成变化；资本有机构成提高导致可变资本相对减少和相对过剩人口形成。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a003","kind":"政治素养","text":"资本积聚以剩余价值资本化为基础；资本集中是现有资本合并，竞争和信用是最有力的杠杆。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":92},{"id":"suyi-marx-p029-n002-g04","revision":1,"path":["马原","第四章 资本理论","考点1：资本积累"],"type":"group","title":"资本积累：资本有机构成","question":"资本积累：资本有机构成的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"6.资本有机构成：三种形式：（1）资本的技术构成（数量：数量）：由生产的技术水平所决定的生产资料和劳动力之间的比例；技术水平越高，每个劳动力推动的生产资料数量越多；反之则越少；（2）资本的价值构成（钱：钱）：资本的价值形式：不变资本和可变资本之间的比例；关键词：价格、成本；（3）资本的有机构成：由资本的技术构成决定并反映技术构成变化的资本价值构成；用c:v表示，c为不变资本，v为可变资本；资本有机构成提高的趋势：动因：在资本主义生产过程中，资本有机构成的提高是一般趋势，这是由资本的本性决定的；资本主义生产的唯一动机和直接目的就是追求剩余价值，这决定了资本有机构成必然提高；为了达到这一目的，资本家便尽可能改进技术，提高劳动生产率，加快资本积累，通过资本积聚和资本集中扩大生产规模；实现方式：（1）资本积聚：个别资本通过剩余价值的资本化来增大资本的总量；（2）资本集中：个别资本通过结合而形成较大的资本，竞争和信用是资本集中最强有力的杠杆；过程表现：（1）在自然形式上，每个劳动力所推动的生产资料的数量大幅度增加；（2）在价值形式上，不变资本部分日益增多，可变资本在资本总额中所占的比重日益下降，从而资本有机构成得以不断提高；直接影响：在资本有机构成提高的情况下，由于可变资本的相对量减少，资本对劳动力的需求日益相对减少，其结果就是不可避免地造成大批工人失业，形成相对过剩人口。","notes":"","source":"苏一《27命题点高清图谱》印刷第29页；按原分支整理","source_pages":[29],"source_pdf_pages":[34],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p034_n019","p034_n020","p034_n021","p034_n022","p034_n023","p034_n024","p034_n025","p034_n026","p034_n027","p034_n028","p034_n029","p034_n030","p034_n031","p034_n032","p034_n033","p034_n034"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p034_a001","kind":"政治素养","text":"抽象劳动是价值的唯一源泉；雇佣劳动者的剩余劳动是剩余价值产生的唯一源泉；具体劳动不能用价值的衡量，不能用来。资本积累不是资本主义扩大再生产的源泉。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a002","kind":"政治素养","text":"资本有机构成由技术构成决定并反映技术构成变化；资本有机构成提高导致可变资本相对减少和相对过剩人口形成。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a003","kind":"政治素养","text":"资本积聚以剩余价值资本化为基础；资本集中是现有资本合并，竞争和信用是最有力的杠杆。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":93},{"id":"suyi-marx-p029-n002-g05","revision":1,"path":["马原","第四章 资本理论","考点1：资本积累"],"type":"group","title":"资本积累：相对过剩人口、资本积累的历史趋势","question":"资本积累：相对过剩人口、资本积累的历史趋势有哪些阶段、重要节点及其意义？","answer":"7.相对过剩人口：含义：劳动力供给超过了资本的需要；相对：不是社会生产发展绝对不需要，是由于他们不为资本价值增殖所需要；三种形式：流动的过剩人口、潜在的过剩人口、停滞的过剩人口。\n\n8.资本积累的历史趋势：资本积累的历史趋势是资本主义制度的必然灭亡和社会主义制度的必然胜利","notes":"","source":"苏一《27命题点高清图谱》印刷第29页；按原分支整理","source_pages":[29],"source_pdf_pages":[34],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p034_n035","p034_n036","p034_n037","p034_n038","p034_n039"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p034_a001","kind":"政治素养","text":"抽象劳动是价值的唯一源泉；雇佣劳动者的剩余劳动是剩余价值产生的唯一源泉；具体劳动不能用价值的衡量，不能用来。资本积累不是资本主义扩大再生产的源泉。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a002","kind":"政治素养","text":"资本有机构成由技术构成决定并反映技术构成变化；资本有机构成提高导致可变资本相对减少和相对过剩人口形成。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a003","kind":"政治素养","text":"资本积聚以剩余价值资本化为基础；资本集中是现有资本合并，竞争和信用是最有力的杠杆。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":94},{"id":"suyi-marx-p029-n002-g06","revision":1,"path":["马原","第四章 资本理论","考点1：资本积累"],"type":"group","title":"资本积累：意义","question":"资本积累：意义体现在哪些方面？相关定位和适用条件是什么？","answer":"9.意义：（1）马克思关于资本积累的理论是剩余价值理论的重要组成部分；（2）它揭示了资本主义制度下贫富两极分化的原因；（3）揭示了资本主义失业现象的本质；（4）深刻地阐明了资本主义制度必然走向灭亡的历史命运。","notes":"","source":"苏一《27命题点高清图谱》印刷第29页；按原分支整理","source_pages":[29],"source_pdf_pages":[34],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p034_n040","p034_n041","p034_n042","p034_n043","p034_n044"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p034_a001","kind":"政治素养","text":"抽象劳动是价值的唯一源泉；雇佣劳动者的剩余劳动是剩余价值产生的唯一源泉；具体劳动不能用价值的衡量，不能用来。资本积累不是资本主义扩大再生产的源泉。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a002","kind":"政治素养","text":"资本有机构成由技术构成决定并反映技术构成变化；资本有机构成提高导致可变资本相对减少和相对过剩人口形成。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p034_a003","kind":"政治素养","text":"资本积聚以剩余价值资本化为基础；资本集中是现有资本合并，竞争和信用是最有力的杠杆。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":95},{"id":"suyi-marx-p030-n002-g01","revision":1,"path":["马原","第四章 资本理论","考点2：资本循环"],"type":"group","title":"资本循环","question":"资本循环的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.含义：资本从一种形式出发，经过一系列形式的变化，又回到原来出发点的运动\n\n2.产业资本在循环中的三个阶段及其执行的三种不同职能：（1）购买阶段（货币资本的职能）：购买生产资料和劳动力；（2）生产阶段（生产资本的职能）：生产价值和剩余价值；（3）售卖阶段（商品资本的职能）：出售商品，实现剩余价值。\n\n3.产业资本运动的两个基本前提条件：（1）产业资本的三种职能形式必须在空间上并存，即产业资本按照一定比例同时存在于货币资本、生产资本和商品资本三种形式中；（2）产业资本的三种职能形式必须在时间上继起，即三种职能形式的转化必须保持时间上的依次连续性。","notes":"","source":"苏一《27命题点高清图谱》印刷第30页；按原分支整理","source_pages":[30],"source_pdf_pages":[35],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p035_n003","p035_n004","p035_n005","p035_n006","p035_n007","p035_n008","p035_n009","p035_n010"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p035_a001","kind":"政治素养","text":"产业资本的连续循环是流通过程和生产过程的统一，也是它的三种职能形式循环、即货币资本循环、生产资本循环和商品资本循环的统一。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p035_a002","kind":"政治素养","text":"要加快资本周转速度，就得更多的利用资本价值，就要缩短资本周转时间，加快流动资本的周转速度。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p035_a003","kind":"政治素养","text":"由于每次资本周转带来的剩余价值是固定的，所以周转次数越多，年剩余价值量和年剩余价值率越大。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p035_a004","kind":"政治素养","text":"经济危机虽然是破坏性的，但它用全社会生产工具失业的方式，把多余的产品和资本等在破坏中重新调节，强制生产重新进行。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":96},{"id":"suyi-marx-p030-n011-g01","revision":1,"path":["马原","第四章 资本理论","考点3：资本周转"],"type":"group","title":"资本周转","question":"围绕资本周转，影响资本周转快慢的两个关键因素、公式总结分别是什么？","answer":"1.含义：资本是在运动中增殖的，必须不断地、周而复始地循环，才能不断地带来剩余价值。这种周而复始、不断反复着的资本循环，就叫作资本的周转\n\n2.目的：如果每次资本周转带来的剩余价值一定，则资本周转越快，在一定时期内带来的剩余价值就越多\n\n3.影响资本周转快慢的两个关键因素：（1）资本周转的时间：周转时间越短，周转速度越快；（2）生产资本的固定资本和流动资本的构成：①固定资本越多，周转越慢；②流动资本越多，周转越快。\n\n4.资本循环与周转规律作用的发挥，必然受到经济制度因素的制约：（1）资本正常周转需要两个条件：三种职能形式在空间上并存、在时间上继起；（2）资本主义基本矛盾和周期性爆发的经济危机，会破坏这些条件，使资本连续、高速周转难以实现。\n\n5.公式总结：资本周转次数：资本周转次数越多说明资本周转速度越快（n表示次数）；（1）剩余价值量：每次资本周转带来的剩余价值与可变资本的比例，即m/v（与周转次数无关）；（2）年剩余价值量：一年中总的剩余价值量，用M表示：M=m×n（m为每次周转带来的剩余价值，n为一年中周转的次数）；（3）年剩余价值率：M'=（m/v）×n（m/v为每次周转的剩余价值率，n为一年中周转的次数）。","notes":"","source":"苏一《27命题点高清图谱》印刷第30页；按原分支整理","source_pages":[30],"source_pdf_pages":[35],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p035_n012","p035_n013","p035_n014","p035_n015","p035_n016","p035_n017","p035_n018","p035_n019","p035_n020","p035_n021","p035_n022","p035_n023","p035_n024"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p035_a001","kind":"政治素养","text":"产业资本的连续循环是流通过程和生产过程的统一，也是它的三种职能形式循环、即货币资本循环、生产资本循环和商品资本循环的统一。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p035_a002","kind":"政治素养","text":"要加快资本周转速度，就得更多的利用资本价值，就要缩短资本周转时间，加快流动资本的周转速度。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p035_a003","kind":"政治素养","text":"由于每次资本周转带来的剩余价值是固定的，所以周转次数越多，年剩余价值量和年剩余价值率越大。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p035_a004","kind":"政治素养","text":"经济危机虽然是破坏性的，但它用全社会生产工具失业的方式，把多余的产品和资本等在破坏中重新调节，强制生产重新进行。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":97},{"id":"suyi-marx-p030-n025-g01","revision":1,"path":["马原","第四章 资本理论","考点4：社会再生产"],"type":"group","title":"社会再生产","question":"围绕社会再生产，核心问题、分析社会再生产的两个基本理论前提、社会再生产的实现条件、资本主义条件下的结果分别是什么？","answer":"1.含义：社会生产是连续不断地进行的，这种连续不断重复的生产就是社会再生产\n\n2.核心问题：社会总产品的实现问题，即社会总产品的价值补偿和实物补偿问题；社会总产品：社会在一定时期（通常为一年）所生产的全部物质资料的总和；（1）价值补偿：生产中所耗费的资本得到价值补偿（表现形式）；（2）实物补偿：生产过程中所耗费的生产资料和消费资料得到实物的替换（实物到）。\n\n3.分析社会再生产的两个基本理论前提：（1）价值组成：三部分——社会总产品的价值分为c（不变资本）、v（可变资本）、m（剩余价值）三部分；（2）物质划分：两大部类——①第一部类：生产生产资料的部门；②第二部类：生产消费资料的部门。\n\n4.社会再生产的实现条件：（1）根本要求：社会总产品必须同时实现价值补偿和实物补偿；（2）客观规律：两大部类之间、两大部类内部各个产业部门之间，必须保持合理的比例关系，生产规模和结构要协调，再生产才能顺利进行。\n\n5.资本主义条件下的结果：比例失衡与经济危机；（1）资本主义私有制和雇佣劳动，决定了两大部类的生产具有盲目性，比例经常失衡；（2）这种失衡会导致生产过剩，社会总产品无法实现，即实物替换和价值补偿难以顺利进行，最终引发经济危机；（3）经济危机是资本主义条件下以强制的方式解决社会再生产失衡问题的暴力手段。","notes":"","source":"苏一《27命题点高清图谱》印刷第30页；按原分支整理","source_pages":[30],"source_pdf_pages":[35],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p035_n026","p035_n027","p035_n028","p035_n029","p035_n030","p035_n031","p035_n032","p035_n033","p035_n034","p035_n035","p035_n036","p035_n037","p035_n038","p035_n039","p035_n040","p035_n041","p035_n042"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p035_a001","kind":"政治素养","text":"产业资本的连续循环是流通过程和生产过程的统一，也是它的三种职能形式循环、即货币资本循环、生产资本循环和商品资本循环的统一。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p035_a002","kind":"政治素养","text":"要加快资本周转速度，就得更多的利用资本价值，就要缩短资本周转时间，加快流动资本的周转速度。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p035_a003","kind":"政治素养","text":"由于每次资本周转带来的剩余价值是固定的，所以周转次数越多，年剩余价值量和年剩余价值率越大。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p035_a004","kind":"政治素养","text":"经济危机虽然是破坏性的，但它用全社会生产工具失业的方式，把多余的产品和资本等在破坏中重新调节，强制生产重新进行。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":98},{"id":"suyi-marx-p031-n002-g01","revision":1,"path":["马原","第四章 资本理论","考点5：资本主义的基本矛盾与经济危机"],"type":"group","title":"资本主义的基本矛盾与经济危机","question":"围绕资本主义的基本矛盾与经济危机，资本主义基本矛盾、经济危机分别是什么？","answer":"1.资本主义基本矛盾：生产社会化和生产资料资本主义私人占有之间的矛盾。\n\n2.经济危机：本质特征：生产相对过剩：这种过剩不是产品多到没人要的绝对过剩，而是相对于劳动人民有支付能力的需求来说，社会生产的商品显得过剩；原因：形式上的可能性：经济危机的抽象的一般的可能性，首先是由货币作为流通手段和支付手段引起的；根本原因：资本主义经济危机爆发的根本原因是资本主义的基本矛盾，这一基本矛盾具体表现在以下两个方面：；（1）生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾；（2）单个企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾；特点：具有周期性：（1）资本主义经济危机具有周期性，这是由资本主义基本矛盾运动的阶段性决定的；（2）资本主义经济危机周期性爆发的特点，使社会资本再生产也呈现出周期性特点；（3）社会资本再生产包括四个阶段：危机→萧条→复苏→高涨，其中危机是必经阶段。","notes":"","source":"苏一《27命题点高清图谱》印刷第31页；按原分支整理","source_pages":[31],"source_pdf_pages":[36],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p036_n003","p036_n004","p036_n005","p036_n006","p036_n007","p036_n008","p036_n009","p036_n010","p036_n011","p036_n012","p036_n013","p036_n014","p036_n015","p036_n016","p036_n017","p036_n018","p036_n019","p036_n020"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p036_a001","kind":"other","text":"这仅仅是危机在形式上的可能性","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p036_a002","kind":"政治素养","text":"政治素养：\n1.当资本主义基本矛盾激化到一定程度，社会生产结构严重失调，就会引发经济危机\n2.经济危机的爆发，使企业纷纷倒闭，生产大幅下降，从而使供求矛盾得到缓解，逐步渡过经济危机\n3.但是，经济危机只能得到暂时缓解，而资本主义基本矛盾无法根除\n4.随着资本主义经济的恢复和高涨，资本主义基本矛盾又重新激化，必然导致再一次经济危机的爆发。只要存在资本主义制度，经济危机就是不可避免的","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":99},{"id":"suyi-marx-p031-n021-g01","revision":1,"path":["马原","第四章 资本理论","考点6：资本主义上层建筑"],"type":"group","title":"资本主义上层建筑","question":"围绕资本主义上层建筑，资本主义政治制度及其本质、资本主义意识形态分别是什么？","answer":"1.资本主义政治制度及其本质：（1）资本主义国家的职能和本质：职能：对内：实行政治统治和社会管理（社会管理服务于政治统治）；对外：进行国际交往和维护国家安全及利益：对外的职能是对内政治统治职能的延伸，是服务于其政治统治的；本质：为资产阶级服务，是资产阶级进行阶级统治的工具；（2）资本主义的民主制度及其本质：民主制度包括：资本主义法律制度（重要内容）、政权组织形式、选举制度、政党制度等：资本主义法律制度：宪法是资本主义国家法律制度的核心；资本主义宪法建立的基本原则：①私有制原则；②主权在民原则；③分权制衡原则；④人权原则；政权组织形式：资本主义国家政权采取分权制衡的组织形式；即国家的立法权、行政权、司法权分别由三个权力主体独立行使，形成各主体之间的“制衡”；本质：资本主义政治制度本质上是资产阶级实行政治统治和社会管理的手段和方式，是为资产阶级专政服务的；（3）资本主义政治制度的评价：进步作用：①推动了社会生产力的大幅度发展，促进了社会进步；②使人们享有了比在封建专制主义条件下更多的政治自由；③资本主义政治制度积累了相当丰富的政治统治和社会管理的经验，对推动社会进步有着积极意义；局限性：①资本主义的民主是金钱操纵下的民主，实际是资产阶级精英统治下的民主；②法律名义上的平等掩盖着事实上的不平等；③资本主义国家的政党制是一种维护资产阶级统治的政治制度；④政党恶斗相互掣肘时，决策效率低下，激化社会矛盾。\n\n2.资本主义意识形态：内涵：是在资本主义国家中占统治地位、反映了作为统治阶级的资产阶级利益和要求的各种思想理论和观念的总和；本质：（1）资本主义意识形态是资本主义社会的观念上层建筑，是为资本主义的经济基础服务的，因而是为资本主义国家的政治上层建筑服务的；（2）资本主义意识形态是资产阶级的阶级意识的集中体现；评价方法：对于资本主义意识形态，应该用辩证的观点来分析。","notes":"","source":"苏一《27命题点高清图谱》印刷第31页；按原分支整理","source_pages":[31],"source_pdf_pages":[36],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p036_n022","p036_n023","p036_n024","p036_n025","p036_n026","p036_n027","p036_n028","p036_n029","p036_n030","p036_n031","p036_n032","p036_n033","p036_n034","p036_n035","p036_n036","p036_n037","p036_n038","p036_n039","p036_n040","p036_n041","p036_n042","p036_n043","p036_n044","p036_n045","p036_n046","p036_n047","p036_n048","p036_n049","p036_n050","p036_n051","p036_n052","p036_n053","p036_n054","p036_n055","p036_n056","p036_n057","p036_n058","p036_n059","p036_n060","p036_n061","p036_n062","p036_n063"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":100},{"id":"suyi-marx-p032-n003-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点1：生产集中与垄断的形成"],"type":"group","title":"生产集中与垄断的形成","question":"围绕生产集中与垄断的形成，资本主义发展的两个阶段、生产集中与资本集中、垄断分别是什么？","answer":"1.资本主义发展的两个阶段：（1）自由竞争资本主义；（2）垄断资本主义：包括私人垄断资本主义和国家垄断资本主义两种形式；私人垄断资本主义是在生产集中和资本集中的基础上形成的。\n\n2.生产集中与资本集中：（1）形成原因 生产集中和资本集中是资本家追求剩余价值的结果；（2）生产集中 指生产资料、劳动力和商品的生产日益集中于少数大企业的过程，其结果是大企业在整个社会生产中所占的比重不断增加；（3）资本集中 指大资本吞并小资本，或由许多小资本合并而成大资本的过程，其结果是越来越多的资本为少数大资本家所支配。\n\n3.垄断：含义 指少数资本主义大企业为了获得高额利润，通过相互协议或联合，对一个或几个部门商品的生产、销售和价格进行操纵和控制；产生原因：（1）当生产集中发展到相当高的程度，极少数企业就会联合起来，操纵和控制本部门的生产和销售，实行垄断，以获得高额利润；（2）企业规模巨大，形成对竞争的限制，也会产生垄断；（3）激烈的竞争给竞争各方带来的损失越来越严重，为了避免两败俱伤，企业之间会达成妥协，联合起来，实行垄断；实现方式：（1）垄断是通过一定的垄断组织实现的。常见的垄断组织：卡特尔、辛迪加、托拉斯、康采恩；（2）垄断组织本质上是一样的，即通过联合独占市场、操纵垄断价格，以攫取高额垄断利润；（3）最简单的、初级的垄断组织形式是短期价格协定 这种垄断组织的稳定性比较弱，一旦市场情况发生变化，便会自行解体。","notes":"","source":"苏一《27命题点高清图谱》印刷第32页；按原分支整理","source_pages":[32],"source_pdf_pages":[37],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p037_n004","p037_n005","p037_n006","p037_n007","p037_n008","p037_n009","p037_n010","p037_n011","p037_n012","p037_n013","p037_n014","p037_n015","p037_n016","p037_n017","p037_n018","p037_n019","p037_n020","p037_n021","p037_n022"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p037_a002","kind":"政治素养","text":"政治素养：自由竞争引起生产集中和资本集中，生产集中和资本集中发展到一定阶段必然引起垄断，这是资本主义发展的客观规律","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":101},{"id":"suyi-marx-p032-n023-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点2：垄断条件下竞争的特点"],"type":"group","title":"垄断条件下竞争的特点","question":"垄断条件下竞争的特点包括哪几方面？每项具体表现为什么？","answer":"1.垄断不能消除竞争，反而使竞争更复杂激烈（原因）：（1）垄断没有消除产生竞争的经济条件；（2）垄断必须通过竞争来维持；（3）社会生产是复杂多样的，任何垄断组织都不可能把包罗万象的社会生产全部包下来。\n\n2.垄断条件下的竞争，具有一些新特点：（1）在竞争目的上 是为获取高额垄断利润，并不断巩固和扩大自己的垄断地位和统治权力；（2）在竞争手段上 垄断条件下的竞争除了采取各种形式的经济手段外，还采取非经济的手段，使竞争变得更加复杂、激烈；（3）在竞争范围上 在垄断时期，国际市场上的竞争越来越激烈，不仅经济领域的竞争多种多样，而且还扩大到经济领域以外。","notes":"","source":"苏一《27命题点高清图谱》印刷第32页；按原分支整理","source_pages":[32],"source_pdf_pages":[37],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p037_n024","p037_n025","p037_n026","p037_n027","p037_n028","p037_n029","p037_n030","p037_n031"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p037_a003","kind":"政治素养","text":"政治素养：在垄断条件下，在垄断组织内部、垄断组织之间以及垄断资本家集团之间，垄断组织同非垄断组织之间以及中小企业之间，都存在广泛而激烈的竞争","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p037_a004","kind":"政治素养","text":"政治素养：垄断条件下的竞争，不仅规模大、时间长、手段残酷、程度激烈，而且具有更大的破坏性","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":102},{"id":"suyi-marx-p032-n032-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点3：金融资本与金融寡头"],"type":"group","title":"金融资本与金融寡头","question":"围绕金融资本与金融寡头，金融资本、金融寡头分别是什么？","answer":"1.金融资本：含义 由工业垄断资本和银行垄断资本融合在一起而形成的一种垄断资本；形成的主要途径 ①金融联系 ②资本参与 ③人事参与。\n\n2.金融寡头：（1）含义 是指操纵国民经济命脉，并在实际上控制国家政权的少数垄断资本家或垄断资本家集团：他们支配了大量的社会财富，控制了整个国家的经济命脉和上层建筑，是垄断资本主义国家事实上的统治者；（2）统治的方式：①经济领域 主要是通过“参与制”实现的 即金融寡头通过掌握一定数量的股票来层层控制企业的制度；②对国家机器的控制 主要是通过同政府的“个人联合”来实现的。这种联合有多种途径，如：金融寡头直接把自己的代理人送进政府或议会，通过掌握政权，利用政治力量为其垄断统治服务；收买政府高官或国会议员，让他们在其政治活动中为金融寡头的利益服务；聘请曾在政府任职的高官到公司担任高级职务等；③金融寡头还通过建立政策咨询机构等方式对政府的政策施加影响。","notes":"","source":"苏一《27命题点高清图谱》印刷第32页；按原分支整理","source_pages":[32],"source_pdf_pages":[37],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p037_n033","p037_n034","p037_n035","p037_n036","p037_n037","p037_n038","p037_n039","p037_n040","p037_n041","p037_n042","p037_n043","p037_n044","p037_n045"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p037_a005","kind":"政治素养","text":"政治素养：通过掌握新闻出版、广播电视、科学教育、文化体育等上层建筑的各个领域，左右国家的内政外交及社会生活","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":103},{"id":"suyi-marx-p032-n046-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点4：垄断利润和垄断价格"],"type":"group","title":"垄断利润和垄断价格","question":"围绕垄断利润和垄断价格，垄断利润的来源、垄断利润的实现形式、垄断价格的产生没有否定价值规律分别是什么？","answer":"1.垄断资本的实质：在于获取垄断利润：垄断利润是垄断资本家凭借其在社会生产和流通中的垄断地位而获得的超过平均利润的高额利润。\n\n2.垄断利润的来源：（1）通过对本国无产阶级和其他劳动人民剥削的加强获得更多利润；（2）通过垄断高价和垄断低价来控制市场，获得一些其他企业特别是非垄断企业的利润；（3）通过加强对其他国家劳动人民的剥削和掠夺从国外获取利润；（4）通过资本主义国家政权进行有利于垄断资本的再分配，从而将劳动人民创造的国民收入的一部分变成垄断资本的收入。\n\n3.垄断利润的实现形式：（1）通过垄断组织制定的垄断价格来实现的；（2）垄断价格：含义 垄断组织在销售或购买商品时，凭借其垄断地位规定的、旨在保证获取最大限度利润的市场价格；①垄断高价 指垄断组织出售商品时规定的高于生产价格的价格；②垄断低价 指垄断组织在购买非垄断企业所生产的原材料等生产资料时规定的低于生产价格的价格；（3）垄断价格 = 成本价格（c+v）+ 平均利润 + 垄断利润。\n\n4.垄断价格的产生没有否定价值规律：（1）垄断组织操纵价格带来的结果是抑制了市场上价格的自由波动，垄断价格一定时期内背离生产价格和价值；（2）但是，从全社会看，整个社会商品的价值仍然是由生产它们的社会必要劳动时间决定的；（3）垄断价格既不能增加也不能减少整个社会所生产的价值总量，它只是对商品价值和剩余价值作了有利于垄断资本的再分配；（4）从全社会看，商品的价格总额仍然等于商品的价值总额；（5）所以，垄断价格的产生没有否定价值规律，它是价值规律在垄断资本主义阶段作用的具体体现。","notes":"","source":"苏一《27命题点高清图谱》印刷第32页；按原分支整理","source_pages":[32],"source_pdf_pages":[37],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p037_n047","p037_n048","p037_n049","p037_n050","p037_n051","p037_n052","p037_n053","p037_n054","p037_n055","p037_n056","p037_n057","p037_n058","p037_n059","p037_n060","p037_n061","p037_n062","p037_n063","p037_n064","p037_n065","p037_n066"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p037_a006","kind":"政治素养","text":"政治素养：1.垄断利润的形成，关键在于垄断组织在经济生活中起了决定性作用，从而阻碍了资本在各部门之间的自由转移，限制了利润平均化的趋势，这样一来，垄断资本家有可能长期获得大大超过平均利润的垄断利润 2.垄断资本所获得的高额利润，归根到底来自无产阶级和其他劳动人民所创造的剩余价值","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p037_a007","kind":"政治素养","text":"政治素养：1.垄断的形成并不能增加价值总量，垄断本身也不能创造价值或剩余价值，垄断价格的制定也不能完全脱离价值 2.垄断价格虽然没有否定价值规律，但是价值规律作用的形式发生变化了","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":104},{"id":"suyi-marx-p033-n003-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点5：国家垄断资本主义的形成及作用"],"type":"group","title":"国家垄断资本主义的形成及作用","question":"国家垄断资本主义的形成及作用体现在哪些方面？相关定位和适用条件是什么？","answer":"1.含义：国家垄断资本主义是国家政权和私人垄断资本融合在一起的垄断资本主义；国家垄断资本主义的产生，是垄断资本主义生产关系在自身范围内的部分质变，标志着资本主义发展进入了新的阶段；它是科技进步和生产社会化程度进一步提高的产物，是资本主义基本矛盾进一步尖锐化的必然结果。\n\n2.形成原因：（1）社会生产力的发展，要求资本主义生产资料在更大范围内被支配，从而促进了国家垄断资本主义的产生；（2）经济波动和经济危机的深化，推动国家垄断资本主义的产生；（3）缓和社会矛盾、协调利益关系的需求，促使国家垄断资本主义的产生。\n\n3.主要形式：（1）国家所有并直接经营企业；（2）国家与私人共有、合营企业；（3）国家通过多种形式参与私人垄断资本的再生产过程；（4）宏观调节：运用财政政策和货币政策等经济手段调节社会总供给和总需求；基本目标　①经济快速增长　②充分就业　③物价稳定　④国际收支平衡；（5）微观规制：国家运用法律手段规范市场秩序，限制垄断，保护竞争，维护社会公众的合法权益；三种类型　①反托拉斯法　②公共事业规制　③社会经济规制。\n\n4.作用：积极作用：（1）国家垄断资本主义的出现在一定程度上有利于社会生产力的发展；（2）在一定范围内突破了私人垄断资本的狭隘界限，国家对经济的干预在一定程度上适应了社会化大生产的要求，有利于缓解资本主义生产的无政府状态，促进社会经济较为协调地发展；（3）通过国家的收入再分配手段，劳动人民生活水平有所改善和提高；（4）加快了资本主义国家国民经济的现代化进程；消极作用：（1）加大了对劳动人民的剥削和掠夺；（2）国家垄断资本主义的出现是资本主义经济制度内的经济关系调整；（3）并没有从根本上消除资本主义的基本矛盾。\n\n5.实质：私人垄断资本利用国家机器来为其发展服务的手段，是私人垄断资本为了维护垄断统治和获取高额垄断利润，而与国家政权相结合的一种垄断资本主义形式。","notes":"","source":"苏一《27命题点高清图谱》印刷第33页；按原分支整理","source_pages":[33],"source_pdf_pages":[38],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p038_n004","p038_n005","p038_n006","p038_n007","p038_n008","p038_n009","p038_n010","p038_n011","p038_n012","p038_n013","p038_n014","p038_n015","p038_n016","p038_n017","p038_n018","p038_n019","p038_n020","p038_n021","p038_n022","p038_n023","p038_n024","p038_n025","p038_n026","p038_n027","p038_n028","p038_n029","p038_n030","p038_n031","p038_n032","p038_n033"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p038_a001","kind":"政治素养","text":"政治素养：\n1.国家垄断资本主义的出现并没有根本改变垄断资本主义的性质\n2.国家垄断资本主义在本质上是资产阶级国家力量同垄断组织力量结合在一起的垄断资本主义","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":105},{"id":"suyi-marx-p033-n034-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点6：金融垄断资本的发展"],"type":"group","title":"金融垄断资本的发展","question":"围绕金融垄断资本的发展，形成和壮大的重要制度条件、金融垄断资本快速发展的表现、作用（影响）分别是什么？","answer":"1.形成和壮大的重要制度条件：金融自由化与金融创新。\n\n2.金融垄断资本快速发展的表现：（1）在金融垄断资本的推动下，垄断资本主义的金融化程度不断提高；（2）金融业在国民经济中的地位大幅上升，金融资本在资本主义国家国内生产总值和利润总额中所占的比例越来越大；（3）随着实体经济的资本利润率下降，面对激烈竞争，实体经济部门不得不把利润的一部分投向金融领域，导致金融资本的急剧膨胀；（4）制造业就业人数严重减少，以金融为核心的服务业就业人数逐步增加；（5）虚拟经济越来越脱离实体经济。\n\n3.作用（影响）：（1）金融垄断资本的发展，一方面促进了资本主义经济的发展；（2）另一方面也造成了经济过度虚拟化，导致金融危机频繁发生，不仅给资本主义经济带来灾难，也给全球经济带来灾难。","notes":"","source":"苏一《27命题点高清图谱》印刷第33页；按原分支整理","source_pages":[33],"source_pdf_pages":[38],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p038_n035","p038_n036","p038_n037","p038_n038","p038_n039","p038_n040","p038_n041","p038_n042","p038_n043","p038_n044","p038_n045"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":106},{"id":"suyi-marx-p033-n046-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点7：垄断资本向世界范围的扩展"],"type":"group","title":"垄断资本向世界范围的扩展","question":"垄断资本向世界范围的扩展的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.经济动因：（1）钱　将国内过剩的资本输出，以便在国外谋求高额利润；（2）技术　将部分非要害的技术转移到国外，以取得在别国的垄断优势，攫取高额垄断利润；（3）商品　争夺商品销售市场；（4）原料　确保原材料和能源的可靠来源。\n\n2.基本形式：（1）借贷资本输出；（2）生产资本输出；（3）商品资本输出。\n\n3.从输出资本的主体看，主要有两种：（1）私人资本输出；（2）国家资本输出。\n\n4.实现形式：垄断资本向世界范围的扩展是通过跨国公司这一国际垄断组织实现的。\n\n5.社会经济后果：对资本输出国的影响：（1）资本输出为其带来了巨额利润，加速资本积累，增强垄断资本的实力；（2）资本输出带动和扩大了商品输出，巩固和扩大了垄断资本的销售市场和投资场所；（3）对发展中国家的经济命脉形成控制，进一步巩固和扩大了垄断优势地位；对资本输入国的影响（主要是发展中国家）：积极作用：（1）吸收了经济发展所需要的资金，为经济发展提供了条件；（2）引进了比较先进的机器设备和工艺技术，同时培训了技术人员、熟练工人和经营管理人员；（3）利用外资和技术，建立一批现代工业，优化了产业结构；（4）利用外资扩大生产，促进了对外贸易的发展；（5）推动经济的发展，增加就业机会，提高了收入水平；消极作用：（1）付出了较大的经济代价以及环境污染、能源资源消耗的代价；（2）产业调整和布局有可能受制于外资的投资战略；（3）外来资本和跨国公司投资增加，冲击本国的民族工业，并影响到国民经济的控制权；（4）债务负担加重，影响经济的持续稳定发展；（5）对国际资本的依赖性增强，容易受到国际经济波动的影响。","notes":"","source":"苏一《27命题点高清图谱》印刷第33页；按原分支整理","source_pages":[33],"source_pdf_pages":[38],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p038_n047","p038_n048","p038_n049","p038_n050","p038_n051","p038_n052","p038_n053","p038_n054","p038_n055","p038_n056","p038_n057","p038_n058","p038_n059","p038_n060","p038_n061","p038_n062","p038_n063","p038_n064","p038_n065","p038_n066","p038_n067","p038_n068","p038_n069","p038_n070","p038_n071","p038_n072","p038_n073","p038_n074","p038_n075","p038_n076","p038_n077","p038_n078"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p038_a002","kind":"政治素养","text":"政治素养：\n经济动因与垄断资本主义政治上、文化上、外交上的利益紧密联系在一起，交织发挥作用，共同促进垄断资本向世界范围的扩展","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":107},{"id":"suyi-marx-p034-n003-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点8：垄断资本国际化条件下的垄断组织"],"type":"group","title":"垄断资本国际化条件下的垄断组织","question":"垄断资本国际化条件下的垄断组织有哪些？各项依据和相互关系是什么？","answer":"1.国际垄断同盟的产生：(1)各资本主义国家的垄断组织通过订立协议建立起国际垄断资本的联盟，即国际垄断同盟：国际垄断同盟在经济上瓜分世界是通过垄断组织间的协议实现的　协议的订立、瓜分的结果又以经济实力为后盾和基础；(2)实现：①早期　国际卡特尔；②当代国际垄断同盟的形式　以国家垄断资本主义的国际联盟为主（如：七国集团、欧洲联盟）。\n\n2.国际经济调节机制：在协商和合作的基础上，国际垄断资本还建立起国际经济调节体系，以加强国际协调；(1)国际经济协调的具体形式包括各种国际经济组织、国际经济协议以及地区性的经济组织和集团等；(2)第二次世界大战以来，从事国际经济协调、维护国际经济秩序的国际经济组织主要有三个：①国际货币基金组织；②世界银行；③世界贸易组织。\n\n3.垄断资本国际化条件下各种形式的国际垄断组织、国际垄断同盟和国际经济协调机构的发展：(1)加快了资本、技术等生产要素在国际的流动；(2)推动了商品和服务贸易额的迅速增加；(3)加强了各国之间的经济联系；(4)促进了经济全球化的发展。","notes":"","source":"苏一《27命题点高清图谱》印刷第34页；按原分支整理","source_pages":[34],"source_pdf_pages":[39],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p039_n004","p039_n005","p039_n006","p039_n007","p039_n008","p039_n009","p039_n010","p039_n011","p039_n012","p039_n013","p039_n014","p039_n015","p039_n016","p039_n017","p039_n018","p039_n019","p039_n020","p039_n021"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p039_a001","kind":"政治素养","text":"政治素养：这只能在一定程度上缓和局部范围的经济波动，难以对全球性经济波动和经济危机发挥有效的协调作用","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":108},{"id":"suyi-marx-p034-n022-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点9：垄断资本主义的基本特征和实质"],"type":"group","title":"垄断资本主义的基本特征和实质","question":"垄断资本主义的基本特征和实质包括哪几方面？每项具体表现为什么？","answer":"1.列宁指出，资本主义发展到垄断资本主义，进而发展到帝国主义，便具有五个基本特征：(1)垄断组织在经济生活中起决定作用；(2)在金融资本的基础上，形成金融寡头的统治；(3)资本输出有了特别重要的意义；(4)瓜分世界的资本家国际垄断同盟已经形成；(5)最大资本主义大国已把世界上的领土瓜分完毕。\n\n2.这些特征集中体现了帝国主义的实质，即垄断资本凭借垄断地位，获取高额垄断利润","notes":"","source":"苏一《27命题点高清图谱》印刷第34页；按原分支整理","source_pages":[34],"source_pdf_pages":[39],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p039_n023","p039_n024","p039_n025","p039_n026","p039_n027","p039_n028","p039_n029"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p039_a002","kind":"政治素养","text":"政治素养：为了获取高额垄断利润，垄断资本对内通过“参与制”和同政府的“个人联合”谋求从经济到政治对整个国家的统治；对外运用经济、政治甚至战争的手段进行扩张，谋求对整个世界经济和政治的控制","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":109},{"id":"suyi-marx-p034-n030-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点10：经济全球化及其影响"],"type":"group","title":"经济全球化及其影响","question":"围绕经济全球化及其影响，经济全球化的表现、经济全球化的动因、经济全球化的影响分别是什么？","answer":"1.经济全球化的表现：(1)生产全球化：是指随着国际分工进一步深化，生产某些高新技术产品不再由某个国家单独完成，而是多个国家协作完成；以跨国界组织为核心　以全球化体系为标志；(2)贸易全球化：是指商品和劳务在全球范围内的自由流动；(3)金融全球化：是指全球金融市场更加开放、金融体系更加融合、金融交易更加自由的过程。\n\n2.经济全球化的动因：(1)科学技术的进步和生产力的发展，为经济全球化提供了坚实的物质基础和根本的推动力；(2)跨国公司的发展，为经济全球化提供了适宜的企业组织形式；(3)各国经济体制的变革和国际经济组织的发展，是经济全球化的体制与组织保障。\n\n3.经济全球化的影响：积极作用：(1)经济全球化的进程是生产社会化程度不断提高的过程；(2)经济全球化体现了社会化生产的要求，不仅发达国家从中受益，一些发展中国家也得到了快速发展：①为发展中国家提供先进技术和管理经验；②为发展中国家提供更多的就业机会；③推动发展中国家国际贸易的发展；④促进发展中国家跨国公司的发展；消极作用：(1)发达国家与发展中国家在经济全球化进程中的地位和收益不平等、不平衡；(2)加剧了发展中国家资源短缺和环境污染；(3)一定程度上增加了经济风险。","notes":"","source":"苏一《27命题点高清图谱》印刷第34页；按原分支整理","source_pages":[34],"source_pdf_pages":[39],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p039_n031","p039_n032","p039_n033","p039_n034","p039_n035","p039_n036","p039_n037","p039_n038","p039_n039","p039_n040","p039_n041","p039_n042","p039_n043","p039_n044","p039_n045","p039_n046","p039_n047","p039_n048","p039_n049","p039_n050","p039_n051","p039_n052","p039_n053","p039_n054"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p039_a003","kind":"政治素养","text":"政治素养：当今困扰世界的很多问题，并不是经济全球化造成的。如国际金融危机不是经济全球化发展的必然产物，而是金融资本过度逐利、金融监管严重缺失的结果","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":110},{"id":"suyi-marx-p034-n056-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点11：第二次世界大战后资本主义的变化及其实质"],"type":"group","title":"第二次世界大战后资本主义的变化及其实质：变化的主要表现","question":"第二次世界大战后资本主义的变化及其实质：变化的主要表现的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"变化的主要表现：1.生产资料所有制的变化：第二次世界大战后；资本主义生产资料所有制又发生了新的变化，这就是国家资本所有制形成并发挥重要作用，法人资本所有制崛起并成为居主导地位的资本所有制形式；(1)国家资本所有制（发挥重要作用）：①是指生产资料由国家占有并服务于垄断资本的所有制形式；②其主要特点是国家作为出资人拥有国有企业的所有权和控制权；③性质：仍然是资本主义形式，体现着总资本家剥削雇佣劳动者的关系；(2)法人资本所有制（主导地位）：①法人资本所有制是法人股东化的产物；②其主要特点是企业的股票高度集中于少数法人股东之手，法人股东凭借手中集中化的控股权干预甚至直接参与公司治理，监督和制约管理阶层的经营行为，使公司资本的所有权与控制权重新趋于合一；③两种形式：企业法人资本所有制；机构法人资本所有制；④性质：基于资本雇佣劳动的垄断资本集体所有制，体现了资本剥削雇佣劳动的关系；2.劳资关系和分配关系的变化：(1)资本主义发展初期　资本家指挥下的劳动只是形式上隶属资本；(2)随着机器大工业生产体系的建立，生产工具使用的社会化程度提高：劳动者个人的技能不再对生产过程和结果具有决定意义，劳动对资本的隶属就成为实质上的隶属；(3)随着社会生产力的发展和工人阶级反抗力量的不断壮大（采取缓和劳资关系的激励制度）：①职工参与决策；②终身雇佣；③职工持股；(4)第二次世界大战后，随着经济的恢复和发展，特别是一批社会主义国家的出现以及资本主义国家内部工人阶级同资产阶级斗争的发展：建立并实施了普及化、全民化的社会福利制度；3.社会阶层和阶级结构的变化：(1)资本家的地位和作用已经发生很大变化；(2)高级职业经理成为大公司经营活动的实际控制者；(3)知识型和服务型劳动者数量不断增加，劳动方式发生了新变化。","notes":"","source":"苏一《27命题点高清图谱》印刷第34页；按原分支整理","source_pages":[34],"source_pdf_pages":[39],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p039_n057","p039_n058","p039_n059","p039_n060","p039_n061","p039_n062","p039_n063","p039_n064","p039_n065","p039_n066","p039_n067","p039_n068","p039_n069","p039_n070","p039_n071","p039_n072","p039_n073","p039_n074","p039_n075","p039_n076","p039_n077","p039_n078","p039_n079","p039_n080","p039_n081","p039_n082","p039_n083"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p039_a004","kind":"政治素养","text":"政治素养：（关于所有权和控制权）\n1.所有权：法律上的资产归属权（谁是老板）\n2.控制权：实际管理企业的权力（企业的决策权）\n\n3.生产资料所有制的变化：\n①资本主义发展的初期：所有权与控制权统一于资本家自身（资本家同时拥有生产资料并直接管理企业）\n②19世纪末20世纪初：所有权与控制权不再统一（股东只拿分红不管事，职业经理人管理企业）\n③第二次世界大战后：法人股东凭借手中集中化的控股权干预甚至直接参与公司治理，监督和制约管理阶层的经营行为，使公司资本的所有权与控制权重新趋于合一","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":111},{"id":"suyi-marx-p034-n056-g02","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点11：第二次世界大战后资本主义的变化及其实质"],"type":"group","title":"第二次世界大战后资本主义的变化及其实质：变化的主要表现","question":"第二次世界大战后资本主义的变化及其实质：变化的主要表现的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"变化的主要表现：4.经济调节机制和经济危机形态的变化：（1）经济调节机制的变化：从20世纪70年代起，西方国家普遍走上了强化市场调节、弱化政府干预的道路，即：；①通过国有企业私有化来提升经济竞争力；②通过福利制度改革，减少政府的财政负担；③通过放松对经济和金融的管制，释放经济活力；（2）经济危机呈现新的特点：①去工业化和产业空心化日趋严重，产业竞争力下降　　②经济高度金融化，虚拟经济与实体经济严重脱节；③财政严重债务化，债务危机频繁爆发　　④两极分化和社会对立加剧；⑤经济增长乏力，发展活力不足，周期性危机与结构性危机交织在一起　　⑥金融危机频发，全球经济屡受打击；5.政治制度的变化：（1）政治制度出现多元化的趋势，公民权利有所扩大；（2）资本主义国家普遍加强了法治建设，以便协调社会各阶级、阶层的利益；（3）改良主义政党在政治舞台上的影响日益扩大。","notes":"","source":"苏一《27命题点高清图谱》印刷第35页；按原分支整理","source_pages":[35],"source_pdf_pages":[40],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p040_n004","p040_n005","p040_n006","p040_n007","p040_n008","p040_n009","p040_n010","p040_n011","p040_n012","p040_n013","p040_n014","p040_n015","p040_n016","p040_n017","p040_n018"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":112},{"id":"suyi-marx-p034-n056-g03","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点11：第二次世界大战后资本主义的变化及其实质"],"type":"group","title":"第二次世界大战后资本主义的变化及其实质：变化的原因和实质","question":"第二次世界大战后资本主义的变化及其实质：变化的原因和实质有哪些？各项依据和相互关系是什么？","answer":"变化的原因和实质：1.原因：（1）科学技术革命和生产力的发展，是资本主义发生变化的根本推动力量；（2）工人阶级争取自身权利和利益的斗争，是推动资本主义发生变化的重要力量；（3）社会主义制度初步显示的优越性，对资本主义产生了重要影响；（4）主张改良主义的政党对资本主义制度的改革，也对资本主义发生变化起到了重要作用；2.实质：（1）第二次世界大战后资本主义发生的变化，从根本上说是人类社会发展一般规律和资本主义经济规律作用的结果；（2）是在资本主义制度基本框架内的变化，并不意味着资本主义生产关系的根本性质发生了变化。","notes":"","source":"苏一《27命题点高清图谱》印刷第35页；按原分支整理","source_pages":[35],"source_pdf_pages":[40],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p040_n019","p040_n020","p040_n021","p040_n022","p040_n023","p040_n024","p040_n025","p040_n026","p040_n027"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p040_a001","kind":"政治素养","text":"政治素养：\n1.第二次世界大战后资本主义发生的变化：\n①没有改变资本主义制度的本质\n②没有克服资本主义的基本矛盾\n③没有改变马克思主义关于资本主义的基本论断的科学性\n2.科学技术的不断进步和生产社会化程度的不断提高，必然要求调整和变革那些不适应科学技术进步和生产社会化要求的旧的生产关系","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":113},{"id":"suyi-marx-p035-n028-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点12：当代资本主义变化的新特征"],"type":"group","title":"当代资本主义变化的新特征","question":"当代资本主义变化的新特征包括哪几方面？每项具体表现为什么？","answer":"1.科技创新加速资本主义生产方式变化　　（1）产业结构的调整　　（2）生产组织和劳动形式的变化　　（3）新经济形态的出现\n\n2.国际金融垄断资本主义影响日益显现：国际金融资本的垄断成为当代资本主义最突出、最鲜明、最主要的特征；（1）金融垄断寡头化；（2）金融垄断国际化；（3）经济虚拟化、产业空心化。\n\n3.社会阶级层级结构呈现复杂性、多样化：世界主要资本主义国家中贫富差距悬殊、社会阶层固化等现象日益严重，资产阶级内部层级结构日趋复杂，工人阶级内部层级结构也逐渐分化。\n\n4.发达资本主义国家凭借经济、科技、文化传播等超级优势，在世界范围内推行霸权主义和强权政治：（1）利用强大的金融资本控制国际投资、国际生产、国际流通、国际交换、国际贸易、国际市场，对发展中国家进行最大限度的经济盘剥和压榨，获得金融资本对于社会生产甚至社会生活的绝对统治地位；（2）利用强大的世界文化产业体系和传播媒介垄断权，推行文化市场化和商业化运作，打着自由、民主、平等、人权等幌子，输出、渗透资本主义价值观和“西式民主文化”，直接严重威胁民族国家的文化认同和文化主权，撕裂价值观的共同基础；（3）利用知识产权和信息技术垄断，制造“信息鸿沟”“数字鸿沟”“技术鸿沟”，构建“信息帝国主义”和“数字帝国主义”；（4）利用集团政治操纵国际组织、干涉国际事务，把自己的意志和所谓规则强加于人，对他国进行政治、经济、科技等全方位制裁，逆历史潮流而动，破坏全球和平与稳定。","notes":"","source":"苏一《27命题点高清图谱》印刷第35页；按原分支整理","source_pages":[35],"source_pdf_pages":[40],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p040_n029","p040_n030","p040_n031","p040_n032","p040_n033","p040_n034","p040_n035","p040_n036","p040_n037","p040_n038","p040_n039","p040_n040","p040_n041"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":114},{"id":"suyi-marx-p035-n042-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点13：世界大变局下资本主义的矛盾与冲突"],"type":"group","title":"世界大变局下资本主义的矛盾与冲突","question":"世界大变局下资本主义的矛盾与冲突的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.经济发展失调　　（1）虚拟经济与实体经济发展失衡　　（2）福利风险增加　　（3）债务负担沉重\n\n2.政治体制失灵　　（1）西式选举往往难以选贤　　（2）政党利益可能凌驾于国家利益之上　　（3）“民主陷阱”会阻碍国家治理　　（4）传统精英政治走向衰落\n\n3.社会融合机制失效　　（1）社会极端思潮抬头　　（2）社会流动性退化　　（3）社会矛盾激化","notes":"","source":"苏一《27命题点高清图谱》印刷第35页；按原分支整理","source_pages":[35],"source_pdf_pages":[40],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p040_n043","p040_n044","p040_n045"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":115},{"id":"suyi-marx-p035-n047-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点14：资本主义的历史地位"],"type":"group","title":"资本主义的历史地位","question":"资本主义的历史地位体现在哪些方面？相关定位和适用条件是什么？","answer":"1.历史进步性：（1）资本主义将科学技术转变为强大的生产力；（2）资本追求剩余价值的内在动力和竞争的外在压力推动了社会生产力的迅速发展；（3）资本主义的意识形态和政治制度作为上层建筑在战胜封建社会自给自足的小生产的生产方式，保护、促进和完善资本主义生产方式方面起着重要作用，从而推动了社会生产力的迅速发展，促进了社会进步。\n\n2.局限性：（1）资本主义基本矛盾阻碍社会生产力的发展；（2）资本主义制度下财富占有两极分化，引发经济危机；（3）资产阶级支配和控制资本主义经济和政治的发展和运行，不断激化社会矛盾和冲突。","notes":"","source":"苏一《27命题点高清图谱》印刷第35页；按原分支整理","source_pages":[35],"source_pdf_pages":[40],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p040_n048","p040_n049","p040_n050","p040_n051","p040_n052","p040_n053","p040_n054","p040_n055"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":116},{"id":"suyi-marx-p035-n056-g01","revision":1,"path":["马原","第五章 资本主义的发展及其趋势","考点15：资本主义为社会主义所代替的历史必然性"],"type":"group","title":"资本主义为社会主义所代替的历史必然性","question":"资本主义为社会主义所代替的历史必然性有哪些阶段、重要节点及其意义？","answer":"1.资本主义基本矛盾“包含着现代的一切冲突的萌芽”\n\n2.资本积累推动资本主义基本矛盾不断激化并最终否定资本主义自身\n\n3.国家垄断资本主义是资本社会化的更高形式，将成为社会主义的前奏\n\n4.资本主义社会存在着资产阶级和无产阶级两大阶级之间的矛盾和斗争","notes":"","source":"苏一《27命题点高清图谱》印刷第35页；按原分支整理","source_pages":[35],"source_pdf_pages":[40],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p040_n057","p040_n058","p040_n059","p040_n060"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":117},{"id":"suyi-marx-p036-n003-g01","revision":1,"path":["马原","第六章 社会主义的发展及其规律","考点
