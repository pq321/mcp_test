1：社会主义五百年的历史进程"],"type":"group","title":"社会主义五百年的历史进程：社会主义从空想到科学","question":"社会主义五百年的历史进程：社会主义从空想到科学有哪些阶段、重要节点及其意义？","answer":"1.社会主义从空想到科学：（1）空想社会主义发展阶段：①早期空想社会主义（16—17世纪）：托马斯·莫尔：《乌托邦》——空想社会主义的开山之作；康帕内拉：《太阳城》；②空想平均共产主义（18世纪）：摩莱里：《自然法典》；马布利：《论法制或法律的原则》；③批判的空想社会主义（19世纪初期）：代表人物 圣西门、欧文、傅立叶；科学社会主义的直接思想来源；（2）空想社会主义历史贡献：①他们对资本主义旧制度的辛辣批判，包含着许多切中要害的见解；②对社会主义新制度的描绘，闪烁着诸多天才的火花；（3）空想社会主义局限性：①没有能够指出真正的出路，它既不会阐明资本主义制度下雇佣奴隶制的本质；②又不会发现资本主义发展的规律，也不会找到能够成为新社会的创造者的社会力量；（4）科学社会主义的创立：社会主义从空想到科学飞跃的理论基础 唯物史观和剩余价值学说；1848年2月，《共产党宣言》的发表；标志着马克思主义（科学社会主义）的公开问世。","notes":"","source":"苏一《27命题点高清图谱》印刷第36页；按原分支整理","source_pages":[36],"source_pdf_pages":[41],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p041_n004","p041_n005","p041_n006","p041_n007","p041_n008","p041_n009","p041_n010","p041_n011","p041_n012","p041_n013","p041_n014","p041_n015","p041_n016","p041_n017","p041_n018","p041_n019","p041_n020","p041_n021","p041_n022","p041_n023","p041_n024"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p041_a001","kind":"政治素养","text":"政治素养：《乌托邦》中描绘了一个美好的社会：在那里，没有私有财产和剥削现象，城乡之间没有对立，人们有计划地从事生产，不需要商品、货币和市场，实行按需分配","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p041_a002","kind":"政治素养","text":"政治素养：1.空想社会主义不是科学的思想体系 2.空想社会主义不成熟的理论，“是同不成熟的资本主义生产状况、不成熟的阶级状况相适应的”","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p041_a003","kind":"政治素养","text":"政治素养：1.社会主义从空想发展到科学是社会主义发展史上的第一次历史性飞跃 2.科学社会主义超越空想社会主义之处在于：找到了实现理想社会的现实道路，揭示了资本主义必然灭亡的经济根源","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":118},{"id":"suyi-marx-p036-n003-g02","revision":1,"path":["马原","第六章 社会主义的发展及其规律","考点1：社会主义五百年的历史进程"],"type":"group","title":"社会主义五百年的历史进程：社会主义从理想到现实","question":"社会主义五百年的历史进程：社会主义从理想到现实有哪些阶段、重要节点及其意义？","answer":"2.社会主义从理想到现实：（1）第一国际：1864年，国际工人协会（第一国际）应运而生。马克思是第一国际的灵魂；①在马克思指导下，第一国际大力支援各国的工人运动，支持反封建的民主运动和民族解放运动，影响日益扩大；②第一国际促进了马克思主义的传播及其与国际工人运动的结合，初步确立了马克思主义在工人运动中的指导地位；（2）巴黎公社：1871年爆发的巴黎公社革命，是第一国际精神的产儿，是无产阶级夺取政权的第一次伟大尝试；为了防止国家机关工作人员由社会公仆变为社会主人，巴黎公社采取了两项重要措施：第一，规定所有公职人员无论职位高低，实行全面的选举制和撤换制；第二，取消高薪制，规定任何工作人员年薪不得超过熟练工人的工薪水平；马克思、恩格斯总结巴黎公社经验：第一，无产阶级革命取得成功并保持胜利果实的首要条件是要有革命的武装；第二，必须打碎旧的国家机器，建立无产阶级的新型国家；第三，无产阶级政权是为人民服务的机关；第四，必须建立无产阶级政党，发挥党的政治领导作用；（3）“一国胜利论”：列宁指出：；“经济和政治发展的不平衡是资本主义的绝对规律；。由此得出结论：社会主义可能首先在少数甚至在单独一个资本主义国家内获得胜利”，即“一国胜利论”；（4）十月革命：①在“一国胜利论”的基础上，列宁根据对俄国国内革命形势和国际状况的科学分析，进一步得出了：社会主义可能在经济文化相对落后的俄国首先取得胜利的结论；并且将这一理论付诸实践，在革命形势成熟的条件下，抓住时机，领导了俄国十月革命；②十月革命实现了社会主义从理想到现实的伟大飞跃，开辟了人类历史的新纪元。","notes":"","source":"苏一《27命题点高清图谱》印刷第36页；按原分支整理","source_pages":[36],"source_pdf_pages":[41],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p041_n025","p041_n026","p041_n027","p041_n028","p041_n029","p041_n030","p041_n031","p041_n032","p041_n033","p041_n034","p041_n035","p041_n036","p041_n037","p041_n038","p041_n039","p041_n040","p041_n041","p041_n042","p041_n043","p041_n044","p041_n045","p041_n046","p041_n047","p041_n048"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":119},{"id":"suyi-marx-p036-n003-g03","revision":1,"path":["马原","第六章 社会主义的发展及其规律","考点1：社会主义五百年的历史进程"],"type":"group","title":"社会主义五百年的历史进程：社会主义从一国到多国","question":"社会主义五百年的历史进程：社会主义从一国到多国有哪些阶段、重要节点及其意义？","answer":"3.社会主义从一国到多国：（1）社会主义在苏联的实践：列宁领导的苏维埃俄国对社会主义道路的探索，大体上经历了三个时期；①进一步巩固苏维埃政权时期；②外国武装干涉和国内战争时期（战时共产主义时期）：主要特征：第一，余粮收集制；第二，取消商品货币关系；战时共产主义政策是苏维埃俄国面临帝国主义武装干涉和国内战争而被迫采取的一种临时性政策；③新经济政策时期：原因：第一，1920年底，苏维埃俄国击退外国武装干涉者，取得了国内战争的胜利，1921年初转入和平经济建设时期；第二，当时苏维埃俄国的国民经济已濒临崩溃，国内发生严重的经济和政治危机；第三，列宁深感如不改变政策将会失去广大群众，丢掉阶级基础；主要特征：发展商品经济；主要内容：用粮食税制取代余粮收集制，允许私人自由贸易，恢复商品货币关系；允许私人小工业企业发展，采取一些国家资本主义的形式来发展生产；这一决定表明：第一，列宁的社会主义建设思想发生了重大转变；第二，对俄国这样一个小农经济占优势的国家如何走向社会主义又有了新的认识；第三，标志着列宁正在探索一条符合俄国国情的建设社会主义的道路；意义：第一，扭转了国家的严重危机，活跃了苏维埃的城乡经济；第二，发展了生产，大大加强了苏维埃的社会主义经济基础；第三，改善了工人、农民和其他劳动者的物质文化生活。","notes":"","source":"苏一《27命题点高清图谱》印刷第36页；按原分支整理","source_pages":[36],"source_pdf_pages":[41],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p041_n049","p041_n050","p041_n051","p041_n052","p041_n053","p041_n054","p041_n055","p041_n056","p041_n057","p041_n058","p041_n059","p041_n060","p041_n061","p041_n062","p041_n063","p041_n064","p041_n065","p041_n066","p041_n067","p041_n068","p041_n069","p041_n070","p041_n071","p041_n072","p041_n073","p041_n074","p041_n075"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":120},{"id":"suyi-marx-p036-n003-g04","revision":1,"path":["马原","第六章 社会主义的发展及其规律","考点1：社会主义五百年的历史进程"],"type":"group","title":"社会主义五百年的历史进程：社会主义从一国到多国","question":"社会主义五百年的历史进程：社会主义从一国到多国有哪些阶段、重要节点及其意义？","answer":"3.社会主义从一国到多国：（1）社会主义在苏联的实践：在俄国社会主义革命取得胜利的初期，特别是实行新经济政策期间，列宁对苏维埃俄国如何建设社会主义进行了深刻的理论思考，提出了许多精辟的论述：①把建设社会主义作为一个长期探索、不断实践的过程；②把大力发展生产力、提高劳动生产率放在首要地位；③在多种经济成分并存的条件下，利用商品、货币和市场发展经济；④利用资本主义建设社会主义；列宁还指出：①马克思主义执政党建设的极端重要性，阐明了思想建设和文化建设的重要意义；②提出了加强国家政权建设和发扬社会主义民主的一系列措施；列宁晚年提出了建设社会主义的新构想：①用合作社的形式将农民引向社会主义道路；②发展大工业，实现工业化和电气化；③学习和利用资本主义一切有价值的东西；④进行文化革命，大力发展文化教育事业；⑤进行党和国家机构的改革，努力提高干部的素质和能力；⑥必须反对官僚主义，健全社会主义民主和法制；⑦维护党的团结，特别是党中央领导核心的团结；苏联模式：①积极影响　在第二次世界大战中为苏联反法西斯战争的胜利提供了强有力的物质和人员保障；②消极影响　集中过多，管得过死，否定市场的作用，严重束缚企业和劳动者的积极性；（2）社会主义发展到多个国家　第二次世界大战结束后，社会主义在世界范围内获得大发展，中国革命的胜利，是继俄国十月革命之后20世纪最重大的事件；（3）社会主义在中国焕发出蓬勃生机　中国特色社会主义高举起科学社会主义旗帜，向世界表明科学社会主义在21世纪的中国焕发出新的蓬勃生机。","notes":"","source":"苏一《27命题点高清图谱》印刷第37页；按原分支整理","source_pages":[37],"source_pdf_pages":[42],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p042_n003","p042_n004","p042_n005","p042_n006","p042_n007","p042_n008","p042_n009","p042_n010","p042_n011","p042_n012","p042_n013","p042_n014","p042_n015","p042_n016","p042_n017","p042_n018","p042_n019","p042_n020","p042_n021","p042_n022","p042_n023","p042_n024","p042_n025"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p042_a001","kind":"政治素养","text":"政治素养：一切从实际出发，尊重千百万群众的实践，勇于探索，大胆创新，努力把马克思主义基本原理同俄国的具体实际相结合，探索出一条适合俄国国情的社会主义道路。这是列宁对马克思主义的重大贡献，也是他留给后人的最宝贵的思想遗产","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p042_a002","kind":"政治素养","text":"政治素养：列宁逝世后，联共（布）党内及理论界在苏联社会主义发展道路问题上出现了严重分歧，争论的最终结果是斯大林的理论和政策主张占据了主导地位。1928年10月，苏联开始实行以优先发展重工业为中心建立社会主义大工业的第一个五年计划，1932年底完成。这个时期完成了农业合作化，工作中虽然出现了一些失误或偏差，但最终在广大农村建立了社会主义的制度基础。1936年12月，在苏维埃第八次非常代表大会通过的宪法中，宣布苏联已经建成了社会主义。在这个过程中，形成了建设社会主义的苏联模式","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p042_a003","kind":"政治素养","text":"政治素养：社会主义发展的历史证明，苏联模式是特定历史条件下的产物，并不是社会主义的唯一模式","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":121},{"id":"suyi-marx-p037-n026-g01","revision":1,"path":["马原","第六章 社会主义的发展及其规律","考点2：科学社会主义基本原则"],"type":"group","title":"科学社会主义基本原则","question":"围绕科学社会主义基本原则，含义、主要内容、正确把握科学社会主义基本原则、科学社会主义基本原则与中国特色社会主义分别是什么？","answer":"1.含义：（1）是社会主义事业发展规律的集中体现；（2）是马克思主义政党领导人民进行社会主义革命、建设、改革的基本遵循；（3）这些原则在后来的社会主义革命和建设中得到了证实、丰富和发展。\n\n2.主要内容：（1）资本主义必然灭亡，社会主义必然胜利　“资本主义必然灭亡，社会主义必然胜利”是科学社会主义的核心命题；（2）无产阶级是最先进最革命的阶级，肩负着推翻资本主义旧世界、建立社会主义和共产主义新世界的历史使命；（3）无产阶级革命是无产阶级进行斗争的最高形式，以建立无产阶级专政的国家政权为目的；（4）要在生产资料公有制基础上组织生产，以满足全体社会成员的需要为生产的根本目的；（5）要对社会生产进行有计划的指导和调节，实行按劳分配原则；（6）要合乎自然规律地改造和利用自然，努力实现人与自然的和谐共生；（7）必须坚持科学的理论指导，大力发展社会主义先进文化；（8）无产阶级政党是无产阶级的先锋队，社会主义事业必须始终坚持无产阶级政党的领导；（9）社会主义社会要大力解放和发展生产力，逐步消灭剥削和消除两极分化，实现共同富裕和社会全面进步，并最终向共产主义社会过渡；（10）共产主义是人类最美好的社会制度，实现共产主义是共产党人的最高理想。\n\n3.正确把握科学社会主义基本原则：（1）必须始终坚持科学社会主义基本原则，反对任何背离科学社会主义基本原则的错误倾向；（2）要善于把科学社会主义基本原则与本国实际和时代特征相结合，创造性地回答和解决社会主义革命、建设、改革中的重大问题；（3）紧跟时代和实践的发展，在不断总结新鲜经验中进一步丰富和发展科学社会主义基本原则。\n\n4.科学社会主义基本原则与中国特色社会主义：中国特色社会主义：（1）是植根中国大地、反映中国人民意愿、适应中国和时代发展进步要求的科学社会主义；（2）既坚持了科学社会主义基本原则，又根据时代条件赋予其鲜明的中国特色；（3）是科学社会主义在中国的运用和发展，是扎根中国大地的科学社会主义。","notes":"","source":"苏一《27命题点高清图谱》印刷第37页；按原分支整理","source_pages":[37],"source_pdf_pages":[42],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p042_n027","p042_n028","p042_n029","p042_n030","p042_n031","p042_n032","p042_n033","p042_n034","p042_n035","p042_n036","p042_n037","p042_n038","p042_n039","p042_n040","p042_n041","p042_n042","p042_n043","p042_n044","p042_n045","p042_n046","p042_n047","p042_n048","p042_n049","p042_n050"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":122},{"id":"suyi-marx-p037-n051-g01","revision":1,"path":["马原","第六章 社会主义的发展及其规律","考点3：在实践中探索社会主义的发展规律"],"type":"group","title":"在实践中探索社会主义的发展规律","question":"在实践中探索社会主义的发展规律的基本内容、作用和方法论要求是什么？","answer":"1.社会主义建设过程的长期性：原因：（1）生产力发展状况的制约；（2）经济基础和上层建筑发展状况的制约；（3）国际环境的严峻挑战；（4）马克思主义执政党对社会主义发展道路的探索和对社会主义建设规律的认识，需要一个长期的过程。\n\n2.社会主义发展道路的多样性：（1）原因：①各个国家的生产力发展状况和社会发展阶段决定了社会主义发展道路具有不同的特点；②历史文化传统的差异性是造成不同国家社会主义发展道路多样性的重要条件；③时代和实践的不断发展，是造成社会主义发展道路多样性的现实原因；（2）探索适合本国国情的发展道路：①必须坚持对待马克思主义的科学态度；②必须从当时当地的历史条件出发，坚持“走自己的路”；③必须充分吸收人类一切优秀文明成果。","notes":"","source":"苏一《27命题点高清图谱》印刷第37页；按原分支整理","source_pages":[37],"source_pdf_pages":[42],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p042_n052","p042_n053","p042_n054","p042_n055","p042_n056","p042_n057","p042_n058","p042_n059","p042_n060","p042_n061","p042_n062","p042_n063","p042_n064","p042_n065","p042_n066"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p042_a004","kind":"政治素养","text":"政治素养：坚持以马克思主义为指导，最重要的是坚持马克思主义对于研究未来社会制度的科学方法","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":123},{"id":"suyi-marx-p038-n003-g01","revision":1,"path":["马原","第七章 共产主义崇高理想","考点3：在实践中探索社会主义的发展规律"],"type":"group","title":"在实践中探索社会主义的发展规律","question":"在实践中探索社会主义的发展规律的基本内容、作用和方法论要求是什么？","answer":"3.社会主义在实践中开拓前进：（1）在实践中开拓前进是社会主义事业发展的必然要求：①社会主义是亿万人民群众的伟大实践；②社会主义实践是一个不断探索的过程；③实践探索中出现某种曲折并不改变社会主义的前进趋势；④推进社会主义实践发展必须有开拓奋进的精神状态；（2）社会主义在实践中开拓前进必须遵循客观规律：社会主义在实践中开拓前进必须遵循人类社会发展规律、社会主义建设规律、共产党执政规律；（3）以自信担当、开拓奋进的姿态走向社会主义光明未来：①正确看待21世纪世界社会主义的形势；②充分认识中国特色社会主义的成功实践对世界社会主义发展的意义；③坚定信心，振奋精神，以开拓奋进的姿态走向社会主义光明未来。","notes":"","source":"苏一《27命题点高清图谱》印刷第38页；按原分支整理","source_pages":[38],"source_pdf_pages":[43],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p043_n004","p043_n005","p043_n006","p043_n007","p043_n008","p043_n009","p043_n010","p043_n011","p043_n012","p043_n013","p043_n014","p043_n015"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":124},{"id":"suyi-marx-p038-n017-g01","revision":1,"path":["马原","第七章 共产主义崇高理想","考点4：展望未来共产主义新社会"],"type":"group","title":"展望未来共产主义新社会","question":"围绕展望未来共产主义新社会，预见未来社会的方法论原则、共产主义社会的基本特征分别是什么？","answer":"1.预见未来社会的方法论原则：（1）基本前提：在展望未来社会的问题上，是否坚持科学的立场观点方法是能否正确预见未来的基本前提，也是马克思主义与空想社会主义的根本区别；（2）原则：①在揭示人类社会发展一般规律的基础上指明社会发展的方向；②在剖析资本主义旧世界的过程中阐发未来新世界的特点；③在社会主义社会发展中不断深化对未来共产主义社会的认识；④立足于揭示未来社会的一般特征，而不对各种细节作具体描绘。\n\n2.共产主义社会的基本特征：（1）物质财富极大丰富，消费资料按需分配：①社会生产力高度发展，产品极大丰富，是实现共产主义的必要条件。生产力的高度发展是共产主义社会的一个重要特征；②适应高度发展的社会化大生产的需要，共产主义社会在生产关系上将废除私有制，实行普遍的生产资料公有制；③与生产资料的社会占有相适应，共产主义社会将按照自然资源的情况和社会成员的需要，对生产进行有计划的组织和管理；④在共产主义社会，个人消费品的分配方式是“各尽所能，按需分配”；（2）社会关系高度和谐，人们精神境界极大提高：①在共产主义社会，阶级将会消亡、国家将会消亡、战争将不复存在；②由于社会生产力的巨大发展，工业与农业、城市与乡村、脑力劳动与体力劳动的差别即“三大差别”必将归于消失；③不仅社会是和谐的，而且社会与自然之间也将达成和谐；④人们的精神境界将得到极大提高；（3）实现每个人自由而全面的发展，人类从必然王国向自由王国飞跃：①实现人的自由而全面的发展是马克思主义追求的根本价值目标，也是共产主义社会的根本特征；②人的自由而全面发展的内涵：第一，人的发展是自由而全面的发展，是建立在个体高度自由自觉基础上的全面发展；第二，人摆脱了自然经济条件下对“人的依赖关系”，也摆脱了商品经济条件下对“物的依赖性”，实现了人的“自由个性”的发展；第三，人的发展是全面的发展，不仅体力和智力得到发展，各方面的才能和工作能力得到发展，而且人的社会联系和社会交往也得到发展；第四，全体社会成员的发展，即每一个人的发展，而不是只有一部分人的发展；③人的自由而全面的发展的实现条件：第一，旧式分工的消除为人的自由而全面的发展创造了条件；第二，自由时间的大大延长为人的自由而全面的发展提供了广阔的前景；第三，劳动不再是单纯的谋生的手段，而成为“生活的第一需要”；④共产主义社会实现了人类解放，人类将最终从支配他们生活和命运的异己力量中解放出来，实现从必然王国向自由王国的飞跃，开始自觉地创造自己的历史。","notes":"","source":"苏一《27命题点高清图谱》印刷第38页；按原分支整理","source_pages":[38],"source_pdf_pages":[43],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p043_n018","p043_n019","p043_n020","p043_n021","p043_n022","p043_n023","p043_n024","p043_n025","p043_n026","p043_n027","p043_n028","p043_n029","p043_n030","p043_n031","p043_n032","p043_n033","p043_n034","p043_n035","p043_n036","p043_n037","p043_n038","p043_n039","p043_n040","p043_n041","p043_n042","p043_n043","p043_n044","p043_n045","p043_n046","p043_n047","p043_n048"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p043_a001","kind":"政治素养","text":"政治素养：在共产主义社会，为生产而生产的利润动机不复存在，物质生产不再不顾人的实际需要而盲目扩张，人类文明与自然环境之间将达到动态平衡与和谐","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p043_a002","kind":"政治素养","text":"政治素养：共产主义社会，在人与人之间形成了事实上的平等，整个社会是和谐的，社会发展与个人发展实现了真正的统一，社会发展不再以牺牲某些个人的发展为代价","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":125},{"id":"suyi-marx-p038-n049-g01","revision":1,"path":["马原","第七章 共产主义崇高理想","考点5：实现共产主义是历史发展的必然趋势"],"type":"group","title":"实现共产主义是历史发展的必然趋势","question":"实现共产主义是历史发展的必然趋势有哪些阶段、重要节点及其意义？","answer":"1.实现共产主义是历史发展的必然：（1）共产主义理想的实现是历史发展的必然：①共产主义理想是能够实现的理想，它与一切空想和幻想有着本质区别；②共产主义理想一定会实现，是以人类社会发展规律以及资本主义社会的基本矛盾发展为依据的；③社会主义运动的实践，特别是社会主义国家的兴起和不断发展，已经并正在用事实证明共产主义理想实现的必然性；（2）实现共产主义是人类最伟大的事业：①社会发展的规律是在人们的活动中形成的，是人们社会活动的规律，它的实现和发挥作用离不开人们的社会活动；②实现共产主义理想是广大人民群众的共同愿望。实现共产主义，必须找到现实的阶级力量，这就是现代工人阶级或无产阶级。\n\n2.实现共产主义是长期的历史过程：（1）资本主义的灭亡和向社会主义的转变是一个长期的历史过程；（2）社会主义社会的充分发展和最终向共产主义过渡需要很长的历史时期。","notes":"","source":"苏一《27命题点高清图谱》印刷第38页；按原分支整理","source_pages":[38],"source_pdf_pages":[43],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p043_n050","p043_n051","p043_n052","p043_n053","p043_n054","p043_n055","p043_n056","p043_n057","p043_n058","p043_n059","p043_n060"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p043_a003","kind":"政治素养","text":"政治素养：无产阶级的解放与全人类的解放是完全一致的","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p043_a004","kind":"政治素养","text":"政治素养：1.在全世界实现共产主义，首先将取决于社会主义国家的巩固和发展，取决于这些国家所经历的社会主义建设的历史进程\n2.社会主义的任务很多，但根本一条就是发展生产力","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":126},{"id":"suyi-marx-p038-n061-g01","revision":1,"path":["马原","第七章 共产主义崇高理想","考点6：共产主义远大理想与中国特色社会主义共同理想"],"type":"group","title":"共产主义远大理想与中国特色社会主义共同理想","question":"共产主义远大理想与中国特色社会主义共同理想的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.坚持和发展中国特色社会主义是中华民族通向共产主义的必由之路\n\n2.正确认识和把握二者的关系：（1）从时间上看，远大理想与共同理想的关系是最终理想与阶段性理想的关系；（2）从层次上看，远大理想与共同理想的关系是最高纲领与最低纲领的关系；（3）从范围来看，远大理想与共同理想的关系也是全人类理想与全体中国人民理想的关系。","notes":"","source":"苏一《27命题点高清图谱》印刷第38页；按原分支整理","source_pages":[38],"source_pdf_pages":[43],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p043_n062","p043_n063","p043_n064","p043_n065","p043_n066"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":127},{"id":"suyi-mao-p039-n002-g01","revision":1,"path":["毛中特","全科框架","全科框架 导论"],"type":"group","title":"全科框架 导论","question":"这一板块包括哪些章节和核心问题？它们之间怎样衔接？","answer":"马克思主义中国化时代化的历史进程与理论成果","notes":"","source":"苏一《27命题点高清图谱》印刷第39页；按原分支整理","source_pages":[39],"source_pdf_pages":[44],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p044_n003"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":128},{"id":"suyi-mao-p039-n004-g01","revision":1,"path":["毛中特","全科框架","全科框架 毛泽东思想"],"type":"group","title":"全科框架 毛泽东思想","question":"这一板块包括哪些章节和核心问题？它们之间怎样衔接？","answer":"第一章 毛泽东思想及其历史地位：毛泽东思想的形成和发展；毛泽东思想的主要内容和活的灵魂；毛泽东思想的历史地位。\n\n第二章 新民主主义革命理论（1919—1949年）：新民主主义革命理论形成的依据：近代中国国情和中国革命的时代特征；新民主主义革命理论的实践基础；新民主主义革命的总路线和基本纲领：新民主主义革命的总路线；新民主主义的基本纲领；新民主主义革命的道路和基本经验：新民主主义革命的道路；新民主主义革命的三大法宝；新民主主义革命理论的意义。\n\n第三章 社会主义改造理论（1949—1956年）：从新民主主义到社会主义的转变：新民主主义社会是一个过渡性的社会；党在过渡时期的总路线及其依据；社会主义改造道路和历史经验：适合中国特点的社会主义改造道路；社会主义改造的历史经验；社会主义基本制度在中国的确立。\n\n第四章 社会主义建设道路初步探索的理论成果（1956—1978年）：初步探索的重要理论成果：调动一切积极因素为社会主义事业服务；正确认识和处理社会主义社会矛盾的思想；走中国工业化道路的思想；初步探索的其他理论成果；初步探索的意义。","notes":"","source":"苏一《27命题点高清图谱》印刷第39页；按原分支整理","source_pages":[39],"source_pdf_pages":[44],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p044_n005","p044_n006","p044_n007","p044_n008","p044_n009","p044_n010","p044_n011","p044_n012","p044_n013","p044_n014","p044_n015","p044_n016","p044_n017","p044_n018","p044_n019","p044_n020","p044_n021","p044_n022","p044_n023","p044_n024","p044_n025","p044_n026","p044_n027","p044_n028","p044_n029","p044_n030","p044_n031","p044_n032","p044_n033","p044_n034"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p044_a001","kind":"other","text":"1919年——1949年——1956年——1978年","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":129},{"id":"suyi-mao-p039-n035-g01","revision":1,"path":["毛中特","全科框架","全科框架 中国特色社会主义理论体系的形成发展（第五章）"],"type":"group","title":"全科框架 中国特色社会主义理论体系的形成发展（第五章）","question":"这一板块包括哪些章节和核心问题？它们之间怎样衔接？","answer":"邓小平理论\n\n“三个代表”重要思想\n\n科学发展观\n\n习近平新时代中国特色社会主义思想","notes":"","source":"苏一《27命题点高清图谱》印刷第39页；按原分支整理","source_pages":[39],"source_pdf_pages":[44],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p044_n036","p044_n037","p044_n038","p044_n039"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p044_a002","kind":"other","text":"1978-2012年","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p044_a003","kind":"other","text":"2012年（十八大）至今","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":130},{"id":"suyi-mao-p039-n040-g01","revision":1,"path":["毛中特","全科框架","全科框架 分论模块"],"type":"group","title":"全科框架 分论模块","question":"这一板块包括哪些章节和核心问题？它们之间怎样衔接？","answer":"第六章 邓小平理论：邓小平理论首要的基本的理论问题和精髓；邓小平理论的主要内容：社会主义初级阶段理论；党在社会主义初级阶段的基本路线；社会主义根本任务和发展战略理论；社会主义改革开放理论；社会主义市场经济理论；“两手抓，两手都要硬”；“一国两制”与祖国统一；中国特色社会主义外交和国际战略；党的建设理论；邓小平理论的历史地位。\n\n第七章 “三个代表”重要思想\n\n第八章 科学发展观","notes":"","source":"苏一《27命题点高清图谱》印刷第39页；按原分支整理","source_pages":[39],"source_pdf_pages":[44],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p044_n041","p044_n042","p044_n043","p044_n044","p044_n045","p044_n046","p044_n047","p044_n048","p044_n049","p044_n050","p044_n051","p044_n052","p044_n053","p044_n054","p044_n055"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":131},{"id":"suyi-mao-p040-n002-g01","revision":1,"path":["毛中特","导论","考点1：马克思主义中国化时代化的提出"],"type":"group","title":"马克思主义中国化时代化的提出","question":"围绕马克思主义中国化时代化的提出，首次提出、必要性推进马克思主义中国化时代化分别是什么？","answer":"1.首次提出：（1）1938年，毛泽东在党的六届六中全会上作了《论新阶段》的报告，标志着“马克思主义中国化”这一命题的正式提出；（2）这一命题源于对中国革命过程中正反两个方面的实践经验的科学总结。\n\n2.内在意蕴马克思主义中国化同时包含着马克思主义时代化的意蕴\n\n3.必要性推进马克思主义中国化时代化：（1）是马克思主义理论本身发展的内在要求；（2）是解决中国实际问题的客观需要。","notes":"","source":"苏一《27命题点高清图谱》印刷第40页；按原分支整理","source_pages":[40],"source_pdf_pages":[45],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p045_n003","p045_n004","p045_n005","p045_n006","p045_n007","p045_n008","p045_n009"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p045_a001","kind":"政治素养","text":"政治素养：马克思主义必须中国化才能落地生根、本土化才能深入人心","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":132},{"id":"suyi-mao-p040-n010-g01","revision":1,"path":["毛中特","导论","考点2：马克思主义中国化时代化的内涵"],"type":"group","title":"马克思主义中国化时代化的内涵","question":"围绕马克思主义中国化时代化的内涵，内涵、要求分别是什么？","answer":"1.内涵：（1）运用马克思主义的立场、观点和方法，观察时代、把握时代、引领时代，解决中国革命、建设、改革中的实际问题；（2）总结和提炼中国革命、建设、改革的实践经验并将其上升为理论，不断丰富和发展马克思主义的理论宝库，赋予马克思主义以新的时代内涵；（3）运用中国人民喜闻乐见的民族语言来阐述马克思主义，使其植根于中华优秀传统文化的土壤之中，具有中国特色、中国风格、中国气派。\n\n2.要求：（1）推进马克思主义中国化时代化是一个追求真理、揭示真理、笃行真理的过程；（2）坚持马克思主义与发展马克思主义相统一；（3）坚持和发展马克思主义，必须同中国具体实际相结合、同中华优秀传统文化相结合。","notes":"","source":"苏一《27命题点高清图谱》印刷第40页；按原分支整理","source_pages":[40],"source_pdf_pages":[45],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p045_n011","p045_n012","p045_n013","p045_n014","p045_n015","p045_n016","p045_n017","p045_n018"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":133},{"id":"suyi-mao-p040-n019-g01","revision":1,"path":["毛中特","导论","考点3：马克思主义中国化时代化的历史进程"],"type":"group","title":"马克思主义中国化时代化的历史进程","question":"马克思主义中国化时代化的历史进程有哪些阶段、重要节点及其意义？","answer":"1.新民主主义革命时期以毛泽东同志为主要代表的中国共产党人，把马克思列宁主义基本原理同中国具体实际结合起来，创立了毛泽东思想\n\n2.社会主义革命和建设时期提出把马克思列宁主义基本原理同中国具体实际进行“第二次结合”，丰富和发展了毛泽东思想毛泽东思想是马克思主义中国化时代化的第一次历史性飞跃\n\n3.改革开放和社会主义现代化建设新时期我们党创立了邓小平理论，形成了“三个代表”重要思想、科学发展观，形成中国特色社会主义理论体系，实现了马克思主义中国化时代化新的飞跃\n\n4.中国特色社会主义进入新时代我们党创立了习近平新时代中国特色社会主义思想，实现了马克思主义中国化时代化新的飞跃","notes":"","source":"苏一《27命题点高清图谱》印刷第40页；按原分支整理","source_pages":[40],"source_pdf_pages":[45],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p045_n020","p045_n021","p045_n022","p045_n023"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":134},{"id":"suyi-mao-p040-n024-g01","revision":1,"path":["毛中特","导论","考点4：马克思主义中国化时代化的理论成果及其关系"],"type":"group","title":"马克思主义中国化时代化的理论成果及其关系","question":"围绕马克思主义中国化时代化的理论成果及其关系，理论成果、关系是一脉相承又与时俱进的关系分别是什么？","answer":"1.理论成果：（1）毛泽东思想（第一次历史性飞跃）形成时期新民主主义革命、社会主义革命和建设时期实践基础革命和建设；（2）中国特色社会主义理论体系（新的飞跃）形成时期改革开放和社会主义现代化建设新时期实践基础改革开放和现代化建设；（3）习近平新时代中国特色社会主义思想（新的飞跃）形成时期中国特色社会主义新时代实践基础中国特色社会主义进入新时代。\n\n2.关系是一脉相承又与时俱进的关系：（1）毛泽东思想所蕴含的马克思主义的立场、观点和方法，为中国特色社会主义理论体系提供了基本遵循；（2）中国特色社会主义理论体系在新的历史条件下进一步丰富和发展了毛泽东思想；（3）它们都是马克思列宁主义在中国的运用和发展，都以独创性的理论成果丰富和发展了马克思主义的理论宝库；（4）它们都贯穿实事求是、群众路线、独立自主的立场、观点和方法，都科学回答了时代提出的重大理论和实践课题；（5）它们都是党和国家必须长期坚持的指导思想，都是全国各族人民团结奋斗的共同思想基础。","notes":"","source":"苏一《27命题点高清图谱》印刷第40页；按原分支整理","source_pages":[40],"source_pdf_pages":[45],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p045_n025","p045_n026","p045_n027","p045_n028","p045_n029","p045_n030","p045_n031","p045_n032","p045_n033","p045_n034"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p045_a002","kind":"政治素养","text":"政治素养1：\n1.毛泽东思想围绕着中国革命和建设的主题，其形成与“改革”无关\n2.中国特色社会主义理论体系（邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想）围绕着改革和建设的主题，其形成与“革命”无关","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p045_a003","kind":"易错点","text":"易错点：\n毛泽东思想和中国特色社会主义理论体系的共同点在于它们都是对中国革命、建设、改革经验的科学总结（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p045_a004","kind":"政治素养","text":"政治素养2：\n党的十七大（2007年）在改革开放近30年的关键阶段，系统总结了邓小平理论、“三个代表”重要思想、科学发展观等理论成果，提出了“中国特色社会主义理论体系”的科学概念，标志着中国特色社会主义理论和实践的进一步成熟","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":135},{"id":"suyi-mao-p041-n002-g01","revision":1,"path":["毛中特","第一章 毛泽东思想及其历史地位","考点1：毛泽东思想的形成和发展"],"type":"group","title":"毛泽东思想的形成和发展","question":"围绕毛泽东思想的形成和发展，毛泽东思想形成发展的历史条件、毛泽东思想形成发展的过程分别是什么？","answer":"1.毛泽东思想形成发展的历史条件：（1）时代背景19世纪末20世纪初，世界进入帝国主义和无产阶级革命时代，战争与革命成为时代主题；（2）实践基础中国共产党领导人民进行革命和建设的成功实践是毛泽东思想形成和发展的实践基础。\n\n2.毛泽东思想形成发展的过程：（1）大革命时期（开始萌芽）：著作《中国社会各阶级的分析》《湖南农民运动考察报告》；提出思想分析了中国农民斗争的特点，强调无产阶级领导农民斗争在推翻反动政权、建立人民革命政权中的重大作用，从而解决了无产阶级领导权的中心问题这些关于新民主主义革命基本思想的提出，标志着毛泽东思想开始萌芽；（2）土地革命战争时期（初步形成）：著作《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》《反对本本主义》；提出思想毛泽东在这些著作中指明了中国革命的发展规律，提出并阐述了农村包围城市、武装夺取政权的思想，标志着毛泽东思想的初步形成；（3）遵义会议至抗日战争时期（趋于成熟）：著作《实践论》《矛盾论》《〈共产党人〉发刊词》《中国革命和中国共产党》《新民主主义论》《改造我们的学习》《论联合政府》等；提出思想①系统阐述了新民主主义革命理论，标志着毛泽东思想得到多方面展开而趋于成熟②党的六届七中全会通过的《关于若干历史问题的决议》充分肯定了确立毛泽东在全党领导地位的重大意义③1945年党的七大，将毛泽东思想写入党章，“作为自己一切工作的指针”。这标志着把毛泽东思想确立为党必须长期坚持的指导思想；（4）解放战争时期和新中国成立以后（继续发展）：著作《在中国共产党第七届中央委员会第二次全体会议上的报告》《论人民民主专政》《论十大关系》《关于正确处理人民内部矛盾的问题》等；提出思想①先后提出人民民主专政理论、社会主义改造理论、关于严格区分和正确处理两类矛盾的学说特别是正确处理人民内部矛盾的理论、适合我国国情的中国工业化道路理论等②毛泽东明确提出了把马克思列宁主义基本原理同中国具体实际进行“第二次结合，找出在中国怎样建设社会主义的道路”的任务，并进行了艰辛探索③这一时期形成的关于社会主义革命和社会主义建设的重要思想，是毛泽东思想的丰富和发展。","notes":"","source":"苏一《27命题点高清图谱》印刷第41页；按原分支整理","source_pages":[41],"source_pdf_pages":[46],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p046_n003","p046_n004","p046_n005","p046_n006","p046_n007","p046_n008","p046_n009","p046_n010","p046_n011","p046_n012","p046_n013","p046_n014","p046_n015","p046_n016","p046_n017","p046_n018"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p046_a001","kind":"政治素养","text":"政治素养：\n毛泽东在这些著作中指明了中国革命的发展规律是：将党的工作重点从城市转入农村，在农村开展游击战争，进行土地革命，建立红色政权，把落后的农村变为先进的革命根据地；直到敌我力量强弱发生转化，再攻占中心城市，夺取全国政权和全国革命的胜利","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":136},{"id":"suyi-mao-p041-n019-g01","revision":1,"path":["毛中特","第一章 毛泽东思想及其历史地位","考点2：毛泽东思想的主要内容和活的灵魂"],"type":"group","title":"毛泽东思想的主要内容和活的灵魂","question":"围绕毛泽东思想的主要内容和活的灵魂，主要内容、活的灵魂分别是什么？","answer":"1.主要内容：（1）新民主主义革命理论；（2）社会主义革命和社会主义建设理论；（3）革命军队建设和军事战略的理论；（4）政策和策略的理论；（5）思想政治工作和文化工作的理论；（6）党的建设理论；提出1981年党的十一届六中全会通过的《关于建国以来党的若干历史问题的决议》指出：毛泽东思想的活的灵魂有三个基本方面，即实事求是、群众路线、独立自主。\n\n2.活的灵魂：（1）实事求是：含义一切从实际出发，理论联系实际，坚持在实践中检验真理和发展真理；重要性①是毛泽东思想的基本点，是毛泽东思想的精髓②是马克思主义的根本观点，是中国共产党人认识世界、改造世界的根本要求③是我们党的基本思想方法、工作方法、领导方法④是党的思想路线的核心，是党的根本思想路线；确立过程①为了揭示主观主义，特别是教条主义错误的思想根源，1937年，毛泽东在《实践论》和《矛盾论》等著作中，深刻阐述了理论对于实践的依赖关系，以及矛盾的普遍性和特殊性的关系，对党的思想路线作了系统的哲学论证②为了统一全党思想并为制定新民主主义革命的总路线奠定思想基础，毛泽东在延安整风期间又从思想路线的角度，不仅系统阐述了坚持实事求是的重要性，而且对实事求是的科学含义作了马克思主义的界定③经过延安整风和党的七大，实事求是的思想路线在全党得到了确立；（2）群众路线：含义一切为了群众，一切依靠群众，从群众中来，到群众中去，把党的正确主张变为群众的自觉行动；重要性①群众路线是我们党的生命线和根本工作路线②是我们党永葆青春活力和战斗力的重要传家宝③本质上体现的是马克思主义关于人民群众是历史的创造者这一基本原理；（3）独立自主：含义①坚持独立思考，走自己的路，坚定不移地维护民族独立、捍卫国家主权，把立足点放在依靠自己力量的基础上②同时积极争取外援，开展国际经济文化交流，学习外国一切对我们有益的先进事物；重要性①独立自主是中华民族的优良传统，是中华民族精神之魂②是中国共产党、中华人民共和国立党立国的重要原则③是我们党从中国实际出发、依靠党和人民力量进行革命、建设、改革的必然结论；目的①坚持独立自主原则，是毛泽东针对党内存在的“左”倾教条主义倾向，从中国革命遭受挫折的教训中提出的正确思想主张②早在1930年，毛泽东在《反对本本主义》一文中就指出：“中国革命斗争的胜利要靠中国同志了解中国情况。”这是独立自主思想的最初的明确表述。","notes":"","source":"苏一《27命题点高清图谱》印刷第41页；按原分支整理","source_pages":[41],"source_pdf_pages":[46],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p046_n020","p046_n021","p046_n022","p046_n023","p046_n024","p046_n025","p046_n026","p046_n027","p046_n028","p046_n029","p046_n030","p046_n031","p046_n032","p046_n033","p046_n034","p046_n035","p046_n036","p046_n037","p046_n038","p046_n039"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p046_a002","kind":"政治素养","text":"政治素养：\n1.实事求是贯穿于马克思主义中国化两大理论成果形成和发展的全过程\n2.“实事”是指客观存在着的一切事物；“是”是指客观事物的内部联系，即规律性；“求”就是我们去研究\n3.实事求是\n：要深入实际了解事物的本来面貌，把握事物内在必然联系，按照客观规律办事；要清醒认识和正确把握我国基本国情；要不断推进实践基础上的理论创新","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p046_a003","kind":"政治素养","text":"政治素养：\n全心全意为人民服务是我们党一切行动的根本出发点和落脚点，是我们党区别于其他一切政党的根本标志","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":137},{"id":"suyi-mao-p042-n003-g01","revision":1,"path":["毛中特","第一章 毛泽东思想及其历史地位","考点3：毛泽东思想的历史地位"],"type":"group","title":"毛泽东思想的历史地位","question":"毛泽东思想的历史地位体现在哪些方面？相关定位和适用条件是什么？","answer":"1.历史地位：（1）马克思主义中国化时代化的第一个重大理论成果：①毛泽东是马克思主义中国化时代化的伟大开拓者，是毛泽东思想的主要创立者；②毛泽东思想是马克思主义中国化时代化第一次历史性飞跃的理论成果；③毛泽东思想为中国特色社会主义理论体系的形成奠定了理论基础；④尤其是毛泽东思想关于社会主义建设的理论，为开创和发展中国特色社会主义作了重要的理论准备；（2）中国革命和建设的科学指南：毛泽东思想是被实践证明了的关于中国革命和建设的正确的理论原则和经验总结，在毛泽东思想指引下，我们党领导全国人民：；①找到了一条新民主主义革命的正确道路，建立了中华人民共和国，实现了中国从几千年封建专制政治向人民民主的伟大飞跃；②找到了一条从新民主主义向社会主义过渡的道路，确立了社会主义基本制度，实现了中华民族有史以来最为广泛而深刻的社会变革；③对适合中国国情的社会主义道路进行了艰辛探索，取得了独创性理论成果和巨大成就，为在新的历史时期开始中国特色社会主义提供了宝贵经验、理论准备、物质基础；④建立起独立的比较完整的工业体系和国民经济体系，为社会主义现代化建设奠定了重要的物质技术基础，为社会主义建设积累了重要经验；（3）中国共产党和中国人民宝贵的精神财富。\n\n2.科学评价毛泽东和毛泽东思想：重要性 具有重要的历史意义和现实意义：（1）关系到怎样看待党百年奋斗和前进的历史；（2）关系到党的团结、国家的安定；（3）关系到党和国家未来的发展前途；提出 1981年党的十一届六中全会通过的《关于建国以来党的若干历史问题的决议》；正确评价毛泽东：（1）毛泽东同志是伟大的马克思主义者，伟大的无产阶级革命家、战略家和理论家；（2）是马克思主义中国化的伟大开拓者，中国社会主义现代化建设事业的伟大奠基者，是近代以来中国伟大的爱国者和民族英雄；（3）是党的第一代中央领导集体的核心，是领导中国人民彻底改变自己命运和国家面貌的一代伟人；（4）是为世界被压迫民族的解放和人类进步事业作出重大贡献的伟大国际主义者；（5）但总的来说，毛泽东的功绩是第一位的，错误是第二位的；意义：将毛泽东晚年所犯的错误，同经过长期历史检验形成科学理论的毛泽东思想区别开来，为我们完整准确地理解毛泽东思想、坚持和发展毛泽东思想指明了方向。","notes":"","source":"苏一《27命题点高清图谱》印刷第42页；按原分支整理","source_pages":[42],"source_pdf_pages":[47],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p047_n004","p047_n005","p047_n006","p047_n007","p047_n008","p047_n009","p047_n010","p047_n011","p047_n012","p047_n013","p047_n014","p047_n015","p047_n016","p047_n017","p047_n018","p047_n019","p047_n020","p047_n021","p047_n022","p047_n023","p047_n024","p047_n025","p047_n026","p047_n027","p047_n028","p047_n029","p047_n030"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p047_a001","kind":"补充说明","text":"毛泽东思想关于社会主义建设的基本思想观点，仍具有重要的现实指导作用","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p047_a002","kind":"政治素养","text":"政治素养：（毛泽东同志毕生最突出最伟大的贡献是）\n1.领导我们党和人民找到了新民主主义革命的正确道路\n2.完成了反帝反封建的任务，建立了中华人民共和国\n3.确立了社会主义基本制度，取得了社会主义建设的基础性成就\n4.为我们探索建设中国特色社会主义的道路积累了经验和提供了条件\n5.为我们党和人民事业胜利发展、为中华民族阔步赶上时代发展潮流创造了根本前提，奠定了坚实的理论和实践基础","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p047_a003","kind":"政治素养","text":"政治素养：毛泽东思想≠毛泽东的思想\n1.毛泽东思想：是中国共产党集体智慧的结晶，是正确的理论原则和经验总结\n2.毛泽东的思想：是毛泽东个人的思想，包含正确/错误的内容","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":138},{"id":"suyi-mao-p042-n033-g01","revision":1,"path":["毛中特","第二章 新民主主义革命理论","考点1：近代中国国情和中国革命的时代特征"],"type":"group","title":"近代中国国情和中国革命的时代特征","question":"近代中国国情和中国革命的时代特征包括哪几方面？每项具体表现为什么？","answer":"1.国情：（1）最基本的国情/社会性质 半殖民地半封建社会；（2）重要性 认清中国国情，是解决中国革命问题的基本前提、基本依据；（3）主要矛盾：①帝国主义和中华民族的矛盾（最主要的矛盾）；②封建主义和人民大众的矛盾；（4）两大历史任务：①争取民族独立、人民解放；②实现国家富强、人民幸福；（5）革命的根本任务 推翻帝国主义、封建主义和官僚资本主义的统治；（6）革命性质 资产阶级民主革命。\n\n2.时代特征：（1）十月革命：俄国十月革命的胜利，标志着人类历史开始了由资本主义向社会主义转变的进程；使中国的资产阶级民主主义革命：①从原来属于旧的世界资产阶级民主主义革命的范畴转变为属于新的资产阶级民主主义革命的范畴；②从旧的世界资产阶级民主主义革命的一部分转变为世界无产阶级社会主义革命的一部分；（2）五四运动：以五四运动为标志，中国无产阶级开始作为独立的政治力量登上历史舞台，成为革命的领导力量，马克思列宁主义逐步成为中国革命的指导思想，中国革命进入新民主主义革命阶段。","notes":"","source":"苏一《27命题点高清图谱》印刷第42页；按原分支整理","source_pages":[42],"source_pdf_pages":[47],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p047_n034","p047_n035","p047_n036","p047_n037","p047_n038","p047_n039","p047_n040","p047_n041","p047_n042","p047_n043","p047_n044","p047_n045","p047_n046","p047_n047","p047_n048","p047_n049","p047_n050","p047_n051","p047_n052"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p047_a004","kind":"政治素养","text":"政治素养：\n1.近代中国革命的根本任务是推翻帝国主义、封建主义和官僚资本主义的统治，从根本上推翻反动腐朽的政治上层建筑，变革阻碍生产力发展的生产关系，为建设富强民主的国家、确立人民当家作主的政治制度、改善人民生活扫清障碍，创造必要的前提\n2.近代中国的社会性质和主要矛盾，决定了中国革命仍然是资产阶级民主革命（革命性质）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":139},{"id":"suyi-mao-p042-n053-g01","revision":1,"path":["毛中特","第二章 新民主主义革命理论","考点2：新民主主义革命理论的实践基础"],"type":"group","title":"新民主主义革命理论的实践基础","question":"新民主主义革命理论的实践基础的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.旧民主主义革命的失败呼唤新的革命理论：新民主主义革命理论在近代中国革命的实践中应运而生，它的形成也包含了对旧民主主义革命失败教训的深刻总结。\n\n2.新民主主义革命的艰辛探索奠定了革命理论形成的实践基础：（1）新民主主义革命理论，是在总结革命斗争正反两方面实践经验的基础上形成的；（2）新民主主义革命实践，是新民主主义理论得以形成的基础和源泉。","notes":"","source":"苏一《27命题点高清图谱》印刷第42页；按原分支整理","source_pages":[42],"source_pdf_pages":[47],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p047_n054","p047_n055","p047_n056","p047_n057","p047_n058"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":140},{"id":"suyi-mao-p043-n003-g01","revision":1,"path":["毛中特","第二章 新民主主义革命理论","考点3：总路线的提出"],"type":"group","title":"总路线的提出","question":"围绕总路线的提出，含义、提出、定位分别是什么？","answer":"1.含义：总路线是党和国家在某个历史阶段制定各方面具体工作路线和政策的总依据，是根本指导路线。\n\n2.提出：（1）首次提出：①1939年，毛泽东在《中国革命和中国共产党》一文中第一次提出了“新民主主义革命”的科学概念；②表述：无产阶级领导之下的，人民大众的，反帝反封建的革命；（2）完整表述：①1948年，毛泽东在《在晋绥干部会议上的讲话》中完整地总结和概括了新民主主义革命总路线的内容；②表述：无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命；③“完整”指革命对象中增加了“官僚资本主义”。\n\n3.定位：新民主主义革命总路线反映了中国革命的基本规律，指明了中国革命的对象、动力、领导力量、性质和前途，是新民主主义革命的指导路线。","notes":"","source":"苏一《27命题点高清图谱》印刷第43页；按原分支整理","source_pages":[43],"source_pdf_pages":[48],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p048_n004","p048_n005","p048_n006","p048_n007","p048_n008","p048_n009","p048_n010","p048_n011","p048_n012","p048_n013","p048_n014","p048_n015"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":141},{"id":"suyi-mao-p043-n016-g01","revision":1,"path":["毛中特","第二章 新民主主义革命理论","考点4：总路线的内容"],"type":"group","title":"总路线的内容：革命对象","question":"总路线的内容：革命对象的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.革命对象：重要性：分清敌友，是中国革命的首要问题；革命对象（三座大山）：（1）帝国主义（首要对象）：①近代中国所遭受的最大的压迫是来自帝国主义的民族压迫；②推翻帝国主义的压迫（民族革命），是中国走向独立和富强的前提；（2）封建主义：①封建地主阶级是帝国主义统治中国和封建军阀实行专制统治的社会基础；②是中国经济现代化和政治民主化的主要障碍；（3）官僚资本主义：是依靠帝国主义、勾结封建势力、利用国家政权力量而发展起来的买办的、封建的国家垄断资本主义；不同历史阶段，革命的主要对象不同：（1）国共合作的大革命时期：帝国主义支持下的北洋军阀；（2）土地革命战争时期：国民党新军阀；（3）抗日战争时期：日本帝国主义；（4）解放战争时期：美帝国主义支持下的国民党反动派。","notes":"","source":"苏一《27命题点高清图谱》印刷第43页；按原分支整理","source_pages":[43],"source_pdf_pages":[48],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p048_n017","p048_n018","p048_n019","p048_n020","p048_n021","p048_n022","p048_n023","p048_n024","p048_n025","p048_n026","p048_n027","p048_n028","p048_n029","p048_n030","p048_n031","p048_n032","p048_n033"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p048_a001","kind":"政治素养","text":"反对封建主义（民主革命），从根本上说，就是要：\n1.在经济上消灭封建地主土地所有制\n2.在政治上消灭封建的官僚军阀专制统治，消灭地主阶级，解放生产力，为中国的经济现代化和政治民主化创造条件","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":142},{"id":"suyi-mao-p043-n016-g02","revision":1,"path":["毛中特","第二章 新民主主义革命理论","考点4：总路线的内容"],"type":"group","title":"总路线的内容：革命动力","question":"总路线的内容：革命动力的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"2.革命动力：（1）无产阶级/工人阶级：中国革命最基本的动力；（2）农民：中国革命的主力军；（3）城市小资产阶级：无产阶级的可靠同盟者：包括广大的知识分子、小商人、手工业者和自由职业者（注意：城市小资产阶级≠资产阶级）；（4）民族资产阶级：革命的动力之一，具有两面性：；①民族资产阶级既受帝国主义的压迫，又受封建主义的束缚，它同帝国主义和封建主义有矛盾，具有革命的要求，是革命的力量之一；②由于它在经济上和政治上与帝国主义和封建主义有着千丝万缕的联系，没有彻底的反帝反封建的勇气，在革命的关键时刻表现出明显的动摇性。","notes":"","source":"苏一《27命题点高清图谱》印刷第43页；按原分支整理","source_pages":[43],"source_pdf_pages":[48],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p048_n034","p048_n035","p048_n036","p048_n037","p048_n038","p048_n039","p048_n040","p048_n041","p048_n042"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p048_a002","kind":"政治素养","text":"1.中国革命的首要问题：分清敌友\n2.中国革命的基本问题：农民问题\n3.中国革命的中心问题：无产阶级的领导权\n4.新民主主义革命理论的核心问题：无产阶级的领导权\n5.中国革命的根本问题：国家政权问题\n政治素养2：\n1.新民主主义革命实质上就是党领导下的农民革命\n2.中国革命战争实质上就是党领导下的农民战争（2018-11）\n3.工人阶级对农民的领导，是实现无产阶级领导权的基础","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p048_a003","kind":"政治素养","text":"（中国的资产阶级）\n1.官僚资产阶级（大资产阶级）：剥削阶级，革命的对象之一\n2.民族资产阶级：带有两面性的阶级，革命的动力之一","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":143},{"id":"suyi-mao-p043-n016-g03","revision":1,"path":["毛中特","第二章 新民主主义革命理论","考点4：总路线的内容"],"type":"group","title":"总路线的内容：领导力量","question":"总路线的内容：领导力量的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"3.领导力量：领导权的重要性：（1）无产阶级的领导权是中国革命的中心问题，也是新民主主义革命理论的核心问题；（2）区别新旧两种不同范畴的民主主义革命的根本标志：革命的领导权是掌握在无产阶级手中还是掌握在资产阶级手中；（3）无产阶级及其政党的领导是中国革命取得胜利的根本保证；无产阶级领导权的依据：无产阶级的领导权是由历史和中国无产阶级的特点决定的：；（1）历史：①帝国主义不允许中国民族资产阶级建立独立的资产阶级共和国；②中国民族资产阶级的软弱性和妥协性，它们不愿意也不能够彻底推翻帝国主义和封建势力；③中国无产阶级的强大和革命的彻底性，领导中国革命的重任，历史地落到了中国无产阶级及其政党的肩上；（2）中国无产阶级的特点：一般无产阶级的基本优点：①与先进的生产方式相联系；②没有私人占有的生产资料；③富于组织纪律性；自身特点和优点：①身受外国资本主义、本国封建势力和资产阶级的三重压迫，在革命斗争中比任何别的阶级都来得坚决和彻底；②集中分布在少数大城市和大企业，有利于组织和团结，有利于革命思想的传播和强大革命力量的形成；③大部分出身于破产农民，和农民有着天然的联系，便于和农民结成亲密的联盟，共同团结战斗；无产阶级领导权的实现：无产阶级及其政党对中国革命的领导权不是自然而然得来的，而是在与资产阶级争夺领导权的斗争中实现的：；（1）实现领导权的关键：建立以工农联盟为基础的广泛的统一战线；（2）坚持领导权的基本策略：无产阶级同资产阶级建立统一战线时，必须坚持独立自主的原则，保持党在思想上、政治上和组织上的独立性，实行又联合又斗争的方针；（3）保证领导权的坚强支柱：建立一支无产阶级领导的以农民为主体的强大的革命武装；（4）实现领导权的根本保证：加强无产阶级政党的建设。","notes":"","source":"苏一《27命题点高清图谱》印刷第43页；按原分支整理","source_pages":[43],"source_pdf_pages":[48],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p048_n043","p048_n044","p048_n045","p048_n046","p048_n047","p048_n048","p048_n049","p048_n050","p048_n051","p048_n052","p048_n053","p048_n054","p048_n055","p048_n056","p048_n057","p048_n058","p048_n059","p048_n060","p048_n061","p048_n062","p048_n063","p048_n064","p048_n065","p048_n066","p048_n067","p048_n068"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":144},{"id":"suyi-mao-p043-n016-g04","revision":1,"path":["毛中特","第二章 新民主主义革命理论","考点4：总路线的内容"],"type":"group","title":"总路线的内容：性质和前途","question":"总路线的内容：性质和前途的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"4.性质和前途：（1）新民主主义革命的性质：资产阶级民主主义革命；这是由近代中国半殖民地半封建社会的性质和中国革命的历史任务决定的；（2）旧民主主义革命与新民主主义革命：区别：①时代背景：旧：世界资产阶级民主主义革命时代；新：世界无产阶级社会主义革命时代；②领导力量（根本区别）：旧：资产阶级；新：中国无产阶级及其先锋队——中国共产党；③指导思想：旧：资产阶级思想；新：马克思列宁主义；④革命前途：旧：资本主义；新：社会主义；联系：①国情：都发生在半殖民地半封建社会；②革命性质：都是资产阶级民主主义革命；（3）新民主主义革命与社会主义革命：区别：①革命性质：新民主主义革命：资产阶级民主主义革命；社会主义革命：无产阶级社会主义革命；②革命目标：新民主主义革命：推翻帝国主义、封建主义和官僚资本主义的反动统治；建立无产阶级领导的各革命阶级的联合专政；社会主义革命：消灭资本主义剥削制度和改造小生产的私有制；建立无产阶级专政；联系：新民主主义革命与社会主义革命是互相联系、紧密衔接的，中间不容横插一个资产阶级专政；这两个革命阶段能够有机连接的原因：民主革命中包含了社会主义因素；①民主主义革命是社会主义革命的必要准备；②社会主义革命是民主主义革命的必然趋势。","notes":"","source":"苏一《27命题点高清图谱》印刷第44页；按原分支整理","source_pages":[44],"source_pdf_pages":[49],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p049_n004","p049_n005","p049_n006","p049_n007","p049_n008","p049_n009","p049_n010","p049_n011","p049_n012","p049_n013","p049_n014","p049_n015","p049_n016","p049_n017","p049_n018","p049_n019","p049_n020","p049_n021","p049_n022","p049_n023","p049_n024","p049_n025","p049_n026","p049_n027","p049_n028","p049_n029","p049_n030","p049_n031","p049_n032","p049_n033","p049_n034","p049_n035","p049_n036","p049_n037"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p049_a001","kind":"政治素养","text":"1.为什么是资产阶级民主主义革命：（3个“既然”：从国情、革命对象、革命动力看）\n①既然中国社会还是一个殖民地、半殖民地、半封建的社会\n②既然中国革命的敌人主要的还是帝国主义和封建势力\n③既然中国革命的任务是为了推翻这两个主要敌人的民族革命和民主革命，而推翻这两个敌人的革命，有时还有资产阶级参加，即使大资产阶级背叛革命而成了革命的敌人，革命的锋芒也不是向着一般的资本主义和资本主义的私有财产，而是向着帝国主义和封建主义。所以，既然如此，所以，现阶段中国革命的性质，不是无产阶级社会主义的，而是资产阶级民主主义的\n2.革命性质\n①旧民主主义革命和新民主主义革命都是资产阶级民主主义革命\n②社会主义革命是无产阶级社会主义革命\n3.对待资本主义\n①新民主主义革命：没收官僚资本，打倒官僚资产阶级；争取和联合民族资产阶级，保护民族工商业\n②社会主义革命：消灭资本主义剥削制度\n4.错误观点：\n（1）“左”倾教条主义错误\n①错误观点：一次革命论——“毕其功于一役”“无间断革命”\n②问题：只看到民主革命与社会主义革命的联系，混淆民主革命和社会主义革命的区别\n（2）右倾错误\n①错误观点：二次革命论（先搞资本主义，再通过社会主义革命搞社会主义）\n②问题：只看到民主革命与社会主义革命的区别，割裂民主革命和社会主义革命的联系","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p049_a002","kind":"政治素养","text":"中国革命必须分为两个步骤：第一步是新民主主义革命，第二步是社会主义革命","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":145},{"id":"suyi-mao-p044-n038-g01","revision":1,"path":["毛中特","第二章 新民主主义革命理论","考点5：基本纲领"],"type":"group","title":"基本纲领","question":"围绕基本纲领，背景、提出、内容分别是什么？","answer":"背景：新民主主义的基本纲领是新民主主义革命总路线的进一步展开和体现，为新民主主义革命指明了具体奋斗目标。\n\n提出：1945年，毛泽东在党的七大所作的政治报告《论联合政府》中，进一步把新民主主义的政治、经济和文化与党的基本纲领联系起来，进行具体阐述，形成了新民主主义的基本纲领。\n\n内容：1.政治纲领：推翻帝国主义和封建主义的统治，建立一个无产阶级领导的、以工农联盟为基础的、各革命阶级联合专政的新民主主义的共和国；（1）国体：各革命阶级的联合专政；（2）政体：民主集中制的人民代表大会制度；2.经济纲领：（1）没收封建地主阶级的土地归农民所有：①没收封建地主阶级的土地归农民所有，是新民主主义革命的主要内容；②土地改革的主要和直接任务：满足贫雇农群众的要求；（2）没收官僚资本阶级的垄断资本归新民主主义的国家所有：①没收官僚资本归新民主主义的国家所有，是新民主主义革命的题中应有之义；②没收官僚资本，包含着新民主主义革命和社会主义革命的双重性质；③通过没收官僚资本建立起来的具有社会主义性质的国营经济，在新民主主义社会的多种经济成分中居于领导地位，为建立新民主主义的国家政权，实现向社会主义过渡奠定了坚实的基础；（3）保护民族工商业：①保护民族工商业，是新民主主义经济纲领中极具特色的一项内容；②在新民主主义条件下保护民族工商业，发展资本主义，是由中国落后的生产力和新民主主义革命的性质所决定的；第一，同官僚资产阶级相比，民族资产阶级与帝国主义和封建主义联系较少；第二，民族资本主义经济是一种与新生产力相联系的先进的生产方式和经济成分，对发展社会生产力有积极作用；第三，在新民主主义的国家制度下，让私人资本主义经济在不能操纵国计民生的范围内获得发展的便利，有益于社会向前发展；3.文化纲领：新民主主义文化，就是无产阶级领导的人民大众的反帝反封建的文化，即民族的科学的大众的文化；（1）民族的：①内容：反对帝国主义压迫，主张中华民族的尊严和独立；②形式：具有鲜明的民族风格、民族形式和民族特色，具有中国作风和中国气派；（2）科学的：反对一切封建思想和迷信思想，主张实事求是、客观真理及理论和实践的一致性；（3）人民大众的（民主的）：①文化工作者要用革命文化教育和武装人民大众，使它成为人民大众的有力思想武器；②以人民群众的实践为创作源泉，坚持为人民大众服务的方向。","notes":"","source":"苏一《27命题点高清图谱》印刷第44页；按原分支整理","source_pages":[44],"source_pdf_pages":[49],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p049_n039","p049_n040","p049_n041","p049_n042","p049_n043","p049_n044","p049_n045","p049_n046","p049_n047","p049_n048","p049_n049","p049_n050","p049_n051","p049_n052","p049_n053","p049_n054","p049_n055","p049_n056","p049_n057","p049_n058","p049_n059","p049_n060","p049_n061","p049_n062","p049_n063","p049_n064","p049_n065","p049_n066","p049_n067","p049_n068","p049_n069","p049_n070","p049_n071"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p049_a003","kind":"政治素养","text":"1.没收官僚资本，具有双重性质：\n①民主革命时期：革命任务是“反帝反封”，因此需要反官僚资本主义\n②社会主义革命时期：革命任务是“反资”，因此也需要反官僚资本主义\n2.反对官僚资本主义并非因为它是资本主义，而是因为这种资本主义：\n①同外国帝国主义、本国地主阶级和旧式富农密切地结合着，是一种买办的、封建的国家垄断资本主义\n②同大地主、大资产阶级的反革命国家政权密切地结合着，成为国民党统治的经济基础\n③对中国的经济发展和社会进步起着严重的阻碍作用","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":146},{"id":"suyi-mao-p045-n003-g01","revision":1,"path":["毛中特","第二章 新民主主义革命理论","考点6：新民主主义革命的道路"],"type":"group","title":"新民主主义革命的道路","question":"围绕新民主主义革命的道路，提出、形成的必然性、内容、意义分别是什么？","answer":"1.提出：（1）党成立初期，首先把工作重心放在城市；（2）1927年大革命失败后，党的工作重心开始转向农村：①初步形成：秋收起义失败后，毛泽东率领队伍开赴井冈山，创建了井冈山革命根据地，把武装斗争的主攻方向首先指向农村；《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》等文章提出了“工农武装割据”思想；初步形成了农村包围城市的革命道路理论；②最终确立：1938年，党的六届六中全会上，确立了经过长期武装斗争，先占乡村，后取城市，最后夺取全国胜利的革命道路。\n\n2.形成的必然性：（1）必要性【必须走】——由中国的具体国情决定：①半殖民地半封建的中国社会，内无民主制度而受封建主义的压迫，外无民族独立而受帝国主义的压迫：中国革命的主要斗争形式只能是武装斗争；主要组织形式必然是军队；②近代中国是一个农业大国，农民占全国人口的绝大多数，是无产阶级可靠的同盟军和革命的主力军；（2）可能性【可以走】——由中国的特殊国情决定：①近代中国是多个帝国主义间接统治的经济落后的半殖民地国家，社会政治经济发展极端不平衡，四分五裂，军阀割据，存在不少的统治薄弱环节，为党在农村开展革命斗争、建设革命根据地提供了缝隙和可能；②近代中国农村受多重压迫和剥削，人民革命愿望强烈，经历过大革命的洗礼，革命的群众基础好；③全国革命形势的继续向前发展，为在农村建设革命根据地提供了客观条件；④相当力量正式红军的存在，为农村革命根据地的创立、巩固和发展提供了坚强后盾；⑤党的领导的有力量及其政策的不错误，为农村革命根据地建设和发展提供了重要的主观条件。\n\n3.内容：中国革命走农村包围城市、武装夺取政权的道路，根本在于处理好土地革命、武装斗争、农村革命根据地建设三者之间的关系；（1）土地革命是中国革命的基本内容；（2）武装斗争是中国革命的主要形式，是农村根据地建设和土地革命的强有力保证；（3）农村革命根据地是中国革命的战略阵地，是进行武装斗争和开展土地革命的依托。\n\n4.意义：中国革命道路理论对于推进马克思主义中国化时代化具有重要的方法论意义。","notes":"","source":"苏一《27命题点高清图谱》印刷第45页；按原分支整理","source_pages":[45],"source_pdf_pages":[50],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p050_n004","p050_n005","p050_n006","p050_n007","p050_n008","p050_n009","p050_n010","p050_n011","p050_n012","p050_n013","p050_n014","p050_n015","p050_n016","p050_n017","p050_n018","p050_n019","p050_n020","p050_n021","p050_n022","p050_n023","p050_n024","p050_n025","p050_n026","p050_n027","p050_n028","p050_n029","p050_n030","p050_n031"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":147},{"id":"suyi-mao-p045-n032-g01","revision":1,"path":["毛中特","第二章 新民主主义革命理论","考点7：新民主主义革命三大法宝"],"type":"group","title":"新民主主义革命三大法宝","question":"围绕新民主主义革命三大法宝，提出、内容、相互关系分别是什么？","answer":"提出：毛泽东在《〈共产党人〉发刊词》中提出了统一战线、武装斗争、党的建设是党在中国革命中战胜敌人的三个主要的法宝。\n\n内容：1.统一战线：（1）建立的必要性：①首先是由中国半殖民地半封建社会的阶级状况所决定的：两头小中间大；“两头”：无产阶级、地主大资产阶级；“中间”：农民、城市小资产阶级、其他的中间阶级；②其次是由中国革命的长期性、残酷性及其发展的不平衡性所决定的；（2）建立的可能性：在半殖民地半封建的中国社会，诸多矛盾交织在一起，客观上为无产阶级及其政党利用这些矛盾建立和发展统一战线提供了可能性；（3）两个联盟：①第一个联盟：工人阶级同农民阶级、广大知识分子及其他劳动者的联盟，主要是工农联盟：第一个联盟是统一战线的基础，是基本的、主要的；只有巩固工农联盟，争取农民、知识分子和其他劳动人民，才能实现党对统一战线的领导权；②第二个联盟：工人阶级和非劳动人民的联盟，主要是与民族资产阶级的联盟：第二个联盟是非基本的、辅助性的，但又是重要的、不可缺少的；只有建立第二个联盟，联合一切可以联合的力量，无产阶级及其政党才能掌握中国革命的全部领导权；（4）实践经验：①建立巩固的工农联盟；②正确对待资产阶级，尤其是民族资产阶级；③采取区别对待的方针，在革命进程中，要坚持发展进步势力、争取中间势力、孤立顽固势力的策略方针；④坚持独立自主的原则，保持党在政治上、组织上和思想上的独立性；2.武装斗争：重要性：武装斗争是中国革命的特点和优点之一，是中国革命的主要斗争形式；建设新型人民军队的经验：（1）坚持党对军队的绝对领导：①这是建设新型人民军队的根本原则；②是保持人民军队无产阶级性质和建军宗旨的根本前提；③是毛泽东建军思想的核心；（2）建设全心全意为人民服务的人民军队：坚持全心全意为人民服务的唯一宗旨；（3）开展革命的政治工作：人民军队政治工作的基本原则包括：①官兵一致原则 ②军民一致原则 ③瓦解敌军和优待俘虏原则；（4）坚持正确的战略战术原则；3.党的建设：必要性：（1）农民和小资产阶级出身的党员占多数，党内无产阶级思想和非无产阶级思想之间的矛盾成为党内思想上的主要矛盾；（2）党长期在农村发展，且处于战争环境之中，如果不加强党的组织建设、作风建设，党就会组织松散、软弱涣散；党加强自身建设的经验：（1）必须把思想建设始终放在党的建设的首位：关键以无产阶级思想克服和改造各种非无产阶级思想；（2）必须在任何时候都重视党的组织建设：根本的是要贯彻民主集中制这一根本组织原则；（3）必须重视党的作风建设：三大优良作风：①理论联系实际 ②密切联系群众 ③批评与自我批评相结合；（4）必须联系党的政治路线加强党的建设。\n\n相互关系：1.统一战线和武装斗争：是中国革命的两个基本特点，是战胜敌人的两个基本武器；2.统一战线：是实行武装斗争的统一战线；3.武装斗争：是统一战线的中心支柱；4.党的组织：是掌握统一战线和武装斗争这两个武器以实行对敌冲锋陷阵的英勇战士。","notes":"","source":"苏一《27命题点高清图谱》印刷第45、46页；按原分支整理","source_pages":[45,46],"source_pdf_pages":[50,51],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p050_n033","p050_n034","p050_n035","p050_n036","p050_n037","p050_n038","p050_n039","p050_n040","p050_n041","p050_n042","p050_n043","p050_n044","p050_n045","p050_n046","p050_n047","p050_n048","p050_n049","p050_n050","p050_n051","p050_n052","p050_n053","p050_n054","p050_n055","p050_n056","p050_n057","p050_n058","p050_n059","p050_n060","p050_n061","p050_n062","p050_n063","p050_n064","p050_n065","p050_n066","p050_n067","p050_n068","p050_n069","p050_n070","p050_n071","p050_n072","p050_n073","p050_n074","p050_n075","p050_n076","p050_n077","p050_n078","p050_n079","p050_n080","p050_n081","p051_n005","p051_n006","p051_n007","p051_n008","p051_n009"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p050_a001","kind":"政治素养","text":"新民主主义革命时期，中国共产党领导的统一战线，先后经历了第一次国共合作的统一战线、工农民主统一战线、抗日民族统一战线、人民民主统一战线等几个时期，为新民主主义革命的胜利作出了重要贡献","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p050_a002","kind":"政治素养","text":"1.把党的建设作为一项“伟大的工程”，要建设一个广大群众性的、马克思主义的无产阶级政党\n2.三大优良作风是中国共产党区别于其他任何政党的显著标志","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":148},{"id":"suyi-mao-p046-n010-g01","revision":1,"path":["毛中特","第二章 新民主主义革命理论","考点8：新民主主义革命理论的意义"],"type":"group","title":"新民主主义革命理论的意义","question":"新民主主义革命理论的意义体现在哪些方面？相关定位和适用条件是什么？","answer":"1.新民主主义革命理论：（1）揭示了近代中国革命发展的客观规律；（2）解决了中国革命的一系列理论问题；（3）科学地回答了中国革命向何处去的问题，以及中国革命的发展阶段问题；（4）极大地丰富了马克思主义的理论宝库。\n\n2.新民主主义革命理论：（1）是马克思主义中国化时代化的重要理论成果，开辟了马克思主义中国化时代化的发展道路；（2）是对中国革命实践经验的概括和总结；（3）是中国共产党集体智慧的结晶。\n\n3.在新民主主义革命理论的指导下，党团结带领人民完成了新民主主义革命，建立了中华人民共和国，实现了民族独立、人民解放","notes":"","source":"苏一《27命题点高清图谱》印刷第46页；按原分支整理","source_pages":[46],"source_pdf_pages":[51],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p051_n011","p051_n012","p051_n013","p051_n014","p051_n015","p051_n016","p051_n017","p051_n018","p051_n019","p051_n020"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":149},{"id":"suyi-mao-p046-n023-g01","revision":1,"path":["毛中特","第三章 社会主义改造理论","考点1：新民主主义社会是一个过渡性的社会"],"type":"group","title":"新民主主义社会是一个过渡性的社会","question":"新民主主义社会是一个过渡性的社会的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"时间：从中华人民共和国成立到社会主义改造基本完成（1949—1956年）\n\n性质：新民主主义社会。新民主主义社会不是一个独立的社会形态，而是由新民主主义向社会主义转变的过渡性社会形态\n\n特点：1.五种经济成分：（1）社会主义性质的国营经济：掌握了主要经济命脉，居于领导地位；通过没收官僚资本而形成的；（2）农民和手工业者的个体经济：处于十字路口，占绝对优势；（3）私人资本主义经济；（4）半社会主义性质的合作社经济：是个体经济向社会主义集体经济的过渡；（5）国家资本主义经济：是私人资本主义经济向社会主义国营经济的过渡；2.阶级构成和主要矛盾：（1）中国社会的阶级构成主要是工人阶级、农民阶级和其他小资产阶级、民族资产阶级等基本的阶级力量；（2）主要矛盾：随着土地改革的基本完成（1952年底），工人阶级和资产阶级的矛盾逐步成为我国社会的主要矛盾；（3）民族资产阶级：这一时期的民族资产阶级仍然具有两面性；①既有剥削工人的一面；②又有接受工人阶级及其政党领导的一面；3.社会主义因素和非社会主义因素：（1）在新民主主义社会中，社会主义的因素不论在经济上还是在政治上都已经居于领导地位，但非社会主义因素仍有很大比重；（2）社会主义因素居于领导地位，加上当时有利于发展社会主义的国际条件，决定了社会主义因素将不断增长并获得最终胜利，非社会主义因素将不断受到限制和改造；（3）为了促进社会生产力的进一步发展，实现国家富强、民族复兴、人民幸福，我国新民主主义社会必须适时地逐步过渡到社会主义社会。","notes":"","source":"苏一《27命题点高清图谱》印刷第46页；按原分支整理","source_pages":[46],"source_pdf_pages":[51],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p051_n024","p051_n025","p051_n026","p051_n027","p051_n028","p051_n029","p051_n030","p051_n031","p051_n032","p051_n033","p051_n034","p051_n035","p051_n036","p051_n037","p051_n038","p051_n039","p051_n040","p051_n041","p051_n042","p051_n043","p051_n044","p051_n045"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p051_a002","kind":"重点提示","text":"★ 三种主要的经济成分：社会主义经济、个体经济和资本主义经济","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p051_a003","kind":"重点提示","text":"★ 两种过渡形式的经济成分","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p051_a004","kind":"补充说明","text":"只有解决了这一矛盾，才能使中国社会实现向社会主义的转变","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p051_a005","kind":"政治素养","text":"由于农民和手工业者的个体经济既可以自发地走向资本主义，也可以被引导走向社会主义，其本身并不代表一种独立的发展方向。因此，这三种基本的经济成分及与之相联系的三种基本的阶级力量之间的矛盾，就集中表现为社会主义和资本主义两条道路、工人阶级和资产阶级两个阶级的矛盾","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":150},{"id":"suyi-mao-p046-n046-g01","revision":1,"path":["毛中特","第三章 社会主义改造理论","考点2：党在过渡时期的总路线及其依据"],"type":"group","title":"党在过渡时期的总路线及其依据","question":"围绕党在过渡时期的总路线及其依据，认识过程、总路线的提出、理论依据、现实依据分别是什么？","answer":"1.认识过程：（1）最初设想：先搞工业化建设，再一举过渡；（2）新的认识：建设和改造同时并举，逐步过渡：①经过三年的努力，到1952年我国国民经济得以恢复，民主革命遗留任务已经完成，经济、政治及社会面貌发生巨大变化；②在取得巨大成绩的同时，我国社会生活中出现和积累了一些新的矛盾。针对这种情况，毛泽东和党的其他领导人对原来的设想有了新的认识；③1952年9月，毛泽东提出中国逐步过渡到社会主义的指导方针和大致设想，强调我们现在就要开始用10年到15年时间基本上完成向社会主义过渡，而不是10年以后才开始过渡。这是酝酿提出过渡时期总路线的开始。\n\n2.总路线的提出：（1）提出：1953年，正式提出过渡时期的总路线和总任务：要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、对手工业和对资本主义工商业的社会主义改造；（2）主要内容：“一化三改”：①“一化”（主体）：社会主义工业化；②“三改”（两翼）：对个体农业、手工业和对资本主义工商业的社会主义改造；（3）特点：①这是一条社会主义建设和社会主义改造同时并举的路线；②体现了社会主义工业化和社会主义改造的紧密结合；③体现了解放生产力与发展生产力、变革生产关系与发展生产力的有机统一。\n\n3.理论依据：（1）马克思列宁主义关于过渡时期的理论；（2）中国化的过渡时期理论：我国由新民主主义社会逐步过渡到社会主义社会这一过渡历史时期之所以必要，并且需要一个相当长的时间，是由于：；①我国经济和文化落后，要求一个相当长的时期来创造为保证社会主义完全胜利所必要的经济上和文化上的前提；②我国有极其广大的个体农业和手工业及在国民经济中占很大一部分比重的资本主义工商业，要求一个相当长的时期来改造它们。\n\n4.现实依据：（1）物质基础：社会主义的国营经济在国家经济生活中实际上已居于相对强大的地位，为党提出总路线提供了物质基础；（2）重要依据：党在一些老解放区大力推广农业互助组和初级合作社的经验的总结（与个体农业相比，农业互助合作组织的增产一般比较明显），为党提出总路线提供了重要依据；（3）重要因素：新中国成立初期，国家在利用和限制资本主义工商业的过程中所积累的经验，成为党提出总路线的又一个重要因素；（4）国际环境：当时的国际形势也有利于中国向社会主义过渡（提供了有利的国际环境）。","notes":"","source":"苏一《27命题点高清图谱》印刷第46、47页；按原分支整理","source_pages":[46,47],"source_pdf_pages":[51,52],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p051_n047","p051_n048","p051_n049","p051_n050","p051_n051","p051_n052","p051_n053","p051_n054","p051_n055","p051_n056","p051_n057","p051_n058","p051_n059","p051_n060","p051_n061","p052_n004","p052_n005","p052_n006","p052_n007","p052_n008","p052_n009","p052_n010","p052_n011","p052_n012","p052_n013","p052_n014"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p051_a006","kind":"政治素养","text":"1954年2月，党的七届四中全会通过决议，正式批准中央政治局确认的这条总路线","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p051_a007","kind":"政治素养","text":"1.最初设想要先完成工业化，然后进行社会主义改造，一举过渡到社会主义社会\n2.新的认识变为工业化建设和社会主义改造同时进行\n3.最终实际结果是社会主义改造完成并且进入社会主义社会，但工业化并没有完成","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p052_a001","kind":"政治素养","text":"由于现代工业的固定资产中官僚资本占80%，国家没收这一部分资本，不仅建立起了在国民经济中起领导作用的社会主义国营经济，而且成为整个国民经济进行社会主义改造的重要开端","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":151},{"id":"suyi-mao-p047-n016-g01","revision":1,"path":["毛中特","第三章 社会主义改造理论","考点3：适合中国特点的社会主义改造道路"],"type":"group","title":"适合中国特点的社会主义改造道路","question":"适合中国特点的社会主义改造道路包括哪几方面？每项具体表现为什么？","answer":"1.农业社会主义改造：（1）道路：积极引导农民组织起来，走互助合作道路：土地改革完成后，农民的两大积极性：①个体经济的积极性；②互助合作的积极性；（2）原则：遵循自愿互利、典型示范和国家帮助的原则，以互助合作的优越性吸引农民走互助合作道路；（3）政策：正确分析农村阶级和阶层状况，制定正确的阶级政策；依靠贫下中农，发展互助合作，由逐步限制到最后消灭富农剥削的农村阶级政策；（4）方针：坚持积极领导、稳步前进的方针；（5）步骤：采取循序渐进的步骤：①互助组：社会主义萌芽性质；②初级农业生产合作社：半社会主义性质；③高级农业生产合作社：完全社会主义性质。\n\n2.手工业社会主义改造：（1）道路：逐步发展到走生产合作的道路；（2）方针：积极领导、稳步前进；（3）方法：说服教育、典型示范和国家帮助；（4）步骤：由小到大、由低级到高级的三个步骤：①第一步：手工业供销小组——社会主义萌芽性质；②第二步：手工业供销合作社——半社会主义性质；③第三步：手工业生产合作社——社会主义性质的集体经济组织。\n\n3.资本主义工商业社会主义改造：（1）方法：和平赎买：含义：所谓赎买，就是国家有偿地将私营企业变为国营企业，将资本主义私有制变为社会主义公有制；赎买的具体方式不是由国家支付一笔巨额补偿资金，而是让资本家在一定年限内从企业经营所得中获取一部分利润；意义：①对资本主义工商业实行和平赎买，有利于发挥私营工商业在国计民生方面的积极作用，促进国民经济发展；②有利于争取和团结民族资产阶级，有利于团结各民主党派和各界爱国民主人士，巩固和发展统一战线；③有利于发挥民族资产阶级中大多数人的知识、才能、技术专长和管理经验；④有利于争取和团结那些原来同资产阶级相联系的知识分子为社会主义建设服务；（2）过渡形式：从低级到高级的国家资本主义：形式：①初级形式的国家资本主义：国家对私营工商业实行委托加工、计划订货、统购包销、经销代销；②高级形式的国家资本主义：公私合营，包括个别企业的公私合营和全行业的公私合营；三个步骤：①第一步：实行初级形式的国家资本主义：具有社会主义因素；这主要是同资本家在企业外部的合作；②第二步：实行个别企业的公私合营：半社会主义性质；这是社会主义成分同资本主义成分在企业内部的合作；企业的生产资料由国家和资本家共同所有；公方代表居领导地位；③第三步：实行全行业的公私合营——社会主义国营性质；（3）把资本主义工商业者改造成为自食其力的社会主义劳动者：特点：①对企业的改造和对人的改造相结合；②改造资本家个人与消灭他们所属的资产阶级相结合。","notes":"","source":"苏一《27命题点高清图谱》印刷第47页；按原分支整理","source_pages":[47],"source_pdf_pages":[52],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p052_n017","p052_n018","p052_n019","p052_n020","p052_n021","p052_n022","p052_n023","p052_n024","p052_n025","p052_n026","p052_n027","p052_n028","p052_n029","p052_n030","p052_n031","p052_n032","p052_n033","p052_n034","p052_n035","p052_n036","p052_n037","p052_n038","p052_n039","p052_n040","p052_n041","p052_n042","p052_n043","p052_n044","p052_n045","p052_n046","p052_n047","p052_n048","p052_n049","p052_n050","p052_n051","p052_n052","p052_n053","p052_n054","p052_n055","p052_n056","p052_n057","p052_n058","p052_n059","p052_n060"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p052_a002","kind":"补充说明","text":"三大改造中首先进行的","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p052_a003","kind":"政治素养","text":"（我国之所以能够采取赎买的方式对资本主义工商业进行和平改造，原因是）\n1.民族资产阶级具有两面性\n2.中国共产党与民族资产阶级长期保持着统一战线的关系，为将工人阶级和民族资产阶级之间存在着的对抗性矛盾转化为非对抗性矛盾并按照人民内部矛盾来处理提供了前提\n3.我国有了人民民主专政的国家政权，建立了强大的社会主义国营经济并掌握了国家的经济命脉，造成私人资本主义在政治、经济上对社会主义的依赖\n4.当时国家对粮食和工业原料的统购统销，以及资本主义企业中工人群众对资本家的监督等因素，就使私人资本主义企业只能接受社会主义改造","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p052_a004","kind":"政治素养","text":"1.前两步的利润分配：“四马分肥”\n2.“四马”：国家所得税、企业公积金、工人福利费、资方红利\n第三步的利润分配：清产核资、定股定息","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p052_a005","kind":"政治素养","text":"（统购包销≠统购统销）\n1.统购包销：初级形式的国家资本主义的表现形式之一（主要针对私营工厂）\n2.统购统销：国家对粮食和工业原料的统购统销（主要针对农产品市场）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":152},{"id":"suyi-mao-p047-n061-g01","revision":1,"path":["毛中特","第三章 社会主义改造理论","考点4：社会主义改造的历史经验"],"type":"group","title":"社会主义改造的历史经验","question":"社会主义改造的历史经验有哪些阶段、重要节点及其意义？","answer":"（1）坚持社会主义工业化建设与社会主义改造同时并举\n\n（2）采取积极引导、逐步过渡的方式\n\n（3）用和平方法进行改造","notes":"","source":"苏一《27命题点高清图谱》印刷第47页；按原分支整理","source_pages":[47],"source_pdf_pages":[52],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p052_n062","p052_n063","p052_n064"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":153},{"id":"suyi-mao-p048-n003-g01","revision":1,"path":["毛中特","第三章 社会主义改造理论","考点5：社会主义基本制度在中国的确立"],"type":"group","title":"社会主义基本制度在中国的确立","question":"围绕社会主义基本制度在中国的确立，社会主义基本制度的确立、确立社会主义基本制度的重大意义分别是什么？","answer":"1.社会主义基本制度的确立：（1）经济基础方面：①1956年底，我国对农业、手工业和资本主义工商业的社会主义改造基本完成；②社会主义公有制已成为我国社会的经济基础，标志着中国历史上长达数千年的阶级剥削制度的结束和社会主义基本制度的确立；（2）政治建设方面：党领导确立人民代表大会制度、中国共产党领导的多党合作和政治协商制度、民族区域自治制度，为人民当家作主提供了制度保证；（3）社会阶级关系方面：①伴随着社会经济制度和社会经济结构的根本变化，我国社会的阶级关系也发生了根本的变化；②广大劳动人民从此摆脱了被剥削被奴役的地位，成为掌握生产资料的国家和社会的主人以及掌握自己命运的主人。\n\n2.理论根据：列宁关于经济文化比较落后的国家可以走向社会主义的理论，是在中国确立社会主义基本制度的理论根据\n\n3.确立社会主义基本制度的重大意义：（1）是中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了制度基础，也为中国特色社会主义制度的创新和发展提供了重要前提；（2）极大地提高了工人阶级和广大劳动人民的积极性、创造性，极大地促进了我国社会生产力的发展；（3）使广大劳动人民真正成为国家的主人，这是中国几千年来阶级关系的最根本变革；（4）使占世界人口1/4的东方大国进入了社会主义社会，这是世界社会主义发展史上又一个历史性的伟大胜利；（5）是马克思列宁主义关于社会主义革命理论在中国的正确运用和创造性发展的结果；（6）不仅再次证明了马克思列宁主义的真理性，而且以其独创性的理论原则和经验总结丰富和发展了科学社会主义理论。","notes":"","source":"苏一《27命题点高清图谱》印刷第48页；按原分支整理","source_pages":[48],"source_pdf_pages":[53],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p053_n004","p053_n005","p053_n006","p053_n007","p053_n008","p053_n009","p053_n010","p053_n011","p053_n012","p053_n013","p053_n014","p053_n015","p053_n016","p053_n017","p053_n018","p053_n019"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":154},{"id":"suyi-mao-p048-n022-g01","revision":1,"path":["毛中特","第四章 社会主义建设道路初步探索","考点1：调动一切积极因素为社会主义事业服务"],"type":"group","title":"调动一切积极因素为社会主义事业服务","question":"围绕调动一切积极因素为社会主义事业服务，“第二次结合”、《论十大关系》、要求分别是什么？","answer":"1.“第二次结合”：背景：社会主义改造基本完成后，我国进入社会主义建设时期。如何建设和巩固社会主义，是党面临的一个崭新课题；提出：（1）1956年4月，毛泽东在召集中央其他领导同志开会时就提出：“最重要的是要独立思考，把马列主义的基本原理同中国革命和建设的具体实际相结合”；（2）现在是社会主义革命和建设时期，我们要进行第二次结合，找出在中国怎样建设社会主义的道路。\n\n2.《论十大关系》：1956年，毛泽东在《论十大关系》中初步总结了我国社会主义建设的经验，明确提出要以苏为鉴，独立自主地探索适合中国情况的社会主义建设道路；（1）提出：这就明确了建设社会主义必须根据本国情况走自己的道路这一根本思想；（2）重要性：《论十大关系》标志着党探索中国社会主义建设道路的良好开端；（3）基本方针：调动一切积极因素为社会主义事业服务。\n\n3.要求：（1）必须坚持中国共产党的领导；（2）必须发展社会主义民主政治。","notes":"","source":"苏一《27命题点高清图谱》印刷第48页；按原分支整理","source_pages":[48],"source_pdf_pages":[53],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p053_n023","p053_n024","p053_n025","p053_n026","p053_n027","p053_n028","p053_n029","p053_n030","p053_n031","p053_n032","p053_n033","p053_n034","p053_n035"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p053_a001","kind":"政治素养","text":"1.“第一次结合”：马克思主义同中国新民主主义革命结合，形成了毛泽东思想（已完成）\n2.“第二次结合”：马克思主义与中国社会主义建设结合，探索中国社会主义建设道路（提出但未完成）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p053_a002","kind":"政治素养","text":"1.前三条：讲重工业和轻工业、农业的关系，沿海工业和内地工业的关系，经济建设和国防建设的关系。这实际上是在论述如何开辟一条和苏联有所不同的工业化道路问题\n2.第四、五条：讲国家、生产单位和生产者个人的关系，中央和地方的关系，开始涉及经济体制改革。这样就初步提出了中国社会主义经济建设的若干新方针、新思路\n3.后五条：论述政治生活和思想文化生活领域如何调动各种积极因素的问题","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":155},{"id":"suyi-mao-p048-n036-g01","revision":1,"path":["毛中特","第四章 社会主义建设道路初步探索","考点2：正确认识和处理社会主义社会矛盾的思想"],"type":"group","title":"正确认识和处理社会主义社会矛盾的思想：提出、社会主义社会的基本矛盾","question":"正确认识和处理社会主义社会矛盾的思想：提出、社会主义社会的基本矛盾的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.提出：党在八大前后，特别是毛泽东在1957年2月所作的《关于正确处理人民内部矛盾的问题》的报告，系统论述了社会主义社会矛盾的理论。矛盾是普遍存在的，社会主义社会同样充满着矛盾\n\n2.社会主义社会的基本矛盾：（1）内容：生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾；（2）和以往不同：社会主义社会的基本矛盾同以往社会的基本矛盾“具有根本不同的性质和情况”：①以往社会的基本矛盾：生产关系与生产力之间存在着一定程度的对抗和冲突；②社会主义社会的基本矛盾：在生产关系和生产力基本适应、上层建筑和经济基础基本适应条件下的矛盾，是在人民根本利益一致基础上的矛盾；（3）性质：是在人民根本利益一致基础上的矛盾，是非对抗性的矛盾；（4）特点：又相适应又相矛盾：①一方面，社会主义生产关系已经建立起来，它是和生产力的发展相适应的；②另一方面，它还很不完善，这些不完善的方面和生产力的发展又是相矛盾的；（5）解决途径：由于社会主义社会的矛盾不是对抗性的矛盾，因此它可以经过社会主义制度本身，不断地得到解决。","notes":"","source":"苏一《27命题点高清图谱》印刷第48页；按原分支整理","source_pages":[48],"source_pdf_pages":[53],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p053_n037","p053_n038","p053_n039","p053_n040","p053_n041","p053_n042","p053_n043","p053_n044","p053_n045","p053_n046","p053_n047"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p053_a003","kind":"政治素养","text":"相适应的一面是基本方面，相矛盾的一面是非基本方面","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":156},{"id":"suyi-mao-p048-n036-g02","revision":1,"path":["毛中特","第四章 社会主义建设道路初步探索","考点2：正确认识和处理社会主义社会矛盾的思想"],"type":"group","title":"正确认识和处理社会主义社会矛盾的思想：社会主义社会的两类不同性质的矛盾","question":"正确认识和处理社会主义社会矛盾的思想：社会主义社会的两类不同性质的矛盾的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"3.社会主义社会的两类不同性质的矛盾：（1）两类不同性质的矛盾：①敌我矛盾：是根本利益对立基础上的矛盾，是对抗性的矛盾；解决方法：专政方法（分清敌我）；②人民内部矛盾：是在人民根本利益一致基础上的矛盾，是非对抗性的矛盾；解决方法：民主方法（分清是非）；（2）关于正确处理人民内部矛盾的方针：①政治思想领域：实行“团结—批评—团结”的方针，坚持说服教育、讨论的方法；②物质利益、分配方面：实行“统筹兼顾、适当安排”的方针，兼顾国家、集体和个人三方面的利益；③人民群众和政府机关：坚持民主集中制原则，努力克服政府机关的官僚主义，加强对群众的思想教育；④科学文化领域：实行“百花齐放、百家争鸣”的方针，通过自由讨论和科学实践、艺术实践去解决；⑤共产党和民主党派：实行在坚持社会主义道路和共产党领导的前提下“长期共存、互相监督”的方针；⑥民族之间：实行民族平等、团结互助的方针；（3）关于正确处理人民内部矛盾的问题是社会主义国家政治生活的主题：这一论断的根本着眼点，在于调动一切积极因素，团结一切可以团结的力量，把全党的注意力转到社会主义建设上来。","notes":"","source":"苏一《27命题点高清图谱》印刷第49页；按原分支整理","source_pages":[49],"source_pdf_pages":[54],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p054_n004","p054_n005","p054_n006","p054_n007","p054_n008","p054_n009","p054_n010","p054_n011","p054_n012","p054_n013","p054_n014","p054_n015","p054_n016","p054_n017","p054_n018","p054_n019","p054_n020"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p054_a001","kind":"政治素养","text":"1.毛泽东还特别指出，在我国，由于民族资产阶级有两面性，工人阶级同民族资产阶级的矛盾原来属于人民内部的矛盾\n2.在一定的条件下，两类不同性质的矛盾可以互相转化。必须严格区分和正确处理两类不同性质的矛盾，特别是要正确处理已经居于主导地位的人民内部矛盾","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p054_a002","kind":"政治素养","text":"为了帮助广大人民在我国的政治生活中判断人们言论和行动的是非，特别有必要帮助人们掌握政治标准，毛泽东提出了六条政治标准，其中最重要的是社会主义道路和党的领导这两条","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":157},{"id":"suyi-mao-p048-n036-g03","revision":1,"path":["毛中特","第四章 社会主义建设道路初步探索","考点2：正确认识和处理社会主义社会矛盾的思想"],"type":"group","title":"正确认识和处理社会主义社会矛盾的思想：我国社会主要矛盾和根本任务","question":"正确认识和处理社会主义社会矛盾的思想：我国社会主要矛盾和根本任务的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"4.我国社会主要矛盾和根本任务：（1）主要矛盾：党的八大指出（1956年）：我们国内的主要矛盾，已经不再是工人阶级和资产阶级的矛盾，而是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾；（2）主要任务：集中力量发展社会生产力，实现国家工业化，逐步满足人民日益增长的物质和文化需要，把党和国家的工作重点转到技术革命和社会主义建设上来。","notes":"","source":"苏一《27命题点高清图谱》印刷第49页；按原分支整理","source_pages":[49],"source_pdf_pages":[54],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p054_n021","p054_n022","p054_n023"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":158},{"id":"suyi-mao-p048-n036-g04","revision":1,"path":["毛中特","第四章 社会主义建设道路初步探索","考点2：正确认识和处理社会主义社会矛盾的思想"],"type":"group","title":"正确认识和处理社会主义社会矛盾的思想：社会主义社会矛盾的理论的意义","question":"正确认识和处理社会主义社会矛盾的思想：社会主义社会矛盾的理论的意义体现在哪些方面？相关定位和适用条件是什么？","answer":"5.社会主义社会矛盾的理论的意义：（1）毛泽东关于社会主义社会矛盾的学说，科学揭示了社会主义社会发展的动力；（2）以独创性的内容丰富了马克思主义的理论宝库；（3）为正确处理社会主义社会各种矛盾、创造良好的社会环境和政治环境提供了基本的理论依据；（4）也为后来的社会主义改革奠定了理论基础，对党和社会主义建设事业具有长远的指导意义。","notes":"","source":"苏一《27命题点高清图谱》印刷第49页；按原分支整理","source_pages":[49],"source_pdf_pages":[54],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p054_n024","p054_n025","p054_n026","p054_n027","p054_n028"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":159},{"id":"suyi-mao-p049-n029-g01","revision":1,"path":["毛中特","第四章 社会主义建设道路初步探索","考点3：走中国工业化道路的思想"],"type":"group","title":"走中国工业化道路的思想","question":"围绕走中国工业化道路的思想，提出、内容、要求（三个必须）分别是什么？","answer":"1.提出：（1）毛泽东在《论十大关系》中论述的第一大关系，就是重工业和轻工业、农业的关系；（2）在《关于正确处理人民内部矛盾的问题》中，毛泽东明确提出了中国工业化道路的问题，主要是指重工业和轻工业、农业的发展关系问题，强调要走一条有别于苏联的中国工业化道路。\n\n2.内容：总方针：以农业为基础，以工业为主导，以农轻重为序发展国民经济的总方针；“两条腿走路”的工业化发展思路：重工业和轻工业、中央工业和地方工业、沿海工业和内地工业、大型企业和中小型企业同时并举。\n\n3.要求（三个必须）：（1）必须采取正确的经济建设方针：党的八大提出既反保守又反冒进、坚持在综合平衡中稳步前进的方针；（2）必须调整和完善所有制结构；（3）必须积极探索适合我国情况的经济体制和运行机制。","notes":"","source":"苏一《27命题点高清图谱》印刷第49页；按原分支整理","source_pages":[49],"source_pdf_pages":[54],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p054_n030","p054_n031","p054_n032","p054_n033","p054_n034","p054_n035","p054_n036","p054_n037","p054_n038","p054_n039","p054_n040"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":160},{"id":"suyi-mao-p049-n041-g01","revision":1,"path":["毛中特","第四章 社会主义建设道路初步探索","考点4：初步探索的其他理论成果"],"type":"group","title":"初步探索的其他理论成果","question":"围绕初步探索的其他理论成果，关于社会主义发展阶段的思想、关于“四个现代化”战略目标、关于科学教育文化和知识分子工作、关于执政党建设分别是什么？","answer":"1.关于社会主义发展阶段的思想：社会主义可以分为两个阶段：；（1）第一个阶段：不发达的社会主义；（2）第二个阶段：比较发达的社会主义。\n\n2.关于“四个现代化”战略目标：（1）战略目标：要把中国建设成为一个具有现代农业、现代工业、现代国防和现代科学技术的社会主义强国；（2）“两步走”：第一步：建立一个独立的比较完整的工业体系和国民经济体系；第二步：要全面实现“四个现代化”，使中国的经济发展走在世界的前列。\n\n3.关于科学教育文化和知识分子工作：（1）在科技工作方面，提出“向科学进军”的口号，强调实现“四个现代化”关键在于科学技术现代化；（2）在文化工作方面，提出“百花齐放、百家争鸣”的方针。\n\n4.关于国防建设：作出了开展三线建设、加强备战的重大战略部署，其总目标是：采取多快好省的方法，在纵深地区建立起一个工农业结合的、为国防和农业服务的比较完整的战略后方基地\n\n5.关于祖国统一：周恩来将我们党提出的一系列和平解决台湾问题的思想、政策和主张归纳为“一纲四目”\n\n6.关于国际战略和外交工作：毛泽东提出两个“中间地带”战略思想：亚洲、非洲、拉丁美洲是第一个中间地带；欧洲、北美加拿大、大洋洲加上日本是第二个中间地带\n\n7.关于执政党建设：（1）突出地提出加强党的建设，反对党内主观主义、宗派主义、官僚主义，批评脱离实际、脱离群众的思想作风；（2）根据苏联社会主义建设的经验教训，强调坚持民主集中制和集体领导制度，强调群众路线是党的组织工作中的根本问题。","notes":"","source":"苏一《27命题点高清图谱》印刷第49页；按原分支整理","source_pages":[49],"source_pdf_pages":[54],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p054_n042","p054_n043","p054_n044","p054_n045","p054_n046","p054_n047","p054_n048","p054_n049","p054_n050","p054_n051","p054_n052","p054_n053","p054_n054","p054_n055","p054_n056","p054_n057","p054_n058","p054_n059"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p054_a003","kind":"政治素养","text":"后一个阶段可能比前一个阶段需要更长的时间","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":161},{"id":"suyi-mao-p049-n060-g01","revision":1,"path":["毛中特","第四章 社会主义建设道路初步探索","考点5：初步探索的意义"],"type":"group","title":"初步探索的意义","question":"初步探索的意义体现在哪些方面？相关定位和适用条件是什么？","answer":"1.巩固和发展了我国的社会主义制度\n\n2.为开创中国特色社会主义提供了宝贵经验、理论准备、物质基础\n\n3.丰富了科学社会主义的理论和实践","notes":"","source":"苏一《27命题点高清图谱》印刷第49页；按原分支整理","source_pages":[49],"source_pdf_pages":[54],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p054_n061","p054_n062","p054_n063"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":162},{"id":"suyi-mao-p050-n003-g01","revision":1,"path":["毛中特","第五章 中国特色社会主义理论体系","考点1：国际背景"],"type":"group","title":"国际背景","question":"国际背景的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.邓小平理论——20世纪70年代：和平和发展成为时代主题\n\n2.“三个代表”重要思想——20世纪80年代末90年代初：（1）和平与发展仍然是时代的主题；（2）在对冷战结束后国际局势进行科学判断的基础上形成的。\n\n3.科学发展观——进入21世纪：（1）和平与发展仍然是时代主题；（2）在深刻分析国际形势、顺应世界发展趋势、借鉴国外发展经验的基础上形成的。\n\n4.习近平新时代中国特色社会主义思想——2012年党的十八大以来：在把握中华民族伟大复兴的战略全局和世界百年未有之大变局的过程中创立并不断丰富发展的","notes":"","source":"苏一《27命题点高清图谱》印刷第50页；按原分支整理","source_pages":[50],"source_pdf_pages":[55],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p055_n004","p055_n005","p055_n006","p055_n007","p055_n008","p055_n009","p055_n010","p055_n011"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":163},{"id":"suyi-mao-p050-n012-g01","revision":1,"path":["毛中特","第五章 中国特色社会主义理论体系","考点2：历史条件"],"type":"group","title":"历史条件","question":"历史条件有哪些？各项依据和相互关系是什么？","answer":"1.邓小平理论——党的十一届三中全会以后：深刻分析错误出现的原因，鲜明指出建设社会主义没有固定的模式，必须结合中国实际（社会主义建设的经验教训）；在实践中不懈探索和回答什么是社会主义、怎样建设社会主义这一基本问题。\n\n2.“三个代表”重要思想——20世纪80年代末90年代初：在科学判断党的历史方位和总结历史经验的基础上提出来的；（1）两大历史性课题：进一步提高党的领导水平和执政水平；提高拒腐防变和抵御风险的能力；（2）进一步回答了什么是社会主义、怎样建设社会主义的问题；创造性回答“建设什么样的党、怎样建设党”这一重大问题。\n\n3.科学发展观——新世纪新阶段：在深刻把握我国基本国情和经济社会发展新的阶段性特征的基础上提出来的；（1）继续回答什么是社会主义、怎样建设社会主义和建设什么样的党、怎样建设党的问题；（2）创造性回答“实现什么样的发展、怎样发展”这一重大问题。\n\n4.习近平新时代中国特色社会主义思想——党的十八大以来：新的历史方位：中国特色社会主义进入新时代；（1）科学回答新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义；（2）建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国；（3）建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党等重大时代课题。","notes":"","source":"苏一《27命题点高清图谱》印刷第50页；按原分支整理","source_pages":[50],"source_pdf_pages":[55],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p055_n013","p055_n014","p055_n015","p055_n016","p055_n017","p055_n018","p055_n019","p055_n020","p055_n021","p055_n022","p055_n023","p055_n024","p055_n025","p055_n026","p055_n027","p055_n028"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":164},{"id":"suyi-mao-p050-n029-g01","revision":1,"path":["毛中特","第五章 中国特色社会主义理论体系","考点3：实践基础"],"type":"group","title":"实践基础","question":"实践基础的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.邓小平理论：改革开放和社会主义现代化建设的实践\n\n2.“三个代表”重要思想：在建设中国特色社会主义伟大实践的基础上形成的\n\n3.科学发展观：在总结改革开放以来特别是党的十六大以来实践经验的基础上形成的\n\n4.习近平新时代中国特色社会主义思想：在中华民族迎来从站起来、富起来到强起来的伟大飞跃中创立并不断丰富发展的","notes":"","source":"苏一《27命题点高清图谱》印刷第50页；按原分支整理","source_pages":[50],"source_pdf_pages":[55],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p055_n030","p055_n031","p055_n032","p055_n033"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":165},{"id":"suyi-mao-p050-n034-g01","revision":1,"path":["毛中特","第五章 中国特色社会主义理论体系","考点4：中国特色社会主义理论体系形成发展过程"],"type":"group","title":"中国特色社会主义理论体系形成发展过程","question":"中国特色社会主义理论体系形成发展过程有哪些阶段、重要节点及其意义？","answer":"1.形成过程：（1）党的十二大（1982年）：明确提出“走自己的路，建设有中国特色的社会主义”；从此“中国特色社会主义”成为我们党的全部理论和实践创新的主题（主题形成）；（2）党的十三大（1987年）：标志着邓小平理论轮廓的形成；（3）南方谈话（1992年）：①推动改革开放和社会主义现代化建设进入新阶段，邓小平理论逐步走向成熟；②是邓小平理论的集大成之作；③从理论上深刻地回答了当时困扰和束缚人们思想的一系列重大问题。包括：社会主义本质、“三个有利于”标准；社会主义可以搞市场经济等；（4）党的十四大（1992年）：高度评价了邓小平对开创中国特色社会主义理论的杰出贡献；（5）党的十五大（1997年）：①正式提出“邓小平理论”这一概念；②把邓小平理论同马克思列宁主义、毛泽东思想一起，确立为党的指导思想并写入党章，1999年载入宪法。\n\n2.发展过程：（1）“三个代表”重要思想：是中国特色社会主义理论体系的跨世纪发展；党的十六大将“三个代表”重要思想同马克思列宁主义、毛泽东思想和邓小平理论一道确立为党必须长期坚持的指导思想，并写入党章；（2）科学发展观：是中国特色社会主义理论体系在新世纪新阶段的新发展；党的十七大：提出了“中国特色社会主义理论体系”的科学概念；把改革开放以来我们党在实践中相继形成的邓小平理论、“三个代表”重要思想以及科学发展观等重大战略思想，一道作为中国特色社会主义理论体系的重要组成部分，标志着中国特色社会主义理论和实践的进一步成熟；（3）习近平新时代中国特色社会主义思想：是中国特色社会主义理论体系在新时代的丰富发展；党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想，并写入党章。","notes":"","source":"苏一《27命题点高清图谱》印刷第50页；按原分支整理","source_pages":[50],"source_pdf_pages":[55],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p055_n035","p055_n036","p055_n037","p055_n038","p055_n039","p055_n040","p055_n041","p055_n042","p055_n043","p055_n044","p055_n045","p055_n046","p055_n047","p055_n048","p055_n049","p055_n050","p055_n051","p055_n052","p055_n053","p055_n054","p055_n055","p055_n056","p055_n057","p055_n058","p055_n059"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p055_a004","kind":"政治素养","text":"邓小平理论是中国特色社会主义理论体系的开篇之作，邓小平理论的形成过程也就是中国特色社会主义理论体系的形成过程","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":166},{"id":"suyi-mao-p051-n003-g01","revision":1,"path":["毛中特","第五章 中国特色社会主义理论体系","考点5：历史地位"],"type":"group","title":"历史地位","question":"历史地位体现在哪些方面？相关定位和适用条件是什么？","answer":"1.中国特色社会主义理论体系是中国共产党长期探索的伟大理论创造，同马克思列宁主义、毛泽东思想一脉相承又与时俱进\n\n2.是马克思主义中国化时代化的重大理论成果\n\n3.是内涵丰富、思想深刻、系统完整的科学理论体系\n\n4.是全党全国各族人民团结奋斗的共同思想基础\n\n5.是战胜来自政治、经济、社会和自然界等一切风险和挑战的精神支柱\n\n6.是坚持和发展中国特色社会主义的行动指南\n\n7.是全面推进中华民族伟大复兴的根本指针\n\n8.是我们党最可宝贵的政治和精神财富","notes":"","source":"苏一《27命题点高清图谱》印刷第51页；按原分支整理","source_pages":[51],"source_pdf_pages":[56],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p056_n004","p056_n005","p056_n006","p056_n007","p056_n008","p056_n009","p056_n010","p056_n011"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":167},{"id":"suyi-mao-p051-n014-g01","revision":1,"path":["毛中特","第六章 邓小平理论","考点1：邓小平理论首要的基本的理论问题"],"type":"group","title":"邓小平理论首要的基本的理论问题","question":"围绕邓小平理论首要的基本的理论问题，社会主义的本质、邓小平对社会主义本质的概括、意义分别是什么？","answer":"1.首要的基本的理论问题：在中国这样一个经济文化比较落后的国家建设什么样的社会主义、怎样建设社会主义\n\n2.社会主义的本质：（1）关键：搞清楚“什么是社会主义，怎样建设社会主义”，关键是要在坚持社会主义基本制度的基础上进一步认清社会主义的本质；（2）本质：解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。\n\n3.邓小平对社会主义本质的概括：邓小平对社会主义本质的概括，既包括了社会主义社会的生产力问题，又包括了社会主义社会的生产关系问题，是一个有机的整体：；（1）它突出地强调解放和发展生产力在社会主义社会发展中的重要地位：①纠正了过去关于发展生产力的一些错误观念；②反映了中国社会主义整个历史阶段尤其是初级阶段，特别需要注重生产力发展的迫切要求；③邓小平把解放生产力和发展生产力联系在一起，作为社会主义的本质来讲，是对社会主义的新认识；（2）它突出地强调“消灭剥削，消除两极分化，最终达到共同富裕”，从生产关系和发展目标角度认识和把握社会主义本质：①这实质上体现了社会主义发展的价值目标；②体现了发展手段和发展目的的统一；③为我们坚持和完善公有制指出了明确的方向。\n\n4.意义：（1）邓小平关于社会主义本质的概括，反映了人民的利益和时代的要求；（2）廓清了不合乎时代进步和社会发展规律的模糊观念；（3）摆脱了长期以来拘泥于具体模式而忽略社会主义本质的错误倾向，把对社会主义的认识提高到新的科学水平。","notes":"","source":"苏一《27命题点高清图谱》印刷第51页；按原分支整理","source_pages":[51],"source_pdf_pages":[56],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p056_n015","p056_n016","p056_n017","p056_n018","p056_n019","p056_n020","p056_n021","p056_n022","p056_n023","p056_n024","p056_n025","p056_n026","p056_n027","p056_n028","p056_n029","p056_n030","p056_n031","p056_n032"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p056_a002","kind":"政治素养","text":"过去，只讲在社会主义条件下发展生产力，没有讲还要通过改革解放生产力，不完全。应该把解放生产力和发展生产力两个讲全了","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":168},{"id":"suyi-mao-p051-n033-g01","revision":1,"path":["毛中特","第六章 邓小平理论","考点2：邓小平理论的精髓"],"type":"group","title":"邓小平理论的精髓","question":"邓小平理论的精髓的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.邓小平理论的精髓：解放思想、实事求是\n\n2.党的思想路线重新确立的意义：（1）坚持解放思想、实事求是，有力推动和保证了拨乱反正的进行；（2）坚持解放思想、实事求是，破除了僵化的社会主义模式观念，坚持走自己的路；（3）坚持解放思想、实事求是，一切从社会主义初级阶段的实际出发；（4）坚持解放思想、实事求是，坚持以“三个有利于”作为检验一切工作是非得失的根本标准。","notes":"","source":"苏一《27命题点高清图谱》印刷第51页；按原分支整理","source_pages":[51],"source_pdf_pages":[56],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p056_n034","p056_n035","p056_n036","p056_n037","p056_n038","p056_n039"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":169},{"id":"suyi-mao-p052-n002-g01","revision":1,"path":["毛中特","第六章 邓小平理论","考点3：邓小平理论的主要内容"],"type":"group","title":"邓小平理论的主要内容：社会主义初级阶段理论","question":"邓小平理论的主要内容：社会主义初级阶段理论有哪些阶段、重要节点及其意义？","answer":"1.社会主义初级阶段理论：（1）党的十三大召开前夕：邓小平第一次把社会主义初级阶段作为事关全局的基本国情加以把握；明确了这一基本国情是制定路线方针政策的出发点和根本依据；（2）党的十三大：系统地阐述了社会主义初级阶段的科学内涵；①首先，阐明了社会主义初级阶段这个论断包括两层含义：第一，我国社会已经是社会主义社会，我们必须坚持而不能离开社会主义；第二，我国的社会主义社会还处在初级阶段，我们必须从这个实际出发，而不能超越这个阶段；②其次，强调了社会主义初级阶段的长期性：第一，我国的社会主义初级阶段，不是泛指任何国家进入社会主义都会经历的起始阶段；第二，而是特指我国在生产力落后、商品经济不发达条件下建设社会主义必然要经历的特定阶段；③最后，阐述了社会主义初级阶段的基本特征；（3）意义：①我国正处于社会主义初级阶段的科学论断，使我们党对社会主义建设的长期性、复杂性、艰巨性有了更加清醒的认识；②社会主义初级阶段理论，基于对中国国情的准确把握，揭示了当代中国的历史方位；③社会主义初级阶段理论，是对马克思主义关于社会主义发展阶段理论的重大发展和重大突破，为建设中国特色社会主义提供了总依据。","notes":"","source":"苏一《27命题点高清图谱》印刷第52页；按原分支整理","source_pages":[52],"source_pdf_pages":[57],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p057_n003","p057_n004","p057_n005","p057_n006","p057_n007","p057_n008","p057_n009","p057_n010","p057_n011","p057_n012","p057_n013","p057_n014","p057_n015","p057_n016","p057_n017","p057_n018","p057_n019"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p057_a001","kind":"政治素养","text":"正确认识党和人民事业所处的历史方位和发展阶段，是我们党明确阶段性中心任务、制定路线方针政策的根本依据，也是我们党领导革命、建设、改革不断取得胜利的重要经验","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":170},{"id":"suyi-mao-p052-n002-g02","revision":1,"path":["毛中特","第六章 邓小平理论","考点3：邓小平理论的主要内容"],"type":"group","title":"邓小平理论的主要内容：党在社会主义初级阶段的基本路线","question":"邓小平理论的主要内容：党在社会主义初级阶段的基本路线有哪些阶段、重要节点及其意义？","answer":"2.党在社会主义初级阶段的基本路线：（1）提出：党的十三大提出了党在社会主义初级阶段的基本路线：领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强、民主、文明的社会主义现代化国家而奋斗；（2）内容：①建设“富强、民主、文明的社会主义现代化国家”：是党在社会主义初级阶段的奋斗目标；②以经济建设为中心，坚持四项基本原则，坚持改革开放，是实现奋斗目标的基本途径：区别：第一，以经济建设为中心——回答了社会主义的根本任务问题；第二，坚持四项基本原则——回答了解放和发展生产力的政治保证问题；第三，坚持改革开放——回答了社会主义的发展动力和外部条件问题；联系：它们是一个整体，集中体现了我国社会主义现代化建设的战略布局；揭示了中国特色社会主义的客观规律和发展道路；③领导和团结各族人民：是实现奋斗目标的领导力量和依靠力量；④自力更生、艰苦创业：是实现奋斗目标的根本立足点；（3）重要性：①党的基本路线是兴国、立国、强国的重大法宝；②是实现科学发展的政治保证；③是国家的生命线、人民的幸福线；（4）充实和完善：①党的十七大把“和谐”与“富强、民主、文明”一起写入了基本路线；②党的十九大提出“为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗”，进一步拓展了党的基本路线。","notes":"","source":"苏一《27命题点高清图谱》印刷第52页；按原分支整理","source_pages":[52],"source_pdf_pages":[57],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p057_n020","p057_n021","p057_n022","p057_n023","p057_n024","p057_n025","p057_n026","p057_n027","p057_n028","p057_n029","p057_n030","p057_n031","p057_n032","p057_n033","p057_n034","p057_n035","p057_n036","p057_n037","p057_n038","p057_n039","p057_n040"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p057_a002","kind":"政治素养","text":"1.以经济建设为中心：是党在改革开放和社会主义现代化建设新时期实现的最根本的拨乱反正。能否坚持以经济建设为中心，是关系到我国社会主义现代化的成败、关系到社会主义的前途和命运的大问题\n2.四项基本原则：是立国之本，是我们党和国家生存发展的政治基石\n3.改革开放：是强国之路，是我们党和国家发展进步的活力源泉\n4.要把“一个中心、两个基本点”统一于中国特色社会主义的伟大实践，贯穿于社会主义现代化建设的整个过程","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p057_a003","kind":"政治素养","text":"1.党的十七大把“和谐”写入了基本路线\n2.党的十九大将“美丽”写入了基本路线，同时将“现代化国家”提升为“现代化强国”，进一步拓展了党的基本路线","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p057_a005","kind":"重点提示","text":"“一个中心、两个基本点”","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":171},{"id":"suyi-mao-p052-n002-g03","revision":1,"path":["毛中特","第六章 邓小平理论","考点3：邓小平理论的主要内容"],"type":"group","title":"邓小平理论的主要内容：社会主义根本任务和发展战略理论","question":"邓小平理论的主要内容：社会主义根本任务和发展战略理论的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"3.社会主义根本任务和发展战略理论：社会主义的根本任务：（1）社会主义的根本任务是发展生产力，党和国家的工作重点是经济建设——这是党对我国社会主义建设经验教训和社会主义主要矛盾进行科学分析得出的最重要的结论；（2）中国解决所有问题的关键是要靠自己的发展——发展才是硬道理；（3）发展生产力离不开科学技术——“科学技术是第一生产力”，“四个现代化，关键是科学技术的现代化”；分三步走基本实现现代化的发展战略：党的十三大把邓小平提出的“三步走”的发展战略构想确定下来：；（1）第一步，到1990年实现国民生产总值比1980年翻一番，解决人民的温饱问题；（2）第二步，到20世纪末，使国民生产总值再增长一倍，人民生活达到小康水平；（3）第三步，到21世纪中叶，人均国民生产总值达到中等发达国家水平，人民生活比较富裕，基本实现现代化。然后，在这个基础上继续前进。","notes":"","source":"苏一《27命题点高清图谱》印刷第52页；按原分支整理","source_pages":[52],"source_pdf_pages":[57],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p057_n041","p057_n042","p057_n043","p057_n044","p057_n045","p057_n046","p057_n047","p057_n048","p057_n049","p057_n050"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p057_a004","kind":"政治素养","text":"为了更好地实现“三步走”的现代化发展战略，邓小平提出了以重点带动全局的思想、“台阶式”发展的思想，允许和鼓励一部分地区、一部分人先富起来逐步实现共同富裕的思想","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":172},{"id":"suyi-mao-p052-n002-g04","revision":1,"path":["毛中特","第六章 邓小平理论","考点3：邓小平理论的主要内容"],"type":"group","title":"邓小平理论的主要内容：社会主义改革开放理论","question":"邓小平理论的主要内容：社会主义改革开放理论的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"4.社会主义改革开放理论：（1）提出：党的十一届三中全会开启了改革开放和社会主义现代化的伟大征程；（2）改革的性质：改革是一场深刻的社会变革，是中国的第二次革命，是实现中国现代化的必由之路：；①改革不是原有经济体制的细枝末节的修补，而是对体制的根本性变革；②改革的实质和目标是要从根本上改变束缚我国生产力发展的经济体制，建立充满生机和活力的社会主义新经济体制，同时相应地改革政治体制和其他方面的体制，以实现中国的社会主义现代化；③改革不是一个阶级推翻另一个阶级那种原来意义上的革命；④改革也不是否定和抛弃我们建立起来的社会主义基本制度，而是社会主义制度的自我完善和发展；（3）改革的重要性：改革是社会主义社会发展的直接动力；改革是从根本上改变束缚生产力发展的经济体制，促进生产力的发展，解决社会主义社会发展动力问题。","notes":"","source":"苏一《27命题点高清图谱》印刷第52页；按原分支整理","source_pages":[52],"source_pdf_pages":[57],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p057_n051","p057_n052","p057_n053","p057_n054","p057_n055","p057_n056","p057_n057","p057_n058","p057_n059","p057_n060","p057_n061"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":173},{"id":"suyi-mao-p052-n002-g05","revision":1,"path":["毛中特","第六章 邓小平理论","考点3：邓小平理论的主要内容"],"type":"group","title":"邓小平理论的主要内容：社会主义改革开放理论","question":"邓小平理论的主要内容：社会主义改革开放理论的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"4.社会主义改革开放理论：（4）判断改革和各方面是非得失的“三个有利于”标准：①是否有利于发展社会主义社会的生产力；②是否有利于增强社会主义国家的综合国力；③是否有利于提高人民的生活水平；（5）开放也是改革：①对外开放是建设中国特色社会主义的一项基本国策，和改革一起成为新时期最鲜明的特征；②实行对外开放要处理好的关系：第一，要正确对待资本主义社会创造的现代文明成果；第二，要高度珍惜并坚决维护中国人民经过长期奋斗得来的独立自主权利；（6）重要性：①改革开放是当代中国的鲜明标志和活力源泉；②是决定中国命运的关键一招，也是实现中华民族伟大复兴的关键一招。","notes":"","source":"苏一《27命题点高清图谱》印刷第53页；按原分支整理","source_pages":[53],"source_pdf_pages":[58],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p058_n003","p058_n004","p058_n005","p058_n006","p058_n007","p058_n008","p058_n009","p058_n010","p058_n011","p058_n012","p058_n013","p058_n014","p058_n015"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p058_a001","kind":"政治素养","text":"“三个有利于”标准是内在统一的，发展社会主义社会的生产力是首要的也是最根本的一条，增强社会主义国家的综合国力和提高人民生活水平是以生产力发展为前提，也是发展生产力的目的","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p058_a002","kind":"政治素养","text":"（实行对外开放）\n1.是对中国经济发展停滞落后历史教训深刻总结的结果\n2.是对当代世界经济、科技发展和国际形势发展敏锐观察的结果","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":174},{"id":"suyi-mao-p052-n002-g06","revision":1,"path":["毛中特","第六章 邓小平理论","考点3：邓小平理论的主要内容"],"type":"group","title":"邓小平理论的主要内容：社会主义市场经济理论","question":"邓小平理论的主要内容：社会主义市场经济理论的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"5.社会主义市场经济理论：（1）提出：1992年，邓小平在南方谈话中，明确提出：；①计划多一点还是市场多一点，不是社会主义与资本主义的本质区别；②计划经济不等于社会主义，资本主义也有计划；③市场经济不等于资本主义，社会主义也有市场。计划和市场都是经济手段；重要性：①这一精辟论述从理论上突破了计划经济和市场经济是制度属性的观念；②从根本上解除了把计划经济和市场经济看做属于社会基本制度范畴的思想束缚；③标志着邓小平的社会主义市场经济理论的形成；丰富内涵：①计划经济和市场经济不是划分社会制度的标志。计划经济不等于社会主义，市场经济也不等于资本主义；②计划和市场都是经济手段，对经济活动的调节各有优势，社会主义实行市场经济是要把两者优势结合起来；③市场经济作为资源配置手段本身不具有制度属性，可以和不同的社会制度结合，从而表现出不同的性质；（2）意义：邓小平的社会主义市场经济理论：①实现了马克思主义政治经济学的重大创新；②是中国特色社会主义政治经济学的重要组成部分；③为社会主义市场经济体制改革目标的确立和中国特色社会主义经济建设提供了指南。","notes":"","source":"苏一《27命题点高清图谱》印刷第53页；按原分支整理","source_pages":[53],"source_pdf_pages":[58],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p058_n016","p058_n017","p058_n018","p058_n019","p058_n020","p058_n021","p058_n022","p058_n023","p058_n024","p058_n025","p058_n026","p058_n027","p058_n028","p058_n029","p058_n030","p058_n031","p058_n032","p058_n033"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p058_a003","kind":"政治素养","text":"这也为党的十四大明确把建立社会主义市场经济体制作为我国经济体制改革的目标奠定了理论基础","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p058_a004","kind":"政治素养","text":"1.坚持社会主义制度与市场经济的结合，是社会主义市场经济的特色所在、优势所在\n2.计划经济和市场经济：属于不同的资源配置方式，本身不具有制度属性","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p058_a005","kind":"政治素养","text":"1.台湾问题是国内战争遗留下来的问题，属于中国的内政，不允许外国干涉\n2.香港问题和澳门问题是历史上殖民主义侵略遗留下来的问题","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":175},{"id":"suyi-mao-p052-n002-g07","revision":1,"path":["毛中特","第六章 邓小平理论","考点3：邓小平理论的主要内容"],"type":"group","title":"邓小平理论的主要内容：“两手抓，两手都要硬”、“一国两制”与祖国统一","question":"围绕邓小平理论的主要内容：“两手抓，两手都要硬”、“一国两制”与祖国统一，“两手抓，两手都要硬”、“一国两制”与祖国统一分别是什么？","answer":"6.“两手抓，两手都要硬”：（1）一手抓物质文明，一手抓精神文明；（2）一手抓建设，一手抓法制；（3）一手抓改革开放，一手抓惩治腐败。\n\n7.“一国两制”与祖国统一：（1）提出：①“一国两制”是邓小平在坚持四项基本原则的基础上，从中国的实际出发提出的实现祖国和平统一的伟大构想；②“一国两制”构想最早是针对台湾问题提出来的，后来扩展到用来解决香港、澳门问题；（2）基本内容：①坚持一个中国，是“和平统一、一国两制”的核心，是发展两岸关系和实现和平统一的基础；②两制并存，在祖国统一的前提下，国家的主体部分实行社会主义制度，同时在台湾、香港、澳门保持原有的社会制度和生活方式长期不变；③高度自治，祖国完全统一后，香港、澳门、台湾作为中央政府全面管辖下的特别行政区，享有不同于中国其他省、市、自治区的高度自治权；④尽最大努力争取和平统一，但不承诺放弃使用武力；⑤解决台湾问题，实现祖国完全统一，寄希望于台湾人民；（3）意义：①“一国两制”的构想是邓小平运用辩证唯物主义和历史唯物主义，坚持实事求是，把和平共处的原则用于解决一个国家的统一问题；②既体现了坚持祖国统一、维护国家主权的原则性，又体现了照顾历史实际和现实可能的灵活性；③是对马克思主义国家学说的创造性发展；④开辟了以和平方式实现祖国统一的新途径。","notes":"","source":"苏一《27命题点高清图谱》印刷第53页；按原分支整理","source_pages":[53],"source_pdf_pages":[58],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p058_n034","p058_n035","p058_n036","p058_n037","p058_n038","p058_n039","p058_n040","p058_n041","p058_n042","p058_n043","p058_n044","p058_n045","p058_n046","p058_n047","p058_n048","p058_n049","p058_n050","p058_n051","p058_n052"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":176},{"id":"suyi-mao-p052-n002-g08","revision":1,"path":["毛中特","第六章 邓小平理论","考点3：邓小平理论的主要内容"],"type":"group","title":"邓小平理论的主要内容：中国特色社会主义外交和国际战略、党的建设理论","question":"邓小平理论的主要内容：中国特色社会主义外交和国际战略、党的建设理论的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"8.中国特色社会主义外交和国际战略：（1）中国的和平外交政策是独立自主的，是真正的不结盟；（2）确立党际关系“四项原则”：独立自主、完全平等、互相尊重、互不干涉内部事务。\n\n9.党的建设理论：建设中国特色社会主义，关键在于坚持、加强和改善党的领导","notes":"","source":"苏一《27命题点高清图谱》印刷第53页；按原分支整理","source_pages":[53],"source_pdf_pages":[58],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p058_n053","p058_n054","p058_n055","p058_n056"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":177},{"id":"suyi-mao-p053-n057-g01","revision":1,"path":["毛中特","第六章 邓小平理论","考点4：邓小平理论的历史地位"],"type":"group","title":"邓小平理论的历史地位","question":"邓小平理论的历史地位体现在哪些方面？相关定位和适用条件是什么？","answer":"1.马克思列宁主义、毛泽东思想的继承和发展\n\n2.中国特色社会主义理论体系的开篇之作\n\n3.改革开放和社会主义现代化建设的科学指南","notes":"","source":"苏一《27命题点高清图谱》印刷第53页；按原分支整理","source_pages":[53],"source_pdf_pages":[58],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p058_n058","p058_n059","p058_n060"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":178},{"id":"suyi-mao-p054-n003-g01","revision":1,"path":["毛中特","第七章 三个代表重要思想","考点1：核心观点"],"type":"group","title":"核心观点","question":"围绕核心观点，始终代表中国先进生产力的发展要求、始终代表中国先进文化的前进方向、始终代表中国最广大人民的根本利益分别是什么？","answer":"1.始终代表中国先进生产力的发展要求\n\n2.始终代表中国先进文化的前进方向\n\n3.始终代表中国最广大人民的根本利益","notes":"","source":"苏一《27命题点高清图谱》印刷第54页；按原分支整理","source_pages":[54],"source_pdf_pages":[59],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p059_n004","p059_n005","p059_n006"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":179},{"id":"suyi-mao-p054-n008-g01","revision":1,"path":["毛中特","第七章 三个代表重要思想","考点2：主要内容"],"type":"group","title":"主要内容","question":"主要内容的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.发展是党执政兴国的第一要务：正确认识和处理改革、发展、稳定的关系：（1）改革是动力，发展是目的，稳定是前提；（2）要把改革的力度、发展的速度和社会可承受的程度统一起来；（3）把不断改善人民生活作为处理改革发展稳定关系的重要结合点；（4）在社会稳定中推进改革发展，通过改革发展促进社会稳定。\n\n2.建立社会主义市场经济体制：（1）党的十四大正式把建立社会主义市场经济体制确立为我国经济体制改革的目标；（2）必须坚持和完善公有制为主体、多种所有制经济共同发展的社会主义基本经济制度：①一方面，必须毫不动摇地巩固和发展公有制经济；②另一方面，必须毫不动摇地鼓励、支持和引导非公有制经济发展；（3）公有制的实现形式指：资产或资本的组织形式和经营方式。\n\n3.全面建设小康社会：党的十五大报告初步勾画了实现第三步战略目标的蓝图（新的“三步走”战略）：；（1）第一步，21世纪第一个十年实现国民生产总值比2000年翻一番，使人民的小康生活更加宽裕，形成比较完善的社会主义市场经济体制；（2）第二步，再经过十年的努力，到建党一百年时，使国民经济更加发展，各项制度更加完善；（3）第三步，到21世纪中叶新中国成立一百年时，基本实现现代化，建成富强民主文明的社会主义国家。\n\n4.建设社会主义政治文明：必须坚持依法治国。党的十五大报告指出：依法治国：（1）是党领导人民治理国家的基本方略；（2）是发展社会主义市场经济的客观需要；（3）是社会文明进步的重要标志；（4）是国家长治久安的重要保障；1999年，“实行依法治国，建设社会主义法治国家”正式入宪。\n\n5.实施“引进来”和“走出去”相结合的对外开放战略：（1）对外开放是一项长期的基本国策；（2）加入世界贸易组织：时间：2001年我国正式加入世界贸易组织；意义：①是我国面对经济全球化趋势加快作出的重大战略决策，是从我国经济发展和改革开放的需要出发的；②标志着我国对外开放进入了一个新的阶段，加入世界贸易组织是我国对外开放的里程碑；③使中国经济在全球化进程中获得参与制定规则和竞争的有利位置；④从而打开了对外开放的新天地，对推动经济体制改革和现代化建设产生了深刻影响；⑤我国从国际经贸规则的被动接受者和主动接轨者，逐步成长为重要参与者；原则：第一，中国加入世界贸易组织的原则是中国经济发展的需要，同样世界贸易组织也需要中国；第二，中国是一个发展中国家，社会生产力还不发达，只能以发展中国家的条件加入世界贸易组织；第三，中国加入世界贸易组织，权利和义务一定要平衡，中国不会接受过高的、超出中国承受能力的要价；（3）办好经济特区是继续推进我国改革开放和现代化建设的重大举措。\n\n6.推进党的建设新的伟大工程（略）","notes":"","source":"苏一《27命题点高清图谱》印刷第54页；按原分支整理","source_pages":[54],"source_pdf_pages":[59],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p059_n009","p059_n010","p059_n011","p059_n012","p059_n013","p059_n014","p059_n015","p059_n016","p059_n017","p059_n018","p059_n019","p059_n020","p059_n021","p059_n022","p059_n023","p059_n024","p059_n025","p059_n026","p059_n027","p059_n028","p059_n029","p059_n030","p059_n031","p059_n032","p059_n033","p059_n034","p059_n035","p059_n036","p059_n037","p059_n038","p059_n039","p059_n040","p059_n041","p059_n042","p059_n043","p059_n044","p059_n045","p059_n046","p059_n047","p059_n048"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p059_a002","kind":"政治素养","text":"1.
