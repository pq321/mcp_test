公有制经济是社会主义性质的经济成分\n2.非公有制经济本身不是社会主义性质的，也不是社会主义经济的组成部分\n3.非公有制经济，是社会主义市场经济的重要组成部分，是为社会主义服务的经济成分（社会主义经济≠社会主义市场经济）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":180},{"id":"suyi-mao-p054-n049-g01","revision":1,"path":["毛中特","第七章 三个代表重要思想","考点3：“三个代表”重要思想的历史地位"],"type":"group","title":"“三个代表”重要思想的历史地位","question":"“三个代表”重要思想的历史地位体现在哪些方面？相关定位和适用条件是什么？","answer":"1.中国特色社会主义理论体系的丰富发展\n\n2.加强和改进党的建设、推进中国特色社会主义事业的强大理论武器","notes":"","source":"苏一《27命题点高清图谱》印刷第54页；按原分支整理","source_pages":[54],"source_pdf_pages":[59],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p059_n050","p059_n051"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":181},{"id":"suyi-mao-p055-n002-g01","revision":1,"path":["毛中特","第八章 科学发展观","考点1：科学发展观的科学内涵"],"type":"group","title":"科学发展观的科学内涵","question":"围绕科学发展观的科学内涵，第一要义是推动经济社会发展、核心立场是以人为本、基本要求是全面协调可持续、根本方法是统筹兼顾分别是什么？","answer":"1.第一要义是推动经济社会发展：（1）我们党执政，首要任务就是带领人民推动经济社会发展，不断满足人民日益增长的物质文化需要；（2）坚持发展是硬道理的本质要求就是坚持科学发展。\n\n2.核心立场是以人为本：以人为本就是以最广大人民的根本利益为本；（1）以人为本的“人”是指人民和群众；（2）以人为本的“本”，就是根本，就是出发点和落脚点。\n\n3.基本要求是全面协调可持续：（1）“全面”是指发展要有全面性、整体性；（2）“协调”是指发展要有协调性、均衡性；（3）“可持续”是指发展要有持久性、连续性。\n\n4.根本方法是统筹兼顾","notes":"","source":"苏一《27命题点高清图谱》印刷第55页；按原分支整理","source_pages":[55],"source_pdf_pages":[60],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p060_n003","p060_n004","p060_n005","p060_n006","p060_n007","p060_n008","p060_n009","p060_n010","p060_n011","p060_n012","p060_n013","p060_n014"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":182},{"id":"suyi-mao-p055-n015-g01","revision":1,"path":["毛中特","第八章 科学发展观","考点2：科学发展观的主要内容"],"type":"group","title":"科学发展观的主要内容","question":"围绕科学发展观的主要内容，发展社会主义民主政治、构建社会主义和谐社会、推进生态文明建设、全面提高党的建设科学化水平分别是什么？","answer":"1.加快转变经济发展方式：推动经济持续健康发展，必须坚持以科学发展为主题，以加快转变经济发展方式为主线\n\n2.发展社会主义民主政治：坚持中国特色社会主义政治发展道路，最根本的是要坚持党的领导、人民当家作主、依法治国有机统一；（1）党的领导是人民当家作主和依法治国的根本保证；（2）人民当家作主是社会主义民主政治的本质和核心；（3）依法治国是党领导人民治理国家的基本方略。\n\n3.推进社会主义文化强国建设：社会主义核心价值体系是兴国之魂，决定着中国特色社会主义的发展方向\n\n4.构建社会主义和谐社会：（1）社会和谐是中国特色社会主义的本质属性；（2）总要求：民主法治、公平正义、诚信友爱、充满活力、安定有序、人与自然和谐相处。\n\n5.推进生态文明建设：（1）建设生态文明，是关系人民福祉、关乎民族未来的长远大计；（2）建设生态文明，实质上就是要建设以资源环境承载力为基础、以自然规律为准则、以可持续发展为目标的资源节约型、环境友好型社会。\n\n6.全面提高党的建设科学化水平：（1）主线：加强党的执政能力建设、先进性和纯洁性建设；（2）保持和发展党的先进性是马克思主义政党自身建设的根本任务和永恒课题。","notes":"","source":"苏一《27命题点高清图谱》印刷第55页；按原分支整理","source_pages":[55],"source_pdf_pages":[60],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p060_n016","p060_n017","p060_n018","p060_n019","p060_n020","p060_n021","p060_n022","p060_n023","p060_n024","p060_n025","p060_n026","p060_n027","p060_n028","p060_n029","p060_n030","p060_n031"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":183},{"id":"suyi-mao-p055-n032-g01","revision":1,"path":["毛中特","第八章 科学发展观","考点3：科学发展观的历史地位"],"type":"group","title":"科学发展观的历史地位","question":"科学发展观的历史地位体现在哪些方面？相关定位和适用条件是什么？","answer":"1.中国特色社会主义理论体系在新世纪新阶段的接续发展：（1）科学发展观最鲜明的精神实质：解放思想、实事求是、与时俱进、求真务实；（2）创造性地回答了新形势下实现什么样的发展、怎样发展等重大问题。\n\n2.全面建设小康社会、加快推进社会主义现代化的根本指针","notes":"","source":"苏一《27命题点高清图谱》印刷第55页；按原分支整理","source_pages":[55],"source_pdf_pages":[60],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p060_n033","p060_n034","p060_n035","p060_n036"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":184},{"id":"suyi-xi-p056-n002-g01","revision":1,"path":["新思想","导论","考点1：习近平新时代中国特色社会主义思想创立的时代背景"],"type":"group","title":"习近平新时代中国特色社会主义思想创立的时代背景","question":"围绕习近平新时代中国特色社会主义思想创立的时代背景，世界百年未有之大变局加速演进、中华民族伟大复兴进入关键时期、中国式现代化全面推进拓展、中国共产党自我革命开辟新的境界分别是什么？","answer":"1.世界百年未有之大变局加速演进\n\n2.中华民族伟大复兴进入关键时期\n\n3.中国式现代化全面推进拓展\n\n4.科学社会主义在21世纪的中国焕发新的蓬勃生机\n\n5.中国共产党自我革命开辟新的境界","notes":"","source":"苏一《27命题点高清图谱》印刷第56页；按原分支整理","source_pages":[56],"source_pdf_pages":[61],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p061_n003","p061_n004","p061_n005","p061_n006","p061_n007"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p061_a001","kind":"政治素养","text":"“两个结合”是推进马克思主义中国化时代化的根本途径。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p061_a002","kind":"政治素养","text":"马克思主义能不能在实践中发挥作用：1.关键在于能否把马克思主义基本原理同中国实际和时代特征结合起来；2.关键在于能否运用其科学的世界观和方法论解决中国的问题。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p061_a003","kind":"政治素养","text":"“两个结合”表明了三个“新高度”：1.我们党对自身道路、理论、制度的认识达到新高度；2.我们党对中华优秀传统文化的认识达到新高度；3.表明我们党在传承中华优秀传统文化中推进理论创新的自觉性达到新高度。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":185},{"id":"suyi-xi-p056-n008-g01","revision":1,"path":["新思想","导论","考点2：习近平新时代中国特色社会主义思想是“两个结合”的重大成果"],"type":"group","title":"习近平新时代中国特色社会主义思想是“两个结合”的重大成果","question":"习近平新时代中国特色社会主义思想是“两个结合”的重大成果的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.习近平新时代中国特色社会主义思想是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的重大成果，是坚持“两个结合”的光辉典范\n\n2.“两个结合”是我们党在探索中国特色社会主义道路中得出的规律性认识，是我们取得成功的最大法宝\n\n3.内涵：（1）习近平新时代中国特色社会主义思想坚持把马克思主义基本原理同中国具体实际相结合：①用马克思主义之“矢”去射新时代中国之“的”；②习近平新时代中国特色社会主义思想是最现实、最鲜活的中国化时代化的马克思主义；（2）习近平新时代中国特色社会主义思想坚持把马克思主义基本原理同中华优秀传统文化相结合，不断夯实马克思主义中国化时代化的历史基础和群众基础：①“结合”的前提是彼此契合。“结合”不是硬凑在一起。马克思主义和中华优秀传统文化来源不同，但彼此存在高度的契合性，相互契合才能有机结合；②“结合”的结果是互相成就。造就了一个有机统一的新的文化生命体，“第二个结合”让马克思主义成为中国的，中华优秀传统文化成为现代的，让经由“结合”而形成的新文化成为中国式现代化的文化形态；③“结合”筑牢了道路根基，让中国特色社会主义道路有了更加宏阔深远的历史纵深，拓展了中国特色社会主义道路的文化根基；④“结合”打开了创新空间。“第二个结合”是又一次的思想解放，让我们能够在更广阔的文化空间中，充分运用中华优秀传统文化的宝贵资源，探索面向未来的理论和制度创新；⑤“结合”巩固了文化主体性。创立习近平新时代中国特色社会主义思想就是这一文化主体性的最有力体现。\n\n4.“两个结合”是对坚持和发展马克思主义作出的重大理论贡献：（1）让中国特色社会主义道路有了更加宏阔深远的历史纵深；（2）拓展了中国特色社会主义道路的文化根基；（3）开辟了广阔的理论和实践创新空间。","notes":"","source":"苏一《27命题点高清图谱》印刷第56页；按原分支整理","source_pages":[56],"source_pdf_pages":[61],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p061_n009","p061_n010","p061_n011","p061_n012","p061_n013","p061_n014","p061_n015","p061_n016","p061_n017","p061_n018","p061_n019","p061_n020","p061_n021","p061_n022","p061_n023","p061_n024"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p061_a001","kind":"政治素养","text":"“两个结合”是推进马克思主义中国化时代化的根本途径。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p061_a002","kind":"政治素养","text":"马克思主义能不能在实践中发挥作用：1.关键在于能否把马克思主义基本原理同中国实际和时代特征结合起来；2.关键在于能否运用其科学的世界观和方法论解决中国的问题。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p061_a003","kind":"政治素养","text":"“两个结合”表明了三个“新高度”：1.我们党对自身道路、理论、制度的认识达到新高度；2.我们党对中华优秀传统文化的认识达到新高度；3.表明我们党在传承中华优秀传统文化中推进理论创新的自觉性达到新高度。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":186},{"id":"suyi-xi-p056-n025-g01","revision":1,"path":["新思想","导论","考点3：习近平新时代中国特色社会主义思想是完整的科学体系"],"type":"group","title":"习近平新时代中国特色社会主义思想是完整的科学体系","question":"围绕习近平新时代中国特色社会主义思想是完整的科学体系，时代课题、主要内容、“六个必须坚持”分别是什么？","answer":"1.时代课题：（1）新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义；（2）建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国；（3）建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。\n\n2.主要内容：党的十九大、十九届六中全会提出的“十个明确”“十四个坚持”“十三个方面成就”概括了习近平新时代中国特色社会主义思想的主要内容；“十个明确”：（1）是习近平新时代中国特色社会主义思想的主体内容；（2）集中体现了这一思想体系的主要观点和基本精神；（3）构成了这一思想体系的四梁八柱，发挥着统摄作用；“十四个坚持”：（1）是习近平新时代中国特色社会主义思想的重要组成部分；（2）是在治国理政各方面作出的理论分析和政策指导；（3）构成了新时代坚持和发展中国特色社会主义的基本方略；“十三个方面成就”：（1）对新时代伟大实践进行了科学总结；（2）全景式地展示了习近平新时代中国特色社会主义思想的理论与实践成果。\n\n3.“六个必须坚持”：党的二十大提出的“六个必须坚持”，是习近平新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法的集中体现；（1）坚持人民至上是根本价值立场，体现了历史唯物主义群众史观；（2）坚持自信自立是内在精神特质，体现了客观规律性和主观能动性的有机结合；（3）坚持守正创新是鲜明理论品格，体现了变与不变、继承与发展的内在联系；（4）坚持问题导向是重要实践要求，体现了矛盾的普遍性和客观性；（5）坚持系统观念是基本思想和工作方法，体现了辩证唯物主义普遍联系的原理；（6）坚持胸怀天下是中国共产党人的境界格局，体现了马克思主义追求人类进步和解放的崇高理想。\n\n4.“十个明确”“十四个坚持”“十三个方面成就”“六个必须坚持”内在贯通、有机统一：（1）凝结着我们党认识世界、改造世界的宝贵经验和重大成果；（2）体现了理论和实际相结合、认识论和方法论相统一的鲜明特色；（3）共同构成了习近平新时代中国特色社会主义思想的科学体系。","notes":"","source":"苏一《27命题点高清图谱》印刷第56、57页；按原分支整理","source_pages":[56,57],"source_pdf_pages":[61,62],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p061_n026","p061_n027","p061_n028","p061_n029","p061_n030","p061_n031","p061_n032","p061_n033","p061_n034","p061_n035","p061_n036","p061_n037","p061_n038","p061_n039","p061_n040","p061_n041","p061_n042","p062_n003","p062_n004","p062_n005","p062_n006","p062_n007","p062_n008","p062_n009","p062_n010","p062_n011","p062_n012","p062_n013","p062_n014"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p061_a001","kind":"政治素养","text":"“两个结合”是推进马克思主义中国化时代化的根本途径。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p061_a002","kind":"政治素养","text":"马克思主义能不能在实践中发挥作用：1.关键在于能否把马克思主义基本原理同中国实际和时代特征结合起来；2.关键在于能否运用其科学的世界观和方法论解决中国的问题。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p061_a003","kind":"政治素养","text":"“两个结合”表明了三个“新高度”：1.我们党对自身道路、理论、制度的认识达到新高度；2.我们党对中华优秀传统文化的认识达到新高度；3.表明我们党在传承中华优秀传统文化中推进理论创新的自觉性达到新高度。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p062_a001","kind":"政治素养","text":"“六个必须坚持”：1.贯通了唯物论和辩证法、认识论和实践论、真理论和价值论；2.赋予了马克思主义世界观和方法论以新的时代内涵；3.彰显了习近平新时代中国特色社会主义思想的理论品格和鲜明特征；4.体现了理论和实际相结合、认识论和方法论相统一的鲜明特色。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":187},{"id":"suyi-xi-p057-n015-g01","revision":1,"path":["新思想","导论","考点4：习近平新时代中国特色社会主义思想的历史地位"],"type":"group","title":"习近平新时代中国特色社会主义思想的历史地位","question":"习近平新时代中国特色社会主义思想的历史地位体现在哪些方面？相关定位和适用条件是什么？","answer":"习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃\n\n1.习近平新时代中国特色社会主义思想继承和发展马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观，是马克思主义在当代中国发展的最新理论成果，开辟了马克思主义中国化时代化新境界\n\n2.习近平新时代中国特色社会主义思想，把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就，是中华民族的文化主体性最有力的体现，是中华文化和中国精神的时代精华\n\n3.习近平新时代中国特色社会主义思想，是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，是新时代党和国家事业发展的根本遵循","notes":"","source":"苏一《27命题点高清图谱》印刷第57页；按原分支整理","source_pages":[57],"source_pdf_pages":[62],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p062_n016","p062_n017","p062_n018","p062_n019"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p062_a001","kind":"政治素养","text":"“六个必须坚持”：1.贯通了唯物论和辩证法、认识论和实践论、真理论和价值论；2.赋予了马克思主义世界观和方法论以新的时代内涵；3.彰显了习近平新时代中国特色社会主义思想的理论品格和鲜明特征；4.体现了理论和实际相结合、认识论和方法论相统一的鲜明特色。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":188},{"id":"suyi-xi-p057-n020-g01","revision":1,"path":["新思想","导论","考点5：深刻领悟“两个确立”的决定性意义"],"type":"group","title":"深刻领悟“两个确立”的决定性意义","question":"深刻领悟“两个确立”的决定性意义体现在哪些方面？相关定位和适用条件是什么？","answer":"1.“两个确立”，是党在新时代取得的重大政治成果，对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义\n\n2.坚强的领导核心和科学的理论指导是关乎党和国家前途命运、党和人民事业成败的根本性问题\n\n3.党的十九届六中全会指出，党确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位，反映了全党全军全国各族人民共同心愿\n\n4.新时代的伟大实践充分证明，“两个确立”是新时代党和国家事业取得历史性成就、发生历史性变革的决定性因素，是党和人民应对一切不确定性的最大确定性、最大底气、最大保证","notes":"","source":"苏一《27命题点高清图谱》印刷第57页；按原分支整理","source_pages":[57],"source_pdf_pages":[62],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p062_n021","p062_n022","p062_n023","p062_n024"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p062_a001","kind":"政治素养","text":"“六个必须坚持”：1.贯通了唯物论和辩证法、认识论和实践论、真理论和价值论；2.赋予了马克思主义世界观和方法论以新的时代内涵；3.彰显了习近平新时代中国特色社会主义思想的理论品格和鲜明特征；4.体现了理论和实际相结合、认识论和方法论相统一的鲜明特色。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":189},{"id":"suyi-xi-p058-n003-g01","revision":1,"path":["新思想","第一章 新时代坚持和发展中国特色社会主义","考点1：中国特色社会主义是历史和人民的选择（怎么来）"],"type":"group","title":"中国特色社会主义是历史和人民的选择（怎么来）","question":"中国特色社会主义是历史和人民的选择（怎么来）有哪些阶段、重要节点及其意义？","answer":"1.中国特色社会主义是党和人民历经千辛万苦、付出巨大代价取得的根本成就，是实现中华民族伟大复兴的必由之路\n\n2.中国特色社会主义具有深厚的历史渊源和广泛的现实基础，是实现中华民族伟大复兴的正确道路\n\n3.中国特色社会主义不是从天上掉下来的（这是历史的结论、人民的选择）：（1）是在改革开放40多年的伟大实践中得来的；（2）是在新中国成立70多年的持续探索中得来的；（3）是在中国共产党领导人民进行伟大社会革命100多年的实践中得来的；（4）是在近代以来中华民族由衰到盛180多年的历史进程中得来的；（5）是在世界社会主义500多年波澜壮阔的发展历程中得来的；（6）是在对中华文明5000多年的传承发展中得来的。","notes":"","source":"苏一《27命题点高清图谱》印刷第58页；按原分支整理","source_pages":[58],"source_pdf_pages":[63],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p063_n004","p063_n005","p063_n006","p063_n007","p063_n008","p063_n009","p063_n010","p063_n011","p063_n012"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p063_a001","kind":"政治素养","text":"四者统一于中国特色社会主义伟大实践。道路是实现途径、理论体系是行动指南、制度是根本保障、文化是精神力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a002","kind":"政治素养","text":"“四个自信”中“四个制度”相关：重要制度、根本制度、基本制度。制度是根本保障，文化是精神力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a003","kind":"政治素养","text":"中国特色社会主义进入新时代：1.意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃；2.意味着科学社会主义在21世纪的中国焕发出强大生机活力；3.意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a004","kind":"政治素养","text":"党的十九大后，党的主要任务是：实现第一个百年奋斗目标，开启实现第二个百年奋斗目标新征程；朝着实现中华民族伟大复兴的宏伟目标继续前进。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":190},{"id":"suyi-xi-p058-n013-g01","revision":1,"path":["新思想","第一章 新时代坚持和发展中国特色社会主义","考点2：中国特色社会主义是社会主义而不是其他什么主义（是什么）"],"type":"group","title":"中国特色社会主义是社会主义而不是其他什么主义（是什么）","question":"中国特色社会主义是社会主义而不是其他什么主义（是什么）的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"中国特色社会主义是科学社会主义理论逻辑和中国社会发展历史逻辑的辩证统一\n\n1.中国特色社会主义坚持了科学社会主义基本原则\n\n2.中国特色社会主义写出了科学社会主义的“新版本”","notes":"","source":"苏一《27命题点高清图谱》印刷第58页；按原分支整理","source_pages":[58],"source_pdf_pages":[63],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p063_n014","p063_n015","p063_n016"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p063_a001","kind":"政治素养","text":"四者统一于中国特色社会主义伟大实践。道路是实现途径、理论体系是行动指南、制度是根本保障、文化是精神力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a002","kind":"政治素养","text":"“四个自信”中“四个制度”相关：重要制度、根本制度、基本制度。制度是根本保障，文化是精神力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a003","kind":"政治素养","text":"中国特色社会主义进入新时代：1.意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃；2.意味着科学社会主义在21世纪的中国焕发出强大生机活力；3.意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a004","kind":"政治素养","text":"党的十九大后，党的主要任务是：实现第一个百年奋斗目标，开启实现第二个百年奋斗目标新征程；朝着实现中华民族伟大复兴的宏伟目标继续前进。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":191},{"id":"suyi-xi-p058-n017-g01","revision":1,"path":["新思想","第一章 新时代坚持和发展中国特色社会主义","考点3：坚定道路自信、理论自信、制度自信、文化自信"],"type":"group","title":"坚定道路自信、理论自信、制度自信、文化自信","question":"坚定道路自信、理论自信、制度自信、文化自信的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.改革开放以来我们取得一切成绩和进步的根本原因，归结起来就是：（1）开辟了中国特色社会主义道路；（2）形成了中国特色社会主义理论体系；（3）确立了中国特色社会主义制度；（4）发展了中国特色社会主义文化。\n\n2.坚定“四个自信”：（1）坚定道路自信，就是坚信中国特色社会主义道路是我国实现社会主义现代化、创造人民美好生活的必由之路，是实现中华民族伟大复兴的必由之路；（2）坚定理论自信，就是坚信中国特色社会主义理论体系是指导党和人民实现中华民族伟大复兴的正确理论，是立足时代前沿、与时俱进的科学理论；（3）坚定制度自信，就是坚信中国特色社会主义制度是当代中国发展进步的根本制度保障，是具有明显制度优势、强大自我完善能力的先进制度；（4）坚定文化自信，就是坚信中国特色社会主义文化积淀着中华民族最深层的精神追求，代表着中华民族独特的精神标识，是激励全党全国各族人民奋勇前进的强大精神力量：①源自于中华民族5000多年文明历史所孕育的中华优秀传统文化；②熔铸于党领导人民在革命、建设、改革中创造的革命文化和社会主义先进文化；③植根于中国特色社会主义伟大实践。\n\n3.中国特色社会主义道路自信、理论自信、制度自信、文化自信，来源于实践、来源于人民、来源于真理：（1）深厚的实践基础和人民的广泛参与、深刻认同，铸就了“四个自信”的坚实根基；（2）马克思主义深刻揭示了社会主义必然代替资本主义的客观规律，这是我们坚定“四个自信”的理论支撑和根本依据。\n\n4.坚定中国特色社会主义道路自信、理论自信、制度自信、文化自信，中国共产党和中国人民有着深厚的根基和底气：（1）我们有中国共产党的坚强领导，这是中国特色社会主义最本质的特征、中国特色社会主义制度的最大优势；（2）我们有新中国成立、改革开放以来特别是党的十八大以来形成的更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量，时与势在我们一边，这是中国特色社会主义独具的发展优势；（3）我们有连绵不绝的中华5000多年文明，这是中国特色社会主义的文化根脉和突出优势，是我们在世界风云激荡中站稳脚跟的根基。\n\n5.我们说要坚定中国特色社会主义道路自信、理论自信、制度自信，说到底是要坚定文化自信","notes":"","source":"苏一《27命题点高清图谱》印刷第58页；按原分支整理","source_pages":[58],"source_pdf_pages":[63],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p063_n018","p063_n019","p063_n020","p063_n021","p063_n022","p063_n023","p063_n024","p063_n025","p063_n026","p063_n027","p063_n028","p063_n029","p063_n030","p063_n031","p063_n032","p063_n033","p063_n034","p063_n035","p063_n036","p063_n037","p063_n038"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p063_a001","kind":"政治素养","text":"四者统一于中国特色社会主义伟大实践。道路是实现途径、理论体系是行动指南、制度是根本保障、文化是精神力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a002","kind":"政治素养","text":"“四个自信”中“四个制度”相关：重要制度、根本制度、基本制度。制度是根本保障，文化是精神力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a003","kind":"政治素养","text":"中国特色社会主义进入新时代：1.意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃；2.意味着科学社会主义在21世纪的中国焕发出强大生机活力；3.意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a004","kind":"政治素养","text":"党的十九大后，党的主要任务是：实现第一个百年奋斗目标，开启实现第二个百年奋斗目标新征程；朝着实现中华民族伟大复兴的宏伟目标继续前进。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":192},{"id":"suyi-xi-p058-n040-g01","revision":1,"path":["新思想","第一章 新时代坚持和发展中国特色社会主义","考点4：中国特色社会主义新时代是我国发展的历史方位"],"type":"group","title":"中国特色社会主义新时代是我国发展的历史方位","question":"中国特色社会主义新时代是我国发展的历史方位有哪些阶段、重要节点及其意义？","answer":"1.新时代是我国发展新的历史方位，标志着中国特色社会主义事业进入了新的发展阶段\n\n2.新时代的内涵：①历史脉络：是承前启后、继往开来，在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代；②实践主题：是决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代；③人民性：是全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代；④民族性：是全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代；⑤世界性：是我国日益走近世界舞台中央、不断为人类作出更大贡献的时代。\n\n3.依据：（1）中国特色社会主义进入新时代，是我国社会主要矛盾发生新变化的反映（基本依据）；（2）中国特色社会主义进入新时代，是党的主要任务发生新变化的反映；（3）中国特色社会主义进入新时代，是中国和世界关系发生新变化的反映。","notes":"","source":"苏一《27命题点高清图谱》印刷第58页；按原分支整理","source_pages":[58],"source_pdf_pages":[63],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p063_n041","p063_n042","p063_n043","p063_n044","p063_n045","p063_n046","p063_n047","p063_n048","p063_n049","p063_n050","p063_n051"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p063_a001","kind":"政治素养","text":"四者统一于中国特色社会主义伟大实践。道路是实现途径、理论体系是行动指南、制度是根本保障、文化是精神力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a002","kind":"政治素养","text":"“四个自信”中“四个制度”相关：重要制度、根本制度、基本制度。制度是根本保障，文化是精神力量。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a003","kind":"政治素养","text":"中国特色社会主义进入新时代：1.意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃；2.意味着科学社会主义在21世纪的中国焕发出强大生机活力；3.意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p063_a004","kind":"政治素养","text":"党的十九大后，党的主要任务是：实现第一个百年奋斗目标，开启实现第二个百年奋斗目标新征程；朝着实现中华民族伟大复兴的宏伟目标继续前进。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":193},{"id":"suyi-xi-p059-n003-g01","revision":1,"path":["新思想","第一章 新时代坚持和发展中国特色社会主义","考点5：社会主要矛盾变化是关系全局的历史性变化"],"type":"group","title":"社会主要矛盾变化是关系全局的历史性变化","question":"社会主要矛盾变化是关系全局的历史性变化有哪些阶段、重要节点及其意义？","answer":"1.新时代社会主要矛盾：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾\n\n2.新时代我国社会主要矛盾的变化，反映了社会发展的客观实际，明确了解决当代中国发展主要问题的根本着力点\n\n3.新时代我国社会主要矛盾的变化，是关系全局的历史性变化，对党和国家工作提出了许多新要求：（1）要在继续推动发展基础上，着力解决发展不平衡不充分问题；（2）大力提升发展质量和效益，更好满足人民在经济、政治、文化、社会、生态等方面日益增长的需要；（3）更好地推动人的全面发展、社会全面进步。\n\n4.新时代我国社会主要矛盾的变化，是在社会主义初级阶段中的变化：（1）我国仍处于并将长期处于社会主义初级阶段的基本国情没有变；（2）我国是世界最大发展中国家的国际地位没有变。","notes":"","source":"苏一《27命题点高清图谱》印刷第59页；按原分支整理","source_pages":[59],"source_pdf_pages":[64],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p064_n004","p064_n005","p064_n006","p064_n007","p064_n008","p064_n009","p064_n010","p064_n011","p064_n012"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p064_a001","kind":"政治素养","text":"主要矛盾变化和“新时代”的提法：党的十九大提出“新时代”；党的十九大以来我国的社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p064_a002","kind":"易错点","text":"我国社会主义发展处于新的阶段（√，变的是历史方位而不是历史阶段，我国仍处于社会主义初级阶段）。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p064_a003","kind":"政治素养","text":"党的基本理论、基本路线、基本方略，事关党的前途命运，事关中国特色社会主义事业兴衰成败。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":194},{"id":"suyi-xi-p059-n013-g01","revision":1,"path":["新思想","第一章 新时代坚持和发展中国特色社会主义","考点6：新时代伟大变革及其里程碑意义"],"type":"group","title":"新时代伟大变革及其里程碑意义","question":"新时代伟大变革及其里程碑意义体现在哪些方面？相关定位和适用条件是什么？","answer":"1.进入新时代，以习近平同志为核心的党中央解决了许多长期想解决而没有解决的难题，办成了许多过去想办而没有办成的大事，党和国家事业取得历史性成就、发生历史性变革，推动我国迈上全面建设社会主义现代化国家新征程\n\n2.新时代的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有里程碑意义：（1）走过百年奋斗历程的中国共产党在革命性锻造中更加坚强有力，党的政治领导力、思想引领力、群众组织力、社会号召力显著增强；（2）中国人民的前进动力更加强大、奋斗精神更加昂扬、必胜信念更加坚定，焕发出更为强烈的历史自觉和主动精神；（3）改革开放和社会主义现代化建设深入推进，书写了经济快速发展和社会长期稳定两大奇迹新篇章，我国发展具备了更为坚实的物质基础、更为完善的制度保证，实现中华民族伟大复兴进入了不可逆转的历史进程；（4）科学社会主义在21世纪的中国焕发出新的蓬勃生机，中国式现代化为人类实现现代化提供了新的选择，中国共产党和中国人民为解决人类面临的共同问题提供更多更好的中国智慧、中国方案、中国力量，为人类和平与发展崇高事业作出新的更大的贡献。","notes":"","source":"苏一《27命题点高清图谱》印刷第59页；按原分支整理","source_pages":[59],"source_pdf_pages":[64],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p064_n014","p064_n015","p064_n016","p064_n017","p064_n018","p064_n019"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p064_a001","kind":"政治素养","text":"主要矛盾变化和“新时代”的提法：党的十九大提出“新时代”；党的十九大以来我国的社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p064_a002","kind":"易错点","text":"我国社会主义发展处于新的阶段（√，变的是历史方位而不是历史阶段，我国仍处于社会主义初级阶段）。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p064_a003","kind":"政治素养","text":"党的基本理论、基本路线、基本方略，事关党的前途命运，事关中国特色社会主义事业兴衰成败。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":195},{"id":"suyi-xi-p059-n021-g01","revision":1,"path":["新思想","第一章 新时代坚持和发展中国特色社会主义","考点7：全面贯彻党的基本理论、基本路线、基本方略"],"type":"group","title":"全面贯彻党的基本理论、基本路线、基本方略","question":"围绕全面贯彻党的基本理论、基本路线、基本方略，党的基本理论、党的基本路线、党的基本方略分别是什么？","answer":"1.党的基本理论：（1）是坚持和发展中国特色社会主义的行动指南；（2）拥有马克思主义科学理论指导是我们党鲜明的政治品格和强大的政治优势，是我们党坚定信仰信念、把握历史主动的根本所在；（3）中国共产党为什么能，中国特色社会主义为什么好，归根到底是马克思主义行，是中国化时代化的马克思主义行。\n\n2.党的基本路线：（1）是国家的生命线、人民的幸福线；（2）是在深刻总结社会主义建设历史经验教训、科学分析社会主义初级阶段主要任务的基础上探索形成的。\n\n3.党的基本方略：（1）党的十九大概括的以“十四个坚持”为主要内容的基本方略；（2）反映了我们党对建设中国特色社会主义的规律性认识。","notes":"","source":"苏一《27命题点高清图谱》印刷第59页；按原分支整理","source_pages":[59],"source_pdf_pages":[64],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p064_n022","p064_n023","p064_n024","p064_n025","p064_n026","p064_n027","p064_n028","p064_n029","p064_n030","p064_n031"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p064_a001","kind":"政治素养","text":"主要矛盾变化和“新时代”的提法：党的十九大提出“新时代”；党的十九大以来我国的社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p064_a002","kind":"易错点","text":"我国社会主义发展处于新的阶段（√，变的是历史方位而不是历史阶段，我国仍处于社会主义初级阶段）。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p064_a003","kind":"政治素养","text":"党的基本理论、基本路线、基本方略，事关党的前途命运，事关中国特色社会主义事业兴衰成败。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":196},{"id":"suyi-xi-p059-n032-g01","revision":1,"path":["新思想","第一章 新时代坚持和发展中国特色社会主义","考点8：统筹推进“五位一体”总体布局和协调推进“四个全面”战略布局"],"type":"group","title":"统筹推进“五位一体”总体布局和协调推进“四个全面”战略布局","question":"围绕统筹推进“五位一体”总体布局和协调推进“四个全面”战略布局，“五位一体”总体布局、“四个全面”战略布局分别是什么？","answer":"1.“五位一体”总体布局和“四个全面”战略布局相互促进、统筹联动，从全局上确立了新时代坚持和发展中国特色社会主义的战略规划和部署\n\n2.“五位一体”总体布局：（1）是我们党对社会主义建设规律在实践和认识上不断深化的重要成果；（2）内容：经济、政治、文化、社会、生态文明建设。\n\n3.“四个全面”战略布局：（1）是新的时代条件下坚持和发展中国特色社会主义、推进改革开放和社会主义现代化建设的战略抉择；（2）内容：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党：①全面建设社会主义现代化国家是战略目标，在“四个全面”中居于引领地位；②全面深化改革、全面依法治国、全面从严治党是三大战略举措，为全面建设社会主义现代化国家提供重要保障。","notes":"","source":"苏一《27命题点高清图谱》印刷第59页；按原分支整理","source_pages":[59],"source_pdf_pages":[64],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p064_n033","p064_n034","p064_n035","p064_n036","p064_n037","p064_n038","p064_n039","p064_n040","p064_n041"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p064_a001","kind":"政治素养","text":"主要矛盾变化和“新时代”的提法：党的十九大提出“新时代”；党的十九大以来我国的社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p064_a002","kind":"易错点","text":"我国社会主义发展处于新的阶段（√，变的是历史方位而不是历史阶段，我国仍处于社会主义初级阶段）。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p064_a003","kind":"政治素养","text":"党的基本理论、基本路线、基本方略，事关党的前途命运，事关中国特色社会主义事业兴衰成败。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":197},{"id":"suyi-xi-p059-n042-g01","revision":1,"path":["新思想","第一章 新时代坚持和发展中国特色社会主义","考点9：推动中国特色社会主义不断开拓前进"],"type":"group","title":"推动中国特色社会主义不断开拓前进","question":"推动中国特色社会主义不断开拓前进的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.社会主义是前无古人的伟大事业，没有现成的方案可以遵循，必须随着时代、实践和科学的发展不断探索前进\n\n2.社会主义是一个不断发展和完善的实践过程，需要一代又一代人的接续奋斗","notes":"","source":"苏一《27命题点高清图谱》印刷第59页；按原分支整理","source_pages":[59],"source_pdf_pages":[64],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p064_n043","p064_n044"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p064_a001","kind":"政治素养","text":"主要矛盾变化和“新时代”的提法：党的十九大提出“新时代”；党的十九大以来我国的社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p064_a002","kind":"易错点","text":"我国社会主义发展处于新的阶段（√，变的是历史方位而不是历史阶段，我国仍处于社会主义初级阶段）。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p064_a003","kind":"政治素养","text":"党的基本理论、基本路线、基本方略，事关党的前途命运，事关中国特色社会主义事业兴衰成败。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":198},{"id":"suyi-xi-p060-n003-g01","revision":1,"path":["新思想","第二章 中国式现代化","考点1：实现中华民族伟大复兴的中国梦"],"type":"group","title":"实现中华民族伟大复兴的中国梦","question":"实现中华民族伟大复兴的中国梦的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.实现中华民族伟大复兴，是近代以来中国人民的共同梦想，是中国共产党矢志不渝的奋斗目标\n\n2.一百年来，中国共产党团结带领中国人民进行的一切奋斗、一切牺牲、一切创造，归结起来就是一个主题：实现中华民族伟大复兴\n\n3.中国梦的本质：国家富强、民族振兴、人民幸福","notes":"","source":"苏一《27命题点高清图谱》印刷第60页；按原分支整理","source_pages":[60],"source_pdf_pages":[65],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p065_n004","p065_n005","p065_n006"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p065_a001","kind":"政治素养","text":"全面建成小康社会是实现中华民族伟大复兴中国梦的关键一步。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p065_a002","kind":"政治素养","text":"“建设创新型国家”“三步走”战略：1.到2020年进入创新型国家行列；2.到2035年跻身创新型国家前列；3.到2050年成为世界科技强国。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":199},{"id":"suyi-xi-p060-n007-g01","revision":1,"path":["新思想","第二章 中国式现代化","考点2：在中华大地上全面建成小康社会"],"type":"group","title":"在中华大地上全面建成小康社会","question":"在中华大地上全面建成小康社会的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"全面建成小康社会：（1）高质量完成了社会主义现代化建设“三步走”战略的第二步，使中华民族伟大复兴向前迈出新的一大步；（2）探索了人类解决贫困问题的新路径，为推动人类文明进步作出了重大贡献。","notes":"","source":"苏一《27命题点高清图谱》印刷第60页；按原分支整理","source_pages":[60],"source_pdf_pages":[65],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p065_n008","p065_n009","p065_n010"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p065_a001","kind":"政治素养","text":"全面建成小康社会是实现中华民族伟大复兴中国梦的关键一步。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p065_a002","kind":"政治素养","text":"“建设创新型国家”“三步走”战略：1.到2020年进入创新型国家行列；2.到2035年跻身创新型国家前列；3.到2050年成为世界科技强国。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":200},{"id":"suyi-xi-p060-n011-g01","revision":1,"path":["新思想","第二章 中国式现代化","考点3：全面建成社会主义现代化强国"],"type":"group","title":"全面建成社会主义现代化强国","question":"围绕全面建成社会主义现代化强国，具体内容、战略安排的意义分别是什么？","answer":"1.新时代新征程中国共产党的中心任务：团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴\n\n2.全面建成社会主义现代化强国的两步走战略安排：（1）党的十九大作出了从全面建成小康社会到基本实现社会主义现代化，再到全面建成社会主义现代化强国的战略安排；（2）“两步走”内容：第一步：从2020年到2035年基本实现社会主义现代化；第二步：从2035年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。\n\n3.具体内容：第一步，基本实现社会主义现代化（到2035年，我国发展的总体目标）：（1）经济实力、科技实力、综合国力大幅跃升，人均国内生产总值迈上新的大台阶，达到中等发达国家水平；（2）实现高水平科技自立自强，进入创新型国家前列；（3）建成现代化经济体系，形成新发展格局，基本实现新型工业化、信息化、城镇化、农业现代化；（4）基本实现国家治理体系和治理能力现代化，全过程人民民主制度更加健全，基本建成法治国家、法治政府、法治社会；（5）建成教育强国、科技强国、人才强国、文化强国、体育强国、健康中国，国家文化软实力显著增强；（6）人民生活更加幸福美好，居民人均可支配收入再上新台阶，中等收入群体比重明显提高，基本公共服务实现均等化，农村基本具备现代生活条件，社会保持长期稳定，人的全面发展、全体人民共同富裕取得更为明显的实质性进展；（7）广泛形成绿色生产生活方式，碳排放达峰后稳中有降，生态环境根本好转，美丽中国目标基本实现；（8）国家安全体系和能力全面加强，基本实现国防和军队现代化；第二步，在基本实现社会主义现代化的基础上，到本世纪中叶，把我国建设成为富强民主文明和谐美丽的社会主义现代化强国：（1）到那时，我国物质文明、政治文明、精神文明、社会文明、生态文明将全面提升；（2）实现国家治理体系和治理能力现代化，成为综合国力和国际影响力领先的国家；（3）全体人民共同富裕基本实现，我国人民将享有更加幸福安康的生活；（4）中华民族将以更加昂扬的姿态屹立于世界民族之林。\n\n4.战略安排的意义：（1）全面建成社会主义现代化强国的战略安排，把基本实现社会主义现代化的时间提前了15年；（2）提出了全面建设社会主义现代化国家、全面推进中华民族伟大复兴的更高目标；（3）明确了全面建成社会主义现代化强国的时间表，为当前和今后一个历史时期我国发展指明了方向、规划了蓝图；（4）这一战略安排丰富和拓展了全面建设社会主义现代化国家战略目标的内涵；（5）与中华民族从站起来、富起来到强起来的历史逻辑高度契合，对动员全党全国各族人民万众一心实现中华民族伟大复兴的中国梦具有重大意义。","notes":"","source":"苏一《27命题点高清图谱》印刷第60页；按原分支整理","source_pages":[60],"source_pdf_pages":[65],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p065_n012","p065_n013","p065_n014","p065_n015","p065_n016","p065_n017","p065_n018","p065_n019","p065_n020","p065_n021","p065_n022","p065_n023","p065_n024","p065_n025","p065_n026","p065_n027","p065_n028","p065_n029","p065_n030","p065_n031","p065_n032","p065_n033","p065_n034","p065_n035","p065_n036","p065_n037","p065_n038"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p065_a001","kind":"政治素养","text":"全面建成小康社会是实现中华民族伟大复兴中国梦的关键一步。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p065_a002","kind":"政治素养","text":"“建设创新型国家”“三步走”战略：1.到2020年进入创新型国家行列；2.到2035年跻身创新型国家前列；3.到2050年成为世界科技强国。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":201},{"id":"suyi-xi-p060-n040-g01","revision":1,"path":["新思想","第二章 中国式现代化","考点4：中国式现代化是中国共产党领导人民长期探索和实践的重大成果（怎么来）"],"type":"group","title":"中国式现代化是中国共产党领导人民长期探索和实践的重大成果（怎么来）","question":"中国式现代化是中国共产党领导人民长期探索和实践的重大成果（怎么来）的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.新民主主义革命时期，我们党团结带领人民进行革命斗争，取得新民主主义革命的胜利，为实现现代化创造了根本社会条件\n\n2.社会主义革命和建设时期，我们党带领人民完成了社会主义革命、推进了社会主义建设，为现代化建设奠定了根本政治前提和制度基础，提供了宝贵经验、理论准备、物质基础\n\n3.改革开放和社会主义现代化建设新时期，我们党作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策，开启了中国式现代化建设新时期，为中国式现代化提供了充满新的活力的体制保证和快速发展的物质条件\n\n4.进入新时代，我们党围绕解决现代化建设中存在的突出矛盾和问题，不断实现理论和实践上的创新突破，成功推进和拓展了中国式现代化，为中国式现代化提供了更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量","notes":"","source":"苏一《27命题点高清图谱》印刷第60页；按原分支整理","source_pages":[60],"source_pdf_pages":[65],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p065_n041","p065_n042","p065_n043","p065_n044"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p065_a001","kind":"政治素养","text":"全面建成小康社会是实现中华民族伟大复兴中国梦的关键一步。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p065_a002","kind":"政治素养","text":"“建设创新型国家”“三步走”战略：1.到2020年进入创新型国家行列；2.到2035年跻身创新型国家前列；3.到2050年成为世界科技强国。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":202},{"id":"suyi-xi-p061-n003-g01","revision":1,"path":["新思想","第二章 中国式现代化","考点5：中国式现代化的中国特色（是什么）"],"type":"group","title":"中国式现代化的中国特色（是什么）","question":"中国式现代化的中国特色（是什么）的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色\n\n2.中国式现代化的五个特征：（1）人口规模巨大——中国式现代化的显著特征；（2）全体人民共同富裕——中国式现代化的本质特征，中国式现代化区别于西方现代化的显著标志；（3）物质文明和精神文明相协调——中国式现代化的崇高追求（物质富足、精神富有是社会主义现代化的根本要求）；（4）人与自然和谐共生——中国式现代化的鲜明特点；（5）走和平发展道路——中国式现代化的突出特征。","notes":"","source":"苏一《27命题点高清图谱》印刷第61页；按原分支整理","source_pages":[61],"source_pdf_pages":[66],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p066_n004","p066_n005","p066_n006","p066_n007","p066_n008","p066_n009","p066_n010"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p066_a001","kind":"政治素养","text":"中国式现代化既基于自身国情，又借鉴各国经验，既传承历史文化，又融合现代文明，是具有中国特色、符合中国实际的现代化，是强国建设、民族复兴的唯一正确道路。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p066_a002","kind":"时政热点","text":"有关“中国式现代化”的重要提法：1.高水平社会主义市场经济体制是中国式现代化的重要保障；2.教育、科技、人才是中国式现代化的基础性、战略性支撑；3.城乡融合发展是中国式现代化的必然要求；4.开放是中国式现代化的鲜明标识；5.现代化产业体系是中国式现代化的物质技术基础；6.强大国内市场是中国式现代化的战略依托；7.绿色发展是中国式现代化的鲜明底色；8.国家安全是中国式现代化行稳致远的重要基础；9.国防和军队现代化是中国式现代化的重要组成部分；10.实现人民对美好生活的向往是中国式现代化的出发点和落脚点；11.坚持和加强党的全面领导是推进中国式现代化的根本保证。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p066_a003","kind":"政治素养","text":"“五个必由之路”：1.坚持党的全面领导是坚持和发展中国特色社会主义的必由之路；2.中国特色社会主义是实现中华民族伟大复兴的必由之路；3.团结奋斗是中国人民创造历史伟业的必由之路；4.贯彻新发展理念是新时代我国发展壮大的必由之路；5.全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":203},{"id":"suyi-xi-p061-n011-g01","revision":1,"path":["新思想","第二章 中国式现代化","考点6：中国式现代化的本质要求"],"type":"group","title":"中国式现代化的本质要求","question":"中国式现代化的本质要求的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.本质要求：坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态\n\n2.意义：（1）这一本质要求符合人类现代化的一般规律，阐明了中国式现代化的内在规定性；（2）明确了中国式现代化的领导力量、发展道路和根本方向，总体布局和战略要求，以及对人类文明和世界发展的重大意义；（3）是推进中国式现代化的重要遵循。\n\n3.中国式现代化是中国共产党领导的社会主义现代化：（1）这是对中国式现代化的定性，是管总、管根本的；（2）党的领导直接关系中国式现代化的根本方向、前途命运、最终成败：①党的领导决定中国式现代化的根本性质；②党的领导确保中国式现代化锚定奋斗目标行稳致远；③党的领导激发建设中国式现代化的强劲动力；④党的领导凝聚建设中国式现代化的磅礴力量。","notes":"","source":"苏一《27命题点高清图谱》印刷第61页；按原分支整理","source_pages":[61],"source_pdf_pages":[66],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p066_n012","p066_n013","p066_n014","p066_n015","p066_n016","p066_n017","p066_n018","p066_n019","p066_n020","p066_n021","p066_n022","p066_n023"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p066_a001","kind":"政治素养","text":"中国式现代化既基于自身国情，又借鉴各国经验，既传承历史文化，又融合现代文明，是具有中国特色、符合中国实际的现代化，是强国建设、民族复兴的唯一正确道路。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p066_a002","kind":"时政热点","text":"有关“中国式现代化”的重要提法：1.高水平社会主义市场经济体制是中国式现代化的重要保障；2.教育、科技、人才是中国式现代化的基础性、战略性支撑；3.城乡融合发展是中国式现代化的必然要求；4.开放是中国式现代化的鲜明标识；5.现代化产业体系是中国式现代化的物质技术基础；6.强大国内市场是中国式现代化的战略依托；7.绿色发展是中国式现代化的鲜明底色；8.国家安全是中国式现代化行稳致远的重要基础；9.国防和军队现代化是中国式现代化的重要组成部分；10.实现人民对美好生活的向往是中国式现代化的出发点和落脚点；11.坚持和加强党的全面领导是推进中国式现代化的根本保证。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p066_a003","kind":"政治素养","text":"“五个必由之路”：1.坚持党的全面领导是坚持和发展中国特色社会主义的必由之路；2.中国特色社会主义是实现中华民族伟大复兴的必由之路；3.团结奋斗是中国人民创造历史伟业的必由之路；4.贯彻新发展理念是新时代我国发展壮大的必由之路；5.全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":204},{"id":"suyi-xi-p061-n024-g01","revision":1,"path":["新思想","第二章 中国式现代化","考点7：中国式现代化创造了人类文明新形态"],"type":"group","title":"中国式现代化创造了人类文明新形态","question":"中国式现代化创造了人类文明新形态的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.中国式现代化深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向，是一种全新的人类文明形态\n\n2.全新的人类文明形态（新在哪）：（1）中国式现代化提供了一种全新的现代化模式，中国式现代化打破了“现代化=西方化”的迷思，展现了不同于西方现代化的新图景；（2）中国式现代化是对西方现代化理论和实践的重大超越：①中国式现代化作为科学社会主义的最新成果，坚持社会主义目标和方向；②摒弃了以资本为中心的、两极分化的、物质主义膨胀的、对外扩张掠夺的西方现代化老路；③打破了只有走资本主义道路才能实现现代化的神话，有效避免了西方现代化的矛盾弊端；④中国式现代化蕴含的独特世界观、价值观、历史观、文明观、民主观、生态观等及其伟大实践，是对世界现代化理论和实践的重大创新；（3）中国式现代化为广大发展中国家提供了全新选择。","notes":"","source":"苏一《27命题点高清图谱》印刷第61页；按原分支整理","source_pages":[61],"source_pdf_pages":[66],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p066_n025","p066_n026","p066_n027","p066_n028","p066_n029","p066_n030","p066_n031","p066_n032","p066_n033"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p066_a001","kind":"政治素养","text":"中国式现代化既基于自身国情，又借鉴各国经验，既传承历史文化，又融合现代文明，是具有中国特色、符合中国实际的现代化，是强国建设、民族复兴的唯一正确道路。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p066_a002","kind":"时政热点","text":"有关“中国式现代化”的重要提法：1.高水平社会主义市场经济体制是中国式现代化的重要保障；2.教育、科技、人才是中国式现代化的基础性、战略性支撑；3.城乡融合发展是中国式现代化的必然要求；4.开放是中国式现代化的鲜明标识；5.现代化产业体系是中国式现代化的物质技术基础；6.强大国内市场是中国式现代化的战略依托；7.绿色发展是中国式现代化的鲜明底色；8.国家安全是中国式现代化行稳致远的重要基础；9.国防和军队现代化是中国式现代化的重要组成部分；10.实现人民对美好生活的向往是中国式现代化的出发点和落脚点；11.坚持和加强党的全面领导是推进中国式现代化的根本保证。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p066_a003","kind":"政治素养","text":"“五个必由之路”：1.坚持党的全面领导是坚持和发展中国特色社会主义的必由之路；2.中国特色社会主义是实现中华民族伟大复兴的必由之路；3.团结奋斗是中国人民创造历史伟业的必由之路；4.贯彻新发展理念是新时代我国发展壮大的必由之路；5.全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":205},{"id":"suyi-xi-p061-n035-g01","revision":1,"path":["新思想","第二章 中国式现代化","考点8：推进中国式现代化需要牢牢把握的重大原则"],"type":"group","title":"推进中国式现代化需要牢牢把握的重大原则","question":"推进中国式现代化需要牢牢把握的重大原则的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.坚持和加强党的全面领导\n\n2.坚持中国特色社会主义道路\n\n3.坚持以人民为中心的发展思想\n\n4.坚持深化改革开放\n\n5.坚持发扬斗争精神","notes":"","source":"苏一《27命题点高清图谱》印刷第61页；按原分支整理","source_pages":[61],"source_pdf_pages":[66],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":
