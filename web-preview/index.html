[95],"source_pdf_pages":[100],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":382},{"id":"suyi-history-p095-k09-g01","revision":1,"path":["史纲","第一章 进入近代后中华民族的磨难与抗争","考点9 民族意识的觉醒"],"type":"group","title":"从“开眼看世界”到民族意识普遍觉醒","question":"林则徐、魏源、早期维新思想家、严复和孙中山各有什么代表主张？","answer":"① 林则徐是近代中国睁眼看世界的第一人，组织翻译《世界地理大全》，编成《四洲志》。\n② 魏源编《海国图志》，提出“师夷长技以制夷”，主张学习外国先进军事和科学技术以富国强兵、抵御侵略。\n③ 王韬、薛福成、马建忠、郑观应等早期维新思想家，主张既学习科学技术，也吸收政治、经济学说，具有反侵略、追求独立富强及一定反封建专制的思想。郑观应《盛世危言》倡发展民族工商业、同西方“商战”、设议院、实行君主立宪。\n④ 甲午战后民族意识普遍觉醒。严复《救亡决论》喊出“救亡”口号，译《天演论》，以“物竞天择、适者生存”警醒国人，为危机意识提供思想依据。\n⑤ 孙中山创建兴中会时提出“振兴中华”的时代强音。","notes":"","source":"苏一《27命题点高清图谱》印刷第95页（PDF第100页）；依原图整理","source_pages":[95],"source_pdf_pages":[100],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":383},{"id":"suyi-history-p096-k01-g01","revision":1,"path":["史纲","第二章 不同社会力量对国家出路的早期探索","考点1 太平天国农民战争"],"type":"group","title":"太平天国运动的兴起与两份纲领","question":"金田起义、定都天京、天京事变的时间和意义是什么？两份纲领各是什么性质？","answer":"① 清政府和外国侵略者的压迫剥削，迫使广大人民特别是农民走上反抗道路。洪秀全1843年创立拜上帝教，借以发动组织群众。\n② 1851年金田起义，建号太平天国；1853年攻占南京、改名天京，正式宣告太平天国农民政权建立。\n③ 北伐、西征和天京城外破围战，使起义达到军事上的全盛期。\n④ 1856年天京事变使太平天国由盛转衰；1864年天京陷落，起义失败。\n⑤ 《天朝田亩制度》是以解决土地问题为中心、最能体现太平天国社会理想与农民起义特点的纲领；《资政新篇》是具有资本主义色彩的社会发展方案。","notes":"","source":"苏一《27命题点高清图谱》印刷第96页（PDF第101页）；依原图整理","source_pages":[96],"source_pdf_pages":[101],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":384},{"id":"suyi-history-p096-k01-g02","revision":1,"path":["史纲","第二章 不同社会力量对国家出路的早期探索","考点1 太平天国农民战争"],"type":"group","title":"《天朝田亩制度》的内容及两面评价","question":"《天朝田亩制度》怎样分配土地？它的进步性和局限性是什么？","answer":"① 以“凡天下田，天下人同耕”为原则，按人口平均分配土地，是以解决土地问题为中心的较完整社会改革方案。\n② 进步性：否定封建地主土地所有制，反映农民平均分配土地的强烈愿望；发展、超越了历次农民战争的“均贫富”“等贵贱”和均平思想。\n③ 局限性：没有超出农民小生产者的狭隘眼界；描绘没有商品交换和绝对平均的社会，具有不切实际的空想性质；平均分地方案未能付诸实行。","notes":"","source":"苏一《27命题点高清图谱》印刷第96页（PDF第101页）；依原图整理","source_pages":[96],"source_pdf_pages":[101],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":385},{"id":"suyi-history-p096-k01-g03","revision":1,"path":["史纲","第二章 不同社会力量对国家出路的早期探索","考点1 太平天国农民战争"],"type":"group","title":"《资政新篇》的四方面主张","question":"《资政新篇》从哪四方面学习西方？它的意义及与《天朝田亩制度》的共同点是什么？","answer":"① 政治：禁朋党之弊，加强中央集权，学习西方法律制度。\n② 经济：主张发展近代工商业，奖励发明、允许专利，主张“准富者请人雇工”；学习从生产力领域扩展到生产关系领域，开始提倡资本主义雇佣劳动制。\n③ 文化：设新闻馆揭露弊政，破除陈规陋俗，提倡学校、医院、社会福利事业。\n④ 外交：主张与外国平等交往、自由通商，严禁鸦片输入。\n⑤ 洪仁玕提出的《资政新篇》，是近代中国第一个比较系统的发展资本主义的方案，但缺乏实施的历史条件，未能付诸实践。\n⑥ 两份纲领都具有反封建的进步性，都未能真正实施；经济理想和所代表的发展方向并不相同。","notes":"","source":"苏一《27命题点高清图谱》印刷第96页（PDF第101页）；依原图整理","source_pages":[96],"source_pdf_pages":[101],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":386},{"id":"suyi-history-p096-k02-g01","revision":1,"path":["史纲","第二章 不同社会力量对国家出路的早期探索","考点2 农民斗争的意义和局限"],"type":"group","title":"太平天国的历史意义、失败原因和教训","question":"太平天国有哪些历史意义？失败的根本原因是什么，说明了什么？","answer":"① 沉重打击封建统治阶级和外国侵略势力，是中国旧式农民战争的最高峰；在《天朝田亩制度》中表达土地愿望，又在《资政新篇》中出现不同于以往农民战争的新特点。\n② 冲击孔子和儒家经典的正统权威，削弱封建统治精神支柱；在19世纪中叶亚洲民族解放运动中时间最久、规模最大、影响最深。\n③ 客观失败原因是中外反动势力联合镇压；根本原因是农民阶级自身的局限性。\n④ 农民不是新的生产力和生产关系的代表，不能克服小生产者局限，缺少科学理论和先进阶级领导，不能提出完整正确的政治纲领与社会改革方案。\n⑤ 领导集团腐败、内讧和军事战略失误，借宗教组织群众又造成危害，不能正确对待儒学、不能理性认识侵略者。\n⑥ 教训：农民具有伟大革命潜力，但不能独自担负领导反帝反封建斗争取得胜利的重任；单纯农民战争不能完成民族独立和人民解放任务。","notes":"","source":"苏一《27命题点高清图谱》印刷第96页（PDF第101页）；依原图整理","source_pages":[96],"source_pdf_pages":[101],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":387},{"id":"suyi-history-p097-k03-g01","revision":1,"path":["史纲","第二章 不同社会力量对国家出路的早期探索","考点3 洋务事业的兴办"],"type":"group","title":"洋务运动的目的、指导思想和活动","question":"洋务派代表谁的利益？“中体西用”和“自强求富”具体体现在哪些活动？","answer":"① 洋务运动在第二次鸦片战争后，清政府镇压太平天国等起义的过程中兴起。奕䜣、曾国藩、李鸿章、左宗棠、张之洞等地主阶级洋务派，企图挽救清朝统治危机。\n② 首先为购买、制造洋枪炮以镇压农民起义，同时也想加强海防边防、发展本集团政治经济军事实力。\n③ 冯桂芬《校邠庐抗议》较完整阐述“中学为体，西学为用”：封建纲常与统治秩序为主体，西方近代工业技术为辅助，不能理解为改变封建政治制度。\n④ 口号：“自强”“求富”。先兴办军用工业，再兴办民用企业。军工均为官办；民用企业多数官督商办，基本属于资本主义性质。\n⑤ 军工包括江南制造总局、金陵机器局、天津机器局、湖北枪炮厂、福州船政局；江南制造总局是最大兵工厂，福州船政局是最大造船厂。\n⑥ 建立新式海陆军，北洋水师是主要海军力量；创办翻译、工艺、军事学堂，派遣留学生。","notes":"","source":"苏一《27命题点高清图谱》印刷第97页（PDF第102页）；依原图整理","source_pages":[97],"source_pdf_pages":[102],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":388},{"id":"suyi-history-p097-k04-g01","revision":1,"path":["史纲","第二章 不同社会力量对国家出路的早期探索","考点4 洋务运动的历史作用及其失败"],"type":"group","title":"洋务运动的作用与三项失败原因","question":"洋务运动为何既有客观进步作用又注定失败？失败的标志是什么？","answer":"① 客观上促进早期工业和民族资本主义发展；开办新式学堂、派出早期官派留学生，是近代教育开端；传播新知识、打开眼界。\n② 资本主义生产方式出现冲击“重本抑末”观念，社会风气与价值观变化，工商业者地位上升，有利于社会风气改变。\n③ 失败标志：甲午战争中北洋海军全军覆没，“自强”“求富”的目标落空。\n④ 封建性：指导思想仍为“中体西用”，以吸收近代生产技术维护封建制度；新生产力同封建生产关系、上层建筑不相容。\n⑤ 依赖性：对外妥协求和，企业依赖外国技术、设备与资源。\n⑥ 腐朽性：企业管理仍沿用封建衙门式方法，腐败严重。\n结论：维护封建统治的洋务运动，不能使中国走上独立富强道路。","notes":"","source":"苏一《27命题点高清图谱》印刷第97页（PDF第102页）；依原图整理","source_pages":[97],"source_pdf_pages":[102],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":389},{"id":"suyi-history-p097-k05-g01","revision":1,"path":["史纲","第二章 不同社会力量对国家出路的早期探索","考点5 戊戌维新运动的开展"],"type":"group","title":"维新运动的条件、活动与论战","question":"维新思潮为何兴起？维新派采用什么行动，和守旧派争论哪三个问题？","answer":"① 条件：民族资本主义初步发展；甲午失败造成严重民族危机并促成民族觉醒；知识分子学习西方由技术深入到政治制度、思想文化；救国变法共识与日本维新成效的影响。\n② 康有为、梁启超、谭嗣同、严复等，上书皇帝、著书立说、介绍外国变法经验、办学会、设学堂、办报纸；重点争取光绪和周围帝党官员支持，自上而下推动变法。\n③ 争论：要不要变法；要不要兴民权、设议院、实行君主立宪；要不要废八股、改科举、兴西学。\n④ 性质：资产阶级思想和封建主义思想在中国第一次正面交锋，开阔新型知识分子眼界、解放思想，传播资产阶级社会政治学说，形成变法维新的思想舆论准备。\n⑤ 这是改良与守旧的论战，不是后来“革命与改良”的论战。","notes":"","source":"苏一《27命题点高清图谱》印刷第97页（PDF第102页）；依原图整理","source_pages":[97],"source_pdf_pages":[102],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":390},{"id":"suyi-history-p098-k05-g01","revision":1,"path":["史纲","第二章 不同社会力量对国家出路的早期探索","考点5 戊戌维新运动的开展"],"type":"group","title":"百日维新的内容、性质与结果","question":"百日维新是什么性质？新政触及封建制度根本了吗？结果如何？","answer":"① 1898年光绪帝颁布“明定国是”诏书，宣布变法，开始百日维新。\n② 性质：资产阶级性质的改良运动，在一定程度上反映资产阶级政治经济诉求。\n③ 新政并未采纳维新派关于开国会、定宪法等主张，没有触及封建制度根本，是十分温和、不彻底的改良方案。\n④ 各项新政大多有利于资本主义发展，开办新式学堂、允许创办报刊等有启蒙作用。\n⑤ 变法仅持续103天。慈禧等发动戊戌政变，除京师大学堂等少数项目外，新政大多被废除。民族资产阶级第一次登上政治舞台的尝试失败。","notes":"","source":"苏一《27命题点高清图谱》印刷第98页（PDF第103页）；依原图整理","source_pages":[98],"source_pdf_pages":[103],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":391},{"id":"suyi-history-p098-k06-g01","revision":1,"path":["史纲","第二章 不同社会力量对国家出路的早期探索","考点6 维新运动的意义和教训"],"type":"group","title":"维新运动的三重意义与失败原因","question":"维新运动的三重性质是什么？它自身的哪些局限导致失败？","answer":"① 是爱国救亡运动：在民族危急时刻要求变法、发展资本主义、走独立富强之路，推动民族觉醒。\n② 是资产阶级性质的政治改良运动：突破洋务派“中体西用”局限，主张以君主立宪取代君主专制，在政治经济上冲击封建制度。\n③ 更是一场思想启蒙运动：传播资产阶级社会政治学说与自然科学，批判君权神授和封建纲常，促进民主思想传播，打破封建文化独占文化阵地的局面。\n④ 客观失败原因是强大守旧势力反对；主观原因是维新派自身局限。\n⑤ 不敢否定封建主义：寄望皇帝自上而下改良；未触及封建土地所有制；借孔子权威托古改制。\n⑥ 对帝国主义抱有幻想；惧怕并脱离人民群众，活动局限于官僚士大夫和知识分子小圈子。\n⑦ 教训：在半殖民地半封建中国，依靠统治者自上而下改良行不通，必须通过革命推翻帝国主义与封建主义联合统治。","notes":"","source":"苏一《27命题点高清图谱》印刷第98页（PDF第103页）；依原图整理","source_pages":[98],"source_pdf_pages":[103],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":392},{"id":"suyi-history-p098-k06d7ae-g01","revision":1,"path":["史纲","第二章 不同社会力量对国家出路的早期探索","辨析 洋务派、维新派与革命派"],"type":"group","title":"近代政治派别的阶级与道路区别","question":"洋务派、守旧派、维新派和革命派的阶级属性及政治主张怎样区分？","answer":"① 洋务派与守旧派都属于封建地主阶级。洋务派学西方科学技术以维护封建统治；守旧派连西方技术也反对学习。\n② 维新派属于资产阶级上层，主张温和改良，建立君主立宪制、发展资本主义。\n③ 革命派主要代表资产阶级中下层，主张暴力革命和民主共和。\n④ 洋务派与维新派都主张学习科学技术；分歧在于是否进一步学习西方政治制度和思想文化。不能把洋务派误记成主张发展资本主义的资产阶级派别。","notes":"","source":"苏一《27命题点高清图谱》印刷第98页（PDF第103页）；依原图整理","source_pages":[98],"source_pdf_pages":[103],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":393},{"id":"suyi-history-p099-k01-g01","revision":1,"path":["史纲","第三章 辛亥革命与君主专制制度的终结","考点1 辛亥革命爆发的历史条件"],"type":"group","title":"辛亥革命的历史条件与清末新政","question":"辛亥革命的社会条件、阶级基础和骨干力量是什么？清末新政为何破产？","answer":"① 民族危机加深、社会矛盾激化，使革命具有历史必然性；体现人民争取民族独立、振兴中华的愿望，以及救亡图存、前赴后继斗争的要求。\n② 《辛丑条约》签订后，清政府彻底放弃抵抗外国侵略，甘当“洋人的朝廷”，使人民更加失望。\n③ 清政府1901年宣布“新政”，包括改革官制、军事、学校及经济政策；1905年宣布次年起停止科举；1906年宣布预备仿行宪政；1908年颁布《钦定宪法大纲》。\n④ 新政、预备立宪的根本目的是延续反动统治，不仅没有挽救清王朝，反而激化矛盾，加重危机。\n⑤ 民族资本主义初步发展，是资产阶级革命派的阶级基础；骨干是一批资产阶级、小资产阶级知识分子。","notes":"","source":"苏一《27命题点高清图谱》印刷第99页（PDF第104页）；依原图整理","source_pages":[99],"source_pdf_pages":[104],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":394},{"id":"suyi-history-p099-k02-g01","revision":1,"path":["史纲","第三章 辛亥革命与君主专制制度的终结","考点2 资产阶级革命派的活动"],"type":"group","title":"孙中山转向革命与革命组织的建立","question":"兴中会、中国同盟会的时间、性质和纲领怎样区分？革命派怎样宣传革命？","answer":"① 孙中山原希望自上而下改良，上书李鸿章未获重视，在实践中认清清政府腐败，转向革命。\n② 1894年11月在檀香山成立兴中会，是近代中国第一个资产阶级革命团体，提出“驱除鞑虏，恢复中国，创立合众政府”。\n③ 1904年《中国问题的真解决》，主张推翻清朝、建立“中华民国”，表明走上革命道路时就举起民主革命旗帜，选择武装起义方式。\n④ 1903年章炳麟《驳康有为论革命书》、邹容《革命军》、陈天华《警世钟》《猛回头》，宣传民主革命。\n⑤ 1904年前后兴起华兴会、科学补习所、光复会、岳王会等革命团体。\n⑥ 1905年8月孙中山、黄兴等以兴中会、华兴会为基础，在东京成立中国同盟会，是近代第一个领导资产阶级革命的全国性政党，标志民主革命进入新阶段。\n⑦ 同盟会纲领：驱除鞑虏，恢复中华，创立民国，平均地权。","notes":"","source":"苏一《27命题点高清图谱》印刷第99页（PDF第104页）；依原图整理","source_pages":[99],"source_pdf_pages":[104],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":395},{"id":"suyi-history-p099-k03-g01","revision":1,"path":["史纲","第三章 辛亥革命与君主专制制度的终结","考点3 三民主义的提出"],"type":"group","title":"旧三民主义的内容、进步性与不足","question":"民族、民权、民生分别对应什么革命？每项主张有什么局限？","answer":"① 1905年11月孙中山把同盟会纲领概括为民族、民权、民生三大主义，是比较完整明确的资产阶级民主革命纲领，初步描绘前所未有的资产阶级共和国方案。\n② 民族主义对应民族革命：“驱除鞑虏，恢复中华”，要求推翻清朝政府、建立民族独立国家；但没有正面明确提出反帝主张，也未明确把汉族军阀、官僚、地主作为革命对象。\n③ 民权主义对应政治革命：“创立民国”，推翻君主专制、建立资产阶级民主共和国；但只是少数人的权利，广大人民真正民主权利难以保障。它是三民主义的核心。\n④ 民生主义对应社会革命：“平均地权”，核定地价，现有地价归原主，革命后增价归国家为国民共享；国家可按原定地价收买土地。\n⑤ 民生主义没有正面触及封建土地所有制，不能满足农民土地要求，没有成为发动广大工农的理论武器。\n⑥ 三民主义对革命发展产生重大积极影响，但尚不彻底。","notes":"","source":"苏一《27命题点高清图谱》印刷第99页（PDF第104页）；依原图整理","source_pages":[99],"source_pdf_pages":[104],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":396},{"id":"suyi-history-p100-k04-g01","revision":1,"path":["史纲","第三章 辛亥革命与君主专制制度的终结","考点4 关于革命与改良的辩论"],"type":"group","title":"革命派与改良派的三项论战","question":"论战的焦点是什么？它的意义及暴露出的弱点是什么？","answer":"① 要不要以革命手段推翻清王朝，是双方论战的焦点。\n② 要不要推翻帝制、实行共和。\n③ 要不要进行社会革命。\n④ 论战划清革命与改良界限，传播民主革命思想，促进革命形势发展。\n⑤ 同时暴露革命派理论弱点：对帝国主义干涉不敢正面回答，只希望“有秩序的革命”避免动乱和干涉；“国民”主要指资产阶级与知识分子；对改变地主土地所有制态度含糊，反对贫苦农民夺取土地。\n⑥ 这些弱点根源在民族资产阶级的软弱性、妥协性，影响革命进程和结果。","notes":"","source":"苏一《27命题点高清图谱》印刷第100页（PDF第105页）；依原图整理","source_pages":[100],"source_pdf_pages":[105],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":397},{"id":"suyi-history-p100-k05-g01","revision":1,"path":["史纲","第三章 辛亥革命与君主专制制度的终结","考点5 辛亥革命的爆发与清王朝覆灭"],"type":"group","title":"从武装起义到清帝退位","question":"萍浏醴、黄花岗、保路运动、武昌起义分别有什么作用？","answer":"① 同盟会既提出纲领，也发动多次起义。1906年萍浏醴起义是同盟会成立后发动的第一次武装起义；1911年广州黄花岗起义影响很大。\n② 1911年清政府借“铁路干线国有”出卖铁路利权，激起湖北、湖南、广东、四川保路运动。\n③ 共进会、文学社联合，在武昌准备起义。1911年10月武昌新军工程营革命党人打响起义第一枪，起义军占领武昌，成立湖北军政府。\n④ 武昌起义掀起辛亥革命高潮，打开清王朝统治缺口，各省纷纷响应。\n⑤ 1912年2月12日清帝被迫退位，延续两千多年的封建君主专制制度结束；不是整个封建社会制度、反帝反封建任务同时结束。","notes":"","source":"苏一《27命题点高清图谱》印刷第100页（PDF第105页）；依原图整理","source_pages":[100],"source_pdf_pages":[105],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":398},{"id":"suyi-history-p100-k06-g01","revision":1,"path":["史纲","第三章 辛亥革命与君主专制制度的终结","考点6 中华民国的建立"],"type":"group","title":"南京临时政府的性质和局限","question":"南京临时政府何时成立，为什么是资产阶级共和国性质的革命政权？局限在哪里？","answer":"① 1912年1月1日，孙中山在南京宣誓就职，国号中华民国，中华民国临时政府成立。\n② 资产阶级革命派在政权中占领导和主体地位；政策集中体现民族资产阶级愿望与利益，在一定程度上也符合广大人民利益，因此是资产阶级共和国性质的革命政权。\n③ 为换取列强承认，在《告友邦书》中承认清政府与列强订立的一切不平等条约和清政府外债。\n④ 没有提出满足农民土地要求的政策，以保护私有财产为由维护地主土地所有制及官僚地主财产。","notes":"","source":"苏一《27命题点高清图谱》印刷第100页（PDF第105页）；依原图整理","source_pages":[100],"source_pdf_pages":[105],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":399},{"id":"suyi-history-p100-k06-g02","revision":1,"path":["史纲","第三章 辛亥革命与君主专制制度的终结","考点6 中华民国的建立"],"type":"group","title":"《中华民国临时约法》的内容与意义","question":"《临时约法》怎样规定主权、权力分工和公民权利？其性质和意义是什么？","answer":"① 1912年3月颁布，是中国历史上第一部具有资产阶级共和国宪法性质的法典。\n② “中华民国之主权属于国民全体”，由参议院、临时大总统、国务员、法院行使统治权。\n③ 参议院行使立法权；临时大总统代表政府总揽政务；国务员辅佐总统并负责任；法院行使司法权，体现权力分工与责任内阁制。\n④ 人民一律平等，享有人身、财产、集会、结社、出版、言论、信仰等自由及请愿、陈诉、诉讼、考试、选举和被选举权。\n⑤ 以根本大法形式废除封建君主专制制度，确认资产阶级共和国政治制度，具有革命性、民主性。","notes":"","source":"苏一《27命题点高清图谱》印刷第100页（PDF第105页）；依原图整理","source_pages":[100],"source_pdf_pages":[105],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":400},{"id":"suyi-history-p100-k07-g01","revision":1,"path":["史纲","第三章 辛亥革命与君主专制制度的终结","考点7 辛亥革命的历史意义"],"type":"group","title":"辛亥革命的性质与五方面历史意义","question":"为什么说辛亥革命是比较完全意义上的资产阶级民主革命？它改变了什么？","answer":"① 性质：资产阶级领导，以反对封建君主专制、建立资产阶级共和国为目标，是比较完全意义上的资产阶级民主革命。\n② 推翻清朝统治，打击中外反动势力，使反动统治者在政治上乱了阵脚。\n③ 结束两千多年君主专制，建立第一个资产阶级共和政府，使民主共和观念深入人心。\n④ 推动思想解放，激发爱国热情和民族觉醒，打开思想进步闸门。\n⑤ 推动社会变革，使经济、思想习惯、社会风俗发生积极变化。\n⑥ 打击帝国主义侵略势力，推动亚洲民族解放运动高潮。","notes":"","source":"苏一《27命题点高清图谱》印刷第100页（PDF第105页）；依原图整理","source_pages":[100],"source_pdf_pages":[105],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":401},{"id":"suyi-history-p101-k08-g01","revision":1,"path":["史纲","第三章 辛亥革命与君主专制制度的终结","考点8 封建军阀专制统治的形成"],"type":"group","title":"袁世凯窃取果实与北洋军阀统治","question":"袁世凯怎样取得政权？北洋军阀统治在政治、经济、思想上表现如何？","answer":"① 袁世凯在帝国主义、国内反动势力及附从革命的旧官僚、立宪派支持下，窃取辛亥革命果实。\n② 北洋军阀政权代表大地主和买办资产阶级利益。\n③ 政治上实行军阀官僚专制统治。\n④ 经济上维护帝国主义、地主阶级和买办资产阶级利益。\n⑤ 文化思想上尊孔复古思潮猖獗，反对民主共和进步思想。","notes":"","source":"苏一《27命题点高清图谱》印刷第101页（PDF第106页）；依原图整理","source_pages":[101],"source_pdf_pages":[106],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":402},{"id":"suyi-history-p101-k09-g01","revision":1,"path":["史纲","第三章 辛亥革命与君主专制制度的终结","考点9 旧民主主义革命的失败"],"type":"group","title":"挽救共和的四次努力","question":"二次革命、中华革命党、护国、护法怎样衔接？失败说明什么？","answer":"① 1913年宋教仁被刺后，孙中山发动武装反袁的“二次革命”，很快失败。\n② 1914年组织中华革命党，坚持武装反袁，但脱离群众，参加者少，影响不大。\n③ 1915年护国运动，蔡锷等在云南组织护国军，反对袁世凯复辟帝制；1916年袁被迫取消帝制，之后段祺瑞把持北洋政府，继续独裁卖国。\n④ 1917年孙中山发起护法运动，却遭西南军阀排挤，最终失败，说明依靠南方军阀反对北洋军阀行不通。\n⑤ 1919年中华革命党改组为中国国民党。旧民主主义革命已陷入困境，民族资产阶级不能再领导革命前进。","notes":"","source":"苏一《27命题点高清图谱》印刷第101页（PDF第106页）；依原图整理","source_pages":[101],"source_pdf_pages":[106],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":403},{"id":"suyi-history-p101-k09-g02","revision":1,"path":["史纲","第三章 辛亥革命与君主专制制度的终结","考点9 旧民主主义革命的失败"],"type":"group","title":"辛亥革命失败的原因与未完成任务","question":"辛亥革命为什么失败？应如何同时记住其成就和局限？","answer":"① 根本原因：在帝国主义时代、半殖民地半封建中国，资本主义建国方案行不通。\n② 革命派没有提出彻底的反帝反封建革命纲领；不能充分发动和依靠人民群众；不能建立坚强革命政党作为团结革命力量的核心。这些缺点源于民族资产阶级的软弱、妥协。\n③ 没有改变半殖民地半封建社会性质和人民悲惨境遇，没有完成民族独立、人民解放任务，没有完成反帝反封建革命任务。\n④ 同时应记住五项重要成就：兴中会、同盟会、三民主义、南京临时政府、《临时约法》，分别是革命团体、全国性政党、革命纲领、革命政权、共和国宪法性法典。\n⑤ 失败表明资产阶级共和国方案不能救中国，先进中国人需要新的探索。","notes":"","source":"苏一《27命题点高清图谱》印刷第101页（PDF第106页）；依原图整理","source_pages":[101],"source_pdf_pages":[106],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":404},{"id":"suyi-history-p102-k01-g01","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点1 新文化运动与思想解放的潮流"],"type":"group","title":"新文化运动的兴起、口号与内容","question":"新文化运动的标志、阵地和代表人物是什么？民主、科学与文学革命分别指什么？","answer":"① 辛亥革命失败和北洋军阀统治使先进知识分子认识到，必须改造国民性、从思想文化上启蒙和解放人。\n② 1915年9月陈独秀在上海创办《青年杂志》（后改名《新青年》），标志新文化运动开始。1917年蔡元培出任北京大学校长，推动运动发展。\n③ 代表人物有李大钊、陈独秀、鲁迅、胡适；主要阵地是《新青年》与北京大学。\n④ 基本口号是民主与科学。民主既指资产阶级民主制度，也指资产阶级民主思想；科学狭义指自然科学，广义也指社会科学。\n⑤ 初期倡导进化论和个性解放思想，强烈批判以孔子为代表的旧“圣贤”；提倡新道德、反对旧道德，提倡新文学、反对旧文学，提倡白话文、反对文言文。\n⑥ 批判孔学，动摇封建正统思想统治地位，兴起思想解放潮流。","notes":"","source":"苏一《27命题点高清图谱》印刷第102页（PDF第107页）；依原图整理","source_pages":[102],"source_pdf_pages":[107],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":405},{"id":"suyi-history-p102-k01-g02","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点1 新文化运动与思想解放的潮流"],"type":"group","title":"五四以前新文化运动的意义和局限","question":"五四前新文化运动是什么性质？怎样评价其民主科学旗帜和思想局限？","answer":"① 是资产阶级民主主义的新文化反对封建主义旧文化的斗争，属于旧民主主义文化运动。\n② 在封建主义仍占支配地位时，高举民主科学旗帜，客观上具有振聋发聩的启蒙作用；社会思想解放冲击禁锢思想的闸门。\n③ 批判孔学是为发展资本主义扫清障碍，但资产阶级民主主义不能成为有效改造中国的思想武器。\n④ 把改造国民性置于优先地位，却脱离群众实践，仅少数人的呼唤，不能根本解决问题。\n⑤ 尚缺少马克思主义批判精神，采用的仍是资产阶级方法。不能把整个新文化运动和五四爱国运动混为同一事件。","notes":"","source":"苏一《27命题点高清图谱》印刷第102页（PDF第107页）；依原图整理","source_pages":[102],"source_pdf_pages":[107],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":406},{"id":"suyi-history-p102-k02-g01","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点2 十月革命与马克思主义在中国的初步传播"],"type":"group","title":"十月革命的影响与李大钊的传播活动","question":"十月革命为何对中国有特殊吸引力？李大钊哪些文章标志传播逐步系统化？","answer":"① 1917年俄国十月社会主义革命，推动中国先进分子从西方转向东方，从资产阶级民主主义转向社会主义。\n② 发生在国情相近的俄国，具有特殊吸引力；社会主义俄国反对帝国主义，以平等态度对待中国，推动社会主义思想传播；工农群众发动并取胜，启示先进分子以新的革命方法研究这一主义。\n③ 李大钊率先在中国举起马克思主义旗帜。1918年《法俄革命之比较观》《庶民的胜利》《Bolshevism的胜利》热情赞颂十月革命，指出它是20世纪世界革命的先声。\n④ 1919年《我的马克思主义观》比较系统介绍马克思主义，标志马克思主义在中国进入比较系统的传播阶段。","notes":"","source":"苏一《27命题点高清图谱》印刷第102页（PDF第107页）；依原图整理","source_pages":[102],"source_pdf_pages":[107],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":407},{"id":"suyi-history-p102-k03-g01","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点3 五四运动：新民主主义革命的开端"],"type":"group","title":"五四运动的爆发、阶段与结果","question":"五四运动的时代条件和导火线是什么？两个阶段的中心和主力如何变化？","answer":"① 新社会力量成长壮大，形成比以往革命更广泛的群众基础；新文化运动孕育初步共产主义思想的知识分子；十月革命产生重要影响。\n② 直接导火线：巴黎和会中国外交失败。\n③ 1919年5月4日至6月初，以学生为主，中心在北京；6月5日起，以工人为主，中心转向上海。工人阶级开始以独立政治力量登上历史舞台。\n④ 广大工人、学生、城市小资产阶级和民族资产阶级参加，是广泛的群众性爱国运动。\n⑤ 6月28日中国代表拒绝在巴黎和约签字，运动直接斗争目标得到实现。\n⑥ 工人阶级发挥决定性作用，不等于当时运动已由无产阶级政党统一领导。","notes":"","source":"苏一《27命题点高清图谱》印刷第102页（PDF第107页）；依原图整理","source_pages":[102],"source_pdf_pages":[107],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":408},{"id":"suyi-history-p102-k03-g02","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点3 五四运动：新民主主义革命的开端"],"type":"group","title":"五四运动的三重性质与历史意义","question":"五四运动为何是新民主主义革命开端？五四精神的内容与核心是什么？","answer":"① 是以先进青年知识分子为先锋、广大人民群众参加的彻底反帝反封建的伟大爱国革命运动。\n② 是中国人民拯救民族危亡、捍卫民族尊严、凝聚民族力量的伟大社会革命运动。\n③ 是传播新思想、新文化、新知识的伟大思想启蒙运动和新文化运动。\n④ 具有彻底反帝反封建的革命性、追求救国强国真理的进步性、各族各界群众积极参与的广泛性，是旧民主主义革命走向新民主主义革命的转折点。\n⑤ 五四精神：爱国、进步、民主、科学，核心是爱国主义。\n⑥ 激发追求真理、追求进步的伟大觉醒，实现自鸦片战争以来第一次全面觉醒；培育永久奋斗传统，青年成为推动社会变革的急先锋。\n⑦ 推动社会进步、马克思主义传播及其同工人运动结合，为党的成立作思想和干部准备。","notes":"","source":"苏一《27命题点高清图谱》印刷第102页（PDF第107页）；依原图整理","source_pages":[102],"source_pdf_pages":[107],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":409},{"id":"suyi-history-p103-k04-g01","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点4 中国早期马克思主义思想运动"],"type":"group","title":"早期马克思主义者的队伍与思想特点","question":"早期马克思主义者来自哪三类队伍？早期思想运动有什么特点？","answer":"① 队伍：新文化运动的精神领袖，如李大钊、陈独秀，是先驱者和旗帜；五四爱国运动左翼骨干，如毛泽东、周恩来，是主体；部分原同盟会会员和辛亥时期活动家，如董必武、林伯渠、吴玉章。\n② 重视马克思主义基本理论，明确同第二国际社会民主主义划界，一开始坚持革命原理和正确方向。\n③ 注重从中国实际出发学习、运用，已初步形成马克思主义同中国实际相结合的思想。\n④ 开始提出知识分子应同劳动群众相结合。\n⑤ 毛泽东领导湖南学生运动，但不是北京五四运动的领导者；早期阅读《共产党宣言》《阶级斗争》《社会主义史》等，确立马克思主义信仰。","notes":"","source":"苏一《27命题点高清图谱》印刷第103页（PDF第108页）；依原图整理","source_pages":[103],"source_pdf_pages":[108],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":410},{"id":"suyi-history-p103-k04-g02","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点4 中国早期马克思主义思想运动"],"type":"group","title":"五四以后新文化运动的转变","question":"五四以后民主、科学和反封建思想斗争获得了什么新含义？","answer":"① 马克思主义开始在思想文化领域发挥指导作用，但并未抛弃民主科学旗帜，而是继承并赋予新含义。\n② 民主不再是狭隘的资产阶级民主，而是多数人的民主、以劳动群众为主体的民主；科学在社会研究中主要指马克思主义科学世界观和社会革命理论。\n③ 马克思主义没有中断反封建思想启蒙，而是克服原有弱点，更有力推动它。\n④ 从反对封建思想入手，进一步认识到必须反对产生封建思想的社会制度；从争取个人解放扩展到广大人民社会解放；从少数人思想批判发展为群众革命实践。","notes":"","source":"苏一《27命题点高清图谱》印刷第103页（PDF第108页）；依原图整理","source_pages":[103],"source_pdf_pages":[108],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":411},{"id":"suyi-history-p103-k05-g01","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点5 马克思主义与中国工人运动的结合"],"type":"group","title":"党的早期组织及三方面活动","question":"北京、上海早期组织怎样建立？它们为建党开展了哪些活动？","answer":"① 1920年3月，李大钊在北京大学组织马克思学说研究会，是中国最早学习研究马克思主义的团体，为建党作重要准备。\n② 1920年8月，中国第一个共产党早期组织在上海建立，是党的发起组织和各地建党活动的联络中心。\n③ 研究宣传马克思主义、研究中国实际问题。1920年陈望道译《共产党宣言》中文全译本出版，是传播史的重要事件，在建党思想准备中发挥重要作用。\n④ 到工人中进行宣传和组织工作。\n⑤ 讨论建党问题，开展实际组织工作，推动马克思主义同工人运动相结合。","notes":"","source":"苏一《27命题点高清图谱》印刷第103页（PDF第108页）；依原图整理","source_pages":[103],"source_pdf_pages":[108],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":412},{"id":"suyi-history-p103-k06-g01","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点6 中国共产党的成立及其意义"],"type":"group","title":"中共一大的内容与建党必然性","question":"中共一大确定了哪些内容？党的成立为什么是历史必然？","answer":"① 1921年7月23日在上海开幕，后转到嘉兴南湖游船举行。确定党的名称为“中国共产党”。\n② 通过第一个纲领，提出以无产阶级革命推翻资产阶级政权、建立无产阶级专政、消灭资本家私有制等目标，明确社会主义和共产主义方向。\n③ 决定首先集中力量组织工人，设立中央临时领导机构中央局，陈独秀为书记。\n④ 党的成立是近代中国历史发展的必然产物，是中国人民救亡图存顽强求索的必然产物，是实现民族复兴的必然产物。\n⑤ 党从成立起坚持马克思主义指导，把为中国人民谋幸福、为中华民族谋复兴确立为初心使命。\n⑥ 红船精神：开天辟地、敢为人先的首创精神；坚定理想、百折不挠的奋斗精神；立党为公、忠诚为民的奉献精神。","notes":"","source":"苏一《27命题点高清图谱》印刷第103页（PDF第108页）；依原图整理","source_pages":[103],"source_pdf_pages":[108],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":413},{"id":"suyi-history-p103-k06-g02","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点6 中国共产党的成立及其意义"],"type":"group","title":"建党的历史特点、伟大建党精神和意义","question":"中国共产党成立具有哪两个历史特点？为什么是开天辟地的大事？","answer":"① 思想基础好：接受的是完整科学世界观和社会革命论的马克思主义。\n② 阶级基础好：诞生于半殖民地半封建中国工人运动基础之上，工人受帝国主义、本国资产阶级和封建势力三重压迫，具有坚强革命性。\n③ 为中国革命提供先进、坚强的领导核心，以实现共产主义为最高理想和最终目标，肩负民族独立人民解放、国家富强人民幸福两大任务。\n④ 伟大建党精神：坚持真理、坚守理想；践行初心、担当使命；不怕牺牲、英勇斗争；对党忠诚、不负人民。这是党的精神之源。\n⑤ 党的成立深刻改变近代中国发展的方向和进程，改变中国人民和中华民族的前途命运，改变世界发展的趋势和格局。","notes":"","source":"苏一《27命题点高清图谱》印刷第103页（PDF第108页）；依原图整理","source_pages":[103],"source_pdf_pages":[108],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":414},{"id":"suyi-history-p104-k07-g01","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点7 民主革命纲领的制定和工农运动的发动"],"type":"group","title":"中共二大的最高纲领与最低纲领","question":"中共二大第一次明确提出什么纲领？统一战线主张是什么？","answer":"① 1922年7月中共二大，第一次明确提出反帝反封建民主革命纲领，为人民指出清晰斗争目标。\n② 最高纲领：实现社会主义、共产主义。\n③ 最低纲领：打倒军阀，推翻国际帝国主义压迫，统一中国为真正民主共和国。\n④ 主张联合全国一切革命党派、资产阶级民主派，组成民主主义联合战线。\n⑤ 开始采用资产阶级、小资产阶级政党没有采用也不可能采用的革命方法——群众路线的方法。","notes":"","source":"苏一《27命题点高清图谱》印刷第104页（PDF第109页）；依原图整理","source_pages":[104],"source_pdf_pages":[109],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":415},{"id":"suyi-history-p104-k07-g02","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点7 民主革命纲领的制定和工农运动的发动"],"type":"group","title":"早期工人、农民、青年运动","question":"第一次工运高潮的起止与安源罢工有什么区别？早期农运和青年团有哪些节点？","answer":"① 第一次工人运动高潮：1922年1月香港海员罢工起，至1923年2月京汉铁路工人罢工止。\n② 1922年9月安源路矿工人大罢工，是党第一次独立领导并取得完全胜利的工人斗争。\n③ 1921年9月浙江萧山县衙前村成立中国第一个农民协会，开展反抗地主压迫的斗争。\n④ 1922年5月中国社会主义青年团第一次全国代表大会在广州举行，青年团宣告成立；妇女运动也得到推动。\n⑤ 京汉铁路工人罢工遭镇压，表明仅靠工人力量不足，必须联合广泛革命力量。","notes":"","source":"苏一《27命题点高清图谱》印刷第104页（PDF第109页）；依原图整理","source_pages":[104],"source_pdf_pages":[109],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":416},{"id":"suyi-history-p104-k08-g01","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点8 国共合作和大革命的进行"],"type":"group","title":"第一次国共合作的形成与新三民主义","question":"中共三大与国民党一大分别作了什么决定？合作的政治基础是什么？","answer":"① 工人斗争受挫，使党认识到敌人强大、革命力量不足；孙中山从依靠军阀的失败中受到启发，愿与共产党合作；共产国际也推动合作。\n② 1923年6月中共三大，决定共产党员以个人身份加入国民党，实行党内合作；在政治、思想、组织上保持党的独立性。\n③ 1924年1月国民党一大在广州召开，重新解释三民主义，确认共产党员个人加入原则，事实上确认联俄、联共、扶助农工三大政策，标志第一次国共合作正式形成。\n④ 新民族主义突出反帝；新民权主义强调一般平民所共有；新民生主义包括平均地权、节制资本，后来提出“耕者有其田”。\n⑤ 新三民主义政纲同共产党民主革命阶段纲领基本一致，是合作的政治基础；三大政策不是三民主义三个概念的别名。","notes":"","source":"苏一《27命题点高清图谱》印刷第104页（PDF第109页）；依原图整理","source_pages":[104],"source_pdf_pages":[109],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":417},{"id":"suyi-history-p104-k08-g02","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点8 国共合作和大革命的进行"],"type":"group","title":"大革命的兴起、特点与共产党的作用","question":"五卅运动、北伐的意义是什么？大革命与以往革命相比有何特点？","answer":"① 1925年五卅惨案引发五卅运动，掀起全国大革命高潮；同年6月省港大罢工开始，是工运史上持续时间很长的大罢工；7月国民政府在广州建立。\n② 1926年7月北伐战争开始，目标是推翻北洋军阀统治。孙中山已于1925年3月去世，不能说北伐由他亲自领导。\n③ 大革命群众动员更广泛，规模更宏伟，社会内涵更深刻：以反帝反军阀为对象，以国共合作为基础的统一战线为组织形式，广泛发动工农。\n④ 共产党提出反帝反军阀政治口号，是合作倡导者和统一战线组织者，是群众主要发动者、组织者；帮助推动国民革命军建立，在军队开展政治工作，党员在战斗中发挥先锋、骨干作用。\n⑤ 党起着独特且不可替代的作用，但没有取得整个革命的领导权。","notes":"","source":"苏一《27命题点高清图谱》印刷第104页（PDF第109页）；依原图整理","source_pages":[104],"source_pdf_pages":[109],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":418},{"id":"suyi-history-p105-k09-g01","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点9 大革命的失败及其教训"],"type":"group","title":"大革命失败的标志、原因与历史意义","question":"“四一二”“七一五”意味着什么？怎样区分北伐胜利与大革命失败？","answer":"① 1927年4月12日蒋介石在上海发动反革命政变；7月15日汪精卫在武汉“分共”，国共合作全面破裂，大革命失败。\n② 失败主要指反帝反封建任务未完成：虽基本推翻北洋军阀统治，国民党政权仍代表地主、买办资产阶级，半殖民地半封建社会性质未变。\n③ 客观原因：反革命力量强大，资产阶级严重动摇，蒋汪叛变，帝国主义干涉。\n④ 主观原因：陈独秀右倾机会主义错误在领导机关占统治地位；幼年党还不善于把马克思主义同中国革命具体实际相结合。共产国际也有不切实际的指导。\n⑤ 意义：打击帝国主义在华势力、基本推翻北洋军阀；党领导反帝反封建群众斗争，探索马克思主义中国化，初步提出新民主主义革命基本思想，开始认识土地革命与武装斗争的重要性；群众觉悟组织程度提高，党掌握部分革命武装，为土地革命作准备。","notes":"","source":"苏一《27命题点高清图谱》印刷第105页（PDF第110页）；依原图整理","source_pages":[105],"source_pdf_pages":[110],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":419},{"id":"suyi-history-p105-k09-g02","revision":1,"path":["史纲","第四章 中国共产党成立和中国革命新局面","考点9 大革命的失败及其教训"],"type":"group","title":"大革命失败的五方面教训","question":"统一战线、武装斗争、土地问题、党的建设应吸取哪些教训？","answer":"① 必须把马克思主义基本原理同中国革命具体实际紧密结合。\n② 既要建立革命统一战线，也要始终保持独立性，实行又团结又斗争的方针，争取无产阶级领导权。\n③ 坚持武装斗争，建立党直接控制和指挥的军队。\n④ 解决农民土地问题，充分发动农民参加革命、扩大革命力量。\n⑤ 加强自身建设，加强民主集中制，既发展组织、扩大党员数量，更巩固组织、提高党员质量。","notes":"","source":"苏一《27命题点高清图谱》印刷第105页（PDF第110页）；依原图整理","source_pages":[105],"source_pdf_pages":[110],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":420},{"id":"suyi-history-p105-k01-g01","revision":1,"path":["史纲","第五章 中国革命的新道路","考点1 国民党在全国统治的建立及其性质"],"type":"group","title":"南京国民政府的建立与统治性质","question":"东北易帜有什么意义？国民党政权同北洋军阀在阶级性质上有何关系？","answer":"① 1928年12月29日张学良宣布东北易帜，遵守三民主义、服从国民政府、改易旗帜；北洋军阀不再作为独立政治力量存在，国民党在全国范围建立统治。\n② 国民党蜕变为代表地主阶级、买办性大资产阶级利益，并受帝国主义支持的反动政党。\n③ 南京国民政府同北洋军阀在阶级性质上没有本质区别，实行代表大地主、大资产阶级利益的一党专政和军事独裁统治。","notes":"","source":"苏一《27命题点高清图谱》印刷第105页（PDF第110页）；依原图整理","source_pages":[105],"source_pdf_pages":[110],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":421},{"id":"suyi-history-p105-k02-g01","revision":1,"path":["史纲","第五章 中国革命的新道路","考点2 土地革命战争的兴起"],"type":"group","title":"南昌起义、八七会议、秋收起义与三湾改编","question":"大革命失败后怎样寻找新出路？几个起义、会议和改编各自贡献是什么？","answer":"① 大革命失败后白色恐怖笼罩，党转入低潮。1927年7月中央决定集中掌握的武装准备起义，组织湘鄂赣粤秋收起义，召开中央紧急会议确定新方针。\n② 8月1日南昌起义，打响武装反抗国民党反动派第一枪，是党独立领导革命战争、创建人民军队、武装夺取政权的开端。\n③ 8月7日八七会议，清算大革命后期陈独秀右倾错误，提出整顿队伍、纠正错误、寻找新道路，确定土地革命和武装反抗国民党反动派总方针，选举瞿秋白为首的中央临时政治局；毛泽东提出“枪杆子里面出政权”的思想。\n④ 9月湘赣边界秋收起义，公开打出工农革命军旗帜；进攻长沙受挫后，转向敌人统治薄弱的农村。\n⑤ 三湾改编从组织上确立党对军队的领导，是建设无产阶级领导的新型人民军队的重要开端。\n⑥ 10月开始创建井冈山农村革命根据地，从进攻大城市转向农村进军，成为中国革命具有决定意义的新起点。\n⑦ 12月广州起义再次失败，进一步说明照搬城市武装起义经验不可行。","notes":"","source":"苏一《27命题点高清图谱》印刷第105页（PDF第110页）；依原图整理","source_pages":[105],"source_pdf_pages":[110],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":422},{"id":"suyi-history-p106-k03-g01","revision":1,"path":["史纲","第五章 中国革命的新道路","考点3 农村包围城市、武装夺取政权道路的开辟"],"type":"group","title":"中国革命新道路的实践与理论探索","question":"井冈山根据地和毛泽东1928—1930年的四篇著作怎样共同开辟新道路？","answer":"① 1927—1928年井冈山根据地建立，点燃工农武装割据的星星之火，为中国革命开辟农村包围城市、武装夺取政权的正确道路，集中体现中国革命的正确方向。\n② 1928年《中国的红色政权为什么能够存在？》《井冈山的斗争》，提出以农业为主要经济的中国革命要以军事发展暴动为特征，论证红色政权能够长期存在发展的主客观条件，提出工农武装割据思想。\n③ 1930年《星星之火，可以燎原》，说明红军、游击队、红色区域的建立发展是无产阶级领导的农民斗争的最高形式，是半殖民地农民斗争发展的必然结果，是促进全国革命高潮的重要因素，回答“红旗到底打得多久”。\n④ 1930年《反对本本主义》，提出“没有调查，没有发言权”，强调中国革命胜利要靠中国同志了解中国情况，体现开拓新路、创新理论的首创精神。\n⑤ 新道路理论指明革命胜利的唯一正确道路，标志中国化马克思主义即毛泽东思想初步形成。","notes":"","source":"苏一《27命题点高清图谱》印刷第106页（PDF第111页）；依原图整理","source_pages":[106],"source_pdf_pages":[111],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":423},{"id":"suyi-history-p106-k03-g02","revision":1,"path":["史纲","第五章 中国革命的新道路","考点3 农村包围城市、武装夺取政权道路的开辟"],"type":"group","title":"古田会议：思想建党、政治建军","question":"古田会议的主要内容是什么？解决了怎样的重大建党建军问题？","answer":"① 1929年12月古田会议，最重要的是通过纠正党内错误思想的决议，确立思想建党、政治建军原则。\n② 强调思想建设极端重要，指明各种非无产阶级思想的表现、来源及纠正方法。\n③ 红军是执行革命政治任务的武装集团，必须绝对服从共产党领导，全心全意为党的纲领、路线和政策奋斗。\n④ 红军除打仗外，还必须负担宣传、组织和武装群众等工作，加强政治工作。\n⑤ 会议是党和红军建设的纲领性文献与人民军队建设重要里程碑，创造性解决在农村环境和农民、小资产阶级为主要成分条件下，保持党的无产阶级先锋队性质、建设党绝对领导的新型军队的问题。","notes":"","source":"苏一《27命题点高清图谱》印刷第106页（PDF第111页）；依原图整理","source_pages":[106],"source_pdf_pages":[111],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":424},{"id":"suyi-history-p106-k03-g03","revision":1,"path":["史纲","第五章 中国革命的新道路","考点3 农村包围城市、武装夺取政权道路的开辟"],"type":"group","title":"反“围剿”与土地革命的政策演进","question":"两部土地法的进步和局限是什么？1931年的阶级路线、分配方法怎样表述？","answer":"① 毛泽东、朱德指挥红一方面军取得前三次反“围剿”胜利，1933年3月取得第四次反“围剿”胜利。\n② 土地革命通过改变地主土地私有制，实现农民土地所有，使农民政治翻身、农村生产力解放。\n③ 1928年《井冈山土地法》，党历史上第一部土地法，以立法形式首次肯定农民用革命手段取得土地的权利；但没收一切土地、土地归苏维埃政府所有、禁止买卖等，不合农村实际。\n④ 1929年《兴国土地法》，把“没收一切土地”改为没收公共土地和地主阶级土地，是原则性改正，保护中农利益；仍未解决土地归农民所有的问题。\n⑤ 1931年阶级路线：坚定依靠贫农、雇农，联合中农，限制富农，保护中小工商业者，消灭地主阶级。\n⑥ 土地分配：以乡为单位，按人口平均分配，在原耕地基础上抽多补少、抽肥补瘦。\n⑦ 大革命失败后革命能坚持发展，根本在于党紧紧依靠农民、领导土地革命。","notes":"","source":"苏一《27命题点高清图谱》印刷第106页（PDF第111页）；依原图整理","source_pages":[106],"source_pdf_pages":[111],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":425},{"id":"suyi-history-p106-k04-g01","revision":1,"path":["史纲","第五章 中国革命的新道路","考点4 土地革命战争的发展及其挫折"],"type":"group","title":"中华苏维埃共和国临时中央政府","question":"中华苏维埃共和国何时成立、采用什么制度？有什么历史意义？","answer":"① 1931年11月，中华苏维埃第一次全国代表大会在江西瑞金召开，通过宪法大纲、土地法令和劳动法等，成立临时中央政府，毛泽东任主席。\n② 实行工农兵代表大会制度，是中国历史上第一个全国性的工农民主政权。\n③ 是党在局部地区执政的重要尝试，扩大党和红色政权影响；加强对分散根据地的中枢指挥，推进政权、经济、文化建设与党的建设，打开土地革命新局面。","notes":"","source":"苏一《27命题点高清图谱》印刷第106页（PDF第111页）；依原图整理","source_pages":[106],"source_pdf_pages":[111],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":426},{"id":"suyi-history-p107-k04-g01","revision":1,"path":["史纲","第五章 中国革命的新道路","考点4 土地革命战争的发展及其挫折"],"type":"group","title":"三次“左”倾错误与第五次反“围剿”失败","question":"“左”倾错误的主要危害与原因是什么？最大的恶果是什么？","answer":"① 大革命失败到遵义会议前，“左”倾错误先后三次在中央领导机关取得统治地位，尤其王明为代表的“左”倾教条主义危害最大。\n② 造成红军和根据地严重损失；最大恶果是第五次反“围剿”失败，被迫退出南方根据地进行战略转移——长征。\n③ 原因：八七会议后“左”倾情绪未得到认真清理；共产国际错误指导；更主要的是党理论准备不足、实践经验不足，不善于把马克思主义同中国实际全面、正确结合。","notes":"","source":"苏一《27命题点高清图谱》印刷第107页（PDF第112页）；依原图整理","source_pages":[107],"source_pdf_pages":[112],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":427},{"id":"suyi-history-p107-k05-g01","revision":1,"path":["史纲","第五章 中国革命的新道路","考点5 遵义会议实现伟大历史转折"],"type":"group","title":"遵义会议的内容与历史意义","question":"遵义会议集中解决哪些问题？为什么是生死攸关的转折点？","answer":"① 1935年1月召开。长征初期军事失利及退却中的逃跑主义，引发对“左”倾错误领导的怀疑和不满。\n② 集中解决具有决定意义的军事问题和组织问题，批评博古、李德在第五次反“围剿”中的错误；增选毛泽东为中央政治局常委，随后形成毛泽东、周恩来、王稼祥军事指挥三人小组。\n③ 确立毛泽东在党中央和红军的领导地位，开始形成以毛泽东为核心的第一代中央领导集体；开始确立马克思主义正确路线在中央的领导地位，结束“左”倾教条主义错误统治。\n④ 在最危急关头挽救党、红军和中国革命，是党的历史上生死攸关的转折点。\n⑤ 鲜明特点：坚持真理、修正错误，确立正确领导，创造性制定符合革命特点的战略策略。\n⑥ 会议决策是在党同共产国际联系中断时独立自主作出，开启党独立自主解决中国革命实际问题的新阶段。","notes":"","source":"苏一《27命题点高清图谱》印刷第107页（PDF第112页）；依原图整理","source_pages":[107],"source_pdf_pages":[112],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":428},{"id":"suyi-history-p107-k06-g01","revision":1,"path":["史纲","第五章 中国革命的新道路","考点6 红军长征胜利和迎接全民族抗战"],"type":"group","title":"长征胜利的意义与长征精神","question":"长征何时结束？它如何改变革命局面，铸就什么精神？","answer":"① 1936年10月红军第一、第二、第四方面军胜利会师，三大主力长征结束。\n② 促进党在政治思想上成熟，是中国革命转危为安的关键；粉碎敌人消灭党和红军的图谋，实现北上抗日战略转移。\n③ 实现党和革命事业从挫折走向胜利的伟大转折，开启为民族独立、人民解放奋斗的新进程。\n④ 长征精神：把人民和民族根本利益看得高于一切，坚定理想信念、坚信正义事业必胜；不怕艰难险阻、不惜牺牲；独立自主、实事求是、一切从实际出发；顾全大局、严守纪律、紧密团结；依靠群众、与人民生死相依、患难与共、艰苦奋斗。","notes":"","source":"苏一《27命题点高清图谱》印刷第107页（PDF第112页）；依原图整理","source_pages":[107],"source_pdf_pages":[112],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":429},{"id":"suyi-history-p107-k06-g02","revision":1,"path":["史纲","第五章 中国革命的新道路","考点6 红军长征胜利和迎接全民族抗战"],"type":"group","title":"迎接抗战的三组理论总结","question":"《论反对日本帝国主义的策略》《中国革命战争的战略问题》《实践论》《矛盾论》分别解决什么问题？","answer":"① 1935年12月《论反对日本帝国主义的策略》，阐明抗日民族统一战线新政策，系统说明政治路线问题，与瓦窑堡会议相联系。\n② 1936年12月《中国革命战争的战略问题》，总结土地革命中党内军事问题的争论，系统说明中国革命战争战略问题。\n③ 1937年《实践论》《矛盾论》，从马克思主义认识论高度总结党的经验，揭露批评主观主义尤其教条主义，论证基本原理同具体实际相结合，阐明党的思想路线。\n④ 对应辨析：遵义会议侧重军事和组织；瓦窑堡会议侧重政治路线；延安整风侧重思想路线。","notes":"","source":"苏一《27命题点高清图谱》印刷第107页（PDF第112页）；依原图整理","source_pages":[107],"source_pdf_pages":[112],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":430},{"id":"suyi-history-p108-k01-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点1 日本发动企图灭亡中国的侵略战争"],"type":"group","title":"抗日战争的阶段与起点","question":"局部抗战、全面抗战及三个战略阶段的关键时间是什么？","answer":"① 1931年9月18日九一八事变，是中国人民抗日战争起点，也揭开世界反法西斯战争序幕；1932年东北全境沦陷，1935年华北事变加剧民族危机。\n② 1937年7月7日卢沟桥事变，日本全面侵华战争开始，中国进入全民族抗战。\n③ 战略防御阶段：1937年7月至1938年10月。\n④ 战略相持阶段：1938年10月广州、武汉失守后至1945年8月，是历时最长的阶段。\n⑤ 战略反攻阶段：1945年8月；8月15日日本宣布无条件投降。","notes":"","source":"苏一《27命题点高清图谱》印刷第108页（PDF第113页）；依原图整理","source_pages":[108],"source_pdf_pages":[113],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":431},{"id":"suyi-history-p108-k02-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点2 中国共产党举起武装抗日的旗帜"],"type":"group","title":"中国共产党率先抗日与抗日救亡运动","question":"九一八事变后党和人民怎样开展抗日？救亡运动有什么扩展？","answer":"① 东北人民在九一八事变后奋起抵抗，成为中国抗战起点。\n② 1931年9月20日党中央发表宣言，提出“反对日本帝国主义强占东三省”。\n③ 1932年4月15日中华苏维埃共和国临时中央政府发表对日战争宣言。\n④ 抗日救亡运动在全国兴起，部分国民党爱国官兵自发抗战，共产党开始同他们合作抗日。","notes":"","source":"苏一《27命题点高清图谱》印刷第108页（PDF第113页）；依原图整理","source_pages":[108],"source_pdf_pages":[113],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":432},{"id":"suyi-history-p108-k04-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点4 抗日民族统一战线的建立与全民族抗战的开始"],"type":"group","title":"从一二九运动到西安事变和平解决","question":"建立抗日民族统一战线经历哪些关键转变？西安事变和平解决有什么意义？","answer":"① 1935年12月9日北平学生开展一二九运动，提出反对华北自治、打倒日本帝国主义、停止内战一致抗日，促进民族觉醒，标志抗日救亡运动新高潮。\n② 1935年八一宣言呼吁停止内战、一致抗日；12月瓦窑堡会议提出建立广泛抗日民族统一战线，批评“左”倾关门主义，决定用“人民共和国”替代“工农共和国”的表述。\n③ 1936年5月《停战议和一致抗日通电》，放弃反蒋口号；9月提出“逼蒋抗日”方针。\n④ 1936年12月12日张学良、杨虎城发动西安事变，要求停止内战、一致抗日。\n⑤ 和平解决成为时局转换枢纽，十年内战局面基本结束，国内和平初步实现。","notes":"","source":"苏一《27命题点高清图谱》印刷第108页（PDF第113页）；依原图整理","source_pages":[108],"source_pdf_pages":[113],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":433},{"id":"suyi-history-p108-k04-g02","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点4 抗日民族统一战线的建立与全民族抗战的开始"],"type":"group","title":"第二次国共合作及其特点","question":"第二次国共合作正式形成的标志是什么？与第一次合作有什么不同？","answer":"① 1937年2月党中央向国民党五届三中全会提出停止内战等要求，表示在其作为国策条件下作出包括停止武力推翻国民党政权在内的保证；合作进一步酝酿。\n② 卢沟桥事变开启中国全民族抗战，开辟世界反法西斯战争的东方主战场。\n③ 1937年9月22日国民党中央通讯社发表《中共中央为公布国共合作宣言》；23日蒋介石发表实际承认共产党合法地位的谈话，以第二次国共合作为基础的抗日民族统一战线正式形成。\n④ 合作是党外合作，双方都有政权和军队，没有正式固定组织形式和统一纲领；第一次是共产党员个人加入国民党的党内合作。","notes":"","source":"苏一《27命题点高清图谱》印刷第108页（PDF第113页）；依原图整理","source_pages":[108],"source_pdf_pages":[113],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":434},{"id":"suyi-history-p108-k05-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点5 战略防御阶段的正面战场"],"type":"group","title":"战略防御阶段正面战场的贡献与失利","question":"防御阶段正面战场承担什么任务？为何大部分会战失利？","answer":"① 1937年7月至1938年10月，以国民党军队为主体的正面战场承担抗击日军战略进攻的主要任务，淞沪、忻口、徐州、武汉等会战抵抗日本侵略。\n② 抗战初期国民党正面战场较积极，具有重要作用；台儿庄战役取得大捷。\n③ 客观失利原因是日军力量占优；主观原因是片面抗战路线，不敢充分发动武装人民，只依靠政府和正规军。\n④ 战略战术上单纯阵地防御、消极防御，造成一系列战役失败。","notes":"","source":"苏一《27命题点高清图谱》印刷第108页（PDF第113页）；依原图整理","source_pages":[108],"source_pdf_pages":[113],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":435},{"id":"suyi-history-p109-k06-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点6 战略相持阶段的正面战场"],"type":"group","title":"相持阶段的日本政策和国民党政策","question":"相持阶段日本对国民党的策略怎样改变？国民党内外政策有什么变化？","answer":"① 1938年10月广州、武汉失守，抗战进入战略相持阶段。\n② 日本对国民党采取以政治诱降为主、军事打击为辅的方针。\n③ 1939年1月国民党五届五中全会确定“防共、限共、溶共”方针，开始由片面抗战逐步转向消极抗战、积极反共。\n④ 对外仍把抗战目标解释为恢复卢沟桥事变前状态，反映其抗战的局限。","notes":"","source":"苏一《27命题点高清图谱》印刷第109页（PDF第114页）；依原图整理","source_pages":[109],"source_pdf_pages":[114],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":436},{"id":"suyi-history-p109-k07-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点7 全面抗战路线和持久战的战略总方针"],"type":"group","title":"洛川会议与全面抗战路线","question":"全面抗战路线的关键是什么？党的工作重点和独立自主原则怎样落实？","answer":"① 与国民党片面抗战不同，共产党实行全面抗战路线即人民战争路线，首要是发动、组织广大农民。\n② 1937年8月洛川会议制定抗日救国十大纲领，强调打倒日本帝国主义关键在于使既已发动的抗战成为全面的全民族抗战。\n③ 要全国军事动员、全民总动员，改革政治机构，给予充分民主权利，改善工农生活。\n④ 工作重点放在敌后农村，在民族解放战争新条件下继续农村包围城市、武装夺取政权道路。\n⑤ 坚持统一战线中无产阶级领导权，在敌后独立自主开展游击战争，在国民党统治区开展抗日群众运动。","notes":"","source":"苏一《27命题点高清图谱》印刷第109页（PDF第114页）；依原图整理","source_pages":[109],"source_pdf_pages":[114],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":437},{"id":"suyi-history-p109-k07-g02","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点7 全面抗战路线和持久战的战略总方针"],"type":"group","title":"《论持久战》的论证与三个阶段","question":"抗战为什么既不能速胜又不会亡国？胜利之本和三个阶段是什么？","answer":"① 1938年《论持久战》批驳“亡国论”“速胜论”，说明抗战是持久战、最后胜利属于中国。\n② 日本强、中国弱，决定只能持久；日本小、中国大，日本退步野蛮、国际失道寡助，中国进步正义、国际得道多助，决定胜利前途属于中国。\n③ “兵民是胜利之本”，必须实行人民战争。\n④ 科学预见战略防御、战略相持、战略反攻三个阶段，相持是最关键阶段。\n⑤ 揭示抗战发展规律和争取胜利的战略方针，是党领导抗战的纲领性文献，对全国抗战部署产生积极影响。","notes":"","source":"苏一《27命题点高清图谱》印刷第109页（PDF第114页）；依原图整理","source_pages":[109],"source_pdf_pages":[114],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":438},{"id":"suyi-history-p109-k08-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点8 敌后战场的开辟与游击战争的发展"],"type":"group","title":"敌后战场与游击战争的战略地位","question":"平型关、忻口、百团大战分别有什么地位？正面与敌后战场作用怎样随阶段变化？","answer":"① 党作出开辟敌后战场的战略决策，独立自主开展游击战争；抗战全过程中两个战场相互配合。\n② 1937年9月平型关大捷，是全民族抗战以来中国军队主动寻歼日军的第一次重大胜利，打破日军不可战胜神话。\n③ 1937年10—11月忻口战役，是华北战场规模最大、最激烈战役之一，是国共两党军队合作抗日、配合较好的一次战役。\n④ 游击战被提高到战略地位，有全局性意义。防御阶段正面正规战是主要的，敌后游击战是辅助的，但在阻止日军速胜、减轻正面压力、争取相持等方面有关键作用。\n⑤ 相持阶段，敌后游击战成为主要抗日作战方式；百团大战集中八路军力量大规模进攻日军。\n⑥ 游击战也为人民军队进行战略反攻准备条件。","notes":"","source":"苏一《27命题点高清图谱》印刷第109页（PDF第114页）；依原图整理","source_pages":[109],"source_pdf_pages":[114],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":439},{"id":"suyi-history-p109-k09-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点9 坚持抗战、团结、进步的方针"],"type":"group","title":"统一战线中的独立自主与策略总方针","question":"为什么既团结又斗争？怎样区分进步、中间、顽固势力？","answer":"① 统一战线以国共合作为基础，但双方阶级利益和路线不同，内部不可避免存在矛盾斗争，必须坚持独立自主。\n② 保持思想、政治、组织独立；放手发动群众；坚持党对人民军队绝对领导，壮大武装和根据地；实行又团结又斗争、以斗争求团结。\n③ 1939年7月提出：坚持抗战反对中途妥协；巩固国内团结反对内部分裂；力求全国进步反对向后倒退。\n④ 发展进步势力：工人、农民、城市小资产阶级，是统一战线基础和抗战主要依靠力量。\n⑤ 争取中间势力：民族资产阶级、开明绅士、地方实力派。\n⑥ 孤立顽固势力：大地主、大资产阶级抗日派，以蒋介石集团为代表。与其斗争坚持有理、有利、有节，维护团结抗战大局。","notes":"","source":"苏一《27命题点高清图谱》印刷第109页（PDF第114页）；依原图整理","source_pages":[109],"source_pdf_pages":[114],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":440},{"id":"suyi-history-p110-k10-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点10 抗日民主根据地的建设"],"type":"group","title":"“三三制”政权与民族政策","question":"抗日根据地的政权是什么性质？“三三制”怎样分配，为什么这样安排？","answer":"① 加强政权建设是抗日根据地建设首要、根本任务。根据地政权是共产党领导的抗日民族统一战线性质的政权。\n② “三三制”：共产党员、党外进步人士、中间派各占三分之一。分别主要代表工人农民、小资产阶级、民族资产阶级和开明绅士。\n③ 这样可以容纳各方面代表，团结一切赞成抗日又赞成民主的阶级阶层。\n④ 抗日民主政权普遍实行民主集中制，实行民族平等团结、共同抗日的政策，在少数民族聚居地区试行民族区域自治。\n⑤ 根据地是贯彻全面抗战路线、争取抗战胜利的坚强阵地。","notes":"","source":"苏一《27命题点高清图谱》印刷第110页（PDF第115页）；依原图整理","source_pages":[110],"source_pdf_pages":[115],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":441},{"id":"suyi-history-p110-k10-g02","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点10 抗日民主根据地的建设"],"type":"group","title":"减租减息、大生产和文化建设","question":"减租减息与土地革命有什么不同？大生产运动的方针、口号是什么？","answer":"① 停止没收地主土地，普遍减租减息，减轻农民所受封建剥削、提高抗日与生产积极性；同时实行交租交息，以利联合地主阶级抗日，巩固统一战线。\n② 为克服根据地严重困难，提出“发展经济，保障供给”的经济和财政工作总方针。\n③ 发出“自己动手，丰衣足食”的号召，领导军民开展大生产运动。\n④ 创办抗日军政大学、鲁迅艺术学院、马列学院等干部学校和专门学校；1940年创办延安自然科学院，推动文化建设和干部教育。","notes":"","source":"苏一《27命题点高清图谱》印刷第110页（PDF第115页）；依原图整理","source_pages":[110],"source_pdf_pages":[115],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":442},{"id":"suyi-history-p110-k11-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点11 大后方的抗日民主运动和进步文化工作"],"type":"group","title":"大后方抗日民主运动与文化统一战线","question":"1939年与1944年的民主诉求是什么？文化界抗敌协会具有什么标志意义？","answer":"① 1939年10月，国民参政会中共产党代表发起宪政座谈，批评国民党一党专政。\n② 1944年9月，党提出结束国民党一党统治、建立抗日民主联合政府，得到各界热烈响应。\n③ 全民族抗战开始后，在党推动和影响下，文化界各抗敌协会相继成立，标志文化界广泛抗日民族统一战线建立。","notes":"","source":"苏一《27命题点高清图谱》印刷第110页（PDF第115页）；依原图整理","source_pages":[110],"source_pdf_pages":[115],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":443},{"id":"suyi-history-p110-k12-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点12 中国共产党的自身建设"],"type":"group","title":"六届六中全会与马克思主义中国化","question":"六届六中全会纠正什么错误、提出什么命题及学习任务？","answer":"① 王明回国后主张“一切经过统一战线”“一切服从抗日”，产生右倾错误。共产国际后明确党中央政治路线正确，支持以毛泽东为首解决统一领导问题。\n② 1938年9—11月六届六中全会，毛泽东明确提出“马克思主义的中国化”。\n③ 基本纠正王明右倾错误，进一步巩固毛泽东在全党领导地位，统一思想步调、推动工作发展。\n④ 为推进马克思主义中国化，要普遍深入学习马克思主义理论，学习历史遗产并作批判总结，调查研究当前运动的特点与规律性。","notes":"","source":"苏一《27命题点高清图谱》印刷第110页（PDF第115页）；依原图整理","source_pages":[110],"source_pdf_pages":[115],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":444},{"id":"suyi-history-p110-k12-g02","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点12 中国共产党的自身建设"],"type":"group","title":"新民主主义理论的系统阐明","question":"1939—1940年三篇著作怎样系统阐明新民主主义理论？有什么意义？","answer":"① 《〈共产党人〉发刊词》《中国革命和中国共产党》《新民主主义论》，概括中国半殖民地半封建社会的性质、特征和主要矛盾，说明革命发生发展的原因。\n② 中国革命包括民主主义革命和社会主义革命两个阶段。五四以后民主革命是无产阶级领导的人民大众反帝反封建的新民主主义革命，前途是社会主义。\n③ 阐明新民主主义阶段的政治、经济、文化纲领。\n④ 提出统一战线、武装斗争、党的建设是战胜敌人的三大法宝。\n⑤ 新民主主义理论是马克思主义中国化的重大成果，其提出和系统阐明标志毛泽东思想多方面展开而趋于成熟。","notes":"","source":"苏一《27命题点高清图谱》印刷第110页（PDF第115页）；依原图整理","source_pages":[110],"source_pdf_pages":[115],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":445},{"id":"suyi-history-p111-k12-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点12 中国共产党的自身建设"],"type":"group","title":"延安整风的内容、重点和方法","question":"整风的“三反三整”是什么？主观主义的实质、两种形式和克服方法是什么？","answer":"① 遵义会议后路线回到正确轨道，但主观主义、教条主义尚未从思想上彻底清理。1941年《改造我们的学习》开始高级干部整风；1942年《整顿党的作风》《反对党八股》推动全党整风。\n② 反对主观主义以整顿学风，是最主要任务；反对宗派主义以整顿党风；反对党八股以整顿文风。\n③ 主观主义实质是理论脱离实际、颠倒认识和实践关系，表现为教条主义与经验主义，重点反对教条主义。\n④ 以科学态度对待马克思主义，发扬理论联系实际学风，一切从实际出发、实事求是。\n⑤ 学风问题也是思想方法、对待马克思主义态度、全党工作态度的问题。\n⑥ 1942年延安文艺座谈会提出“为什么人的问题”是根本、原则问题，强调文艺为人民服务。","notes":"","source":"苏一《27命题点高清图谱》印刷第111页（PDF第116页）；依原图整理","source_pages":[111],"source_pdf_pages":[116],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":446},{"id":"suyi-history-p111-k12-g02","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点12 中国共产党的自身建设"],"type":"group","title":"第一个历史决议与整风意义","question":"六届七中全会通过了什么决议？整风使哪条思想路线确立？","answer":"① 1944年5月至1945年4月六届七中全会，通过《关于若干历史问题的决议》，总结党史及基本经验，对重大历史问题作出结论。\n② 使全党特别是高级干部对革命基本问题认识一致，增强团结，为七大胜利召开创造条件，是延安整风的重大成果并标志其胜利结束。\n③ 整风既是深刻的马克思主义思想教育运动，也是一场思想解放运动，使实事求是思想路线在全党范围确立。","notes":"","source":"苏一《27命题点高清图谱》印刷第111页（PDF第116页）；依原图整理","source_pages":[111],"source_pdf_pages":[116],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":447},{"id":"suyi-history-p111-k12-g03","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点12 中国共产党的自身建设"],"type":"group","title":"中共七大、三大作风与延安精神","question":"七大最重要的历史贡献是什么？三大作风与延安精神各是什么？","answer":"① 1945年4—6月中共七大在延安召开。毛泽东作《论联合政府》政治报告和《愚公移山》闭幕词。\n② 政治路线：放手发动群众、壮大人民力量，在党领导下打败日本侵略者、解放全国人民、建立新民主主义中国；制定政治经济文化纲领。\n③ 三大作风：理论联系实际；密切联系群众；批评与自我批评。\n④ 正式命名毛泽东思想，规定为党的一切工作指针，写入党章，这是七大的历史贡献。\n⑤ 七大标志党在政治、思想、组织上成熟，确立毛泽东在中央和全党的领导核心地位，毛泽东思想的指导地位，是团结、胜利的大会。\n⑥ 延安精神：坚定正确政治方向（精髓）；解放思想、实事求是的思想路线；全心全意为人民服务的根本宗旨；自力更生、艰苦奋斗的创业精神。","notes":"","source":"苏一《27命题点高清图谱》印刷第111页（PDF第116页）；依原图整理","source_pages":[111],"source_pdf_pages":[116],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":448},{"id":"suyi-history-p112-k13-g01","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点13 抗日战争的胜利及其意义"],"type":"group","title":"抗战胜利与台湾光复的节点","question":"《波茨坦公告》、日本投降、纪念日和台湾光复的时间如何对应？","answer":"① 1945年7月26日中、美、英发表《波茨坦公告》，敦促日本投降；8月9日苏联红军进入中国东北对日作战，抗战进入全面反攻。\n② 8月15日日本宣布无条件投降，9月2日签署投降书，9月3日为中国人民抗日战争胜利纪念日。\n③ 10月25日中国政府在台湾举行受降仪式，被日本占领50年的台湾及澎湖列岛重归中国主权管辖，成为抗战取得完全胜利的重要标志。\n④ 《开罗宣言》《波茨坦公告》等国际文件，明确日本窃取的中国领土应归还中国。","notes":"","source":"苏一《27命题点高清图谱》印刷第112页（PDF第117页）；依原图整理","source_pages":[112],"source_pdf_pages":[117],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":449},{"id":"suyi-history-p112-k13-g02","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点13 抗日战争的胜利及其意义"],"type":"group","title":"东方主战场与抗战胜利原因","question":"中国抗战的世界地位是什么？胜利的决定因素、关键和重要法宝分别是什么？","answer":"① 中国抗战是世界反法西斯战争重要组成部分，中国战场是东方主战场；开战最早、持续最久，是日本侵略最大受害国，也是五大战胜国之一。\n② 中国抵抗牵制日本兵力，阻碍其北进南进，减轻盟国压力；坚持抗战打击日军主力，为盟国反攻创造条件；为盟军提供战略物资和军事情报。\n③ 决定因素：以爱国主义为核心的民族精神。\n④ 关键：中国共产党的中流砥柱作用——率先抗日、倡导统一战线、坚持全面抗战和持久战、开辟敌后战场与抗日根据地。\n⑤ 重要法宝：全民族抗战。\n⑥ 国际上所有爱好和平正义的国家、人民、国际组织及反法西斯力量的同情支持，同样不可分割。","notes":"","source":"苏一《27命题点高清图谱》印刷第112页（PDF第117页）；依原图整理","source_pages":[112],"source_pdf_pages":[117],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":450},{"id":"suyi-history-p112-k13-g03","revision":1,"path":["史纲","第六章 中华民族的抗日战争","考点13 抗日战争的胜利及其意义"],"type":"group","title":"抗战胜利的历史意义","question":"抗战胜利怎样改变民族命运、国际地位和新民主主义革命前景？","answer":"① 是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放斗争。\n② 粉碎日本殖民奴役中国图谋，捍卫主权领土完整，洗刷近代反侵略屡败的民族耻辱。\n③ 促进民族大团结，形成伟大抗战精神，展现天下兴亡、匹夫有责的爱国情怀。\n④ 对世界反法西斯战争胜利、维护世界和平作出巨大贡献，提升中国国际地位。\n⑤ 坚定中国人民追求民族独立、自由、解放的意志。\n⑥ 成为中华民族从深重危机走向伟大复兴的历史转折点，开启凤凰涅槃、浴火重生新进程，为党团结人民取得新民主主义革命胜利奠定重要基础。","notes":"","source":"苏一《27命题点高清图谱》印刷第112页（PDF第117页）；依原图整理","source_pages":[112],"source_pdf_pages":[117],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":451},{"id":"suyi-history-p113-k01-g01","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点1 中国共产党争取和平民主的斗争"],"type":"group","title":"抗战后的两种方针与重庆谈判","question":"蒋介石为什么邀请谈判？共产党参加谈判的目的与方针是什么？","answer":"① 战后国际国内形势总体有利于和平民主建国；人民长期战争后有和平建国强烈要求。\n② 国民党目标仍是独裁、半殖民地半封建道路，既定方针是武力消灭共产党和人民军队、解放区；邀请谈判是争取内战部署时间、掩盖准备，诱使交出军队政权，谈判失败再嫁祸共产党。\n③ 美国支持国民党以求建立亲美政府，首要目标是阻止共产党控制中国。\n④ 共产党希望通过和平途径进行政治社会改革和经济建设，提出对国民党“蒋反我亦反，蒋停我亦停”，并提出“和平、民主、团结”口号。\n⑤ 毛泽东赴重庆的目的是争取和平民主。1945年10月10日签《双十协定》，确认和平建国基本方针，同意长期合作、坚决避免内战。","notes":"","source":"苏一《27命题点高清图谱》印刷第113页（PDF第118页）；依原图整理","source_pages":[113],"source_pdf_pages":[118],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":452},{"id":"suyi-history-p113-k01-g02","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点1 中国共产党争取和平民主的斗争"],"type":"group","title":"政治协商会议及维护协议","question":"1946年政协的五项协议是什么？为什么有进步意义而不具新民主主义性质？","answer":"① 1946年1月政协达成政府组织、国民大会、和平建国纲领、军事问题、宪法草案五项协议。\n② 协议还不是新民主主义性质，但有利于打破蒋介石独裁、实行民主政治，有利于和平建国，因而有利于人民。\n③ 当时共产党并非居于领导地位；会议也不是1949年的新政协。\n④ 党准备严格履行协议，同时提高警惕、防止阵地和武装被夺，把练兵、减租、生产作为解放区当前中心工作。\n⑤ 国民党统治集团没有真正履行协议的诚意，“国共谈判破裂了，但我党赢得人心归去”。","notes":"","source":"苏一《27命题点高清图谱》印刷第113页（PDF第118页）；依原图整理","source_pages":[113],"source_pdf_pages":[118],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":453},{"id":"suyi-history-p113-k02-g01","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点2 国民党发动全面内战和解放区军民的坚决反击"],"type":"group","title":"全面内战与以自卫战争粉碎进攻","question":"全面内战何时爆发？为什么必须且能够打败蒋介石？军事原则是什么？","answer":"① 1946年6月26日国民党军进攻中原解放区，全面内战爆发。国民党在兵力装备等方面暂占优势，且获美国援助；解放区处于分割包围状态。\n② 必须打败蒋介石：其战争反对民族独立和人民解放，是反革命战争。\n③ 能够打败：军事实力优势和援助是暂时因素；战争反人民、失人心才是经常作用的因素；解放战争是爱国、正义、革命的战争，必获人民拥护。\n④ 政治上同人民群众密切合作，争取一切可以争取的人，在党领导下建立广泛人民民主统一战线。\n⑤ 军事上集中优势兵力、各个歼灭敌人。","notes":"","source":"苏一《27命题点高清图谱》印刷第113页（PDF第118页）；依原图整理","source_pages":[113],"source_pdf_pages":[118],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":454},{"id":"suyi-history-p113-k03-g01","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点3 解放战争的胜利发展"],"type":"group","title":"战略进攻与“打倒蒋介石，解放全中国”","question":"人民解放军何时转入战略进攻？当时是否已具有数量优势？","answer":"① 一年作战后战争形势变化，党中央决定不等完全粉碎敌人进攻，立即转入全国性反攻，以主力打到外线、引向国民党区域。\n② 1947年7月刘邓大军等三路大军挺进中原，形成品字形态势，揭开战略进攻序幕；此时解放军数量还不占优势。\n③ 1947年10月10日提出“打倒蒋介石，解放全中国”口号；12月中央会议制定夺取全国胜利行动纲领。\n④ 中国革命到达新的历史转折点：蒋介石20年反革命统治、帝国主义百余年在华统治由发展走向消灭；到年底战争主要在国统区进行，国民党由战略进攻转为全面防守。","notes":"","source":"苏一《27命题点高清图谱》印刷第113页（PDF第118页）；依原图整理","source_pages":[113],"source_pdf_pages":[118],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":455},{"id":"suyi-history-p114-k04-g01","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点4 解放区的土地改革运动与农民的广泛发动"],"type":"group","title":"五四指示与《中国土地法大纲》","question":"两份土地文件分别何时出台、实现什么政策转变？土地改革有什么作用？","answer":"① 1946年5月4日《关于土地问题的指示》（五四指示），把抗战时期减租减息改为实行“耕者有其田”，开始从削弱封建剥削向变革封建土地关系、废除封建剥削制度过渡。\n② 1947年全国土地会议制定《中国土地法大纲》，明确废除封建性、半封建性剥削的土地制度，实行耕者有其田，是彻底反封建的土地革命纲领。\n③ 土地制度改革是党领导农民从根本上摧毁封建制度根基的社会大变革，使农民更清楚认识自己的解放同党和人民政权联系在一起。\n④ 为打败蒋介石、建立新中国奠定深厚群众基础，提升农民政治觉悟和组织程度，给解放战争提供源源不断人力物力支持。\n⑤ 革命阶段改变的是地主土地所有制，实行农民土地所有；不是此时就消灭全部土地私有制。","notes":"","source":"苏一《27命题点高清图谱》印刷第114页（PDF第119页）；依原图整理","source_pages":[114],"source_pdf_pages":[119],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":456},{"id":"suyi-history-p114-k05-g01","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点5 第二条战线的形成和发展"],"type":"group","title":"第二条战线的形成原因与表现","question":"第二条战线指什么？为什么在国统区形成，学生与工人怎样参加？","answer":"① 在国民党统治区，以学生运动为先导的人民民主运动不断发展，成为配合解放战争的第二条战线。\n② 国民党维护独裁与官僚污吏统治，抗战后腐败和大发国难财严重；违背和平建国要求，发动反人民内战；横征暴敛与恶性通胀，使政治经济陷入危机、民心尽失。\n③ 1946年12月北平学生提出抗议美军暴行、要求美军退出中国等口号，学生运动高涨。\n④ 1947年全国多个大城市工人罢工，广泛人民民主运动发展。\n⑤ 第一条战线是人民解放军与国民党军队的军事斗争；第二条战线是国统区的政治群众斗争。","notes":"","source":"苏一《27命题点高清图谱》印刷第114页（PDF第119页）；依原图整理","source_pages":[114],"source_pdf_pages":[119],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":457},{"id":"suyi-history-p114-k06-g01","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点6 各民主党派的历史发展"],"type":"group","title":"民主党派的社会基础与政治态度","question":"民主党派主要何时成立、代表哪些力量？其与共产党合作的基础是什么？","answer":"① 少数成立于大革命、土地革命时期，多数成立于抗战和解放战争时期。\n② 主要社会基础是民族资产阶级、城市小资产阶级及同这些阶级相联系的知识分子和其他爱国民主人士，不是单一阶级政党，而是阶级联盟性质。\n③ 政纲虽有差异，都主张爱国、反对卖国，主张民主、反对独裁；与共产党新民主主义革命纲领基本一致。\n④ 共产党对各民主党派采取积极争取和团结政策，推动合作。","notes":"","source":"苏一《27命题点高清图谱》印刷第114页（PDF第119页）；依原图整理","source_pages":[114],"source_pdf_pages":[119],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":458},{"id":"suyi-history-p114-k08-g01","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点8 中国共产党领导的多党合作和政治协商格局的形成"],"type":"group","title":"第三条道路破产与新型政党关系形成","question":"第三条道路主张什么？五一口号与1949年有关声明分别有什么意义？","answer":"① 第三条道路在政治上追求英美式民主，反对地主官僚专政；经济上主张改良资本主义，不容官僚资本横行，也反对社会主义。实质是资产阶级共和国方案、旧民主主义道路。\n② 1947年国民党宣布民盟为非法团体，标志中间路线幻想破灭。\n③ 1948年4月30日“五一口号”，号召各民主党派、人民团体、社会贤达召开政治协商会议、讨论召集人民代表大会、成立民主联合政府，揭开协商建国序幕，奠定党领导的多党合作和政治协商制度基础。\n④ 1949年1月民主党派和无党派代表发表《对时局的意见》，公开自愿接受共产党领导，决心走人民革命道路、建立人民民主新中国。\n⑤ 毛泽东提出民主党派“积极参政，共同建设新中国”，其政治地位发生根本变化，不再是旧反动政权下的在野党。","notes":"","source":"苏一《27命题点高清图谱》印刷第114页（PDF第119页）；依原图整理","source_pages":[114],"source_pdf_pages":[119],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":459},{"id":"suyi-history-p115-k09-g01","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点9 南京国民党政权的覆灭"],"type":"group","title":"三大战役与国民党统治的覆灭","question":"三大战役使军事力量对比发生什么变化？","answer":"① 1948年秋开始，解放战争进入夺取全国胜利的战略决战阶段，先后进行辽沈、淮海、平津三大战役。\n② 三大战役基本消灭国民党赖以维持反动统治的主要军事力量，是人民战争和毛泽东军事思想的胜利。\n③ 人民解放军向全国进军，国民党统治集团败退，残余势力退出大陆、退往台湾。","notes":"","source":"苏一《27命题点高清图谱》印刷第115页（PDF第120页）；依原图整理","source_pages":[115],"source_pdf_pages":[120],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":460},{"id":"suyi-history-p115-k10-g01","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点10 为新中国绘制蓝图"],"type":"group","title":"七届二中全会的方针、转移与“两个务必”","question":"七届二中全会为全国胜利作了哪些部署？“两个务必”是什么？","answer":"① 1949年3月在河北平山西柏坡召开，提出迅速夺取全国胜利方针。\n② 工作重心由乡村转移到城市，规定全国胜利后的政治、经济、外交基本政策。\n③ 指明由农业国转变为工业国、由新民主主义社会转变为社会主义社会的发展方向。\n④ “两个务必”：务必继续保持谦虚、谨慎、不骄、不躁的作风；务必继续保持艰苦奋斗的作风。\n⑤ 因为党将由革命党走向全国执政，对自身作风提出新要求。1949年进京“赶考”包含保持清醒、经受执政考验的意义。","notes":"","source":"苏一《27命题点高清图谱》印刷第115页（PDF第120页）；依原图整理","source_pages":[115],"source_pdf_pages":[120],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":461},{"id":"suyi-history-p115-k10-g02","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点10 为新中国绘制蓝图"],"type":"group","title":"《论人民民主专政》与建国理论准备","question":"人民民主专政的领导、基础和主要联盟是什么？民族资产阶级处于何种地位？","answer":"① 1949年6月30日发表《论人民民主专政》，向全国人民阐明党在建立新中国问题上的主张。\n② 人民民主专政需要工人阶级领导。\n③ 基础是工人、农民和城市小资产阶级联盟，主要是工农联盟。\n④ 民族资产阶级不能充当革命领导者，也不应在国家政权中占主要地位。\n⑤ 奠定新中国国家政权的理论基础，作好政治理论准备；与七届二中全会决议共同构成《共同纲领》的基础。","notes":"","source":"苏一《27命题点高清图谱》印刷第115页（PDF第120页）；依原图整理","source_pages":[115],"source_pdf_pages":[120],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":462},{"id":"suyi-history-p115-k11-g01","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点11 人民政协与《共同纲领》"],"type":"group","title":"1949年人民政协与三份建国文件","question":"人民政协一届全会通过哪三份文件？《共同纲领》承担什么作用？","answer":"① 1949年9月21日中国人民政治协商会议第一届全体会议在北平开幕，承担完成创建新中国的任务。\n② 通过《中国人民政治协商会议组织法》《中华人民共和国中央人民政府组织法》《中国人民政治协商会议共同纲领》。\n③ 《共同纲领》是当时全国人民的大宪章，起临时宪法作用。\n④ 开启共产党领导各党派团体和各族各界共同协商建国、共创伟业新纪元，标志共产党领导的多党合作和政治协商制度正式确立。\n⑤ 与1946年旧政协不同，1949年人民政协是在共产党领导下举行的。","notes":"","source":"苏一《27命题点高清图谱》印刷第115页（PDF第120页）；依原图整理","source_pages":[115],"source_pdf_pages":[120],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":463},{"id":"suyi-history-p115-k12-g01","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点12 中国革命胜利的伟大意义和基本经验"],"type":"group","title":"新民主主义革命胜利的原因与意义","question":"革命胜利根本原因是什么？民族独立与社会发展方向发生什么改变？","answer":"① 深厚社会根源与群众基础：工人、农民、城市小资产阶级是主要力量，民族资产阶级也是动力之一；根本原因是中国共产党领导，国际无产阶级和人民支持也重要。\n② 实现民族独立、人民解放，结束帝国主义勾结封建统治者压迫人民历史，结束国家战乱频仍、四分五裂局面。\n③ 根本改变社会发展方向，为从新民主主义向社会主义转变、建立社会主义制度和现代化创造政治前提，为国家富强、民族复兴开辟道路。\n④ 是十月革命和世界反法西斯战争胜利后重大世界事件，鼓舞被压迫民族和人民解放斗争。\n⑤ 在马克思主义指导下形成毛泽东思想、找到革命胜利正确道路，是对马克思主义发展的重大贡献。","notes":"","source":"苏一《27命题点高清图谱》印刷第115页（PDF第120页）；依原图整理","source_pages":[115],"source_pdf_pages":[120],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":464},{"id":"suyi-history-p115-k12-g02","revision":1,"path":["史纲","第七章 为建立新中国而奋斗","考点12 中国革命胜利的伟大意义和基本经验"],"type":"group","title":"革命胜利的基本经验与三大法宝","question":"三大法宝怎样联系？革命的根本问题与经验总括是什么？","answer":"① 没有共产党坚强领导，革命胜利不可能实现。\n② 必须把马克思主义基本原理同中国具体实际相结合，不断推进马克思主义中国化，在毛泽东思想指导下制定正确路线政策、找到适合国情道路。\n③ 三大法宝：统一战线、武装斗争、党的建设。统一战线的关键是坚持工人阶级及其政党领导权；武装斗争实质是工人阶级领导的农民战争；党的建设保证领导核心。\n④ 革命根本问题是国家政权问题。经验集中到一点，是工人阶级领导、以工农联盟为基础的人民民主专政。","notes":"","source":"苏一《27命题点高清图谱》印刷第115页（PDF第120页）；依原图整理","source_pages":[115],"source_pdf_pages":[120],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":465},{"id":"suyi-history-p116-k01-g01","revision":1,"path":["史纲","第八章 中华人民共和国的成立与中国社会主义建设道路的探索","考点1 中国人民站起来了"],"type":"group","title":"中华人民共和国成立的伟大意义","question":"新中国成立结束了哪些历史，带来哪些转变？为何不能说1949年已建立社会主义基本制度？","answer":"① 1949年10月1日中华人民共和国成立。\n② 结束旧中国半殖民地半封建社会历史、少数剥削者统治劳动人民历史、旧中国四分五裂局面，废除列强强加的不平等条约和在华特权。\n③ 实现从封建专制政治向人民民主的伟大飞跃，实现国家高度统一和各民族空前团结。\n④ 标志新民主主义革命基本胜利、社会主义革命阶段开始，新民主主义社会在全国建立，民族独立和人民解放任务基本完成，中国人民站起来，开启民族复兴新纪元。\n⑤ 是具有世界意义的胜利，是马克思主义在中国的胜利、毛泽东思想的胜利。\n⑥ 1949年建立的是新民主主义社会，1956年社会主义改造基本完成后才建立社会主义基本制度。","notes":"","source":"苏一《27命题点高清图谱》印刷第116页（PDF第121页）；依原图整理","source_pages":[116],"source_pdf_pages":[121],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":466},{"id":"suyi-history-p116-k02-g01","revision":1,"path":["史纲","第八章 中华人民共和国的成立与中国社会主义建设道路的探索","考点2 捍卫巩固新政权的斗争"],"type":"group","title":"建国初期考验与七届三中全会","question":"新政权面临哪些考验？七届三中全会中心任务和战略策略方针是什么？","answer":"① 能否保卫革命胜利成果、巩固人民政权；能否克服经济困难、迅速恢复发展经济；能否巩固独立、维护主权安全；能否经受全国执政新考验、保持谦虚谨慎艰苦奋斗。\n② 1950年6月七届三中全会，中心任务是在三年左右争取国家财政经济状况基本好转。\n③ 新中国成立初期战略策略方针是“不要四面出击”，团结一切可团结的力量，集中力量完成主要任务。","notes":"","source":"苏一《27命题点高清图谱》印刷第116页（PDF第121页）；依原图整理","source_pages":[116],"source_pdf_pages":[121],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":467},{"id":"suyi-history-p116-k02-g02","revision":1,"path":["史纲","第八章 中华人民共和国的成立与中国社会主义建设道路的探索","考点2 捍卫巩固新政权的斗争"],"type":"group","title":"完成民主革命遗留任务与新解放区土改","question":"军事政治建设、土地改革和社会改革各有哪些举措？富农政策怎样变化？","answer":"① 军事上继续消灭残余敌人；政治上普遍召开地方各级各界人民代表会议，人民开始行使当家作主权利。\n② 1950年至1953年春，在新解放区实行土改，颁布《中华人民共和国土地改革法》。\n③ 富农政策由解放战争时期征收多余土地财产，改为保存富农经济；这是我国历史上规模最大、实施较好的一次土地改革，解放农村生产力，为工业化开辟道路。\n④ 1950年颁布《中华人民共和国婚姻法》，反对封建婚姻制度、保障婚姻自由。\n⑤ 1950—1951年开展镇压反革命运动，清除国民党在大陆残余反动势力。","notes":"","source":"苏一《27命题点高清图谱》印刷第116页（PDF第121页）；依原图整理","source_pages":[116],"source_pdf_pages":[121],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":468},{"id":"suyi-history-p116-k02-g03","revision":1,"path":["史纲","第八章 中华人民共和国的成立与中国社会主义建设道路的探索","考点2 捍卫巩固新政权的斗争"],"type":"group","title":"独立外交与抗美援朝","question":"新中国外交三项方针是什么？抗美援朝的意义如何成组把握？","answer":"① 废除帝国主义依靠不平等条约在华享有的特权；提出“另起炉灶”“打扫干净屋子再请客”“一边倒”外交方针。\n② 1950年6月朝鲜战争爆发，美国武装干涉并侵入台湾海峡、威胁中国安全，中国作出抗美援朝、保家卫国决策。\n③ 抗美援朝胜利，是中国人民站起来后屹立世界东方的宣言书，打出国威军威和精气神，捍卫安全、彰显大国地位。\n④ 使新中国在复杂国际环境中站稳脚跟，锻造抗美援朝精神，增强民族自信自豪。\n⑤ 是中华民族走向伟大复兴的重要里程碑，创造以弱胜强范例，打破美军不可战胜神话，对世界和平与人类进步有重大意义。","notes":"","source":"苏一《27命题点高清图谱》印刷第116页（PDF第121页）；依原图整理","source_pages":[116],"source_pdf_pages":[121],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":469},{"id":"suyi-history-p116-k02-g04","revision":1,"path":["史纲","第八章 中华人民共和国的成立与中国社会主义建设道路的探索","考点2 捍卫巩固新政权的斗争"],"type":"group","title":"恢复经济、社会主义因素与“三反五反”","question":"建国初期怎样同时完成民主革命和开始社会主义革命？“三反”“五反”分别针对什么？","answer":"① 没收官僚资本，确立社会主义性质国营经济的领导地位；开始把资本主义纳入国家资本主义轨道；引导农民在土改后走互助合作道路，为系统社会主义改造奠基。\n② 没收官僚资本兼有民主革命和社会主义革命双重性质：既反官僚资本与反帝反封建，又具有反资本主义、确立国营经济性质。\n③ 推动教育科学文化卫生除旧布新，恢复国民经济。\n④ 1951年底至1952年“三反”：反贪污、反浪费、反官僚主义，警惕资产阶级腐蚀，保持党的先进性和执政基础。\n⑤ 1952年“五反”：反行贿、反偷税漏税、反盗窃国家财产、反偷工减料、反盗窃经济情报，打击不法资本家，促进经济结构调整，为工商业改造和大规模经济建设准备条件。","notes":"","source":"苏一《27命题点高清图谱》印刷第116页（PDF第121页）；依原图整理","source_pages":[116],"source_pdf_pages":[121],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":470},{"id":"suyi-history-p117-k03-g01","revision":1,"path":["史纲","第八章 中华人民共和国的成立与中国社会主义建设道路的探索","考点3 过渡时期总路线的提出"],"type":"group","title":"过渡时期总路线与社会主义改造的必然性","question":"“一化三改”是什么？为什么选择社会主义而不是资本主义发展道路？","answer":"① 党对向社会主义过渡的认识，随主要矛盾、国内阶级关系、经济成分和国际形势变化逐步发展。\n② 过渡时期总路线：在相当长时期内逐步实现社会主义工业化，逐步实现对农业、手工业和资本主义工商业的社会主义改造，通常概括为“一化三改”。\n③ 社会主义工业化是国家独立富强的首要条件；改变落后面貌、巩固政权必须工业化。\n④ 民族资本主义力量弱、发展困难，不可能成为工业起飞基础。\n⑤ 对个体农业进行社会主义改造，是保证工业发展、实现工业化的必要条件；国际环境也支持选择社会主义。","notes":"","source":"苏一《27命题点高清图谱》印刷第117页（PDF第122页）；依原图整理","source_pages":[46,47,117],"source_pdf_pages":[51,52,122],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":471},{"id":"suyi-history-p117-k04-g01","revision":1,"path":["史纲","第八章 中华人民共和国的成立与中国社会主义建设道路的探索","考点4 社会主义工业化的起步"],"type":"group","title":"“一五”计划与三大改造","question":"“一五”建设的中心和配套安排是什么？工业化与改造怎样联系？","answer":"① “一五”经济建设指导方针突出集中主要力量发展重工业，建立工业化和国防现代化初步基础，同时相应发展交通运输、轻工业、农业、商业并培养人才。\n② 1953年开始，经济建设有计划地在全国展开。\n③ 农业、手工业、资本主义工商业社会主义改造，为工业化创造制度条件；建设与改造并举，逐步实现生产资料私有制向社会主义公有制转变。\n④ 1956年三大改造基本完成，社会主义经济制度建立，是中国进入社会主义社会的主要标志。","notes":"","source":"苏一《27命题点高清图谱》印刷第117页（PDF第122页）；依原图整理","source_pages":[47,117],"source_pdf_pages":[52,122],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":472},{"id":"suyi-history-p117-k06-g01","revision":1,"path":["史纲","第八章 中华人民共和国的成立与中国社会主义建设道路的探索","考点6 初步确立社会主义基本制度"],"type":"group","title":"人民代表大会制度与社会主义基本制度","question":"1954年和1956年分别建立什么制度？社会主义基本制度确立有什么意义？","answer":"① 1954年9月第一届全国人大第一次会议通过《中华人民共和国宪法》，标志人民代表大会制度这一根本政治制度正式建立；政协不再代行人大职权，而作为统一战线组织继续存在。\n② 人民代表大会制度是党领导人民长期探索的成果，是中国土地产生的新型政治制度，是人类政治制度史的伟大创造，实现中国政治制度伟大变革。\n③ 1956年改造基本完成，社会主义基本制度在中国确立，完成从新民主主义到社会主义过渡，进入全面建设社会主义历史阶段。\n④ 调动工人农民积极性，提供当代中国发展进步根本政治前提和制度基础，为先进文化指明方向，使占世界四分之一人口的东方大国进入社会主义社会。","notes":"","source":"苏一《27命题点高清图谱》印刷第117页（PDF第122页）；依原图整理","source_pages":[117],"source_pdf_pages":[122],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":473},{"id":"suyi-history-p117-k07-g01","revision":1,"path":["史纲","第八章 中华人民共和国的成立与中国社会主义建设道路的探索","考点7 探索适合中国国情的社会主义建设道路"],"type":"group","title":"“第二次结合”与《论十大关系》","question":"为什么提出第二次结合？《论十大关系》、双百方针分别有什么地位？","answer":"① 建国初缺乏经验，主要学习苏联；“一五”实践积累独立建设经验，苏联社会主义建设暴露问题，促使党探索自己的道路。\n② 1956年4月初毛泽东提出，把马克思列宁主义基本原理同中国革命、建设实际结合，在社会主义革命建设时期进行“第二次结合”，找出在中国建设社会主义的道路。\n③ 1956年4月《论十大关系》从经济、政治方面提出新指导方针，为八大作理论准备，探索调动国内外积极因素建设社会主义的途径。\n④ 同年提出“向科学进军”，确立“百花齐放、百家争鸣”为发展科学文化的指导方针。","notes":"","source":"苏一《27命题点高清图谱》印刷第117页（PDF第122页）；依原图整理","source_pages":[48,117],"source_pdf_pages":[53,122],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":474},{"id":"suyi-history-p117-k08-g01","revision":1,"path":["史纲","第八章 中华人民共和国的成立与中国社会主义建设道路的探索","考点8 开始全面建设社会主义"],"type":"group","title":"中共八大的主要判断与建设方针","question":"八大怎样判断主要矛盾、主要任务，并部署经济政治和执政党建设？","answer":"① 1956年9月八大，指出人民要求经济文化迅速发展同当前经济文化不能满足需要的状况之间的矛盾，主要任务是集中力量发展生产力，实现工业化，在新生产关系下保护发展生产力。\n② 经济上既反保守又反冒进，在综合平衡中稳步前进；陈云提出“三个主体、三个补充”，是探索适合国情经济体制的重要尝试。\n③ 政治上发展社会主义民主、健全法制，使党政活动有法可依、有法必依。\n④ 执政党建设，根据全国执政新情况，强调民主集中制等重要制度。\n⑤ 八大路线正确，在较好的历史起点上探索中国社会主义建设道路，提出许多富有创造精神的新方针。\n⑥ 1957年《关于正确处理人民内部矛盾的问题》提出区分处理两类不同性质矛盾；整风与反右斗争中发生扩大化错误。毛泽东还提出造成又有集中又有民主、纪律与自由、统一意志与个人心情舒畅相结合的政治局面。","notes":"","source":"苏一《27命题点高清图谱》印刷第117页（PDF第122页）；依原图整理","source_pages":[48,117],"source_pdf_pages":[53,122],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":475},{"id":"suyi-history-p118-k09-g01","revision":1,"path":["史纲","第八章 中华人民共和国的成立与中国社会主义建设道路的探索","考点9 社会主义建设道路的艰辛探索和曲折发展"],"type":"group","title":"国民经济调整、“四个现代化”与建设成就","question":"1961年八字方针、四个现代化目标和初步探索成就分别是什么？","answer":"① 1961年八届九中全会决定对国民经济实行“调整、巩固、充实、提高”八字方针。\n② “四个现代化”：现代农业、现代工业、现代国防、现代科学技术；把我国建设为社会主义强国，赶超世界先进水平。\n③ 全面建设社会主义取得独立的比较完整工业体系和国民经济体系，人民生活水平提高，文化教育医疗体育和科技事业发展，形成奋发向上的时代精神，国际地位提升、国际环境改善。\n④ 独立完整工业和经济体系，从根本上解决工业化“从无到有”问题，为以后发展奠定物质技术基础。探索中也出现严重曲折，不能以曲折否定全部成就。","notes":"","source":"苏一《27命题点高清图谱》印刷第118页（PDF第123页）；依原图整理","source_pages":[118],"source_pdf_pages":[123],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":476},{"id":"suyi-history-p118-k01-g01","revision":1,"path":["史纲","第九章 改革开放与中国特色社会主义的开创和发展","考点1 伟大转折和成功开创中国特色社会主义"],"type":"group","title":"真理标准讨论与十一届三中全会","question":"真理标准讨论的意义是什么？十一届三中全会怎样实现伟大转折？","answer":"① “两个凡是”坚持凡是毛泽东决策都维护、指示都遵循，妨碍实事求是纠错；真理标准讨论是延安整风后又一次马克思主义思想解放运动，成为正本清源、拨乱反正和改革开放思想先导。\n② 1978年中央工作会议上，邓小平《解放思想，实事求是，团结一致向前看》成为开辟新道路的宣言书，也为三中全会奠定基础。\n③ 1978年12月十一届三中全会，冲破“左”错误束缚，否定“两个凡是”，高度评价真理标准讨论，停止使用“以阶级斗争为纲”口号，把工作重心转向社会主义现代化建设，提出改革开放任务。\n④ 强调民主、健全法制和正确评价毛泽东及毛泽东思想，事实上形成以邓小平为核心的中央领导集体。\n⑤ 重新确立马克思主义思想路线、政治路线、组织路线，开启改革开放和社会主义现代化建设新时期，实现新中国成立以来意义深远的伟大转折。","notes":"","source":"苏一《27命题点高清图谱》印刷第118页（PDF第123页）；依原图整理","source_pages":[118],"source_pdf_pages":[123],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":477},{"id":"suyi-history-p118-k02-g01","revision":1,"path":["史纲","第九章 改革开放与中国特色社会主义的开创和发展","考点2 拨乱反正任务的基本完成"],"type":"group","title":"第二个历史决议与拨乱反正","question":"起草第二个历史决议的三条原则是什么？它怎样评价毛泽东思想和社会主义建设道路？","answer":"① 起草原则：确立毛泽东历史地位、坚持发展毛泽东思想是最核心一条；实事求是分析建国以来重大事件、作出公正评价；总结宜粗不宜细，目的是团结一致向前看。\n② 1981年6月十一届六中全会通过《关于建国以来党的若干历史问题的决议》，彻底否定“文化大革命”，对重大事件人物作基本结论。\n③ 科学评价毛泽东与毛泽东思想，肯定功绩第一位、错误第二位，概括毛泽东思想活的灵魂：实事求是、群众路线、独立自主。\n④ 指出社会主义改造基本完成后，主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾；工作重心必须是以经济建设为中心的社会主义现代化建设。\n⑤ 从多个方面概括适合中国情况的建设道路，实际上初步回答在中国建设什么样社会主义、怎样建设社会主义，明确实行改革开放。\n⑥ 决议标志党在指导思想上拨乱反正胜利完成；四项基本原则是坚持社会主义道路、人民民主专政、共产党领导、马列主义毛泽东思想。","notes":"","source":"苏一《27命题点高清图谱》印刷第118页（PDF第123页）；依原图整理","source_pages":[118],"source_pdf_pages":[123],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":478},{"id":"suyi-history-p119-k03-g01","revision":1,"path":["史纲","第九章 改革开放与中国特色社会主义的开创和发展","考点3 改革开放的起步"],"type":"group","title":"改革开放从农村突破到经济特区","question":"改革开放初期经济调整和农村改革有哪些内容？","answer":"① 1979年中央工作会议提出国民经济“调整、改革、整顿、提高”的新八字方针，不能与1961年的八字方针混淆。\n② 经济体制改革首先在农村突破，确立以包产到户、包干到户为主要形式的家庭联产承包责任制。\n③ 逐步转向城市经济体制改革。\n④ 推进对外开放、兴办经济特区。\n⑤ 启动政治体制改革，改革逐步向多领域展开。","notes":"","source":"苏一《27命题点高清图谱》印刷第119页（PDF第124页）；依原图整理","source_pages":[119],"source_pdf_pages":[124],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":479},{"id":"suyi-history-p119-k04-g01","revision":1,"path":["史纲","第九章 改革开放与中国特色社会主义的开创和发展","考点4 改革开放和社会主义现代化建设新局面"],"type":"group","title":"十二大、十二届三中全会与十三大","question":"这三次会议分别回答什么问题？对外开放格局怎样形成？","answer":"① 1982年十二大，提出“走自己的道路，建设有中国特色的社会主义”，回答新时期走什么道路的问题，成为改革开放和现代化建设伟大旗帜。\n② 1984年十二届三中全会通过《中共中央关于经济体制改革的决定》，突破把计划经济同商品经济对立的传统观念。\n③ 从经济特区到沿海开放城市、沿海经济开放区，形成多层次对外开放格局。\n④ 1987年十三大系统阐述社会主义初级阶段理论，明确概括党在初级阶段的基本路线。","notes":"","source":"苏一《27命题点高清图谱》印刷第119页（PDF第124页）；依原图整理","source_pages":[119],"source_pdf_pages":[124],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":480},{"id":"suyi-history-p119-k04-g02","revision":1,"path":["史纲","第九章 改革开放与中国特色社会主义的开创和发展","考点4 改革开放和社会主义现代化建设新局面"],"type":"group","title":"邓小平南方谈话的内容与意义","question":"南方谈话怎样回答计划市场、社会主义本质和改革判断标准？","answer":"① 1992年南方谈话，提出社会主义市场经济和社会主义本质理论，强调计划多一点或市场多一点，不是社会主义与资本主义的本质区别，计划和市场都是经济手段。\n② 判断改革开放和工作得失的“三个有利于”：有利于发展社会主义社会生产力，有利于增强社会主义国家综合国力，有利于提高人民生活水平。\n③ 社会主义本质是解放生产力、发展生产力，消灭剥削、消除两极分化，最终达到共同富裕；革命是解放生产力，改革也是解放生产力。\n④ “发展才是硬道理”，要抓住机遇、加强党的建设；基本路线要管一百年、动摇不得；初级阶段具有长期性和渐进性。\n⑤ 深刻回答长期困扰和束缚思想的重大问题，是改革开放和现代化建设新阶段又一个解放思想、实事求是宣言书，对十四大有重要指导作用。","notes":"","source":"苏一《27命题点高清图谱》印刷第119页（PDF第124页）；依原图整理","source_pages":[119],"source_pdf_pages":[124],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":481},{"id":"suyi-history-p119-k05-g01","revision":1,"path":["史纲","第九章 改革开放与中国特色社会主义的开创和发展","考点5 把中国特色社会主义推向21世纪"],"type":"group","title":"十四大、十五大的理论和制度成果","question":"十四大与十五大分别确定了什么目标、指导思想和纲领？","answer":"① 1992年十四大，要求抓住机遇、加快发展，集中精力搞经济建设；明确经济体制改革目标是建立社会主义市场经济体制，提出用邓小平建设有中国特色社会主义理论武装全党。\n② 1997年十五大，将邓小平理论与马列主义、毛泽东思想一道确立为党的指导思想，提出党在社会主义初级阶段的基本纲领。","notes":"","source":"苏一《27命题点高清图谱》印刷第119页（PDF第124页）；依原图整理","source_pages":[119],"source_pdf_pages":[124],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":482},{"id":"suyi-history-p119-k06-g01","revision":1,"path":["史纲","第九章 改革开放与中国特色社会主义的开创和发展","考点6 在新的形势下坚持和发展中国特色社会主义"],"type":"group","title":"十六大与十七大的主要成果","question":"全面建设小康社会、科学发展观与中国特色社会主义理论体系分别在哪次大会突出提出？","answer":"① 2002年十六大，把“三个代表”重要思想确立为必须长期坚持的指导思想并写入党章，提出全面建设小康社会奋斗目标。\n② 2007年十七大，全面系统阐述科学发展观并将其写入党章，阐述中国特色社会主义道路基本内容，首次提出并概括中国特色社会主义理论体系。","notes":"","source":"苏一《27命题点高清图谱》印刷第119页（PDF第124页）；依原图整理","source_pages":[119],"source_pdf_pages":[124],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":483},{"id":"suyi-history-p120-k01-g01","revision":1,"path":["史纲","第十章 中国特色社会主义进入新时代","考点1 开拓中国特色社会主义更为广阔的发展前景"],"type":"group","title":"十八大与十八届三中全会","question":"十八大开启什么历史阶段？十八届三中全会明确什么改革总目标？","answer":"① 2012年十八大部署全面建成小康社会和夺取中国特色社会主义新胜利，中国特色社会主义进入新时代，贯穿大会主线是坚持和发展中国特色社会主义。\n② 2013年十八届三中全会通过全面深化改革决定，作顶层设计和总体规划。\n③ 总目标：完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。\n④ 这是十一届三中全会后又一次具有划时代意义的重要会议，推动改革由局部探索、破冰突围转向系统集成、全面深化。","notes":"","source":"苏一《27命题点高清图谱》印刷第120页（PDF第125页）；依原图整理","source_pages":[120],"source_pdf_pages":[125],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":484},{"id":"suyi-history-p120-k02-g01","revision":1,"path":["史纲","第十章 中国特色社会主义进入新时代","考点2 把新时代中国特色社会主义不断推向前进"],"type":"group","title":"十九大、十九届四中与五中全会","question":"新时代主要矛盾、新思想指导地位、制度治理和规划分别对应哪些会议？","answer":"① 2017年十九大，明确中国发展新的历史方位，作出中国特色社会主义进入新时代、主要矛盾转化的重大判断，确立习近平新时代中国特色社会主义思想指导地位。\n② 主要矛盾：人民日益增长的美好生活需要和不平衡不充分发展之间的矛盾。\n③ 2019年十九届四中全会，主题为坚持完善中国特色社会主义制度、推进治理体系和治理能力现代化，回答应坚持巩固什么、完善发展什么。\n④ 2020年十九届五中全会，通过“十四五”规划和2035年远景目标建议。","notes":"","source":"苏一《27命题点高清图谱》印刷第120页（PDF第125页）；依原图整理","source_pages":[120],"source_pdf_pages":[125],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":485},{"id":"suyi-history-p120-k03-g01","revision":1,"path":["史纲","第十章 中国特色社会主义进入新时代","考点3 隆重庆祝中国共产党成立100周年"],"type":"group","title":"第一个百年目标与四个历史阶段的贡献","question":"全面小康何时宣告实现？四阶段为民族复兴分别创造什么条件？","answer":"① 2021年7月1日宣布实现第一个百年奋斗目标，在中华大地全面建成小康社会，历史性解决绝对贫困问题，向第二个百年目标迈进。\n② 新民主主义革命伟大成就，为民族复兴创造根本社会条件。\n③ 社会主义革命和建设伟大成就，奠定根本政治前提和制度基础。\n④ 改革开放和社会主义现代化建设伟大成就，提供充满新活力的体制保证和快速发展的物质条件。\n⑤ 新时代中国特色社会主义伟大成就，提供更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量。\n⑥ 党的全部奋斗、牺牲、创造，归结到一个主题：实现中华民族伟大复兴。","notes":"","source":"苏一《27命题点高清图谱》印刷第120页（PDF第125页）；依原图整理","source_pages":[120],"source_pdf_pages":[125],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":486},{"id":"suyi-history-p120-k04-g01","revision":1,"path":["史纲","第十章 中国特色社会主义进入新时代","考点4 党的十九届六中全会"],"type":"group","title":"第三个历史决议与“十个坚持”","question":"第三个历史决议概括怎样的历史意义和历史经验？","answer":"① 2021年十九届六中全会通过《中共中央关于党的百年奋斗重大成就和历史经验的决议》。\n② 百年奋斗根本改变中国人民前途命运，开辟民族复兴正确道路，展现马克思主义强大生命力，深刻影响世界历史进程，锻造走在时代前列的共产党。\n③ 十个坚持：党的领导、人民至上、理论创新、独立自主、中国道路、胸怀天下、开拓创新、敢于斗争、统一战线、自我革命。\n④ 独立自主、走自己的路，是党的全部理论实践立足点，是百年奋斗得出的历史结论。","notes":"","source":"苏一《27命题点高清图谱》印刷第120页（PDF第125页）；依原图整理","source_pages":[120],"source_pdf_pages":[125],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":487},{"id":"suyi-history-p120-k05-g01","revision":1,"path":["史纲","第十章 中国特色社会主义进入新时代","考点5 党的二十大"],"type":"group","title":"二十大的主题与中心任务","question":"二十大主题中的关键词是什么？新时代新征程中心任务怎样表述？","answer":"① 主题：高举中国特色社会主义伟大旗帜，全面贯彻习近平新时代中国特色社会主义思想，弘扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会主义现代化国家、全面推进中华民族伟大复兴而团结奋斗。\n② 中心任务：团结带领全国各族人民全面建成社会主义现代化强国，实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","notes":"","source":"苏一《27命题点高清图谱》印刷第120页（PDF第125页）；依原图整理","source_pages":[120],"source_pdf_pages":[125],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":488},{"id":"suyi-history-p120-k06-g01","revision":1,"path":["史纲","第十章 中国特色社会主义进入新时代","考点6 党的二十届三中全会"],"type":"group","title":"二十届三中全会的主题与决定","question":"二十届三中全会以什么为主题，通过什么决定？","answer":"① 2024年二十届三中全会的主题是进一步全面深化改革、推进中国式现代化。\n② 通过《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。\n③ 改革围绕党的中心任务推进，是完善中国特色社会主义制度和治理体系、推动高质量发展、适应社会主要矛盾变化、应对风险挑战、行稳致远推进现代化的迫切需要。","notes":"","source":"苏一《27命题点高清图谱》印刷第120页（PDF第125页）；依原图整理","source_pages":[120],"source_pdf_pages":[125],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":489},{"id":"suyi-ethics-p121-k01-g01","revision":1,"path":["思修","绪论 担当复兴大任 成就时代新人","考点1 新时代呼唤担当民族复兴大任的时代新人"],"type":"group","title":"时代新人的四项要求","question":"立大志、明大德、成大才、担大任各要求什么？决定人生价值的最大砝码是什么？","answer":"① 青年兴则国家兴，青年强则国家强，要成为堪当民族复兴重任的时代新人。\n② 立大志：有崇高的理想信念，牢记使命、自信自励。\n③ 明大德：锤炼高尚品格，崇德修身、启润青春。\n④ 成大才：有高强的本领才干，勤奋学习、全面发展。\n⑤ 担大任：有天下兴亡、匹夫有责的担当精神，讲求奉献、实干进取。青年的担当是决定人生价值的最大砝码。","notes":"","source":"苏一《27命题点高清图谱》印刷第121页（PDF第126页）；依原图整理","source_pages":[121],"source_pdf_pages":[126],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":490},{"id":"suyi-ethics-p121-k02-g01","revision":1,"path":["思修","绪论 担当复兴大任 成就时代新人","考点2 思想道德与法治的关系"],"type":"group","title":"思想道德与法治的区别、共性和相互作用","question":"道德与法治在哪些方面不同？两者相互提供什么支撑？","answer":"① 区别：调节领域、调节方式、调节目标不同，不能把道德要求等同于法律义务。\n② 共性：都是调节思想行为、协调人际关系、维护社会秩序的重要手段，都是上层建筑的重要组成部分，共同服务于一定经济基础。\n③ 思想道德建设为法治建设提供思想指引和价值基础：为法律制定、发展、完善提供价值准则，促进自觉尊法学法守法用法，调节范围和方式更广泛灵活。\n④ 法治建设为思想道德建设提供制度支撑和法律保障：以国家强制力确认基本原则，把道德要求有机融入法律、使良法善治发挥导向；执法司法使道德要求得到切实遵循，普法守法促进履行法定义务和家庭社会责任。\n⑤ 道德作用更好发挥需要法律支持，法律作用更好实现需要道德建设为条件；二者相互补充促进，不可相互替代。\n⑥ 爱国、诚信、尊重他人权利、男女平等等可能同时属于道德规范和法律规范；但受道德谴责的行为不一定都应受法律制裁。","notes":"","source":"苏一《27命题点高清图谱》印刷第121页（PDF第126页）；依原图整理","source_pages":[121],"source_pdf_pages":[126],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":491},{"id":"suyi-ethics-p122-k01-g01","revision":1,"path":["思修","第一章 领悟人生真谛 把握人生方向","考点1 人生观是对人生的总看法"],"type":"group","title":"人的本质与个人、社会的关系","question":"人的本质是什么？个人与社会关系中最根本的关系是什么？个人利益与社会利益怎样联系？","answer":"① 对人的认识，核心在于认识人的本质。人的本质是一切社会关系的总和；人的本质属性是社会属性。\n② 个人与社会的关系，是认识和处理人生问题的重要着眼点和出发点。个人与社会是对立统一的，二者相互依存、相互制约、相互促进；社会是人的存在形式。\n③ 最根本的是个人利益与社会利益的关系。在社会主义社会中，二者在根本上是一致的。\n④ 社会利益不是个人利益的简单相加，而是所有人利益的有机统一。社会利益体现了社会成员个人的根本利益和长远利益，是个人利益得以实现的前提和基础，同时保障个人利益的实现。\n⑤ 人的社会性决定了：只有在推动社会进步的过程中，才能实现自我的发展。","notes":"","source":"苏一《27命题点高清图谱》印刷第122页（PDF第127页）；依原图整理","source_pages":[122],"source_pdf_pages":[127],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":492},{"id":"suyi-ethics-p122-k01-g02","revision":1,"path":["思修","第一章 领悟人生真谛 把握人生方向","考点1 人生观是对人生的总看法"],"type":"group","title":"人生目的、人生态度、人生价值","question":"人生观的三方面分别回答什么问题？谁是核心？人生目的有哪些决定作用？","answer":"① 人生目的：人们在社会实践中关于自身行为的根本指向和人生追求，回答“人为什么活着”，是人生观的核心。\n人生目的决定人生道路，规定人生方向；决定人生态度，不同目的使人持不同态度；决定人生价值选择，正确的人生目的使人懂得人生价值首先在于奉献。\n② 人生态度：人们通过生活实践形成的对人生问题的一种相对稳定的心理倾向和精神状态，回答“人应当如何活着”。\n③ 人生价值：人的生命及其实践活动对于社会和个人所具有的作用和意义，包括自我价值和社会价值，回答“什么样的人生才有价值”。\n④ 三者相互联系、相辅相成：人生目的决定对待实际生活的态度和对人生价值的评判；人生态度影响对人生目的的持守和人生价值的实现；人生价值制约对人生目的和人生态度的选择。","notes":"","source":"苏一《27命题点高清图谱》印刷第122页（PDF第127页）；依原图整理","source_pages":[122],"source_pdf_pages":[127],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":493},{"id":"suyi-ethics-p122-k01-g03","revision":1,"path":["思修","第一章 领悟人生真谛 把握人生方向","考点1 人生观是对人生的总看法"],"type":"group","title":"自我价值与社会价值","question":"自我价值与社会价值分别指什么？它们的前提、基础和保障如何区分？","answer":"① 自我价值：个体的人生活动对自己的生存和发展所具有的价值。社会价值：个体的实践活动对社会、他人所具有的价值。\n② 二者既相互区别，又密切联系、相互依存，共同构成人生价值的矛盾统一体。\n③ 自我价值是个体生存和发展的必要条件；自我价值的实现是个体为社会创造更大价值的前提。\n④ 社会价值是社会存在和发展的重要条件；社会价值的实现是个体自我完善、全面发展的保障。没有社会价值，人生的自我价值就无法存在。\n⑤ 社会价值与自我价值可以同时实现，不能说社会价值必须以牺牲个人价值为代价；不能用“社会满足个人欲望的程度”衡量个人社会价值，也不能把二者的轻重作绝对化比较。","notes":"","source":"苏一《27命题点高清图谱》印刷第122页（PDF第127页）；依原图整理","source_pages":[122],"source_pdf_pages":[127],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":494},{"id":"suyi-ethics-p122-k01-g04","revision":1,"path":["思修","第一章 领悟人生真谛 把握人生方向","考点1 人生观是对人生的总看法"],"type":"group","title":"人生观、世界观与价值观","question":"世界观、人生观、价值观怎样联系？决定作用与反作用分别是什么？","answer":"① 世界观是人们对生活在其中的世界以及人与世界关系的总体看法和观点。\n② 世界观决定人生观；有什么样的世界观，就会有什么样的人生观。\n③ 人生观对世界观的巩固、发展和变化起重要作用。\n④ 价值观是人们关于价值的根本观点，对人生观的形成和发展具有重要的导引作用。","notes":"","source":"苏一《27命题点高清图谱》印刷第122页（PDF第127页）；依原图整理","source_pages":[122],"source_pdf_pages":[127],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":495},{"id":"suyi-ethics-p122-k02-g01","revision":1,"path":["思修","第一章 领悟人生真谛 把握人生方向","考点2 正确的人生观"],"type":"group","title":"高尚的人生追求与积极人生态度","question":"最先进的人生追求是什么？积极进取的人生态度包括哪四项？","answer":"① 服务人民、奉献社会的思想以科学而高尚的品质，代表了人类社会迄今最先进的人生追求。\n② 确立这一人生追求，才能清楚把握人生奋斗目标，深刻理解人为什么而活、应走什么人生道路；以正确态度解决实际生活问题；掌握正确价值标准，懂得人生价值首先在于奉献。\n③ 积极进取的人生态度是实现高尚追求的必要条件；只有积极乐观、主动进取，才能克服前进道路上的困难。\n④ 具体要求：人生须认真，人生当务实，人生应乐观，人生要进取。","notes":"","source":"苏一《27命题点高清图谱》印刷第122页（PDF第127页）；依原图整理","source_pages":[122],"source_pdf_pages":[127],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":496},{"id":"suyi-ethics-p122-k02-g02","revision":1,"path":["思修","第一章 领悟人生真谛 把握人生方向","考点2 正确的人生观"],"type":"group","title":"人生价值的评价与实现","question":"评价人生价值的根本尺度、重要标准、三个结合和实现条件是什么？","answer":"① 根本尺度：一个人的实践活动是否符合社会发展的客观规律，是否促进了历史的进步。\n② 最重要的评价标准：是否用自己的劳动和聪明才智为国家和社会真诚奉献，为人民群众尽心尽力服务。\n③ 评价方法：既看贡献大小，也看尽力程度；既尊重物质贡献，也尊重精神贡献；既注重社会贡献，也注重自身完善。\n④ 实现条件：从社会客观条件出发；从个体自身条件出发；增强实现人生价值的能力和本领。","notes":"","source":"苏一《27命题点高清图谱》印刷第122页（PDF第127页）；依原图整理","source_pages":[122],"source_pdf_pages":[127],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":497},{"id":"suyi-ethics-p123-k03-g01","revision":1,"path":["思修","第一章 领悟人生真谛 把握人生方向","考点3 创造有意义的人生"],"type":"group","title":"辩证对待人生矛盾与错误人生观","question":"如何看待得失、苦乐、顺逆、生死、荣辱？应反对哪三种错误人生观？","answer":"① 得与失：不要过于看重一时的得，不要惧怕或斤斤计较一时的失，要跳出个人得失的计较。\n② 苦与乐：既对立又统一，在一定条件下可以相互转化。\n③ 顺与逆：是人生历程的两种境遇，都可能对人生有作用，关键是怎样认识和对待。\n④ 生与死：个体生命时间有限，但为人民服务、为人类进步事业贡献力量可以是无限的。\n⑤ 荣与辱：荣辱观对个人思想和行为有鲜明的导向和调节作用。\n⑥ 反对拜金主义、享乐主义、极端个人主义。极端个人主义在个人与他人、个人与社会关系上，表现为极端利己主义和狭隘功利主义。","notes":"","source":"苏一《27命题点高清图谱》印刷第123页（PDF第128页）；依原图整理","source_pages":[123],"source_pdf_pages":[128],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":498},{"id":"suyi-ethics-p123-k03-g02","revision":1,"path":["思修","第一章 领悟人生真谛 把握人生方向","考点3 创造有意义的人生"],"type":"group","title":"在实践与奋斗中成就人生","question":"成就出彩人生的三个“同”是什么？社会实践和奋斗怎样实现人生价值与幸福？","answer":"① 与历史同向：增强历史自觉、坚定历史自信，与历史同步、与时代共命运。与祖国同行：把人生目标同国家民族命运紧密联系。与人民同在：在服务群众、实现人民利益的过程中实现人生价值。\n② 社会实践是实现人生价值的必由之路。崇高的价值目标要靠社会实践才能转化为现实；人生价值的创造没有绝对终点，应不断在实践中创造更大的价值。\n③ 人世间一切幸福都要靠辛勤劳动创造；追求幸福是不满足现状、不断创造更好生活的过程。既珍爱眼前幸福，也不断奋斗、创造未来幸福。\n④ 幸福有物质和精神两方面，精神需要的满足、精神生活的充实是重要方面。不能把自己的幸福建立在损害社会整体和他人利益的基础上。","notes":"","source":"苏一《27命题点高清图谱》印刷第123页（PDF第128页）；依原图整理","source_pages":[123],"source_pdf_pages":[128],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":499},{"id":"suyi-ethics-p123-k01-g01","revision":1,"path":["思修","第二章 追求远大理想 坚定崇高信念","考点1 理想信念的内涵及重要性"],"type":"group","title":"理想的内涵、分类与三项特征","question":"什么是理想？理想怎样分类？超越性、实践性、时代性各指什么？","answer":"① 理想是在实践中形成的、有实现可能性的、对未来社会和自身发展目标的向往与追求，是世界观、人生观和价值观在奋斗目标上的集中体现。\n② 分类：按主体分个人理想、社会理想；按时序分近期理想、远期理想；按内容分生活理想、职业理想、道德理想、政治理想；还可按性质分科学理想与非科学理想、按层次分崇高理想与一般理想。\n③ 超越性：不仅源于现实，而且超越现实；不是现实的简单描绘，是与奋斗目标相联系的未来现实。\n④ 实践性：在实践中产生、发展，也只有在实践中才能实现。\n⑤ 时代性：受时代条件制约，随着时代发展而发展。","notes":"","source":"苏一《27命题点高清图谱》印刷第123页（PDF第128页）；依原图整理","source_pages":[123],"source_pdf_pages":[128],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":500},{"id":"suyi-ethics-p123-k01-g02","revision":1,"path":["思修","第二章 追求远大理想 坚定崇高信念","考点1 理想信念的内涵及重要性"],"type":"group","title":"信念的特征、层次及其与理想的关系","question":"信念的三项特征是什么？信仰属于哪一层次？理想与信念怎样相互依存？","answer":"① 信念是在一定认识基础上确立的，对某种思想或事物坚信不疑并身体力行的精神状态。\n② 执着性：一旦形成，就不会轻易改变。支撑性：是经受实践考验而始终坚守理想的精神力量。多样性：信念有不同类型和层次。\n③ 高层次信念决定低层次信念，低层次信念服从高层次信念。信仰是最高层次的信念，具有最大的统摄力；信仰有盲目和科学之分。\n④ 理想和信念总是相互依存。理想是信念所指的对象，信念是理想实现的保障；离开理想，信念无从产生；离开信念，理想寸步难行。","notes":"","source":"苏一《27命题点高清图谱》印刷第123页（PDF第128页）；依原图整理","source_pages":[123],"source_pdf_pages":[128],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":501},{"id":"suyi-ethics-p123-k01-g03","revision":1,"path":["思修","第二章 追求远大理想 坚定崇高信念","考点1 理想信念的内涵及重要性"],"type":"group","title":"理想信念的四方面作用","question":"理想信念为什么是精神之“钙”？四方面作用分别怎样理解？","answer":"① 理想信念是精神之“钙”，理想指引方向，信念决定成败。\n② 昭示奋斗目标：是人的思想和行为的定向器。\n③ 催生前进动力：有了崇高坚定的理想信念，才会以惊人的毅力和不懈努力成就事业。\n④ 提供精神支柱：是人在精神生活领域安身立命的根本。\n⑤ 提高精神境界：是衡量一个人精神境界高下的重要标尺。\n不能据此说理想信念决定社会发展方向，或规划了人生的具体行程。","notes":"","source":"苏一《27命题点高清图谱》印刷第123页（PDF第128页）；依原图整理","source_pages":[123],"source_pdf_pages":[128],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":502},{"id":"suyi-ethics-p124-k02-g01","revision":1,"path":["思修","第二章 追求远大理想 坚定崇高信念","考点2 坚定信仰信念信心"],"type":"group","title":"信仰、信念、信心的三个对象","question":"应增强哪三方面信仰、信念、信心？共产主义远大理想怎样同现实运动联系？","answer":"① 增强对马克思主义、共产主义的信仰。马克思主义是科学的、人民的、实践的、不断发展的开放的理论，是认识世界和改造世界的强大思想武器。\n② 胸怀共产主义远大理想。共产主义是现实运动和长远目标相统一的过程；理想实现道路艰难曲折，需要一代又一代人不懈奋斗。\n③ 增强对中国特色社会主义的信念。中国特色社会主义承载着共产党人的理想探索和亿万人民的奋斗牺牲，是近代以来中国社会发展的必然选择。\n④ 增强对实现中华民族伟大复兴的信心。实现民族复兴是近代以来最伟大的梦想，中国梦是一项光荣而艰巨的事业。","notes":"","source":"苏一《27命题点高清图谱》印刷第124页（PDF第129页）；依原图整理","source_pages":[124],"source_pdf_pages":[129],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":503},{"id":"suyi-ethics-p124-k03-g01","revision":1,"path":["思修","第二章 追求远大理想 坚定崇高信念","考点3 在实现中国梦的实践中放飞青春梦想"],"type":"group","title":"理想与现实的辩证统一","question":"理想与现实的对立和统一是什么？理想实现的长期性、艰巨性、曲折性怎样理解？","answer":"① 对立：理想与现实的矛盾冲突，属于“应然”与“实然”的矛盾。\n② 统一：理想受现实规定和制约，是在认识现实的基础上发展起来的。现实包含理想的因素，孕育理想的发展；理想包含现实中的必然发展因素及转化为现实的条件，在一定条件下可转化为未来现实。\n③ 脱离现实而谈理想，理想就成为空想。\n④ 长期性：理想的实现是一个过程，理想越远大，过程越复杂，需要的时间越长。艰巨性：必须有战胜困难的坚定不移的信心和坚忍不拔的毅力。曲折性：理想变为现实不是一帆风顺的，往往会遇到波澜和坎坷。\n⑤ 艰苦奋斗是实现理想的重要条件，是我们的传家宝，是成就人生事业不可或缺的条件。","notes":"","source":"苏一《27命题点高清图谱》印刷第124页（PDF第129页）；依原图整理","source_pages":[124],"source_pdf_pages":[129],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":504},{"id":"suyi-ethics-p124-k03-g02","revision":1,"path":["思修","第二章 追求远大理想 坚定崇高信念","考点3 在实现中国梦的实践中放飞青春梦想"],"type":"group","title":"个人理想与社会理想","question":"个人理想与社会理想的内涵、实质和双向关系是什么？发生冲突时怎样处理？","answer":"① 个人理想：一定历史条件和社会关系中的个体，对未来物质生活、精神生活的向往追求。社会理想：社会集体乃至全体成员的共同理想，即在全社会占主导地位的共同奋斗目标。\n② 二者关系实质上是个人与社会关系在理想层面的反映，相互联系、影响和制约。\n③ 个人理想以社会理想为指引。从根本上说，个人理想由社会理想规定；在整个理想体系中，社会理想最根本、最重要，个人理想从属于社会理想。个人理想确立应以社会理想为导向，实现依赖社会理想指引；同国家前途、民族命运结合才可能梦想成真。\n④ 社会理想是个人理想的汇聚和升华。不是凭空产生或由外力强加，而是建立在广大社会成员的个人理想基础上；依靠全体成员共同努力，体现在为个人理想而奋斗的实践中。\n⑤ 当二者发生矛盾冲突时，使个人理想服从于全社会的共同理想，必要时作出自我牺牲。","notes":"","source":"苏一《27命题点高清图谱》印刷第124页（PDF第129页）；依原图整理","source_pages":[124],"source_pdf_pages":[129],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":505},{"id":"suyi-ethics-p124-k03-g03","revision":1,"path":["思修","第
