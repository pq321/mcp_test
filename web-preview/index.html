二章 追求远大理想 坚定崇高信念","考点3 在实现中国梦的实践中放飞青春梦想"],"type":"group","title":"为实现中国梦注入青春能量","question":"青年怎样把远大理想变为实际行动？","answer":"① 立鸿鹄志，做奋斗者。树立远大抱负，付诸不断学习、奋斗的行动。\n② 心怀“国之大者”，敢于担当。立志做大事，不要立志做大官；把理想同国家民族命运联系，而不是以个人荣华富贵为理想。\n③ 自觉躬身实践，知行合一。理想要落实到实际行动中，反对空谈，注重实干。","notes":"","source":"苏一《27命题点高清图谱》印刷第124页（PDF第129页）；依原图整理","source_pages":[124],"source_pdf_pages":[129],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":506},{"id":"suyi-ethics-p125-k01-g01","revision":1,"path":["思修","第三章 继承优良传统 弘扬中国精神","考点1 崇尚精神是中华民族的优秀传统"],"type":"group","title":"崇尚精神的三方面表现","question":"中华民族崇尚精神的传统体现在哪三方面？各有哪些典型表现？","answer":"① 对物质生活与精神生活相互关系的独到理解。重视义利关系，先义后利、重视道德理性与精神品格对欲望的引导控制；强调道德当身，不以物惑，以及富贵不能淫、贫贱不能移、威武不能屈的追求。\n② 对理想的不懈追求。儒家把仁爱和谐视为最高理想，墨家主张兼相爱、交相利；古代仁人志士追求为天地立心、为生民立命、为往圣继绝学、为万世开太平。\n③ 对道德修养和道德教化的重视。把立德置于立德、立功、立言“三不朽”之首；追求君子、圣人等理想人格，重视自我完善和品格养成。","notes":"","source":"苏一《27命题点高清图谱》印刷第125页（PDF第130页）；依原图整理","source_pages":[125],"source_pdf_pages":[130],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":507},{"id":"suyi-ethics-p125-k02-g01","revision":1,"path":["思修","第三章 继承优良传统 弘扬中国精神","考点2 中国精神的丰富内涵"],"type":"group","title":"四个伟大精神","question":"伟大创造、奋斗、团结、梦想精神分别有哪些表现？","answer":"① 伟大创造精神：创造伟大思想、科技成果、文学艺术作品、史诗和工程，如诸子思想、四大发明、诗词曲小说、万里长城等。\n② 伟大奋斗精神：开发大好河山，开拓辽阔海疆，开垦广袤粮田，治理大江大河，战胜自然灾害，建设城乡，发展产业，形成丰富多彩的生活。\n③ 伟大团结精神：中国人民始终团结一心、同舟共济，建立了统一的多民族国家。\n④ 伟大梦想精神：盘古开天、女娲补天、伏羲画卦、神农尝草、夸父追日、精卫填海、愚公移山等古代神话，反映了勇于追求和实现梦想的执着精神。","notes":"","source":"苏一《27命题点高清图谱》印刷第125页（PDF第130页）；依原图整理","source_pages":[125],"source_pdf_pages":[130],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":508},{"id":"suyi-ethics-p125-k03-g01","revision":1,"path":["思修","第三章 继承优良传统 弘扬中国精神","考点3 中国共产党是中国精神的忠实继承者和坚定弘扬者"],"type":"group","title":"伟大建党精神与共产党人精神谱系","question":"建党精神的四组内容是什么？共产党人的精神谱系有什么意义？","answer":"① 伟大建党精神：坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民，是中国共产党的精神之源。\n② 精神谱系包括井冈山精神、长征精神、遵义会议精神、延安精神、西柏坡精神、红岩精神、抗美援朝精神、“两弹一星”精神、特区精神、抗洪精神、抗震救灾精神、抗疫精神、脱贫攻坚精神等。\n③ 这些精神由党领导人民在团结奋斗中共同创造，集中体现党的坚定信念、根本宗旨、优良作风。\n④ 它们凝聚成艰苦奋斗、牺牲奉献、开拓进取的伟大品格，深入党、国家、民族和人民的血脉，丰富中国精神的内涵，鼓舞人民攻坚克难、不断从胜利走向新的胜利。","notes":"","source":"苏一《27命题点高清图谱》印刷第125页（PDF第130页）；依原图整理","source_pages":[125],"source_pdf_pages":[130],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":509},{"id":"suyi-ethics-p125-k04-g01","revision":1,"path":["思修","第三章 继承优良传统 弘扬中国精神","考点4 实现中国梦必须弘扬中国精神"],"type":"group","title":"爱国主义为核心的民族精神","question":"中国精神为何重要？爱国主义的内涵、地位和四项基本内容是什么？","answer":"① 中国精神是凝聚中国力量的精神纽带、激发创新创造的精神动力、推进复兴伟业的精神支柱。\n② 民族精神是在长期共同生活和社会实践中形成的，为多数成员认同的价值取向、思维方式、道德规范、精神气质的总和，是民族赖以生存发展的精神支柱。\n③ 爱国主义体现对祖国的深厚感情，揭示个人对祖国的依存关系，是归属感、认同感、尊严感和荣誉感的统一，是调节个人与祖国关系的道德要求、政治原则和法律规范；是中华民族的民族心、民族魂，是民族最重要的精神财富。\n④ 爱祖国的大好河山：是主权、财富、民族发展进步的基本载体。爱自己的骨肉同胞：是检验爱国程度的试金石。爱祖国的灿烂文化：文化是国家民族的灵魂和精神基因。爱自己的国家：国家是个体成长的基本屏障和坚实依托，个体与国家相互依存、密不可分。","notes":"","source":"苏一《27命题点高清图谱》印刷第125页（PDF第130页）；依原图整理","source_pages":[125],"source_pdf_pages":[130],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":510},{"id":"suyi-ethics-p125-k04-g02","revision":1,"path":["思修","第三章 继承优良传统 弘扬中国精神","考点4 实现中国梦必须弘扬中国精神"],"type":"group","title":"改革创新为核心的时代精神","question":"时代精神是什么？如何弘扬？它与民族精神是什么关系？","answer":"① 时代精神是在新的历史条件下形成发展的、体现民族特质并顺应时代潮流的思想观念、价值取向、精神风貌和社会风尚的总和，其核心是改革创新。\n② 树立突破陈规、大胆探索、敢于创造的思想观念；培养不甘落后、奋勇争先、追求进步的责任感和使命感；保持坚忍不拔、自强不息、锐意进取的精神状态。\n③ 民族精神与时代精神密切关联，都是中华民族赖以生存和发展的精神支撑，都是中国精神的重要组成部分。","notes":"","source":"苏一《27命题点高清图谱》印刷第125页（PDF第130页）；依原图整理","source_pages":[125],"source_pdf_pages":[130],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":511},{"id":"suyi-ethics-p126-k05-g01","revision":1,"path":["思修","第三章 继承优良传统 弘扬中国精神","考点5 做新时代的忠诚爱国者"],"type":"group","title":"爱国、爱党、爱社会主义相统一","question":"当代中国爱国主义的本质是什么？三者统一为什么是历史发展的必然结果？","answer":"① 当代中国爱国主义的本质：坚持爱国和爱党、爱社会主义高度统一。\n② 这种统一是中国历史发展的必然结果。现阶段，爱国主义主要表现为在党的领导下，献身于新时代中国特色社会主义伟大事业，献身于实现中华民族伟大复兴的中国梦，献身于促进祖国统一大业。\n③ 爱国主义是历史的、具体的、现实的，不同历史条件下有不同内涵和特点。爱国、爱党、爱社会主义统一于实现中华民族伟大复兴的历史进程。\n④ 新时代爱国主义的鲜明主题、爱国主义教育的主题，是实现中华民族伟大复兴的中国梦。","notes":"","source":"苏一《27命题点高清图谱》印刷第126页（PDF第131页）；依原图整理","source_pages":[126],"source_pdf_pages":[131],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":512},{"id":"suyi-ethics-p126-k05-g02","revision":1,"path":["思修","第三章 继承优良传统 弘扬中国精神","考点5 做新时代的忠诚爱国者"],"type":"group","title":"祖国统一、民族团结与历史文化","question":"怎样维护祖国统一和民族团结、尊重和传承中华民族历史文化？","answer":"① 保持香港、澳门长期繁荣稳定，解决台湾问题、实现祖国完全统一，是民族复兴的必然要求、不可阻挡的历史进程，也是全体中华儿女的共同心愿。\n② 处理好民族问题、促进民族团结，关系祖国统一和边疆巩固、民族团结和社会稳定、国家长治久安和民族繁荣昌盛。\n③ 历史文化是民族生生不息的丰厚滋养。中华优秀传统文化是中华民族的精神命脉，是得以延续的文化基因，是在世界文化激荡中站稳脚跟的根基。\n④ 旗帜鲜明反对历史虚无主义。抛弃传统、丢掉根本，就等于割断自己的精神命脉。对祖国悠久历史、深厚文化的理解热爱，是培育发展爱国主义情感的重要条件。","notes":"","source":"苏一《27命题点高清图谱》印刷第126页（PDF第131页）；依原图整理","source_pages":[126],"source_pdf_pages":[131],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":513},{"id":"suyi-ethics-p126-k05-g03","revision":1,"path":["思修","第三章 继承优良传统 弘扬中国精神","考点5 做新时代的忠诚爱国者"],"type":"group","title":"立足中国、面向世界","question":"忠诚爱国者如何维护国家主体性和安全，并参与构建人类命运共同体？","answer":"① 维护国家发展主体性。当今世界，国家仍是民族存在的最高组织形式，是国际社会活动的独立主体。\n② 自觉维护国家安全。国家安全是民族复兴的根基，社会稳定是国家强盛的前提。\n③ 推动构建人类命运共同体。共建持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界，是全人类的共同利益和价值追求。\n④ 始终做世界和平的建设者、全球发展的贡献者、国际秩序的维护者。","notes":"","source":"苏一《27命题点高清图谱》印刷第126页（PDF第131页）；依原图整理","source_pages":[126],"source_pdf_pages":[131],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":514},{"id":"suyi-ethics-p126-k06-g01","revision":1,"path":["思修","第三章 继承优良传统 弘扬中国精神","考点6 让改革创新成为青春远航的动力"],"type":"group","title":"改革创新的时代要求与青年行动","question":"改革、创新各有什么地位？青年怎样树立意识、增强本领？","answer":"① 改革开放是当代中国最鲜明的特色；创新是改革开放的生命。\n② 创新是推动人类社会发展的重要力量，创新能力是国际竞争新优势的集中体现；改革创新是赢得未来的必然要求，是当代中国最突出、最鲜明的特点。\n③ 创新驱动发展：最根本是增强自主创新能力，最紧迫是破除体制机制障碍，最大限度解放和激发科技作为第一生产力蕴含的巨大潜能。\n④ 树立改革创新的自觉意识：增强责任感，敢于突破陈规，大胆探索未知领域。\n⑤ 增强改革创新的能力本领：夯实创新基础，培养创新思维，投身改革创新实践。","notes":"","source":"苏一《27命题点高清图谱》印刷第126页（PDF第131页）；依原图整理","source_pages":[126],"source_pdf_pages":[131],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":515},{"id":"suyi-ethics-p127-k01-g01","revision":1,"path":["思修","第四章 明确价值要求 践行价值准则","考点1 价值观、核心价值观与社会主义核心价值观"],"type":"group","title":"价值观与核心价值观","question":"价值观的内涵和特点是什么？核心价值观有什么地位？","answer":"① 价值观是主体对客体有无价值、价值大小的立场和态度，是对价值及相关内容的基本观点和看法；对具体行为起规范和导向作用，不同价值观会带来不同的行为取向。\n② 价值观反映特定时代精神，体现鲜明民族特色，蕴含特定阶级立场。\n③ 核心价值观承载一个民族、国家的精神追求，体现社会评判是非曲直的价值标准；是一定社会形态、社会性质的集中体现，在社会思想观念体系中处于主导地位，体现制度的阶级属性、社会运行的基本原则和发展的基本方向。\n④ 核心价值观是一个国家的重要稳定器。党的十八大提出积极培育和践行社会主义核心价值观。","notes":"","source":"苏一《27命题点高清图谱》印刷第127页（PDF第132页）；依原图整理","source_pages":[127],"source_pdf_pages":[132],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":516},{"id":"suyi-ethics-p127-k02-g01","revision":1,"path":["思修","第四章 明确价值要求 践行价值准则","考点2 社会主义核心价值观和社会主义核心价值体系"],"type":"group","title":"核心价值观的三个层面与十二个词","question":"三个层面各回答什么问题？十二个价值词分别有什么内涵？","answer":"① 国家层面回答“建设什么样的国家”：富强、民主、文明、和谐。\n富强是社会进步和人的自由全面发展的物质基础，体现社会主义解放发展生产力的根本要求；民主是人民当家作主；文明是社会进步的重要标志、现代化国家的重要特征；和谐是中华文明的核心价值理念。\n② 社会层面回答“建设什么样的社会”：自由、平等、公正、法治。\n自由是社会活力之源；平等强调现实存在的平等而不只是形式上的平均；公正是社会进步的标尺、社会主义制度的本质要求；法治是政治文明的重要成果、现代社会的主要特征。\n③ 公民层面回答“培育什么样的公民”：爱国、敬业、诚信、友善。\n爱国是最深沉、最持久的情感和基本价值准则；敬业是对劳动与人生持有的根本价值态度；诚信是立身处世的基本道德规范和社会发展的重要价值基石；友善是处理人际与社会关系的基本价值准则。\n④ 三个层面的要求融为一体，体现社会主义本质要求，继承中华优秀传统文化，吸收世界文明有益成果，体现时代精神。","notes":"","source":"苏一《27命题点高清图谱》印刷第127页（PDF第132页）；依原图整理","source_pages":[127],"source_pdf_pages":[132],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":517},{"id":"suyi-ethics-p127-k02-g02","revision":1,"path":["思修","第四章 明确价值要求 践行价值准则","考点2 社会主义核心价值观和社会主义核心价值体系"],"type":"group","title":"核心价值体系及其与核心价值观的关系","question":"价值体系的四项内容是什么？核心价值观为何是它的精神内核？","answer":"① 社会主义核心价值体系包括：马克思主义指导思想，中国特色社会主义共同理想，以爱国主义为核心的民族精神和以改革创新为核心的时代精神，社会主义荣辱观。\n② 核心价值观与核心价值体系紧密联系、互为依存、相辅相成。\n③ 核心价值观是价值体系的精神内核，体现其根本性质和基本特征，反映其丰富内涵和实践要求，是其高度凝练和集中表达。\n④ 二者具有内在一致性，都体现社会主义意识形态的本质要求、制度在思想和精神层面的质的规定性，是全面建设社会主义现代化强国、实现第二个百年奋斗目标的价值引领。","notes":"","source":"苏一《27命题点高清图谱》印刷第127页（PDF第132页）；依原图整理","source_pages":[127],"source_pdf_pages":[132],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":518},{"id":"suyi-ethics-p127-k03-g01","revision":1,"path":["思修","第四章 明确价值要求 践行价值准则","考点3 当代中国发展进步的精神指引"],"type":"group","title":"核心价值观的地位与培育践行的意义","question":"核心价值观为何是精神指引？培育践行有什么作用？","answer":"① 是坚持和发展中国特色社会主义的价值遵循。\n② 是提高国家文化软实力的迫切要求。文化软实力竞争，本质上是不同文化所代表的核心价值观竞争；从根本上说，国家软实力取决于核心价值观的生命力、凝聚力和感召力。\n③ 是推进社会团结奋进的“最大公约数”。\n④ 培育和践行核心价值观，是整合社会意识、凝聚社会共识、防范化解社会矛盾、聚合磅礴力量的重大举措，是保证经济社会沿正确方向发展、实现民族复兴的价值支撑。","notes":"","source":"苏一《27命题点高清图谱》印刷第127页（PDF第132页）；依原图整理","source_pages":[127],"source_pdf_pages":[132],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":519},{"id":"suyi-ethics-p128-k04-g01","revision":1,"path":["思修","第四章 明确价值要求 践行价值准则","考点4 社会主义核心价值观的显著特征"],"type":"group","title":"先进性、人民性、真实性","question":"社会主义核心价值观的三项显著特征分别表现为什么？哪一项是根本特性？","answer":"① 先进性：反映人类社会发展进步的价值理念。体现社会主义本质属性；扎根中华优秀传统文化土壤；吸纳世界文明有益成果。它生成于中国特色社会主义建设实践，是中国社会生活的价值表达。\n② 人民性：彰显人民至上的价值立场，是根本特性。尊重人民群众的历史主体地位，体现以人民为中心的价值导向；为中国人民谋幸福、为中华民族谋复兴，是党的初心使命，也是领导现代化建设的出发点和落脚点。\n③ 真实性：因真实可信而具有强大的道义力量。这是社会主义价值观与以往价值观的重要区别；中国民主制度不是装饰品，而是用来解决人民需要解决的问题。\n④ 对西方所谓“普世价值”，应看清它把特定的资本主义价值观及其背后的经济政治制度包装成普遍价值，具有迷惑性、欺骗性与政治倾向。","notes":"","source":"苏一《27命题点高清图谱》印刷第128页（PDF第133页）；依原图整理","source_pages":[128],"source_pdf_pages":[133],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":520},{"id":"suyi-ethics-p128-k05-g01","revision":1,"path":["思修","第四章 明确价值要求 践行价值准则","考点5 积极践行社会主义核心价值观"],"type":"group","title":"扣好人生扣子，把价值观落细落小落实","question":"为什么要从青年时期和早期抓起？具体怎样践行？","answer":"① 青年价值取向决定未来整个社会的价值取向，青年又处在价值观形成确立的时期，所以应从一开始扣好人生的扣子，对青少年教育抓早抓小。\n② 大学生成长成才与全面发展离不开正确价值观引领；核心价值观的养成不是一日之功。\n③ 勤学：下得苦功夫，求得真学问。修德：加强道德修养，注重道德实践。明辨：善于明辨是非，善于决断选择。笃实：扎扎实实干事，踏踏实实做人。","notes":"","source":"苏一《27命题点高清图谱》印刷第128页（PDF第133页）；依原图整理","source_pages":[128],"source_pdf_pages":[133],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":521},{"id":"suyi-ethics-p128-k01-g01","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点1 坚持马克思主义道德观"],"type":"group","title":"道德的含义与起源","question":"道德怎样发挥作用？劳动、社会关系、自我意识在道德起源中各是什么条件？","answer":"① 道德是特殊的社会意识形态，以善恶为评价方式，主要依靠社会舆论、传统习俗和内心信念发挥作用，是行为规范的总和。\n② 首要前提：劳动。劳动创造人和人类社会，是道德起源的第一个历史前提。\n③ 客观条件：社会关系是道德赖以产生的客观条件。\n④ 主观条件：人的自我意识是道德产生的主观条件，意识是道德产生的思想认识前提。","notes":"","source":"苏一《27命题点高清图谱》印刷第128页（PDF第133页）；依原图整理","source_pages":[128],"source_pdf_pages":[133],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":522},{"id":"suyi-ethics-p128-k01-g02","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点1 坚持马克思主义道德观"],"type":"group","title":"道德的本质","question":"如何从经济关系、利益调节、实践精神理解道德的本质？","answer":"① 道德反映社会经济关系。其产生、发展和变化归根结底根源于社会经济关系；性质和基本原则规范反映相应经济关系的性质内容，并随其变化而变化。\n道德作为社会意识具有阶级性，也具有一定的共同性和普遍性；道德一经产生便具有相对独立性，表现为历史继承性和对社会发展的能动反作用。\n② 道德是社会利益关系的特殊调节方式。不同于法律规范和政治规范，它依靠善恶评价、社会舆论、传统习俗和内心信念维持，是非强制性规范；通过对社会整体及个人的道德要求来调节利益关系。\n③ 道德是一种实践精神，本质上是知行合一的。道德立足现实追求理想，又以理想改善和提升现实。","notes":"","source":"苏一《27命题点高清图谱》印刷第128页（PDF第133页）；依原图整理","source_pages":[128],"source_pdf_pages":[133],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":523},{"id":"suyi-ethics-p128-k01-g03","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点1 坚持马克思主义道德观"],"type":"group","title":"道德的功能与作用","question":"道德的三种基本功能是什么？道德评价和舆论信念分别起什么作用？","answer":"① 认识功能：反映社会关系，特别是反映社会经济关系的功效与能力。\n② 规范功能：在正确善恶观引导下，规范公共、职业、家庭等领域的行为，规范个人品德养成，引导提升思想道德境界。\n③ 调节功能：通过评价等方式指导纠正行为和实践活动，协调社会关系与人际关系。道德评价是主要形式，社会舆论、传统习俗、内心信念是发挥调节作用的力量。\n④ 道德是维护社会稳定、促进国家发展的重要因素，对巩固特定经济基础与上层建筑具有不可替代的重要作用；也是提升精神境界、促进自我完善与全面发展的内在动力。\n⑤ 反对“道德万能论”与“道德无用论”。道德作用的性质与它反映的经济基础、代表的阶级利益相关；反映先进生产力要求和进步阶级利益的道德，才能积极推动社会和人的发展。","notes":"","source":"苏一《27命题点高清图谱》印刷第128页（PDF第133页）；依原图整理","source_pages":[128],"source_pdf_pages":[133],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":524},{"id":"suyi-ethics-p128-k01-g04","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点1 坚持马克思主义道德观"],"type":"group","title":"道德发展的规律与社会主义道德的先进性","question":"道德发展的历史趋势是什么？社会主义道德怎样实现创新发展？","answer":"① 道德有其发生发展过程。历史进程与社会生产方式的发展进程大体一致。\n② 道德发展虽可能出现停滞或倒退，总趋势仍是向上、前进的，是沿曲折道路向前发展，表现为螺旋式上升、波浪式前进。\n③ 社会主义道德是社会主义经济基础的反映，是对人类优秀道德资源的批判继承和创新发展。\n④ 它克服以往阶级社会道德的片面性和局限性，坚持以为人民服务为核心、以集体主义为原则，展现真实而强大的道义力量。","notes":"","source":"苏一《27命题点高清图谱》印刷第128页（PDF第133页）；依原图整理","source_pages":[128],"source_pdf_pages":[133],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":525},{"id":"suyi-ethics-p129-k02-g01","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点2 坚持以为人民服务为核心"],"type":"group","title":"为人民服务作为社会主义道德的核心","question":"道德的核心问题是什么？为什么为人民服务能够成为核心？","answer":"① 道德的核心问题：为什么人服务。\n② 为人民服务不仅是历史唯物主义的必然要求，也是党的根本宗旨、社会主义道德的集中体现、全体中国人民共同遵循的道德要求。\n③ 为人民服务是社会主义道德的本质要求，也是先进性要求与广泛性要求的统一。\n④ 以为人民服务为核心，是社会主义道德区别和优越于其他社会形态道德的显著标志。","notes":"","source":"苏一《27命题点高清图谱》印刷第129页（PDF第134页）；依原图整理","source_pages":[129],"source_pdf_pages":[134],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":526},{"id":"suyi-ethics-p129-k03-g01","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点3 坚持以集体主义为原则"],"type":"group","title":"集体主义的原则与利益关系","question":"集体主义怎样处理三类利益？是否要求在任何情况下无条件牺牲个人利益？","answer":"① 道德原则是道德规范体系的总纲，直接集中反映一定社会经济关系和利益关系的根本要求，代表一定阶段的根本与长远利益。\n② 在我国，国家利益、社会整体利益和个人利益根本一致；长期以来，集体主义已成为调节三者关系的基本原则。\n③ 集体主义强调三者的辩证统一；强调国家利益、社会整体利益高于个人利益；重视和保障个人的正当利益。\n④ 集体主义并不否定个人利益。只有个人利益与集体利益发生不能两全的矛盾时，才要求以国家利益、社会整体利益为重，必要时作出牺牲。","notes":"","source":"苏一《27命题点高清图谱》印刷第129页（PDF第134页）；依原图整理","source_pages":[129],"source_pdf_pages":[134],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":527},{"id":"suyi-ethics-p129-k03-g02","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点3 坚持以集体主义为原则"],"type":"group","title":"集体主义的三个道德层次","question":"无私奉献、先公后私、顾全大局三个层次分别面向谁？","answer":"① 无私奉献、一心为公：最高层次，是优秀共产党员、先进分子应努力达到的道德目标。\n② 先公后私、先人后己：已经具有较高社会主义道德觉悟的人应达到的要求，具有广泛的社会基础。\n③ 顾全大局、遵纪守法、热爱祖国、诚实劳动，以正当合法手段谋取个人利益：对公民最基本的道德要求。","notes":"","source":"苏一《27命题点高清图谱》印刷第129页（PDF第134页）；依原图整理","source_pages":[129],"source_pdf_pages":[134],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":528},{"id":"suyi-ethics-p129-k04-g01","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点4 传承中华传统美德"],"type":"group","title":"中华传统美德的五项基本精神","question":"传统美德的五项基本精神是什么？如何识别对应古语？","answer":"① 重视整体利益，强调责任奉献。义利之辨的核心本质是公私之辨，公义胜私欲是根本要求。如“夙夜在公”“先义后利”“见义勇为”。\n② 推崇仁爱原则，注重以和为贵。仁爱与和谐是中华民族的优良传统与高尚品德，如“己欲立而立人，己欲达而达人”“仁者爱人”。\n③ 注重人伦关系，重视道德义务。重视每个人在人伦关系中的地位价值，如父子有亲、君臣有义、夫妇有别、长幼有序、朋友有信；以及仁义礼智信、忠孝节义等。\n④ 追求精神境界，向往理想人格。在物质生活基本满足的情况下追求崇高精神境界，把道德理想实现视为高层次需要，如“明于庶物，察于人伦”“先天下之忧而忧”。\n⑤ 强调道德修养，注重道德践履。最重要的是把社会道德原则规范转化为自身思想品德与行为实践，如修身、修己、克己、慎独，以及“见贤思齐，见不贤而内自省”。","notes":"","source":"苏一《27命题点高清图谱》印刷第129页（PDF第134页）；依原图整理","source_pages":[129],"source_pdf_pages":[134],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":529},{"id":"suyi-ethics-p129-k04-g02","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点4 传承中华传统美德"],"type":"group","title":"传统美德的意义及“两创”","question":"为什么要传承传统美德？怎样创造性转化、创新性发展？","answer":"① 中华传统美德是人类文明发展的重要精神财富，是社会主义道德建设的源头活水。\n② 挖掘其中具有当代价值的道德精神；结合现代生活赋予新的时代内涵；用传统美德滋养社会主义道德建设。\n③ 反对“复古论”和“虚无论”。不能把恢复古代道德当成建设的最终目标，也不能全盘否定传统文化和传统美德。","notes":"","source":"苏一《27命题点高清图谱》印刷第129页（PDF第134页）；依原图整理","source_pages":[129],"source_pdf_pages":[134],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":530},{"id":"suyi-ethics-p129-k05-g01","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点5 发扬中国革命道德"],"type":"group","title":"中国革命道德的内涵、内容与价值","question":"革命道德是什么？五项主要内容和四方面当代价值是什么？","answer":"① 内涵：党、人民军队、先进分子和人民群众在革命、建设、改革中形成的优秀道德，是马克思主义同中国革命建设改革实践相结合的产物，是民族极其宝贵的道德财富。\n② 主要内容：为社会主义和共产主义理想而奋斗；全心全意为人民服务；始终把革命利益放在首位；树立社会新风、建立新型人际关系；修身自律、保持节操。\n③ 坚持社会主义和共产主义理想信念是革命道德的灵魂；全心全意为人民服务是贯穿革命道德始终的红线。\n④ 当代价值：有利于加强巩固社会主义和共产主义理想信念，有利于培育践行核心价值观，有利于树立正确道德观，有利于培育良好社会道德风尚。\n⑤ 革命道德是传统美德的延续和发展，是社会主义道德的红色基因。","notes":"","source":"苏一《27命题点高清图谱》印刷第129页（PDF第134页）；依原图整理","source_pages":[129],"source_pdf_pages":[134],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":531},{"id":"suyi-ethics-p129-k06-g01","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点6 借鉴人类文明优秀道德成果"],"type":"group","title":"借鉴人类优秀道德成果","question":"民族道德进步怎样处理坚持传统与对外借鉴的关系？","answer":"① 一个国家或民族的道德进步，既要在文明交流中坚守自身优秀道德传统，也要在文明互鉴中积极吸收其他有益道德成果。\n② 借鉴和吸收其他国家民族的优秀道德成果，必须秉承正确态度和科学方法，坚持以我为主、为我所用，不能照抄照搬或全盘否定自身传统。","notes":"","source":"苏一《27命题点高清图谱》印刷第129页（PDF第134页）；依原图整理","source_pages":[129],"source_pdf_pages":[134],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":532},{"id":"suyi-ethics-p130-k07-g01","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点7 遵守社会公德"],"type":"group","title":"公共生活、社会公德与网络道德","question":"公共生活有哪些特征？社会公德五项内容和网络生活三项要求是什么？","answer":"① 公共生活具有活动范围的广泛性、活动内容的开放性、交往对象的复杂性、活动方式的多样性。有序公共生活是社会生产活动的重要基础、提高生活质量的基本保障和社会文明的重要标志。\n② 社会公德是在社会交往和公共生活中应遵守的行为准则，是维护公共利益、公共秩序和社会和谐稳定的起码道德要求，涵盖人与人、人与社会、人与自然的关系。\n③ 五项内容：文明礼貌，是调整和规范人际关系的行为准则；助人为乐，关心关爱他人并在助人中实现价值；爱护公物，是公民的责任义务和社会文明水平的重要标志；保护环境，尊重、顺应、保护自然；遵纪守法，是全体公民必须遵循的基本行为准则、维护公共生活秩序的重要条件，也是社会公德最基本的要求。\n④ 网络道德：正确使用网络工具，加强网络文明自律，营造良好网络道德环境。","notes":"","source":"苏一《27命题点高清图谱》印刷第130页（PDF第135页）；依原图整理","source_pages":[130],"source_pdf_pages":[135],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":533},{"id":"suyi-ethics-p130-k08-g01","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点8 恪守职业道德"],"type":"group","title":"职业道德与择业创业","question":"职业道德五项要求是什么？怎样树立正确择业观与创业观？","answer":"① 爱岗敬业：热爱工作岗位，对工作极端负责，敬重所从事职业。\n② 诚实守信：是中华民族传统美德、公民道德建设的重点、核心价值观的重要准则；在职业活动中诚实劳动、合法经营、信守承诺、讲求信誉。\n③ 办事公道：公平公正、不损公肥私、不以权谋私、不假公济私。\n④ 热情服务：无论做什么工作、能力如何，都应在本职岗位以适当方式为群众服务。\n⑤ 奉献社会：是社会主义职业道德中最高层次的要求，体现职业道德的最高目标指向。\n⑥ 择业创业：树立崇高职业理想，服从社会发展需要，做好充分择业准备，培养创业勇气和能力。","notes":"","source":"苏一《27命题点高清图谱》印刷第130页（PDF第135页）；依原图整理","source_pages":[130],"source_pdf_pages":[135],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":534},{"id":"suyi-ethics-p130-k09-g01","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点9 弘扬家庭美德"],"type":"group","title":"家庭、家教、家风与家庭美德","question":"家庭与婚姻怎样联系？家庭美德的五项内容是什么？","answer":"① 注重家庭：把家庭前途命运同国家民族前途命运紧密相连。注重家教：最重要的是品德教育、做人的教育。注重家风：家风是社会风气的重要组成部分。\n② 恋爱是建立幸福婚姻家庭的前奏；婚姻是家庭产生的重要前提，家庭是缔结婚姻的必然结果。\n③ 尊老爱幼：既是道德准则，也是社会责任和法律义务。男女平等：体现为夫妻权利义务与人格地位平等，以及平等对待子女。夫妻和睦：夫妻关系是家庭关系的核心。勤俭持家：既是家庭兴旺也是社会富足的保证。邻里互助：重要的是相互尊重，尊重人格、民族习惯、生活方式和兴趣爱好等。\n④ 恋爱中不能误把友谊当爱情，不能错置爱情地位，不能片面或功利化对待恋爱；正确处理恋爱与学习、恋爱与关心集体、恋爱与关爱他人和社会的关系。","notes":"","source":"苏一《27命题点高清图谱》印刷第130页（PDF第135页）；依原图整理","source_pages":[130],"source_pdf_pages":[135],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":535},{"id":"suyi-ethics-p130-k10-g01","revision":1,"path":["思修","第五章 遵守道德规范 锤炼道德品格","考点10 锤炼个人品德"],"type":"group","title":"个人品德与道德修养的五种方法","question":"个人品德的含义是什么？学思并重、省察克治、慎独自律、知行合一、积善成德分别怎么做？","answer":"① 个人品德是通过社会道德教育与自觉修养形成的稳定心理状态和行为习惯，是对某种道德要求认同践履的结果，体现道德认知、情感、意志、行为的内在统一。主要内容有爱国奉献、明礼崇德、勤劳善良、宽厚正直、自强自律等。\n② 锤炼品德应形成正确道德认知判断，激发正向道德认同情感，强化坚定道德意志信念。\n③ 学思并重：虚心学习、积极思索、辨别善恶、学善戒恶，以涵养德行。省察克治：反省检验思想行为的不良倾向，及时抑制克服。慎独自律：在“隐”和“微”处下功夫，管理自省内心隐蔽的意识情绪。知行合一：把提高道德认识与躬行道德实践统一起来。积善成德：积累善行美德，巩固强化，凝结成优良品质。\n④ 向道德模范学习，参加志愿服务。志愿服务是培育弘扬核心价值观的重要载体，志愿精神是奉献、友爱、互助、进步，精髓是奉献精神。\n⑤ 积极引领知荣辱、讲正气、作奉献、促和谐的社会风尚。","notes":"","source":"苏一《27命题点高清图谱》印刷第130页（PDF第135页）；依原图整理","source_pages":[130],"source_pdf_pages":[135],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":536},{"id":"suyi-ethics-p131-k01-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点1 法律的含义及其历史发展"],"type":"group","title":"法律的含义与三个本质要素","question":"国家制定认可、国家强制力、物质生活条件、统治阶级意志分别怎样理解？","answer":"① 法律是由国家制定或认可并由国家强制力保证实施的，反映由特定社会物质生活条件所决定的统治阶级意志的规范体系。\n② 制定：国家机关在职权范围内依法创制、修改、废止规范性文件。认可：国家机关赋予社会规范法律效力，或赋予先前判例法律效力。\n③ 国家强制性体现为对合法行为的肯定保护、对违法行为的否定制裁，是法律区别于其他社会规范的重要特征。\n④ 社会物质生活条件包括物质资料生产方式、自然地理环境、人口等。生产方式的生产力和生产关系两方面对法律产生决定性影响；生产方式是决定法律本质、内容和发展方向的根本因素，生产力水平制约法律的发展程度。\n⑤ 法律体现统治阶级整体意志，不是内部个别人的意志，也不是个人意志简单相加；不是全部统治阶级意志，而是上升为国家意志的部分。","notes":"","source":"苏一《27命题点高清图谱》印刷第131页（PDF第136页）；依原图整理","source_pages":[131],"source_pdf_pages":[136],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":537},{"id":"suyi-ethics-p131-k01-g02","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点1 法律的含义及其历史发展"],"type":"group","title":"法律的历史发展","question":"法律是否从来就有、永远存在？四种历史类型是什么？","answer":"① 法律不是从来就有的，也不是永恒存在的，是人类社会发展到一定历史阶段的产物。\n② 四种历史类型依次是奴隶制法律、封建制法律、资本主义法律、社会主义法律。\n③ 法律发展受社会经济条件和生产方式制约，不能脱离社会历史条件理解法律的性质和变迁。","notes":"","source":"苏一《27命题点高清图谱》印刷第131页（PDF第136页）；依原图整理","source_pages":[131],"source_pdf_pages":[136],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":538},{"id":"suyi-ethics-p131-k02-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点2 我国社会主义法律的本质特征"],"type":"group","title":"社会主义法律的三项本质特征","question":"我国社会主义法律为什么体现党的主张与人民意志统一？另外两项特征是什么？","answer":"① 体现党的主张和人民意志的统一。社会主义法律维护人民根本利益，巩固党的领导地位；党领导人民制定实施宪法法律，党自身必须在宪法法律范围内活动，这体现党的领导力量和社会主义法律最本质特征。\n② 具有科学性和先进性。从本质上说，我国社会主义法律能够尊重和反映社会发展规律。\n③ 是中国特色社会主义建设的重要保障。法律的社会作用体现社会主义本质要求；经济、政治、文化、社会、生态建设都离不开法律的引领、规范和保障。","notes":"","source":"苏一《27命题点高清图谱》印刷第131页（PDF第136页）；依原图整理","source_pages":[131],"source_pdf_pages":[136],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":539},{"id":"suyi-ethics-p131-k03-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点3 我国社会主义法律的运行"],"type":"group","title":"立法、执法、司法、守法","question":"法律运行的四环节分别由谁实施？有哪些基本要求？","answer":"① 立法：有立法权的国家机关依法定权限程序制定规范性法律文件，是法律运行的起始性、关键性环节。坚持公正、公平、公开，坚持科学立法、民主立法、依法立法。程序包括法律案提出、审议、表决、公布。\n② 执法：广义为国家机关及公职人员依职权程序贯彻实施法律；狭义为行政机关及公职人员执行法律。原则是合法性、合理性、信赖保护、效率等；通常由国家行政机关及依法有执法权的下属机构实施。\n③ 司法：国家司法机关及公职人员依权限程序处理案件。法院独立行使审判权，检察院独立行使检察权；适用法律公正司法，保护合法权益、解决纠纷、惩治犯罪、维护秩序。基本要求为正确、合法、合理、及时，基本原则包括司法公正、法律面前平等、以事实为根据以法律为准绳、依法独立行使司法权等。\n④ 守法：国家机关、社会组织和公民个人依法行使职权或权利、履行职责或义务。是法律实施和实现的基本途径，主体是一切组织和个人；既包括依法享有行使权利，也包括依法承担履行义务。","notes":"","source":"苏一《27命题点高清图谱》印刷第131页（PDF第136页）；依原图整理","source_pages":[131],"source_pdf_pages":[136],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":540},{"id":"suyi-ethics-p131-k04-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点4 全面依法治国的根本遵循"],"type":"group","title":"习近平法治思想的形成与意义","question":"习近平法治思想何时正式提出？为什么是全面依法治国的根本遵循？","answer":"① 2020年11月，中央全面依法治国工作会议正式提出习近平法治思想，并确立其为全面依法治国的指导思想和根本遵循。\n② 立足新时代中国特色社会主义实践，系统创立发展了中国特色社会主义法治理论，实现马克思主义法治理论中国化时代化的新飞跃。\n③ 深刻回答新时代为什么实行全面依法治国、怎样实行全面依法治国等重大问题，是顺应民族复兴时代要求形成的重大理论创新成果，是习近平新时代中国特色社会主义思想的重要组成部分。\n④ 揭示社会主义法治的生命力和优越性，推动法治理论创新，擘画新时代全面依法治国宏伟蓝图，引领法治中国建设。","notes":"","source":"苏一《27命题点高清图谱》印刷第131页（PDF第136页）；依原图整理","source_pages":[131],"source_pdf_pages":[136],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":541},{"id":"suyi-ethics-p131-k04-g02","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点4 全面依法治国的根本遵循"],"type":"group","title":"习近平法治思想的十一个坚持","question":"十一个坚持依次包括什么？党的领导、法治体系、关键少数各有何定位？","answer":"① 坚持党对全面依法治国的领导：党的领导是根本保证。② 坚持以人民为中心。③ 坚持中国特色社会主义法治道路：是中国特色社会主义道路在法治领域的具体体现。\n④ 坚持依宪治国、依宪执政。⑤ 坚持在法治轨道上推进国家治理体系和治理能力现代化：法治是重要依托。⑥ 坚持建设中国特色社会主义法治体系：是全面依法治国的总抓手。\n⑦ 坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设。⑧ 坚持全面推进科学立法、严格执法、公正司法、全民守法：公平正义是法治的灵魂和生命。\n⑨ 坚持统筹推进国内法治和涉外法治。⑩ 坚持建设德才兼备的高素质法治工作队伍。⑪ 坚持抓住领导干部这个“关键少数”。","notes":"","source":"苏一《27命题点高清图谱》印刷第131页（PDF第136页）；依原图整理","source_pages":[131],"source_pdf_pages":[136],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":542},{"id":"suyi-ethics-p132-k05-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点5 坚持走中国特色社会主义法治道路"],"type":"group","title":"法治道路的核心要义与五项原则","question":"为什么要走中国特色社会主义法治道路？核心要义和五项原则是什么？","answer":"① 这是历史的必然结论，由我国社会主义国家性质决定，是立足基本国情的必然选择。它明确法治国家建设的性质和方向，是法治建设成就经验的集中体现。\n② 核心要义：坚持党的领导，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论。\n③ 五项原则：坚持中国共产党的领导；坚持人民主体地位；坚持法律面前人人平等；坚持依法治国和以德治国相结合；坚持从中国实际出发。\n④ 党的领导是社会主义法治最根本的保证，是社会主义法治之魂，是我国法治同西方资本主义国家法治最大的区别，具体体现为党领导立法、保证执法、支持司法、带头守法。\n⑤ 全面依法治国最广泛、最深厚的基础是人民，根本目的是依法保障人民权益。坚持从实际出发，要突出中国特色、实践特色、时代特色。","notes":"","source":"苏一《27命题点高清图谱》印刷第132页（PDF第137页）；依原图整理","source_pages":[132],"source_pdf_pages":[137],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":543},{"id":"suyi-ethics-p132-k05-g02","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点5 坚持走中国特色社会主义法治道路"],"type":"group","title":"法律面前平等与法德结合","question":"法律面前平等有什么意义和要求？法治与德治为什么不能相互替代？","answer":"① 平等是社会主义法律的基本属性、社会主义法治的基本要求。法律面前平等保障人民主体地位、反对法外特权、约束公权力、维护公平适用法律和法律权威。\n② 要求违法必究，对一切违反宪法法律的行为都必须追究；制裁一致、即无差别对待。\n③ 法治和德治是治国理政不可或缺的两种方式，只有共同发挥作用，才能使法律和道德相辅相成、相得益彰。\n④ 法治是基本方式，侧重法律制度和实施；德治是重要方式，侧重思想品格培育。二者有共同作用但方式和表现不同，不能相互替代。\n⑤ 强化道德对法治的支撑作用，重视法律对道德的教化作用；把道德要求贯彻到法治建设中，以法治承载道德理念；运用法治手段解决道德领域突出问题。","notes":"","source":"苏一《27命题点高清图谱》印刷第132页（PDF第137页）；依原图整理","source_pages":[132],"source_pdf_pages":[137],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":544},{"id":"suyi-ethics-p132-k06-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点6 建设法治中国"],"type":"group","title":"中国特色社会主义法治体系五个组成部分","question":"五个体系的完整名称、地位和作用分别是什么？","answer":"① 完备的法律规范体系：中国特色社会主义法治体系的前提，是法治国家、法治政府、法治社会的制度基础。\n② 高效的法治实施体系：建设中国特色社会主义法治体系的重点。\n③ 严密的法治监督体系：宪法法律有效实施的重要保障，是加强对权力运行制约监督的迫切要求。\n④ 有力的法治保障体系：全面依法治国的重要依托。\n⑤ 完善的党内法规体系：中国特色社会主义法治体系的本质要求和重要内容。","notes":"","source":"苏一《27命题点高清图谱》印刷第132页（PDF第137页）；依原图整理","source_pages":[132],"source_pdf_pages":[137],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":545},{"id":"suyi-ethics-p132-k06-g02","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点6 建设法治中国"],"type":"group","title":"三个共同推进、三个一体建设","question":"共同推进和一体建设分别是什么？国家、政府、社会的地位怎样区分？","answer":"① 坚持依法治国、依法执政、依法行政共同推进。三者是有机整体，关键在于党坚持依法执政、各级政府坚持依法行政。\n② 坚持法治国家、法治政府、法治社会一体建设。三者相辅相成。\n③ 法治国家是法治建设的目标，法治政府是建设法治国家的重点，法治社会是构筑法治国家的基础。\n④ 法治政府建设是推进全面依法治国的重点任务和主体工程，对法治国家、法治社会建设有示范带动作用。\n⑤ 法治社会建设是推进全面依法治国的基础工程。","notes":"","source":"苏一《27命题点高清图谱》印刷第132页（PDF第137页）；依原图整理","source_pages":[132],"source_pdf_pages":[137],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":546},{"id":"suyi-ethics-p132-k06-g03","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点6 建设法治中国"],"type":"group","title":"科学立法、严格执法、公正司法、全民守法","question":"四个法治环节分别是什么地位？龙头、生命力、生命线和最后一道防线怎样对应？","answer":"① 科学立法：全面依法治国的前提。法律是治国之重器，立法是法治的龙头环节。\n② 严格执法：全面依法治国的关键。法律的生命力在于实施，法律的权威也在于实施。\n③ 公正司法：全面依法治国的重点。公正是法治的生命线，是司法活动最高的价值追求；公正司法是维护社会公平正义的最后一道防线。\n④ 全民守法：全面依法治国的基础。法律的权威源自人民的内心拥护和真诚信仰。","notes":"助记：立前、执关、司重、守基。","source":"苏一《27命题点高清图谱》印刷第132页（PDF第137页）；依原图整理","source_pages":[132],"source_pdf_pages":[137],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":547},{"id":"suyi-ethics-p132-k07-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点7 我国宪法的地位和基本原则"],"type":"group","title":"宪法的地位与五个基本原则","question":"宪法为何是根本法？五个基本原则是什么？","answer":"① 宪法是国家的根本法，是党和人民意志的集中体现，是国家各项制度和法律法规的总依据，在中国特色社会主义法律体系中居于核心地位。\n② 宪法具有最高法律地位、法律权威、法律效力，具有根本性、全局性、稳定性、长期性。\n③ 宪法规定国家根本制度，包括党的领导地位、国体、政体、基本政治制度和基本经济制度等。\n④ 宪法是实现国家认同、凝聚社会共识、促进个人发展的基本准则，是维系国家民族凝聚力的根本纽带。1954年宪法是中华人民共和国第一部宪法。\n⑤ 五个基本原则：党的领导原则，人民当家作主原则（人民主权原则），尊重和保障人权原则，社会主义法治原则，民主集中制原则。","notes":"","source":"苏一《27命题点高清图谱》印刷第132页（PDF第137页）；依原图整理","source_pages":[132],"source_pdf_pages":[137],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":548},{"id":"suyi-ethics-p133-k08-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点8 加强宪法实施和监督"],"type":"group","title":"宪法实施与监督","question":"如何加强宪法实施？宪法监督要健全哪些机制？","answer":"① 坚持依宪执政：宪法是党长期执政的根本法律依据，党带头尊崇维护宪法。\n② 坚持依法立法：国家权力机关加强改进立法，完善以宪法为核心的法律体系，使宪法确立的制度、原则和规则得到全面实施。\n③ 坚持严格执法：行政机关坚持依宪施政、依法行政，严格规范执法；监察机关在党的领导下以宪法为根本准则履行法定职责；司法机关深化司法体制综合配套改革、落实责任制、提高司法公信力。\n④ 完善宪法监督：健全人大工作机制、宪法解释机制、备案审查机制、合宪性审查制度，落实新的更高要求。","notes":"","source":"苏一《27命题点高清图谱》印刷第133页（PDF第138页）；依原图整理","source_pages":[133],"source_pdf_pages":[138],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":549},{"id":"suyi-ethics-p133-k09-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点9 培养社会主义法治思维"],"type":"group","title":"法治思维的内涵与四种属性","question":"法治思维以什么为导向？正当性、规范性、逻辑性、科学性如何体现？","answer":"① 法治思维是以法治价值和法治精神为导向，运用法律原则、规则、方法思考和处理问题的思维模式。\n② 正当性：以公正、平等、民主、人权等法治理念为价值导向。\n③ 规范性：以法律原则和规则为依据，指导社会行为。\n④ 逻辑性：以法律手段和方法分析问题、处理问题、解决纠纷。\n⑤ 科学性：符合规律、尊重事实。法治思维融法律价值属性与工具理性于一体。\n⑥ 基本内容包括法律至上、权力制约、公平正义、权利保障、程序正当。","notes":"","source":"苏一《27命题点高清图谱》印刷第133页（PDF第138页）；依原图整理","source_pages":[133],"source_pdf_pages":[138],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":550},{"id":"suyi-ethics-p133-k09-g02","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点9 培养社会主义法治思维"],"type":"group","title":"法律至上与权力制约","question":"法律至上的三种表现、权力制约的四项要求是什么？","answer":"① 法律至上：在国家社会的一切规范中，法律地位最高、效力最广、强制力最大。\n普遍适用性：对主权范围内所有人员具有普遍约束力。优先适用性：同一社会关系受到多种相互矛盾的规范调整时，优先考虑法律规范。不可违抗性：法律必须遵守，违法必须追究，不因权力地位而例外。\n② 权力制约：国家机关权力必须受法律规范和约束。\n权力由法定：法无授权不可为，职权须由法律明确授予。有权必有责：取得权力同时承担职责责任。用权受监督：权力运行行使受各种形式监督。违法受追究：国家工作人员违法行使权力应受到追究和制裁。","notes":"","source":"苏一《27命题点高清图谱》印刷第133页（PDF第138页）；依原图整理","source_pages":[133],"source_pdf_pages":[138],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":551},{"id":"suyi-ethics-p133-k09-g03","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点9 培养社会主义法治思维"],"type":"group","title":"公平正义的四个方面","question":"权利公平、机会公平、规则公平、救济公平分别包括什么？","answer":"① 公平正义指政治、经济和其他利益在全体社会成员之间合理、公平分配和占有。\n② 权利公平：权利主体平等，国家对各主体一视同仁；享有的基本权利平等；权利保护和权利救济平等。\n③ 机会公平：社会成员有相同发展机会和前景，反对特权歧视。包括创造平等起点、尊重发展进步权、不断拓展发展领域；既关注当代人的机会，也考虑后代人的机会。\n④ 规则公平：对所有人适用同一规则和标准，不因人而异；法律规则、内容、保护面前人人平等；任何人无法律之外特权，也不能被排除在法律保护之外。\n⑤ 救济公平：向权利受侵害或处于弱势地位的公民提供平等有效救济，包括司法救济、行政救济、社会救济公平。","notes":"","source":"苏一《27命题点高清图谱》印刷第133页（PDF第138页）；依原图整理","source_pages":[133],"source_pdf_pages":[138],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":552},{"id":"suyi-ethics-p133-k09-g04","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点9 培养社会主义法治思维"],"type":"group","title":"权利保障与程序正当","question":"四种权利保障分别处于什么地位？程序正当的五项表现是什么？","answer":"① 权利保障主要指对公民权利的法律保障。宪法保障是前提和基础；立法保障是重要条件；行政保障是关键环节；司法保障是最后防线。\n② 程序合法性：运行符合法律规定，机关个人不得违反。\n③ 中立性：设计运行平等对待双方当事人，不偏袒一方。\n④ 参与性：案件纠纷的利害关系人有机会进入程序，表达诉求和意见。\n⑤ 公开性：过程和结果向当事人及社会公开，接受监督，防止办案不公与暗箱操作。\n⑥ 时限性：有合理期限，符合时间成本和效率要求，不得无限拖延、久拖不结。","notes":"","source":"苏一《27命题点高清图谱》印刷第133页（PDF第138页）；依原图整理","source_pages":[133],"source_pdf_pages":[138],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":553},{"id":"suyi-ethics-p134-k10-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点10 依法行使法律权利与履行法律义务"],"type":"group","title":"法律权利及马克思主义权利观","question":"马克思主义权利观与其他权利观的根本区别是什么？法律权利区别于其他权利的根本所在又是什么？","answer":"① 法律权利是由一定社会物质生活条件制约的行为自由，是法律允许权利人为满足自身利益而采取、由他人法律义务保证的法律手段。\n② 马克思主义权利观与其他权利观的根本区别：强调社会物质生活条件对权利的制约和决定作用。\n③ 法律权利的内容、种类和实现程度受社会物质生活条件制约；其内容、分配和实现方式因社会制度和国家法律不同而有差异。\n④ 法律权利不仅由法律规定或认可，也受法律维护保障，具有不可侵犯性。由国家强制力保障实现，是法律权利区别于其他权利的根本所在。\n⑤ 法律权利必须依法行使，不能不择手段地行使。","notes":"腿姐背诵技巧：老马找物质，法律找国家。","source":"苏一《27命题点高清图谱》印刷第134页（PDF第139页）；依原图整理","source_pages":[134],"source_pdf_pages":[139],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":554},{"id":"suyi-ethics-p134-k10-g02","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点10 依法行使法律权利与履行法律义务"],"type":"group","title":"法律义务及权利义务关系","question":"法律义务有哪些形式和特点？权利与义务的不可分割、相互依存、相互贯通如何理解？","answer":"① 法律义务是一定社会物质生活条件制约的社会责任，是法律规定义务人按权利人要求作出一定行为或不作出一定行为，以满足权利人利益的法律手段。\n② 作为：应实施积极行为，例如依法缴纳税费。不得作为：不得实施某些行为，例如未经许可不得公开他人隐私。\n③ 法律义务具有历史性，源于现实需要，必须依法设定，并可能发生变化。\n④ 权利义务不可分割、相互依存。权利实现必须以相应义务履行为条件，义务设定和履行以权利行使为依据；离开权利，义务失去履行价值动力；离开义务，权利形同虚设。\n⑤ 有些权利义务具有复合性，同一行为可以同时是权利行为和义务行为。在二者相一致时，行使权利和履行义务都有利于自身。\n⑥ 既不存在无义务的权利，也不存在无权利的义务，但不能由此推成每个人权利义务数量必须相等。","notes":"","source":"苏一《27命题点高清图谱》印刷第134页（PDF第139页）；依原图整理","source_pages":[134],"source_pdf_pages":[139],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":555},{"id":"suyi-ethics-p134-k10-g03","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点10 依法行使法律权利与履行法律义务"],"type":"group","title":"政治权利与宗教信仰自由","question":"政治权利包括哪些内容？宗教信仰自由包含哪些相对应的自由？","answer":"① 政治权利是公民参与国家政治活动的权利和自由，其行使主要表现为参与国家与社会组织管理。包括选举权（选举与被选举）、表达权、民主管理权、监督权。\n② 公民政治权利是实现人民主权原则和具体民主制度不可或缺的前提条件，也体现这些原则制度的必然要求。\n③ 宗教信仰自由是公民依内心信念、自愿信仰宗教的自由，包含信仰宗教、从事宗教活动、举行参加宗教仪式等自由。\n④ 既有信教自由，也有不信教自由；既有信这一宗教的自由，也有信另一宗教的自由；同一宗教中有信不同教派的自由；既可过去信教现在不信，也可过去不信现在信。","notes":"","source":"苏一《27命题点高清图谱》印刷第134页（PDF第139页）；依原图整理","source_pages":[134],"source_pdf_pages":[139],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":556},{"id":"suyi-ethics-p134-k10-g04","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点10 依法行使法律权利与履行法律义务"],"type":"group","title":"人身权利的五类内容","question":"人身权利包括哪五类？生命权、人格尊严、住宅安全和通信自由各是什么？","answer":"① 人身权利是公民人身不受非法侵犯的权利，是参加国家政治经济社会生活的基础、享有其他权利的重要内容。\n② 生命健康权：生命权是最基本、最原始的权利，有神圣性和不可转让性，依法应保护人的生命，是享有其他权利的前提；健康权保障身心健全和精神健康、不受任何伤害。\n③ 人身自由权：是人的一切行动与生活的前提条件，包括身体不受拘束、行为自由及不受非法限制剥夺。\n④ 人格尊严权：体现自尊心、自爱心，包含姓名、肖像、名誉、荣誉、隐私等权利。\n⑤ 住宅安全权：居住、生活和休息场所不受非法侵入或搜查。\n⑥ 通信自由权：通过书信、电话、传真、电报等按自己意愿通信，不受他人干涉。","notes":"","source":"苏一《27命题点高清图谱》印刷第134页（PDF第139页）；依原图整理","source_pages":[134],"source_pdf_pages":[139],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":557},{"id":"suyi-ethics-p134-k10-g05","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点10 依法行使法律权利与履行法律义务"],"type":"group","title":"财产、社会经济与文化教育权利","question":"后三类基本权利分别包括什么？劳动权与休息权的地位如何区分？","answer":"① 财产权利：公民、法人或其他组织通过劳动等合法方式取得财产并占有、使用、收益、处分的权利，主要包括私有财产权、继承权。它是公民在社会生活中获取自由与实现经济利益的必要途径。\n② 社会经济权利：公民要求国家干预社会经济生活、加强社会建设、提供社会服务，以促进自由幸福和健康有尊严生活的权利。包括劳动权、休息权、社会保障权、物质帮助权。\n③ 劳动权是公民赖以生存的基础，是行使其他权利的物质保障；休息权是劳动权存在和发展的基础。\n④ 文化教育权利：依法在文化教育领域享有的权利。教育方面主要是受教育权；文化活动方面包括科学研究、文学艺术创作及其他文化活动自由。","notes":"","source":"苏一《27命题点高清图谱》印刷第134页（PDF第139页）；依原图整理","source_pages":[134],"source_pdf_pages":[139],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":558},{"id":"suyi-ethics-p135-k10-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点10 依法行使法律权利与履行法律义务"],"type":"group","title":"依法行使法律权利的四项要求","question":"目的、限度、方式、程序各有什么要求？","answer":"① 目的正当：不仅形式合法，也应符合立法意图精神，不违反法律基本原则，保障正当目的；行权不得破坏公序良俗、妨碍法律社会功能和法律价值实现。\n② 必要限度：任何权利都不是绝对的，都有相应限度，必须依法律规定限度行使。\n③ 方式法定：可有口头、书面、行为等方式，部分场合可以兼用；也可分直接行使、间接行使，须符合法律规定。\n④ 程序正当：一人行权可能就是另一人履行义务的过程，程序正当原则也适用于权利行使过程。","notes":"","source":"苏一《27命题点高清图谱》印刷第135页（PDF第140页）；依原图整理","source_pages":[135],"source_pdf_pages":[140],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":559},{"id":"suyi-ethics-p135-k10-g02","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点10 依法行使法律权利与履行法律义务"],"type":"group","title":"依法履行义务及基本义务","question":"义务法定有什么含义？五类基本法律义务与三类违法责任是什么？","answer":"① 法律权利行使必须伴随义务履行，但法律义务更须由法律明确规定。\n② 义务法定：义务设定必须有法律依据，法定的义务应当履行，否则承担不利法律后果。\n③ 基本义务：维护国家统一和民族团结；遵守宪法和法律；维护祖国安全、荣誉和利益；依法服兵役；依法纳税。\n④ 维护国家统一是社会共同体存在发展的基础，也是公民实现权利自由的前提。\n⑤ 违反法定义务应承担相应法律责任，主要包括民事责任、行政责任、刑事责任。","notes":"","source":"苏一《27命题点高清图谱》印刷第135页（PDF第140页）；依原图整理","source_pages":[135],"source_pdf_pages":[140],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":560},{"id":"suyi-ethics-p135-k11-g01","revision":1,"path":["思修","第六章 学习法治思想 提升法治素养","考点11 不断提升法治素养"],"type":"group","title":"尊重法律权威与提升法治素养","question":"尊重法律权威有何意义和要求？提升法治素养应做好哪四方面？","answer":"① 法律权威源自人民的内心拥护和真诚信仰。人民权利靠法律保障，法律权威靠人民维护；尊重法律权威是法定义务和必备素质。基本要求是信仰法律、遵守法律、服从法律、维护法律。\n② 学习法律知识：掌握基本法律知识是提升法治素养的前提；参加法治实践是学习知识的有效途径，如立法讨论、旁听司法审判、校园法治文化活动。\n③ 养成守法习惯：任何组织个人都必须在宪法法律范围活动，依法行使权利职权、履行义务职责；增强规则意识、养成规则习惯；守住法律底线，违法什么都不能做。\n④ 提高用法能力：通过运用法律提高解决问题的能力，使法律内化于心、外化于行；维护自身权利、维护社会利益，做新时代守法人、护法人。\n⑤ 法律权威取决于法律在国家社会治理中的地位作用、法律本身的科学程度、实践中的实施程度、社会成员尊崇信仰的程度。","notes":"","source":"苏一《27命题点高清图谱》印刷第135页（PDF第140页）；依原图整理","source_pages":[135],"source_pdf_pages":[140],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":561}]};window.POLITICS_AUDIO_INDEX={"schema_version":1,"pack_id":"politics-suyi-full","generator":"piper-tts:zh_CN-chaowen-medium","speech_format":"title-answer-v1","items":{"suyi-marx-p017-n001-g01":{"file":"audio/suyi-marx-p017-n001-g01.mp3","text_sha256":"3a18e257dba9277e540f9de387d052a334618f8b96754ddc917dabc06d8bec5c","audio_sha256":"1c7baf6caa1c5227cf4eac93a9c92cb8c4fea4675b4cc8a259f2440881f07c95","size_bytes":1201580},"suyi-xi-p058-n017-g01":{"file":"audio/suyi-xi-p058-n017-g01.mp3","text_sha256":"67f921f94d83f3f24caf0c61ca874508ab93c3355de3aa9cba4d05ca134dee14","audio_sha256":"c34ceb8baf7e3bc3f4adca1904d3c131478d42c39c3309a45c5dfd7a9986bf88","size_bytes":838220},"suyi-marx-p007-n027-g04":{"file":"audio/suyi-marx-p007-n027-g04.mp3","text_sha256":"0ccace8c5a222a3c95201b3af842093ac8833c525dc6e0fd8fd9c0573ce0c2bf","audio_sha256":"717c7cfff3fc2fb1808e04ba12e18e7dd1cf2a685975f9d0e5d1a5e8231d928e","size_bytes":736364},"suyi-marx-p022-n023-g01":{"file":"audio/suyi-marx-p022-n023-g01.mp3","text_sha256":"1bce9f15a367704342a8e62b42416de1b1f1db184da1044c4ba52d03a18a5517","audio_sha256":"410eee15b8170060c6ee5fe28d92593b09c007f7f7306c16c454387db763e8a9","size_bytes":714764},"suyi-mao-p050-n034-g01":{"file":"audio/suyi-mao-p050-n034-g01.mp3","text_sha256":"6c5b7a7c4c611f522fd77c0552e25445f6d82f38fd94d6a7b5193e05d58b43d3","audio_sha256":"994b0f30aa42b53a3c294071061ca465d5b71342c9661daa5bfec0e1b0470cf2","size_bytes":669548},"suyi-xi-p073-n037-g02":{"file":"audio/suyi-xi-p073-n037-g02.mp3","text_sha256":"1c3d934ae87f464ac5b14f21a81dab4faac8fbde5098d4fd3b5cd4d9889c5898","audio_sha256":"d99e2535f4fffd9279a722a9df3ef4f08626f00d81254fca4ceb988582b832e8","size_bytes":644684},"suyi-mao-p048-n003-g01":{"file":"audio/suyi-mao-p048-n003-g01.mp3","text_sha256":"4af523a86af2a41e0f6949a6b214fa722026d49a70e8451ac184ab8e2e7746dd","audio_sha256":"7af9c9405751acd5095a08479d3618a4b6d67468733f3e837cc75b3e0ace966d","size_bytes":595628},"suyi-marx-p014-n018-g01":{"file":"audio/s <script>/* PoliticsMemory v0.10 — five-subject grouped recall, verified offline audio, paired progress upload, no analytics. */
(()=>{'use strict';
const PACK=window.POLITICS_PACK,AUDIO_INDEX=window.POLITICS_AUDIO_INDEX||{schema_version:1,items:{}};if(!PACK||!Array.isArray(PACK.cards)){document.getElementById('main').textContent='资料未加载。请保留预览文件完整。';return}
const KEY='politics_suyi_grouped_v07',LEGACY='politics_web_preview_v1',SUBJECTS=['马原','毛中特','新思想','史纲','思修'],SPEEDS=[.75,1,1.25,1.5,1.75,2,2.5,3,3.5,4];
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let stored={};try{stored=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){stored={}}
let cards=PACK.cards.map(c=>({...c}));let reviews=stored.reviews||{},events=Array.isArray(stored.events)?stored.events:[],wrong=new Set(stored.wrong||[]),imports=Array.isArray(stored.imports)?stored.imports:[],wrongChanges=stored.wrongChanges||{};
const validCard=c=>c&&typeof c.id==='string'&&c.id.length<200&&Array.isArray(c.path)&&c.path.length===3&&c.path.every(x=>typeof x==='string')&&typeof c.question==='string'&&typeof c.answer==='string';
function mergeCards(list){for(const c of list){if(!validCard(c))throw Error('卡片必须有 id、三层 path、question、answer');const old=cards.find(x=>x.id===c.id);if(old){if((c.revision||1)<(old.revision||1))continue;if(old.question!==c.question||old.answer!==c.answer){if(reviews[c.id])reviews[c.id].needsReview=true}Object.assign(old,c)}else cards.push({...c})}}
try{mergeCards(imports.filter(validCard))}catch(e){}
const sig=c=>{let h=2166136261;for(const ch of c.question+'\n'+c.answer)h=Math.imul(h^ch.codePointAt(0),16777619);return (h>>>0).toString(16)};
for(const c of cards){const r=reviews[c.id];if(r&&r.contentSig&&r.contentSig!==sig(c))r.needsReview=true}
let app={tab:stored.tab==='review'?'review':'books',show:!!stored.show,goal:Math.max(1,Math.min(500,Number(stored.goal)||25)),speed:SPEEDS.includes(Number(stored.speed))?Number(stored.speed):1,index:Number(stored.index)||0,scope:'全部知识组',positionAt:Number(stored.positionAt)||0,session:[],search:'',open:new Set(stored.open||[])};
const savedCurrent=(stored.session||[])[Number(stored.index)||0]||'';app.session=cards.slice();app.index=Math.max(0,cards.findIndex(c=>c.id===savedCurrent));
let toastTimer,moving=false,suppressUntil=0,gesture=null,audio=new Audio(),playingId='';audio.preload='none';audio.preservesPitch=true;audio.playbackRate=app.speed;
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:10,reviews,events,wrong:[...wrong],wrongChanges,positionAt:app.positionAt,imports,show:app.show,goal:app.goal,speed:app.speed,index:app.index,scope:app.scope,session:app.session.map(c=>c.id),tab:app.tab,open:[...app.open]}));delete document.body.dataset.storage;return true}catch(e){document.body.dataset.storage='failed';toast('浏览器未允许保存，请点同步把进度保存到电脑。');return false}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),2400)}
function state(c){return reviews[c.id]||{score:0,reviewCount:0,lastRating:'',lastYesDay:'',dueAt:0,lastReviewAt:0,needsReview:false}}
function mastered(c){const r=state(c);return r.score>=3&&r.lastRating==='yes'&&!r.needsReview}
function label(c){const r=state(c);return r.needsReview?'待复核':!r.reviewCount?'未学':r.lastRating==='no'?'忘记':r.lastRating==='fuzzy'?'模糊':mastered(c)?'已掌握':'待巩固'}
function summary(list){return{total:list.length,studied:list.filter(c=>state(c).reviewCount>0).length,mastered:list.filter(mastered).length,due:list.filter(c=>state(c).reviewCount>0&&(state(c).needsReview||state(c).dueAt<=Date.now())).length}}
function today(){const due=cards.filter(c=>state(c).reviewCount>0&&(state(c).needsReview||state(c).dueAt<=Date.now())).sort((a,b)=>state(a).dueAt-state(b).dueAt);const unseen=cards.filter(c=>!state(c).reviewCount);return [...due,...unseen,...cards.filter(c=>!due.includes(c)&&!unseen.includes(c))]}
function current(){return app.session[app.index]}
function setScope(list,name,start){app.session=cards.slice();app.scope=name;app.index=Math.max(0,app.session.findIndex(c=>c.id===(start||list[0]?.id)));app.tab='review';app.positionAt=Date.now();render();persist()}
function nav(tab){app.tab=tab;if(tab==='review'&&!app.session.length){app.session=today();app.index=0;app.scope='今日复习'}render();persist()}
function renderNav(){$('nav').innerHTML=[['review','复习'],['books','资料'],['stats','统计']].map(([k,t])=>`<button data-tab="${k}" class="${app.tab===k?'active':''}" aria-current="${app.tab===k?'page':'false'}">${t}</button>`).join('');$('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab))}
function toolbar(){const is=app.tab==='review',c=current();$('toolbar').innerHTML=is?'<button id="back" aria-label="返回资料">‹</button><span class="counter">'+(app.session.length?app.index+1:0)+' / '+app.session.length+'</span><button id="reveal">'+(app.show?'收起':'揭晓')+'</button><button id="more" aria-label="同步数据">同步</button>':'<span class="brand">政治背诵</span><button id="more" aria-label="同步数据">同步</button>';$('more').onclick=syncData;$('more').title='v0.10 · 点击同步；长按或右键重新连接';$('more').oncontextmenu=e=>{e.preventDefault();connectComputer()};if(is){$('back').onclick=()=>nav('books');$('reveal').onclick=toggle}}
function render(){gesture=null;renderNav();$('ratings').innerHTML='';if(app.tab==='review'){if(!app.session.length)app.session=today();app.index=app.session.length?((app.index%app.session.length)+app.session.length)%app.session.length:0;renderReview()}else if(app.tab==='books')renderBooks();else renderStats();toolbar();updatePlayer()}
function renderReview(){const c=current();if(!c){$('main').innerHTML='<div class="empty">当前没有待复习的知识组。<br>从资料选择科目或章节，随时开始背诵。</div>';return}
 const paragraphs=c.answer.split(/\n\s*\n/);const answer=paragraphs.length>1?paragraphs.map(p=>`<p>${esc(p)}</p>`).join(''):c.answer.split('\n').map(p=>`<div class="line">${esc(p)}</div>`).join('');
 $('main').innerHTML=`<article class="review-content" id="reviewContent"><div class="path">${esc(c.path.join(' › '))}</div><h1 class="title">${esc(c.title||c.path[2])}</h1><p class="question">${esc(c.question)}</p><hr class="separator">${app.show?`<div class="answer" id="answer">${answer}</div>${c.notes?`<p class="note">${esc(c.notes)}</p>`:''}`:'<div class="recall-prompt" id="recallPrompt">先回忆，再点击揭晓</div>'}</article>`;
 $('main').scrollTop=0;
 $('ratings').innerHTML=`<div class="grade-row"><button class="grade no" data-rate="no" ${app.show?'':'disabled'}>忘记</button><button class="grade fuzzy" data-rate="fuzzy" ${app.show?'':'disabled'}>模糊</button><button class="grade yes" data-rate="yes" ${app.show?'':'disabled'}>记住</button></div>`;
 $('ratings').querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));
 const title=$('main').querySelector('.title');title.oncontextmenu=e=>{e.preventDefault();wrong.has(c.id)?wrong.delete(c.id):wrong.add(c.id);wrongChanges[c.id]={marked:wrong.has(c.id),at:Date.now()};persist();toast(wrong.has(c.id)?'已加入错题':'已移出错题')};
 const el=$('reviewContent');el.onclick=e=>{if(Date.now()<suppressUntil||moving||e.target.closest('button,select,a'))return;toggle()};

 const end=e=>{if(!gesture||gesture.id!==e.pointerId)return;const g=gesture;gesture=null;if(g.axis==='x'){suppressUntil=Date.now()+450;if(Math.abs(g.dx)>60){step(g.dx>0?1:-1,g.dx); // Right swipe -> next; left swipe -> previous.
return}bounce(el)}else if(g.axis==='y')suppressUntil=Date.now()+300};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',()=>{gesture=null;suppressUntil=Date.now()+300;bounce(el)});
}
function reduced(){return matchMedia('(prefers-reduced-motion: reduce)').matches}

async function syncRequest(config,path,method='GET',body){
