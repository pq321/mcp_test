UDIT"},{"id":"p078_a003","kind":"政治素养","text":"概念及辨析：1.人民代表大会制度是我国的根本政治制度；2.人民代表大会是人民行使国家权力的机关；3.人民代表大会包括全国人民代表大会和地方各级人民代表大会，全国人民代表大会是最高国家权力机关，地方各级人民代表大会是地方国家权力机关。辨析：人民代表大会制度保证人民群众直接参与国家管理（×，间接参与）；人民代表大会制度是直接民主（×，间接民主）。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":267},{"id":"suyi-xi-p073-n037-g01","revision":1,"path":["新思想","第八章 发展全过程人民民主","考点7：加强人民当家作主制度保障"],"type":"group","title":"加强人民当家作主制度保障：人民代表大会制度（根本政治制度）","question":"加强人民当家作主制度保障：人民代表大会制度（根本政治制度）的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.加强人民当家作主制度保障，要不断坚持和完善我国根本政治制度、基本政治制度、重要政治制度，构建多样、畅通、有序的民主渠道，有效保证党的主张、国家意志、人民意愿相统一\n\n2.人民代表大会制度（根本政治制度）：（1）是符合我国国情和实际、体现社会主义国家性质、保证人民当家作主、保障实现中华民族伟大复兴的好制度，是我们党领导人民在人类政治制度史上的伟大创造；（2）是实现全过程人民民主的重要制度载体；（3）这一根本制度：①有效保证国家沿着社会主义道路前进 ②有效保证国家治理跳出治乱兴衰的历史周期率 ③有效保证国家政治生活既充满活力又安定有序；（4）人民代表大会制度（五个显著政治优势、五个有效克服）：①具有坚持中国共产党领导、保证党领导人民依法有效治理国家的显著优势——有效克服旧中国那种群龙无首、一般散沙和党争纷沓、相互攻讦的现象；②具有践行全过程人民民主、保障人民当家作主的显著优势——有效克服了一些国家那种人民形式上有权、实际上无权和选举时漫天许诺、选举后无人过问的现象；③具有贯彻民主集中制、保证国家政治生活既充满活力又安定有序的显著优势——有效克服了一些国家那种相互掣肘、内耗严重和议而不决、决而不行的现象；④具有保障全面依法治国、实现国家各方面工作法治化的显著优势——有效克服了一些国家那种无法可依、有法不依和以权代法、以权压法的现象；⑤具有维护国家统一、保障国家长治久安的显著优势——有效克服了一些国家那种各自为政、尾大不掉和民族隔阂、民族冲突的现象。","notes":"","source":"苏一《27命题点高清图谱》印刷第73页；按原分支整理","source_pages":[73],"source_pdf_pages":[78],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p078_n038","p078_n039","p078_n040","p078_n041","p078_n042","p078_n043"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p078_a001","kind":"政治素养","text":"三者统一于我国社会主义民主政治伟大实践。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p078_a002","kind":"政治素养","text":"全过程人民民主有地域性：我国有全国、省级、设区的市级、县级、乡镇级五级人民代表大会，各级人大代表都由民主选举产生，对人民负责，受人民监督。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p078_a003","kind":"政治素养","text":"概念及辨析：1.人民代表大会制度是我国的根本政治制度；2.人民代表大会是人民行使国家权力的机关；3.人民代表大会包括全国人民代表大会和地方各级人民代表大会，全国人民代表大会是最高国家权力机关，地方各级人民代表大会是地方国家权力机关。辨析：人民代表大会制度保证人民群众直接参与国家管理（×，间接参与）；人民代表大会制度是直接民主（×，间接民主）。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":268},{"id":"suyi-xi-p073-n037-g02","revision":1,"path":["新思想","第八章 发展全过程人民民主","考点7：加强人民当家作主制度保障"],"type":"group","title":"加强人民当家作主制度保障：中国共产党领导的多党合作和政治协商制度（基本政治制度）","question":"加强人民当家作主制度保障：中国共产党领导的多党合作和政治协商制度（基本政治制度）的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"3.中国共产党领导的多党合作和政治协商制度（基本政治制度）：中国共产党领导的多党合作和政治协商制度（政协制度）：（1）是中国共产党、中国人民和各民主党派、无党派人士的伟大政治创造；（2）在人民民主的共同旗帜下，中国共产党与各民主党派长期共存、互相监督、肝胆相照、荣辱与共，形成“共产党领导、多党派合作，共产党执政、多党派参政”这一具有鲜明中国特色的新型政党制度；（3）“三个有效避免”：①有效避免了旧式政党制度代表少数人、少数利益集团的弊端；②有效避免了一党缺乏监督或者多党轮流坐庄、恶性竞争的弊端；③有效避免了旧式政党制度囿于党派利益、阶级利益、区域和集团利益决策施政导致社会撕裂的弊端；中国人民政治协商会议（人民政协）：（1）是实行中国共产党领导的多党合作和政治协商制度的重要机构；（2）主要职能（也是政协制度强调发挥社会主义民主的最基本的体现）：政治协商、民主监督、参政议政；（3）工作：①聚焦党和国家中心任务 ②围绕团结和民主两大主题 ③坚持党的领导、统一战线、协商民主有机结合 ④坚持发扬民主和增进团结相互贯通、建言资政和凝聚共识双向发力；（4）新时代加强和改进人民政协工作的总体要求：①巩固共同思想政治基础的主轴——坚持和发展中国特色社会主义 ②工作主线——服务实现“两个一百年”奋斗目标 ③中心环节——加强思想政治引领，广泛凝聚共识 ④坚持团结和民主两大主题，提高政治协商、民主监督、参政议政水平，更好凝聚共识 ⑤担负起把党中央决策部署和对人民政协工作要求落实下去、把海内外中华儿女智慧和力量凝聚起来的政治责任。","notes":"","source":"苏一《27命题点高清图谱》印刷第74页；按原分支整理","source_pages":[74],"source_pdf_pages":[79],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p079_n004","p079_n005","p079_n006","p079_n007","p079_n008","p079_n009","p079_n010","p079_n011","p079_n012","p079_n013","p079_n014","p079_n015","p079_n016"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p079_a001","kind":"政治素养","text":"人民政协考点：1.是中国人民爱国统一战线组织；2.最广泛的爱国统一战线组织；3.是中国共产党领导的政治协商、民主监督、参政议政的机关；4.是社会主义协商民主的重要渠道和专门协商机构；5.是国家治理体系的重要组成部分；6.是具有中国特色的制度安排；7.是实行中国共产党领导的多党合作和政治协商制度的重要机构；8.不是国家权力机关、国家机关。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a002","kind":"政治素养","text":"我国是单一制国家结构，民族区域自治制度是单一制国家结构的形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a003","kind":"政治素养","text":"协商民主的考点：1.是全过程人民民主的重要组成部分；2.是我国社会主义民主政治的特有形式和独特优势；3.是党的群众路线在政治领域的重要体现；4.是中国共产党领导人民有效治理国家、保证人民当家作主的重要制度安排和民主形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a004","kind":"政治素养","text":"基层民主：1.基层民主是全过程人民民主的重要制度载体；2.协商民主是实践全过程人民民主的重要形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":269},{"id":"suyi-xi-p073-n037-g03","revision":1,"path":["新思想","第八章 发展全过程人民民主","考点7：加强人民当家作主制度保障"],"type":"group","title":"加强人民当家作主制度保障：民族区域自治制度（基本政治制度）、基层群众自治制度（基本政治制度）","question":"围绕加强人民当家作主制度保障：民族区域自治制度（基本政治制度）、基层群众自治制度（基本政治制度），民族区域自治制度（基本政治制度）、基层群众自治制度（基本政治制度）分别是什么？","answer":"4.民族区域自治制度（基本政治制度）：（1）中国特色解决民族问题正确道路的重要内容和制度保障；（2）要坚持统一和自治相结合、民族因素和区域因素相结合，促进各民族共同团结奋斗、共同繁荣发展。\n\n5.基层群众自治制度（基本政治制度）：（1）基层群众自治制度是社会主义民主政治建设的基础；（2）要发展基层民主，保障人民依法直接行使民主权利，实现自我管理、自我服务、自我教育、自我监督。","notes":"","source":"苏一《27命题点高清图谱》印刷第74页；按原分支整理","source_pages":[74],"source_pdf_pages":[79],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p079_n017","p079_n018","p079_n019","p079_n020","p079_n021","p079_n022"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p079_a001","kind":"政治素养","text":"人民政协考点：1.是中国人民爱国统一战线组织；2.最广泛的爱国统一战线组织；3.是中国共产党领导的政治协商、民主监督、参政议政的机关；4.是社会主义协商民主的重要渠道和专门协商机构；5.是国家治理体系的重要组成部分；6.是具有中国特色的制度安排；7.是实行中国共产党领导的多党合作和政治协商制度的重要机构；8.不是国家权力机关、国家机关。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a002","kind":"政治素养","text":"我国是单一制国家结构，民族区域自治制度是单一制国家结构的形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a003","kind":"政治素养","text":"协商民主的考点：1.是全过程人民民主的重要组成部分；2.是我国社会主义民主政治的特有形式和独特优势；3.是党的群众路线在政治领域的重要体现；4.是中国共产党领导人民有效治理国家、保证人民当家作主的重要制度安排和民主形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a004","kind":"政治素养","text":"基层民主：1.基层民主是全过程人民民主的重要制度载体；2.协商民主是实践全过程人民民主的重要形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":270},{"id":"suyi-xi-p073-n037-g04","revision":1,"path":["新思想","第八章 发展全过程人民民主","考点7：加强人民当家作主制度保障"],"type":"group","title":"加强人民当家作主制度保障：重要政治制度——建立在我国根本政治制度和基本政治制度基础上的、由根本政治制度和基本政治制度派生而来","question":"加强人民当家作主制度保障：重要政治制度——建立在我国根本政治制度和基本政治制度基础上的、由根本政治制度和基本政治制度派生而来的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"6.重要政治制度——建立在我国根本政治制度和基本政治制度基础上的、由根本政治制度和基本政治制度派生而来","notes":"","source":"苏一《27命题点高清图谱》印刷第74页；按原分支整理","source_pages":[74],"source_pdf_pages":[79],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p079_n023"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p079_a001","kind":"政治素养","text":"人民政协考点：1.是中国人民爱国统一战线组织；2.最广泛的爱国统一战线组织；3.是中国共产党领导的政治协商、民主监督、参政议政的机关；4.是社会主义协商民主的重要渠道和专门协商机构；5.是国家治理体系的重要组成部分；6.是具有中国特色的制度安排；7.是实行中国共产党领导的多党合作和政治协商制度的重要机构；8.不是国家权力机关、国家机关。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a002","kind":"政治素养","text":"我国是单一制国家结构，民族区域自治制度是单一制国家结构的形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a003","kind":"政治素养","text":"协商民主的考点：1.是全过程人民民主的重要组成部分；2.是我国社会主义民主政治的特有形式和独特优势；3.是党的群众路线在政治领域的重要体现；4.是中国共产党领导人民有效治理国家、保证人民当家作主的重要制度安排和民主形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a004","kind":"政治素养","text":"基层民主：1.基层民主是全过程人民民主的重要制度载体；2.协商民主是实践全过程人民民主的重要形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":271},{"id":"suyi-xi-p074-n024-g01","revision":1,"path":["新思想","第八章 发展全过程人民民主","考点8：全面发展协商民主"],"type":"group","title":"全面发展协商民主","question":"围绕全面发展协商民主，社会主义协商民主、协商民主是实践全过程人民民主的重要形式、全面发展协商民主分别是什么？","answer":"1.社会主义协商民主：（1）是在中国共产党领导下，人民内部各方面围绕改革发展稳定重大问题和涉及群众切身利益的实际问题；（2）在决策之前和决策实施之中开展广泛协商，努力形成共识的重要民主形式。\n\n2.协商民主是实践全过程人民民主的重要形式：（1）有事好商量，众人的事情由众人商量，找到全社会意愿和要求的最大公约数，是人民民主的真谛；（2）选举民主和协商民主这两种民主形式不是相互替代、相互否定的，而是相互补充、相得益彰的，共同构成了中国特色社会主义民主政治的制度特点和优势。\n\n3.协商民主是中国特色社会主义民主政治中独特的、独有的、独到的民主形式：（1）通过协商民主，密切了党同人民群众的血肉联系；（2）促进了科学决策、民主决策，凝聚了全社会共识，保障了人民有序政治参与；（3）体现了中国特色社会主义民主政治的独特优势。\n\n4.全面发展协商民主：（1）要不断完善协商民主体系；（2）统筹推进政党协商、人大协商、政府协商、政协协商、人民团体协商、基层协商以及社会组织协商；（3）健全各种制度化协商平台，推进协商民主广泛多层制度化发展。","notes":"","source":"苏一《27命题点高清图谱》印刷第74页；按原分支整理","source_pages":[74],"source_pdf_pages":[79],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p079_n025","p079_n026","p079_n027","p079_n028","p079_n029","p079_n030","p079_n031","p079_n032","p079_n033","p079_n034","p079_n035","p079_n036","p079_n037","p079_n038"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p079_a001","kind":"政治素养","text":"人民政协考点：1.是中国人民爱国统一战线组织；2.最广泛的爱国统一战线组织；3.是中国共产党领导的政治协商、民主监督、参政议政的机关；4.是社会主义协商民主的重要渠道和专门协商机构；5.是国家治理体系的重要组成部分；6.是具有中国特色的制度安排；7.是实行中国共产党领导的多党合作和政治协商制度的重要机构；8.不是国家权力机关、国家机关。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a002","kind":"政治素养","text":"我国是单一制国家结构，民族区域自治制度是单一制国家结构的形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a003","kind":"政治素养","text":"协商民主的考点：1.是全过程人民民主的重要组成部分；2.是我国社会主义民主政治的特有形式和独特优势；3.是党的群众路线在政治领域的重要体现；4.是中国共产党领导人民有效治理国家、保证人民当家作主的重要制度安排和民主形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a004","kind":"政治素养","text":"基层民主：1.基层民主是全过程人民民主的重要制度载体；2.协商民主是实践全过程人民民主的重要形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":272},{"id":"suyi-xi-p074-n039-g01","revision":1,"path":["新思想","第八章 发展全过程人民民主","考点9：积极发展基层民主"],"type":"group","title":"积极发展基层民主","question":"围绕积极发展基层民主，基层民主是全过程人民民主的重要体现、我国基层民主的主要形式分别是什么？","answer":"1.基层民主是全过程人民民主的重要体现\n\n2.我国基层民主的主要形式：（1）以村民委员会为组织形态的农村村民自治；（2）以社区居民委员会为组织形态的城市居民自治；（3）以职工代表大会为组织依托的企事业单位职工自治等。\n\n3.广大人民群众最直接的政治参与主要在基层，最直观的当家作主感受也主要在基层：（1）是实现人民有效政治参与的重要渠道；（2）是人民当家作主的有效途径；（3）是社会主义民主最广泛的实践。\n\n4.基层民主的建立和发展，保障了基层群众广泛、直接、有效行使民主权利，彰显了人民当家作主的广泛性、真实性、有效性\n\n5.坚持和完善基层群众自治制度，要把党的领导贯穿基层群众自治全过程和各方面，确保基层民主建设始终沿着正确道路前进","notes":"","source":"苏一《27命题点高清图谱》印刷第74页；按原分支整理","source_pages":[74],"source_pdf_pages":[79],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p079_n040","p079_n041","p079_n042","p079_n043","p079_n044","p079_n045","p079_n046","p079_n047","p079_n048","p079_n049","p079_n050"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p079_a001","kind":"政治素养","text":"人民政协考点：1.是中国人民爱国统一战线组织；2.最广泛的爱国统一战线组织；3.是中国共产党领导的政治协商、民主监督、参政议政的机关；4.是社会主义协商民主的重要渠道和专门协商机构；5.是国家治理体系的重要组成部分；6.是具有中国特色的制度安排；7.是实行中国共产党领导的多党合作和政治协商制度的重要机构；8.不是国家权力机关、国家机关。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a002","kind":"政治素养","text":"我国是单一制国家结构，民族区域自治制度是单一制国家结构的形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a003","kind":"政治素养","text":"协商民主的考点：1.是全过程人民民主的重要组成部分；2.是我国社会主义民主政治的特有形式和独特优势；3.是党的群众路线在政治领域的重要体现；4.是中国共产党领导人民有效治理国家、保证人民当家作主的重要制度安排和民主形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p079_a004","kind":"政治素养","text":"基层民主：1.基层民主是全过程人民民主的重要制度载体；2.协商民主是实践全过程人民民主的重要形式。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":273},{"id":"suyi-xi-p075-n003-g01","revision":1,"path":["新思想","第八章 发展全过程人民民主","考点10：统一战线是凝聚人心、汇聚力量的强大法宝"],"type":"group","title":"统一战线是凝聚人心、汇聚力量的强大法宝","question":"统一战线是凝聚人心、汇聚力量的强大法宝的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.统一战线的重要性：统一战线是中国共产党夺取革命、建设、改革事业胜利的重要法宝，是党克敌制胜、执政兴国的重要法宝，也是团结海内外全体中华儿女实现中华民族伟大复兴的重要法宝\n\n2.新时代，统一战线面临的时和势、肩负的使命和任务发生了重大变化（“三个更加重要”）：（1）在维护国家主权、安全、发展利益上的作用更加重要；（2）在围绕中心、服务大局上的作用更加重要；（3）在增强党的阶级基础、扩大党的群众基础上的作用更加重要。\n\n3.统战工作的本质要求是大团结大联合，解决的就是人心和力量问题——统一战线的工作对象为党外人士，重点是其中的代表人士\n\n4.统战工作的关键是要坚持求同存异，发扬“团结—批评—团结”的优良传统，在尊重多样性中寻求一致性，找到最大公约数、画出最大同心圆\n\n5.统一战线是做人的工作，搞统一战线是为了壮大共同奋斗的力量\n\n6.统一战线是党领导的统一战线：（1）党的领导是统一战线最鲜明的特征，坚持党的领导是统一战线最核心最根本的问题；（2）加强新时代统一战线工作，根本在于坚持党的领导。","notes":"","source":"苏一《27命题点高清图谱》印刷第75页；按原分支整理","source_pages":[75],"source_pdf_pages":[80],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p080_n004","p080_n005","p080_n006","p080_n007","p080_n008","p080_n009","p080_n010","p080_n011","p080_n012","p080_n013","p080_n014"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p080_a001","kind":"政治素养","text":"由中国共产党领导的、以工农联盟为基础的，包括全体社会主义劳动者、社会主义事业的建设者、拥护社会主义的爱国者、拥护祖国统一和致力于中华民族伟大复兴的爱国者的广泛的爱国统一战线。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":274},{"id":"suyi-xi-p075-n016-g01","revision":1,"path":["新思想","第八章 发展全过程人民民主","考点11：铸牢中华民族共同体意识"],"type":"group","title":"铸牢中华民族共同体意识","question":"铸牢中华民族共同体意识的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.民族团结是我国各族人民的生命线，中华民族共同体意识是民族团结之本：（1）必须以铸牢中华民族共同体意识为党的民族工作主线；（2）各民族团结进步的原因：①各民族血脉相融，是中华民族共同体形成和发展的历史根基；②各民族信念相同，是中华民族缔造统一的多民族国家的内生动力；③各民族文化相通，是中华民族铸就多元一体文明格局的文化基因；④各民族经济相依，是中华民族构建统一经济体的强大力量；⑤各民族情感相亲，是中华民族一家亲的坚强纽带。\n\n2.中国是全国各族人民共同缔造的统一的多民族国家——对中华民族形成起决定作用的是对中华民族共同体的认同，而不是种族、血缘、地域、宗教等因素\n\n3.只有铸牢中华民族共同体意识（重要性）：（1）才能构建起维护国家统一和民族团结的坚固思想长城，推动各民族共同维护好国家安全和社会稳定；（2）才能增进各民族对中华民族的自觉认同，夯实我国民族关系发展的思想基础，推动中华民族成为认同度更高、凝聚力更强的命运共同体；（3）才能有效应对实现中华民族伟大复兴过程中民族领域可能发生的风险挑战，为党和国家兴旺发达、长治久安提供重要思想保证。\n\n4.铸牢中华民族共同体意识——要引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念\n\n5.宗教工作在党和国家工作全局中具有特殊重要性：（1）宗教工作关系中国特色社会主义事业发展，关系党的执政基础巩固，关系民族团结和社会安定，关系国家安全和祖国统一；（2）坚持我国宗教中国化方向，积极引导宗教与社会主义社会相适应；（3）宗教工作本质上是群众工作；（4）依法治理宗教事务，是正确处理宗教领域各种矛盾和问题的根本途径。","notes":"","source":"苏一《27命题点高清图谱》印刷第75页；按原分支整理","source_pages":[75],"source_pdf_pages":[80],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p080_n017","p080_n018","p080_n019","p080_n020","p080_n021","p080_n022","p080_n023","p080_n024","p080_n025","p080_n026","p080_n027","p080_n028","p080_n029","p080_n030","p080_n031","p080_n032","p080_n033","p080_n034","p080_n035"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p080_a001","kind":"政治素养","text":"由中国共产党领导的、以工农联盟为基础的，包括全体社会主义劳动者、社会主义事业的建设者、拥护社会主义的爱国者、拥护祖国统一和致力于中华民族伟大复兴的爱国者的广泛的爱国统一战线。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":275},{"id":"suyi-xi-p075-n036-g01","revision":1,"path":["新思想","第八章 发展全过程人民民主","考点12：加强和促进海内外中华儿女大团结"],"type":"group","title":"加强和促进海内外中华儿女大团结","question":"加强和促进海内外中华儿女大团结的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.促进中华儿女大团结，是新时代爱国统一战线的历史责任——团结奋斗是中国共产党和中国人民最显著的精神标识\n\n2.加强和促进海内外中华儿女大团结：（1）要高举爱国主义、社会主义旗帜；（2）要抓好重点领域统战工作；（3）要辩证把握好四方面关系：①把握好固守圆心和扩大共识的关系 ②把握好潜绩和显绩的关系 ③把握好原则性和灵活性的关系 ④把握好团结和斗争的关系。","notes":"","source":"苏一《27命题点高清图谱》印刷第75页；按原分支整理","source_pages":[75],"source_pdf_pages":[80],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p080_n037","p080_n038","p080_n039","p080_n040","p080_n041"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p080_a001","kind":"政治素养","text":"由中国共产党领导的、以工农联盟为基础的，包括全体社会主义劳动者、社会主义事业的建设者、拥护社会主义的爱国者、拥护祖国统一和致力于中华民族伟大复兴的爱国者的广泛的爱国统一战线。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":276},{"id":"suyi-xi-p076-k01-g01","revision":1,"path":["新思想","第九章 全面依法治国","考点1 全面依法治国是国家治理的一场深刻革命"],"type":"group","title":"全面依法治国的地位和总目标","question":"全面依法治国为什么是一场深刻革命？它的地位和总目标是什么？","answer":"① 法治是治国理政的基本方式，是国家治理体系和治理能力的重要依托。\n② 全面依法治国是国家治理的一场深刻革命，关系党执政兴国，关系人民幸福安康，关系党和国家长治久安。\n③ 全面依法治国是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化的重要方面，是坚持和发展中国特色社会主义的本质要求和重要保障。\n④ 全面依法治国的总目标：建设中国特色社会主义法治体系、建设社会主义法治国家。","notes":"","source":"苏一《27命题点高清图谱》印刷第76页（PDF第81页）；依原图整理","source_pages":[76],"source_pdf_pages":[81],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":277},{"id":"suyi-xi-p076-k02-g01","revision":1,"path":["新思想","第九章 全面依法治国","考点2 全面依法治国的唯一正确道路"],"type":"group","title":"中国特色社会主义法治道路及核心要义","question":"为什么必须走这条法治道路？三个核心要义分别起什么作用？","answer":"① 中国特色社会主义法治道路是全面依法治国的唯一正确道路，由我国社会主义国家性质决定；本质上是中国特色社会主义道路在法治领域的具体体现。\n② 坚持党的领导：中国特色社会主义最本质的特征，社会主义法治最根本的保证。\n③ 坚持中国特色社会主义制度：中国特色社会主义法治体系的根本制度基础，全面推进依法治国的根本制度保障。\n④ 贯彻中国特色社会主义法治理论：中国特色社会主义法治体系的理论指导和学理支撑，全面推进依法治国的行动指南。\n这三个方面规定和确保中国特色社会主义法治体系的制度属性和前进方向。","notes":"","source":"苏一《27命题点高清图谱》印刷第76页（PDF第81页）；依原图整理","source_pages":[76],"source_pdf_pages":[81],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":278},{"id":"suyi-xi-p076-k02-g02","revision":1,"path":["新思想","第九章 全面依法治国","考点2 全面依法治国的唯一正确道路"],"type":"group","title":"中国特色社会主义法治道路的五项基本原则","question":"法治道路必须坚持哪五项基本原则？各自有哪些关键定位？","answer":"① 坚持中国共产党的领导。党的领导是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家法治最大的区别。\n② 坚持以人民为中心。全面依法治国最广泛、最深厚的基础是人民；坚持法治为了人民、依靠人民、造福人民、保护人民。根本目的是依法保障人民权益。\n③ 坚持法律面前人人平等。平等是社会主义法律的基本属性。\n④ 坚持依法治国和以德治国相结合。国家和社会治理需要法律与道德共同发挥作用；既发挥法律的规范作用，又发挥道德的教化作用；以法治体现道德理念、促进道德建设，以道德滋养法治精神、支撑法治文化。\n⑤ 坚持从中国实际出发，突出法治道路的中国特色、实践特色、时代特色。","notes":"","source":"苏一《27命题点高清图谱》印刷第76页（PDF第81页）；依原图整理","source_pages":[76],"source_pdf_pages":[81],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":279},{"id":"suyi-xi-p076-k03-g01","revision":1,"path":["新思想","第九章 全面依法治国","考点3 统筹处理全面依法治国的重大关系"],"type":"group","title":"全面依法治国的四组重大关系","question":"应统筹处理哪四组关系？党和法、改革和法治、法治和德治分别怎样联系？","answer":"① 政治和法治：相互依存、相互作用、密不可分。党和法的关系是政治和法治关系的集中反映，是全面依法治国的一个根本问题。党的领导和社会主义法治是一致的，社会主义法治必须坚持党的领导，党的领导必须依靠社会主义法治。\n② 改革和法治：在法治下推进改革，在改革中完善法治。\n③ 依法治国和以德治国：法治、德治都是治国理政不可或缺的重要手段；法律与道德都能规范社会行为、维护社会秩序，但在国家治理中各有其地位和功能；在道德体系中体现法治要求，在道德教育中突出法治内涵。\n④ 依法治国和依规治党：统筹两者，使二者相互促进、相得益彰。","notes":"","source":"苏一《27命题点高清图谱》印刷第76页（PDF第81页）；依原图整理","source_pages":[76],"source_pdf_pages":[81],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":280},{"id":"suyi-xi-p076-k04-g01","revision":1,"path":["新思想","第九章 全面依法治国","考点4 全面推进依法治国的总抓手"],"type":"group","title":"全面依法治国的总抓手","question":"全面依法治国的总抓手是什么？法治体系的本质是什么？","answer":"① 总抓手：建设中国特色社会主义法治体系。\n② 建设中国特色社会主义法治体系、建设社会主义法治国家，是坚持和发展中国特色社会主义的内在要求。\n③ 中国特色社会主义法治体系，本质上是中国特色社会主义制度的法律表现形式。\n④ 这一建设有利于在法治轨道上推进国家治理体系和治理能力现代化，在全面深化改革总体框架内推进各项依法治国工作，在法治轨道上不断深化改革。","notes":"","source":"苏一《27命题点高清图谱》印刷第76页（PDF第81页）；依原图整理","source_pages":[76],"source_pdf_pages":[81],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":281},{"id":"suyi-xi-p076-k05-g01","revision":1,"path":["新思想","第九章 全面依法治国","考点5 坚持依宪治国、依宪执政"],"type":"group","title":"依宪治国、依宪执政","question":"宪法处于什么地位？依宪治国与依宪执政的首要任务和基本要求是什么？","answer":"① 宪法是国家的根本法，是治国安邦的总章程，是党和人民意志的集中体现，是国家各种制度和法律法规的总依据，具有最高的法律地位、法律权威、法律效力。\n② 坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政。\n③ 建设社会主义法治国家，必须高度重视宪法在治国理政中的重要地位和作用。坚持依宪治国、依宪执政的首要任务是全面贯彻实施宪法。\n④ 必须坚持党的领导地位和我国国体、政体不动摇；必须全面贯彻实施宪法。","notes":"","source":"苏一《27命题点高清图谱》印刷第76页（PDF第81页）；依原图整理","source_pages":[76],"source_pdf_pages":[81],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":282},{"id":"suyi-xi-p076-k06-g01","revision":1,"path":["新思想","第九章 全面依法治国","考点6 更好推进中国特色社会主义法治体系建设"],"type":"group","title":"法治体系的五个组成部分","question":"五个法治体系各自包含什么？把党内法规体系纳入其中有什么意义？","answer":"① 完备的法律规范体系：以宪法为核心，由部门齐全、结构严谨、内部协调、体例科学、调整有效的法律规范构成的有机整体。\n② 高效的法治实施体系：执法、司法、守法等各个环节协调高效运转。\n③ 严密的法治监督体系：以规范和约束公权力的运行为重点。\n④ 有力的法治保障体系：包括政治、思想、组织、制度、队伍、科技等保障条件。\n⑤ 完善的党内法规体系：把党内法规体系纳入中国特色社会主义法治体系，是这一体系的本质要求和重要内容，也是我国法治区别于其他国家法治的鲜明特征。","notes":"","source":"苏一《27命题点高清图谱》印刷第76页（PDF第81页）；依原图整理","source_pages":[76],"source_pdf_pages":[81],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":283},{"id":"suyi-xi-p077-k07-g01","revision":1,"path":["新思想","第九章 全面依法治国","考点7 法治中国建设的总体目标"],"type":"group","title":"法治中国建设的总体目标","question":"法治中国建设要实现什么目标？2035年的阶段目标是什么？","answer":"① 法律规范科学完备统一，执法司法公正高效权威，权力运行受到有效制约监督。\n② 人民合法权益得到充分尊重保障，法治信仰普遍确立。\n③ 法治国家、法治政府、法治社会建设全面推进。\n④ 到2035年，法治国家、法治政府、法治社会基本建成。","notes":"","source":"苏一《27命题点高清图谱》印刷第77页（PDF第82页）；依原图整理","source_pages":[77],"source_pdf_pages":[82],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":284},{"id":"suyi-xi-p077-k08-g01","revision":1,"path":["新思想","第九章 全面依法治国","考点8 法治中国建设的工作布局"],"type":"group","title":"共同推进与一体建设","question":"三个共同推进、三个一体建设如何区分？涉外法治的根本目的是什么？","answer":"① 依法治国、依法执政、依法行政共同推进。依法治国是党领导人民治理国家的基本方式；依法执政是新的历史条件下党执政的基本方式；依法行政是法治状态下政府行为的基本原则和基本方式。\n② 法治国家、法治政府、法治社会一体建设。法治国家是法治建设的目标；法治政府建设是全面依法治国的重点任务和主体工程；法治社会是构筑法治国家的基础。\n③ 统筹推进国内法治和涉外法治。涉外法治的根本目的是用法治方式更好维护国家和人民利益，促进国际法治进步，推动构建人类命运共同体。","notes":"","source":"苏一《27命题点高清图谱》印刷第77页（PDF第82页）；依原图整理","source_pages":[77],"source_pdf_pages":[82],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":285},{"id":"suyi-xi-p077-k09-g01","revision":1,"path":["新思想","第九章 全面依法治国","考点9 建设更高水平的法治中国"],"type":"group","title":"建设更高水平的法治中国","question":"建设更高水平法治中国的四个着力点是什么？","answer":"① 完善以宪法为核心的中国特色社会主义法律体系。\n② 扎实推进依法行政。\n③ 严格公正司法。公正司法是维护社会公平正义的最后一道防线。\n④ 加快建设法治社会。\n坚持系统观念，全面推进科学立法、严格执法、公正司法、全民守法。","notes":"","source":"苏一《27命题点高清图谱》印刷第77页（PDF第82页）；依原图整理","source_pages":[77],"source_pdf_pages":[82],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":286},{"id":"suyi-xi-p077-k01-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点1 文化繁荣兴盛是实现中华民族伟大复兴的必然要求"],"type":"group","title":"文化的重要性与繁荣兴盛的必要性","question":"文化在现代化建设中有什么作用？为什么必须推动文化繁荣兴盛？","answer":"① 文化繁荣兴盛是中国式现代化的重要标志。坚持马克思主义在意识形态领域的指导地位，植根博大精深的中华文明，顺应信息技术发展潮流，发展具有强大思想引领力、精神凝聚力、价值感召力、国际影响力的新时代中国特色社会主义文化。\n② 统筹推进“五位一体”总体布局、协调推进“四个全面”战略布局，文化是重要内容；推动高质量发展，文化是重要支点；满足人民日益增长的美好生活需要，文化是重要因素；战胜前进道路上的风险挑战，文化是重要力量源泉。\n③ 文化繁荣兴盛是实现中华民族伟大复兴的精神支撑，是建设社会主义现代化强国的应有之义，是满足人民日益增长的美好生活需要的内在要求，是在世界文化激荡中站稳脚跟的前提基础。\n④ 目标：到2035年建成文化强国。建设文化强国，事关中国式现代化建设全局，事关中华民族复兴大业，事关提升国际竞争力。","notes":"","source":"苏一《27命题点高清图谱》印刷第77页（PDF第82页）；依原图整理","source_pages":[77],"source_pdf_pages":[82],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":287},{"id":"suyi-xi-p077-k02-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点2 坚定中国特色社会主义文化自信"],"type":"group","title":"文化自信的地位、底气与首要任务","question":"文化自信为何重要？文化自信的底气来自哪三个方面？首要任务是什么？","answer":"① 文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。建设社会主义文化强国、推动社会主义文化繁荣兴盛，关键在于坚定中国特色社会主义文化自信。\n② 中华优秀传统文化是坚定文化自信的深厚基础；中华民族创造的优秀传统文化是民族的根脉，是我们区别于其他国家和民族的根本特征。\n③ 党带领人民在伟大斗争中孕育的革命文化和社会主义先进文化，是坚定文化自信的坚强基石，是我们文化发展的基础和优势。\n④ 中国特色社会主义伟大实践是坚定文化自信的现实基础。\n⑤ 首要任务：立足中华民族伟大历史实践和当代实践，用中国道理总结好中国经验，把中国经验提升为中国理论，既不盲从各种教条，也不照搬外国理论，实现精神上的独立自主。","notes":"","source":"苏一《27命题点高清图谱》印刷第77页（PDF第82页）；依原图整理","source_pages":[77],"source_pdf_pages":[82],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":288},{"id":"suyi-xi-p077-k03-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点3 坚持中国特色社会主义文化发展道路"],"type":"group","title":"文化发展道路的任务、方向与动力","question":"文化建设的五项使命任务、“二为”“双百”和创新创造分别是什么？","answer":"① 坚持举旗帜、聚民心、育新人、兴文化、展形象。\n② 坚持“二为”方向：为人民服务、为社会主义服务。这是根本方向，是决定社会主义文化事业前途命运的关键。\n③ 坚持“双百”方针：百花齐放、百家争鸣。这是繁荣发展社会主义文化的重要方针。\n④ 激发全民族文化创新创造活力。创新创造是文化的生命所在，是文化的本质特征；激发创新创造活力是深化文化体制改革的中心环节。","notes":"","source":"苏一《27命题点高清图谱》印刷第77页（PDF第82页）；依原图整理","source_pages":[77],"source_pdf_pages":[82],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":289},{"id":"suyi-xi-p078-k04-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点4 坚持马克思主义在意识形态领域指导地位的根本制度"],"type":"group","title":"意识形态领域的根本制度","question":"为什么要坚持马克思主义在意识形态领域指导地位的根本制度？","answer":"① 马克思主义是我们立党立国、兴党兴国的根本指导思想。\n② 坚持马克思主义在意识形态领域指导地位的制度，是中国特色社会主义制度体系的一项根本制度。\n③ 这是坚持和加强党对宣传思想文化工作全面领导的本质要求，是发展社会主义先进文化的有力保障。\n④ 意识形态关乎旗帜、道路和国家政治安全，决定文化前进方向和发展道路；意识形态工作是为国家立心、为民族立魂的工作。","notes":"","source":"苏一《27命题点高清图谱》印刷第78页（PDF第83页）；依原图整理","source_pages":[78],"source_pdf_pages":[83],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":290},{"id":"suyi-xi-p078-k05-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点5 大力加强马克思主义理论建设"],"type":"group","title":"马克思主义理论建设","question":"马克思主义理论建设的三个着力点是什么？我国哲学社会科学的根本标志是什么？","answer":"① 坚持用马克思主义特别是中国化时代化的马克思主义武装全党、教育人民、指导实践。\n② 深化马克思主义理论研究和建设。推进理论的体系化、学理化，是深化理论创新的内在要求和重要途径，是马克思主义理论研究和建设的重要任务。\n③ 加快构建中国特色哲学社会科学。坚持以马克思主义为指导，是当代中国哲学社会科学区别于其他哲学社会科学的根本标志。","notes":"","source":"苏一《27命题点高清图谱》印刷第78页（PDF第83页）；依原图整理","source_pages":[78],"source_pdf_pages":[83],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":291},{"id":"suyi-xi-p078-k06-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点6 积极塑造主流舆论新格局"],"type":"group","title":"主流舆论与互联网阵地","question":"新闻舆论工作的第一要求、根本原则和互联网工作的关键是什么？","answer":"① 新闻舆论工作处在意识形态斗争前沿，是治国理政、定国安邦的大事。\n② 新闻舆论工作有鲜明的意识形态属性，坚持正确政治方向是做好新闻舆论工作的第一位要求。\n③ 党性原则是新闻舆论工作的根本原则；坚持党性原则最根本的是坚持党对新闻舆论工作的领导。\n④ 新闻媒体是社会舆论的发动器和放大器，做大做强主流舆论阵地，对推进社会主义现代化事业顺利发展具有重要意义。\n⑤ 互联网是意识形态工作的主阵地、主战场、最前沿；管好用好互联网是新形势下做好新闻舆论工作的关键。","notes":"","source":"苏一《27命题点高清图谱》印刷第78页（PDF第83页）；依原图整理","source_pages":[78],"source_pdf_pages":[83],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":292},{"id":"suyi-xi-p078-k07-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点7 广泛践行社会主义核心价值观"],"type":"group","title":"社会主义核心价值观的三个层面","question":"社会主义核心价值观的国家、社会、公民三个层面分别是什么？","answer":"① 国家层面的价值目标：富强、民主、文明、和谐。\n② 社会层面的价值取向：自由、平等、公正、法治。\n③ 公民个人层面的价值准则：爱国、敬业、诚信、友善。\n本考点在图谱中引向思修印刷第127—128页；系统阐释见思修相应组。","notes":"","source":"苏一《27命题点高清图谱》印刷第78页（PDF第83页）；依原图整理","source_pages":[78,127,128],"source_pdf_pages":[83,132,133],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":293},{"id":"suyi-xi-p078-k08-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点8 弘扬以伟大建党精神为源头的中国共产党人精神谱系"],"type":"group","title":"伟大建党精神与精神谱系","question":"伟大建党精神的四组内容是什么？它在党的精神谱系中处于什么位置？","answer":"① 坚持真理、坚守理想。\n② 践行初心、担当使命。\n③ 不怕牺牲、英勇斗争。\n④ 对党忠诚、不负人民。\n伟大建党精神是中国共产党的精神之源。弘扬以伟大建党精神为源头的中国共产党人精神谱系。","notes":"","source":"苏一《27命题点高清图谱》印刷第78页（PDF第83页）；依原图整理","source_pages":[78,125],"source_pdf_pages":[83,130],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":294},{"id":"suyi-xi-p078-k09-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点9 提高全社会文明程度"],"type":"group","title":"提高全社会文明程度","question":"提高全社会文明程度的三个方面及其定位是什么？","answer":"① 广泛开展共产主义远大理想和中国特色社会主义共同理想教育，是团结全体人民共同奋斗的重要基础。\n② 实施公民道德建设工程，是不断提高全体人民道德素质的灵魂工程。\n③ 培育时代新风新貌，是营造良好社会风气的重要方面。","notes":"","source":"苏一《27命题点高清图谱》印刷第78页（PDF第83页）；依原图整理","source_pages":[78],"source_pdf_pages":[83],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":295},{"id":"suyi-xi-p078-k10-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点10 传承发展中华优秀传统文化"],"type":"group","title":"新的文化使命与中华文明五个突出特性","question":"新时代新的文化使命是什么？中华文明五个突出特性分别决定了什么？","answer":"① 新的文化使命：在新的起点上继续推动文化繁荣、建设文化强国、建设中华民族现代文明。坚持文化自信、秉持开放包容、坚持守正创新。\n② 连续性：从根本上决定了中华民族必然走自己的路。\n③ 创新性：从根本上决定了中华民族守正不守旧、尊古不复古的进取精神，决定了中华民族不惧新挑战、勇于接受新事物的无畏品格。\n④ 统一性：从根本上决定了各民族文化融为一体、即使遇到重大挫折也牢固凝聚；决定了国土不可分、国家不可乱、民族不可散、文明不可断的共同信念；决定了国家统一永远是中国核心利益的核心，坚强统一的国家是各族人民命运所系。\n⑤ 包容性：从根本上决定了中华民族交往交流交融的历史取向；决定了中国各宗教信仰多元并存的和谐格局，中华文化对世界文明兼收并蓄的开放胸怀。\n⑥ 和平性：从根本上决定了中国始终是世界和平的建设者、全球发展的贡献者、国际秩序的维护者；决定了中国不断追求文明交流互鉴而不搞文化霸权，不把自己的价值观念与政治体制强加于人，坚持合作、不搞对抗，不搞“党同伐异”的小圈子。","notes":"","source":"苏一《27命题点高清图谱》印刷第78页（PDF第83页）；依原图整理","source_pages":[78],"source_pdf_pages":[83],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":296},{"id":"suyi-xi-p078-k10-g02","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点10 传承发展中华优秀传统文化"],"type":"group","title":"中华优秀传统文化的“两创”与文化遗产","question":"创造性转化与创新性发展有什么不同？保护文化遗产坚持什么原则？","answer":"① 创造性转化：按照时代特点和要求，对那些至今仍有借鉴价值的内涵和陈旧的表现形式加以改造，赋予其新的时代内涵和现代表达形式，激活其生命力。\n② 创新性发展：按照时代的新进步新进展，对中华优秀传统文化的内涵加以补充、拓展、完善，增强其影响力和感召力。\n③ 保护好、传承好文化遗产，是对历史负责、对人民负责，要坚持把保护放在第一位。\n④ 中华文明是中华民族独特的精神标识，是当代中国文化的根基、文化创新的宝藏、在世界文化激荡中站稳脚跟的根基。中华优秀传统文化是文化自信的深厚基础，是民族的根脉，蕴含民族最基本的文化基因。","notes":"","source":"苏一《27命题点高清图谱》印刷第78页（PDF第83页）；依原图整理","source_pages":[78],"source_pdf_pages":[83],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":297},{"id":"suyi-xi-p079-k11-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点11 繁荣发展文化事业和文化产业"],"type":"group","title":"文化事业、文化产业与文艺","question":"文化事业、文化产业分别发挥什么作用？怎样把握文化发展的效益？","answer":"① 繁荣发展文化事业和文化产业，是满足人民精神文化需求、保障人民文化权益的基本途径。\n② 文艺是民族精神的火炬，是时代前进的号角；社会主义文艺是人民的文艺，把满足人民精神文化需求作为文艺和文艺工作的出发点和落脚点。\n③ 发展文化事业、提升公共文化服务水平，是保障人民文化权益、改善人民生活品质、补齐文化发展短板的重要途径。坚持政府主导、社会参与、重心下移、共建共享。\n④ 文化产业在促进国民经济发展、满足人民文化需求等方面发挥重要作用。衡量文化产业发展质量和水平，最重要的不是看经济效益，而是能否提供更多既满足人民文化需求、又增强人民精神力量的文化产品。\n⑤ 坚持把社会效益放在首位，社会效益和经济效益相统一。","notes":"","source":"苏一《27命题点高清图谱》印刷第79页（PDF第84页）；依原图整理","source_pages":[79],"source_pdf_pages":[84],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":298},{"id":"suyi-xi-p079-k12-g01","revision":1,"path":["新思想","第十章 建设社会主义文化强国","考点12 不断提升国家文化软实力和中华文化影响力"],"type":"group","title":"文化软实力与国际传播","question":"国家文化软实力体现在哪里？提升国际传播能力的重要任务是什么？","answer":"① 文化软实力集中体现一个国家基于文化而具有的凝聚力和生命力，以及由此产生的吸引力和影响力。\n② 一个国家的文化软实力，从根本上取决于其核心价值观的生命力、凝聚力、感召力。\n③ 加强国际传播能力建设，全面提升国际传播效能，形成同我国综合国力和国际地位相匹配的国际话语权。\n④ 讲好中国故事、传播好中国声音，展示真实、立体、全面的中国，是加强我国国际传播能力建设的重要任务。","notes":"","source":"苏一《27命题点高清图谱》印刷第79页（PDF第84页）；依原图整理","source_pages":[79],"source_pdf_pages":[84],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":299},{"id":"suyi-xi-p079-k01-g01","revision":1,"path":["新思想","第十一章 以保障和改善民生为重点加强社会建设","考点1 民生是人民幸福之基"],"type":"group","title":"民生与增进民生福祉","question":"现代化建设的出发点和落脚点是什么？增进民生福祉有哪些重要定位？","answer":"① 始终坚持把实现人民对美好生活的向往作为现代化建设的出发点和落脚点。\n② 民生是老百姓最关心的问题，涉及分配、就业、教育、医疗、住房、社会保障等方面；事关人民生存生活，事关民心所向、民情所系、民意所盼，决定党的事业成败和国家命运兴衰。\n③ 增进民生福祉是坚持立党为公、执政为民的本质要求，是社会主义生产的根本目的，是全面建设社会主义现代化国家的应有之义。\n④ 消除绝对贫困是全面建成小康社会的底线任务，也是必须抓紧抓好的第一民生工程；提高保障和改善民生水平，使人民的获得感、幸福感、安全感更加充实、更有保障、更可持续。","notes":"","source":"苏一《27命题点高清图谱》印刷第79页（PDF第84页）；依原图整理","source_pages":[79],"source_pdf_pages":[84],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":300},{"id":"suyi-xi-p079-k02-g01","revision":1,"path":["新思想","第十一章 以保障和改善民生为重点加强社会建设","考点2 坚持在发展中增进民生福祉"],"type":"group","title":"发展与民生、保障改善民生的四项要求","question":"如何把握发展与民生的关系？工作思路、重中之重、重要方针和重要原则分别是什么？","answer":"① 发展是解决民生问题的“总钥匙”，民生是发展的“指南针”。正确把握民生和发展的关系，是保障和改善民生的重要前提。\n② 发展是改善民生的物质基础，离开发展，改善民生是无源之水、无本之木；抓民生也是抓发展，改善民生能够激发劳动积极性、增进消费预期、扩大内需、催生新增长点。\n③ 民生与发展相互牵动、互为条件，使民生改善与经济发展有效对接、相得益彰，形成两者统一的长效机制。\n④ 工作思路：守住底线、突出重点、完善制度、引导预期。\n⑤ 重中之重：解决人民群众最关心、最直接、最现实的利益问题。\n⑥ 重要方针：尽力而为、量力而行。\n⑦ 重要原则：人人尽责、人人享有，让所有劳动者在推动发展中分享发展成果。","notes":"","source":"苏一《27命题点高清图谱》印刷第79页（PDF第84页）；依原图整理","source_pages":[79],"source_pdf_pages":[84],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":301},{"id":"suyi-xi-p079-k03-g01","revision":1,"path":["新思想","第十一章 以保障和改善民生为重点加强社会建设","考点3 完善分配制度"],"type":"group","title":"分配制度与三次分配","question":"收入分配有什么地位？初次分配、再分配和第三次分配各起什么作用？","answer":"① 收入分配是民生之源，是改善民生、实现发展成果由人民共享最重要、最直接的方式。分配制度是促进共同富裕的基础性制度。\n② 深化收入分配制度改革，优化收入分配结构，构建初次分配、再分配、第三次分配协调配套的制度体系。\n③ 发挥初次分配的基础性作用，努力提高劳动报酬在初次分配中的比重，健全工资合理增长机制；探索通过土地、资本等要素使用权、收益权增加中低收入群体要素收入，切实保障劳动者待遇和权益，不断壮大中等收入群体。\n④ 发挥再分配的调节作用，加大税收、社保、转移支付等调节力度，提高精准性。\n⑤ 建立健全第三次分配机制，引导、支持有意愿有能力的企业、社会组织和个人积极参与公益慈善事业。","notes":"","source":"苏一《27命题点高清图谱》印刷第79页（PDF第84页）；依原图整理","source_pages":[79],"source_pdf_pages":[84],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":302},{"id":"suyi-xi-p080-k04-g01","revision":1,"path":["新思想","第十一章 以保障和改善民生为重点加强社会建设","考点4 实施就业优先战略"],"type":"group","title":"就业优先与高质量充分就业","question":"就业有哪些基本定位？促进高质量充分就业的六项要求是什么？","answer":"① 就业是最基本的民生，是劳动者赖以生存和发展的基础、共享经济发展成果的基本条件，关系亿万劳动者及其家庭的切身利益。\n② 解决好就业问题是民生改善的“温度计”，对国家长治久安具有重要作用；就业是最大的民生工程、民心工程、根基工程。\n③ 促进高质量充分就业，是新时代新征程就业工作的新定位、新使命。\n④ 六项要求：以推动高质量发展为基础；以实施就业优先战略为引领；以强化就业优先政策为抓手；以深化就业体制机制改革为动力；以破解结构性就业矛盾为着力点；以不发生规模性失业风险为底线。\n⑤ 实施就业优先战略，就是把就业摆在经济社会发展优先位置，突出就业作为基本民生的重要作用。","notes":"","source":"苏一《27命题点高清图谱》印刷第80页（PDF第85页）；依原图整理","source_pages":[80],"source_pdf_pages":[85],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":303},{"id":"suyi-xi-p080-k05-g01","revision":1,"path":["新思想","第十一章 以保障和改善民生为重点加强社会建设","考点5 健全社会保障体系"],"type":"group","title":"社会保障体系","question":"社会保障体系包含什么？其功能、根本出发点和落脚点、建设要求是什么？","answer":"① 社会保障体系主要涉及社会保险、社会救助、社会福利、社会优抚等方面。\n② 中国特色社会保障体系适应我国制度政治优势，坚持人民至上、共同富裕，把增进民生福祉、促进社会公平作为根本出发点和落脚点。\n③ 社会保障是保障和改善民生、维护社会公平、增进人民福祉的基本制度保障，是促进经济社会发展、实现广大人民群众共享改革发展成果的重要制度安排；发挥民生保障安全网、收入分配调节器、经济运行减震器的作用，是治国安邦的大问题。\n④ 健全和完善社会保障体系，是新时代加强社会建设的重要着力点。\n⑤ 增强公平性、适应流动性、保证可持续性，基本建成以社会保险为主体、功能完善的社会保障体系；深化制度改革，完善覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次社会保障体系。","notes":"","source":"苏一《27命题点高清图谱》印刷第80页（PDF第85页）；依原图整理","source_pages":[80],"source_pdf_pages":[85],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":304},{"id":"suyi-xi-p080-k06-g01","revision":1,"path":["新思想","第十一章 以保障和改善民生为重点加强社会建设","考点6 推进健康中国建设"],"type":"group","title":"人民健康与健康中国","question":"人民健康在社会发展和现代化建设中有哪些地位？","answer":"① 人民健康是社会文明进步的基础。\n② 人民健康是民族昌盛和国家富强的重要标志。\n③ 人民健康是促进人的全面发展的必然要求。\n④ 人民健康是社会主义现代化的重要标志。","notes":"","source":"苏一《27命题点高清图谱》印刷第80页（PDF第85页）；依原图整理","source_pages":[80],"source_pdf_pages":[85],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":305},{"id":"suyi-xi-p080-k07-g01","revision":1,"path":["新思想","第十一章 以保障和改善民生为重点加强社会建设","考点7 加强和创新社会治理"],"type":"group","title":"社会治理的内涵、地位和要求","question":"什么是社会治理？加强和创新社会治理有哪些基本要求？","answer":"① 社会治理是国家治理的重要领域，推进社会治理现代化是推进国家治理体系和治理能力现代化的重要内容；社会治理关系国家长治久安、社会安定有序、人民安居乐业。\n② 加强和创新社会治理，是在党的领导下，以政府为主导、社会多元主体参与为基础、维护人民群众根本利益为核心，通过合作、对话、协商、沟通等方式，依法引导和规范社会事务、社会组织和社会生活，协调社会利益、化解社会矛盾、促进社会公平、推动社会稳定有序发展。\n③ 坚持系统治理、依法治理、综合治理、源头治理，探索一条符合中国社会发展实际、更可持续的中国特色社会主义社会治理之路。","notes":"","source":"苏一《27命题点高清图谱》印刷第80页（PDF第85页）；依原图整理","source_pages":[80],"source_pdf_pages":[85],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":306},{"id":"suyi-xi-p080-k08-g01","revision":1,"path":["新思想","第十一章 以保障和改善民生为重点加强社会建设","考点8 完善社会治理体系"],"type":"group","title":"社会治理体系与共建共治共享","question":"社会治理体系包括哪些方面？共建、共治、共享分别是什么定位？","answer":"① 社会治理体系是进行社会治理的基础，也是提高社会治理效能的保障。完善党委领导、政府负责、民主协商、社会协同、公众参与、法治保障、科技支撑的社会治理体系。\n② 理念是先导：坚持共建共治共享。共建是共同参与社会建设，是社会治理的基础；共治是共同参与社会治理，是社会治理的关键；共享是共同享有社会治理成果，是社会治理的目标。\n③ 制度是保障：健全社会治理制度，提升社会治理效能。\n④ 方式方法是重要内容：不断创新社会治理方式、途径和手段。","notes":"","source":"苏一《27命题点高清图谱》印刷第80页（PDF第85页）；依原图整理","source_pages":[80],"source_pdf_pages":[85],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":307},{"id":"suyi-xi-p080-k09-g01","revision":1,"path":["新思想","第十一章 以保障和改善民生为重点加强社会建设","考点9 加强城乡社区治理"],"type":"group","title":"基层治理、枫桥经验与市域治理","question":"基层治理的重要性和目标是什么？城乡社区治理的三项要求是什么？","answer":"① 基层治理是国家治理的基石，城乡社区是社会治理最基本的单元，是党和政府联系、服务居民群众的“最后一公里”。社会治理的重心必须向基层下移、落实到城乡社区。\n② 健全党组织领导的城乡基层治理体系，实现政府治理和社会调节、居民自治良性互动：发挥基层党组织领导核心作用，把党的领导贯穿社会治理全过程各环节；发挥基层政府主导作用；注重基层群众性自治组织的基础作用。\n③ 坚持和发展新时代“枫桥经验”“浦江经验”，完善新形势下人民内部矛盾处理机制。把干部主动下沉服务和激发群众自治活力结合起来，探索社会矛盾纠纷多元预防调处化解综合机制，畅通和规范群众诉求表达、利益协调、权益保障通道，把矛盾纠纷化解在基层、化解在萌芽状态。新时代“枫桥经验”最突出的特点是牢牢把住基层基础，最大限度把矛盾风险防范化解在基层。\n④ 加快市域社会治理现代化。市域是把风险隐患解决在基层、化解在萌芽状态最直接、最有效的治理层级，处于基层治理现代化的前线位置；社区社会治理成效很大程度取决于市域社会治理能力和水平。","notes":"","source":"苏一《27命题点高清图谱》印刷第80页（PDF第85页）；依原图整理","source_pages":[80],"source_pdf_pages":[85],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":308},{"id":"suyi-xi-p081-k01-g01","revision":1,"path":["新思想","第十二章 建设社会主义生态文明","考点1 生态兴则文明兴"],"type":"group","title":"生态与文明、人与自然","question":"生态环境与人类文明是什么关系？为什么坚持人与自然和谐共生？","answer":"① 自然是生命之母，人与自然是生命共同体；保护自然就是保护人类，建设生态文明就是造福人类。\n② 生态环境变化直接影响文明兴衰演替。人类文明发展离不开良好生态环境这一根本基础。\n③ 生态文明是人类文明发展的历史趋势，是工业文明发展到一定阶段的产物，是人类社会进步的重大成果。\n④ 生态文明强调协调人与自然关系，解决工业文明的矛盾，把人类活动限制在生态环境能够承受的限度内，顺应人与自然和谐发展的新要求，昭示人类文明发展的未来。\n⑤ 中华民族尊重自然、热爱自然，绵延5000多年的中华文明孕育丰富生态文化。生态环境是关系党的使命宗旨的重大政治问题，也是关系民生的重大社会问题；良好生态环境是最公平的公共产品、最普惠的民生福祉。","notes":"","source":"苏一《27命题点高清图谱》印刷第81页（PDF第86页）；依原图整理","source_pages":[81],"source_pdf_pages":[86],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":309},{"id":"suyi-xi-p081-k02-g01","revision":1,"path":["新思想","第十二章 建设社会主义生态文明","考点2 绿水青山就是金山银山"],"type":"group","title":"两山理念与发展保护关系","question":"“两山”理念的内涵和意义是什么？处理好两者关系的关键是什么？","answer":"① 生态环境问题归根到底是经济发展方式和生活方式问题。“绿水青山就是金山银山”是重要的发展理念，也是推进现代化建设的重大原则。\n② 这一理念阐明经济发展与生态环境保护的关系，揭示保护生态环境就是保护生产力、改善生态环境就是发展生产力的道理，指明发展和保护协同共生的新路径。\n③ 生态环境保护与经济发展是辩证统一、相辅相成的关系，要在发展中保护、在保护中发展。\n④ 绿水青山既是自然财富、生态财富，又是社会财富、经济财富，是人民群众健康的重要保障、人民群众的共有财富。\n⑤ 处理好两者关系，关键在人、关键在思路，必须处理好高质量发展和高水平保护的关系。","notes":"","source":"苏一《27命题点高清图谱》印刷第81页（PDF第86页）；依原图整理","source_pages":[81],"source_pdf_pages":[86],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":310},{"id":"suyi-xi-p081-k03-g01","revision":1,"path":["新思想","第十二章 建设社会主义生态文明","考点3 把生态文明建设摆在全局工作的突出位置"],"type":"group","title":"生态文明建设的四个重大转变","question":"生态文明建设为何重要？新时代发生了哪四个重大转变？","answer":"① 生态文明建设是重大经济问题，也是关系党的使命宗旨的重大政治问题、关系民生福祉的重大社会问题。\n② 从解决突出生态环境问题入手，注重点面结合、标本兼治，实现由重点整治到系统治理的重大转变。\n③ 坚持转变观念、压实责任，增强全面推进生态文明建设的自觉性主动性，实现由被动应对到主动作为的重大转变。\n④ 紧跟时代、放眼世界，承担大国责任、展现大国担当，实现由全球环境治理参与者到引领者的重大转变。\n⑤ 深化对生态文明建设规律的认识，形成习近平生态文明思想，实现由实践探索到科学理论指导的重大转变。\n⑥ 生态文明建设战略地位更加凸显，生态文明制度体系更加健全，污染防治和生态保护更加有力。","notes":"","source":"苏一《27命题点高清图谱》印刷第81页（PDF第86页）；依原图整理","source_pages":[81],"source_pdf_pages":[86],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":311},{"id":"suyi-xi-p081-k04-g01","revision":1,"path":["新思想","第十二章 建设社会主义生态文明","考点4 加快形成绿色生产方式和生活方式"],"type":"group","title":"绿色发展与绿色低碳转型","question":"绿色发展有何地位？绿色低碳转型与“双碳”工作的要求是什么？","answer":"① 绿色发展是中国式现代化的鲜明底色。推动经济社会发展绿色化、低碳化，是新时代党治国理政理念新实践的重要标志，是实现高质量发展的关键环节，是解决我国资源环境生态问题的基础之策，是建设人与自然和谐共生现代化的内在要求。\n② 加快推动产业结构、能源结构、交通运输结构等调整优化；以产业结构调整为关键，促进产业结构变“轻”、发展模式变“绿”。\n③ 推进各类资源节约集约利用；生态环境问题归根到底是资源过度开发、粗放利用、奢侈消费造成的。\n④ 积极稳妥推进碳达峰碳中和。“双碳”工作是破解资源环境约束突出问题、实现可持续发展的迫切需要，是一场广泛而深刻的经济社会系统性变革，要把系统观念贯穿全过程。\n⑤ 健全绿色发展的保障体系；把建设美丽中国转化为全体人民自觉行动。\n⑥ 处理好五个重大关系：高质量发展和高水平保护；重点攻坚和协同治理；自然恢复和人工修复；外部约束和内生动力；“双碳”承诺和自主行动。\n建设美丽中国是全面建设社会主义现代化国家的重要目标；绿色低碳发展是解决生态环境问题的治本之策，能源绿色低碳转型是实现碳达峰碳中和的关键。","notes":"","source":"苏一《27命题点高清图谱》印刷第81页（PDF第86页）；依原图整理","source_pages":[81],"source_pdf_pages":[86],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":312},{"id":"suyi-xi-p081-k05-g01","revision":1,"path":["新思想","第十二章 建设社会主义生态文明","考点5 坚持山水林田湖草沙一体化保护和系统治理"],"type":"group","title":"山水林田湖草沙的系统治理","question":"为什么强调一体化保护？五项措施和“三条控制线”分别是什么？","answer":"① 山水林田湖草沙是一个生命共同体，是不可分割的生态系统，是人类生存发展的物质基础。\n② 加快实施重要生态系统保护和修复重大工程：强化国土空间规划和用途管控，划定落实生态保护红线、永久基本农田、城镇开发边界三条控制线以及各类海域保护线；以国家重点生态功能区、自然保护地等为重点，筑牢国家重大生态安全屏障；处理好自然恢复和人工修复的关系。\n③ 推进自然保护地体系建设：构建以国家公园为主体、自然保护区为基础、各类自然公园为补充的自然保护地体系。\n④ 科学推进荒漠化、石漠化、水土流失综合治理，持续开展大规模国土绿化行动。\n⑤ 实施生物多样性保护重大工程。\n⑥ 推行草原森林河流湖泊湿地休养生息。","notes":"","source":"苏一《27命题点高清图谱》印刷第81页（PDF第86页）；依原图整理","source_pages":[81],"source_pdf_pages":[86],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":313},{"id":"suyi-xi-p082-k06-g01","revision":1,"path":["新思想","第十二章 建设社会主义生态文明","考点6 用最严格制度最严密法治保护生态环境"],"type":"group","title":"生态文明的制度与法治保障","question":"为什么制度建设是生态文明建设的重中之重？主要举措是什么？","answer":"① 保护生态环境必须依靠制度、依靠法治；只有实行最严格的制度、最严密的法治，才能为生态文明建设提供可靠保障。\n② 把制度建设作为生态文明建设的重中之重，构建产权清晰、多元参与、激励约束并重、系统完整的生态文明制度体系，把生态文明建设纳入制度化、法治化轨道。\n③ 实行最严格的生态环境保护制度；全面建立资源高效利用制度；严明生态环境保护责任制度。","notes":"","source":"苏一《27命题点高清图谱》印刷第82页（PDF第87页）；依原图整理","source_pages":[82],"source_pdf_pages":[87],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":314},{"id":"suyi-xi-p082-k07-g01","revision":1,"path":["新思想","第十二章 建设社会主义生态文明","考点7 保护人类共同家园"],"type":"group","title":"保护人类共同家园","question":"为什么保护地球、建设绿色家园是人类的共同责任？","answer":"① 地球是全人类赖以生存的唯一家园，珍爱和呵护地球是人类的唯一选择。\n② 探索人与自然和谐共生之路，促进经济发展与生态保护协调统一，才能守护好人类共同的地球家园。\n③ 生态环境问题是全人类共同面临的问题，保持良好生态环境是各国人民的共同心愿和共同责任。\n④ 顺应自然、保护自然、绿色发展，人类才有美好的未来。建设绿色家园是各国人民的共同梦想，也是全球可持续发展的大势所趋。","notes":"","source":"苏一《27命题点高清图谱》印刷第82页（PDF第87页）；依原图整理","source_pages":[82],"source_pdf_pages":[87],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":315},{"id":"suyi-xi-p082-k08-g01","revision":1,"path":["新思想","第十二章 建设社会主义生态文明","考点8 共建清洁美丽世界"],"type":"group","title":"共建清洁美丽世界","question":"建设人与自然和谐共生的地球家园应坚持哪些理念和原则？","answer":"① 顺应各国人民对美好生态环境的需要，以绿色转型为驱动，坚持多边主义，推动全球环境治理体系更加公平合理，携手共建清洁美丽世界。\n② 坚持以人为本；坚持科学治理；坚持多边主义；坚持共同但有区别的责任原则。","notes":"","source":"苏一《27命题点高清图谱》印刷第82页（PDF第87页）；依原图整理","source_pages":[82],"source_pdf_pages":[87],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":316},{"id":"suyi-xi-p082-k09-g01","revision":1,"path":["新思想","第十二章 建设社会主义生态文明","考点9 积极推动全球可持续发展"],"type":"group","title":"中国参与全球可持续发展","question":"中国怎样在全球生态治理中承担大国责任？","answer":"中国作为世界上最大的发展中国家，深度参与全球气候治理，同世界各国共同推进全球生物多样性治理，积极建设绿色“一带一路”，承担大国责任，展现大国担当。","notes":"","source":"苏一《27命题点高清图谱》印刷第82页（PDF第87页）；依原图整理","source_pages":[82],"source_pdf_pages":[87],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":317},{"id":"suyi-xi-p082-k01-g01","revision":1,"path":["新思想","第十三章 维护和塑造国家安全","考点1 国家安全是民族复兴的根基"],"type":"group","title":"国家安全的含义与地位","question":"国家安全的含义是什么？国家安全、社会稳定与民族复兴有什么关系？","answer":"① 国家安全：国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益，相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。\n② 国家安全是民族复兴的根基，社会稳定是国家强盛的前提。\n③ 新时代面临更复杂的国家安全形势，各种威胁和挑战联动效应凸显；维护国家安全对实现民族复兴意义重大。\n④ 国家安全是关系国家发展稳定和社会长治久安的重大战略问题，是头等大事。坚持总体国家安全观，归根到底是为了确保中华民族伟大复兴进程不被迟滞甚至中断。","notes":"","source":"苏一《27命题点高清图谱》印刷第82页（PDF第87页）；依原图整理","source_pages":[82],"source_pdf_pages":[87],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":318},{"id":"suyi-xi-p082-k02-g01","revision":1,"path":["新思想","第十三章 维护和塑造国家安全","考点2 总体国家安全观是新时代国家安全工作的基本遵循"],"type":"group","title":"总体国家安全观的五个基本定位","question":"总体国家安全观的宗旨、根本、基础、保障、依托分别是什么？","answer":"① 以人民安全为宗旨。\n② 以政治安全为根本。\n③ 以经济安全为基础。\n④ 以军事、科技、文化、社会安全为保障。\n⑤ 以促进国际安全为依托。\n总体国家安全观既回答大国发展进程中的共性安全问题，也回答中华民族伟大复兴关键时期面临的特殊安全问题，为破解国家安全难题、推进新时代国家安全工作提供基本遵循。","notes":"","source":"苏一《27命题点高清图谱》印刷第82页（PDF第87页）；依原图整理","source_pages":[82],"source_pdf_pages":[87],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":319},{"id":"suyi-xi-p082-k02-g02","revision":1,"path":["新思想","第十三章 维护和塑造国家安全","考点2 总体国家安全观是新时代国家安全工作的基本遵循"],"type":"group","title":"“总体”的四层含义","question":"总体国家安全观为什么强调“总体”？应统筹哪些安全关系？","answer":"① 强调“大安全”理念：涵盖政治、军事、国土、经济、金融、文化、社会、科技、网络、粮食、生态、资源、核、海外利益、太空、深海、极地、生物、人工智能、数据等诸多领域，并随社会发展动态调整。\n② 强调做好国家安全工作的系统思维和方法：统筹外部与内部安全、国土与国民安全、传统与非传统安全、自身与共同安全，统筹维护与塑造国家安全。\n③ 强调维护国家安全贯穿党和国家工作各方面全过程，不能只属于某一领域或部门；与经济社会发展同步谋划、同步部署，积累实现安全目标的条件。\n④ 强调打总体战，形成党政军民学各战线各方面各层级的强大合力，全社会全政府全体系全手段应对重大国家安全风险挑战。","notes":"","source":"苏一《27命题点高清图谱》印刷第82页（PDF第87页）；依原图整理","source_pages":[82],"source_pdf_pages":[87],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":320},{"id":"suyi-xi-p082-k03-g01","revision":1,"path":["新思想","第十三章 维护和塑造国家安全","考点3 新时代国家安全得到全面加强"],"type":"group","title":"新时代国家安全建设成就","question":"新时代国家安全得到全面加强，主要体现在哪五方面？","answer":"① 党对国家安全工作的领导更加有力。\n② 国家安全体系和能力建设取得突破性进展。\n③ 国家主权、安全、发展利益得到全面维护。\n④ 平安中国建设迈向更高水平。\n⑤ 维护国家安全的民心基础更加巩固。","notes":"","source":"苏一《27命题点高清图谱》印刷第82页（PDF第87页）；依原图整理","source_pages":[82],"source_pdf_pages":[87],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":321},{"id":"suyi-xi-p083-k04-g01","revision":1,"path":["新思想","第十三章 维护和塑造国家安全","考点4 统筹发展和安全"],"type":"group","title":"统筹发展和安全","question":"发展与安全分别解决什么问题？为什么要以新安全格局保障新发展格局？","answer":"① 统筹发展和安全，是党和国家的一项基础性工作，是治国理政的一个重大原则。\n② 发展解决动力问题，是推动国家和民族赓续绵延的根本支撑，具有基础性、根本性，是解决安全问题的总钥匙，发展是最大的安全。\n③ 安全解决保障问题，是确保国家和民族行稳致远的坚强柱石，是发展的条件和保障；没有国家安全，取得的成果也可能毁于一旦。\n④ 发展和安全是一体之两翼、驱动之双轮，必须同步推进，以发展促安全、以安全保发展。\n⑤ 牢牢守住安全发展底线，是构建新发展格局的重要前提和保障。把国家发展建立在更加安全、更为可靠的基础上，才能增强发展安全性稳定性，在可预见和难以预见的风险挑战中增强生存力、竞争力、发展力、持续力。","notes":"","source":"苏一《27命题点高清图谱》印刷第83页（PDF第88页）；依原图整理","source_pages":[83],"source_pdf_pages":[88],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":322},{"id":"suyi-xi-p083-k05-g01","revision":1,"path":["新思想","第十三章 维护和塑造国家安全","考点5 把维护政治安全放在首要位置"],"type":"group","title":"政治安全、人民安全与国家利益","question":"政治安全为何居于首要位置？三项内容及其与人民安全、国家利益的关系是什么？","answer":"① 政治安全是国家安全的根本，涉及国家主权、政权、制度和意识形态，是一个国家最根本的需求，是一切国家生存和发展的基础条件；决定和影响经济、军事、社会等各领域安全。政治安全的核心是政权安全和制度安全。\n② 维护政权安全：毫不动摇坚持和巩固党的领导和长期执政地位。\n③ 维护制度安全：毫不动摇坚持和完善中国特色社会主义制度，发挥制度显著优势抵御风险挑战、维护国家整体利益。\n④ 维护意识形态安全：毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位，巩固全党全国人民团结奋斗的共同思想基础。\n⑤ 政治安全与人民安全、国家利益至上有机统一。政治安全是维护人民安全和国家利益的根本保证；人民安全居于中心地位，国家安全归根到底是保障人民利益；国家利益至上是实现政治安全和人民安全的要求和原则。","notes":"","source":"苏一《27命题点高清图谱》印刷第83页（PDF第88页）；依原图整理","source_pages":[83],"source_pdf_pages":[88],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":323},{"id":"suyi-xi-p083-k06-g01","revision":1,"path":["新思想","第十三章 维护和塑造国家安全","考点6 维护重点领域国家安全"],"type":"group","title":"重点领域国家安全","question":"重点领域安全有哪些内容？国土、经济、社会安全分别是什么定位？","answer":"① 构建统筹各领域安全的新安全格局，维护重点领域国家安全是主阵地、主战场。\n② 维护国土安全：国土安全是立国之基。\n③ 维护经济安全：经济安全是国家安全的基础。\n④ 维护社会安全：与人民群众切身利益关系最密切，是人民群众安全感的晴雨表、社会安定的风向标。\n⑤ 维护网络、人工智能、数据安全；维护生物安全和公共卫生安全；维护外部安全。","notes":"","source":"苏一《27命题点高清图谱》印刷第83页（PDF第88页）；依原图整理","source_pages":[83],"source_pdf_pages":[88],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":324},{"id":"suyi-xi-p083-k07-g01","revision":1,"path":["新思想","第十三章 维护和塑造国家安全","考点7 推进国家安全体系和能力现代化"],"type":"group","title":"国家安全体系和能力现代化","question":"国家安全体系和能力有什么地位？两个主要建设方面是什么？","answer":"① 国家安全体系和能力是国家安全制度及其执行能力的集中体现。\n② 推进国家安全体系和能力现代化，是新时代维护国家安全的迫切要求，也是推进国家治理体系和治理能力现代化的重要工程。\n③ 健全完善国家安全体系：健全体系、加强制度建设，是保障国家安全的治本之策，是维护和塑造国家安全的重要支撑。\n④ 增强维护国家安全能力：国家安全能力建设具有基础性、根本性、长期性的意义。","notes":"","source":"苏一《27命题点高清图谱》印刷第83页（PDF第88页）；依原图整理","source_pages":[83],"source_pdf_pages":[88],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":325},{"id":"suyi-xi-p083-k08-g01","revision":1,"path":["新思想","第十三章 维护和塑造国家安全","考点8 建设更高水平的平安中国"],"type":"group","title":"建设平安中国","question":"平安中国建设有何地位？公共安全治理模式应怎样转型？","answer":"① 建设平安中国，是全面建设社会主义现代化国家的重要内容和重要保障。\n② 平安是老百姓解决温饱后的第一需求，是极重要的民生，也是最基本的发展环境。\n③ 社会更加安全稳定有序，是检验更高水平平安中国建设成效的重要标志。\n④ 完善公共安全体系，推动公共安全治理模式向事前预防转型，而不是主要依赖事后处置。","notes":"","source":"苏一《27命题点高清图谱》印刷第83页（PDF第88页）；依原图整理","source_pages":[83],"source_pdf_pages":[88],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":326},{"id":"suyi-xi-p083-k09-g01","revision":1,"path":["新思想","第十三章 维护和塑造国家安全","考点9 提高防范化解重大风险能力"],"type":"group","title":"防范化解重大风险","question":"提高防范化解重大风险能力，应把握哪三个方面？","answer":"① 坚持底线思维和极限思维，从最坏处着眼，做最充分的准备，朝好的方向努力，争取最好的结果。\n② 下好先手棋、打好主动仗，力争把风险化解在源头。\n③ 运用制度威力应对风险挑战的冲击。","notes":"","source":"苏一《27命题点高清图谱》印刷第83页（PDF第88页）；依原图整理","source_pages":[83],"source_pdf_pages":[88],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":327},{"id":"suyi-xi-p084-k01-g01","revision":1,"path":["新思想","第十四章 建设巩固国防和强大人民军队","考点1 强国必须强军，军强才能国安"],"type":"group","title":"强军与“四个战略支撑”","question":"国防和军队建设有何地位？人民军队使命任务的四个战略支撑是什么？","answer":"① 巩固国防和强大人民军队，是新时代坚持和发展中国特色社会主义、实现中华民族伟大复兴的战略支撑；国防和军队建设是捍卫国家主权、安全、发展利益的坚强后盾。\n② 为巩固中国共产党领导和我国社会主义制度提供战略支撑。\n③ 为捍卫国家主权、统一和领土完整提供战略支撑。\n④ 为维护我国海外利益提供战略支撑。\n⑤ 为促进世界和平与发展提供战略支撑。","notes":"","source":"苏一《27命题点高清图谱》印刷第84页（PDF第89页）；依原图整理","source_pages":[84],"source_pdf_pages":[89],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":328},{"id":"suyi-xi-p084-k02-g01","revision":1,"path":["新思想","第十四章 建设巩固国防和强大人民军队","考点2 实现党在新时代的强军目标"],"type":"group","title":"新时代强军目标的科学内涵","question":"强军目标是什么？听党指挥、能打胜仗、作风优良分别是什么定位？","answer":"① 强军目标：建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队。\n② 听党指挥是灵魂，决定军队建设的政治方向。党对人民军队的绝对领导是人民军队永远不变的军魂；听党指挥是人民军队建设的首要，是人民军队的命脉所在。\n③ 能打胜仗是核心，反映军队根本职能和军队建设根本指向；能打仗、打胜仗是军队根本价值所在。\n④ 作风优良是保证，关系军队性质、宗旨、本色。优良作风和光荣传统是人民军队的鲜明特色和政治优势，也是军队无往不胜、攻无不克的重要保证。\n⑤ 三者相互联系、密不可分，抓住军队建设最根本、最紧要、最现实的问题，明确强军建设的聚焦点和着力点。","notes":"","source":"苏一《27命题点高清图谱》印刷第84页（PDF第89页）；依原图整理","source_pages":[84],"source_pdf_pages":[89],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":329},{"id":"suyi-xi-p084-k02-g02","revision":1,"path":["新思想","第十四章 建设巩固国防和强大人民军队","考点2 实现党在新时代的强军目标"],"type":"group","title":"国防和军队现代化的新“三步走”","question":"新“三步走”的时间、目标以及2035年现代化的四项内涵是什么？","answer":"① 到2027年，实现建军一百年奋斗目标。\n② 到2035年，基本实现国防和军队现代化。关键是实现军事理论现代化、军队组织形态现代化、军事人员现代化、武器装备现代化。\n③ 到本世纪中叶，把人民军队全面建成世界一流军队：同我国强国地位相称，能够全面有效维护国家安全，具备强大国际影响力。\n④ 新“三步走”体现国防和军队现代化进程同国家现代化进程相适应，以及军事能力同实现中华民族伟大复兴战略需求相适应的要求。\n图谱同时列出党的十九大的战略安排：确保到2020年基本实现机械化，信息化建设取得重大进展，战略能力有大的提升；力争到2035年基本实现国防和军队现代化，到本世纪中叶全面建成世界一流军队。","notes":"","source":"苏一《27命题点高清图谱》印刷第84页（PDF第89页）；依原图整理","source_pages":[84],"source_pdf_pages":[89],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":330},{"id":"suyi-xi-p084-k03-g01","revision":1,"path":["新思想","第十四章 建设巩固国防和强大人民军队","考点3 加快推进国防和军队现代化"],"type":"group","title":"党对军队绝对领导与五项强军部署","question":"党对军队绝对领导有哪些制度定位？五项强军部署分别起什么作用？","answer":"① 坚持党对人民军队绝对领导，是马克思主义建党建军的一条基本原则，是建军之本、强军之魂。必须以一整套制度保障，这是人民军队完全区别于一切旧军队的政治特质和根本优势。\n② 军委主席负责制是坚持党对人民军队绝对领导的根本制度和根本实现形式，在党领导军队的制度体系中处于最高层次、居于统领地位。\n③ 政治建军：人民军队的立军之本；党的领导和党的建设是人民军队建设发展的关键。\n④ 改革强军：决定人民军队发展壮大、制胜未来的关键一招。\n⑤ 科技强军：坚持科技是核心战斗力，是军事发展中最活跃、最具革命性的因素。\n⑥ 人才强军：人才是推动人民军队高质量发展、赢得军事竞争和未来战争主动的关键性因素；政治标准是人才第一位标准，把能打仗、打胜仗作为人才工作的出发点和落脚点。\n⑦ 依法治军：我们党建军治军的基本方式。","notes":"","source":"苏一《27命题点高清图谱》印刷第84页（PDF第89页）；依原图整理","source_pages":[84],"source_pdf_pages":[89],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":331},{"id":"suyi-xi-p084-k03-g02","revision":1,"path":["新思想","第十四章 建设巩固国防和强大人民军队","考点3 加快推进国防和军队现代化"],"type":"group","title":"练兵备战与一体化国家战略体系","question":"练兵备战的根本标准是什么？巩固提高一体化国家战略体系和能力的关键是什么？","answer":"① 牢固树立战斗力这一唯一的根本标准，把标准贯穿全军各项建设和工作，把提高战斗力作为各项建设的出发点和落脚点。\n② 深入推进实战化军事训练。军事训练是提高实战能力的重要途径和抓手，是最直接的军事斗争准备；创新军事战略指导；培育“一不怕苦、二不怕死”的战斗精神。\n③ 巩固提高一体化国家战略体系和能力，是党把握强国强军新形势新任务、着眼更好统筹发展和安全、更好统筹经济建设和国防建设作出的战略部署。\n④ 关键是在一体化上下功夫，实现国家战略能力最大化；军政军民团结是实现富国和强军相统一的重要政治保障。","notes":"","source":"苏一《27命题点高清图谱》印刷第84页（PDF第89页）；依原图整理","source_pages":[84],"source_pdf_pages":[89],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":332},{"id":"suyi-xi-p085-k01-g01","revision":1,"path":["新思想","第十五章 坚持“一国两制”和推进祖国完全统一","考点1 “一国两制”是中国特色社会主义的伟大创举"],"type":"group","title":"“一国两制”的内涵、由来和意义","question":"“一国两制”是什么？最早针对什么问题提出、首先用于哪里？有何意义？","answer":"① 在统一的国家之内，国家主体实行社会主义制度，个别地区依法实行资本主义制度。以宪法和基本法为基础，保持香港、澳门原有资本主义制度和生活方式不变、法律基本不变；作为直辖于中央人民政府的香港、澳门特别行政区，享有高度自治权，包括行政管理权、立法权、独立司法权和终审权。\n② “一国两制”立足中国国情，顺应时代潮流，观照人民福祉，把原则性和灵活性、现实性和长远性、一致性和差异性统一起来。\n③ 这一伟大构想最早针对台湾问题提出，首先运用于解决香港和澳门问题；凝结中国共产党人为解决国家统一问题的智慧，是前无古人的伟大创举。\n④ 它体现追求统一、反对分裂、爱好和平的精神特质和中国特色社会主义制度的先进性质；蕴含中华文化的和合理念、尊重差异和求同存异的思维方式，为国际社会解决类似问题提供中国思路、中国方案。","notes":"","source":"苏一《27命题点高清图谱》印刷第85页（PDF第90页）；依原图整理","source_pages":[85],"source_pdf_pages":[90],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":333},{"id":"suyi-xi-p085-k02-g01","revision":1,"path":["新思想","第十五章 坚持“一国两制”和推进祖国完全统一","考点2 准确把握“一国两制”的科学内涵"],"type":"group","title":"“一国两制”的根本宗旨与“一国”“两制”关系","question":"“一国两制”的根本宗旨和最高原则是什么？“一国”与“两制”如何统一？","answer":"① 根本宗旨：维护国家主权、安全、发展利益，保持香港、澳门长期繁荣稳定。\n② 贯彻方针要坚持两点：坚定不移，确保不变、不动摇；全面准确，确保不走样、不变形。\n③ “一国两制”是完整体系。维护国家主权、安全、发展利益是最高原则；在此前提下，香港、澳门保持原有资本主义制度长期不变，享有高度自治权。\n④ “一国”是实行“两制”的前提和基础；“两制”从属和派生于“一国”，统一于“一国”之内。\n⑤ “两制”并非等量齐观、比肩并列，国家主体必须实行社会主义制度。","notes":"","source":"苏一《27命题点高清图谱》印刷第85页（PDF第90页）；依原图整理","source_pages":[85],"source_pdf_pages":[90],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":334},{"id":"suyi-xi-p085-k02-g02","revision":1,"path":["新思想","第十五章 坚持“一国两制”和推进祖国完全统一","考点2 准确把握“一国两制”的科学内涵"],"type":"group","title":"全面管治权、高度自治权与依法治港澳","question":"全面管治权和高度自治权是什么关系？爱国者治港治澳、宪法和基本法有何定位？","answer":"① 中央全面管治权是授权特别行政区高度自治的前提和基础；高度自治权是中央行使全面管治权的体现，二者是源与流、本与末的关系。\n② 高度自治不是完全自治，不是分权，而是中央授予的地方事务管理权。中央授予多少权，特别行政区就享有多少权，不存在“剩余权力”；中央对其自治权行使具有监督权。\n③ 坚定落实“爱国者治港”“爱国者治澳”原则，把特别行政区管治权牢牢掌握在爱国者手中，关系国家主权、安全、发展利益和港澳长期繁荣稳定，是保证港澳长治久安的必然要求。\n④ 依法治港治澳，是全面依法治国的应有之义，是全面准确贯彻“一国两制”方针的必由之路。\n⑤ 宪法和基本法共同构成特别行政区的宪制基础；二者共同构成、共同实施，是“一国两制”下特别行政区制度的本质属性和基本特征。","notes":"","source":"苏一《27命题点高清图谱》印刷第85页（PDF第90页）；依原图整理","source_pages":[85],"source_pdf_pages":[90],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":335},{"id":"suyi-xi-p085-k03-g01","revision":1,"path":["新思想","第十五章 坚持“一国两制”和推进祖国完全统一","考点3 坚持和完善“一国两制”制度体系"],"type":"group","title":"“一国两制”制度体系建设","question":"坚持和完善“一国两制”制度体系包括哪三个方面？","answer":"① 加强依法治港治澳相关制度和机制建设。\n② 健全中央行使全面管治权的制度。\n③ 为落实爱国者治理提供制度保障。","notes":"","source":"苏一《27命题点高清图谱》印刷第85页（PDF第90页）；依原图整理","source_pages":[85],"source_pdf_pages":[90],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":336},{"id":"suyi-xi-p085-k04-g01","revision":1,"path":["新思想","第十五章 坚持“一国两制”和推进祖国完全统一","考点4 保持香港、澳门长期繁荣稳定"],"type":"group","title":"港澳长期繁荣稳定与融入国家发展大局","question":"推动香港由治及兴有哪些制度要求？支持港澳融入大局的四个方向是什么？","answer":"① “一国两制”是保持港澳长期繁荣稳定、保障港澳居民根本利益和福祉的好制度。背靠祖国、联通世界，是港澳得天独厚的显著优势。\n② 推动香港由乱到治走向由治及兴：建立健全香港特别行政区维护国家安全的法律制度和执行机制；完善香港特别行政区选举制度；坚持以行政长官为核心的行政主导体制，支持行政长官和特别行政区政府依法施政、积极作为。\n③ 支持港澳融入国家发展大局：积极主动助力国家全面开放；积极主动参与粤港澳大湾区建设；积极主动参与国家治理实践；积极主动促进国际人文交流。\n④ 香港是我国内地最大的外来投资地、对外投资最大目的地、对外贸易最大转口地；澳门是我国同所有建交葡语国家经贸合作的服务平台。","notes":"","source":"苏一《27命题点高清图谱》印刷第85页（PDF第90页）；依原图整理","source_pages":[85],"source_pdf_pages":[90],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":337},{"id":"suyi-xi-p086-k05-g01","revision":1,"path":["新思想","第十五章 坚持“一国两制”和推进祖国完全统一","考点5 实现祖国完全统一是中华民族伟大复兴的必然要求"],"type":"group","title":"祖国完全统一的历史必然性","question":"实现祖国完全统一为什么是历史必然？“台独”分裂活动造成什么危害？","answer":"① 民族复兴、国家统一是大势所趋、大义所在、民心所向。中华文明具有突出的统一性，国家统一永远是中国核心利益的核心。\n② 台湾的前途在于国家统一，台湾同胞的福祉系于民族复兴。\n③ 祖国统一是历史大势，是正道；“台独”是历史逆流，是绝路。“台独”分裂势力及其活动是两岸关系和平发展的最大现实威胁，是祖国统一的最大障碍，是民族复兴的严重隐患。\n④ 解决台湾问题、实现祖国完全统一，是中国共产党矢志不渝的历史任务，是全体中华儿女的共同愿望，是实现中华民族伟大复兴的必然要求。","notes":"","source":"苏一《27命题点高清图谱》印刷第86页（PDF第91页）；依原图整理","source_pages":[86],"source_pdf_pages":[91],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":338},{"id":"suyi-xi-p086-k06-g01","revision":1,"path":["新思想","第十五章 坚持“一国两制”和推进祖国完全统一","考点6 坚持贯彻新时代党解决台湾问题的总体方略"],"type":"group","title":"解决台湾问题总体方略的十项对应","question":"总体方略的十项内容分别对应统一的什么条件、路径或保障？","answer":"① 坚持党中央对对台工作的集中统一领导——根本保证。\n② 坚持在中华民族伟大复兴进程中推进祖国统一——历史方位。\n③ 坚持在祖国大陆发展进步的基础上解决台湾问题——战略思路。\n④ 坚持“和平统一、一国两制”基本方针——大政方针。\n⑤ 坚持一个中国原则和“九二共识”——政治基础。\n⑥ 坚持推动两岸关系和平发展、融合发展——实践途径。\n⑦ 坚持团结台湾同胞、争取台湾民心——根本动力。\n⑧ 坚持粉碎“台独”分裂图谋——必然要求。\n⑨ 坚持反对外部势力干涉——外部条件。\n⑩ 坚持决不承诺放弃使用武力——战略支撑。\n总体方略是党关于国家统一理论的最新成果，是新时代对台工作的科学指南和行动纲领。","notes":"","source":"苏一《27命题点高清图谱》印刷第86页（PDF第91页）；依原图整理","source_pages":[86],"source_pdf_pages":[91],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":339},{"id":"suyi-xi-p086-k07-g01","revision":1,"path":["新思想","第十五章 坚持“一国两制”和推进祖国完全统一","考点7 牢牢把握两岸关系主导权和主动权"],"type":"group","title":"把握两岸关系的主导权和主动权","question":"实现统一的最佳方式是什么？和平统一的努力与反分裂的底线是什么？","answer":"① “和平统一、一国两制”是实现两岸统一的最佳方式，对两岸同胞和中华民族最有利。\n② 促进两岸经济文化交流合作，深化各领域融合发展。\n③ 坚持一个中国原则和“九二共识”，坚决反对“台独”分裂和外部势力干涉。\n④ 以最大诚意、尽最大努力争取和平统一的前景，但决不承诺放弃使用武力，保留采取一切必要措施的选项。\n⑤ 国家主权和领土完整是国家核心利益，是不可逾越的红线。","notes":"","source":"苏一《27命题点高清图谱》印刷第86页（PDF第91页）；依原图整理","source_pages":[86],"source_pdf_pages":[91],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":340},{"id":"suyi-xi-p086-k01-g01","revision":1,"path":["新思想","第十六章 中国特色大国外交和推动构建人类命运共同体","考点1 世界正经历百年未有之大变局"],"type":"group","title":"百年未有之大变局的表现与时代之问","question":"大变局的两面和三项突出表现是什么？中国面对怎样的时代之问？","answer":"① 世界多极化、经济全球化、社会信息化、文化多样化深入发展，和平、发展、合作、共赢的时代潮流不可阻挡；同时，世界不稳定性不确定性突出，全球性问题加剧，充满机遇也充满危机。\n② 国际力量对比深刻调整，“东升西降”“南治西乱”的态势更加鲜明，这是近代以来国际力量对比中最具革命性的变化。\n③ 新一轮科技革命和产业变革深入发展。\n④ 国际体系和国际秩序深度调整。\n⑤ 世界之变、时代之变、历史之变前所未有，世界进入新的动荡变革期。“世界向何处去、人类怎么办”等成为必须回答的时代之问。","notes":"","source":"苏一《27命题点高清图谱》印刷第86页（PDF第91页）；依原图整理","source_pages":[86],"source_pdf_pages":[91],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":341},{"id":"suyi-xi-p086-k02-g01","revision":1,"path":["新思想","第十六章 中国特色大国外交和推动构建人类命运共同体","考点2 中国必须有自己特色的大国外交"],"type":"group","title":"中国特色大国外交的主线与总目标","question":"判断国际形势要坚持哪三种观念？大国外交的主线和总目标是什么？","answer":"① 坚持正确的历史观、大局观、角色观。\n② 以服务民族复兴、促进人类进步为主线，紧紧围绕实现中华民族伟大复兴的历史任务。\n③ 以推动构建人类命运共同体为总目标。\n④ 坚持自己的特色、风格、气派，把中国人民利益同各国人民共同利益结合起来，展现中国特色大国外交的独特风范。","notes":"","source":"苏一《27命题点高清图谱》印刷第86页（PDF第91页）；依原图整理","source_pages":[86],"source_pdf_pages":[91],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":342},{"id":"suyi-xi-p086-k03-g01","revision":1,"path":["新思想","第十六章 中国特色大国外交和推动构建人类命运共同体","考点3 我国国际影响力、感召力、塑造力显著提升"],"type":"group","title":"新时代外交的历史性成就","question":"新时代外交高举什么旗帜？取得了怎样的总体成就？","answer":"① 高举和平、发展、合作、共赢旗帜，在快速变革的世界中把握百年未有之大变局的发展方向。\n② 全面推进中国特色大国外交，推动构建人类命运共同体成为引领时代潮流和人类前进方向的鲜明旗帜。\n③ 我国国际影响力、感召力、塑造力显著提升。","notes":"","source":"苏一《27命题点高清图谱》印刷第86页（PDF第91页）；依原图整理","source_pages":[86],"source_pdf_pages":[91],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":343},{"id":"suyi-xi-p086-k04-g01","revision":1,"path":["新思想","第十六章 中国特色大国外交和推动构建人类命运共同体","考点4 坚持走和平发展道路"],"type":"group","title":"和平发展道路与独立自主的和平外交政策","question":"中国为什么走和平发展道路？独立自主的和平外交政策有哪些基本要求？","answer":"① 走和平发展道路是中国根据时代发展潮流和自身根本利益作出的战略抉择，是新时代中国外交的基本原则；既是回应国际社会的关切，更是中国对实现自身发展目标的自信与自觉。\n② 由党的性质宗旨和社会主义制度决定，是中国历史文化传承的必然选择，也是对历史潮流、世界大势的顺应。\n③ 坚持独立自主的和平外交政策，根据事情本身的是非曲直决定自己的立场和政策，维护国际关系基本准则和国际公平正义。\n④ 尊重各国主权和领土完整，坚持防御性国防政策。\n⑤ 在维护世界和平中发展自己，又通过自身发展维护世界和平。","notes":"","source":"苏一《27命题点高清图谱》印刷第86页（PDF第91页）；依原图整理","source_pages":[86],"source_pdf_pages":[91],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":344},{"id":"suyi-xi-p087-k05-g01","revision":1,"path":["新思想","第十六章 中国特色大国外交和推动构建人类命运共同体","考点5 推动构建新型国际关系"],"type":"group","title":"新型国际关系与全球伙伴关系","question":"新型国际关系的三项原则是什么？大国、周边、发展中国家和政党关系分别怎样推进？","answer":"① 推动建设相互尊重、公平正义、合作共赢的新型国际关系。\n② 坚持对话而不对抗、结伴而不结盟，在和平共处五项原则基础上发展同各国的友好合作，构建平等、开放、合作的全球伙伴关系。\n③ 大国关系：加强协调合作，构建和平共处、总体稳定、均衡发展的大国关系格局。\n④ 周边关系：坚持亲诚惠容和与邻为善、以邻为伴。周边是安身立命之所、发展繁荣之基，周边外交在外交全局中居于首要位置。\n⑤ 发展中国家关系：坚持真实亲诚理念和正确义利观，加强团结合作。\n⑥ 政党关系：发展求同存异、相互尊重、互学互鉴的新型政党关系。","notes":"","source":"苏一《27命题点高清图谱》印刷第87页（PDF第92页）；依原图整理","source_pages":[87],"source_pdf_pages":[92],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":345},{"id":"suyi-xi-p087-k06-g01","revision":1,"path":["新思想","第十六章 中国特色大国外交和推动构建人类命运共同体","考点6 坚决维护国家主权、安全、发展利益"],"type":"group","title":"外交的出发点和落脚点","question":"中国外交的出发点和落脚点是什么？应当怎样维护国家利益？","answer":"① 维护国家主权、安全、发展利益，是中国外交的出发点和落脚点，是外交工作的神圣使命。\n② 外交战线处在维护国家利益和民族尊严的最前线，要坚定维护国家主权、安全、发展利益。\n③ 发扬斗争精神，坚持敢于斗争、善于斗争，坚决维护国家核心利益。","notes":"","source":"苏一《27命题点高清图谱》印刷第87页（PDF第92页）；依原图整理","source_pages":[87],"source_pdf_pages":[92],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":346},{"id":"suyi-xi-p087-k07-g01","revision":1,"path":["新思想","第十六章 中国特色大国外交和推动构建人类命运共同体","考点7 坚持外交为民"],"type":"group","title":"外交为民与人民外交","question":"外交为民体现在哪些方面？人民外交、民间外交有什么定位？","answer":"① 人民外交是党的一个创举，是中国外交力量的源泉。\n② 坚持外交为民，维护我国海外公民、法人的安全和正当权益。\n③ 民间外交是中国外交的传统和特色，要不断夯实国家关系发展的民意基础。","notes":"","source":"苏一《27命题点高清图谱》印刷第87页（PDF第92页）；依原图整理","source_pages":[87],"source_pdf_pages":[92],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":347},{"id":"suyi-xi-p087-k08-g01","revision":1,"path":["新思想","第十六章 中国特色大国外交和推动构建人类命运共同体","考点8 构建人类命运共同体是各国人民前途所在"],"type":"group","title":"人类命运共同体的实践框架","question":"命运共同体的目标、路径、价值遵循、支撑、引领和平台分别是什么？","answer":"① 目标：建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。\n② 路径：共商共建共享的全球治理观。\n③ 普遍遵循：全人类共同价值。\n④ 基本支撑：新型国际关系。\n⑤ 战略引领：全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议。\n⑥ 实践平台：高质量共建“一带一路”。\n推动构建人类命运共同体，是破解时代问题、应对全球挑战的中国方案，是建设更加美好世界的必由之路，是新时代中国特色大国外交追求的总目标。","notes":"","source":"苏一《27命题点高清图谱》印刷第87页（PDF第92页）；依原图整理","source_pages":[87],"source_pdf_pages":[92],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":348},{"id":"suyi-xi-p087-k09-g01","revision":1,"path":["新思想","第十六章 中国特色大国外交和推动构建人类命运共同体","考点9 构建人类命运共同体的价值基础和重要依托"],"type":"group","title":"共同价值与全球倡议","question":"全人类共同价值的六项内容是什么？发展、安全、文明各处于什么位置？","answer":"① 弘扬和平、发展、公平、正义、民主、自由的全人类共同价值，这是各国人民共同追求的崇高目标。\n② 全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议，为推动构建人类命运共同体提供战略引领。\n③ 发展是人类社会的永恒主题。\n④ 安全是发展的前提，是人类最基本、最普遍的愿望，关系各国人民根本利益。\n⑤ 文明多样性是人类社会的基本特征，是人类进步的源泉。","notes":"","source":"苏一《27命题点高清图谱》印刷第87页（PDF第92页）；依原图整理","source_pages":[87],"source_pdf_pages":[92],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":349},{"id":"suyi-xi-p087-k10-g01","revision":1,"path":["新思想","第十六章 中国特色大国外交和推动构建人类命运共同体","考点10 积极参与全球治理体系改革和建设"],"type":"group","title":"全球治理改革与五大核心原则","question":"为什么推动全球治理体系改革？全球治理倡议的五大核心原则及定位是什么？","answer":"① 改革和完善全球治理体系，是增进各国人民福祉的客观要求，是构建人类命运共同体的内在要求。各国共同参与规则制定、方向选择和全球性挑战应对。\n② 多边主义符合各国共同利益，是维护和平、促进发展的有效路径。\n③ 主权平等——首要前提。\n④ 国际法治——根本保障。\n⑤ 多边主义——基本路径。\n⑥ 以人为本——价值取向。\n⑦ 行动导向——重要原则。","notes":"","source":"苏一《27命题点高清图谱》印刷第87页（PDF第92页）；依原图整理","source_pages":[87],"source_pdf_pages":[92],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":350},{"id":"suyi-xi-p087-k11-g01","revision":1,"path":["新思想","第十六章 中国特色大国外交和推动构建人类命运共同体","考点11 高质量共建“一带一路”"],"type":"group","title":"“一带一路”的原则、理念、目标与核心内涵","question":"“一带一路”的三项原则、三项理念、三项目标和核心内涵分别是什么？","answer":"① “一带一路”是开放共赢的顶层设计，是构建人类命运共同体的重要实践平台，根植历史、面向未来，源于中国、更属于世界。\n② 原则：共商、共建、共享。\n③ 理念：开放、绿色、廉洁。\n④ 目标：高标准、可持续、惠民生。\n⑤ 核心内涵：促进基础设施互联互通，加强政策协调和发展战略对接，深化务实合作，实现协同联动、共同繁荣。\n⑥ 共建各方共同应对世界经济挑战，开创发展机遇、谋求发展动力、拓展发展空间，实现优势互补、互利共赢，向命运共同体迈进。这是追求发展、崇尚共赢、传递希望、造福沿线人民的大事业。","notes":"","source":"苏一《27命题点高清图谱》印刷第87页（PDF第92页）；依原图整理","source_pages":[87],"source_pdf_pages":[92],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":351},{"id":"suyi-xi-p088-k01-g01","revision":1,"path":["新思想","第十七章 全面从严治党","考点1 全面从严治党是新时代党的建设的鲜明主题"],"type":"group","title":"全面从严治党的核心、基础、关键、要害","question":"全面从严治党的四个关键词怎样对应？为什么必须坚持全面从严治党？","answer":"① 办好中国的事情，关键在党，关键在全面从严治党。打铁必须自身硬，这是进行伟大斗争、建设伟大工程、推进伟大事业、实现伟大梦想，以及把党建设得更加坚强有力的迫切需要。\n② 核心是加强党的领导，基础在全面，关键在严，要害在治。\n③ 解决党内组织软弱涣散、纪律松弛特别是腐败问题，保持先进性和纯洁性，提高领导水平和执政能力。\n④ 全面从严治党是新时代党的建设的鲜明主题，是党自我革命的伟大实践。","notes":"","source":"苏一《27命题点高清图谱》印刷第88页（PDF第93页）；依原图整理","source_pages":[88],"source_pdf_pages":[93],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":352},{"id":"suyi-xi-p088-k01-g02","revision":1,"path":["新思想","第十七章 全面从严治党","考点1 全面从严治党是新时代党的建设的鲜明主题"],"type":"group","title":"全面从严治党体系与中央八项规定","question":"全面从严治党体系的“四个全”是什么？中央八项规定有什么意义？","answer":"① 全面从严治党是系统工程，要建设布局合理、内容科学、要素齐备、统一高效的全面从严治党体系。\n② 内容上全涵盖、对象上全覆盖、责任上全链条、制度上全贯通。\n③ 以制定和落实中央八项规定开局破题，从中央政治局做起，抓住“关键少数”，以上率下。\n④ 中央八项规定是徙木立信之举，是新时代管党治党的标志性措施。","notes":"","source":"苏一《27命题点高清图谱》印刷第88页（PDF第93页）；依原图整理","source_pages":[88],"source_pdf_pages":[93],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":353},{"id":"suyi-xi-p088-k02-g01","revision":1,"path":["新思想","第十七章 全面从严治党","考点2 以党的政治建设统领党的建设各项工作"],"type":"group","title":"政治建设与思想建设","question":"政治建设和思想建设分别处于什么地位？两个“首要任务”怎样区分？","answer":"① 政治建设是党的根本性建设，决定党的建设方向和效果，必须摆在首位。旗帜鲜明讲政治是马克思主义政党的根本要求。\n② 保证全党服从中央、维护党中央权威和集中统一领导，是党的政治建设的首要任务。\n③ 政治方向是党生存发展的第一位问题；政治立场是党执政的根本政治问题；政治生态建设是基础性、经常性工作；政治能力是党员干部第一位的能力。\n④ 思想建设是党的基础性建设，思想建党、理论强党是党的宝贵经验和重要法宝。\n⑤ 加强思想教育和理论武装，是党内政治生活的首要任务；这是坚定理想信念、保证政治清醒和行动统一、贯彻路线方针政策的重要保障。","notes":"","source":"苏一《27命题点高清图谱》印刷第88页（PDF第93页）；依原图整理","source_pages":[88],"source_pdf_pages":[93],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":354},{"id":"suyi-xi-p088-k02-g02","revision":1,"path":["新思想","第十七章 全面从严治党","考点2 以党的政治建设统领党的建设各项工作"],"type":"group","title":"组织、作风与纪律建设","question":"组织建设的重点和关键是什么？党性、党风、党纪怎样联系？政治纪律有什么地位？","answer":"① 贯彻新时代党的组织路线，以严密党的组织体系为重点，建设高素质专业化干部队伍是关键。\n② 党的作风就是党的形象，关系人心向背，关系党的生死存亡。作风建设的核心问题是保持党同人民群众的血肉联系。\n③ 党性、党风、党纪是有机整体：党性是根本，党风是表现，党纪是保障。\n④ 加强纪律建设是全面从严治党的治本之策；纪律严明是党内政治生活的内在要求和重要保证。\n⑤ 政治纪律是最重要、最根本、最关键的纪律。维护政治纪律的根本，是坚持党的领导和党的团结统一。","notes":"","source":"苏一《27命题点高清图谱》印刷第88页（PDF第93页）；依原图整理","source_pages":[88],"source_pdf_pages":[93],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":355},{"id":"suyi-xi-p088-k02-g03","revision":1,"path":["新思想","第十七章 全面从严治党","考点2 以党的政治建设统领党的建设各项工作"],"type":"group","title":"制度建设与党内监督","question":"为什么要把制度建设贯穿党的各项建设？党内监督的地位是什么？","answer":"① 制度问题带有根本性、全局性、稳定性、长期性。把制度建设贯穿党的各项建设，依靠制度管权、管事、管人。\n② 坚持制度治党、依规治党。党内法规是管党治党的重要制度支撑，制度的重要性必须落实为执行力。\n③ 党内监督是永葆党的肌体健康的生命之源，在党和国家各种监督形式中是最根本的、第一位的。\n④ 深化党的建设制度改革，以坚持和加强党的全面领导为根本保证，以提高党的领导水平和长期执政能力为主要目标，以调动全党抓改革、促发展的积极性、主动性、创造性为着力点。","notes":"","source":"苏一《27命题点高清图谱》印刷第88页（PDF第93页）；依原图整理","source_pages":[88],"source_pdf_pages":[93],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":356},{"id":"suyi-xi-p089-k03-g01","revision":1,"path":["新思想","第十七章 全面从严治党","考点3 坚定不移推进反腐败斗争"],"type":"group","title":"反腐败斗争与“三不腐”","question":"腐败为什么必须坚决惩治？“三不腐”的定位及相互关系是什么？","answer":"① 腐败是侵蚀党的生命力和战斗力的最大毒瘤，是党长期执政的最大威胁。反腐败是最彻底的自我革命，是全面从严治党的必答题。\n② 标本兼治是新时代反腐败的鲜明特征：治标遏制势头，治本筑牢根基，核心是加强对权力的制约和监督。\n③ 不敢腐是前提，不能腐是关键，不想腐是根本。三者相互依存、相互促进，必须一体推进。\n④ 反腐败永远在路上，必须永远吹冲锋号，打好攻坚战、持久战。","notes":"","source":"苏一《27命题点高清图谱》印刷第89页（PDF第94页）；依原图整理","source_pages":[89],"source_pdf_pages":[94],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":357},{"id":"suyi-xi-p089-k04-g01","revision":1,"path":["新思想","第十七章 全面从严治党","考点4 自我革命是党跳出历史周期率的第二个答案"],"type":"group","title":"跳出历史周期率的两个答案","question":"两个答案分别是什么？勇于自我革命和“四个自我”有什么意义？","answer":"① 第一个答案：让人民来监督政府。\n② 第二个答案：自我革命。\n③ 勇于自我革命，是党区别于其他政党的显著标志，是党最大的优势和最鲜明的品格。\n④ 坚决同一切损害党的先进性、弱化党的纯洁性的问题作斗争，不断自我净化、自我完善、自我革新、自我提高。","notes":"","source":"苏一《27命题点高清图谱》印刷第89页（PDF第94页）；依原图整理","source_pages":[89],"source_pdf_pages":[94],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":358},{"id":"suyi-xi-p089-k05-g01","revision":1,"path":["新思想","第十七章 全面从严治党","考点5 时刻保持解决大党独有难题的清醒和坚定"],"type":"group","title":"六个大党独有难题与“三个务必”","question":"大党独有难题包括哪六项？“三个务必”的完整内容是什么？","answer":"① 如何始终不忘初心、牢记使命。\n② 如何始终统一思想、统一意志、统一行动。\n③ 如何始终具备强大的执政能力和领导水平。\n④ 如何始终保持干事创业精神状态。\n⑤ 如何始终能够及时发现和解决自身存在的问题。\n⑥ 如何始终保持风清气正的政治生态。\n解决这些难题具有长期性和艰巨性，必须保持清醒、坚定和持续定力。\n“三个务必”：务必不忘初心、牢记使命；务必谦虚谨慎、艰苦奋斗；务必敢于斗争、善于斗争。","notes":"","source":"苏一《27命题点高清图谱》印刷第89页（PDF第94页）；依原图整理","source_pages":[89],"source_pdf_pages":[94],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":359},{"id":"suyi-xi-p089-k06-g01","revision":1,"path":["新思想","第十七章 全面从严治党","考点6 以伟大自我革命引领伟大社会革命"],"type":"group","title":"自我革命与社会革命的关系","question":"两种革命怎样相互促进？这一关系揭示了什么？","answer":"① 以伟大自我革命引领伟大社会革命，以伟大社会革命促进伟大自我革命，使党始终成为坚强领导核心。\n② 这一关系揭示了党的建设新的伟大工程和党领导的伟大事业的辩证关系，体现了以改造主观世界推动改造客观世界的主动精神、崇高使命和强烈担当。\n③ 党的不懈奋斗史，是自我革命和社会革命相互促进的历史。党的自我革命永远在路上。","notes":"","source":"苏一《27命题点高清图谱》印刷第89页（PDF第94页）；依原图整理","source_pages":[89],"source_pdf_pages":[94],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":360},{"id":"suyi-xi-p089-k06-g02","revision":1,"path":["新思想","第十七章 全面从严治党","考点6 以伟大自我革命引领伟大社会革命"],"type":"group","title":"推进自我革命的“九个以”","question":"“九个以”分别对应根本保证、目的、遵循、目标、方向、途径、着力点、抓手和动力的什么内容？","answer":"① 以坚持党中央集中统一领导为根本保证。\n② 以引领伟大社会革命为根本目的。\n③ 以习近平新时代中国特色社会主义思想为根本遵循。\n④ 以跳出历史周期率为战略目标。\n⑤ 以解决大党独有难题为主攻方向。\n⑥ 以健全全面从严治党体系为有效途径。\n⑦ 以锻造坚强组织、建设过硬队伍为重要着力点。\n⑧ 以正风肃纪反腐为重要抓手。\n⑨ 以自我监督和人民监督相结合为强大动力。","notes":"","source":"苏一《27命题点高清图谱》印刷第89页（PDF第94页）；依原图整理","source_pages":[89],"source_pdf_pages":[94],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":361},{"id":"suyi-history-p090-k123927-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","总框架 历史分期与任务"],"type":"group","title":"近现代史的分期和两大历史任务","question":"近现代史怎样分期？两大历史任务的内容、区别和关系是什么？","answer":"① 近代：1840—1949年。1840—1919年是旧民主主义革命时期，1919—1949年是新民主主义革命时期。\n② 现代：1949年至今。1949—1956年是社会主义革命时期；1956—1978年是社会主义建设初步探索时期；1978—2012年是改革开放和社会主义现代化建设新时期；2012年以来进入中国特色社会主义新时代。\n③ 第一大历史任务：争得民族独立、人民解放，主要是反帝反封建、改变落后的生产关系和上层建筑。\n④ 第二大历史任务：实现国家富强、人民幸福，主要是发展社会生产力、实现民族复兴。\n⑤ 二者相互区别又紧密联系：完成第一大任务是实现第二大任务的前提，第二大任务是第一大任务的必然要求和最终目的。","notes":"","source":"苏一《27命题点高清图谱》印刷第90页（PDF第95页）；依原图整理","source_pages":[90],"source_pdf_pages":[95],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":362},{"id":"suyi-history-p090-k494560-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","总框架 旧民主主义革命"],"type":"group","title":"四次侵华战争、条约与救亡探索","question":"四次侵华战争怎样改变中国社会性质？随后出现哪些救亡探索？","answer":"① 鸦片战争（1840—1842）：中英《南京条约》是中国近代史上第一个不平等条约，中国开始沦为半殖民地半封建社会；随后爆发太平天国运动（1851—1864）。\n② 第二次鸦片战争（1856—1860）：《天津条约》《北京条约》使半殖民地半封建化程度进一步加深；外国公使进驻北京，外国侵略势力同清政府勾结；洋务运动兴起（19世纪60—90年代）。\n③ 甲午中日战争（1894—1895）：《马关条约》割台湾、澎湖列岛及辽东半岛等，列强掀起瓜分中国的狂潮，中国人民民族意识普遍觉醒；洋务运动失败，维新运动兴起。\n④ 八国联军侵华战争（1900—1901）：《辛丑条约》使中国完全陷入半殖民地半封建社会的深渊；救亡探索发展到辛亥革命。\n⑤ 农民阶级的太平天国运动、地主阶级洋务派的洋务运动、资产阶级维新派的维新运动、资产阶级革命派的辛亥革命，都未完成反帝反封建的历史任务。","notes":"","source":"苏一《27命题点高清图谱》印刷第90页（PDF第95页）；依原图整理","source_pages":[90],"source_pdf_pages":[95],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":363},{"id":"suyi-history-p090-k01e8e6-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","总框架 新旧民主主义革命的分界"],"type":"group","title":"五四运动与新文化运动的分期","question":"五四运动有什么分界意义？五四前后的新文化运动有什么不同？","answer":"① 五四以前的新文化运动，主要宣传资产阶级民主主义思想，属于旧民主主义的文化运动。\n② 1919年五四运动，是中国新民主主义革命的开端，是中国人民和中华民族自鸦片战争以来第一次全面觉醒。\n③ 五四以后的新文化运动，传播马克思主义，属于新民主主义的文化运动。\n④ 五四运动促进马克思主义与中国工人运动相结合，为中国共产党成立作了思想上和干部上的准备。","notes":"","source":"苏一《27命题点高清图谱》印刷第90页（PDF第95页）；依原图整理","source_pages":[90,92],"source_pdf_pages":[95,97],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":364},{"id":"suyi-history-p091-kf8b5bf-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","总框架 新民主主义革命的四个时期"],"type":"group","title":"新民主主义革命四阶段及关键会议","question":"大革命、土地革命、抗战、解放战争四阶段各有哪些重要节点？","answer":"① 大革命时期（1924—1927）：1924年国民党一大标志第一次国共合作正式形成；1925年五卅运动掀起全国大革命高潮；1926年北伐；1927年大革命失败、国共合作全面破裂。\n② 土地革命战争时期（1927—1937）：八七会议确定土地革命和武装反抗国民党反动派的总方针；古田会议确立思想建党、政治建军原则；九一八事变成为中国抗日战争起点；遵义会议集中解决军事和组织问题；瓦窑堡会议提出建立抗日民族统一战线。\n③ 全民族抗战时期（1937—1945）：卢沟桥事变；洛川会议确立全面抗战路线；第二次国共合作正式形成；六届六中全会提出“马克思主义的中国化”；延安整风；中共七大确立毛泽东思想指导地位；日本无条件投降。\n④ 解放战争时期（1945—1949）：全面内战爆发；转入战略进攻；辽沈、淮海、平津三大战役；七届二中全会；《论人民民主专政》；政协《共同纲领》。","notes":"","source":"苏一《27命题点高清图谱》印刷第91页（PDF第96页）；依原图整理","source_pages":[91],"source_pdf_pages":[96],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":365},{"id":"suyi-history-p091-kef0532-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","总框架 现代史的重要转折"],"type":"group","title":"新中国成立以来的重要转折与社会性质","question":"1949、1956、1978和2012分别开启什么阶段？几个“制度结束”和主要矛盾如何区别？","answer":"① 1949年中华人民共和国成立，进入新民主主义社会，开始社会主义革命和建设的历史阶段。\n② 1953年春，土地改革基本完成，废除了地主阶级封建剥削的土地所有制；这不是消灭一切私有制。\n③ 1956年三大改造基本完成，社会主义基本制度建立，实现从新民主主义到社会主义的过渡，进入社会主义社会和社会主义初级阶段。\n④ 1978年十一届三中全会开启改革开放和社会主义现代化建设新时期；1981年十一届六中全会通过第二个历史决议；1992年邓小平南方谈话推进改革开放。\n⑤ 2012年进入中国特色社会主义新时代；2017年党的十九大作出社会主要矛盾转化的重要判断；2021年十九届六中全会通过第三个历史决议；2022年党的二十大；2024年二十届三中全会。\n⑥ 辛亥革命结束的是封建君主专制制度；土地改革废除的是封建土地所有制；社会主义改造基本完成才使社会主义公有制成为社会经济制度的基础。","notes":"","source":"苏一《27命题点高清图谱》印刷第91页（PDF第96页）；依原图整理","source_pages":[91],"source_pdf_pages":[96],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":366},{"id":"suyi-history-p092-k7bc0c4-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","重要时间轴 1840—1926"],"type":"group","title":"从鸦片战争到第一次国共合作的时间链","question":"1840—1926年的救亡探索、思想传播和建党节点怎样衔接？","answer":"1840：鸦片战争，中国近代史起点。\n1851—1864：太平天国运动。\n19世纪60—90年代：洋务运动。\n1894：兴中会成立；甲午战争爆发。\n1898：戊戌维新运动。\n1905：中国同盟会成立，三民主义提出。\n1911：辛亥革命爆发。\n1912：中华民国临时政府成立、清帝退位、《中华民国临时约法》颁布。\n1915：新文化运动兴起。\n1917：护法运动、俄国十月革命。\n1919：五四运动；《我的马克思主义观》较系统介绍马克思主义。\n1921：中共一大。\n1922：中共二大，第一次提出明确的反帝反封建民主革命纲领。\n1923：中共三大决定共产党员以个人身份加入国民党。\n1924：国民党一大，第一次国共合作正式形成，新三民主义成为共同纲领。\n1925：五卅运动。\n1926：北伐战争开始。","notes":"","source":"苏一《27命题点高清图谱》印刷第92页（PDF第97页）；依原图整理","source_pages":[92],"source_pdf_pages":[97],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":367},{"id":"suyi-history-p092-k4118dd-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","重要时间轴 1927—1937"],"type":"group","title":"土地革命战争时期的关键节点","question":"1927年的起义、会议和改编分别解决什么问题？之后的关键转折是什么？","answer":"1927年8月1日：南昌起义，武装反抗国民党反动派的第一枪，是党独立领导革命战争、创建人民军队和武装夺取政权的开端。\n8月7日：八七会议，确定土地革命和武装反抗国民党反动派的总方针。\n9月：湘赣边界秋收起义，打出工农革命军旗帜；三湾改编，建设新型人民军队的重要开端。\n10月：开始创建井冈山农村革命根据地，中国革命重心开始从城市转向农村。\n1928年：《井冈山土地法》。1929年：《兴国土地法》；古田会议。\n1931年：土地革命阶级路线和土地分配方法基本形成；九一八事变；中华苏维埃共和国临时中央政府成立。\n1935年：遵义会议；瓦窑堡会议。\n1936年：长征胜利，革命由挫折转向胜利；西安事变和平解决，十年内战局面基本结束，国内和平初步实现。\n1937年：卢沟桥事变、洛川会议、第二次国共合作正式形成。","notes":"","source":"苏一《27命题点高清图谱》印刷第92页（PDF第97页）；依原图整理","source_pages":[92],"source_pdf_pages":[97],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":368},{"id":"suyi-history-p092-k816cab-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","重要时间轴 革命理论著作"],"type":"group","title":"1928—1937年革命道路探索与理论总结","question":"毛泽东在革命道路探索和迎接抗战时期的代表著作及意义是什么？","answer":"① 1928—1930年：《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》《反对本本主义》。农村包围城市、武装夺取政权道路理论的形成，标志毛泽东思想初步形成。\n② 1935年《论反对日本帝国主义的策略》、1936年《中国革命战争的战略问题》、1937年《实践论》《矛盾论》，总结历史经验、迎接全民族抗战。\n③ 《实践论》《矛盾论》揭露“左”倾教条主义错误的思想根源，科学阐明党的马克思主义思想路线。","notes":"","source":"苏一《27命题点高清图谱》印刷第92页（PDF第97页）；依原图整理","source_pages":[92],"source_pdf_pages":[97],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":369},{"id":"suyi-history-p093-k1fcce9-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","重要时间轴 1938—1945"],"type":"group","title":"抗战时期思想建设与胜利的时间链","question":"六届六中全会、整风、七大和抗战胜利怎样衔接？","answer":"1938年5—6月：《论持久战》，批驳“亡国论”“速胜论”，指出兵民是胜利之本。\n1938年9—11月：六届六中全会提出“马克思主义的中国化”；10月广州、武汉失守，抗战进入战略相持阶段。\n1939—1940年：《〈共产党人〉发刊词》《中国革命和中国共产党》《新民主主义论》，新民主主义革命理论系统阐明，毛泽东思想多方面展开而达到成熟。\n1941—1945年：延安整风，代表文献《改造我们的学习》《整顿党的作风》《反对党八股》。六届七中全会通过《关于若干历史问题的决议》。\n1945年4—6月：中共七大，把毛泽东思想确立为党的指导思想，标志党在政治上、思想上、组织上走向成熟。\n1945年8月15日：日本宣布无条件投降；10月25日台湾光复，标志抗战取得完全胜利。","notes":"","source":"苏一《27命题点高清图谱》印刷第93页（PDF第98页）；依原图整理","source_pages":[93],"source_pdf_pages":[98],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":370},{"id":"suyi-history-p093-k7dc159-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","重要时间轴 1945—1949"],"type":"group","title":"从争取和平到新中国成立","question":"和平谈判、土地政策、军事转折与新中国成立的节点是什么？","answer":"1945年8月：提出“和平、民主、团结”口号；10月10日签订《双十协定》。\n1946年1月：政治协商会议；5月4日《关于土地问题的指示》；6月全面内战爆发。\n1947年7月：人民解放军转入战略进攻；全国土地会议制定《中国土地法大纲》；10月提出“打倒蒋介石，解放全中国”口号。\n1948年4月：“五一口号”为共产党领导的多党合作和政治协商制度奠定基础；9月开始辽沈战役，11月开始淮海、平津战役。\n1949年3月：七届二中全会，工作重心从乡村转向城市。\n1949年6月：《论人民民主专政》。9月政协通过《共同纲领》，新型政党制度确立。\n1949年10月1日：中华人民共和国成立，中国人民站起来了。","notes":"","source":"苏一《27命题点高清图谱》印刷第93页（PDF第98页）；依原图整理","source_pages":[93],"source_pdf_pages":[98],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":371},{"id":"suyi-history-p093-kdb1b70-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","重要时间轴 1950—1957"],"type":"group","title":"社会主义革命与建设初探的节点","question":"恢复经济、土地改革、改造、人大制度和社会主义建设初探的时间如何对应？","answer":"1950年6月：七届三中全会，以争取国家财政经济状况基本好转为中心任务；朝鲜战争爆发，随后抗美援朝。\n1950—1953年春：新解放区土地改革；《中华人民共和国土地改革法》保护富农经济，是我国历史上规模最大的一次土地改革。\n1953—1956：农业、手工业、资本主义工商业社会主义改造。\n1954年9月：第一届全国人大第一次会议召开，人民代表大会制度正式建立。\n1956年：社会主义改造基本完成，社会主义基本制度建立；4月提出马克思主义与中国实际“第二次结合”，《论十大关系》；9月中共八大。\n1957年2月：《关于正确处理人民内部矛盾的问题》，区分敌我矛盾和人民内部矛盾，以不同方法处理。","notes":"","source":"苏一《27命题点高清图谱》印刷第93页（PDF第98页）；依原图整理","source_pages":[93],"source_pdf_pages":[98],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":372},{"id":"suyi-history-p093-kea721f-g01","revision":1,"path":["史纲","总览 中国近现代史纲要","重要时间轴 1978—2024"],"type":"group","title":"改革开放以来的重要会议时间链","question":"十一届三中、六中全会到二十届三中全会分别有什么关键内容？","answer":"1978年12月13日：《解放思想，实事求是，团结一致向前看》，成为解放思想、开辟新时期新道路的宣言书；12月18—22日十一届三中全会，实现伟大历史转折。\n1981年6月：十一届六中全会通过《关于建国以来党的若干历史问题的决议》，指导思想上的拨乱反正胜利完成。\n1992年：邓小平南方谈话，解决长期束缚思想的重大问题；中共十四大明确建立社会主义市场经济体制目标。\n2012年：党的十八大，中国特色社会主义进入新时代。\n2017年：党的十九大。\n2021年：十九届六中全会通过《中共中央关于党的百年奋斗重大成就和历史经验的决议》。\n2022年：党的二十大。\n2024年：二十届三中全会。","notes":"","source":"苏一《27命题点高清图谱》印刷第93页（PDF第98页）；依原图整理","source_pages":[93],"source_pdf_pages":[98],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":373},{"id":"suyi-history-p094-k01-g01","revision":1,"path":["史纲","第一章 进入近代后中华民族的磨难与抗争","考点1 鸦片战争的爆发"],"type":"group","title":"鸦片战争与不平等条约","question":"鸦片战争为何是近代史起点？四次侵华战争对应哪些条约及社会变化？","answer":"① 鸦片战争发生于1840年6月至1842年8月。中国战败，被迫签订近代第一个不平等条约——中英《南京条约》，英国攫取一系列侵略特权。\n② 外国资本主义入侵使中国封建社会逐步变为半殖民地半封建社会，社会主要矛盾随之变化，中国人民逐渐开始反帝反封建的资产阶级民主革命。因此鸦片战争是中国近代史的起点。\n③ 1842年《南京条约》：中国开始沦为半殖民地半封建社会。1843年《五口通商章程》《虎门条约》是其附件；此后还有中美《望厦条约》、中法《黄埔条约》。\n④ 1858年《天津条约》允许外国公使常驻北京，便利列强控制中国内政外交；1860年《北京条约》扩大侵略权益。\n⑤ 1895年《马关条约》割台湾、澎湖列岛及辽东半岛等，中国半殖民地化程度大大加深。\n⑥ 1901年《辛丑条约》使中国完全陷入半殖民地半封建社会的深渊，清政府成为“洋人的朝廷”。","notes":"","source":"苏一《27命题点高清图谱》印刷第94页（PDF第99页）；依原图整理","source_pages":[94],"source_pdf_pages":[99],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":374},{"id":"suyi-history-p094-k02-g01","revision":1,"path":["史纲","第一章 进入近代后中华民族的磨难与抗争","考点2 近代中国社会的半殖民地半封建性质"],"type":"group","title":"半殖民地半封建社会的形成原因","question":"“半殖民地”和“半封建”分别指什么？怎样理解政治、经济上的变化与保留？","answer":"① 半殖民地：列强通过战争与不平等条约破坏中国领土、领海、关税、司法等主权，控制政治、经济、外交和军事。中国丧失完全独立地位，在相当程度上被殖民地化；但清政府仍统治中国，中国还保留一定主权，区别于完全殖民地。\n② 半封建：外国资本入侵打破闭关状态，把中国卷入世界资本主义经济体系，破坏自然经济基础、农村手工业和家庭手工业，促进商品经济发展，为中国资本主义生产关系产生创造条件，中国已不是完全的封建社会。\n③ 同时，帝国主义勾结封建势力压制中国资本主义，民族资本主义有一定发展却始终不能成为经济主要形式；广大农村地主剥削农民的封建生产关系仍占显著优势。\n④ 近代中国既不是完全封建经济，也不是完全资本主义经济，而是半殖民地半封建经济。帝国主义成为支配中国、阻碍中国发展的决定性力量；封建剥削制度仍是基础，人民贫困、生活痛苦。","notes":"","source":"苏一《27命题点高清图谱》印刷第94页（PDF第99页）；依原图整理","source_pages":[94],"source_pdf_pages":[99],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":375},{"id":"suyi-history-p094-k03-g01","revision":1,"path":["史纲","第一章 进入近代后中华民族的磨难与抗争","考点3 近代中国社会阶级关系的变动"],"type":"group","title":"旧阶级的变化与新阶级的出现","question":"地主、农民发生什么变化？工人阶级和资产阶级怎样产生，有何特点？","answer":"① 地主阶级：部分地主从乡村进入城市成为城居地主；部分把地租收入投入资本主义工商业，转化为资本家。\n② 农民阶级：部分失地后成为贫雇农，部分破产流入城市，成为产业工人的后备军。\n③ 工人阶级：主要来自破产农民、手工业者和城市贫民，最早在19世纪四五十年代外商企业产生，先于民族资产阶级；受帝国主义、封建势力和资产阶级三重压迫，革命性最强；组织纪律性强、集中团结，同广大农民有天然联系，是近代中国最革命的阶级和先进生产力的代表。\n④ 资产阶级：在外国资本主义入侵的影响和刺激下，由部分买办、商人、地主、官僚投资新式企业转化而来，包括官僚买办资本家和民族资本家。\n⑤ 民族资本家受外国资本主义、本国封建主义压迫，又同两者有千丝万缕的联系，在政治上表现为两面性。","notes":"","source":"苏一《27命题点高清图谱》印刷第94页（PDF第99页）；依原图整理","source_pages":[94],"source_pdf_pages":[99],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":376},{"id":"suyi-history-p094-k04-g01","revision":1,"path":["史纲","第一章 进入近代后中华民族的磨难与抗争","考点4 近代中国的社会主要矛盾和两大历史任务"],"type":"group","title":"两对主要矛盾与两大历史任务","question":"近代中国两对主要矛盾中哪一对最主要？两大任务为何必须先后衔接？","answer":"① 帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，是近代中国的主要矛盾；前者是最主要的矛盾。\n② 争得民族独立、人民解放，必须首先进行反帝反封建的民主革命，推翻帝国主义和封建主义联合统治的半殖民地半封建社会制度。\n③ 实现国家富强、人民幸福，必须改变经济技术落后面貌，解放和发展社会生产力。\n④ 两项任务的主题、内容和实现方式不同：前者主题是革命，重在改变落后生产关系和上层建筑；后者主题是建设，重在发展生产力。\n⑤ 前一任务为后一任务扫清障碍，是前提；后一任务是最终目的和必然要求。","notes":"","source":"苏一《27命题点高清图谱》印刷第94页（PDF第99页）；依原图整理","source_pages":[94],"source_pdf_pages":[99],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":377},{"id":"suyi-history-p095-k05-g01","revision":1,"path":["史纲","第一章 进入近代后中华民族的磨难与抗争","考点5 西方列强对中国的侵略"],"type":"group","title":"列强侵华的四种方式","question":"四种侵略方式分别表现为什么？哪一种是首要方式？","answer":"① 军事侵略是首要和主要方式：发动侵略战争，屠杀中国人民，侵占领土、划分势力范围，勒索赔款、抢夺财富。\n② 政治控制：控制中国内政外交，例如把持中国海关；镇压人民反抗；扶植、收买代理人。\n③ 经济掠夺：控制通商口岸，剥夺关税自主权，实行商品倾销与资本输出，操纵经济命脉。\n④ 文化渗透：披着宗教外衣进行侵略活动，为侵略制造舆论，以奴化思想麻醉人民。\n列强侵略的根本目的不是发展中国，而是压迫和掠夺中国。","notes":"","source":"苏一《27命题点高清图谱》印刷第95页（PDF第100页）；依原图整理","source_pages":[95],"source_pdf_pages":[100],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":378},{"id":"suyi-history-p095-k06-g01","revision":1,"path":["史纲","第一章 进入近代后中华民族的磨难与抗争","考点6 抵御外来侵略的斗争历程"],"type":"group","title":"人民群众与爱国官兵的反侵略斗争","question":"三元里抗英、收复新疆和镇南关大捷分别有什么意义？","answer":"① 1841年广州三元里人民抗英斗争，是中国近代史上中国人民第一次大规模反侵略武装斗争。\n② 1876年左宗棠率部开始收复新疆，经两年浴血奋战收复新疆，挫败分裂势力，维护了国家领土与主权完整。\n③ 中法战争中，老将冯子材身先士卒，取得镇南关大捷，体现爱国官兵的英勇抗争。","notes":"","source":"苏一《27命题点高清图谱》印刷第95页（PDF第100页）；依原图整理","source_pages":[95],"source_pdf_pages":[100],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":379},{"id":"suyi-history-p095-k07-g01","revision":1,"path":["史纲","第一章 进入近代后中华民族的磨难与抗争","考点7 义和团运动与列强瓜分中国图谋的破产"],"type":"group","title":"边疆危机、瓜分狂潮及其影响","question":"甲午战后瓜分危机怎样形成？三国干涉还辽反映了什么？","answer":"① 19世纪七八十年代，列强从陆海边疆侵入：中国西藏、新疆、西南、台湾等受到威胁，中国陷入边疆危机。\n② 甲午战后，《马关条约》割地条款刺激列强瓜分中国的野心，并激化列强争夺中国的矛盾。\n③ 德、俄、法三国干涉还辽，迫使日本放弃割占辽东半岛的要求，反映列强在华利益冲突；三国又以干涉“有功”为由向中国索取利益。\n④ 1896—1899年列强竞相租借港湾、划分势力范围，掀起瓜分狂潮。\n⑤ 甲午战争失败使民族危机空前加深，激发中国人民民族意识普遍觉醒，宣告以“自强”“求富”为目标的洋务运动失败。","notes":"","source":"苏一《27命题点高清图谱》印刷第95页（PDF第100页）；依原图整理","source_pages":[95],"source_pdf_pages":[100],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":380},{"id":"suyi-history-p095-k07-g02","revision":1,"path":["史纲","第一章 进入近代后中华民族的磨难与抗争","考点7 义和团运动与列强瓜分中国图谋的破产"],"type":"group","title":"义和团运动与瓜分图谋的破产","question":"列强瓜分中国图谋为何破产？义和团运动的作用和局限分别是什么？","answer":"① 根本原因：中华民族进行不屈不挠的反侵略斗争。\n② 重要原因：帝国主义列强之间的矛盾和相互制约；中国长期是统一大国也是重要条件。\n③ 义和团运动在粉碎列强瓜分中国的斗争中发挥重大历史作用，显示中国人民不畏强暴、敢于浴血奋战的英雄气概，打击和教训侵略者，使其不敢为所欲为地瓜分中国。\n④ 局限：不认识帝国主义联合地主阶级压迫人民的实质，对清王朝抱有幻想；有笼统排外、迷信和落后倾向。","notes":"","source":"苏一《27命题点高清图谱》印刷第95页（PDF第100页）；依原图整理","source_pages":[95],"source_pdf_pages":[100],"content_status":"VISUALLY_REORGANIZED","source_method":"原图逐页阅读、按完整知识分支重组；非逐字影印复刻","order":381},{"id":"suyi-history-p095-k08-g01","revision":1,"path":["史纲","第一章 进入近代后中华民族的磨难与抗争","考点8 反侵略战争失败的原因"],"type":"group","title":"反侵略战争失败的根本原因和重要原因","question":"社会制度腐败与经济技术落后怎样分别影响反侵略战争？","answer":"① 根本原因是社会制度的腐败。清朝统治集团昏庸愚昧，不能有效组织反侵略战争，甚至压制人民反抗。\n② 重要原因是经济技术落后。西方资本主义国家经过工业革命，经济与技术迅速发展，中国封建统治者闭目塞听、闭关自守，落后于时代。\n③ 两者不能对调，不能只用武器落后来解释失败。中法战争“中国不败而败、法国不胜而胜”尤其体现统治制度腐败的影响。","notes":"","source":"苏一《27命题点高清图谱》印刷第95页（PDF第100页）；依原图整理","source_pages":
