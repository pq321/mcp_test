<script>window.POLITICS_PACK={"schema_version":1,"pack_id":"politics-suyi-full","pack_revision":7,"title":"苏一全科·完整知识组成组背诵","source_book":"27苏一命题点高清图谱【完整版】","source_printed_pages":[1,135],"source_pdf_pages":[6,140],"content_status":"FULL_SUBJECT_INITIAL_GROUPED_EDITION","cards":[{"id":"suyi-marx-p001-n002-g01","revision":1,"path":["马原","全科框架","全科框架 导论"],"type":"group","title":"全科框架 导论","question":"这一板块包括哪些章节和核心问题？它们之间怎样衔接？","answer":"什么是马克思主义\n\n马克思主义的创立与发展\n\n马克思主义的基本特征\n\n马克思主义的当代价值","notes":"","source":"苏一《27命题点高清图谱》印刷第1页；按原分支整理","source_pages":[1],"source_pdf_pages":[6],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p006_n003","p006_n004","p006_n005","p006_n006"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":1},{"id":"suyi-marx-p001-n007-g01","revision":1,"path":["马原","全科框架","全科框架 马克思主义哲学"],"type":"group","title":"全科框架 马克思主义哲学","question":"这一板块包括哪些章节和核心问题？它们之间怎样衔接？","answer":"第一章 世界的物质性及发展规律：唯物论：一个基本问题：哲学基本问题；五大观点：物质观、运动观、时空观、实践观、意识观；一个统一：世界的物质统一性；唯物辩证法：总观点和总特征：联系和发展；三大规律：对立统一规律（矛盾）：源泉和动力；量变质变规律：状态和形式；否定之否定规律：方向和道路；五个基本环节：内容与形式；本质与现象；原因与结果；必然与偶然；现实与可能。\n\n第二章 实践与认识及其发展规律：认识论：实践与认识：什么是实践：实践的本质与基本结构；实践对认识的决定作用；什么是认识：认识的本质；认识运动的两次飞跃；实践与认识的辩证运动及其规律；真理与价值：真理（客观性、一元性、绝对性和相对性）；真理与谬误；实践是检验真理的唯一标准；真理与价值；认识世界和改造世界：认识世界和改造世界相结合；一切从实际出发，实事求是；坚持守正创新，实现理论创新和实践创新的良性互动。\n\n第三章 人类社会及其发展规律：唯物史观：人类社会的存在与发展：社会存在与社会意识：社会存在：①自然地理环境；②人口因素；③物质生产方式（决定力量）；社会意识；生产力与生产关系：生产力：劳动者（最活跃）；劳动对象（必要前提）；劳动资料（其中最重要的是生产工具）；生产关系：生产资料所有制关系；生产中人与人的关系；产品分配关系；经济基础与上层建筑：经济基础（骨骼）≈生产关系；上层建筑（血肉）：观念上层建筑（即意识形态）；政治上层建筑；人类普遍交往；社会形态更替：原始社会→奴隶社会→封建社会→资本主义社会→共产主义社会；社会历史发展的动力：社会基本矛盾（根本动力）、阶级斗争、革命、改革、科学技术、文化；人民群众在历史发展中的作用。","notes":"","source":"苏一《27命题点高清图谱》印刷第1页；按原分支整理","source_pages":[1],"source_pdf_pages":[6],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p006_n008","p006_n009","p006_n010","p006_n011","p006_n012","p006_n013","p006_n014","p006_n015","p006_n016","p006_n017","p006_n018","p006_n019","p006_n020","p006_n021","p006_n022","p006_n023","p006_n024","p006_n025","p006_n026","p006_n027","p006_n028","p006_n029","p006_n030","p006_n031","p006_n032","p006_n033","p006_n034","p006_n035","p006_n036","p006_n037","p006_n038","p006_n039","p006_n040","p006_n041","p006_n042","p006_n043","p006_n044","p006_n045","p006_n046","p006_n047","p006_n048","p006_n049","p006_n050","p006_n051","p006_n052","p006_n053","p006_n054","p006_n055","p006_n056","p006_n057","p006_n058","p006_n059","p006_n060","p006_n061","p006_n062","p006_n063","p006_n064","p006_n065","p006_n066","p006_n067","p006_n068","p006_n069","p006_n070","p006_n071","p006_n072","p006_n073","p006_n074","p006_n075","p006_n076","p006_n077","p006_n078","p006_n079"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p006_a001","kind":"补充说明","text":"认识通过实践来检验其是否正确\n正确认识：真理\n错误认识：谬误","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":2},{"id":"suyi-marx-p002-n002-g01","revision":1,"path":["马原","全科框架","全科框架 马克思主义政治经济学"],"type":"group","title":"全科框架 马克思主义政治经济学","question":"这一板块包括哪些章节和核心问题？它们之间怎样衔接？","answer":"第四章 资本主义的本质及规律：商品经济理论：商品经济的形成和发展；商品的二因素（使用价值与价值）；劳动二重性（具体劳动与抽象劳动）；商品价值量的决定；价值形式的发展与货币的产生、价值规律；以私有制为基础的商品经济的基本矛盾；剩余价值理论：资本主义经济制度的产生；劳动力成为商品与货币转化为资本；资本主义生产过程、资本的区分；剩余价值生产的两种基本方法；生产自动化条件下剩余价值的源泉；资本主义工资、剩余价值转化为利润；平均利润的形成和剩余价值的分配；剩余价值理论的意义；资本理论：资本积累；资本循环；资本周转；社会再生产；资本主义的基本矛盾与经济危机；资本主义上层建筑。\n\n第五章 资本主义的发展及其趋势：垄断理论：垄断资本主义的形成：生产集中与垄断的形成；垄断条件下竞争的特点；金融资本与金融寡头；垄断利润和垄断价格；垄断资本主义的发展：国家垄断资本主义的形成及作用；金融垄断资本的发展；垄断资本向世界范围的扩展；垄断资本国际化条件下的垄断组织；垄断资本主义的基本特征和实质；经济全球化：表现、动因、影响；正确认识当代资本主义的新变化：第二次世界大战后资本主义的变化及其实质；当代资本主义变化的新特征（4个新特征）；世界大变局下资本主义的矛盾与冲突；资本主义的历史地位和发展趋势。","notes":"","source":"苏一《27命题点高清图谱》印刷第2页；按原分支整理","source_pages":[2],"source_pdf_pages":[7],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p007_n003","p007_n004","p007_n005","p007_n006","p007_n007","p007_n008","p007_n009","p007_n010","p007_n011","p007_n012","p007_n013","p007_n014","p007_n015","p007_n016","p007_n017","p007_n018","p007_n019","p007_n020","p007_n021","p007_n022","p007_n023","p007_n024","p007_n025","p007_n026","p007_n027","p007_n028","p007_n029","p007_n030","p007_n031","p007_n032","p007_n033","p007_n034","p007_n035","p007_n036","p007_n037","p007_n038","p007_n039","p007_n040","p007_n041","p007_n042","p007_n043","p007_n044","p007_n045","p007_n046"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p007_a001","kind":"问题提示","text":"“财富”在资本主义社会是以什么形式存在的？","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p007_a002","kind":"问题提示","text":"资本是如何增殖的？钱到底是怎么赚来的？","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p007_a003","kind":"问题提示","text":"资本是如何运动的？资本主义为什么会爆发危机？","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":3},{"id":"suyi-marx-p002-n047-g01","revision":1,"path":["马原","全科框架","全科框架 科学社会主义"],"type":"group","title":"全科框架 科学社会主义","question":"这一板块包括哪些章节和核心问题？它们之间怎样衔接？","answer":"第六章 社会主义的发展及其规律：社会主义五百年的历史进程；科学社会主义基本原则；在实践中探索社会主义的发展规律。\n\n第七章 共产主义崇高理想及其最终实现：展望未来共产主义新社会；实现共产主义是历史发展的必然趋势；共产主义远大理想与中国特色社会主义共同理想。","notes":"","source":"苏一《27命题点高清图谱》印刷第2页；按原分支整理","source_pages":[2],"source_pdf_pages":[7],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p007_n048","p007_n049","p007_n050","p007_n051","p007_n052","p007_n053","p007_n054","p007_n055"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":4},{"id":"suyi-marx-p003-n002-g01","revision":1,"path":["马原","导论","考点1：什么是马克思主义"],"type":"group","title":"什么是马克思主义","question":"围绕什么是马克思主义，马克思主义的科学内涵、马克思主义基本原理分别是什么？","answer":"1.马克思主义的科学内涵：（1）由马克思、恩格斯创立并为后继者所不断发展的科学理论体系；（2）关于自然、社会和人类思维发展一般规律的学说；（3）关于社会主义必然代替资本主义、最终实现共产主义的学说；（4）关于无产阶级解放、全人类解放和每个人自由而全面发展的学说；（5）是无产阶级政党和社会主义国家的指导思想；（6）是指引人民创造美好生活的行动指南。\n\n2.马克思主义基本原理：是对马克思主义立场观点方法的集中概括，是马克思主义在其形成、发展和运用过程中经过实践反复检验而确立起来的具有普遍真理性的理论。","notes":"","source":"苏一《27命题点高清图谱》印刷第3页；按原分支整理","source_pages":[3],"source_pdf_pages":[8],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p008_n003","p008_n004","p008_n005","p008_n006","p008_n007","p008_n008","p008_n009","p008_n010","p008_n011"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":5},{"id":"suyi-marx-p003-n012-g01","revision":1,"path":["马原","导论","考点2：马克思主义的创立与发展"],"type":"group","title":"马克思主义的创立与发展","question":"围绕马克思主义的创立与发展，创立条件、创立过程（著作）、发展分别是什么？","answer":"1.创立条件：（1）社会根源（客观条件）：资本主义经济的发展为马克思主义的产生提供了经济、社会历史条件；（2）阶级基础（现实需求）：无产阶级在反抗资产阶级剥削和压迫的斗争中，逐步走向自觉，并迫切渴望科学的理论指导；三大工人运动：①法国里昂工人起义 ②英国宪章运动 ③德国西里西亚纺织工人起义；标志着现代无产阶级作为独立的政治力量登上了历史舞台；觉醒了的无产阶级迫切需要总结和升华自身的斗争经验，形成科学的革命理论，以指导自身的解放斗争；（3）思想渊源（主观条件）：马克思、恩格斯的革命实践和对人类文明成果的继承与创新；直接理论来源：①德国古典哲学 ②英国古典政治经济学 ③英法空想社会主义；自然科学前提：①细胞学说 ②能量守恒与转化定律 ③生物进化论。\n\n2.创立过程（著作）：（1）《德法年鉴》上的论文（马、恩）：马克思、恩格斯完成了从唯心主义到唯物主义、从革命民主主义向共产主义的转变，为创立马克思主义奠定了思想前提；（2）《神圣家族》（马、恩）：马克思、恩格斯的第一部合著；（3）《德意志意识形态》（马、恩）：首次系统阐述了历史唯物主义的基本观点；（4）《共产党宣言》（马克思、恩格斯）：标志着马克思主义的公开问世；共产主义者同盟是马克思和恩格斯建立的第一个无产阶级政党；（5）《关于费尔巴哈的提纲》（马克思）：被称为包含着新世界观的天才萌芽的第一个文件；提出“哲学家们只是用不同的方式解释世界，问题在于改变世界”；（6）《资本论》（马）：马克思主义最厚重、最丰富的著作，被誉为“工人阶级的圣经”；（7）《法兰西内战》（马）：科学总结了巴黎公社的历史经验；（8）《哥达纲领批判》（马）：进一步丰富了科学社会主义学说；（9）《反杜林论》（恩）：全面阐述马克思主义理论体系，被称为马克思主义的“百科全书”。\n\n3.发展：（1）列宁：经济政治发展不平衡已成为资本主义发展的绝对规律；提出“社会主义革命可能在一国或数国首先发生并取得胜利”的论断；（2）十月革命：列宁领导的十月革命，实现了社会主义从理想到现实的伟大飞跃，开辟了人类历史的新纪元；（3）中国：马克思主义中国化时代化：①本土化和时代化是马克思主义创新发展的基本路径；②习近平新时代中国特色社会主义思想的世界观、方法论：“六个必须坚持”。","notes":"","source":"苏一《27命题点高清图谱》印刷第3页；按原分支整理","source_pages":[3],"source_pdf_pages":[8],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p008_n013","p008_n014","p008_n015","p008_n016","p008_n017","p008_n018","p008_n019","p008_n020","p008_n021","p008_n022","p008_n023","p008_n024","p008_n025","p008_n026","p008_n027","p008_n028","p008_n029","p008_n030","p008_n031","p008_n032","p008_n033","p008_n034","p008_n035","p008_n036","p008_n037","p008_n038","p008_n039","p008_n040","p008_n041","p008_n042","p008_n043","p008_n044","p008_n045","p008_n046","p008_n047"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p008_a002","kind":"政治素养","text":"政治素养：\n《共产党宣言》是马克思、恩格斯为共产主义者同盟这个政党起草的党纲","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":6},{"id":"suyi-marx-p003-n048-g01","revision":1,"path":["马原","导论","考点3：马克思主义的基本特征"],"type":"group","title":"马克思主义的基本特征","question":"马克思主义的基本特征包括哪几方面？每项具体表现为什么？","answer":"1.基本特征：（1）科学的理论（科学性）：①马克思主义是对自然、社会和人类思维发展本质和规律的正确反映；②马克思主义具有科学的世界观和方法论基础，即辩证唯物主义和历史唯物主义，这是马克思主义的一个突出特征和理论优势，也是马克思主义科学性的重要体现；（2）人民的理论（人民性）：①人民性是马克思主义的本质属性，人民至上是马克思主义的政治立场；②马克思主义的人民性是以阶级性为深刻基础的，是无产阶级先进性的体现；（3）实践的理论（实践性）：①马克思主义是从实践中来、到实践中去、在实践中接受检验，并随实践而不断发展的学说；②实践观点是马克思主义首要的和基本的观点；（4）发展的理论（发展性）：①发展：马克思主义是不断发展的学说，具有与时俱进的理论品质；②开放：马克思主义不断吸取人类最新的文明成果来充实和发展自己。\n\n2.马克思主义的基本特征，用一句话概括：科学性与革命性的统一：（1）革命性是马克思主义的内在品质，是人民性、实践性、发展性的应有之义和必然要求；（2）革命性是建立在科学性基础上的，与科学性高度统一。","notes":"","source":"苏一《27命题点高清图谱》印刷第3页；按原分支整理","source_pages":[3],"source_pdf_pages":[8],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p008_n049","p008_n050","p008_n051","p008_n052","p008_n053","p008_n054","p008_n055","p008_n056","p008_n057","p008_n058","p008_n059","p008_n060","p008_n061","p008_n062","p008_n063","p008_n064"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":7},{"id":"suyi-marx-p003-n065-g01","revision":1,"path":["马原","导论","考点4：马克思主义的当代价值"],"type":"group","title":"马克思主义的当代价值","question":"马克思主义的当代价值体现在哪些方面？相关定位和适用条件是什么？","answer":"1.当代价值：（1）观察当代世界变化的认识工具 （2）指引当代中国发展的行动指南 （3）引领人类社会进步的科学真理\n\n2.马克思主义之所以行的根本原因在于：马克思主义是科学的世界观和方法论","notes":"","source":"苏一《27命题点高清图谱》印刷第3页；按原分支整理","source_pages":[3],"source_pdf_pages":[8],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p008_n066","p008_n067"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":8},{"id":"suyi-marx-p004-n003-g01","revision":1,"path":["马原","第一章 唯物论","考点1：哲学基本问题（世界是什么？）"],"type":"group","title":"哲学基本问题（世界是什么？）","question":"哲学基本问题（世界是什么？）的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"存在和思维的关系问题，包括两个方面\n\n1.第一方面：存在和思维、物质和意识谁为本原的问题，即何者为第一性（划分唯物主义和唯心主义）：（1）唯物主义：物质第一性（世界的本原是物质、存在，即唯物主义一元论）；（2）唯心主义：精神第一性（世界的本原是精神、意识、思维，即唯心主义一元论）：①主观唯心主义：世界本原是人的感觉、观念；关键词：感觉、精神、心、观念；②客观唯心主义：世界本原是脱离人而单独存在的某种客观精神；关键词：道、理、宇宙精神、绝对观念、上帝、神。\n\n2.第二方面：思维能否正确认识存在，即思维和存在有无同一性（划分可知论和不可知论）：（1）可知论：思维和存在具有同一性：思维能正确地反映存在、人能认识或彻底认识世界；“世界只有尚未认识之物，没有不可认识之物”；（2）不可知论：思维和存在不具有同一性：思维不能正确地反映存在、人不能认识或彻底认识世界。","notes":"","source":"苏一《27命题点高清图谱》印刷第4页；按原分支整理","source_pages":[4],"source_pdf_pages":[9],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p009_n004","p009_n005","p009_n006","p009_n007","p009_n008","p009_n009","p009_n010","p009_n011","p009_n012","p009_n013","p009_n014","p009_n015","p009_n016","p009_n017","p009_n018","p009_n019"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":9},{"id":"suyi-marx-p004-n021-g01","revision":1,"path":["马原","第一章 唯物论","考点2：哲学重要问题（世界怎样存在？）"],"type":"group","title":"哲学重要问题（世界怎样存在？）","question":"围绕哲学重要问题（世界怎样存在？），辩证法、形而上学分别是什么？","answer":"1.辩证法：（1）世界是联系发展的，发展的根本原因在于事物的内部矛盾；（2）特点：联系、发展、全面、承认矛盾。\n\n2.形而上学：（1）世界是孤立静止的，否认内部矛盾的存在和作用；（2）特点：孤立、静止、片面、否认矛盾。","notes":"","source":"苏一《27命题点高清图谱》印刷第4页；按原分支整理","source_pages":[4],"source_pdf_pages":[9],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p009_n022","p009_n023","p009_n024","p009_n025","p009_n026","p009_n027"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":10},{"id":"suyi-marx-p004-n029-g01","revision":1,"path":["马原","第一章 唯物论","考点3：物质观"],"type":"group","title":"物质观","question":"物质观的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.物质范畴是一切唯物主义哲学的理论基石\n\n2.探索过程：（1）古代朴素唯物主义：把物质等同于具体的物质形态；（2）近代形而上学唯物主义：把物质等同于物质的微观结构层次——原子；（3）现代辩证唯物主义：从无限多样的物质现象中抽象出共同的特性，从哲学上作了最高概括：客观实在性是物质最本质的规定。\n\n3.马克思、恩格斯实现了物质观上的重大变革：（1）科学总结了哲学和自然科学发展的成果，继承了以往唯物主义关于世界物质性的基本观点；（2）批判了旧唯物主义对物质世界的直观、消极、机械的理解；（3）强调要用辩证的观点把握世界，特别是要从实践出发去把握现实世界，从自然存在和社会存在的统一中把握世界的物质性；（4）深刻揭示了社会存在的客观实在性，克服了旧唯物主义物质观局限于自然领域的缺陷，把唯心主义从社会历史领域中彻底驱除出去。\n\n4.科学的物质观：（1）马克思主义的“物质”范畴是一个高度抽象的哲学概念，是对世界上客观存在的各种事物共同本质的概括；（2）恩格斯：从个性与共性的关系把握（初步概括） 自然科学物质概念与哲学物质概念=个性与共性的关系；（3）列宁：从物质与意识的关系把握（全面科学的规定）：物质是标志客观实在的哲学范畴，这种客观实在：①是人通过感觉感知的；②不依赖于我们的感觉而存在；③为我们的感觉所复写、摄影、反映；物质的共同特性（唯一特性）是客观实在性，它不依赖于人类的意识而存在，并能为人类的意识所反映。\n\n5.意义：（1）坚持了唯物主义一元论，同唯心主义一元论和二元论划清了界限；（2）坚持了能动的反映论和可知论，批判了不可知论；（3）体现了唯物论和辩证法的统一，克服了形而上学唯物主义的缺陷：马克思主义物质观体现的唯物辩证法：①从个性中看到共性；②从相对中找到绝对；③从暂时中发现永恒；（4）体现了唯物主义自然观与历史观的统一，为彻底的唯物主义奠定了理论基础。","notes":"","source":"苏一《27命题点高清图谱》印刷第4页；按原分支整理","source_pages":[4],"source_pdf_pages":[9],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p009_n030","p009_n031","p009_n032","p009_n033","p009_n034","p009_n035","p009_n036","p009_n037","p009_n038","p009_n039","p009_n040","p009_n041","p009_n042","p009_n043","p009_n044","p009_n045","p009_n046","p009_n047","p009_n048","p009_n049","p009_n050","p009_n051","p009_n052","p009_n053","p009_n054","p009_n055","p009_n056","p009_n057","p009_n058"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p009_a006","kind":"政治素养","text":"政治素养：\n旧唯物主义=“半截子”的唯物主义”=不彻底的唯物主义。把某种具体或几种物质当作世界本原","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p009_a007","kind":"易错点","text":"易错点：\n1.机械唯物主义：形而上学唯物主义\n2.庸俗唯物主义：意识是人脑的分泌物，意识等同于物质","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p009_a008","kind":"易错点","text":"易错点：“客观实在”就是人类可以感知的自然事物/物质的具体形态和结构/可感知的东西或看得见、摸得着的实物（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p009_a009","kind":"政治素养","text":"政治素养：\n1.共性=普遍=一般=抽象（比如：水果、人、动物）\n2.个性=特殊=个别=具体（比如：苹果、香蕉、梨）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p009_a010","kind":"政治素养","text":"政治素养：\n1.“半截子”的唯物主义=马克思主义以前的唯物主义：自然观上唯物（认为物质决定意识），历史观上唯心（认为社会意识决定社会存在）；不了解实践的作用\n2.彻底的唯物主义：马克思主义以实践为基础揭示了人类社会的物质性，实现了唯物主义自然观和历史观的统一","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":11},{"id":"suyi-marx-p005-n003-g01","revision":1,"path":["马原","第一章 唯物论","考点4：运动观"],"type":"group","title":"运动观","question":"运动观的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.运动是标志一切事物和现象变化及其过程的哲学范畴\n\n2.物质的根本属性是运动（物质和运动不可分割）：（1）运动是物质的运动，没有无物质的运动（假设有：唯心主义）；（2）物质是运动着的物质，没有不运动的物质（假设有：形而上学）；（3）物质是一切运动变化和发展过程的实在基础和承担者。\n\n3.绝对运动和相对静止：（1）相对静止：运动的特殊状态：①是物质运动在一定条件下的稳定状态，包括空间的相对位置和事物的根本性质暂时不变；②是运动的衡量尺度；③是事物存在和发展的必要条件；是人们认识和利用事物的前提；是过去运动的结果和未来运动的出发点；（2）辩证统一：相互区别：①绝对运动：整个物质世界都是运动的，具有绝对性、无条件性、变动性；②相对静止：具体事物的运动，具有相对性、有条件性、稳定性；相互联系：①相互依赖、相互渗透、相互包含——“动中有静、静中有动”；②无条件的绝对运动和有条件的相对静止构成了对立统一的关系；不能割裂两者关系：①否认绝对运动→形而上学不变论：“刻舟求剑”；②否认相对静止→相对主义诡辩论：“人连一次也不能踏进同一条河流”。","notes":"","source":"苏一《27命题点高清图谱》印刷第5页；按原分支整理","source_pages":[5],"source_pdf_pages":[10],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p010_n004","p010_n005","p010_n006","p010_n007","p010_n008","p010_n009","p010_n010","p010_n011","p010_n012","p010_n013","p010_n014","p010_n015","p010_n016","p010_n017","p010_n018","p010_n019","p010_n020","p010_n021","p010_n022","p010_n023"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p010_a001","kind":"补充说明","text":"运动是物质的存在方式和根本属性","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":12},{"id":"suyi-marx-p005-n024-g01","revision":1,"path":["马原","第一章 唯物论","考点5：时空观"],"type":"group","title":"时空观","question":"围绕时空观，时间和空间、时间和空间是运动着的物质的基本存在形式、时空的特点分别是什么？","answer":"1.时间和空间：（1）时间：物质运动的持续性、顺序性，特点是一维性；（2）空间：物质运动的广延性、伸张性，特点是三维性。\n\n2.时间和空间是运动着的物质的基本存在形式：（1）物质运动总是在一定的时间和空间中进行的，没有离开物质运动的“纯粹”时间和空间；（2）也没有离开时间和空间的物质运动。\n\n3.时空的特点：时空是有限的、相对的：具体物质形态的时空是有限的（相对的、有条件的）；如人的时间是有限的，终会老去。空间也是有限的，人只能长这么高、这么大；时空是无限的、绝对的：整个物质世界的时空是无限的；时空的客观实在性是绝对的、无条件的。\n\n4.物质、运动、时间、空间具有内在的统一性，不可分割","notes":"","source":"苏一《27命题点高清图谱》印刷第5页；按原分支整理","source_pages":[5],"source_pdf_pages":[10],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p010_n025","p010_n026","p010_n027","p010_n028","p010_n029","p010_n030","p010_n031","p010_n032","p010_n033","p010_n034","p010_n035","p010_n036","p010_n037","p010_n038"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p010_a004","kind":"补充说明","text":"物质运动与时间和空间的不可分割，证明了时间和空间的客观性","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":13},{"id":"suyi-marx-p005-n039-g01","revision":1,"path":["马原","第一章 唯物论","考点6：实践观（物质世界的二重化）"],"type":"group","title":"实践观（物质世界的二重化）","question":"围绕实践观（物质世界的二重化），世界分化为自然界与人类社会、世界分化为客观世界和主观世界、总结分别是什么？","answer":"1.世界分化为自然界与人类社会：（1）人类的出现是自然史上的一个巨大飞跃：这个飞跃的关键在于人的劳动，它在从猿到人的转变中起到了决定性作用（“劳动创造了人本身”）；（2）人类社会是最高级的物质存在形态：人类社会与自然界的不同主要在于：①在自然界中一切都是自发产生的；②人类社会中一切都打着人的意识的印记，是人有目的的实践活动的结果；（3）自然界与人类社会不是截然分开的，而是交叉重叠和相互作用的。\n\n2.世界分化为客观世界和主观世界：（1）客观世界是不依赖于人的思想意识而存在的现实世界，包括自然界和人类社会；（2）主观世界是指人的意识、观念世界，是人的头脑反映和把握物质世界的精神活动的总和：①主观世界是人的认知、情感、意志的统一体；②主体的观念、愿望、情感、意志、目的、信念等都是主观世界的不同表现形式；（3）二者关系：①主观世界从客观世界中分化出来，具有相对独立性；②主观世界并非独立存在的实体，也不是一个超然于客观世界而孤立存在的世界；③主观世界不能完全脱离客观世界，而是从属于客观世界；④主观世界是对客观世界的反映，并反作用于客观世界。\n\n3.总结：（1）不论是创造人本身的劳动，还是构成社会存在基础的物质生产，都是人改造世界的实践活动；（2）人的实践活动是自然界与人类社会、客观世界与主观世界相分化的关键，也是它们相统一的关键；（3）在实践活动中，人们始终在处理自然与社会、客观与主观的关系，力求克服二者的对立而达成它们的统一；（4）人类的实践活动是一个不断发展的过程，因而自然与社会、客观与主观的统一也是一个动态的历史的过程。","notes":"","source":"苏一《27命题点高清图谱》印刷第5页；按原分支整理","source_pages":[5],"source_pdf_pages":[10],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p010_n040","p010_n041","p010_n042","p010_n043","p010_n044","p010_n045","p010_n046","p010_n047","p010_n048","p010_n049","p010_n050","p010_n051","p010_n052","p010_n053","p010_n054","p010_n055","p010_n056","p010_n057","p010_n058","p010_n059","p010_n060","p010_n061","p010_n062"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p010_a008","kind":"政治素养","text":"政治素养：\n1.自然界和人类社会都属于物质世界/客观世界，都具有客观性。因此，人类社会也是客观的\n2.主观世界指人的意识活动，是主观的","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p010_a009","kind":"易错点","text":"易错点：\n1.自然界属于客观世界，而人类社会属于主观世界（×，前半句话正确，后半句话错误）\n2.人可以创造/消灭/毁灭自然（×，人可以利用、改造、影响自然）\n3.自然界和人类社会都具有客观实在性（√）\n4.人类的实践活动能够改变自然界的客观实在性（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":14},{"id":"suyi-marx-p006-n002-g01","revision":1,"path":["马原","第一章 唯物论","考点7：意识观（物质与意识的辩证关系）"],"type":"group","title":"意识观（物质与意识的辩证关系）：物质决定意识","question":"意识观（物质与意识的辩证关系）：物质决定意识怎样理解？各方的内涵、区别和相互作用是什么？","answer":"1.物质决定意识：意识的起源：（1）自然界长期发展的产物（三个阶段）一切物质所具有的反应特性到低等生物的刺激感应性→高等动物的感觉和心理→最终发展为人类的意识；（2）社会历史发展的产物①社会实践，特别是劳动，在意识的产生和发展中起到决定性作用劳动为意识的产生和发展提供了客观需要和可能②在人们的劳动和交往中形成的语言促进了意识的发展；意识的本质：（1）本质：意识是人脑的机能和属性，是客观世界的主观映象：①意识在内容上是客观的，在形式上是主观的；②意识是客观内容和主观形式的统一；（2）意识是物质的产物，但不是物质本身（意识≠物质）：①物质决定意识；②意识反作用于物质/意识可以转化为物质。","notes":"","source":"苏一《27命题点高清图谱》印刷第6页；按原分支整理","source_pages":[6],"source_pdf_pages":[11],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p011_n003","p011_n004","p011_n005","p011_n006","p011_n007","p011_n008","p011_n009","p011_n010","p011_n011","p011_n012","p011_n013"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p011_a001","kind":"易错点","text":"易错点：\n1.意识起源于人脑/意识是人脑主观自生的/意识可以脱离客观世界而存在（×，意识来源于物质世界）\n2.意识是客观精神的主观映象（×，意识是客观世界的主观反映。“客观世界”是现实世界中真实存在的事物，而非精神的东西）\n3.不论正确的意识还是错误的意识，都是客观世界的主观映象，都能在物质世界找到其“原型”（√）\n4.鬼神观念是人脑对鬼神的虚幻反映（×，鬼神观念是对客观世界的歪曲反映）\n5.正确的意识是客观的，错误的意识是主观的（×，客观强调意识的内容，主观强调意识的形式）\n6.精神/意识的力量可以代替物质的力量（×，意识可以通过实践转化为物质，但它本身不能代替物质）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":15},{"id":"suyi-marx-p006-n002-g02","revision":1,"path":["马原","第一章 唯物论","考点7：意识观（物质与意识的辩证关系）"],"type":"group","title":"意识观（物质与意识的辩证关系）：意识对物质具有反作用（意识的能动作用）、主观能动性和客观规律性的辩证统一","question":"意识观（物质与意识的辩证关系）：意识对物质具有反作用（意识的能动作用）、主观能动性和客观规律性的辩证统一怎样理解？各方的内涵、区别和相互作用是什么？","answer":"2.意识对物质具有反作用（意识的能动作用）：表现：①具有目的性和计划性；②具有创造性；③具有指导实践改造客观世界的作用；④具有调控人的行为和生理活动的作用。\n\n3.主观能动性和客观规律性的辩证统一：（1）规律：规律是事物变化发展过程中本身所固有的内在的、本质的、必然的联系；①自然规律：自发的、无意识的，没有人的参与如：潮起潮落、太阳东升西落；②社会规律：自觉的、有意识的，需要人来推动推动≠改变；规律是客观的，不以人的意志为转移：①承认规律的客观性，并不是说人在规律面前无能为力、无所作为；②人能够通过自觉活动去认识规律，并按照客观规律去改造世界，以满足自身的需要；（2）两者关系：①尊重客观规律是正确发挥主观能动性的前提；②只有充分发挥主观能动性，才能正确认识和利用客观规律；③实践是客观规律性和主观能动性统一的基础；（3）如何发挥主观能动性？：①从实际出发是正确发挥人的主观能动性的前提；②实践是正确发挥人的主观能动性的根本途径；③正确发挥人的主观能动性，还要依赖于一定的物质条件和物质手段；（4）坚持遵循客观规律与发挥主观能动性相统一，要求充分发扬历史主动精神。","notes":"","source":"苏一《27命题点高清图谱》印刷第6页；按原分支整理","source_pages":[6],"source_pdf_pages":[11],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p011_n014","p011_n015","p011_n016","p011_n017","p011_n018","p011_n019","p011_n020","p011_n021","p011_n022","p011_n023","p011_n024","p011_n025","p011_n026","p011_n027","p011_n028","p011_n029","p011_n030","p011_n031","p011_n032","p011_n033","p011_n034","p011_n035","p011_n036"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p011_a002","kind":"政治素养+易错点","text":"政治素养：（2013-17）\n1.人不能创造、改变、消灭、摆脱规律，但可以认识、利用规律\n2.人虽然不可以改变规律，但是可以改变规律发挥作用的条件\n3.自然规律与社会规律都是客观的，都可以重复，没有谁比谁更重要的说法\n4.事物运动的规律是各种因素相互作用的结果（2026-2）\n易错点：\n1.自然规律和社会规律是一样的/存在着惊人的相似性（×）\n2.历史上发生作用的规律现实上也一定发生（×，规律的存在和发生作用是有条件的，如价值规律在共产主义社会不会发生作用，因为没有商品）\n3.自然规律要依靠人的活动才能存在和发挥作用（×）\n4.社会规律比自然规律更易于认识的规律（×）\n5.自然规律因人的出现而改变/取决于人的观察结果（×，规律是客观的）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p011_a005","kind":"题目提示","text":"题目中：规律=规律性=必然性","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":16},{"id":"suyi-marx-p006-n002-g03","revision":1,"path":["马原","第一章 唯物论","考点7：意识观（物质与意识的辩证关系）"],"type":"group","title":"意识观（物质与意识的辩证关系）：意识与人工智能","question":"意识观（物质与意识的辩证关系）：意识与人工智能怎样理解？各方的内涵、区别和相互作用是什么？","answer":"4.意识与人工智能：（1）人工智能：①定义：把人的部分智能活动机器化，让机器具有完成某种复杂目标的能力；②实质：对人脑组织结构与思维运行机制的模仿，是人类智能的物化；（2）人工智能是人的意识能动性的一种特殊表现，是人的本质力量的对象化、现实化；（3）尽管人工智能可以模拟和扩展人脑的某些活动，但即使是计算能力最强大、最先进的智能机器，也达不到人类智能的层级，无法真正具有人的意识，不可能取代或超越人类智能；（4）关系：第一，人类意识是知情意的统一体而人工智能只是对人类的理性智能的模拟和扩展，不具备情感、信念、意志等人类意识形式；第二，社会性是人的意识所固有的本质属性，而人工智能不可能真正具备人类的社会属性机器人从根本上说是机器而不是人类，不可能具备自立、自主、自觉的社会活动机器人难以成为独立的具有行为后果意识、自律意识、社会责任感的社会主体；第三，人类的自然语言是思维的物质外壳和意识的现实形式人工智能难以完全具备理解自然语言真实意义的能力；第四，人工智能能够获得人类意识中可以化约为数字信号的内容但人脑中总有许多东西是无法被化约的，比如潜意识。","notes":"","source":"苏一《27命题点高清图谱》印刷第6页；按原分支整理","source_pages":[6],"source_pdf_pages":[11],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p011_n037","p011_n038","p011_n039","p011_n040","p011_n041","p011_n042","p011_n043","p011_n044","p011_n045","p011_n046","p011_n047"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p011_a003","kind":"政治素养+易错点","text":"政治素养：\n1.人工智能的出现表明，人类意识已经发展到能够把意识活动部分地从人脑中分离出来，物化为机器的物理运动从而延伸意识器官功能的新阶段\n2.人工智能，本质上是人造出来的机器/计算机，它只是按照算法完成某些动作，没有人的意识，不可能取代或超越人类智能\n3.人的实践活动是一种有目的、有意识的活动，但人工智能没有意识，没有能动性，所以它不能从事实践活动\n易错点（2025-18）：\n1.人工智能/机器人已经具备理性认识能力（×）\n2.人工智能/机器人可以从事某些实践活动（×）\n3.人工智能/机器人延伸和扩展了人脑的意识活动功能（√）\n4.人脑中的所有东西都可以化约为数字信号（×）\n5.人类的情感、信念、意志、创造性思维等已经可以被还原为数据信息及其基本算法（×）\n6.最先进的智能机器已经可以取代和超越人类智能（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":17},{"id":"suyi-marx-p006-n048-g01","revision":1,"path":["马原","第一章 唯物论","考点8：世界的物质统一性"],"type":"group","title":"世界的物质统一性","question":"围绕世界的物质统一性，世界的物质统一性体现在、世界的物质统一性原理分别是什么？","answer":"1.世界的统一性在于它的物质性，世界统一于物质\n\n2.世界的物质统一性体现在：第一，自然界是物质的自然界先于人类而存在，并不依赖人类意识而存在无论是尚未进入人类实践活动范围的天然自然，还是已经被实践打上烙印的人化自然，都具有客观实在性；第二，人类社会本质上是生产实践基础上形成的物质体系：①人类社会是物质世界的一部分，是物质存在的一种特定形态；②人类社会的自然基础是物质的，人类获取生活资料的生产活动是物质的；③物质资料的生产方式构成了人类社会存在和发展的基础，集中体现着人类社会的物质性；第三，人的意识统一于物质（从意识的起源、本质、作用上看）。\n\n3.世界的物质统一性原理：（1）世界是统一的，即世界的本原只有一个；（2）世界的统一性在于它的物质性，即世界统一的基础是物质，而不是某种“始基”的物体；（3）世界的物质统一性是多样性的统一，而不是单一的无差别的统一。\n\n4.意义世界的物质统一性原理是辩证唯物主义最基本、最核心的观点，是马克思主义的基石","notes":"","source":"苏一《27命题点高清图谱》印刷第6页；按原分支整理","source_pages":[6],"source_pdf_pages":[11],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p011_n049","p011_n050","p011_n051","p011_n052","p011_n053","p011_n054","p011_n055","p011_n056","p011_n057","p011_n058","p011_n059","p011_n060","p011_n061"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":18},{"id":"suyi-marx-p007-n003-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点1：联系"],"type":"group","title":"联系","question":"围绕联系，特点、方法论分别是什么？","answer":"1.内涵事物内部各要素之间和事物之间相互影响、相互制约、相互作用的关系\n\n2.特点：（1）客观性事物的联系是事物本身所固有的、不以人的意志为转移的；（2）普遍性①任何事物内部的不同部分和要素之间都是相互联系的，都具有内在的结构性②任何事物都不能孤立存在，都同其他事物处于一定的联系之中③整个世界是相互联系的统一整体。从无机界到有机界，从自然界到人类社会，任何事物都处在普遍联系、相互作用之中；（3）多样性①世界上的事物是多样的，事物之间的联系也是多样的②事物联系的主要方式有：直接与间接、内部与外部、本质与非本质、必然与偶然等；（4）条件性条件是对事物存在和发展发生作用的诸要素的总和有利条件支持和促进事物的发展和人的活动不利条件制约和阻碍事物的发展和人的活动①条件对事物发展和人的活动具有支持或制约作用②条件是可以改变的经过努力，可以化不利条件为有利条件，推动事物的发展③改变和创造条件不是任意的必须尊重事物发展的客观规律，不能强行去改变事物存在和发展的条件。\n\n3.方法论：（1）善于分析事物的具体联系，从区别中看到联系、联系中看到区别；（2）确立整体性开放性的观念，从动态中考察事物的普遍联系。","notes":"","source":"苏一《27命题点高清图谱》印刷第7页；按原分支整理","source_pages":[7],"source_pdf_pages":[12],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p012_n004","p012_n005","p012_n006","p012_n007","p012_n008","p012_n009","p012_n010","p012_n011","p012_n012"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":19},{"id":"suyi-marx-p007-n013-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点2：发展"],"type":"group","title":"发展","question":"围绕发展，发展的含义、发展的过程论分别是什么？","answer":"1.发展的含义：（1）发展是事物变化中前进的、上升的运动；（2）实质：新事物的产生和旧事物的灭亡：①新事物：合乎历史前进方向、具有远大前途的东西内涵②旧事物：丧失历史必然性、日趋灭亡的东西；①新事物与环境的关系：新事物之所以新，是因为有新的要素、结构和功能，它适应已经变化了的环境和条件；旧事物之所以旧，是因为它的各种要素和功能已不适应环境和客观条件的变化，走向灭亡就成为不可避免的；②新旧事物的关系：新事物是在旧事物的“母体”中孕育成熟的，它既否定了旧事物中消极腐朽的东西，又保留了旧事物中合理的、适应新条件的因素，并添加了旧事物所不能容纳的新内容；③社会历史领域：新事物从根本上符合人民群众的利益和要求，能够得到人民群众拥护；新事物不可战胜。\n\n2.发展的过程论：（1）恩格斯：“世界不是既成事物的集合体，而是过程的集合体”；（2）含义：任何事物都有其产生、发展和转化为其他事物的历史，都有它的过去、现在和未来。\n\n3.方法论：用历史的眼光看问题，把一切事物都如实看作变化、发展的过程","notes":"","source":"苏一《27命题点高清图谱》印刷第7页；按原分支整理","source_pages":[7],"source_pdf_pages":[12],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p012_n014","p012_n015","p012_n016","p012_n017","p012_n018","p012_n019","p012_n020","p012_n021","p012_n022","p012_n023","p012_n024","p012_n025"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":20},{"id":"suyi-marx-p007-n027-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点3：对立统一规律（源泉和动力）"],"type":"group","title":"对立统一规律（源泉和动力）：地位","question":"对立统一规律（源泉和动力）：地位的基本内容、作用和方法论要求是什么？","answer":"1.地位：唯物辩证法的实质和核心：（1）揭示了事物普遍联系的根本内容和变化发展的内在动力，从根本上回答了事物为什么会发展的问题；（2）贯穿了量变质变规律、否定之否定规律以及唯物辩证法基本范畴的中心线索，也是理解这些规律的“钥匙”；（3）提供了人们认识世界和改造世界的根本方法：矛盾分析方法。","notes":"","source":"苏一《27命题点高清图谱》印刷第7页；按原分支整理","source_pages":[7],"source_pdf_pages":[12],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p012_n028","p012_n029","p012_n030","p012_n031"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":21},{"id":"suyi-marx-p007-n027-g02","revision":1,"path":["马原","第一章 唯物辩证法","考点3：对立统一规律（源泉和动力）"],"type":"group","title":"对立统一规律（源泉和动力）：矛盾的同一性和斗争性的辩证关系原理","question":"对立统一规律（源泉和动力）：矛盾的同一性和斗争性的辩证关系原理怎样理解？各方的内涵、区别和相互作用是什么？","answer":"2.矛盾的同一性和斗争性的辩证关系原理：相互区别：（1）同一性：①相互依存：矛盾着的对立面相互依存，互为存在的前提，并共处于一个统一体中；②相互贯通：矛盾着的对立面相互贯通，在一定条件下可以相互转化；（2）斗争性：①对抗性；②非对抗性具有多种多样的斗争形式；相互联结、相辅相成：（1）同一性包含斗争性①同一性不能脱离斗争性而存在，没有斗争性就没有同一性②同一性以差别和对立为前提，包含差别和对立的同一；（2）斗争性寓于同一性①斗争性也不能脱离同一性而存在，没有同一性也没有斗争性②同一性制约着斗争的形式、规模和范围；在事物发展中的作用：（1）矛盾的同一性和斗争性相结合，构成了事物的矛盾运动，推动着事物的变化发展；（2）同一性作用①相互依存：同一性是事物存在和发展的前提，在矛盾双方中，一方的发展以另一方的发展为条件，发展是在矛盾统一体中的发展②相互包含：同一性使矛盾双方相互吸取有利于自身的因素，在相互作用中各自得到发展③相互贯通：同一性规定着事物转化的可能和发展的趋势。事物之所以能够转化，是由于事物内部矛盾双方具有相互贯通的关系；（3）斗争性作用①矛盾双方的斗争促进矛盾双方力量的变化，造成双方力量发展的不平衡，为对立面的转化、事物的质变创造条件②矛盾双方的斗争是一种矛盾统一体向另一种矛盾统一体过渡的决定性力量；（4）在事物发展过程中，矛盾的同一性和斗争性相互结合，共同发生作用，但在不同条件下，二者所处的地位会有所不同①在一定的条件下，矛盾的斗争性可能处于主要方面②在另外的条件下，矛盾的同一性可能处于主要方面。","notes":"","source":"苏一《27命题点高清图谱》印刷第7页；按原分支整理","source_pages":[7],"source_pdf_pages":[12],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p012_n032","p012_n033","p012_n034","p012_n035","p012_n036","p012_n037","p012_n038","p012_n039","p012_n040","p012_n041","p012_n042","p012_n043","p012_n044","p012_n045","p012_n046","p012_n047"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":22},{"id":"suyi-marx-p007-n027-g03","revision":1,"path":["马原","第一章 唯物辩证法","考点3：对立统一规律（源泉和动力）"],"type":"group","title":"对立统一规律（源泉和动力）：矛盾的同一性和斗争性的辩证关系原理","question":"对立统一规律（源泉和动力）：矛盾的同一性和斗争性的辩证关系原理怎样理解？各方的内涵、区别和相互作用是什么？","answer":"2.矛盾的同一性和斗争性的辩证关系原理：内因和外因的辩证关系原理：（1）内因：事物发展的根本原因（内部矛盾）；（2）外因：事物发展的第二原因（外部矛盾）；方法论意义：（1）我们在观察和处理问题时，必须善于把二者结合起来，在斗争性中把握同一性，在同一性中把握斗争性；（2）正确把握和谐对事物发展的作用和谐是矛盾的一种特殊表现形式，体现着矛盾双方的相互依存、相互促进、共同发展和谐≠绝对同一，任何“同一”都是以差别和对立为内在前提的；（3）要大力发扬斗争精神。敢于斗争、善于斗争是马克思主义的鲜明特色，是中国共产党人的鲜明品格。","notes":"","source":"苏一《27命题点高清图谱》印刷第8页；按原分支整理","source_pages":[8],"source_pdf_pages":[13],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p013_n004","p013_n005","p013_n006","p013_n007","p013_n008","p013_n009","p013_n010","p013_n011"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":23},{"id":"suyi-marx-p007-n027-g04","revision":1,"path":["马原","第一章 唯物辩证法","考点3：对立统一规律（源泉和动力）"],"type":"group","title":"对立统一规律（源泉和动力）：矛盾的普遍性和特殊性的辩证关系原理","question":"对立统一规律（源泉和动力）：矛盾的普遍性和特殊性的辩证关系原理怎样理解？各方的内涵、区别和相互作用是什么？","answer":"3.矛盾的普遍性和特殊性的辩证关系原理：相互区别：（1）普遍性①矛盾存在于一切事物中，存在于一切事物发展过程的始终②旧的矛盾解决了，又产生新的矛盾，事物始终在矛盾中运动；（2）特殊性：第一，指各个具体事物的矛盾、每一个矛盾的各个方面在发展的不同阶段上各有其特点；第二：矛盾力量的不平衡性原理：①事物由诸多矛盾构成主要矛盾矛盾体系中处于支配地位、对事物发展起决定作用次要矛盾从属地位；②任何一对矛盾都有两个方面主要方面在矛盾中处于支配地位、起主导作用次要方面处于被支配地位、不起主导作用的一方；③事物的性质是由主要矛盾的主要方面所决定的；“两点论”④方法论意义不仅要看到矛盾双方的对立，而且要看到矛盾双方的统一不仅要看到矛盾体系中存在主要矛盾、矛盾的主要方面，而且要看到次要矛盾、矛盾的次要方面“重点论”要着重把握主要矛盾、矛盾的主要方面，并以此作为解决问题的出发点看问题既要全面地看，又要看主流、大势、发展趋势；第三，方法论①矛盾的特殊性决定了事物的不同性质，把握矛盾的特殊性是科学认识事物的基础，也是解决矛盾的关键②具体问题具体分析：马克思主义活的灵魂；相互联系：（1）矛盾的普遍性即矛盾的共性，是无条件的、绝对的矛盾的特殊性即矛盾的个性，是有条件的、相对的；（2）任何现实存在的事物的矛盾都是共性和个性的有机统一；（3）共性寓于个性之中，没有离开个性的共性，也没有离开共性的个性；（4）矛盾的共性和个性、绝对和相对的道理，是关于事物矛盾问题的精髓，是正确理解矛盾学说的关键；解决矛盾的方法：（1）矛盾一方克服另一方；（2）矛盾双方同归于尽；（3）矛盾双方形成协同运动的新形式（比如，企业A和企业B合作）；（4）矛盾双方融合成一个新事物（比如，企业A和B合并成一个新的企业C）；意义：是马克思主义普遍真理同各国的具体实际相结合的哲学基础科学社会主义基本原则与中国特色社会主义就是共性和个性的关系。","notes":"","source":"苏一《27命题点高清图谱》印刷第8页；按原分支整理","source_pages":[8],"source_pdf_pages":[13],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p013_n012","p013_n013","p013_n014","p013_n015","p013_n016","p013_n017","p013_n018","p013_n019","p013_n020","p013_n021","p013_n022","p013_n023","p013_n024","p013_n025","p013_n026","p013_n027","p013_n028","p013_n029","p013_n030","p013_n031","p013_n032","p013_n033"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p013_a004","kind":"政治素养","text":"政治素养：（普遍性与特殊性=共性与个性=一般与个别）\n1.个别一定与一般相联系而存在，个性在一定条件下能够转化为共性\n2.一般只能在个别中存在，只能通过个别而存在（一般寓于个别）\n3.任何个别（无论怎样）都是一般（如：张三、李四都是人）\n4.人的认识的一般规律：由认识个别上升到一般，再由一般到个别的辩证发展过程","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":24},{"id":"suyi-marx-p008-n034-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点4：量变质变规律（状态和形式）"],"type":"group","title":"量变质变规律（状态和形式）","question":"量变质变规律（状态和形式）的基本内容、作用和方法论要求是什么？","answer":"1.概念：（1）质：①认识质是认识和实践的起点和基础只有认识质才能区别事物；②质与事物的存在是直接同一的量和事物存在不是直接同一的；（2）量：①区分质是认识量的前提，考察量是认识质的深化；②只有精准地认识量，才能深刻地把握质；③认识事物的量是认识的深化和精确化；（3）度：质和量统一于度；度是保持事物质的稳定性的数量界限，即事物的限度、幅度和范围；度的两端/极限叫关节点或临界点；方法论防止“过”或“不及”，掌握适度的原则；坚持底线思维、底线原则。\n\n2.相互区别：（1）量变①事物数量的增减和组成要素排列次序的变动②保持事物的质的相对稳定性的不显著变化，体现了事物发展渐进过程的连续性；（2）质变①事物性质的根本变化，是事物由一种质态向另一种质态的飞跃（即此物转化为他物）②体现了事物发展渐进过程和连续性的中断。\n\n3.相互联系：（1）量变是质变的必要准备；（2）质变是量变的必然结果；相互渗透、相互依存、相互贯通：①在总的量变过程中有阶段性和局部性的部分质变；②在质变过程中也有旧质在量上的收缩和新质在量上的扩张；③量变质变规律体现了事物发展是渐进性和飞跃性的统一。\n\n4.方法论意义（1）当事物的发展处在量变阶段时，要踏踏实实做好日常工作，为未来重大改变作准备（2）当质变来临的时候，要果断地、不失时机地抓住机遇，促成质变，使工作迈上新台阶","notes":"","source":"苏一《27命题点高清图谱》印刷第8页；按原分支整理","source_pages":[8],"source_pdf_pages":[13],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p013_n035","p013_n036","p013_n037","p013_n038","p013_n039","p013_n040","p013_n041","p013_n042","p013_n043","p013_n044","p013_n045","p013_n046","p013_n047","p013_n048","p013_n049","p013_n050","p013_n051","p013_n052","p013_n053","p013_n054","p013_n055","p013_n056","p013_n057","p013_n058"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":25},{"id":"suyi-marx-p009-n003-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点5：否定之否定规律【方向和道路】"],"type":"group","title":"否定之否定规律【方向和道路】","question":"否定之否定规律【方向和道路】的基本内容、作用和方法论要求是什么？","answer":"1.辩证否定观：（1）事物内部都存在①肯定因素维持现存事物存在的因素②否定因素促使现存事物灭亡的因素；（2）内涵：①否定是事物的自我否定、自我发展，是事物内部矛盾运动的结果；②否定是事物发展的环节，是旧事物向新事物的转变，是从旧质到新质的飞跃；③否定是新旧事物联系的环节；④辩证否定的实质是“扬弃”新事物对旧事物既批判又继承，既克服其消极因素又保留其积极因素；（3）方法论①要求我们对待一切事物都要采取科学分析的态度②既要把握住它的现存状态又要把握住它的发展趋向，反对简单地肯定一切或否定一切。\n\n2.否定之否定规律：（1）过程：经历事物自我发展的两次否定、三个阶段，即“肯定一否定—否定之否定”①第一次否定使矛盾得到初步解决，而处于否定阶段的事物仍然具有片面性②还要经过再次否定，即否定之否定，实现对立面的统一，使矛盾得到根本解决③否定之否定阶段仿佛是向原来出发点的“回复”，但这是在更高阶段的“回复”；（2）否定之否定过程：内容自己发展自己，自己完善自己的过程；形式波浪式前进或螺旋式上升的总趋势。\n\n3.意义：前进性与曲折性的统一：（1）前进性①每一次否定都是质变，都把事物推到新阶段②每一个周期都是开放的，前一个周期的终点是下一个周期的起点，不存在不被否定的终点；（2）曲折性①体现在回复性上，其中有暂时的停顿甚至倒退②这表明，事物的发展不是直线式前进，而是螺旋式上升的。","notes":"","source":"苏一《27命题点高清图谱》印刷第9页；按原分支整理","source_pages":[9],"source_pdf_pages":[14],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p014_n004","p014_n005","p014_n006","p014_n007","p014_n008","p014_n009","p014_n010","p014_n011","p014_n012","p014_n013","p014_n014","p014_n015","p014_n016","p014_n017","p014_n018","p014_n019"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":26},{"id":"suyi-marx-p009-n021-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点6：内容与形式"],"type":"group","title":"内容与形式","question":"内容与形式的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.内涵内容与形式是从构成要素和表现方式上反映事物的一对范畴\n\n2.区别内容：构成事物的一切要素的总和形式：把诸要素统一起来的结构或表现内容的方式\n\n3.联系：（1）任何事物都是内容与形式的统一：有什么样的内容就有什么样的形式内容发生变化，其形式也发生相应变化①内容是事物存在的基础，对形式具有决定作用；②形式对内容具有反作用适合内容的形式，对内容的发展起积极的推动作用不适合内容的形式，对内容的发展起消极的阻碍作用；（2）内容和形式不可分割①任何内容都有一定的形式，任何形式也都有一定的内容②同一内容有不同表现形式，同一形式可以表现不同内容。","notes":"","source":"苏一《27命题点高清图谱》印刷第9页；按原分支整理","source_pages":[9],"source_pdf_pages":[14],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p014_n022","p014_n023","p014_n024","p014_n025","p014_n026","p014_n027","p014_n028"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":27},{"id":"suyi-marx-p009-n029-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点7：本质与现象"],"type":"group","title":"本质与现象","question":"围绕本质与现象，区别、联系分别是什么？","answer":"1.内涵本质和现象是揭示事物内在联系和外在表现的一对范畴\n\n2.区别：本质：事物的根本性质，是构成事物诸要素之间的内在联系一般的、普遍的；相对稳定的；深藏事物内部，靠理性思维把握；现象：事物的外部联系和表面特征，是事物本质的外在表现个别的、具体的；多变易逝的；表面、外显的，靠感官感知。\n\n3.联系：（1）本质决定现象现象的存在和变化归根到底依赖于本质；（2）现象表现本质：①真象正面表现本质；②假象反面、歪曲、颠倒表现本质。","notes":"","source":"苏一《27命题点高清图谱》印刷第9页；按原分支整理","source_pages":[9],"source_pdf_pages":[14],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p014_n030","p014_n031","p014_n032","p014_n033","p014_n034","p014_n035","p014_n036","p014_n037","p014_n038"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":28},{"id":"suyi-marx-p009-n039-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点8：原因与结果"],"type":"group","title":"原因与结果","question":"原因与结果有哪些？各项依据和相互关系是什么？","answer":"1.内涵原因和结果是揭示事物之间引起和被引起关系的一对范畴原因：引起某种现象的现象结果：被某种现象引起的现象\n\n2.区别在一个具体的因果联系中，原因就是原因，结果就是结果，原因在前，结果在后，二者不能混淆和颠倒\n\n3.联系相互依存和相互转化（1）在事物因果联系的长链中，任何原因都必然引起一定的结果，没有“无果之因”（2）任何结果都是由一定的原因引起的，没有“无因之果”（3）一种现象在一种联系中是原因，在另一种联系中则可能是结果，反之亦然","notes":"","source":"苏一《27命题点高清图谱》印刷第9页；按原分支整理","source_pages":[9],"source_pdf_pages":[14],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p014_n040","p014_n041","p014_n042"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":29},{"id":"suyi-marx-p009-n043-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点9：必然与偶然"],"type":"group","title":"必然与偶然","question":"围绕必然与偶然，区别、联系分别是什么？","answer":"1.内涵必然与偶然是揭示事物产生、发展和衰亡过程中不同趋势的一对范畴\n\n2.区别：（1）必然：事物联系和发展过程中确定不移的趋势，在一定条件下具有不可避免性①形成原因：事物内部的根本矛盾②表现形式：同类事物普遍具有的发展趋势③事物发展中的地位和作用：支配地位、决定事物发展方向；（2）偶然：事物联系和发展过程中不确定的趋势①形成原因：非根本矛盾和外部条件②表现形式：事物发展中的个别表现③事物发展中的地位和作用：从属地位，对事物的发展起促进或延缓的作用。\n\n3.联系：（1）相互依存：现实事物的发展，不通过偶然而只表现为纯粹必然的情况是不存在的①没有脱离偶然的必然必然总是伴随着偶然，要通过偶然表现出来，并为自己开辟道路；②没有脱离必然的偶然在似乎是偶然起支配作用的地方，实际上是必然起着决定性作用，并制约着偶然的作用形式及其变化；（2）相互转化对于某一过程是必然的东西，对另一过程就可能成为偶然的东西。\n\n4.方法论重视事物发展的必然规律和发展趋势，并以此为依据制定我们的目标和计划同时也要充分估计到各种偶然因素的作用，善于敏锐地识别和把握机遇","notes":"","source":"苏一《27命题点高清图谱》印刷第9、10页；按原分支整理","source_pages":[9,10],"source_pdf_pages":[14,15],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p014_n044","p014_n045","p014_n046","p014_n047","p015_n004","p015_n005","p015_n006","p015_n007","p015_n008","p015_n009"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p015_a003","kind":"政治素养","text":"政治素养：主观辩证法和客观辩证法是反映和被反映的关系","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":30},{"id":"suyi-marx-p010-n010-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点10：现实与可能"],"type":"group","title":"现实与可能","question":"现实与可能的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.内涵可能和现实是反映事物的过去、现在和将来关系的一对范畴\n\n2.区别：（1）现实：指相互联系着的实际存在的事物的综合①现实是当下的客观存在，标志着事物的当前状况；（2）可能：指包含在事物中、预示事物发展前途的种种趋势②可能是事物潜在的趋势，标志着事物的发展方向；对立。\n\n3.联系：相互转化：（1）现实蕴藏着未来的发展方向，会不断产生新的可能；（2）可能包含着发展成为现实的因素和根据，一旦主客观条件成熟，可能就会转化为现实；（3）发展就是现实和可能相互转化的过程。","notes":"","source":"苏一《27命题点高清图谱》印刷第10页；按原分支整理","source_pages":[10],"source_pdf_pages":[15],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p015_n011","p015_n012","p015_n013","p015_n014","p015_n015","p015_n016","p015_n017","p015_n018","p015_n019"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p015_a003","kind":"政治素养","text":"政治素养：主观辩证法和客观辩证法是反映和被反映的关系","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":31},{"id":"suyi-marx-p010-n021-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点11：唯物辩证法本质上是批判的和革命的"],"type":"group","title":"唯物辩证法本质上是批判的和革命的","question":"唯物辩证法本质上是批判的和革命的的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"马克思1.辩证法对现存事物的肯定理解中同时包含对现存事物否定的理解，即对现存事物的必然灭亡的理解2.辩证法对每一种既成的形式都是从不断的运动中，因而也是从它的暂时性方面去理解3.辩证法不崇拜任何东西，按其本质来说，它是批判的和革命的\n\n恩格斯1.不存在任何最终的东西、绝对的东西、神圣的东西2.它（辩证法）指出一切事物的暂时性3.在它（辩证法）面前，除了生成和灭亡的不断过程、无止境地由低级上升到高级的不断过程，什么都不存在","notes":"","source":"苏一《27命题点高清图谱》印刷第10页；按原分支整理","source_pages":[10],"source_pdf_pages":[15],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p015_n022","p015_n023"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p015_a003","kind":"政治素养","text":"政治素养：主观辩证法和客观辩证法是反映和被反映的关系","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":32},{"id":"suyi-marx-p010-n024-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点12：客观辩证法与主观辩证法"],"type":"group","title":"客观辩证法与主观辩证法","question":"客观辩证法与主观辩证法的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.客观辩证法是指客观事物或客观存在的辩证法，各种物质形态的辩证运动和发展规律\n\n2.主观辩证法是指人类认识和思维运动的辩证法，以概念作为思维细胞的辩证思维运动和发展规律\n\n3.关系（1）主观辩证法是客观辩证法在人的思维中的反映。二者本质上是统一的，但在表现形式上不同（2）客观辩证法采取外部必然性形式，不以人的意志为转移，是物质世界本身的联系和发展（3）主观辩证法采取观念的、逻辑的形式，是同人类思维的自觉活动相联系的，是以概念为基础的辩证思维规律","notes":"","source":"苏一《27命题点高清图谱》印刷第10页；按原分支整理","source_pages":[10],"source_pdf_pages":[15],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p015_n025","p015_n026","p015_n027"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p015_a003","kind":"政治素养","text":"政治素养：主观辩证法和客观辩证法是反映和被反映的关系","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":33},{"id":"suyi-marx-p010-n028-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点13：唯物辩证法是科学的认识方法"],"type":"group","title":"唯物辩证法是科学的认识方法","question":"唯物辩证法是科学的认识方法的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.矛盾分析方法是对立统一规律在方法论上的体现，在唯物辩证法的方法论体系中居于核心地位，是认识事物的根本方法\n\n2.矛盾分析方法的核心要求是善于分析矛盾的特殊性，做到具体矛盾具体分析，对具体情况、具体问题作具体分析\n\n3.坚持问题导向，是习近平新时代中国特色社会主义思想的重要方法，是辩证唯物主义矛盾观点和矛盾分析方法的时代表达和时代升华","notes":"","source":"苏一《27命题点高清图谱》印刷第10页；按原分支整理","source_pages":[10],"source_pdf_pages":[15],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p015_n029","p015_n030","p015_n031"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p015_a003","kind":"政治素养","text":"政治素养：主观辩证法和客观辩证法是反映和被反映的关系","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":34},{"id":"suyi-marx-p010-n032-g01","revision":1,"path":["马原","第一章 唯物辩证法","考点14：学习唯物辩证法，不断增强思维能力"],"type":"group","title":"学习唯物辩证法，不断增强思维能力","question":"学习唯物辩证法，不断增强思维能力的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.辩证思维能力：（1）以唯物辩证法为指导，发现矛盾、分析矛盾、解决矛盾，把握本质、遵循规律、指导实践的能力；辩证思维方法：归纳与演绎①人类思维从个别到一般，又由一般到个别的最常见的推理形式②归纳和演绎处于不可分割的联系之中，它们互为前提，又相互补充；分析与综合①是一种比归纳与演绎更深刻地揭示事物本质的方法②分析是综合的基础，综合是分析的完成；抽象与具体①是通过从具体到抽象、又从抽象到具体（具体—抽象—具体）的过程，达到对事物的真理性认识②具体包括感性具体和思维具体两种，抽象是对客观事物某一方面本质的概括和规定③对辩证思维而言，重要的是从抽象上升到具体。这是一个以抽象为逻辑起点，通过各种形式的逻辑中介，达到以思维具体为逻辑终点的运行过程；逻辑与历史逻辑的东西和历史的东西是辩证统一的。\n\n2.历史思维能力（1）历史思维能力是辩证思维与历史眼光的结合，是马克思主义科学历史观的具体表现和实践运用（2）历史思维能力是以史为鉴、知古鉴今，善于运用历史眼光认识发展规律、把握前进方向、指导现实工作的能力（3）历史、现实、未来是相通的，历史是过去的现实，现实是未来的历史\n\n3.系统思维能力（2023分析题考点、2025-1）（1）系统是指由相互联系、相互作用的若干要素组成的具有稳定结构和特定功能的有机整体，具有整体性、结构性、层次性和开放性四个基本特征（2）系统思维能力就是从事物相互联系的各个方面及其结构和功能进行系统思考的能力，就是全面系统地分析和处理问题的能力（3）提高系统思维能力，就是要坚持系统观念，用系统思维的方法分析和处理问题\n\n4.战略思维能力强调思维的整体性、全局性、长期性，是高瞻远瞩、统揽全局，善于把握事物发展总体趋势和方向的能力\n\n5.底线思维能力底线思维是我们在认识世界和改造世界的过程中，根据我们的需要和客观的条件，划清并坚守底线，尽力化解风险，避免最坏结果，同时争取实现最大期望值的一种积极的思维\n\n6.创新思维能力是对常规思维的突破，是破除迷信，超越陈规，善于因时制宜、知难而进、开拓创新的能力","notes":"","source":"苏一《27命题点高清图谱》印刷第10页；按原分支整理","source_pages":[10],"source_pdf_pages":[15],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p015_n033","p015_n034","p015_n035","p015_n036","p015_n037","p015_n038","p015_n039","p015_n040","p015_n041","p015_n042","p015_n043","p015_n044"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p015_a003","kind":"政治素养","text":"政治素养：主观辩证法和客观辩证法是反映和被反映的关系","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":35},{"id":"suyi-marx-p011-n003-g01","revision":1,"path":["马原","第二章 实践与认识","考点1：科学的实践观及其意义"],"type":"group","title":"科学的实践观及其意义","question":"科学的实践观及其意义体现在哪些方面？相关定位和适用条件是什么？","answer":"1.马克思《关于费尔巴哈的提纲》：包含新世界观天才萌芽的第一个文件，系统论述了实践的观点，揭示了科学实践观的基本内容\n\n2.科学的实践观：科学实践观从主观和客观、主体和客体的统一中把握实践，深刻揭示出实践与认识的发展规律，形成了完整科学的理论体系\n\n3.科学实践观的意义：（1）克服了旧唯物主义的根本缺陷，为辩证唯物主义的创立奠定了科学的理论基础；（2）揭示了实践对认识的决定作用，为能动的、革命的反映论的创立奠定了科学的理论基础；（3）在人类思想史上第一次揭示了社会生活的实践本质，为唯物史观的创立奠定了科学的理论基础；（4）为人们能动地认识世界和改造世界提供了基本的思想方法和工作方法。","notes":"","source":"苏一《27命题点高清图谱》印刷第11页；按原分支整理","source_pages":[11],"source_pdf_pages":[16],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p016_n004","p016_n005","p016_n006","p016_n007","p016_n008","p016_n009","p016_n010"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":36},{"id":"suyi-marx-p011-n011-g01","revision":1,"path":["马原","第二章 实践与认识","考点2：实践的本质与基本结构"],"type":"group","title":"实践的本质与基本结构：本质、基本特征","question":"实践的本质与基本结构：本质、基本特征包括哪几方面？每项具体表现为什么？","answer":"1.本质：人类能动地改造世界的社会性的物质活动\n\n2.基本特征：（1）客观实在性：实践是人类改造世界的客观物质活动，它虽然是人类有目的、有意识的行为，但本质上是客观的、物质的活动：①实践的主体、客体和中介，都是可感知的客观实在；②实践的水平、广度、深度和发展过程，都受客观条件的制约和客观规律的支配；③实践能够引起客观世界的某种变化，可以把人脑中观念的存在变为现实的存在；④实践的这一特征，把它同人的主观认识活动区别开来；（2）自觉能动性：人的实践活动是一种有目的、有意识的活动：①目的性是能动性的主要表现；②人的实践活动结束时得到的结果，在这个过程开始时就作为目的在实践者头脑中以观念的形式存在着，目的决定着实践者的行为；（3）社会历史性：①实践从一开始就是社会性的活动。作为实践主体的人总是处在一定社会关系中，任何人的活动都离不开与社会的联系；②实践的社会性决定了它的历史性。实践的内容、性质、范围、水平以及方式都受一定社会历史条件的制约，随着一定社会历史条件的变化而变化，因此，实践又是历史地发展着的实践。","notes":"","source":"苏一《27命题点高清图谱》印刷第11页；按原分支整理","source_pages":[11],"source_pdf_pages":[16],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p016_n012","p016_n013","p016_n014","p016_n015","p016_n016","p016_n017","p016_n018","p016_n019","p016_n020","p016_n021","p016_n022","p016_n023","p016_n024"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p016_a002","kind":"政治素养/易错点","text":"实践的直接现实性是它的客观实在性的具体表现，实践不是纯粹的精神活动。易错点：人的能动的意识活动具有直接现实性（×）。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":37},{"id":"suyi-marx-p011-n011-g02","revision":1,"path":["马原","第二章 实践与认识","考点2：实践的本质与基本结构"],"type":"group","title":"实践的本质与基本结构：基本结构","question":"实践的本质与基本结构：基本结构的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"3.基本结构：（1）基本要素：①主体：具有一定的主体能力、从事现实社会实践活动的人，是实践活动中自主性和能动性的因素实践主体的能力：自然能力；精神能力——知识性因素（首要能力）：理论知识、经验知识；非知识性因素：情感、意志等；②客体：实践活动所指向的对象（实践客体≠客观存在的事物）客观事物只有在被纳入主体实践活动的范围之内、为主体实践活动所指向并与主体相互作用时才成为现实的实践客体；③中介：各种形式的工具、手段及运用、操作这些工具、手段的程序和方法分类：物质性工具系统（例如，火车、电脑分别是对人的腿、脑功能的延伸和放大）；语言符号工具系统实践的主体和客体正是依靠中介系统才能够相互作用；（2）关系：实践的主体和客体相互作用的关系包括：实践关系（最根本的关系）、认识关系、价值关系；（3）主体客体化和客体主体化：①主体客体化：人通过实践使自己的本质力量作用于客体，使其按照主体的需要发生结构和功能上的变化，形成了世界上本来不存在的对象物人类一切实践活动的结果都是主体客体化的结果；②客体主体化：客体从客观对象的存在形式转化为主体生命结构因素或主体本质力量的因素，客体失去客体性的形式，变成主体的一部分（如：电脑→人脑；汽车→人的脚）。","notes":"","source":"苏一《27命题点高清图谱》印刷第11页；按原分支整理","source_pages":[11],"source_pdf_pages":[16],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p016_n025","p016_n026","p016_n027","p016_n028","p016_n029","p016_n030","p016_n031","p016_n032","p016_n033"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p016_a003","kind":"易错点","text":"1.实践客体是一切客观事物（×）；2.科学技术正在取代劳动者成为实践的主体（×）；3.实践的中介系统是实践中自主性和能动性的因素（×，自主性和能动性的因素是主体）。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":38},{"id":"suyi-marx-p011-n011-g03","revision":1,"path":["马原","第二章 实践与认识","考点2：实践的本质与基本结构"],"type":"group","title":"实践的本质与基本结构：实践的基本形式","question":"实践的本质与基本结构：实践的基本形式的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"4.实践的基本形式：三种基本类型：（1）物质生产实践：①是人类最基本的实践活动；②构成全部社会生活的基础；（2）社会政治实践：是处理各种政治关系的实践，主要指人们的政治活动；（3）科学文化实践：①是创造精神文化产品的实践活动，具有各种不同的形式，其中重要的形式有科学、艺术、教育等活动；②精神文化的生产不是一个纯粹的意识过程；新的实践形式：虚拟实践：（1）虚拟实践是伴随信息化和网络化发展而产生的；（2）是实践活动的派生形式，同时又对现实的实践活动产生重大影响；（3）虚拟实践的实质是主体和客体之间通过数字化中介系统在虚拟空间进行的双向对象化的活动，主要活跃于网络世界，具有交互性、开放性、间接性等特点。","notes":"","source":"苏一《27命题点高清图谱》印刷第11页；按原分支整理","source_pages":[11],"source_pdf_pages":[16],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p016_n034","p016_n035","p016_n036","p016_n037","p016_n038","p016_n039","p016_n040","p016_n041","p016_n042"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p016_a004","kind":"政治素养/易错点","text":"人类的任何实践形式无疑都离不开意识活动，但一种活动能否被称为实践活动，关键是看它是否超出了纯粹的意识活动，是否改变了除实践主体的意识状态之外的其他存在物的状态。教育是一种科学文化实践活动，教育者的教学活动并不是纯粹的意识活动，而是通过教书育人的全过程实际地改变受教育者的存在状态。社会政治实践和科学文化实践在物质生产实践基础上产生和发展，受物质生产实践的制约并对其产生能动的反作用。易错点：科学文化实践只能通过虚拟实践的方式实现（×）。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":39},{"id":"suyi-marx-p011-n043-g01","revision":1,"path":["马原","第二章 实践与认识","考点3：实践对认识的决定作用"],"type":"group","title":"实践对认识的决定作用","question":"实践对认识的决定作用体现在哪些方面？相关定位和适用条件是什么？","answer":"1.实践是认识的来源：（1）认识的内容是在实践活动的基础上产生和发展的；（2）直接经验：一切真知都是从直接经验发源的；任何知识都不能离开直接经验；“尽信书，则不如无书”“纸上得来终觉浅，绝知此事要躬行”；（3）间接经验：一个人多数知识还是来自间接经验（书本和传授中得来）；间接经验归根到底也来自实践，来自别人的实践；“吾生也有涯，而知也无涯”。\n\n2.实践是认识发展的动力：（1）实践的需要推动认识的产生和发展，推动人类的科学发现和技术发明，推动人类的思想进步和理论创新；（2）实践为认识的发展提供了手段和条件。比如，人可以制造工具和使用工具日益深化对客观世界的认识；（3）更为重要的一点是，实践改造人的主观世界，锻炼和提高了人的认识能力。\n\n3.实践是认识的目的：人们认识世界，不是为认识而认识，其最终目的是为实践服务，指导实践，以满足人们生活和生产的需要。\n\n4.实践是检验认识真理性的唯一标准：认识是否具有真理性，既不能从认识本身得到证实，也不能从认识对象中得到回答，只有在实践中才能得到验证。","notes":"","source":"苏一《27命题点高清图谱》印刷第11页；按原分支整理","source_pages":[11],"source_pdf_pages":[16],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p016_n044","p016_n045","p016_n046","p016_n047","p016_n048","p016_n049","p016_n050","p016_n051","p016_n052","p016_n053","p016_n054","p016_n055"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":40},{"id":"suyi-marx-p012-n003-g01","revision":1,"path":["马原","第二章 实践与认识","考点4：认识的本质"],"type":"group","title":"认识的本质","question":"围绕认识的本质，唯物主义反映论与唯心主义先验论的对立、旧唯物主义和现代辩证唯物主义的对立、认识的本质分别是什么？","answer":"1.唯物主义反映论与唯心主义先验论的对立：（1）唯心主义先验论：认识先于人的实践经验；认识路线：思想和感觉→物；（2）唯物主义反映论：认识是主体对客体的反映；认识路线：物→感觉和思想。\n\n2.旧唯物主义和现代辩证唯物主义的对立：（1）旧唯物主义：直观反映论：以感性直观为基础，把人的认识看成消极地、被动地反映和接受外界对象；缺陷：①离开实践考察认识问题：不了解实践对认识的决定作用；②离开辩证法考察认识问题：第一，把复杂的认识过程简单化，把多方面的认识要素片面化；第二，最根本的是它看不到主观和客观之间的矛盾及其相互作用，没有把认识看作一个不断发展的过程，认为认识是一次性完成的；（2）辩证唯物主义：能动反映论：是建立在实践基础上的能动的反映论；两个突出特点：①把实践的观点引入认识论；②把辩证法应用于反映论考察认识的发展过程。\n\n3.认识的本质：（1）定义：主体在实践基础上对客体的能动反映：认识是主体与客体相互作用的过程和结果；（2）特点：①反映特性：认识的反映特性是人类认识的基本规定性；指人的认识必然要以客观事物为原型和摹本，在思维中再现或摹写客观事物的状态、属性和本质；②能动的创造特性：认识是一种在思维中的能动的、创造性的活动，而不是主观对客观对象简单、直接的描摹或照镜子式的原物映现；③反映特性和能动的创造特性，二者不可分割：反映和创造不是人类认识的两种不同的本质，而是同一本质的两个不同的方面。","notes":"","source":"苏一《27命题点高清图谱》印刷第12页；按原分支整理","source_pages":[12],"source_pdf_pages":[17],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p017_n004","p017_n005","p017_n006","p017_n007","p017_n008","p017_n009","p017_n010","p017_n011","p017_n012","p017_n013","p017_n014","p017_n015","p017_n016","p017_n017","p017_n018","p017_n019","p017_n020","p017_n021","p017_n022","p017_n023","p017_n024","p017_n025","p017_n026","p017_n027","p017_n028","p017_n029","p017_n030","p017_n031","p017_n032","p017_n033","p017_n034","p017_n035","p017_n036","p017_n037","p017_n038"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p017_a001","kind":"政治素养（唯心主义先验论）","text":"1.主观唯心主义：认识是主观自生的；2.客观唯心主义：认识是上帝的启示或某种客观精神的产物；3.先验论否认了认识的客观来源，认为认识先于人的实践经验。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":41},{"id":"suyi-marx-p012-n039-g01","revision":1,"path":["马原","第二章 实践与认识","考点5：认识运动的两次飞跃"],"type":"group","title":"认识运动的两次飞跃","question":"认识运动的两次飞跃的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.第一次飞跃：从实践到认识：（1）区别：感性认识（初级阶段）：感觉器官：事物现象、外部联系、事物的各个方面：①三种形式：感觉、知觉、表象；②突出特点：直接性、具体性；③具有不深刻的局限性；理性认识（高级阶段）：抽象思维：事物本质、全体、内部联系和事物自身规律：①三种形式：概念、判断、推理；②特点：间接性、抽象性；③深刻性；（2）联系：相互依存：①理性认识依赖于感性认识：感性认识是认识过程的起点，是达到理性认识的必经阶段，没有感性认识，就没有理性认识；②感性认识有待于发展和深化为理性认识：感性认识是认识的初级阶段，是对事物外部联系的认识；感性认识还不能达到对事物的本质和规律的认识，因而还不是完全的认识；相互包含：①感性中有理性：人的感觉是渗透着理性的感觉；②理性中有感性：理性不仅以感性材料为基础，而且也以文字符号等感性形式的语言作为表达手段；（3）两者统一于实践：不论感性认识还是理性认识都是来自实践；不能割裂两者联系：①唯理论：片面夸大理性认识的作用，犯“教条主义”错误；②经验论：片面夸大感性认识的作用，犯“经验主义”错误；（4）从感性认识上升到理性认识，必须具备两个基本条件：第一，投身实践，深入调查，获取十分丰富和合乎实际的感性材料；第二，经过思考的作用，将丰富的感性材料加以去粗取精、去伪存真、由此及彼、由表及里的处理加工；（5）理性因素和非理性因素：①理性因素：含义：人的理性直观、理性思维能力；作用：指导、解释、预见；在认识中起主导作用；②非理性因素：含义：人的情感、意志；如联想、想象、猜测、直觉、顿悟、灵感等；作用：激活、驱动。\n\n2.第二次飞跃：从认识到实践：（1）第二次飞跃比第一次飞跃更重要：①从实践的角度：认识世界的目的是改造世界（指导实践）。理性认识回到实践的过程，既是理论指导实践的过程，又是理论实现自身的过程；②从认识的角度：认识的真理性只有在实践中才能得到检验和发展；（2）如何实现第二次飞跃？：需要经过一定的中介环节：①确定实践目的、形成实践理念、制定实践方案、进行中间实验、运用科学的实践方法；②最后一个环节，是对人民群众进行组织和宣传，让理论为群众所掌握，并转化为改造世界的物质力量。","notes":"","source":"苏一《27命题点高清图谱》印刷第12页；按原分支整理","source_pages":[12],"source_pdf_pages":[17],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p017_n040","p017_n041","p017_n042","p017_n043","p017_n044","p017_n045","p017_n046","p017_n047","p017_n048","p017_n049","p017_n050","p017_n051","p017_n052","p017_n053","p017_n054","p017_n055","p017_n056","p017_n057","p017_n058","p017_n059","p017_n060","p017_n061","p017_n062","p017_n063","p017_n064","p017_n065","p017_n066","p017_n067","p017_n068","p017_n069","p017_n070","p017_n071","p017_n072","p017_n073","p017_n074","p017_n075","p017_n076","p017_n077","p017_n078","p017_n079","p017_n080","p017_n081","p017_n082","p017_n083","p017_n084","p017_n085","p017_n086","p017_n087","p017_n088"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p017_a003","kind":"政治素养（感性认识/理性认识）","text":"1.感觉（如视觉、听觉、触觉）是感性认识也是整个认识过程的起始环节；2.感性认识与理性认识的三种形式（由低级到高级）：感性认识——感觉→知觉→表象；理性认识——概念（思维的细胞、最基本的思维形式）→判断→推理；3.不管是感性认识还是理性认识都属于认识，只要是认识，都来源于实践（实践决定认识，认识来源于实践）。","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":42},{"id":"suyi-marx-p013-n003-g01","revision":1,"path":["马原","第二章 实践与认识","考点6：实践与认识的辩证运动及其规律"],"type":"group","title":"实践与认识的辩证运动及其规律","question":"实践与认识的辩证运动及其规律的基本内容、作用和方法论要求是什么？","answer":"1.辩证认识过程（总规律）：（1）规律：由感性认识到理性认识，又由理性认识到实践的飞跃，是实践、认识、再实践、再认识，循环往复以至无穷的辩证发展过程；（2）过程：认识是一个反复循环和无限发展的过程。这个过程：既是认识在实践基础上沿着科学性方向不断深化发展的过程；也是实践在认识的指导下沿着合理性方向不断深入推进的过程；（3）形式：不是封闭式的循环，也不是直线式的发展，是一个波浪式前进和螺旋式上升的过程。\n\n2.实践和认识：（1）说它“完成了” 是针对具体事物的认识而言；（2）说它“又没有完成” 是针对实践和认识运动过程的向前推移、向前发展而言的；（3）认识受主客观条件的限制，需要多次反复：①主观条件：人的认识能力受到科学技术条件限制，是有限度的；②客观条件：客观事物的本质属性和规律暴露需要一个过程。\n\n3.认识和实践的具体的历史的统一：（1）具体的 主观认识要与一定时间、地点、条件下的客观实践相符合；（2）历史的 主观认识要同特定历史发展阶段的客观实践相符合；（3）由于客观实践是具体的、历史的，所以主观认识也应当是具体的、历史的；错误观点：①实践超前于认识：冒进主义（“左”的错误）；②实践落后于认识：保守主义（右的错误）。","notes":"","source":"苏一《27命题点高清图谱》印刷第13页；按原分支整理","source_pages":[13],"source_pdf_pages":[18],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p018_n004","p018_n005","p018_n006","p018_n007","p018_n008","p018_n009","p018_n010","p018_n011","p018_n012","p018_n013","p018_n014","p018_n015","p018_n016","p018_n017","p018_n018","p018_n019","p018_n020","p018_n021","p018_n022"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":43},{"id":"suyi-marx-p013-n024-g01","revision":1,"path":["马原","第二章 实践与认识","考点7：真理"],"type":"group","title":"真理：真理、客观性","question":"围绕真理：真理、客观性，真理、客观性分别是什么？","answer":"1.真理：（1）含义：真理是标志主观与客观相符合的哲学范畴，是对客观事物及其规律的正确反映；（2）真理内容是客观的，形式是主观的。\n\n2.客观性：（1）真理是不是客观的，这是真理观中的首要问题；（2）真理的客观性：内容是客观的，包含着不依赖于人和人的意识的客观内容；（3）客观性是真理的本质属性：①真理具有客观性，但是真理不等同于客观事物；②真理具有主观形式，但是真理不是主观的产物；③真理固然是有用的，但有用的不都是真理；（4）真理是客观的，凡真理都是客观真理，这是真理问题上的唯物论。","notes":"","source":"苏一《27命题点高清图谱》印刷第13页；按原分支整理","source_pages":[13],"source_pdf_pages":[18],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p018_n025","p018_n026","p018_n027","p018_n028","p018_n029","p018_n030","p018_n031","p018_n032","p018_n033","p018_n034","p018_n035"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":44},{"id":"suyi-marx-p013-n024-g02","revision":1,"path":["马原","第二章 实践与认识","考点7：真理"],"type":"group","title":"真理：一元性","question":"真理：一元性的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"3.一元性：（1）一元性指在同一条件下对于特定的认识客体的真理性认识只有一个，而不可能有多个；（2）同一条件下人们对同一客观事物的多种不同认识中只有一种属于真理性的认识，即与特定的认识客体的状态、本质和规律相一致的认识才是真理；（3）真理是内容上的一元性与形式上的多样性的统一。","notes":"","source":"苏一《27命题点高清图谱》印刷第13页；按原分支整理","source_pages":[13],"source_pdf_pages":[18],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p018_n036","p018_n037","p018_n038","p018_n039"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":45},{"id":"suyi-marx-p013-n024-g03","revision":1,"path":["马原","第二章 实践与认识","考点7：真理"],"type":"group","title":"真理：真理的绝对性和相对性","question":"真理：真理的绝对性和相对性的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"4.真理的绝对性和相对性：（1）真理既具有绝对性，又具有相对性，是同一客观真理的两种属性，这是真理问题上的辩证法；（2）区别：绝对性：含义：指真理主客观统一的确定性和发展的无限性；①主客观的相统一：任何真理都标志着主观与客观相符合，都包含着不依赖于人和人的意识的客观内容，都同谬误有原则的界限：承认了真理的客观性也就是承认了真理的绝对性；②人类认识按其本性：能够正确认识无限发展的物质世界，认识前进的每一步，都是对无限发展着的物质世界的接近，这也是绝对的、无条件的：承认世界的可知性也就是承认了真理的绝对性；相对性：含义：人们在一定条件下对客观事物及其本质和发展规律的正确认识总是有限度的、不完善的；①从客观世界整体看：任何真理都是对客观世界的某一阶段、某一部分的正确认识：认识有待扩展；②就特定事物而言：任何真理都只是对客观对象一定方面、一定层次和一定程度的正确认识：认识有待深化；（3）联系：从真理的两重性上看：相互依存 任何真理都既是绝对的，又是相对的；相互包含 绝对之中有相对，相对之中有绝对：①真理的绝对性寓于真理的相对性之中；②真理的相对性包含并表现着真理的绝对性：任何真理的相对性之中都包含着真理绝对性的颗粒；从真理的发展上看：①人类的认识是一个不断深化的过程，永远处在由真理的相对性走向绝对性、接近绝对性的转化和发展过程中；②任何真理性的认识都是由真理的相对性向绝对性转化过程中的一个环节；（4）真理与人的认识能力的关系：真理的绝对性和相对性根源于人类认识世界的能力的无限性与有限性、绝对性与相对性的矛盾；人的思维能力：①思维的至上性、无限性、绝对性：全人类能够认识无限发展着的物质世界；②思维的非至上性、有限性、相对性：每一个人乃至每一代人认识世界的能力是有限的；（5）不能割裂二者关系：①片面夸大真理的绝对性 绝对主义、思想僵化、教条主义；②片面夸大真理的相对性 诡辩论、不可知论、相对主义；（6）马克思主义作为客观真理，是绝对性和相对性的统一：①马克思主义正确反映了人类社会的发展规律，因而具有绝对性；②马克思主义经典作家并没有穷尽真理，而是为不断寻求真理和发展真理开辟道路；马克思主义并没有穷尽对一切事物及其规律的认识，仍需要随着社会实践的发展而发展，因而又具有相对性。","notes":"","source":"苏一《27命题点高清图谱》印刷第13页；按原分支整理","source_pages":[13],"source_pdf_pages":[18],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p018_n040","p018_n041","p018_n042","p018_n043","p018_n044","p018_n045","p018_n046","p018_n047","p018_n048","p018_n049","p018_n050","p018_n051","p018_n052","p018_n053","p018_n054","p018_n055","p018_n056","p018_n057","p018_n058","p018_n059","p018_n060","p018_n061","p018_n062","p018_n063","p018_n064","p018_n065","p018_n066","p018_n067","p018_n068","p018_n069","p018_n070","p018_n071","p018_n072","p018_n073","p018_n074","p018_n075"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":46},{"id":"suyi-marx-p014-n002-g01","revision":1,"path":["马原","第二章 实践与认识","考点8：真理与谬误"],"type":"group","title":"真理与谬误","question":"围绕真理与谬误，含义、对立统一分别是什么？","answer":"1.含义：（1）谬误：同客观事物及其发展规律相违背的认识，是对客观事物及其发展规律的歪曲反映；（2）真理：是对客观事物及其规律的正确反映。\n\n2.对立统一—：（1）对立：在确定的对象和范围内，真理与谬误的对立是绝对的，与对象相符合的认识就是真理，与对象不相符合的认识就是谬误　真理和谬误有着原则界限；真理与谬误的对立只是在非常有限的范围内才具有绝对的意义，超出这个范围，二者的对立就是相对的：；（2）统一：超过这个范围，真理和谬误就会相互转化：首先，真理在一定条件下会转化为谬误：①真理是具体的：任何真理都是在一定范围内、一定条件下才能够成立，超出这个范围，失去特定条件，就会变成谬误；②真理又是全面的：把全面的真理性认识组成的科学体系中的某个原理孤立地抽取出来，切断同其他原理的联系，也会使其丧失自己的真理性而变为谬误；其次，谬误在一定条件下能够向真理转化：①错误往往是正确的先导，失败常常是成功之母，总结失败的教训，是获得真理、消除谬误的重要途径和方法；②勇于正视错误、反省错误、修正错误，让错误转化为正确，谬误转化为真理；最后，在批判谬误中发展真理，是谬误向真理转化的另一种形式。\n\n3.真理总是同谬误相比较而存在、相斗争而发展的","notes":"","source":"苏一《27命题点高清图谱》印刷第14页；按原分支整理","source_pages":[14],"source_pdf_pages":[19],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p019_n003","p019_n004","p019_n005","p019_n006","p019_n007","p019_n008","p019_n009","p019_n010","p019_n011","p019_n012","p019_n013","p019_n014","p019_n015","p019_n016","p019_n017"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p019_a001","kind":"补充说明","text":"★ 真理与谬误区别：是否正确反映了客观事物及其规律","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p019_a002","kind":"易错点","text":"易错点：\n1.真理是抽象的/永恒不变的，实践是具体的（×，真理也是具体的、全面的、发展的）\n2.真理是主体对客体的反映，谬误是主体自生的（×，谬误是主体对客体的歪曲反映）\n3.真理是有用的，谬误是有害的（×）\n4.真理在任何条件下都可以转化成谬误（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":47},{"id":"suyi-marx-p014-n018-g01","revision":1,"path":["马原","第二章 实践与认识","考点9：实践是检验真理的唯一标准"],"type":"group","title":"实践是检验真理的唯一标准","question":"围绕实践是检验真理的唯一标准，为什么“唯一”、逻辑证明、实践标准的确定性与不确定性分别是什么？","answer":"1.为什么“唯一”：（1）真理的本性决定（本性在于主观与客观相符合）：①主体的角度：主观认识本身不能自称正确，也不能成为检验真理的标准；②客体的角度：客观事物作为认识的对象，自身不可能回答人的认识是否同它相符合的问题；（2）实践的特点决定：①实践具有直接现实性。实践的直接现实性是它的客观实在性的具体表现；②实践的直接现实性的品格，是实践能够成为检验真理唯一标准的主要根据。\n\n2.逻辑证明：（1）在实践检验真理的过程中，逻辑证明可以起到重要的补充作用；（2）逻辑证明是探索真理、论证真理的方式，是正确思维和表达的必要条件，也是建立科学理论体系的重要途径。\n\n3.实践标准的确定性与不确定性：（1）确定性：绝对性、唯一性：①实践是检验真理的唯一标准，此外再无别的标准：实践作为检验标准具有唯一性、归根到底性、最终性；②凡是经过实践证明了的一切认识都是客观真理，都具有不可推翻的性质；③实践能够检验一切认识。即使对于有些认识，当前的实践不能检验，但不断发展着的实践终能验证它是否具有真理性；（2）不确定性：相对性、条件性：①任何实践都会受到主客观条件的制约，因而都具有不可能完全证实或驳倒一切认识的局限性；②实践检验真理是一个发展过程，不是一次性完成的；③已被实践检验过的真理还需要继续经受实践的检验；（3）坚持实践标准的确定性和不确定性的统一，就是坚持真理问题上的实践标准的辩证法。","notes":"","source":"苏一《27命题点高清图谱》印刷第14页；按原分支整理","source_pages":[14],"source_pdf_pages":[19],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p019_n019","p019_n020","p019_n021","p019_n022","p019_n023","p019_n024","p019_n025","p019_n026","p019_n027","p019_n028","p019_n029","p019_n030","p019_n031","p019_n032","p019_n033","p019_n034","p019_n035","p019_n036","p019_n037","p019_n038","p019_n039"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p019_a003","kind":"政治素养+易错点","text":"政治素养：已被逻辑证明了的东西，还必须经过实践的检验，并最终服从实践检验的结果。所以，逻辑证明也不能取代实践作为检验真理的标准。只有实践，才是检验真理的唯一标准\n易错点：逻辑证明也是检验真理的标准（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p019_a004","kind":"易错点","text":"易错点：1.原有的真理常常在实践中被推翻（×）\n2.有些真理是根本无法通过实践检验的（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p019_a005","kind":"政治素养","text":"政治素养：1.客观事物的复杂性→决定了认识的反复性→决定了实践检验真理不是一次性完成\n2.事物是变化的、发展的，条件会变。所以，已被实践检验过的真理还需要继续经受实践的检验","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":48},{"id":"suyi-marx-p014-n040-g01","revision":1,"path":["马原","第二章 实践与认识","考点10：真理与价值"],"type":"group","title":"真理与价值","question":"真理与价值体现在哪些方面？相关定位和适用条件是什么？","answer":"1.价值及其基本特性：（1）价值：在实践基础上形成的主体和客体之间的意义关系；价值离不开主体的需要，也离不开客体的特性；构成：①主体的需要；②客体的特性；（2）基本特性：主体性：始终以主体为中心；①依赖于主体的存在；②依赖于主体的创造，使客体的潜在价值转化为现实的价值；客观性：在一定条件下客体对于主体的意义不依赖于主体的主观意识而存在：价值的主体性依赖于价值的客观性；价值的主体性是以价值的客观性为前提的；①主体的存在和需要是客观的，而不是抽象的；②客体的存在、属性及作用是客观的：客体能否满足主体需要，并不由人的主观愿望决定，而是由客体客观存在的性质、属性等决定；客体的价值及价值大小，取决于客体的属性及满足主体需要的程度；多维性：①每个主体的价值关系具有多样性；②同一客体对主体的不同需要会产生不同的价值；社会历史性：主体和客体的不断变化决定了价值的社会历史性。\n\n2.价值评价及其特点：（1）价值评价：主体对客体价值以及价值大小所作的评判或判断，也称为价值判断；（2）特点：①评价以主客体之间的价值关系为认识对象；②评价结果与评价主体直接相关；③评价结果的正确与否依赖于对客体状况和主体需要的认识；④价值评价有科学和非科学之别（评价结果有正确与错误之分）；（3）是否推动社会进步，是否符合社会发展趋势，是否维护、满足最广大人民的需要和根本利益，是价值评价的最高标准，是判断特定主体实际需要是否合理的最高尺度。\n\n3.价值观与核心价值观（略）\n\n4.真理与价值在实践中的辩证统一：（1）人们的实践活动总是受着真理尺度和价值尺度的制约；（2）区别：真理尺度：实践中人们必须遵循正确反映客观事物本质和规律的真理；价值尺度：实践中人们都是按照自己的尺度和需要去认识世界和改造世界；这一尺度体现了人的活动的目的性；（3）联系：①任何实践活动都是在这两种尺度的共同制约下进行的：任何成功的实践都是真理尺度和价值尺度的统一；任何成功的实践都是合规律性和合目的性的统一；②价值尺度必须以真理为前提；只有按照真理办事，才能在实践中取得成功；③人类自身需要的内在尺度，推动着人们不断发现新的真理；脱离了价值尺度，真理就缺失了主体意义；④基于实践的具体性和历史性，真理尺度与价值尺度的统一也是具体的、历史的。","notes":"","source":"苏一《27命题点高清图谱》印刷第14、15页；按原分支整理","source_pages":[14,15],"source_pdf_pages":[19,20],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p019_n041","p019_n042","p019_n043","p019_n044","p019_n045","p019_n046","p019_n047","p019_n048","p019_n049","p019_n050","p019_n051","p019_n052","p019_n053","p019_n054","p019_n055","p019_n056","p019_n057","p019_n058","p019_n059","p019_n060","p019_n061","p019_n062","p019_n063","p019_n064","p019_n065","p020_n004","p020_n005","p020_n006","p020_n007","p020_n008","p020_n009","p020_n010","p020_n011","p020_n012","p020_n013","p020_n014","p020_n015","p020_n016","p020_n017","p020_n018","p020_n019","p020_n020","p020_n021","p020_n022","p020_n023","p020_n024"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p019_a006","kind":"政治素养","text":"政治素养：（两种错误的价值论）\n1.客观主义价值论：价值是客体本身所固有的，而与主体无关\n2.主观主义价值论：价值就是主体的欲望、情感和兴趣，而与客体无关","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p019_a007","kind":"政治素养","text":"政治素养：\n1.主体性≠主观性\n①主观：人的意识、思维所特有的状态和属性\n②主体：从事现实社会实践活动的人\n2.真理是一元的，价值是多元的，认识也是多元的\n3.主客体之间的价值关系不是一种自然的现成关系，而是主体在实践基础上确立的与客体之间的一种创造性关系","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p020_a001","kind":"政治素养：知识性认识与评价性认识","text":"政治素养：\n1.知识性认识：以客观事物及其规律为对象\n①追求客体“是什么”，以求“真”为认识目的\n②认识结果不以主体意志为转移\n2.评价性认识（价值评价）：以客体和主体之间的价值关系为认识对象\n①以获得关于客体对于主体的意义，以求“善”和“美”为认识目的\n②评价结果受主体意志影响\n3.评价作为一种价值判断活动，虽具有主观性，但并不是一种主观随意的认识活动，只有正确反映价值关系的评价才是正确的评价","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p020_a002","kind":"政治素养：A和B的统一","text":"政治素养：（A和B的统一）\n1.实践是客观规律性与主观能动性统一的基础（2024-17）\n2.人的实践活动要遵循真理尺度与价值尺度的统一\n3.人的实践活动是合乎规律性和合乎目的性的统一","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":49},{"id":"suyi-marx-p015-n026-g01","revision":1,"path":["马原","第二章 实践与认识","考点11：认识世界和改造世界相结合"],"type":"group","title":"认识世界和改造世界相结合","question":"围绕认识世界和改造世界相结合，认识世界和改造世界、改造客观世界和改造主观世界、从必然走向自由分别是什么？","answer":"1.认识世界和改造世界：（1）两种基本活动：认识世界和改造世界是人类创造历史的两种基本活动。认识的任务不仅在于解释世界，更重要的是为改造世界提供理论指导；坚持认识与实践的统一，归根到底是要将认识世界和改造世界结合起来；（2）关系：①认识世界有助于改造世界，正确认识世界是有效改造世界的必要前提：认识世界和改造世界的统一，决定了理论与实践必须相结合；②人们只有在改造世界的实践中才能不断地深化、拓展对世界的正确认识；（3）基本矛盾：主观和客观的矛盾是人类认识和实践活动中的基本矛盾，是人类认识世界和改造世界的根本动力；认识世界和改造世界统一的基础是实践。\n\n2.改造客观世界和改造主观世界：（1）认识世界的目的是改造世界，而改造世界又包括改造客观世界和改造主观世界；（2）只有在改造客观世界的实践中，才能深入改造主观世界；只有认真改造主观世界，才能更好地改造客观世界。\n\n3.从必然走向自由：（1）必然：必然性即规律性，是指不依赖于人的意识而存在的自然和社会发展所固有的客观规律；（2）自由：对必然的认识和对客观世界的改造；自由是有条件的：①认识条件；②实践条件；（3）认识必然、争取自由，是人类认识世界和改造世界的根本目标；（4）自由与必然的关系贯穿于人类存在和发展的始终，是人类存在和发展的永恒动力。","notes":"","source":"苏一《27命题点高清图谱》印刷第15页；按原分支整理","source_pages":[15],"source_pdf_pages":[20],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p020_n027","p020_n028","p020_n029","p020_n030","p020_n031","p020_n032","p020_n033","p020_n034","p020_n035","p020_n036","p020_n037","p020_n038","p020_n039","p020_n040","p020_n041","p020_n042","p020_n043","p020_n044","p020_n045","p020_n046","p020_n047","p020_n048","p020_n049","p020_n050"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p020_a003","kind":"客观世界和主观世界的区别/易错点","text":"政治素养：客观世界和主观世界的区别（详见第一篇第5页：考点6）\n易错点：探索未知世界是认识世界的最终目的（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p020_a004","kind":"必然和自由/易错点","text":"政治素养（必然和自由）：\n1.必然是自由的根据和限度。看到必然可以理解为规律，规律才是根据和限度。人们只有在认识必然的基础上，才有自由的活动\n2.自由是有条件的、相对的。只有尊重规律、在规律允许的范围内活动，才是真正的自由。所以，自由是相对的、有条件的\n易错点：\n1.自由是无条件的（×）\n2.必然是一种“不自由”，是不可被认识的（×）\n3.只有摆脱必然的制约，才能争取真正的自由（×，必然即规律，人无法摆脱规律）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":50},{"id":"suyi-marx-p015-n051-g01","revision":1,"path":["马原","第二章 实践与认识","考点12：一切从实际出发，实事求是"],"type":"group","title":"一切从实际出发，实事求是","question":"一切从实际出发，实事求是的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"1.一切从实际出发是马克思主义认识论的根本要求\n\n2.实事求是是中国共产党思想路线的核心","notes":"","source":"苏一《27命题点高清图谱》印刷第15页；按原分支整理","source_pages":[15],"source_pdf_pages":[20],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p020_n052","p020_n053"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":51},{"id":"suyi-marx-p015-n054-g01","revision":1,"path":["马原","第二章 实践与认识","考点13：坚持守正创新，实现理论创新和实践创新的良性互动"],"type":"group","title":"坚持守正创新，实现理论创新和实践创新的良性互动","question":"围绕坚持守正创新，实现理论创新和实践创新的良性互动，坚持守正创新、努力实现理论创新和实践创新的良性互动分别是什么？","answer":"1.坚持守正创新：（1）守正创新深刻揭示了坚持真理与发展真理、坚持马克思主义与发展马克思主义的辩证关系；（2）守正与创新是相辅相成的，守正是创新的前提和基础，创新是守正的目的和路径。\n\n2.努力实现理论创新和实践创新的良性互动：（1）实践创新为理论创新提供不竭的动力源泉；（2）理论创新为实践创新提供科学的行动指南；（3）我们要努力实现理论创新和实践创新的良性互动。","notes":"","source":"苏一《27命题点高清图谱》印刷第15页；按原分支整理","source_pages":[15],"source_pdf_pages":[20],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p020_n055","p020_n056","p020_n057","p020_n058","p020_n059","p020_n060","p020_n061"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[],"order":52},{"id":"suyi-marx-p016-n001-g01","revision":1,"path":["马原","第三章 唯物史观","考点1：社会存在与社会意识"],"type":"group","title":"社会存在与社会意识：哲学基本问题在社会历史观中的贯彻和表现就是社会历史观的基本问题，即社会存在和社会意识的关系问题、两种根本对立的历史观","question":"社会存在与社会意识：哲学基本问题在社会历史观中的贯彻和表现就是社会历史观的基本问题，即社会存在和社会意识的关系问题、两种根本对立的历史观怎样理解？各方的内涵、区别和相互作用是什么？","answer":"1.哲学基本问题在社会历史观中的贯彻和表现就是社会历史观的基本问题，即社会存在和社会意识的关系问题\n\n2.两种根本对立的历史观：（1）唯心史观：社会意识决定社会存在（在马克思主义产生之前，唯心史观一直占据统治地位）；主要缺陷：①至多考察了人的活动的思想动机，没有进一步考究思想动机背后的物质动因和经济根源；②根本不懂得社会历史的客观规律，也不懂得人民群众在社会历史发展中的决定作用；（2）唯物史观：社会存在决定社会意识；马克思科学地解决了社会存在与社会意识的关系问题，创立了唯物史观。","notes":"","source":"苏一《27命题点高清图谱》印刷第16页；按原分支整理","source_pages":[16],"source_pdf_pages":[21],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p021_n002","p021_n003","p021_n004","p021_n005","p021_n006","p021_n007","p021_n008","p021_n009","p021_n010","p021_n011"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p021_a001","kind":"政治素养","text":"1.旧唯物主义（“半截子”唯物主义）：在自然观上是唯物主义，在历史观上仍然是唯心主义\n2.现代辩证唯物主义：自然观上唯物，历史观上也唯物（彻底唯物主义）\n①自然观上的唯物主义：物质决定意识\n②历史观上的唯物主义：社会存在决定社会意识","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a002","kind":"政治素养","text":"1.马克思认为，应当合理地调节人与自然之间的物质变换，在最无愧于和最适合人类本性的条件下进行这种物质变换\n2.无论是自然地理环境还是人口因素，都不能脱离社会生产而发生作用，都不能决定社会的性质和社会形态的更替","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a003","kind":"政治素养","text":"社会经济发展水平较高的国家或地区，其社会意识的发展水平未必都更高；某些经济水平相对落后的国家或地区，其社会意识的某些方面却可能领先于经济发达的国家或地区。例如，恩格斯认为“经济上落后的国家在哲学上仍然能够演奏第一提琴”","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a004","kind":"政治素养","text":"政治素养：能动的反作用≠机械作用。不论是先进的社会意识，还是落后的社会意识，都会对社会存在产生反作用，只不过反作用的性质不同而已\n易错点：1.社会意识总是消极被动地受制于社会存在（×）；2.社会意识是随着时间的推移自主变化的（×）；3.社会意识并不都是社会存在的反映/社会意识不再依赖于社会存在（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":53},{"id":"suyi-marx-p016-n001-g02","revision":1,"path":["马原","第三章 唯物史观","考点1：社会存在与社会意识"],"type":"group","title":"社会存在与社会意识：社会存在","question":"社会存在与社会意识：社会存在的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"3.社会存在：含义：是指社会物质生活条件，是社会生活的物质方面，主要包括自然地理环境、人口因素和物质生产方式；内容：（1）自然地理环境（促进或延缓作用）：①是人类社会生存和发展的永恒的、必要的条件，是人们生活和生产的自然基础；②自然地理环境的作用要受社会发展状况的制约，特别是受物质资料生产方式的制约；③合理地利用自然资源，保护生态平衡，是社会得以正常发展的必要条件；（2）人口因素（加速或延缓作用）：是社会存在和发展的必要条件，是重要的社会物质生活条件，受社会生产状况和社会制度的制约；（3）物质生产方式（决定力量）：内涵：①是指人们为获取物质生活资料而进行的生产活动的方式，是生产力和生产关系的统一体，简称为生产方式；②它集中地体现了人类社会的物质性；地位：①物质生产方式是社会存在和发展的基础和决定力量，是社会历史发展的决定力量；②是人类社会存在和发展的基础，是人类其他一切活动的首要前提；③决定和制约着人们的经济生活、政治生活和精神生活等全部社会生活，决定着社会的结构、性质和面貌；④决定社会的变化发展，决定社会形态从低级向高级的更替和发展。","notes":"","source":"苏一《27命题点高清图谱》印刷第16页；按原分支整理","source_pages":[16],"source_pdf_pages":[21],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p021_n012","p021_n013","p021_n014","p021_n015","p021_n016","p021_n017","p021_n018","p021_n019","p021_n020","p021_n021","p021_n022","p021_n023","p021_n024","p021_n025","p021_n026","p021_n027","p021_n028","p021_n029","p021_n030"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p021_a001","kind":"政治素养","text":"1.旧唯物主义（“半截子”唯物主义）：在自然观上是唯物主义，在历史观上仍然是唯心主义\n2.现代辩证唯物主义：自然观上唯物，历史观上也唯物（彻底唯物主义）\n①自然观上的唯物主义：物质决定意识\n②历史观上的唯物主义：社会存在决定社会意识","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a002","kind":"政治素养","text":"1.马克思认为，应当合理地调节人与自然之间的物质变换，在最无愧于和最适合人类本性的条件下进行这种物质变换\n2.无论是自然地理环境还是人口因素，都不能脱离社会生产而发生作用，都不能决定社会的性质和社会形态的更替","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a003","kind":"政治素养","text":"社会经济发展水平较高的国家或地区，其社会意识的发展水平未必都更高；某些经济水平相对落后的国家或地区，其社会意识的某些方面却可能领先于经济发达的国家或地区。例如，恩格斯认为“经济上落后的国家在哲学上仍然能够演奏第一提琴”","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a004","kind":"政治素养","text":"政治素养：能动的反作用≠机械作用。不论是先进的社会意识，还是落后的社会意识，都会对社会存在产生反作用，只不过反作用的性质不同而已\n易错点：1.社会意识总是消极被动地受制于社会存在（×）；2.社会意识是随着时间的推移自主变化的（×）；3.社会意识并不都是社会存在的反映/社会意识不再依赖于社会存在（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":54},{"id":"suyi-marx-p016-n001-g03","revision":1,"path":["马原","第三章 唯物史观","考点1：社会存在与社会意识"],"type":"group","title":"社会存在与社会意识：社会意识","question":"社会存在与社会意识：社会意识的完整内容是什么？需要成组记住哪些要点和对应关系？","answer":"4.社会意识：含义：是社会存在的反映，是社会生活的精神方面；根据不同主体：（1）个体意识：个人的生活经历和社会地位等在自己头脑中的反映，是个体社会实践的产物；（2）群体意识：群体成员共同的意识，是群体实践的产物；根据不同层次：（1）社会心理：低层次的社会意识，以感性认识为主（自发的、不系统的）。比如，感知、情绪、情感、心态、习俗等；（2）社会意识形式：分类：①意识形态（观念上层建筑，有阶级性）：含义：反映一定经济关系、政治关系，以及一定阶级或社会集团利益和要求的思想体系；包括：政治法律思想（核心地位、主导作用）、道德、艺术、宗教、哲学；②非意识形态（无阶级性）：包括：自然科学和语言学、形式逻辑等一部分社会科学；第一，不具有社会经济形态和政治制度性；第二，不反映特定社会集团的利益和要求；第三，不服务于特定经济政治制度和特定阶级；表现：政治法律思想、道德、艺术、宗教、哲学、科学等；（3）关系：①社会心理是社会意识形式的基础；②社会意识形式对社会心理起指导和影响作用。","notes":"","source":"苏一《27命题点高清图谱》印刷第16页；按原分支整理","source_pages":[16],"source_pdf_pages":[21],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p021_n031","p021_n032","p021_n033","p021_n034","p021_n035","p021_n036","p021_n037","p021_n038","p021_n039","p021_n040","p021_n041","p021_n042","p021_n043","p021_n044","p021_n045","p021_n046","p021_n047","p021_n048","p021_n049","p021_n050","p021_n051"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p021_a001","kind":"政治素养","text":"1.旧唯物主义（“半截子”唯物主义）：在自然观上是唯物主义，在历史观上仍然是唯心主义\n2.现代辩证唯物主义：自然观上唯物，历史观上也唯物（彻底唯物主义）\n①自然观上的唯物主义：物质决定意识\n②历史观上的唯物主义：社会存在决定社会意识","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a002","kind":"政治素养","text":"1.马克思认为，应当合理地调节人与自然之间的物质变换，在最无愧于和最适合人类本性的条件下进行这种物质变换\n2.无论是自然地理环境还是人口因素，都不能脱离社会生产而发生作用，都不能决定社会的性质和社会形态的更替","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a003","kind":"政治素养","text":"社会经济发展水平较高的国家或地区，其社会意识的发展水平未必都更高；某些经济水平相对落后的国家或地区，其社会意识的某些方面却可能领先于经济发达的国家或地区。例如，恩格斯认为“经济上落后的国家在哲学上仍然能够演奏第一提琴”","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a004","kind":"政治素养","text":"政治素养：能动的反作用≠机械作用。不论是先进的社会意识，还是落后的社会意识，都会对社会存在产生反作用，只不过反作用的性质不同而已\n易错点：1.社会意识总是消极被动地受制于社会存在（×）；2.社会意识是随着时间的推移自主变化的（×）；3.社会意识并不都是社会存在的反映/社会意识不再依赖于社会存在（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":55},{"id":"suyi-marx-p016-n001-g04","revision":1,"path":["马原","第三章 唯物史观","考点1：社会存在与社会意识"],"type":"group","title":"社会存在与社会意识：辩证关系","question":"社会存在与社会意识：辩证关系怎样理解？各方的内涵、区别和相互作用是什么？","answer":"5.辩证关系：（1）社会存在决定社会意识，社会意识是社会存在的反映：①社会意识的内容的客观来源是社会存在，社会意识是社会物质生活过程及其条件的主观反映，社会意识根源于社会存在；②社会意识是人们进行社会物质交往的产物；③社会意识随着社会存在的发展，也相应地或早或迟地发生变化和发展；社会意识是具体的、历史的；但不管怎样变化和发展，其根源总是深藏于经济事实当中；（2）社会意识既依赖于社会存在，又有其相对独立性：①社会意识与社会存在发展具有不完全同步性和不平衡性；②社会意识内部各种形式之间存在相互影响且各自具有历史继承性；③社会意识对社会存在具有能动的反作用，这是社会意识相对独立性的突出表现：先进的社会意识反映了社会发展的趋势和要求，对社会发展起着积极的促进作用；落后的社会意识不符合社会发展的趋势和要求，对社会发展起着消极的阻碍作用。","notes":"","source":"苏一《27命题点高清图谱》印刷第16页；按原分支整理","source_pages":[16],"source_pdf_pages":[21],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p021_n052","p021_n053","p021_n054","p021_n055","p021_n056","p021_n057","p021_n058","p021_n059","p021_n060","p021_n061","p021_n062"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p021_a001","kind":"政治素养","text":"1.旧唯物主义（“半截子”唯物主义）：在自然观上是唯物主义，在历史观上仍然是唯心主义\n2.现代辩证唯物主义：自然观上唯物，历史观上也唯物（彻底唯物主义）\n①自然观上的唯物主义：物质决定意识\n②历史观上的唯物主义：社会存在决定社会意识","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a002","kind":"政治素养","text":"1.马克思认为，应当合理地调节人与自然之间的物质变换，在最无愧于和最适合人类本性的条件下进行这种物质变换\n2.无论是自然地理环境还是人口因素，都不能脱离社会生产而发生作用，都不能决定社会的性质和社会形态的更替","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a003","kind":"政治素养","text":"社会经济发展水平较高的国家或地区，其社会意识的发展水平未必都更高；某些经济水平相对落后的国家或地区，其社会意识的某些方面却可能领先于经济发达的国家或地区。例如，恩格斯认为“经济上落后的国家在哲学上仍然能够演奏第一提琴”","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a004","kind":"政治素养","text":"政治素养：能动的反作用≠机械作用。不论是先进的社会意识，还是落后的社会意识，都会对社会存在产生反作用，只不过反作用的性质不同而已\n易错点：1.社会意识总是消极被动地受制于社会存在（×）；2.社会意识是随着时间的推移自主变化的（×）；3.社会意识并不都是社会存在的反映/社会意识不再依赖于社会存在（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":56},{"id":"suyi-marx-p016-n001-g05","revision":1,"path":["马原","第三章 唯物史观","考点1：社会存在与社会意识"],"type":"group","title":"社会存在与社会意识：重要意义","question":"社会存在与社会意识：重要意义体现在哪些方面？相关定位和适用条件是什么？","answer":"6.重要意义：（1）唯物史观认为，社会存在决定社会意识，社会意识能动地反作用于社会存在，从而在人类思想史上第一次正确回答了社会历史观的基本问题，宣告了唯心史观的彻底破产；（2）对于推进社会主义思想文化建设具有重要的指导意义。","notes":"","source":"苏一《27命题点高清图谱》印刷第16页；按原分支整理","source_pages":[16],"source_pdf_pages":[21],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p021_n063","p021_n064","p021_n065"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p021_a001","kind":"政治素养","text":"1.旧唯物主义（“半截子”唯物主义）：在自然观上是唯物主义，在历史观上仍然是唯心主义\n2.现代辩证唯物主义：自然观上唯物，历史观上也唯物（彻底唯物主义）\n①自然观上的唯物主义：物质决定意识\n②历史观上的唯物主义：社会存在决定社会意识","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a002","kind":"政治素养","text":"1.马克思认为，应当合理地调节人与自然之间的物质变换，在最无愧于和最适合人类本性的条件下进行这种物质变换\n2.无论是自然地理环境还是人口因素，都不能脱离社会生产而发生作用，都不能决定社会的性质和社会形态的更替","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a003","kind":"政治素养","text":"社会经济发展水平较高的国家或地区，其社会意识的发展水平未必都更高；某些经济水平相对落后的国家或地区，其社会意识的某些方面却可能领先于经济发达的国家或地区。例如，恩格斯认为“经济上落后的国家在哲学上仍然能够演奏第一提琴”","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p021_a004","kind":"政治素养","text":"政治素养：能动的反作用≠机械作用。不论是先进的社会意识，还是落后的社会意识，都会对社会存在产生反作用，只不过反作用的性质不同而已\n易错点：1.社会意识总是消极被动地受制于社会存在（×）；2.社会意识是随着时间的推移自主变化的（×）；3.社会意识并不都是社会存在的反映/社会意识不再依赖于社会存在（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":57},{"id":"suyi-marx-p017-n001-g01","revision":1,"path":["马原","第三章 唯物史观","考点2：社会基本矛盾及其运动规律"],"type":"group","title":"社会基本矛盾及其运动规律：内涵、规律一","question":"社会基本矛盾及其运动规律：内涵、规律一的基本内容、作用和方法论要求是什么？","answer":"内涵：1.人类社会的基本矛盾：生产力与生产关系、经济基础与上层建筑之间的矛盾；2.人类社会发展的基本规律：①生产力与生产关系矛盾运动的规律；②经济基础与上层建筑矛盾运动的规律。\n\n规律一：生产力与生产关系的矛盾运动及其规律：1.生产力：含义：人类在生产实践中形成的改造和影响自然以使其适合社会需要的物质力量，具有客观现实性和社会历史性；范围：（1）生产力水平：表现为生产发展的现实程度；（2）生产力性质：取决于生产的物质技术性质（主要是劳动资料的性质）；（3）生产力状况：生产力水平和性质的统一，表现为生产力的运行状态或发展态势；（4）生产力发展要求：指现实的生产力不断获得解放和发展的基本要求；基本要素：（1）劳动资料（劳动手段）：①人们在劳动过程中所运用的物质资料或物质条件，其中最重要的是生产工具；②生产工具是区分社会经济时代的客观依据；（2）劳动对象：①一切自然物质都是可能的劳动对象，其中引入生产过程的部分则是现实的劳动对象；②劳动对象是现实生产的必要前提，不同的劳动对象直接制约着生产的发展水平；（3）劳动者：①具有一定生产经验、劳动技能和知识，能够运用一定劳动资料作用于劳动对象，从事生产实践活动的人；②劳动者是生产力中最活跃的因素；③人类智慧和能力的发展决定着对物质资源开发的深度和广度；重要因素：科学技术是生产力中的重要因素：①科学技术能够应用于生产过程，与生产力中的劳动资料、劳动对象和劳动者等因素相结合而转化为实际生产能力；②科学技术对于生产发展的作用越来越大，日益成为生产力发展的决定性因素；③科学技术是先进生产力的集中体现和主要标志，是第一生产力；2.生产关系：含义：人们在物质生产过程中形成的不以人的意志为转移的经济关系；包括：（1）生产资料所有制关系：①是最基本的、具有决定意义的方面，是人们进行物质资料生产的前提；②是区分不同生产方式、判定社会经济结构性质的客观依据；（2）生产中人与人的关系；（3）产品分配关系；特点：（1）生产关系作为生产中人与人的关系，不是物，分析生产关系必须透过“物”看到“物”后面的人与人的关系；（2）生产关系是一种客观的物质关系，具有客观性；生产关系是一种物质利益关系，不是人们的主观愿望和要求；区分：依据生产资料所有制的性质，生产关系区分为两种基本类型；（1）以生产资料公有制为基础的生产关系——根本特征：生产资料为劳动者共同占有，在产品分配上不存在剥削；（2）以生产资料私有制为基础的生产关系；3.辩证关系：二者的有机统一构成社会的生产方式：生产力是生产的物质内容，生产关系是生产的社会形式；（1）生产力决定生产关系：①生产力状况决定生产关系的性质：有什么样的生产力，就会产生什么样的生产关系；生产力状况是生产关系形成的客观物质基础；②生产力的发展决定生产关系的变化；（2）生产关系反作用于生产力：①当生产关系适合生产力发展的客观要求时，对生产力的发展起推动作用；②当生产关系不适合生产力发展的客观要求时，就会阻碍生产力的发展。","notes":"","source":"苏一《27命题点高清图谱》印刷第17页；按原分支整理","source_pages":[17],"source_pdf_pages":[22],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p022_n002","p022_n003","p022_n004","p022_n005","p022_n006","p022_n007","p022_n008","p022_n009","p022_n010","p022_n011","p022_n012","p022_n013","p022_n014","p022_n015","p022_n016","p022_n017","p022_n018","p022_n019","p022_n020","p022_n021","p022_n022","p022_n023","p022_n024","p022_n025","p022_n026","p022_n027","p022_n028","p022_n029","p022_n030","p022_n031","p022_n032","p022_n033","p022_n034","p022_n035","p022_n036","p022_n037","p022_n038","p022_n039","p022_n040","p022_n041","p022_n042","p022_n043","p022_n044","p022_n045","p022_n046","p022_n047","p022_n048","p022_n049","p022_n050","p022_n051","p022_n052"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p022_a001","kind":"政治素养","text":"衡量生产力（详见第三篇考67页：考点4）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p022_a002","kind":"政治素养","text":"1.生产工具（劳动资料中的最重要部分）在于生产什么，而在于怎样生产，用什么劳动资料生产\n2.劳动资料+劳动对象=生产资料","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p022_a003","kind":"政治素养","text":"1.生产中人与人的关系/产品分配关系对生产资料所有制关系具有影响和制约的作用\n2.适应所有制性质的要求的，是巩固和发展所有制的作用\n3.不适应所有制性质的要求的，是削弱和瓦解所有制的作用","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p022_a004","kind":"政治素养","text":"1.生产关系是生产力发展需要的产物，只有当它为生产力发展提供足够的发展空间时才能够存在\n2.当生产关系不能适应生产力发展要求时，人们就要变革旧的生产关系，建立新的生产关系，以适应生产力的发展","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p022_a005","kind":"政治素养","text":"1.新的生产关系：总体上基本适合生产力发展，但并不排除它的某些环节或方面不适合生产力状况的局部矛盾发展\n2.旧的生产关系：总体上基本不适合生产力发展，但也不排除它的某些环节或方面的调整和改变，能够暂时地、局部地对生产力发展有一定的促进作用","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":58},{"id":"suyi-marx-p017-n001-g02","revision":1,"path":["马原","第三章 唯物史观","考点2：社会基本矛盾及其运动规律"],"type":"group","title":"社会基本矛盾及其运动规律：规律一续","question":"社会基本矛盾及其运动规律：规律一续的基本内容、作用和方法论要求是什么？","answer":"规律一续：生产力与生产关系的矛盾运动及其规律：4.矛盾运动规律：含义：生产关系一定要适合生产力状况的规律；内容：这一规律概括了生产力和生产关系相互作用的两个方面；过程：（1）生产关系对于生产力总是：基本适合→基本不适合→新的基础上的基本适合；（2）生产关系相对稳定→新旧更替→相对稳定；生产力和生产关系的这种矛盾运动循环往复，不断推动社会生产发展，进而推动整个社会逐步走向高级阶段；5.重要意义：（1）这一原理在人类思想史上彻底否定了单纯以道德作为评判历史功过是非标准的思想体系；第一次科学地确立了生产力发展是“社会进步的最高标准”；（2）是马克思主义政党制定路线、方针、政策的重要依据；生产力是推动社会进步的最活跃、最革命的要素，社会主义的根本任务是解放和发展社会生产力。","notes":"","source":"苏一《27命题点高清图谱》印刷第18页；按原分支整理","source_pages":[18],"source_pdf_pages":[23],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p023_n002","p023_n003","p023_n004","p023_n005","p023_n006","p023_n007","p023_n008","p023_n009","p023_n010","p023_n011","p023_n012","p023_n013","p023_n014"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p023_a001","kind":"政治素养","text":"生产关系一定要适合生产力状况的规律是社会形态发展的普遍规律","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p023_a002","kind":"易错点","text":"易错点：经济基础的性质由国家性质决定（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p023_a003","kind":"政治素养","text":"1.政治上层建筑是在一定意识形态指导下建立起来的，是统治阶级意志的体现\n2.政治上层建筑一旦形成，就成为一种现实的力量，影响并制约着人们的思想理论观点","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p023_a004","kind":"政治素养","text":"政治素养：国家是一个历史范畴，是一种具有政治统治和社会管理职能的有组织的力量。国家是为自己的经济基础服务的，国家的产生是一个长期的过程\n易错点：1.国家本身有鲜明的政治色彩，到了某个时候又会消失（×）；2.国家、阶级相伴相随，一直都有，不会消失","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":59},{"id":"suyi-marx-p017-n001-g03","revision":1,"path":["马原","第三章 唯物史观","考点2：社会基本矛盾及其运动规律"],"type":"group","title":"社会基本矛盾及其运动规律：规律二","question":"社会基本矛盾及其运动规律：规律二的基本内容、作用和方法论要求是什么？","answer":"规律二：经济基础与上层建筑的矛盾运动及其规律：1.经济基础（骨骼）：（1）内涵：由社会一定发展阶段的生产关系的总和；（2）理解经济基础的内涵要把握两点：①社会的一定发展阶段上往往存在多种生产关系，但决定一个社会性质的是其中占支配地位的生产关系；②经济基础与经济体制具有内在联系：经济体制是社会基本经济制度所采取的组织形式和管理形式，是生产关系的具体实现形式；经济体制与生产力发展的关系更为直接、更为具体，在实践中它总是与社会的基本经济制度结合在一起；2.上层建筑（血肉）：含义：是建立在一定经济基础之上的意识形态以及与之相适应的制度、组织和设施；分类：（1）意识形态（观念上层建筑）：政治法律思想、道德、艺术、宗教、哲学；（2）政治法律制度及设施和政治组织（政治上层建筑）：①国家政治制度、立法司法制度和行政制度；②国家政权机构、政党、军队、警察、法庭、监狱等；国家：在整个上层建筑中，政治上层建筑居于主导地位，国家政权是政治上层建筑的核心；起源：国家不是从来就有的，而是社会发展到一定历史阶段的产物；（1）国家是阶级矛盾不可调和的产物；（2）国家是阶级矛盾不可调和的工具；实质：是一个阶级统治另一个阶级的工具；3.辩证关系：（1）经济基础决定上层建筑：①经济基础是上层建筑赖以产生、存在和发展的物质基础；②经济基础的性质决定上层建筑的性质；③经济基础的变更必然引起上层建筑的变革，并决定其变革的方向；（2）上层建筑对经济基础具有反作用：①集中表现在上层建筑为自己的经济基础的形成和巩固服务，确立或维护其在社会中的统治地位；②反作用的后果：当它为适合生产力发展要求的经济基础服务时，就成为推动社会发展的进步力量；当它为落后的经济基础服务时，就成为阻碍社会发展的消极力量；③上层建筑反作用的性质，取决于它所服务的经济基础的性质，归根到底取决于它是否有利于生产力的发展；（3）矛盾运动：①在同一性质的经济基础与上层建筑的关系中，上层建筑的不完善部分、没有反映经济基础要求的部分都会同经济基础发生矛盾；②在不同性质的经济基础与上层建筑的关系中，主要表现在占统治地位的经济基础同旧上层建筑的残余、未来上层建筑的萌芽之间的矛盾，新旧上层建筑之间、新旧经济基础之间的矛盾等；③当一种社会形态处于上升发展阶段时，上层建筑对于经济基础一般是适应的；④当一种社会形态处于没落时期时，上层建筑同经济基础变革的客观要求是不相适应的，其矛盾则变为对抗性的、全局性的矛盾；（4）规律：上层建筑一定要适合经济基础状况的规律；①经济基础状况决定上层建筑的性质和方向，决定上层建筑相应的调整或变革；②上层建筑的反作用必须取决于和服从于经济基础的性质和客观要求。","notes":"","source":"苏一《27命题点高清图谱》印刷第18页；按原分支整理","source_pages":[18],"source_pdf_pages":[23],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p023_n015","p023_n016","p023_n017","p023_n018","p023_n019","p023_n020","p023_n021","p023_n022","p023_n023","p023_n024","p023_n025","p023_n026","p023_n027","p023_n028","p023_n029","p023_n030","p023_n031","p023_n032","p023_n033","p023_n034","p023_n035","p023_n036","p023_n037","p023_n038","p023_n039","p023_n040","p023_n041","p023_n042","p023_n043","p023_n044","p023_n045","p023_n046","p023_n047","p023_n048","p023_n049","p023_n050","p023_n051","p023_n052","p023_n053"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p023_a001","kind":"政治素养","text":"生产关系一定要适合生产力状况的规律是社会形态发展的普遍规律","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p023_a002","kind":"易错点","text":"易错点：经济基础的性质由国家性质决定（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p023_a003","kind":"政治素养","text":"1.政治上层建筑是在一定意识形态指导下建立起来的，是统治阶级意志的体现\n2.政治上层建筑一旦形成，就成为一种现实的力量，影响并制约着人们的思想理论观点","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p023_a004","kind":"政治素养","text":"政治素养：国家是一个历史范畴，是一种具有政治统治和社会管理职能的有组织的力量。国家是为自己的经济基础服务的，国家的产生是一个长期的过程\n易错点：1.国家本身有鲜明的政治色彩，到了某个时候又会消失（×）；2.国家、阶级相伴相随，一直都有，不会消失","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":60},{"id":"suyi-marx-p019-n002-g01","revision":1,"path":["马原","第三章 唯物史观","考点3：人类普遍交往与世界历史的形成发展"],"type":"group","title":"人类普遍交往与世界历史的形成发展","question":"人类普遍交往与世界历史的形成发展有哪些阶段、重要节点及其意义？","answer":"1.交往：含义：是唯物史观的重要范畴，指在一定历史条件下的现实的个人、群体、阶级、民族、国家之间在物质和精神上相互往来、相互作用、彼此联系的活动；社会生产力的发展水平直接制约着交往的水平；类型：（1）物质交往：是指人们在物质生产实践中发生的交往，物质产品是其交往内容；（2）精神交往：是指一定的历史条件下，人们在涉及思想、意识、观念、情感和信仰等精神性的领域中进行的交往；交往的作用：（1）促进生产力的发展；（2）促进社会关系的进步；（3）促进文化的发展与传播；（4）促进人的全面发展。\n\n2.世界历史：含义：唯物史观中的“世界历史”是指各民族、国家通过普遍交往，打破孤立隔绝的状态，进入相互依存、相互联系的世界整体化的历史；形成与发展：（1）生产方式的发展变革是世界历史形成和发展的基础；（2）普遍交往是世界历史的基本特征；（3）世界历史的形成与发展为共产主义的实现提供了条件和路径；（4）马克思的世界历史理论为我们观察、分析当今世界发展特别是经济全球化问题提供了科学的理论指导。","notes":"","source":"苏一《27命题点高清图谱》印刷第19页；按原分支整理","source_pages":[19],"source_pdf_pages":[24],"content_status":"STRUCTURED_TEXT_REORGANIZED","source_node_ids":["p024_n003","p024_n004","p024_n005","p024_n006","p024_n007","p024_n008","p024_n009","p024_n010","p024_n011","p024_n012","p024_n013","p024_n014","p024_n015","p024_n016","p024_n017","p024_n018","p024_n019","p024_n020","p024_n021"],"source_method":"既有结构化底稿按原考点与完整分支整理；未宣称逐字终审","source_notes":[{"id":"p024_a001","kind":"政治素养","text":"1.物质交往是精神交往的基础和根源\n2.精神交往是物质交往的产物，渗透于物质交往之中","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p024_a002","kind":"政治素养","text":"1.社会的发展和进步集中表现在社会形态的发展\n2.人类社会就是这样由低级到高级向前发展，同时也不断实现着人的发展，并最终实现人类解放","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p024_a003","kind":"政治素养","text":"1.社会形态更替是统一性和多样性的统一，一般过程和道路与具体道路相统一，社会形态发展的纵向统一性和横向多样性统一\n2.社会形态的形成与发展都要通过社会形态的连续运动","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"},{"id":"p024_a004","kind":"政治素养","text":"1.社会形态形成和发展具有多样性，可实现跨越式发展，但仍尊重总方向，跨越的限度是受总体历史进程制约的\n2.社会形态的更替过程中，人是主体：自觉的、能动的，有人的参与；自然界自然的，没有人的参与\n3.自然界和人类社会：都是于物质世界，都是有客观规律，不以人的意志为转移\n易错点：社会形态的发展是自发的过程（×）；社会形态的发展与自然界的发展完全一样（×）","status":"SOURCE_NOTE_NOT_FINAL_AUDIT"}],"order":61},{"id":"suyi-marx-p019-n022-g01","revision":1,
