plugins {
    id 'com.android.application'
}
android {
    namespace 'org.vector.politicsmemory'
    compileSdk 35
    defaultConfig {
        applicationId 'org.vector.politicsmemory.stable'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.12.2'
        testInstrumentationRunner 'org.vector.politicsmemory.StudyControlsInstrumentation'
    }
    signingConfigs {
        debug { storeFile file(System.getProperty('user.home') + '/.android/debug.keystore') }
        stableRelease {
            storeFile file(System.getenv('PM_SIGNING_KEYSTORE') ?: rootProject.file('.signing/NOT_PROVISIONED.p12').path)
            storePassword System.getenv('PM_SIGNING_PASSWORD') ?: ''
            keyAlias 'politicsmemory-stable'
            keyPassword System.getenv('PM_SIGNING_PASSWORD') ?: ''
            storeType 'PKCS12'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.stableRelease }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'mp3' }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}
