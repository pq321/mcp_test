 第六章 法治素养\",\"考点11 不断提升法治素养\"],\"type\":\"keypoint\",\"question\":\"尊重法律权威的四项要求是什么？\",\"answer\":\"信仰法律、遵守法律、服从法律、维护法律。\",\"source\":\"苏一思修思维导图·印刷第135页；腿姐思修关键词归纳\",\"order\":91},{\"id\":\"sixiu-k-092\",\"revision\":1,\"path\":[\"思修\",\"02 第二章 理想信念\",\"考点3 在实现中国梦的实践中放飞青春梦想\"],\"type\":\"essay\",\"question\":\"如何简述理想与现实的辩证关系以及实现理想的路径？\",\"answer\":\"1. 理想与现实既对立又统一：理想超越现实，同时以现实为基础、受现实条件制约。\\n2. 二者在一定条件下可以相互转化，理想的实现具有长期性、艰巨性和曲折性。\\n3. 坚定理想信念，立足现实，勇于实践，艰苦奋斗，在实践中把理想变为现实。\",\"source\":\"苏一思修思维导图·印刷第124页；腿姐思修关键词归纳\",\"order\":92},{\"id\":\"sixiu-k-093\",\"revision\":1,\"path\":[\"思修\",\"01 第一章 人生观\",\"考点2 正确的人生观\"],\"type\":\"essay\",\"question\":\"如何评价和实现有意义的人生价值？\",\"answer\":\"1. 坚持服务人民、奉献社会的人生追求，将个人发展融入社会进步。\\n2. 评价人生价值，根本上看是否符合社会发展客观规律、是否促进历史进步；具体看劳动、奉献与为人民服务。\\n3. 评价时兼顾贡献大小与尽力程度、物质与精神贡献、社会贡献与自身完善。\\n4. 立足社会与自身条件，在社会实践中增长本领，实现人生价值。\",\"source\":\"苏一思修思维导图·印刷第122页；腿姐思修关键词归纳\",\"order\":93}]}";

function safe(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
const PACK=JSON.parse(PACK_JSON), STARTER=PACK.cards.slice().sort((a,b)=>a.order-b.order), STORAGE='politics_web_preview_v1';
let cards=STARTER.map(x=>({...x})), review={};

try{const s=JSON.parse(localStorage.getItem(STORAGE)||'null');if(s){review=s.review||{};historyEvents=s.events||[];app.showAnswer=!!s.showAnswer;app.goal=s.goal||25;if(s.cards&&Array.isArray(s.cards))cards=s.cards; if(s.open)app.open=new Set(s.open);}}catch(e){}
const ui=document.getElementById('screen'),foot=document.getElementById('bottom'),playerHost=document.getElementById('playerhost');const audio=new Audio();audio.preload='none';let audioQueue=[],audioPos=0,playing=false,paused=true,activeSource='',stopOnError=false;
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({cards,review,events:historyEvents,showAnswer:app.showAnswer,goal:app.goal,open:[...app.open]}));}catch(e){/* Opaque preview origins may reject browser storage; keep in-session state. */}}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('on');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.remove('on'),2500)}
function state(c){return review[c.id]||{score:0,reviewCount:0,lastRating:'',lastYesDay:'',dueAt:0,needsReview:false,lastReviewAt:0}}
function label(c){const x=state(c);if(x.reviewCount===0)return '未学';if(x.needsReview)return '待复核';if(x.lastRating==='no')return '不会';if(x.lastRating==='fuzzy')return '模糊';if(x.score>=4)return '牢固';if(x.score===3)return '掌握';return '熟悉';}
function mastered(c){const x=state(c);return x.score>=3&&x.lastRating==='yes'&&!x.needsReview}
function summary(list){const now=Date.now(),total=list.length,covered=list.filter(c=>state(c).reviewCount>0).length,masteredN=list.filter(mastered).length,due=list.filter(c=>state(c).reviewCount>0&&(state(c).dueAt<=now||state(c).needsReview)).length,unseen=total-covered,reviewN=list.filter(c=>state(c).needsReview).length,avg=total?list.reduce((s,c)=>s+state(c).score,0)/total:0;return {total,covered,mastered:masteredN,due,unseen,reviewN,avg}}
function rowProgress(list){const s=summary(list);return `覆盖 ${s.covered}/${s.total}　 掌握 ${s.mastered}/${s.total}　 熟悉 ${s.avg.toFixed(1)}/4`}
function getToday(){const now=Date.now();const due=cards.filter(c=>state(c).reviewCount>0&&(state(c).dueAt<=now||state(c).needsReview)).sort((a,b)=>state(a).dueAt-state(b).dueAt);const fresh=cards.filter(c=>state(c).reviewCount===0);return [...due,...fresh].slice(0,app.goal);}
function fromScope(set,scope='选定内容',startId=null){app.session=set.slice();app.scope=scope;app.index=Math.max(0,startId?set.findIndex(x=>x.id===startId):0);app.showAnswer=!!app.showAnswer;app.tab='review';render();}
function switchTab(tab){app.tab=tab;if(tab==='review'&&app.session.length===0){app.session=getToday();app.scope='今日复习';app.index=0;}render()}
function page(title){return `<div class="pad"><div class="header"><span class="head-title">${safe(title)}</span><button class="dots" onclick="switchTab('settings')" aria-label="资料设置">⋮</button></div>`}
function renderNav(){const t=[['review','复习','review'],['books','资料','book'],['stats','统计','stats'],['settings','我的','user']];foot.innerHTML=t.map(([k,label,ic])=>`<button class="tab ${app.tab===k?'active':''}" onclick="switchTab('${k}')" aria-label="${label}">${ico(ic,22)}<span>${label}</span></button>`).join('')}
function treeCards(pre,s,ch,topic){return cards.filter(c=>(!s||c.path[0]===s)&&(!ch||c.path[1]===ch)&&(!topic||c.path[2]===topic));}
function playButton(id,level){return `<button class="pbtn" title="从此处开始连续朗读后续全部知识" aria-label="从此处开始播放" onclick="event.stopPropagation();playFromId('${safe(id)}',true)">${ico('play',19)}</button>`}
function folderRow(path,label,level,list,first){const open=app.open.has(path);return `<div class="tree-row lev${level}"><button class="expand-btn" aria-expanded="${open}" onclick="toggleTree('${safe(path)}')"><span class="chev">${open?'▾':'▸'}</span><span class="tree-label">${safe(label)}</span></button>${playButton(first,level)}</div><div class="progress-line lev${level}">${rowProgress(list)}</div>${level===1?`<div class="progressbar"><span style="width:${list.length?summary(list).mastered/list.length*100:0}%"></span></div>`:''}`}
function toggleTree(key){const el=ui;const top=el.scrollTop;app.open.has(key)?app.open.delete(key):app.open.add(key);persist();renderBooks();el.scrollTop=top;}
function renderBooks(){
  app.tab='books';
  const s=summary(cards);
  let html=page('Books · 政治背诵')+`<div class="search">${ico('search',20)}<input id="searchBox" placeholder="搜索知识点 / 考点" value="${safe(app.search)}" autocomplete="off" aria-label="搜索知识点"></div>`;
  html+=`<div class="hero-stats"><div class="tile" role="button" onclick="switchTab('review')"><div class="num">${app.goal}条</div><div class="tile-label">每日目标 · 点击复习开始</div></div><div class="tile" role="button" onclick="switchTab('stats')"><div class="num">${s.avg.toFixed(1)}/4</div><div class="tile-label">平均熟悉度 · 掌握${s.mastered}条</div></div></div>`;
  html+=`<div class="tiny-stats"><div class="tiny teal">到期 <span class="number">${s.due}</span></div><div class="tiny grey">未学习 <span class="number">${s.unseen}</span></div><div class="tiny orange">待复核 <span class="number">${s.reviewN}</span></div></div>`;
  if(app.search.trim()){
    const q=app.search.trim().toLocaleLowerCase();
    const found=cards.filter(c=>(c.question+' '+c.answer+' '+c.path.join(' ')+' '+c.source).toLocaleLowerCase().includes(q));
    html+=`<div class="section-head">搜索结果 · ${found.length}条</div>`;
    for(const c of found){
      html+=`<div class="list-card"><p>${safe(c.question)}</p><small>${safe(c.path.slice(1).join(' · '))}</small><div style="display:flex;justify-content:end;gap:9px;margin-top:8px"><button class="outline-action" onclick="fromScope(cards,'搜索结果','${safe(c.id)}')">背诵</button><button class="outline-action" onclick="playFromId('${safe(c.id)}',true)">▶ 朗读</button></div></div>`;
    }
  } else {
    html+='<div class="section-head">科目 · 章节 · 考点</div>';
    const subjs=[...new Set(cards.map(c=>c.path[0]))];
    for(const subj of subjs){
      const slist=treeCards(null,subj),sp='S:'+subj;
      html+=`<div class="tree-wrap" style="margin:9px 0 12px">${folderRow(sp,subj,1,slist,slist[0].id)}`;
      if(app.open.has(sp)){
        const chs=[...new Set(slist.map(c=>c.path[1]))];
        for(const ch of chs){
          const clist=treeCards(null,subj,ch),cp='C:'+subj+'|'+ch;
          html+=`<div class="nested" style="margin-bottom:7px">${folderRow(cp,ch,2,clist,clist[0].id)}`;
          if(app.open.has(cp)){
            const topics=[...new Set(clist.map(c=>c.path[2]))];
            for(const topic of topics){
              const tlist=treeCards(null,subj,ch,topic),tp='T:'+subj+'|'+ch+'|'+topic;
              html+=`<div class="nested">${folderRow(tp,topic,3,tlist,tlist[0].id)}`;
              if(app.open.has(tp)){
                for(const c of tlist){
                  const l=label(c),badge=mastered(c)?'mastered':l==='不会'||l==='模糊'?'weak':'';
                  html+=`<div class="leaf"><button class="leaf-btn" onclick="fromScope(cards,'${safe(topic)}','${safe(c.id)}')"><div class="leaf-title">${safe(c.question)}</div><div class="leaf-answer">${safe(c.answer)}</div></button><span class="leaf-badge ${badge}">${safe(l)}</span></div>`;
                }
              }
              html+='</div>';
            }
          }
          html+='</div>';
        }
      }
      html+='</div>';
    }
    html+=`<div class="small-note" style="padding:8px 5px 26px">当前为93条思修重点K入门素材，共36个有内容的考点；不是苏一全书逐字稿。点击标题展开，右侧播放会连续朗读后续知识点。</div>`;
  }
  html+='</div>';
  ui.innerHTML=html;
  const input=document.getElementById('searchBox');
  if(input)input.addEventListener('input',e=>{
    const caret=e.target.selectionStart;
    app.search=e.target.value;
    const pos=ui.scrollTop;
    renderBooks();ui.scrollTop=pos;
    const el=document.getElementById('searchBox');
    if(el){el.focus();try{el.setSelectionRange(caret,caret)}catch(e){}}
  });
}

function renderReview(){app.tab='review';if(!app.session.length)app.session=getToday();const s=app.session;if(!s.length){ui.innerHTML='<div class="empty">今日背诵已完成。<br>你仍可以从资料目录中选择任意章节复习。</div>';return}app.index=Math.max(0,Math.min(app.index,s.length-1));const c=s[app.index];const x=state(c);const l=label(c);const ans=app.showAnswer?`<div class="answer-block"><div class="answer-head">答案 · ${safe(l)} （${x.score}/4）</div>${safe(c.answer)}<div class="answer-source">来源：${safe(c.source)}</div></div>`:`<div class="answer-prompt">请回忆知识点<br>点击屏幕显示答案</div>`;
ui.innerHTML=`<div class="review-screen"><div class="question-banner"><div class="backrow"><button class="circlebtn" onclick="switchTab('books')" aria-label="返回目录">‹</button><span style="font-size:15px;flex:1">${app.index+1}/${s.length}</span><button class="mode-btn" onclick="toggleAnswer()">${app.showAnswer?'显示答案':'隐藏答案'}</button><button class="circlebtn" onclick="playReview()" title="连续播放预生成音频" aria-label="播放音频">${playing&&!paused?'Ⅱ':'▶'}</button></div><div class="question-title">${safe(c.question)}</div><div class="question-path">${safe(c.path.join(' · '))}</div></div><div class="review-center ${app.showAnswer?'showing':''}" id="swipe" onclick="centerClick(event)">${ans}<div class="review-arrows"><button class="review-arrow" onclick="event.stopPropagation();step(-1)" title="左滑上一条">←</button><button class="review-arrow" onclick="event.stopPropagation();step(1)" title="右滑下一条">→</button></div></div><div class="gradepanel"><div class="grade-row"><button class="grade no" ${app.showAnswer?'':'disabled'} onclick="rate('no')">不会</button><button class="grade fuzzy" ${app.showAnswer?'':'disabled'} onclick="rate('fuzzy')">模糊</button><button class="grade yes" ${app.showAnswer?'':'disabled'} onclick="rate('yes')">会了</button></div><div class="review-hint">← 左滑上一条 · 右滑下一条 → · 答案显隐跨卡保留</div></div></div>`;
const swipe=document.getElementById('swipe');let touch=null;swipe.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;touch={x:e.clientX,y:e.clientY,id:e.pointerId,moved:false};});swipe.addEventListener('pointerup',e=>{if(!touch||touch.id!==e.pointerId)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.45){e.preventDefault();suppressClickUntil=Date.now()+400;step(dx<0?-1:1);}touch=null;});swipe.addEventListener('pointercancel',()=>touch=null);
}
let suppressClickUntil=0;function centerClick(e){if(Date.now()<suppressClickUntil)return;if(e.target.closest('button'))return;if(!app.showAnswer)toggleAnswer()}
function toggleAnswer(){app.showAnswer=!app.showAnswer;persist();renderReview()}
function step(dir){const next=app.index+dir;if(next<0){toast('已经是第一条');return}if(next>=app.session.length){toast('已经是最后一条');return}app.index=next;renderReview();}
function localDay(ms){const d=new Date(ms);return d.getFullYear().toString()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)}
function plusDay(now,days){const d=new Date(now);d.setDate(d.getDate()+days);return +d;}
function rate(kind){if(!app.showAnswer)return;const c=app.session[app.index];const now=Date.now();const prev=state(c);let score=prev.score,yesDay=prev.lastYesDay||'';
if(kind==='no')score=0;else if(kind==='fuzzy')score=Math.max(1,score-1);else if(kind==='yes'){const day=localDay(now);score=day===yesDay?Math.max(2,score):Math.min(4,Math.max(2,score+1));yesDay=day;}
let due=kind==='no'?now+600000:kind==='fuzzy'?plusDay(now,1):plusDay(now,score===2?1:score===3?3:7);
review[c.id]={...prev,score,reviewCount:prev.reviewCount+1,lastRating:kind,lastReviewAt:now,lastYesDay:yesDay,dueAt:due,needsReview:false};historyEvents.push({id:globalThis.crypto?.randomUUID?.()||('w-'+now+'-'+Math.random()),card_id:c.id,rating:kind,score_before:prev.score,score_after:score,at:now});persist();if(app.index+1<app.session.length)app.index++;else toast('本组最后一条，已保存');renderReview();}
function renderStats(){const s=summary(cards);const bins=[0,1,2,3,4].map(n=>cards.filter(c=>state(c).score===n).length);const colors=['#e8eae9','#d3a18d','#edbf81','#68cbbb','#20ae9b'];let html=page('背诵统计')+`<div class="statlarge"><div class="statnote">知识点掌握进度</div><div class="big">${s.mastered} <span style="font-size:18px;color:#aab3b3">/ ${s.total}</span></div><div class="statnote">已背 ${s.covered}　未学 ${s.unseen}　到期 ${s.due}　待复核 ${s.reviewN}</div><div class="bar-stacked">${bins.map((n,i)=>`<span class="seg" style="background:${colors[i]};width:${s.total?100*n/s.total:0}%"></span>`).join('')}</div><div class="legend">${['未学/不会','模糊','熟悉','掌握','牢固'].map((t,i)=>`<span><i class="swatch" style="background:${colors[i]}"></i>${t} ${bins[i]}</span>`).join('')}</div></div>`;
html+=`<div class="statlarge"><div class="statnote">科目平均熟悉度</div><div class="big">${s.avg.toFixed(2)}<span style="font-size:17px;color:#aab3b3"> / 4</span></div><div class="statnote">覆盖率 ${(s.total?s.covered*100/s.total:0).toFixed(1)}%　·　掌握率 ${(s.total?s.mastered*100/s.total:0).toFixed(1)}%</div></div><div class="section-head">章节掌握情况</div>`;
for(const ch of [...new Set(cards.map(c=>c.path[1]))]){const cl=cards.filter(c=>c.path[1]===ch),t=summary(cl);html+=`<div class="stat-section"><h4>${safe(ch)}</h4><div class="statnote">${rowProgress(cl)}</div><div class="progressbar" style="margin-left:0"><span style="width:${cl.length?t.mastered/cl.length*100:0}%"></span></div></div>`;}
html+=`<div class="small-note" style="margin:16px 8px 30px">掌握判定：至少在不同日期两次选择“会了”，最近一次也为“会了”；仅揭晓答案或滑动不改变熟悉度。网页版只储存本浏览器的数据。</div></div>`;ui.innerHTML=html;}
function settingLine(title,sub,action){return `<button class="setting-item" onclick="${action}"><span><strong style="font-size:15px;font-weight:600">${safe(title)}</strong><small>${safe(sub)}</small></span><span class="right">›</span></button>`}
function renderSettings(){let html=page('我的 · 本地设置')+`<div class="intro-note"><span class="pill">离线网页演示</span><br>无需账号、无需联网。网页预览的评级数据只保存在这个浏览器，不会修改 Android App 的学习记录。</div>`;html+=settingLine('导入素材 JSON','支持与 Android App 相同的三层目录结构','document.getElementById(\'importFile\').click()');html+=settingLine('导出完整备份 JSON','包含素材、掌握度和练习日志；可交给 Codex','exportBackup()');html+=settingLine('导出进度 CSV','每条知识点的评级与下次复习时间','exportCsv()');html+=`<div class="card-select"><div>每日学习目标</div><div style="display:flex;align-items:center;margin-top:8px"><label for="dailyGoal" style="font-size:12px;color:#959b9b">每天最多复习</label><input id="dailyGoal" type="number" min="5" max="100" value="${app.goal}"><span style="font-size:12px;color:#959b9b">条</span><button class="selector-button" onclick="updateGoal()">保存</button></div></div>`;
html+=settingLine('清除本网页的演示评级','只重置浏览器记录，不删除内置93条知识点','clearPreview()');html+=`<div class="intro-note">🎧 本网页内置93条预先生成的中文MP3。点击目录播放可连续播放后续全部知识点。网页音频在手机锁屏后的行为受浏览器限制；正式APK使用 Android 媒体播放服务。<br><br>网页支持左右滑动、键盘左右方向键（左：上一条，右：下一条）、跨卡答案显示模式、三级目录和进度统计。</div></div>`;ui.innerHTML=html;}
function updateGoal(){const val=Number(document.getElementById('dailyGoal').value);if(!Number.isInteger(val)||val<5||val>100){toast('请输入5至100');return}app.goal=val;persist();toast('每日目标已保存');renderSettings()}
function clearPreview(){if(!confirm('只清除当前网页的熟悉度与历史记录？Android App里的数据不会受到影响。'))return;review={};historyEvents=[];persist();toast('网页学习记录已清空');renderSettings()}
function downloadText(name,text,type='application/json'){const blob=new Blob([text],{type:type+';charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportBackup(){const backups=Object.entries(review).map(([id,r])=>({card_id:id,score:r.score,review_count:r.reviewCount,due_at:r.dueAt,last_review_at:r.lastReviewAt,last_rating:r.lastRating,last_yes_day:r.lastYesDay,needs_review:r.needsReview}));const packs=[{schema_version:1,pack_id:PACK.pack_id,pack_revision:PACK.pack_revision,title:PACK.title,cards}];downloadText(`政治背诵_网页演示备份_${localDay(Date.now())}.json`,JSON.stringify({kind:'politics-memory-backup',schema_version:1,exported_at:Date.now(),packs,reviews:backups,events:historyEvents},null,2));toast('备份文件已导出，Codex可读取')}
function csvQ(s){return '"'+String(s??'').replaceAll('"','""')+'"'}
function exportCsv(){const lines=['\uFEFFid,subject,chapter,topic,question,answer,score,level,mastered,review_count,last_rating,last_review_at,due_at,needs_review'];for(const c of cards){const s=state(c);lines.push([c.id,...c.path,c.question,c.answer,s.score,label(c),mastered(c),s.reviewCount,s.lastRating,s.lastReviewAt,s.dueAt,s.needsReview].map(csvQ).join(','));}downloadText('政治背诵_网页演示进度.csv',lines.join('\r\n'),'text/csv');toast('CSV已导出')}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.kind==='politics-memory-backup'){if(!Array.isArray(obj.packs))throw Error('备份缺少packs');if(!confirm('导入备份中的素材与练习记录到本网页？'))return;for(const p of obj.packs)mergePack(p);for(const x of obj.reviews||[]){review[x.card_id]={score:x.score,reviewCount:x.review_count,lastRating:x.last_rating,lastYesDay:x.last_yes_day,dueAt:x.due_at,lastReviewAt:x.last_review_at,needsReview:!!x.needs_review}}historyEvents=obj.events||[];}
else mergePack(obj);persist();render();toast('导入完成，当前浏览器已更新');}catch(err){toast('导入失败：'+(err.message||String(err)))}finally{e.target.value=''}});
function mergePack(p){if(p.schema_version!==1||!Array.isArray(p.cards))throw Error('素材版本或卡片格式不正确');const existing=new Map(cards.map(c=>[c.id,c]));for(const c of p.cards){if(!c.id||!/^[A-Za-z0-9._-]{1,128}$/.test(c.id)||!Array.isArray(c.path)||c.path.length!==3||!c.question||!c.answer)throw Error('卡片缺少必要字段');const old=existing.get(c.id);if(old&&(old.question!==c.question||old.answer!==c.answer||old.type!==c.type)){const st=state(c);review[c.id]={...st,needsReview:true};}existing.set(c.id,{...c});}cards=[...existing.values()].sort((a,b)=>a.order-b.order);}
function renderPlayer(){if(!playing){playerHost.innerHTML='';return}const c=audioQueue[audioPos],curr=c?cards.find(x=>x.id===c):null;playerHost.innerHTML=`<div class="mini-player"><span class="play-indicator"></span><div class="player-text"><div class="player-heading">${curr?safe(curr.question):'连续朗读'}</div><div class="player-sub">${audioPos+1}/${audioQueue.length} · ${safe(activeSource)} · 内置中文MP3</div></div><button title="上一条" onclick="audioStep(-1)">‹</button><button title="暂停/继续" onclick="togglePlay()">${paused?'▶':'Ⅱ'}</button><button title="下一条" onclick="audioStep(1)">›</button><button title="停止" onclick="stopAudio()">×</button></div>`}
const ORIGINAL_AUDIO_TEXT=Object.fromEntries(STARTER.map(c=>[c.id,c.question+'\n'+c.answer]));
function fileForId(id){const card=cards.find(c=>c.id===id);if(!card||ORIGINAL_AUDIO_TEXT[id]!==card.question+'\n'+card.answer)return null;const b=AUDIO_B64[id];return b?'data:audio/mpeg;base64,'+b:null}
function playFromId(id,cont=true){const pos=cards.findIndex(c=>c.id===id);if(pos<0)return toast('未找到该条目');activeSource='资料目录';audioQueue=cont?cards.slice(pos).map(c=>c.id):[id];audioPos=0;playing=true;paused=true;playCurrent();}
function playReview(){if(playing&&activeSource==='今日背诵'){togglePlay();return}const items=app.session.slice(app.index);if(!items.length)return;activeSource='今日背诵';audioQueue=items.map(c=>c.id);audioPos=0;playing=true;paused=true;playCurrent();}
function playCurrent(){const id=audioQueue[audioPos];if(!id){stopAudio();return;}const src=fileForId(id);if(!src){if(audioPos+1<audioQueue.length){audioPos++;playCurrent();}else{stopAudio();toast('结束：新增素材尚无内置音频')}return}audio.src=src;audio.currentTime=0;audio.playbackRate=1;audio.play().then(()=>{paused=false;renderPlayer();if(app.tab==='review')renderReview()}).catch(()=>{paused=true;renderPlayer();toast('浏览器阻止自动播放，请再次点击▶')});renderPlayer();}
function audioStep(delta){const next=audioPos+delta;if(next<0||next>=audioQueue.length){if(next>=audioQueue.length)stopAudio();return;}audioPos=next;audio.pause();playCurrent();}
function togglePlay(){if(!playing)return; if(paused){audio.play().then(()=>{paused=false;renderPlayer();if(app.tab==='review')renderReview()}).catch(()=>toast('需点击播放器手动恢复'));}else{audio.pause();paused=true;renderPlayer();if(app.tab==='review')renderReview();}}
function stopAudio(){audio.pause();audio.removeAttribute('src');audio.load();audioQueue=[];audioPos=0;playing=false;paused=true;renderPlayer();if(app.tab==='review')renderReview();}
audio.addEventListener('ended',()=>{if(playing&&audioPos<audioQueue.length-1){audioPos++;playCurrent();}else{stopAudio();toast('当前朗读已结束')}});audio.addEventListener('error',()=>{if(!playing)return;toast('音频读取失败，跳过当前条');if(audioPos<audioQueue.length-1){audioPos++;playCurrent();}else stopAudio()});
function render(){renderNav();renderPlayer();if(app.tab==='books')renderBooks();else if(app.tab==='review')renderReview();else if(app.tab==='stats')renderStats();else renderSettings();}
window.addEventListener('keydown',e=>{if(app.tab!=='review'||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key===' '){e.preventDefault();toggleAnswer()}});
render();
</script>
</body>
</html>
