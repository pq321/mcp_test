name: Shanbei v0.12.3 focused acceptance
on:
  push:
    branches: [fix/shanbei-v0123-four-only]
    paths:
      - .github/workflows/shanbei-v0123.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify no feature or content changes beyond user request
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base='dcb1e712d74ed0d2d73c6316e011f05f014ea28c'
          got=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
            'app/src/main/java/org/vector/politicsmemory/MainActivity.java',
            'app/src/main/AndroidManifest.xml',
            'app/build.gradle',
            'app/src/main/res/drawable-nodpi/shanbei_icon.png',
            '.github/workflows/shanbei-v0123.yml',
            'qa/v0123_ui_smoke.py'
          }
          assert got == allowed, {'extra':got-allowed,'missing':allowed-got}
          src=Path('app/src/main/java/org/vector/politicsmemory/MainActivity.java').read_text()
          assert 'names={"记住","模糊","忘记"},codes={"yes","fuzzy","no"}' in src
          assert 'padding(sourceBody,18,0,0,0)' in src
          assert '同步中…' in src and 'hideSyncIndicator()' in src
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android:icon="@drawable/shanbei_icon"' in manifest
          gradle=Path('app/build.gradle').read_text()
          assert "applicationId 'org.vector.politicsmemory.stable'" in gradle
          assert 'versionCode 12' in gradle and "versionName '0.12.3'" in gradle
          assert Path('app/src/main/res/drawable-nodpi/shanbei_icon.png').stat().st_size>100000
          PY
          python scripts/validate_pack.py data/suyi-full.json
          python scripts/validate_study_resources.py
          python scripts/validate_audio.py data/suyi-full.json web-preview
      - name: Assemble unsigned release and emulator debug from original resources
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/audio deliverables evidence
          cp data/suyi-full.json app/src/main/assets/suyi-full.json
          cp data/study-resources.json app/src/main/assets/study-resources.json
          cp web-preview/audio-index.json app/src/main/assets/audio-index.json
          cp web-preview/audio/*.mp3 app/src/main/assets/audio/
          python - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle');s=p.read_text()
          needle='release { minifyEnabled false; signingConfig signingConfigs.stableRelease }'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,'release { minifyEnabled false }'))
          PY
          gradle --no-daemon :app:assembleDebug :app:assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk deliverables/Shanbei-v0.12.3-unsigned.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/aapt" dump badging deliverables/Shanbei-v0.12.3-unsigned.apk | tee evidence/app-badging.txt
          grep -q "application-label:'闪背'" evidence/app-badging.txt
          grep -q "versionCode='12' versionName='0.12.3'" evidence/app-badging.txt
          grep -q "package: name='org.vector.politicsmemory.stable'" evidence/app-badging.txt
          sha256sum deliverables/Shanbei-v0.12.3-unsigned.apk > evidence/unsigned-sha256.txt
      - name: Test actual screen ordering and indentation on disposable Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python qa/v0123_ui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shanbei-v0123-unsigned-plus-evidence
          path: |
            deliverables/
            evidence/
          retention-days: 14
