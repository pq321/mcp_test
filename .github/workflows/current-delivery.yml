name: Current study delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/current-delivery.yml
      - scripts/build_preview.py
      - qa/current_entrypoints.py
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: politics-current-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild only the already-approved study resources and web
        run: |
          set -euo pipefail
          git diff --exit-code a288669ab1948313ddaf29cd4d222b1826552f23 -- app/src/main/java data/suyi-full.json web-preview/audio-index.json
          python scripts/expand_study_anchors.py
          python scripts/validate_study_resources.py
          python scripts/validate_audio.py data/suyi-full.json web-preview
          python scripts/build_preview.py --pack data/suyi-full.json --audio-index web-preview/audio-index.json --audio-dir web-preview/audio --out site
          node --check preview/full-data.js
          node --check preview/app.js
          cp site/index.html site/progress_server.py site/study_resource_bundle.py web-preview/
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          resources=json.loads(Path('data/study-resources.json').read_text())
          report={'version':'0.12.1','source_sha':os.environ['GITHUB_SHA'],'workflow_run':os.environ['GITHUB_RUN_ID'],
                  'main_integrated':True,'original_cards':561,'annotated_cards':len(resources['annotations']),
                  'cloze_spans':sum(bool(m.get('cloze')) for a in resources['annotations'].values() for m in a['marks']),
                  'production_voices':['default'],'android_apk_rebuilt':False,
                  'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in ['preview/app.js','preview/full-data.js','data/suyi-full.json','data/study-resources.json','site/index.html']},
                  'limits':['Course ASR context is not a complete teacher-emphasis audit','Physical OPPO K5 and live Google Drive writeback not tested']}
          Path('site/build-info.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          Path('site/README.txt').write_text('PoliticsMemory v0.12.1\n打开 index.html；Windows 手动同步运行 start-sync.cmd。保留 audio/。\n资料页：苏一（可折叠）→原五科。复习：回忆→完整→挖空→回忆。声音：倍速菜单4×下方展开后全局选择。\n覆盖旧网页前先备份原目录，并沿用原浏览器、原路径；不要清除浏览器数据。网页不会自动迁移不同网址的学习记录。\n只有主动点击同步才交换文件；Google Drive 的真实云端上传需在设备确认。\n',encoding='utf-8')
          Path('site/README.md').write_text(Path('site/README.txt').read_text()+'\nCodex资料与声音发布见 CODEX_RESOURCES.md，安卓安装见 INSTALLATION.md。\n',encoding='utf-8')
          Path('web-preview/README.txt').write_text(Path('site/README.txt').read_text(),encoding='utf-8')
          PY
          cp docs/STUDY_CONTROLS_V012.md site/CODEX_RESOURCES.md
          cp docs/INSTALL_FIX_V0121.md site/INSTALLATION.md
      - name: Exercise real browser paths, retained progress and manual sync
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python qa/study_controls_smoke.py --site site
          python qa/manual_drive_smoke.py
          python qa/current_entrypoints.py
      - name: Package the current web beside the unchanged signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code v0.12.0-study-controls -- desktop/progress_server.py desktop/study_resource_bundle.py
          gh release download v0.12.0-study-controls --pattern PoliticsMemory-Sync.exe --dir site
          mkdir -p deliverables apk-check
          gh release download v0.12.1-stable-install --pattern PoliticsMemory-v0.12.1.apk --dir apk-check
          echo '46e603b7d8f471b2dc605be52c47e1e2ce84a38c932cc10c79bc0ec565496214  apk-check/PoliticsMemory-v0.12.1.apk' | sha256sum -c -
          (cd site && zip -q -r ../deliverables/PoliticsMemory-v0.12.1-web.zip .)
          (cd evidence/current-delivery && zip -q -r ../../deliverables/PoliticsMemory-v0.12.1-screenshots.zip *.png entrypoints.json)
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          report=json.loads(Path('site/build-info.json').read_text())
          report['entrypoint_acceptance']=json.loads(Path('evidence/current-delivery/entrypoints.json').read_text())
          report['behavior_acceptance']=json.loads(Path('evidence/v012-web.json').read_text())
          report['signed_apk_sha256']=hashlib.sha256(Path('apk-check/PoliticsMemory-v0.12.1.apk').read_bytes()).hexdigest()
          report['web_zip_sha256']=hashlib.sha256(Path('deliverables/PoliticsMemory-v0.12.1-web.zip').read_bytes()).hexdigest()
          Path('deliverables/CURRENT_DELIVERY.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          Path('docs/CURRENT_DELIVERY.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          gh release upload v0.12.1-stable-install deliverables/* --clobber
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/full-data.js web-preview/index.html web-preview/README.txt web-preview/progress_server.py web-preview/study_resource_bundle.py data/study-resources.json app/src/main/assets/study-resources.json preview/study-resources.js docs/CURRENT_DELIVERY.json
          git diff --cached --quiet || git commit -m 'release: repair development data script and align all current study entrypoints [skip ci]'
          git push origin HEAD:main
      - name: Check whether the existing online Pages site is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/${{ github.repository }}/pages > pages-metadata.json 2> pages-check.txt; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Existing Pages site found; deploying the verified site.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Online Pages deployment is unavailable; repository and offline Release are delivered.'
            cat pages-check.txt
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.ready == 'true'
        with:
          path: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-study-delivery
          path: |
            deliverables/
            evidence/current-delivery/
            evidence/v012-web.json
            pages-check.txt
          retention-days: 14
  online:
    needs: deliver
    if: needs.deliver.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy the verified current entrypoint
        id: deploy
        uses: actions/deploy-pages@v4
