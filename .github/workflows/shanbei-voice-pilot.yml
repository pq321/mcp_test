name: Shanbei three-voice audio pilot
on:
  push:
    branches: [audio/shanbei-three-voices]
    paths:
      - .github/workflows/shanbei-voice-pilot.yml
      - scripts/generate_shanbei_three_voices.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech client
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Install MP3 decoder for audible verification
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate 3 voices x 3 real cards
        run: python -u scripts/generate_shanbei_three_voices.py --mode pilot --out private-voices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shanbei-voice-pilot
          path: private-voices/
          retention-days: 7
