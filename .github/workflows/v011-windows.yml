name: PoliticsMemory v0.11 Windows receiver delivery
on:
  workflow_run:
    workflows: ["PoliticsMemory v0.11 manual Drive and content update"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/progress_server.py
      - preview/app.js
      - qa/manual_drive_smoke.py
      - scripts/build_preview.py
      - .github/workflows/v011-windows.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: politics-v011-windows
  cancel-in-progress: true
jobs:
  manual_sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record checked source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the actual manual Sync button flow
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python qa/manual_drive_smoke.py
  windows:
    needs: manual_sync
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.manual_sync.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build standalone receiver with local Drive folder picker
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --clean --onefile --name PoliticsMemory-Sync desktop/progress_server.py
      - name: Real Windows executable health check
        timeout-minutes: 3
        shell: python
        run: |
          import os,subprocess,tempfile,time,json,urllib.request
          from pathlib import Path
          with tempfile.TemporaryDirectory() as d:
              root=Path(d);(root/'index.html').write_text('<h1>receiver check</h1>')
              cloud=root/'cloud';cloud.mkdir();(cloud/'progress.json').write_text('{"kind":"politics-memory-progress","schema_version":1,"reviews":[],"events":[],"wrong_changes":{},"cursor":{}}')
              proc=subprocess.Popen(['dist/PoliticsMemory-Sync.exe','--root',d,'--data-dir',str(root/'state'),'--drive-folder',str(cloud),'--port','18768','--no-browser'],
                    stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT,env=dict(os.environ,PYTHONIOENCODING='utf-8'))
              try:
                  for attempt in range(80):
                      try:
                          cfg=json.loads((root/'state/sync-config.json').read_text())
                          req=urllib.request.Request('http://127.0.0.1:18768/api/health',headers={'Authorization':'Bearer '+cfg['token']})
                          assert json.load(urllib.request.urlopen(req,timeout=2))['service']=='politics-memory-sync'
                          print('PASS: Windows executable uses selected cloud folder and authenticates',flush=True)
                          break
                      except (OSError,ValueError,KeyError):
                          if proc.poll() is not None:raise RuntimeError('Windows receiver exited early')
                          time.sleep(.25)
                  else:raise RuntimeError('Windows receiver failed to start')
              finally:
                  subprocess.run(['taskkill','/PID',str(proc.pid),'/T','/F'],stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
                  proc.wait(timeout=10)
      - uses: actions/upload-artifact@v4
        with:
          name: v011-windows-receiver
          path: dist/PoliticsMemory-Sync.exe
          retention-days: 14
  publish:
    needs: [manual_sync, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.manual_sync.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: v011-windows-receiver
          path: windows
      - name: Repackage full offline desktop bundle with executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s windows/PoliticsMemory-Sync.exe
          test -f web-preview/index.html
          python scripts/build_preview.py --pack data/suyi-full.json --audio-index web-preview/audio-index.json --audio-dir web-preview/audio --out desktop-site
          cp docs/DRIVE_MANUAL_V011.md desktop-site/README.md
          cp windows/PoliticsMemory-Sync.exe desktop-site/PoliticsMemory-Sync.exe
          mkdir -p deliverables
          cp windows/PoliticsMemory-Sync.exe deliverables/
          (cd desktop-site && zip -q -r ../deliverables/PoliticsMemory-v0.11.0-web.zip .)
          gh release download v0.11.0-manual-drive --pattern PoliticsMemory-v0.11.0.apk --dir deliverables
          (cd deliverables && sha256sum PoliticsMemory-v0.11.0.apk PoliticsMemory-Sync.exe PoliticsMemory-v0.11.0-web.zip > SHA256SUMS.txt)
          cp docs/V011_SYNC_RECEIPT_FIX.json deliverables/
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path('deliverables/V011_SYNC_RECEIPT_FIX.json')
          report=json.loads(p.read_text())
          report['published_source_commit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          report['delivery_run_id']=os.environ['GITHUB_RUN_ID']
          report['browser_manual_sync_ci']='PASS'
          report['windows_executable_health']='PASS'
          p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          notes=Path('docs/DRIVE_MANUAL_V011.md').read_text()
          notes+='\n## 2026-11-15 同步回执修复\n\n电脑同步回执已修复，真实同步按钮的上传、合并、资料更新与重复同步回归已通过。Android APK 不变；请下载本页更新后的网页 ZIP 或同步接收器。三份安装/运行资产的校验值已统一重算。\n\n修复源码：'+report['published_source_commit']+'。Google Drive 手机端实际上传仍待用户首次关联后验证。\n'
          Path('release-notes.md').write_text(notes,encoding='utf-8')
          PY
          gh release upload v0.11.0-manual-drive deliverables/PoliticsMemory-Sync.exe deliverables/PoliticsMemory-v0.11.0-web.zip deliverables/SHA256SUMS.txt deliverables/V011_SYNC_RECEIPT_FIX.json --clobber
          gh release edit v0.11.0-manual-drive --notes-file release-notes.md
          echo 'PASS: verified desktop sync correction published; existing Android APK retained'

