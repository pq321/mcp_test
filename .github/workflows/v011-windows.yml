name: PoliticsMemory v0.11 Windows receiver delivery
on:
  workflow_run:
    workflows: ["PoliticsMemory v0.11 manual Drive and content update"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build standalone receiver with local Drive folder picker
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --clean --onefile --name PoliticsMemory-Sync desktop/progress_server.py
      - name: Real Windows executable health check
        timeout-minutes: 3
        shell: python
        run: |
          import os,subprocess,tempfile,time,json,urllib.request
          from pathlib import Path
          with tempfile.TemporaryDirectory() as d:
              root=Path(d);(root/'index.html').write_text('<h1>receiver check</h1>')
              cloud=root/'cloud';cloud.mkdir();(cloud/'progress.json').write_text('{"kind":"politics-memory-progress","schema_version":1,"reviews":[],"events":[],"wrong_changes":{},"cursor":{}}')
              proc=subprocess.Popen(['dist/PoliticsMemory-Sync.exe','--root',d,'--data-dir',str(root/'state'),'--drive-folder',str(cloud),'--port','18768','--no-browser'],
                    stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT,env=dict(os.environ,PYTHONIOENCODING='utf-8'))
              try:
                  for attempt in range(80):
                      try:
                          cfg=json.loads((root/'state/sync-config.json').read_text())
                          req=urllib.request.Request('http://127.0.0.1:18768/api/health',headers={'Authorization':'Bearer '+cfg['token']})
                          assert json.load(urllib.request.urlopen(req,timeout=2))['service']=='politics-memory-sync'
                          print('PASS: Windows executable uses selected cloud folder and authenticates',flush=True)
                          break
                      except (OSError,ValueError,KeyError):
                          if proc.poll() is not None:raise RuntimeError('Windows receiver exited early')
                          time.sleep(.25)
                  else:raise RuntimeError('Windows receiver failed to start')
              finally:
                  subprocess.run(['taskkill','/PID',str(proc.pid),'/T','/F'],stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
                  proc.wait(timeout=10)
      - uses: actions/upload-artifact@v4
        with:
          name: v011-windows-receiver
          path: dist/PoliticsMemory-Sync.exe
          retention-days: 14
  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: v011-windows-receiver
          path: windows
      - name: Repackage full offline desktop bundle with executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s windows/PoliticsMemory-Sync.exe
          test -f web-preview/index.html
          cp windows/PoliticsMemory-Sync.exe web-preview/PoliticsMemory-Sync.exe
          (cd web-preview && zip -q -r ../PoliticsMemory-v0.11.0-web.zip .)
          sha256sum windows/PoliticsMemory-Sync.exe PoliticsMemory-v0.11.0-web.zip
          gh release view v0.11.0-manual-drive > /dev/null
          gh release upload v0.11.0-manual-drive windows/PoliticsMemory-Sync.exe PoliticsMemory-v0.11.0-web.zip --clobber
          echo 'PASS: Windows receiver and updated complete web archive on v0.11.0 release'
