name: Legacy sample-pack APK (manual only)
on:
  workflow_dispatch:
jobs:
  legacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Explain replacement workflow
        run: |
          echo 'The 93-card sample workflow is retired.'
          echo 'Use Build and deploy PoliticsMemory v0.8 to generate all 561 groups, audio, APK and GitHub Pages.'