name: Build offline Android APK
on:
  push:
    branches: [main, 'politics-memorizer']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate sample content
        run: python3 scripts/validate_pack.py app/src/main/assets/starter-sixiu-k.json
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: politics-memory-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
