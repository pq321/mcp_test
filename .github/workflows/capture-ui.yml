name: Capture Android app screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/suyi-full.json'
      - '.github/workflows/capture-ui.yml'
jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare full Su Yi content pack
        run: cp data/suyi-full.json app/src/main/assets/suyi-full.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch emulator and take real UI screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 420x900
            adb shell wm density 180
            adb shell am start -n org.vector.politicsmemory/.MainActivity
            sleep 12
            mkdir -p screenshots
            adb shell screencap -p /sdcard/catalogue.png
            adb pull /sdcard/catalogue.png screenshots/catalogue.png
            adb shell input tap 46 833
            sleep 2
            adb shell screencap -p /sdcard/review.png
            adb pull /sdcard/review.png screenshots/review.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-android-ui-screenshots
          path: screenshots/*.png
          if-no-files-found: warn